zige Maßstab jeder Handlung.","Geistige Freuden zählen mehr als körperliche: «besser ein unzufriedener Sokrates als ein zufriedener Narr».","Die Interessen aller leidensfähigen Wesen - auch Tiere - sind gleich zu berücksichtigen.","Moral gründet im Gefühl: «Die Vernunft ist nur der Sklave der Affekte.» (Hume)"]},{"label":"Was macht eine Handlung richtig?","values":["• Deontologisch (griech. to deon, das Gesollte): Richtig ist Handeln aus Pflicht nach einer verallgemeinerbaren Maxime. Die Folgen zählen nicht.\n• Nur der gute Wille ist ohne Einschränkung gut. Verstand, Mut oder Reichtum können auch einem Verbrecher dienen.\n• Pflichtgemäß oder aus Pflicht? Der Krämer gibt Kindern korrektes Wechselgeld, aber nur, weil Betrug ihn Kunden kosten würde. Moralischen Wert hat eine Handlung erst, wenn sie aus Pflicht geschieht.","• Konsequentialistisch (lat. consequentia, Folge): Richtig oder falsch macht eine Handlung allein ihre Folgen, nicht die Absicht.\n• Maßstab ist die Lustmenge: Die Natur hat den Menschen «unter die Herrschaft zweier souveräner Gebieter - Leid und Freude - gestellt». Körperliche und geistige Freuden sind gleichwertig.\n• Richtig ist eine Handlung, wenn ihre Folgen (Konsequenzprinzip) das Glück (hedonistisches Prinzip) aller Betroffenen (Universalitätsprinzip) am meisten vermehren (Utilitätsprinzip).","• Maßstab ist die Lustqualität: Es gibt höhere (geistige) und niedere (körperliche) Freuden.\n• Zufriedenheit ist nicht dasselbe wie Glück. Bloß sinnliche Befriedigung (Schweineglück) passt nicht zur Würde des Menschen.","• Maßstab sind nicht Lust und Leid, sondern Präferenzen: das, was ein Wesen will oder vermeiden will.\n• Richtig ist, was die Präferenzen aller Betroffenen am besten erfüllt.","• Richtig ist, was das Mitgefühl billigt. Sympathie heißt: Gefühle anderer nachempfinden, nicht jemanden mögen.\n• Moralische Urteile sind keine bloßen Tatsachenurteile.\n• Smith: Maßstab ist das Urteil des unparteiischen Zuschauers."]},{"label":"Wie prüft man eine Handlung?","values":["• Kategorischer Imperativ (unbedingtes Gebot): «Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde.» Eine Maxime ist eine persönliche Handlungsregel.\n• Vollkommene Pflichten wie das Lügenverbot: Ein Verstoß lässt sich nicht einmal widerspruchsfrei denken (falsches Versprechen). Unvollkommene Pflichten wie Hilfe: Ein Verstoß lässt sich nicht wollen.","• Hedonistisches Kalkül: Glück und Leid werden berechnet und verrechnet, nach Intensität, Dauer, Gewissheit, Nähe, Folgenträchtigkeit, Reinheit und Ausmaß (Zahl der Betroffenen).\n• «Jeder zählt für einen, keiner für mehr als einen.»","• Kompetente Richter: Höher ist die Freude, die alle bevorzugen, die beide Arten kennen.\n• Wer beide kennt, wählt die Lebensweise, an der seine höheren Fähigkeiten beteiligt sind: Verstand, Gefühl, Vorstellungskraft.","• Gleiche Interessenabwägung: Ähnliche Interessen zählen gleich, wer immer sie hat.\n• Die Grenze ist die Empfindungsfähigkeit, die Fähigkeit, Schmerz und Freude zu empfinden. Ein Stein hat keine Interessen, ein Hund schon.","• Hume: Wir billigen, was Wohlergehen fördert, und lehnen ab, was Leid verursacht.\n• Smith: Wie sähe meine Handlung für einen unbeteiligten Zuschauer aus? Er zeigt uns, dass wir «nur einer aus der Menge» sind."]},{"label":"Rolle von Vernunft und Gefühl","values":["• Die Vernunft ist Quelle des Moralgesetzes. Autonomie: Wir geben uns das moralische Gesetz selbst.\n• Neigung gibt keinen moralischen Wert. Kant verbietet aber nicht, gern zu helfen. Er fragt nur, was den moralischen Wert ausmacht.","• Die Vernunft rechnet die Folgen aus.\n• Freude und Leid sind der Maßstab.","Wie Bentham. Freuden werden zusätzlich nach ihrer Qualität gewichtet.","Wie Bentham. Maßstab sind die Präferenzen statt der Lust.","• Hume: Moral bewegt uns zum Handeln, die Vernunft allein kann das nicht. Also stammt Moral nicht aus der Vernunft.\n• Die Vernunft klärt über Tatsachen und Folgen auf, setzt aber keine Ziele. Das Gefühl urteilt und motiviert.\n• Smith: Der unparteiische Zuschauer beruht auf «reason, principle, conscience» (Vernunft, Grundsatz, Gewissen)."]},{"label":"Beispiel (harter Fall)","values":["• Mörder an der Tür (Constant): Kant verbietet sogar die Lüge, die ein Leben retten würde.\n• Fall Lars Koch (Schirach, Terror): Die Staatsanwältin argumentiert kantisch. Der Abschuss macht die 164 Passagiere zu bloßen Objekten. So urteilte auch das Bundesverfassungsgericht 2006 (Objektformel).","• Trolley und Arzt: Einer gegen fünf. Die Weiche umstellen finden die meisten richtig, einen Gesunden für fünf Patienten zu opfern monströs, obwohl die Bilanz gleich ist.\n• Fall Lars Koch: Der Verteidiger argumentiert utilitaristisch mit dem kleineren Übel, 164 gegen 70.000 Leben.","Sokrates oder Schwein: «besser ein unzufriedener Sokrates als ein zufriedener Narr». Doch wer bestimmt, wer beide Freuden wirklich kennt?","Hummer oder Eiche? Der Hummer kann leiden, seine Interessen zählen. Die Eiche hat keine. Tiere nur wegen ihrer Art geringer zu gewichten, ist Speziesismus (lat. species, Art). Für Singer ist das wie Rassismus.","• Smith: Ein Erdbeben mit Millionen Toten beschäftigt uns weniger als der Verlust des eigenen kleinen Fingers. Trotzdem würde niemand die Millionen für seinen Finger opfern.\n• Zwei Spendenaufrufe: Das Bild eines Kindes mit Namen bringt mehr Geld als eine Statistik über Millionen."]},{"label":"Konsequenzen","values":["• Zweckformel: Man muss den Menschen «jederzeit zugleich als Zweck, niemals bloß als Mittel» brauchen. Die Menschenwürde ist eine Grenze, auch für gute Zwecke.\n• Universelle Moral: Das Moralgesetz gilt unabhängig von Kultur, Zeit und persönlichen Interessen.","• Moral wird berechenbar: Handlungen lassen sich vergleichen. Das war Grundlage für politische Reformen.\n• Gegen Privilegien: Das Glück eines Adligen zählt nicht mehr als das eines Bauern.\n• Nicht Tradition oder Autorität entscheidet, sondern die nachvollziehbare Berechnung des Nutzens.","• Geistige Freuden (Kunst, Bildung, Freundschaft) haben Vorrang. Bildung wird zur moralischen Aufgabe.\n• **Schadensprinzip**: Individuelle Freiheit endet dort, wo sie anderen schadet.\n• Gerechtigkeit ist für Mill die wichtigste Form der Nützlichkeit.","• Erweiterung des moralischen Kreises: Massentierhaltung, Tierversuche und Ernährung werden moralisch problematisch.\n• Pflicht zur globalen Hilfe: Wer leicht und ohne großen eigenen Schaden helfen kann, muss helfen, auch über große Entfernung.\n• Effektiver Altruismus: dort helfen, wo es am meisten bewirkt, nicht wo es sich am nächsten anfühlt.","• Moralisches Handeln aus Mitgefühl: Gefühle wie Empathie, Empörung und Scham bewegen uns, nicht abstraktes Pflichtbewusstsein.\n• Kein starres Regelwerk: Moral achtet auf die Situation."]},{"label":"Was erklärt sie gut?","values":["• Schützt Würde und Rechte des Einzelnen, die keiner Bilanz geopfert werden dürfen.\n• Zeigt, was Autonomie heißt.","• Klarer, überprüfbarer Maßstab.\n• Unparteiisch: Es zählt, ob jemand leiden kann, nicht woher er kommt.\n• Politisch wirksam, etwa bei Reformen.","• Antwortet auf den Vorwurf, der Utilitarismus sei eine Lehre für Schweine: Nicht jede Lust ist gleich viel wert.","• Nimmt Leid auch von Tieren ernst, etwa im Tierschutz.","• Erklärt, warum Moral uns bewegt (Motivation).\n• Zeigt Moral als soziale Praxis, die wir im Zusammenleben lernen."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Rigorismus (lat. rigor, Strenge): keine Ausnahme, auch wenn ein Leben auf dem Spiel steht (Mörder an der Tür).\n• Gefühlsferne: Schiller spottete: «Gerne dien ich den Freunden, doch tu ich es leider mit Neigung.»\n• Formalismus: Das Ergebnis des Tests hängt davon ab, wie man die Maxime formuliert.","• **Stärkster Einwand:** Gerechtigkeitseinwand: Wenn nur die Bilanz zählt, kann es erlaubt sein, einen Unschuldigen zu verurteilen (Sündenbock) oder zu opfern. Rechte des Einzelnen lassen sich schwer begründen. Antwort: langfristige Folgen, Regelutilitarismus (Regeln statt Einzelhandlungen prüfen).\n• Sein-Sollen-Problem: Daraus, dass alle nach Freude streben, folgt nicht, dass Freude der Maßstab des Guten ist. Nach Hume braucht das eine eigene Begründung (Moore: naturalistischer Fehlschluss).\n• Prognoseproblem: Die Folgen einer Handlung sind oft ungewiss.\n• Messproblem (Höffe): Glück lässt sich kaum messen und verrechnen. Rein quantitativ zählt jede Lust gleich (Vorwurf: Lehre für Schweine).","• **Stärkster Einwand:** Gerechtigkeitseinwand wie bei Bentham (Sündenbock).\n• Elitär: Wer entscheidet, was höhere Freude ist? Gebildete erhalten eine Sonderrolle (Vorwurf der Bevormundung, Paternalismus).\n• Zwei Maßstäbe: Wenn neben der Menge auch die Qualität zählt, braucht Mill einen zweiten Maßstab neben dem Glück. Ist das noch Utilitarismus?","• **Stärkster Einwand:** Gerechtigkeitseinwand wie bei Bentham (Sündenbock).\n• Personenbegriff: Singers Begriff der Person (Selbstbewusstsein, Zukunftsplanung) schließt manche Menschen aus und manche Tiere ein. Das widerspricht unseren moralischen Überzeugungen.\n• Vergleichsproblem: Wessen Wunsch wiegt mehr? Präferenzen verschiedener Wesen lassen sich kaum abwägen.","• **Stärkster Einwand:** Parteilichkeit (Hösle): Gefühle gelten meist dem Nahen. Nur eine Vernunftethik kann für alle gelten. Smith antwortet mit dem unparteiischen Zuschauer.\n• Wechselhaft und manipulierbar: Mitgefühl schwankt und lässt sich durch Medien, Werbung oder Propaganda lenken.\n• Erklärt, begründet aber nicht: Die Gefühlsethik zeigt, warum Moral uns bewegt, aber nicht, welches Gefühl berechtigt ist."]},{"label":"Fazit","values":["Jede Begründung hat ihren harten Fall: der Sündenbock, der Mörder an der Tür, das ferne Leid. Ganz ohne Gefühl lässt sich Moral nicht verstehen, ganz ohne Vernunft nicht begründen. Alle drei setzen voraus, dass wir anders hätten handeln können (Vergleich Freiheit)."],"span":true}]},"verantwortung":{"sem":"Ethik","name":"Verantwortung: Nahethik oder Fernethik?","leitfrage":"Reicht eine Ethik der Nähe für eine Technik mit globalen und fernen Folgen?","conn":["utilitarismus","freiheit","technologie"],"positions":["Nahethik","Fernethik"],"rows":[{"label":"Hauptvertreter","values":["**Immanuel Kant** (1724-1804)","**Hans Jonas** (1903-1993)"]},{"label":"Hauptwerk","values":["**Grundlegung zur Metaphysik der Sitten** (1785)","**Das Prinzip Verantwortung** (1979)"]},{"label":"Merksatz","values":["Prüfe, ob du deine Maxime ohne Widerspruch als allgemeines Gesetz wollen kannst.","Technik wirkt weit in die Zukunft, also muss Verantwortung auch künftige Generationen umfassen."]},{"label":"Welches Handeln hat sie im Blick?","values":["• Handelnde und Betroffene teilen eine gemeinsame Gegenwart, am selben Ort und zur selben Zeit. Die Folgen sind überschaubar.\n• Jonas nennt das **Nahethik**. Beispiele: «Liebe deinen Nächsten», Kants Zweckformel.","• Moderne Technik wirkt kollektiv, global, kumulativ (sich aufsummierend) und unumkehrbar. Kein einzelner Flug verändert das Klima, alle zusammen schon.\n• Der Rahmen früherer Ethik kann solche Handlungen nicht mehr fassen.\n→ Daraus folgt eine **Fernethik**, die auch künftige Generationen einbezieht."]},{"label":"Imperativ (Wortlaut)","values":["«Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde.»","Ökologischer Imperativ: «Handle so, dass die Wirkungen deiner Handlung verträglich sind mit der Permanenz echten menschlichen Lebens auf Erden.»"]},{"label":"Adressat","values":["Der einzelne Mensch, der vor einer Handlung seine Maxime prüft.","Vor allem die Politik: Gesetze und Institutionen, die über Technik entscheiden."]},{"label":"Prüfung","values":["Gedachte Verallgemeinerung: Lässt sich die Maxime ohne Widerspruch als allgemeines Gesetz denken und wollen?","Reale Wirkungen: Sind die Folgen mit dem Fortbestand echten menschlichen Lebens verträglich? Kants Test reicht dafür nicht. Denn es ist kein Selbstwiderspruch, sich vorzustellen, dass die Menschheit aufhört zu existieren."]},{"label":"Zeithorizont","values":["Der Augenblick der Handlung und die Menschen, die davon jetzt betroffen sind.","Die Zukunft: Verantwortung auch für Menschen, die noch nicht leben."]},{"label":"Umgang mit ungewissen Folgen","values":["• Die Folgen bestimmen nicht den moralischen Wert. Der gute Wille glänzt wie ein Juwel, auch wenn er nichts erreicht.\n• Pflichten gelten ohne Ausnahme, unabhängig vom Erfolg.","• **Wissen wird zur Pflicht**: Das vorhersagende Wissen bleibt hinter der Macht des Tuns zurück. Die Anerkennung der Unwissenheit wird Teil der Ethik.\n• **Heuristik der Furcht**: Wo die Folgen ungewiss sind, dient die vorgestellte Gefahr als Kompass. «Wir wissen erst, was auf dem Spiele steht, wenn wir wissen, dass es auf dem Spiele steht.»\n→ Die schlechte Prognose hat Vorrang vor der guten."]},{"label":"Konsequenzen","values":["• Menschenwürde als Grenze: Vernunftwesen haben Würde, keinen Preis. Niemand darf bloß als Mittel benutzt werden (Zweckformel).","• **Vorsorgeprinzip**: Wenn eine Handlung vielleicht nicht wiedergutzumachende Schäden verursacht, ist Vorsicht geboten, auch ohne Gewissheit.\n• Beispiel: 2023 forderten über tausend Forschende in einem offenen Brief eine Pause für das Training großer KI-Systeme, weil die Risiken nicht absehbar seien."]},{"label":"Was erklärt sie gut?","values":["• Schützt Würde und Rechte des Einzelnen.\n• Zeigt, was Autonomie heißt: Wir geben uns das moralische Gesetz selbst.","• Erweitert die Ethik auf künftige Generationen.\n• Anschlussfähig an Klima, Gentechnik und KI."]},{"label":"Kritikpunkte","values":["• **Nahethik** (Jonas): Der Test fragt nicht nach fernen, kollektiven und kumulativen Folgen.\n• Rigorismus: Kant lässt keine Ausnahme zu, auch wenn ein Leben auf dem Spiel steht (Constant).\n• Formalismus: Das Ergebnis hängt davon ab, wie man die Maxime formuliert.","• **Prognosen irren**: Die Heuristik der Furcht kann sich auf falsche Szenarien stützen.\n• Bremse für Fortschritt: Bewahrung kann notwendigen Wandel blockieren.\n• Überforderung und Begründung: Der Einzelne ist überfordert. Warum es Menschen überhaupt geben soll, begründet Jonas nur metaphysisch, also nicht durch Erfahrung prüfbar."]},{"label":"Fazit","values":["Wer frei ist, ist verantwortlich. Jonas zeigt, dass diese Verantwortung mit der Macht der Technik wächst und bis in die Zukunft reicht."],"span":true}]},"freiheit":{"sem":"Ethik","name":"Freiheit: Determinismus - Libertarismus - Kompatibilismus","leitfrage":"Können wir frei und verantwortlich sein, wenn unser Wollen Ursachen hat?","conn":["rationalismus","verantwortung","essentialismus"],"positions":["Harter Determinismus","Libertarismus","Kompatibilismus"],"rows":[{"label":"Hauptvertreter","values":["**Pierre-Simon Laplace** (1749-1827), **Gerhard Roth**; dargestellt bei **Thomas Nagel** (*1937)","**Geert Keil** (*1963)","**David Hume** (1711-1776), **Peter Bieri** (1944-2023), **Harry G. Frankfurt** (1929-2023)"]},{"label":"Hauptwerk","values":["Laplace: **Philosophischer Versuch über die Wahrscheinlichkeit** (1814); Nagel: **Was bedeutet das alles?** (1987)","**Willensfreiheit und Determinismus** (2009)","Hume: **Eine Untersuchung in Betreff des menschlichen Verstandes** (1748); Frankfurt: **Alternate Possibilities and Moral Responsibility** (1969)"]},{"label":"Merksatz","values":["Alles ist kausal bestimmt, auch deine nächste Entscheidung; freier Wille ist eine Illusion.","Unter gleichen Bedingungen hätte der Mensch anders handeln können; er ist Urheber seiner Entscheidungen.","Freiheit heißt Handeln aus eigenen Gründen ohne Zwang; das ist mit Determinismus vereinbar."]},{"label":"Ist der Determinismus wahr?","values":["Ja.","Nein: Nicht alles ist kausal festgelegt (Indeterminismus).","Er kann wahr sein. Für die Freiheit ist das gleichgültig."]},{"label":"Was heißt Freiheit?","values":["• Freiheit hieße Unverursachtheit. Die gibt es nicht.\n• Der harte Determinismus bestreitet nicht die Handlungsfreiheit (tun können, was man will), sondern die Willensfreiheit (anders wollen können).","• Unter gleichen Bedingungen anders handeln können (Prinzip alternativer Möglichkeiten).\n• Libertarismus: Der Wille ist frei, weil nicht alles festgelegt ist. Nicht zu verwechseln mit dem politischen Libertarismus (Grenzen staatlicher Macht).","• Ohne Zwang tun, was man will. Das Gegenteil von Freiheit ist Zwang, nicht Ursache. Unfrei ist, wer «ein Gefangener und in Ketten» ist (Hume).\n• Frankfurt: Der Wille ist frei, wenn ich will, was ich wollen will (Wünsche zweiter Ordnung, also Wünsche über eigene Wünsche).\n• Bieri: Der Wille ist frei, wenn er aus meiner eigenen Überlegung kommt."]},{"label":"Ist Verantwortung möglich?","values":["• Nein: Verantwortung, Lob und Tadel verlieren ihren Sinn (Nagel).\n• Strafe dient nur noch der Steuerung (Prävention: Abschreckung, Schutz der Gesellschaft), so Roth.\n• Fatalismus: Das Gefühl, die Zukunft sei festgelegt, kann zu Resignation führen.","• Ja: Entscheidungen sind nicht festgelegt, Lob und Tadel bleiben sinnvoll.","• Ja, Schuld im eigentlichen Sinn: Wer ohne Zwang aus eigener Überlegung handelt, verdient Lob und Tadel wirklich.\n• Ob Verantwortung Anderskönnen verlangt, ist umstritten (Frankfurt-Fälle).\n• Strafe als Prävention ist keine kompatibilistische These. Sie passt zu jeder Position."]},{"label":"Grundannahmen","values":["• Determinismus (lat. determinare, festlegen): Alles, was geschieht, ist durch vorhergehende Ursachen nach Naturgesetzen festgelegt. Auch unser Wollen hat Ursachen: Erfahrungen, Erbanlagen, Gehirn.\n• Laplace'scher Dämon: Ein Wesen, das alle Naturgesetze und den Zustand der Welt kennt, könnte jedes künftige Ereignis berechnen.\n→ Es gibt keine echten Alternativen: Was geschieht, musste so geschehen.","• Naturgesetze sind Restriktionen (Keil): Sie schließen einige Möglichkeiten aus, lassen aber viele andere offen.\n• Indeterminismus ist die Voraussetzung des Libertarismus, aber noch keine Freiheitstheorie.","• Kompatibilismus (lat. compatibilis, vereinbar): Determinismus und freier Wille können zugleich wahr sein.\n• Harter Determinismus und Libertarismus teilen eine Voraussetzung: Frei wäre nur ein unverursachter Wille. Genau das bestreitet der Kompatibilismus."]},{"label":"Argumente","values":["• Kausalität: Alles hat eine Ursache, also auch unsere Handlungen. Darauf beruhen alle naturwissenschaftlichen Erklärungen.\n• Hirnforschung (Libet 1983): Das Bereitschaftspotenzial, eine messbare Hirnaktivität, beginnt vor dem bewussten Entschluss.\n• Roth: Gene, frühe Einflüsse und Erfahrungen legen jede Entscheidung fest. Wir sind «umfassend determiniert».","• Erfahrung der Wahl: Wir erleben uns als Wesen, die wählen und entscheiden.\n• Quantenphysik: Auf kleinster Ebene gibt es unvorhersehbare, zufällige Ereignisse. Die Natur ist also nicht vollständig festgelegt.\n• Kreativität: Neues Denken setzt Entscheidungen voraus, die nicht vollständig festgelegt sind.","• Hume: Wer zu Hause bleibt, weil die Tür abgeschlossen ist, ist unfrei. Wer bleibt, weil er keine Lust auf die Party hat, ist frei, obwohl auch seine Unlust Ursachen hat.\n• Frankfurt: Der Raucher, der aufhören will und doch raucht, tut, was er will. Aber sein Wille ist nicht frei.\n• Kategorienfehler (Bieri): Freiheit im Gehirn zu suchen ist, als zerlegte man ein Gemälde, um herauszufinden, was es darstellt.\n• Frankfurt-Fall: Jones handelt aus eigenen Gründen. Hätte er gezögert, hätte ihn Black über ein Gerät im Gehirn gezwungen. Jones konnte nicht anders und scheint doch verantwortlich."]},{"label":"Was erklärt er gut?","values":["• Nimmt die Naturwissenschaft ernst.\n• Erklärt, warum Herkunft und Gehirn unser Handeln prägen.\n• Mahnt zur Vorsicht beim Strafen.","-","• Entspricht der Alltagspraxis und dem Recht.\n• Macht Freiheit unabhängig von ungeklärten Fragen der Physik.\n• Erklärt Sucht und Zwang als Unfreiheit."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Schluss vom Labor aufs Leben: Libet hat Fingerbewegungen gemessen, keine Lebensentscheidungen. Die Zeitangabe ist ein Selbstbericht. Ein Veto bleibt möglich (Haynes 2016).\n• Widerspricht dem Erleben: Wir haben das starke Gefühl, wirklich wählen zu können.\n• Selbstwiderspruch: Wenn alles determiniert ist, dann auch die Überzeugung, der Determinismus sei wahr. Kann sie dann als vernünftige Einsicht gelten?","• **Stärkster Einwand:** Zufall ist nicht Freiheit: Eine zufällige Entscheidung wäre nicht meine. Sie ist nicht freier als eine determinierte.\n• Wie soll ein Mensch in die Kette der Naturursachen eingreifen, ohne selbst Ursachen zu haben?\n• Aberwitziger Wille (Bieri): Ein Wille, der von nichts abhinge, auch nicht von Charakter und Gedanken, wäre kein Ideal. Es gäbe dann gar kein Entscheiden.","• **Stärkster Einwand:** Konsequenzargument (van Inwagen): Naturgesetze und Vergangenheit stehen nicht in unserer Macht, also auch nicht ihre Folgen, unsere Handlungen eingeschlossen.\n→ Antwort (Lewis): In unserer Macht heißt nicht, Naturgesetze brechen zu können.\n• Kant: Das ist die «Freiheit eines Bratenwenders», eine «kleine Wortklauberei». Moral braucht Autonomie. Kompatibilisten antworten: Ein Bratenwender hat keine Wünsche zweiter Ordnung.\n• Umdefinition: Kritiker sehen im Kompatibilismus nur eine neue Definition von Freiheit. Ob wir wirklich Alternativen haben, bleibt offen."]},{"label":"Fazit","values":["Ein Wille ohne jede Ursache wäre kein Ideal, sondern Zufall. Die überzeugendsten Antworten verstehen Freiheit als Selbstbestimmung: Ich handle frei, wenn mein Handeln aus meinem eigenen, überlegten Wollen kommt. Ob das genügt, bleibt mit Kant umstritten."],"span":true}]},"relativismus":{"sem":"Ethik","name":"Relativismus vs. Universalismus","leitfrage":"Gibt es universelle moralische Werte - oder ist Moral immer kulturell bedingt?","conn":["moralkritik","menschenrechte"],"positions":["Moralischer Relativismus","Universalismus"],"rows":[{"label":"Hauptvertreter","values":["**Herodot** (ca. 484-425 v. Chr.), **Paul Feyerabend** (1924-1994)","**Annemarie Pieper** (1941-2024), **Martha Nussbaum** (*1947)"]},{"label":"Hauptwerk","values":["Herodot: **Historien** (III 38); Feyerabend: **Erkenntnis für freie Menschen** (1980)","Pieper: **Einführung in die Ethik** (1985); Nussbaum: **Gerechtigkeit oder Das gute Leben** (1999)"]},{"label":"Merksatz","values":["Kulturen urteilen moralisch verschieden; der normative Relativist folgert daraus: Keine Moral gilt für alle.","Manche moralischen Normen gelten für alle Menschen, unabhängig von Kultur und Tradition."]},{"label":"Grundannahmen","values":["• Deskriptiver (beschreibender) Relativismus: Kulturen halten tatsächlich Verschiedenes für richtig. Beispiel: Darius fragt Griechen und Kallatier nach ihren Totenbräuchen, beide sind entsetzt (Herodot).\n• Normativer (wertender) Relativismus: Deshalb ist keine Moral richtiger als eine andere.\n• Achtung: Vom ersten zum zweiten führt kein gültiger Schluss, denn aus dem Sein folgt kein Sollen.","• Pieper (formal): Relativ sind nur die materialen Normen, also die konkreten Regeln einer Gruppe. Der Anspruch auf Moralität (Prinzipienebene) gilt für alle.\n• Nussbaum (inhaltlich): Jede Gesellschaft soll allen Menschen Grundfähigkeiten sichern, etwa Gesundheit, Bildung und praktische Vernunft."]},{"label":"Gibt es einen neutralen Maßstab?","values":["• Nein: Es gibt keinen Maßstab außerhalb aller Traditionen. Die Vernunft ist «selbst eine Tradition» (Feyerabend).\n• Moral ist historisch gewachsen. Bewerten kann man sie nur von innen, aus der Sicht der jeweiligen Gemeinschaft.","• Ja: Über Praktiken muss man auf einer neutralen Ebene vernünftig miteinander reden können (Pieper). Wer jedes Gespräch verweigert, macht seine Position dogmatisch absolut.\n• Es entscheiden nicht die Werte einer Kultur, sondern Gründe, die jeder prüfen kann.\n• Querbezug Kant: Jeder Mensch hat Würde kraft seiner Vernunft."]},{"label":"Darf man fremde Praktiken kritisieren? (Beispiel Kinderehe)","values":["• Nein: Traditionen dürfen nicht von außen als gut oder schlecht beurteilt werden. Man muss erst verstehen, wie sie von innen aussehen.\n• Kinderehe: Verständnis entwickeln, nicht urteilen.","• Ja: **Kritische Intoleranz** (Pieper). Bei Rechtsverletzungen darf man sich einmischen, nicht weil die eigene Moral besser ist, sondern mit Gründen. Piepers Beispiel: die Fatwa gegen Salman Rushdie (1989).\n• Kinderehe mit Nussbaum: Sie verletzt Grundfähigkeiten wie Gesundheit, Bildung, praktische Vernunft und ein eigenes Leben. Sie darf nicht toleriert werden."]},{"label":"Toleranzverständnis","values":["Weitgehende Toleranz, auch bei umstrittenen Praktiken. Aber: Toleranz für alle zu fordern, ist selbst ein universaler Wert.","Toleranz heißt dulden, was man ablehnt; sie ist keine Gleichgültigkeit. Sie endet, wo Menschenrechte verletzt werden."]},{"label":"Was erklärt er gut?","values":["• Nimmt die Vielfalt der Kulturen ernst.\n• Warnt vor Ethnozentrismus: die eigene Kultur zum Maßstab für alle machen, als läge das eigene Dorf «am Nabel der Welt» (Feyerabend).\n• Verlangt, fremde Traditionen erst zu verstehen.","• Begründet Menschenrechte und Kritik an Unrecht über Grenzen hinweg.\n• Pieper setzt auf Gründe statt Gewalt.\n• Nussbaum lässt Spielraum: Fähigkeiten statt vorgeschriebener Handlungen. Wer fasten will, darf fasten, verhungern soll niemand müssen."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Selbstwiderspruch (Spaemann): Die These «Jeder sollte der in seiner Gesellschaft herrschenden Moral folgen» stellt selbst eine allgemeingültige Norm auf.\n• Oft gibt es gar nicht die eine herrschende Moral. Und Reformer, die die Moral ihrer Zeit verändert haben, gelten als Vorbilder (Spaemann).\n• Kritik an Unterdrückung (Sklaverei, Völkermord) wird unmöglich.","• **Stärkster Einwand:** Ethnozentrismus (Feyerabend): Westliche Werte werden als allgemein ausgegeben.\n• Definitionsmacht: Wer bestimmt, was universell ist, wer stellt die Liste auf? Historisch oft die Mächtigsten."]},{"label":"Fazit","values":["Der deskriptive Relativismus beschreibt die Vielfalt richtig, der normative widerspricht sich. Auf Gründe, die jeder prüfen kann, können wir nicht verzichten, ohne auch die Kritik an Unrecht aufzugeben."],"span":true}]},"moralkritik":{"sem":"Ethik","name":"Moralkritik: Nietzsche - Marx - Foucault","leitfrage":"Ist Moral ein Instrument der Herrschaft - oder gibt es moralische Prinzipien jenseits von Machtverhältnissen?","conn":["relativismus","sozgerechtigkeit","machttheorie"],"positions":["Genealogie der Moral","Ideologiekritik","Disziplin und Normalisierung"],"rows":[{"label":"Hauptvertreter","values":["**Friedrich Nietzsche** (1844-1900)","**Karl Marx** (1818-1883)","**Michel Foucault** (1926-1984)"]},{"label":"Hauptwerk","values":["**Zur Genealogie der Moral** (1887)","**Manifest der Kommunistischen Partei** (1848, mit Engels)","**Überwachen und Strafen** (1975)"]},{"label":"Merksatz","values":["Die Moral von gut und böse entstand aus dem Groll der Schwachen gegen die Starken.","Moral ist Ideologie - sie stellt die Interessen der herrschenden Klasse als allgemeingültig dar.","Moderne Macht wirkt durch Disziplin: Die Norm erscheint als Moral, als das, was man tut."]},{"label":"Welche Frage stellt sie an die Moral?","values":["Woher kommen gut und böse?","Wem nützt die Moral?","Wie wirkt Moral als Norm?"]},{"label":"Woraus entsteht Moral?","values":["• Aus dem Ressentiment der Schwachen: Die überlieferte Moral ist eine **Sklavenmoral**. Sie unterdrückt das Leben und macht außergewöhnliche Menschen klein.\n• Methode: Genealogie (griech. genea, Abstammung). Wer die Herkunft der Werte kennt, kann ihren Wert prüfen.","• Aus den Interessen der herrschenden Klasse: «Die herrschenden Ideen einer Zeit waren stets nur die Ideen der herrschenden Klasse.»\n• Basis und Überbau: Die Wirtschaft (Basis) bestimmt Recht, Moral und Religion (Überbau).\n• Moral sichert ungerechte Besitzverhältnisse und Klassengegensätze ab und rechtfertigt sie.","• Aus Normen, die Institutionen erzeugen: Menschen werden beobachtet, geprüft, verglichen und an einer Norm gemessen, in Gefängnis, Klinik und Schule.\n• Moderne Macht wirkt weniger durch Verbote als durch Disziplin.\n• Normen sind historisch gewachsen, erscheinen aber als natürlich oder vernünftig."]},{"label":"Kernbegriffe","values":["• **Herrenmoral**: beginnt mit einem Ja zu sich. Gut heißt edel und stark, schlecht ist nur ein blasses Gegenbild.\n• **Sklavenmoral**: beginnt mit einem Nein zum Anderen. Der Mächtige wird zum Bösen, man selbst zum Guten.\n• **Ressentiment**: der Groll derer, die sich nicht wehren können. Bild: Die Lämmer nennen die Raubvögel böse.\n• **Umwertung aller Werte**: Schon die Sklavenmoral wertet um. Nietzsche fordert eine erneute Umwertung.","• **Ideologie**: Eigene Interessen werden als «ewige Natur- und Vernunftgesetze» ausgegeben.\n• **Klassenmoral** (Engels): Jede bisherige Moral war die Moral einer Klasse.\n• **Klassenkampf**: Antrieb der Geschichte, zwischen Bürgertum (Bourgeoisie) und Arbeiterklasse (Proletariat).","• **Panoptikum** (nach Bentham): Wer jederzeit gesehen werden kann, aber nicht weiß, ob jemand zuschaut, verhält sich von selbst so, wie die Institution es will.\n• **Disziplin und Norm**: Macht wird verinnerlicht. Die Menschen fühlen sich dabei sogar frei.\n• **Macht und Wissen**: Beide hängen zusammen. Wissen rechtfertigt Machtstrukturen."]},{"label":"Mit welchem Maßstab kritisiert sie?","values":["• Er misst den Wert der Werte am Gedeihen des Lebens.\n→ Damit stellt er eine Rangordnung auf und ist kein gewöhnlicher Relativist.","• Ausbeutung ist Unrecht. Gemeinsam ist allen bisherigen Epochen nur die Ausbeutung.\n→ Das ist selbst ein moralisches Urteil.","• Er will Grausamkeit vermindern.\n→ Einen klaren Maßstab dafür begründet er nicht."]},{"label":"Was soll an die Stelle der alten Moral treten?","values":["• Erneute Umwertung: neue, lebensbejahende Werte. Abschied von Schuld, Askese und Mitleid, Selbstbestimmung statt Gehorsam.\n• Leitbild ist der Übermensch: kein biologisches Ideal, sondern ein Mensch, der eigene Werte schafft (mehr in der Anthropologie).","• Eine klassenlose Gesellschaft durch Revolution.\n• Eine eigene Moraltheorie hat Marx nicht geschrieben.","• Offen: Foucault kritisiert Macht, nennt aber keinen klaren Maßstab für Alternativen (normative Leerstelle)."]},{"label":"Was erklärt sie gut?","values":["• Macht sichtbar, wo hinter Moral Groll steckt: Schwäche wird zum Verdienst «umgelogen». Die Ohnmacht, die nicht vergilt, heißt Güte, die Unterwerfung Gehorsam.","• Macht sichtbar, wo sich Interessen als «ewige Natur- und Vernunftgesetze» ausgeben.","• Schärft den Blick für Normen im eigenen Alltag, etwa das Panoptikum in der Schule.\n• Zeigt den Preis einer Macht, die humaner wirkt als Schläge: Die Menschen funktionieren freiwillig im Sinne der Institutionen."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Genetischer Fehlschluss: Aus der Herkunft einer Überzeugung folgt nichts über ihre Geltung. Nietzsche trennt beide Fragen allerdings selbst und misst Werte am Gedeihen des Lebens.\n• Missbrauch: Seine Schwester, eine Antisemitin, gab den Nachlass verfälscht heraus, die Nationalsozialisten beriefen sich auf ihn. Nietzsche selbst lehnte den Antisemitismus scharf ab.\n• Elitär: Für Menschen, die nicht stark sein können, ist kein Platz. Verletzlichkeit zählt nicht.\n• Die Alternative (Übermensch, neue Werte) bleibt vage.","• **Stärkster Einwand:** Kritik braucht selbst einen Maßstab: Wer Ausbeutung anklagt, urteilt moralisch.\n• Moral war oft auch eine Waffe der Schwachen, etwa bei der Abschaffung der Sklaverei.\n• Reduktionismus: Nicht alle moralischen Fragen lassen sich auf Klasse und Wirtschaft zurückführen.\n• Kommunistische Regime führten oft zu Diktaturen und neuer Herrschaft.","• **Stärkster Einwand:** Machtbegriff zu weit (Ladwig): Wenn alles Macht ist, kann Foucault nicht sagen, ob die Abschaffung der Folter eine echte Verbesserung war.\n→ Wäre jede Moral nur ein Instrument der Macht, verlöre auch die Kritik ihren Grund."]},{"label":"Fazit","values":["Die Moralkritik ist ein Werkzeug, um falsche Ansprüche zu entlarven, kein Beweis gegen jede Moral. Sie widerlegt nicht, dass es gute Gründe gibt, und braucht selbst einen Maßstab."],"span":true},{"label":"Ausblick","values":["Judith Butler (*1956) knüpft an Foucault an: Auch Geschlechterrollen sind Normen, die wir wiederholen. Mehr dazu in der Anthropologie (S7), Vergleich Essentialismus - Existenzialismus - Konstruktivismus.\nAm Ende des Semesters steht **Rudolf Burger** (1938-2021): Entweder wirkt Moral, dann wird sie als Gebot überflüssig, oder sie wirkt nicht, dann ist sie Heuchelei. Einwand: ein falsches Dilemma, denn gerade die Kritik der Heuchelei braucht Gründe."],"span":true}]},"platon":{"sem":"Politische Philosophie","name":"Antike Staatstheorien: Platon und Aristoteles","leitfrage":"Was ist der Zweck des Staates - und wer soll regieren?","conn":["vertragstheorie","machttheorie","demokratie"],"positions":["Herrschaft der Weisesten","Teilhabe vieler Bürger"],"rows":[{"label":"Hauptvertreter","values":["**Platon** (428/427-348/347 v. Chr.)","**Aristoteles** (384-322 v. Chr.)"]},{"label":"Hauptwerk","values":["**Politeia** (um 375 v. Chr.)","**Politik** (ca. 334 v. Chr.)"]},{"label":"Merksatz","values":["Nur wer das Gute kennt, kann gerecht regieren - Philosophen an die Macht.","Der Mensch ist ein Gemeinschaftswesen - der Staat macht tugendhaftes Leben erst möglich."]},{"label":"Grundannahmen","values":["• Arbeitsteilung: Menschen sind verschieden begabt und voneinander abhängig. Darum ist eine Ordnung der Stände natürlich.\n• Die Seele hat drei Teile: Vernunft, Mut und Begierde. Der Staat ist die Seele im Großen: Herrscher, Wächter, Nährstand (Bauern, Handwerker).","• Zoon politikon: Der Mensch ist von Natur aus ein Gemeinschaftswesen. Das zeigt die Sprache (logos): Mit ihr beraten Menschen über gerecht und ungerecht.\n• Die Polis (Stadtstaat) wächst natürlich aus Haus und Dorf. Sie dient nicht nur dem Leben, sondern dem guten Leben (Eudaimonia, Glückseligkeit)."]},{"label":"Methode","values":["Entwirft einen Idealstaat.","Untersucht reale Verfassungen griechischer Stadtstaaten (z. B. Athen, Sparta)."]},{"label":"Wer soll herrschen?","values":["• Wenige: die Philosophenkönige. Der Stand hängt an der Veranlagung, nicht an Geburt oder Besitz.\n• Die Herrscher sind an kein Gesetz gebunden. Ihre Herrschaft beruht auf Wissen, nicht auf Zustimmung.\n• Herrscher und Wächter haben kein Eigentum und keine Familie, damit sie nicht eigennützig handeln.","• Sechs Staatsformen: Einer, wenige oder viele herrschen, entweder zum Gemeinwohl (Monarchie, Aristokratie, Politie) oder zum Eigennutz (Tyrannis, Oligarchie, Demokratie).\n• Viele: Am besten wäre die Herrschaft der Tugendhaftesten. Unter realen Bedingungen ist die Politie die beste erreichbare Verfassung: eine Mischung aus Demokratie und Oligarchie.\n• Bürger ist, wer an Rechtsprechung und Ämtern teilhat."]},{"label":"Woher kommt politische Urteilskraft?","values":["• Aus der Einsicht in die Idee des Guten. Nur wer sie erkennt, weiß, was für alle das Beste ist. Dazu sind nur wenige veranlagt.\n• Die Herrscher lernen jahrzehntelang: bis 30 Mathematik und Astronomie, bis 35 Dialektik (philosophisches Denken), bis 50 Praxis im Staat. Erst dann herrschen sie.","• Aus Tugend durch Gewöhnung: Man wird gerecht, indem man gerecht handelt. Charakter entsteht durch Wiederholung.\n• Gesetze sind eine Schule der Tugend: Sie gewöhnen die Bürger an gutes Handeln.\n• Urteilskraft wächst in der Praxis, im gemeinsamen Handeln in der Polis."]},{"label":"Können die Vielen urteilen?","values":["• Nein. Schiffsgleichnis: Die Schiffseigner (das Volk) streiten über den Kurs, aber nur der Steuermann versteht die Navigation.\n• Demokratie führt zur Herrschaft der Unwissenden und öffnet Demagogen die Tür. Zu viel Freiheit schlägt in Tyrannis um.","• Ja, gemeinsam. Mahl-Argument: Viele urteilen zusammen oft besser als wenige Hervorragende, so wie ein Mahl, zu dem viele beitragen.\n• Die Bürger herrschen abwechselnd und werden beherrscht. Es gibt keinen festen Herrscherstand."]},{"label":"Was macht den Staat gerecht?","values":["• Jeder «tut das Seine» und mischt sich nicht in fremde Aufgaben ein. So wie in der gerechten Seele die Vernunft führt.\n• Der Staat dient dem Wohl des Ganzen, nicht dem Vorteil eines Standes.","• Herrschaft zum Gemeinwohl, nicht zum Eigennutz der Herrschenden.\n• Ausgleich zwischen Arm und Reich: Die Politie soll extreme Armut und extremen Reichtum vermeiden."]},{"label":"Was macht den Staat stabil?","values":["• Erziehung und Ständeordnung. Erziehung formt den Charakter, nicht nur das Wissen.\n• Metallmythos: Eine «edle Lüge» (Gold, Silber, Eisen) soll dafür sorgen, dass alle die Ordnung annehmen.","• Ein starker Mittelstand: Er folgt eher der Vernunft als Reiche (Übermut) und Arme (Heimtücke) und ist frei von Neid und Verachtung.\n• «Wo der Mittelstand zahlreich ist, da entstehen am wenigsten Aufstände und Zwiste unter den Bürgern.»"]},{"label":"Was erklärt er gut?","values":["• Politik soll dem Gemeinwohl dienen, nicht Einzelinteressen.\n• Ethik und Politik gehören zusammen: Herrscher müssen tugendhaft sein.\n• Ämter nach Fähigkeit, nicht nach Geburt; auch Frauen können Wächterinnen werden.","• Menschen entfalten ihre Fähigkeiten und Tugenden nur in Gemeinschaft.\n• Politik soll das gute Leben aller ermöglichen, nicht nur Macht oder Wirtschaft organisieren."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Elitär, keine Kontrolle der Herrscher. Popper: Wer beansprucht, das Gute zu kennen, entzieht seine Herrschaft der Kritik.\n• Keine Gewaltenteilung: Machtmissbrauch ist kaum zu verhindern. Und wer bestimmt, wer die Besten sind (Russell)?\n• Starke Eingriffe ins Private: Zensur der Dichtung (z. B. Homer), Lenkung der Fortpflanzung.","• **Stärkster Einwand:** Viele sind von der Teilhabe ausgeschlossen: Frauen, Sklaven, Fremde. Im besten Staat sollen auch Bauern und Handwerker kein Bürgerrecht haben.\n• Hierarchisches Menschenbild: Sklaverei gilt ihm als natürlich.\n• Demokratie versteht er nur als Herrschaft der Armen gegen die Reichen."]},{"label":"Fazit","values":["Der Kern des Streits: Woher kommt politische Urteilskraft? Aus der Erkenntnis weniger (Platon) oder aus der eingeübten Tugend vieler (Aristoteles)? Gemeinsam ist beiden: Der Staat ist eine natürliche Gemeinschaft und dient dem guten Leben, nicht nur dem Überleben. Die Vertragstheorien der Neuzeit sehen ihn als von Menschen gemacht."],"span":true}]},"vertragstheorie":{"sem":"Politische Philosophie","name":"Vertragstheorie","leitfrage":"Worauf gründet die Legitimität des Staates - und was darf das Volk verlangen?","conn":["platon","machttheorie","sozgerechtigkeit","naturrecht"],"positions":["Sicherheit durch ungeteilte Macht","Begrenzte Macht als Treuhand","Freiheit durch Volkssouveränität"],"rows":[{"label":"Hinweis","values":["Bei allen drei ist der Naturzustand ein Gedankenexperiment, kein Geschichtsbericht: Wie wäre das Leben ohne Staat? Daraus folgt, wozu der Staat da ist."],"span":true},{"label":"Hauptvertreter","values":["**Thomas Hobbes** (1588-1679)","**John Locke** (1632-1704)","**Jean-Jacques Rousseau** (1712-1778)"]},{"label":"Hauptwerk","values":["**Leviathan** (1651)","**Zwei Abhandlungen über die Regierung** (1690)","**Vom Gesellschaftsvertrag** (1762)"]},{"label":"Merksatz","values":["Ohne starken Staat droht Krieg aller gegen alle; darum übertragen wir ihm fast alle Rechte.","Der Staat schützt Rechte, die schon vor ihm gelten; bei Missbrauch darf das Volk widerstehen.","Der Mensch ist von Natur aus nicht böse; erst Eigentum und Ungleichheit verderben ihn."]},{"label":"Grundannahmen","values":["• Menschen sind an Körper und Geist annähernd gleich: Selbst der Schwächste kann den Stärksten töten.\n• Sie sind auf Selbsterhaltung bedacht. Nicht alle sind böse, aber weil man Angreifer nicht erkennt, müssen auch Friedliche vorbeugen.","• Menschen sind frei, gleich und vernunftbegabt.\n• Ein Gesetz der Natur verpflichtet jeden: Niemand darf einem anderen an Leben, Gesundheit, Freiheit oder Besitz schaden. Locke begründet es mit Gott als Schöpfer.\n• Jeder hat Eigentum an seiner Person und seiner Arbeit. Wer seine Arbeit mit etwas aus der Natur mischt, macht es zu seinem Eigentum. Grenzen: nichts verderben lassen, genug für andere übrig lassen; das Geld hebt die erste Grenze auf.","• Der Mensch ist von Natur aus nicht böse. Er handelt aus Selbsterhaltung, nicht aus Bosheit, und empfindet Mitleid.\n• Er ist frei, aber noch nicht moralisch: Moral entsteht erst in der Gesellschaft."]},{"label":"Naturzustand: Was fehlt ohne Staat?","values":["• Eine gemeinsame Macht, die alle im Zaum hält.\n• Darum herrscht Krieg aller gegen alle: Konkurrenz, Misstrauen und Ruhmsucht führen zu Gewalt.\n• Kein sicheres Eigentum, keine Kultur, ständige Todesangst. Das Leben ist «einsam, arm, ekelhaft, tierisch und kurz».","• Weitgehend friedlich: Recht und Unrecht gibt es schon vor dem Staat.\n• Es fehlen drei Dinge: ein festes Gesetz, ein unparteiischer Richter, eine vollstreckende Gewalt. Jeder ist Richter in eigener Sache.\n→ Friedlich, aber unsicher, besonders für das Eigentum.","• Nichts: Der Mensch lebt friedlich, einfach und unabhängig, ohne Eigentum und Ungleichheit.\n• Das Problem entsteht erst mit dem Eigentum: Ungleichheit, Konkurrenz und Abhängigkeit. «Der Mensch ist frei geboren, und überall liegt er in Ketten.»"]},{"label":"Was gibt man ab, was gewinnt man?","values":["• Die Vernunft rät: Suche Frieden und verzichte auf dein Recht auf alles, wenn die anderen es auch tun. Doch «Verträge ohne Schwert sind bloße Worte».\n• Jeder schließt mit jedem einen Vertrag, nicht mit dem Herrscher. Alle autorisieren einen Souverän (Person oder Versammlung), in ihrem Namen zu handeln.\n→ Preis: fast alle Freiheit. Gewinn: Sicherheit, Ende des Kriegszustands.","• Zweck: Leben, Freiheit und Besitz sichern. Locke nennt alles zusammen Eigentum.\n• Abgegeben wird die Strafgewalt ganz, die natürliche Freiheit nur so weit wie nötig.\n• Zustimmung kann auch stillschweigend sein: Wer die Vorteile des Staates nutzt, stimmt zu.\n→ Gewinn: keine neuen Rechte, aber Sicherheit für die Rechte, die man schon hat.","• Gesucht ist eine Verbindung, in der jeder geschützt ist und doch nur sich selbst gehorcht. Ein Zurück zur Natur gibt es nicht.\n• Völlige Entäußerung: Jeder gibt sich mit allen Rechten dem Gemeinwesen hin. Weil alle dasselbe geben, ist die Bedingung für alle gleich. Wer sich allen gibt, gibt sich niemandem.\n→ Verloren geht die natürliche Freiheit. Gewonnen werden bürgerliche und moralische Freiheit: «Der Gehorsam gegen das Gesetz, das man sich selbst gegeben hat, ist Freiheit.»"]},{"label":"Wer ist Souverän, und wie ist die Macht begrenzt?","values":["• Leviathan: ungeteilte Macht mit Gewaltmonopol (nur der Staat darf Gewalt anwenden), keine Gewaltenteilung.\n• Der Souverän ist keine Vertragspartei. Die Bürger sind Autoren seiner Handlungen (Repräsentation).\n→ Seine Macht ist vertraglich nicht begrenzt.","• Treuhand (trust): Die Legislative ist die höchste Gewalt, aber an ihren Zweck gebunden. Sie darf niemandem ohne Zustimmung Eigentum nehmen.\n• Legislative und Exekutive liegen in verschiedenen Händen. Die unabhängige Judikative ergänzt erst Montesquieu.\n→ Locke gilt als philosophischer Vater des modernen Liberalismus.","• **Volkssouveränität**: Nur das Volk selbst gibt die Gesetze, ohne Vertreter. Die Regierung führt sie nur aus.\n• **Gemeinwille** (volonté générale): zielt allein auf das Gemeininteresse. Er ist nicht die Summe der Privatinteressen (volonté de tous). Parteien verfälschen ihn.\n• **Citoyen** statt **Bourgeois**: Der Citoyen engagiert sich für das Gemeinwohl, der Bourgeois sucht nur Sicherheit, Komfort und Besitz.\n→ Die Souveränität des Volkes kennt keine Schranken: keine Grundrechte gegen die Mehrheit."]},{"label":"Darf das Volk Widerstand leisten?","values":["• Nein, kein **Widerstandsrecht**: Die Bürger sind selbst Autoren der Handlungen des Souveräns.\n• Grenze des Gehorsams: Das Recht auf Selbsterhaltung bleibt. Schützt der Souverän die Bürger nicht mehr, endet die Gehorsamspflicht.","• Ja: Bricht die Regierung das Vertrauen (will sie das Volk enteignen oder versklaven), fällt die Macht an das Volk zurück.\n• Richter ist das Volk als Ganzes, nicht der Einzelne, und erst nach einer «langen Kette von Missbräuchen».\n• Nur die Regierung löst sich auf, die Gesellschaft bleibt. Das Volk setzt eine neue Legislative ein.","• Nicht gegen den Gemeinwillen: Wer ihm nicht gehorcht, wird von der ganzen Körperschaft dazu gezwungen, «was nichts anderes heißt, als dass man ihn zwingen wird, frei zu sein» (I, 7).\n• Gemeint ist: Frei ist, wer sich an gemeinsam gesetzte Regeln hält, auch gegen das eigene kurzfristige Interesse."]},{"label":"Offene Frage an den Nächsten","values":["• Wer schützt uns vor dem Leviathan? Absolute Macht schützt, kann aber selbst zur Gefahr werden.\n→ Hier setzt Locke an.","• Ist das Eigentum, das Locke schützt, nicht selbst die Quelle der Ungleichheit? Seine Eigentumslehre rechtfertigt große Ungleichheit.\n→ Hier setzt Rousseau an.","• Wer bestimmt den Gemeinwillen, und wer schützt Minderheiten?"]},{"label":"Was erklärt er gut?","values":["• Warum Menschen bereit sind, einen starken Staat zu akzeptieren, etwa nach Bürgerkriegen oder wo ein Staat zerfallen ist.\n• Herrschaft beruht auf Zustimmung, nicht auf Gott oder Tradition.","• Warum staatliche Macht an Recht und Gesetz gebunden sein muss: Grundlage des Rechtsstaats.\n• Warum Gehorsam nicht absolut ist, sondern an Bedingungen geknüpft.","• Freiheit ist mehr als Schutz vor Eingriffen: Bürger sind Autoren ihrer Gesetze (Selbstgesetzgebung).\n• Ein Staat, der nur schützt, aber nicht beteiligt, macht Menschen angepasst, aber unfrei.\n• Besitzkonzentration untergräbt politische Gleichheit."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Kooperation braucht nicht immer eine übergeordnete Macht. Ordnung entsteht oft auch durch Vertrauen, Normen und Gegenseitigkeit.\n• Ist Zustimmung aus Todesfurcht frei? Gilt sie auch für spätere Generationen?\n• Alles dreht sich um Sicherheit: Freiheit und politische Teilhabe spielen kaum eine Rolle.","• **Wer entscheidet?** Das Widerstandsrecht ist schwer zu begrenzen: Wann ist das Vertrauen gebrochen? Konflikte können schneller eskalieren.\n• Zustimmung bleibt fiktiv. Hume: Sie gleicht der eines Mannes, der im Schlaf auf ein Schiff getragen wurde.\n• Das Gesetz der Natur ist theologisch begründet: Was bleibt ohne Gott?","• **Gefahr des Autoritären:** Gilt das Gemeinwohl als eindeutig, erscheinen abweichende Meinungen als irrational oder illegitim. Die Jakobiner beriefen sich auf Rousseau.\n• Ablehnung von Parteien: Moderne Demokratien leben von Vielfalt und Interessenausgleich.\n• Gesetzgebung durch das ganze Volk ist in großen Staaten kaum umsetzbar."]},{"label":"Fazit","values":["Gleiche Methode, drei verschiedene Staaten: Hobbes sucht Sicherheit durch unbegrenzte Macht, Locke Sicherheit vorstaatlicher Rechte durch begrenzte Macht, Rousseau Freiheit durch Selbstgesetzgebung des Volkes. Jede Lösung erzeugt ein neues Problem, das der Nächste aufgreift."],"span":true},{"label":"Ausblick","values":["John Rawls (1921-2002) greift die Vertragstheorie auf: Hinter dem Schleier des Nichtwissens wählen alle die Grundsätze einer gerechten Gesellschaft. Sein Urzustand ist wie der Naturzustand ein Gedankenexperiment. Mehr dazu im Vergleich Soziale Gerechtigkeit."],"span":true}]},"machttheorie":{"sem":"Politische Philosophie","name":"Machttheorie","leitfrage":"Was ist Macht: Herrschaft, gemeinsames Handeln oder Kontrolle?","conn":["platon","vertragstheorie","demokratie","liberalismus"],"positions":["Macht als Herrschaft und Legitimität","Macht als gemeinsames Handeln","Macht als Kontrolle und Strategie"],"rows":[{"label":"Hauptvertreter","values":["**Max Weber** (1864-1920)","**Hannah Arendt** (1906-1975)","**Niccolò Machiavelli** (1469-1527)"]},{"label":"Hauptwerk","values":["**Wirtschaft und Gesellschaft** (1922)","**Macht und Gewalt** (1970)","**Der Fürst** (Il Principe, geschrieben 1513, gedruckt 1532)"]},{"label":"Merksatz","values":["Dauerhafte Herrschaft beruht auf dem Glauben der Beherrschten, dass sie rechtmäßig ist.","Macht entsteht durch gemeinsames Handeln; Gewalt kann Macht zerstören, aber nie erzeugen.","Wer sich behaupten will, muss lernen, nicht gut zu sein, wenn die Notwendigkeit es verlangt."]},{"label":"Grundannahmen","values":["• Blick: soziologisch beschreibend. Weber bewertet nicht.\n• Macht ist soziologisch amorph (formlos): Jede Grundlage zählt, ob Kraft, List, Geld oder Waffen. Darum braucht die Politik den engeren Begriff Herrschaft.\n• Rohe Gewalt ist teuer und brüchig.","• Blick: normativ (fragt, was sein soll) und phänomenologisch (beschreibt genau, wie Macht erfahren wird).\n• Arendt trennt Begriffe genau: Stärke hat ein Einzelner, Autorität ist fraglose Anerkennung, Gewalt braucht Werkzeuge. Macht ist etwas anderes.\n• Macht hängt von der Zahl ab, Gewalt nicht.","• Blick: pragmatisch, ratgebend. Politischer Realismus: Machiavelli beschreibt, was ist, nicht was sein soll.\n• Menschen sind «undankbar, wankelmütig, falsch». Wer in allem gut sein will, geht unter (Kap. 15).\n• Hintergrund: Italien um 1500 ist zersplittert. Machiavelli schreibt als Patriot. In den Discorsi zieht er die Republik freier Bürger vor."]},{"label":"Was ist Macht?","values":["• «Macht bedeutet jede Chance, innerhalb einer sozialen Beziehung den eigenen Willen auch gegen Widerstreben durchzusetzen, gleichviel worauf diese Chance beruht.» (Weber)\n• Herrschaft: die Chance, für einen Befehl bei bestimmten Personen Gehorsam zu finden.","• «Macht entspricht der menschlichen Fähigkeit, nicht nur zu handeln oder etwas zu tun, sondern sich mit anderen zusammenzuschließen und im Einvernehmen mit ihnen zu handeln.» (Arendt)\n• Macht hat nie ein Einzelner. Wer die Macht hat, ist von einer Gruppe ermächtigt. Zerfällt die Gruppe, vergeht seine Macht.","• Macht ist die Fähigkeit, die Herrschaft zu erhalten und den Staat zu sichern.\n• Politik ist ein eigener Bereich mit eigenen Regeln, getrennt von Moral und Religion."]},{"label":"Ist Gewalt ein Mittel der Macht?","values":["• Gewalt ist eine mögliche Grundlage der Macht.\n• Gewaltmonopol: Der moderne Staat beansprucht in seinem Gebiet als einziger legitime physische Gewalt (Politik als Beruf, 1919).","• Gewalt ist das Gegenteil von Macht. Wo die eine absolut herrscht, fehlt die andere.\n• Gewalt zeigt, dass Macht schwindet.\n• Auch Diktaturen brauchen eine Machtbasis (Armee, Geheimpolizei).","• Gewalt ist ein notwendiges Mittel, klug dosiert.\n• Zu viel Gewalt macht den Fürsten verhasst, zu wenig zeigt Schwäche."]},{"label":"Worauf beruht Gehorsam?","values":["Legitimitätsglaube: drei Idealtypen (reine Typen)\n• Traditionale Herrschaft: Es war schon immer so (z. B. Erbmonarchie).\n• Charismatische Herrschaft: Vertrauen in eine außergewöhnliche Person (z. B. Napoleon, Gandhi).\n• Legale (bürokratische) Herrschaft: Die Ordnung ist korrekt gesetzt (z. B. Finanzamt, Polizei).","• Auf Unterstützung, Meinung und Zustimmung der Vielen.\n• Institutionen haben nur Macht, solange das Volk sie trägt. Sonst «erstarren und verfallen» sie.","• Furcht ist sicherer als Liebe, aber der Fürst darf nie verhasst werden (Kap. 17).\n• Fuchs und Löwe: List erkennt Fallen, Stärke schreckt ab. Dazu kommt der Schein der Tugend (Kap. 18).\n• **Virtù**: politische Tüchtigkeit, keine moralische Tugend. Sie nutzt **Fortuna**, das unberechenbare Schicksal, und baut ihr Dämme."]},{"label":"Was heißt legitim?","values":["• Legal heißt gesetzmäßig, legitim heißt gerechtfertigt. Beides kann auseinanderfallen.\n• Weber meint empirische Legitimität (als legitim geglaubt), nicht normative (moralisch gerechtfertigt). Auch eine Diktatur kann in seinem Sinn legitim sein.","• Macht ist legitim durch den gemeinsamen Anfang: Sie beruft sich auf die Vergangenheit.\n• Gewalt kann durch einen Zweck gerechtfertigt sein (z. B. Notwehr), aber nie legitim.","• Maßstab ist der Erfolg für den Staat, nicht die Tugend: Notwendigkeit (necessità), später Staatsräson genannt.\n• Wer sich behauptet, dessen Mittel werden «stets für ehrbar befunden».\n• Machiavelli sagt aber nicht, der Zweck heilige die Mittel als allgemeine Moral."]},{"label":"Beispiel","values":["• Moderner Verfassungsstaat: Man gehorcht, weil Gesetze und Zuständigkeiten gelten.\n• Charismatische Herrschaft kann auch Diktatoren tragen (Hitler, Lenin).","• Leipzig, 9. Oktober 1989: Die Sicherheitskräfte gehen nicht gegen 70.000 Demonstrierende vor; einen Monat später fällt die Mauer.\n• Generalstreik: Macht ohne Gewalt.\n• Amerikanische Revolution: Macht aus dem gemeinsamen Handeln der Kolonisten.","• Herrscher, die Gewalt und List nutzen, um Stabilität und Kontrolle zu sichern.\n• Cesare Borgia als Machiavellis Musterfall: brutal, aber wirksam."]},{"label":"Was erklärt sie gut?","values":["• Warum Herrschaft ohne Dauergewalt funktioniert: Die meisten gehorchen, weil sie an die Ordnung glauben.\n• Klare Begriffe, mit denen man jede Herrschaft vergleichen kann.","• Warum Regime trotz Waffen stürzen (Generalstreik, 1989).\n• Warum gewaltfreier Protest wirken kann.","• Wie Macht in der Wirklichkeit erhalten wird.\n• Begründer der modernen Politikwissenschaft; er trennt Amt und Person."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Keine Unterscheidung zwischen gerechter und bloß geglaubter Legitimität: Eine Diktatur, an die viele glauben, ist für ihn genauso legitim.\n• Der Machtbegriff ist so weit, dass Überzeugung und Waffengewalt nebeneinanderstehen (Arendts Einwand).","• **Stärkster Einwand:** Der Machtbegriff weicht vom Alltagsgebrauch ab: Hat ein Diktator mit Panzern keine Macht?\n• Auch eine Mehrheit kann ohne Gewalt unterdrücken. Macht ist nicht dasselbe wie Gerechtigkeit.\n• Idealisiert den Konsens und übersieht Konflikte in pluralistischen Gesellschaften.","• **Stärkster Einwand:** Keine Grenze der Notwendigkeit: Wer entscheidet, wann sie unmoralisches Handeln verlangt? Die Ausnahme droht zur Regel zu werden.\n• Enge Staatsziele: Gerechtigkeit, Freiheit und Wohlfahrt kommen kaum vor.\n• Das Menschenbild (egoistisch) ist eine Vorentscheidung, keine Tatsache."]},{"label":"Fazit","values":["Weber und Machiavelli sehen Gewalt als Mittel der Macht, Arendt als ihr Gegenteil. Mit einer neuen Prämisse wird aus Machiavelli Arendt: Wer Gewalt einsetzt, verliert die Unterstützung der Vielen und damit seine Macht. Der Streit liegt im Machtbegriff, nicht in der Moral."],"span":true}]},"liberalismus":{"sem":"Politische Philosophie","name":"Liberalismus - Kommunitarismus","leitfrage":"Muss ich mich als Bürger engagieren, und darf der Staat es verlangen?","conn":["demokratie","sozgerechtigkeit","vertragstheorie"],"positions":["Liberalismus","Kommunitarismus","Realistischer Einwand"],"rows":[{"label":"Hauptvertreter","values":["**John Stuart Mill** (1806-1873); in der Tradition von **John Locke**, heute **John Rawls**","**Michael Sandel** (*1953), **Amitai Etzioni** (1929-2023), **Charles Taylor** (*1931)","**Michael Walzer** (*1935)"]},{"label":"Hauptwerk","values":["**Über die Freiheit** (Mill, 1859)","**Gerechtigkeit** (Sandel, 2009); **Die Entdeckung des Gemeinwesens** (Etzioni, 1993)","**Was heißt zivile Gesellschaft?** (1992)"]},{"label":"Merksatz","values":["Jeder darf leben, wie er will, solange er anderen nicht schadet und seinen Teil beiträgt.","Zu Rechten gehören Pflichten: Eine Demokratie lebt vom Gemeinsinn ihrer Bürger.","Der ständig engagierte Bürger ist ein schönes Ideal, aber nicht das wirkliche Leben."]},{"label":"Grundannahmen","values":["• Der freie Einzelne steht im Mittelpunkt: Der Staat schreibt niemandem vor, was ein gutes Leben ist.\n• Was nur einen selbst betrifft, bleibt frei.","• Eingebettetes Selbst: Familien, Nachbarschaften und Traditionen prägen den Menschen. Er ist kein «ungebundenes Selbst» (Sandel).\n• Die soziale Umwelt ist so schutzbedürftig wie die Natur (Etzioni).","• Der Mensch hat Arbeit und Familie: Die meisten müssen ihren Lebensunterhalt verdienen.\n• Arbeit hat oft einen eigenen Wert: Stolz auf gute Arbeit, Kameradschaft, Hingabe an einen Beruf.\n• Politik ist ein Teil des Lebens, nicht das Ganze."]},{"label":"Was schulden Bürger, und was darf der Staat erzwingen?","values":["• Nicht schaden und seinen Teil beitragen (Steuern zahlen, vor Gericht aussagen): Das darf der Staat erzwingen.\n• Mehr Engagement nur durch Überzeugung, nicht durch Zwang.","• Mehr als das Minimum. «Zu Individualrechten gehören Sozialpflichten» (Etzioni): Schöffenamt, Wahlen, Lokalpolitik. Wer von seinesgleichen gerichtet werden will, muss selbst Schöffe sein.\n• Der Staat soll öffentliche Räume schaffen, in denen sich Arm und Reich begegnen, und dafür die Begüterten besteuern (Sandel).","• So viel, wie im wirklichen Leben neben Arbeit und Familie möglich ist."]},{"label":"Stärkstes Argument","values":["• Freiheit schützt vor Bevormundung: Niemand weiß besser als ich, was mein gutes Leben ist.","• Ohne Gemeinsinn bröckelt die Solidarität: Wohlhabende ziehen sich in Privatschulen und private Clubs zurück (Sandel).","• Ein Ideal, das die meisten überfordert, verfehlt die Wirklichkeit. Auch wer sich wenig engagiert, kann ein guter Bürger sein."]},{"label":"Größte Gefahr","values":["• Tyrannei der Mehrheit, auch durch die öffentliche Meinung: Ihr Druck kann Abweichende ohne Gesetz zum Schweigen bringen (Mill; mehr im Vergleich Demokratiekonzepte).","• Rückzug ins Private: Arm und Reich begegnen sich nicht mehr (Sandel, Etzioni).","• Ein überzogenes Bürgerideal."]},{"label":"Fall: Wahlpflicht in Luxemburg","values":["Schadet Nichtwählen anderen? Nur dann wäre die Pflicht nach Mill gerechtfertigt.","Wer das Wahlrecht hat, hat auch die Pflicht, es zu nutzen.","Eine kleine Pflicht ist zumutbar; ein verpflichtendes Schöffenamt oder ein Gemeindedienst wäre mehr."]},{"label":"Was erklärt er gut?","values":["• Er schützt den Einzelnen vor Zwang.","• Eine Demokratie lebt von Bürgersinn, den sie nicht selbst herstellen kann.\n• Freiheit ist mehr, als in Ruhe gelassen zu werden.","• Er ist realistisch: Er nimmt das wirkliche Leben der meisten ernst."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Lässt offen, woher der Gemeinsinn kommen soll, wenn sich alle ins Private zurückziehen.\n• Freiheit kann zur Freiheit der Starken werden, wenn soziale Sicherung fehlt.\n• Das Bild des unabhängigen Einzelnen übersieht, wie sehr Gemeinschaften uns prägen.","• **Stärkster Einwand:** Gemeinschaftsdruck kann die Freiheit des Einzelnen einschränken (Mill).\n• Verlangt mehr, als das wirkliche Leben der meisten erlaubt (Walzer).\n• Wer nicht zur dominanten Gemeinschaft gehört, kann ausgegrenzt werden.","• **Stärkster Einwand:** Gibt wenig Antwort auf Gleichgültigkeit (Apathie) und kann sie rechtfertigen.\n• Sagt nicht, wie viel Engagement eine Demokratie mindestens braucht.\n• Beschreibt eher, als dass es eine eigene Position begründet."]},{"label":"Fazit","values":["Strittig zwischen Mill und den Kommunitaristen ist nicht der Wert des Engagements, sondern ob der Staat es erzwingen darf. Auch Mill hält Beteiligung für wertvoll: Wer als Geschworener oder in der Gemeinde mitentscheidet, lernt, über den eigenen Vorteil hinaus zu denken."],"span":true}]},"sozgerechtigkeit":{"sem":"Politische Philosophie","name":"Soziale Gerechtigkeit","leitfrage":"Impliziert Gerechtigkeit Gleichbehandlung - oder kann Ungleichheit gerecht sein?","conn":["vertragstheorie","utilitarismus","moralkritik","liberalismus"],"positions":["Liberaler Egalitarismus","Libertarismus"],"rows":[{"label":"Hinweis","values":["Keine Karikaturen: Rawls ist kein Anhänger der Gleichverteilung. Nozick ist Armut nicht gleichgültig; er bestreitet nur, dass der Staat sie durch Zwang beheben darf. Beide sind Liberale und streiten darüber, was aus der Freiheit für die Verteilung folgt."],"span":true},{"label":"Hauptvertreter","values":["**John Rawls** (1921-2002)","**Robert Nozick** (1938-2002)"]},{"label":"Hauptwerk","values":["**Eine Theorie der Gerechtigkeit** (1971)","**Anarchie, Staat, Utopia** (1974)"]},{"label":"Merksatz","values":["Ungleichheiten sind nur gerecht, wenn sie den am schlechtesten Gestellten zugutekommen.","Gerecht ist, was gerecht erworben wurde; Steuern zur Umverteilung zwingen zur Arbeit für andere."]},{"label":"Grundannahmen","values":["• Kernfrage: Welche Regeln würden wir ohne Wissen um unsere Stellung wählen?\n• Grundstruktur: Gerechtigkeit betrifft zuerst die wichtigsten Institutionen (Verfassung, Wirtschaft, Steuern, Bildung), nicht das einzelne Gehalt.\n• **Urzustand**: ein Gedankenexperiment. Freie und gleiche Menschen einigen sich hinter dem **Schleier des Nichtwissens** auf Grundsätze: Niemand kennt seine Stellung, seine Begabungen und seine Vorstellung vom guten Leben. Die Beteiligten sind weder Egoisten noch Altruisten.","• Kernfrage: Wie ist der Besitz zustande gekommen?\n• Ausgangspunkt **Selbsteigentum**: Jeder gehört sich selbst.\n• Libertär: Gerechtigkeit heißt vor allem, Eigentum zu respektieren. Umverteilung ist ein Eingriff in die Freiheit."]},{"label":"Grundsätze","values":["• 1. Grundsatz: gleiche Grundfreiheiten für alle.\n• 2. Grundsatz: Ungleichheiten sind nur erlaubt, (a) wenn Ämter und Positionen allen bei fairer Chancengleichheit offenstehen und (b) wenn sie den am wenigsten Begünstigten den größten Vorteil bringen (**Unterschiedsprinzip**, auch Differenzprinzip).\n• Lexikalische Ordnung (feste Rangfolge): erst Freiheit, dann Chancengleichheit, dann Unterschiedsprinzip. Freiheit darf nicht gegen Wohlstand verrechnet werden.","Anspruchstheorie: drei Grundsätze\n• Gerechte Aneignung herrenloser Dinge (Anschluss an Locke).\n• Gerechte Übertragung: freiwilliger Tausch oder Schenkung, nicht Betrug oder Diebstahl.\n• Berichtigung früheren Unrechts.\n→ Ist jeder einzelne Besitz gerecht, ist die Verteilung gerecht."]},{"label":"Muster oder Geschichte?","values":["Strukturell: Es zählt, wie die Regeln der Grundstruktur verteilen.","Historisch: Es zählt, wie eine Verteilung zustande kam, nicht, wie sie aussieht."]},{"label":"Wem gehören die Früchte der Begabung?","values":["Zufall: Niemand hat Intelligenz, Gesundheit oder Elternhaus verdient. Ihr Ertrag soll auch denen nützen, die weniger Glück hatten.","Der Person: Wer sich selbst gehört, dem gehören auch seine Begabungen und deren Früchte."]},{"label":"Gedankenexperiment und Kernargument","values":["• Maximin-Regel: Wer seine Position nicht kennt und keine Wahrscheinlichkeiten hat, sichert den schlechtesten Fall ab.\n• Arztgehälter (Sandel als Erklärer): Höhere Gehälter sind gerecht, wenn dadurch auch arme Regionen wie die Appalachen versorgt werden, kaum aber für mehr Schönheitschirurgen in Beverly Hills.\n• Antwort auf Nozick: Rawls greift nicht in einzelne Tauschakte ein, sondern gestaltet die Regeln. Viele faire Geschäfte zusammen können die faire Ausgangslage zerstören.","• Fußballspieler-Argument: Eine Million Zuschauer geben einem Torschützen freiwillig 50 Cent (Original: Wilt Chamberlain). Die neue, ungleiche Verteilung ist ebenfalls gerecht. Wer ein Muster erhalten will, muss ständig eingreifen.\n• Steuern als Zwangsarbeit: Wer mir einen Teil meines Lohns nimmt, verfügt über meine Arbeitszeit, also über mich."]},{"label":"Rolle des Staates","values":["• Der Staat sichert Freiheiten, gleicht Zufälle aus und darf umverteilen (z. B. progressive Steuer).\n• Ungleichheit ist erlaubt, muss sich aber vor den Schwächsten rechtfertigen.","• Minimalstaat: Er schützt Leben, Eigentum und Verträge, sonst nichts.\n• Ungleichheit ist legitim, wenn sie aus gerechtem Erwerb und freiwilligem Tausch entsteht.\n• Hilfe für Arme ist erlaubt und gut, aber nur freiwillig."]},{"label":"Was erklärt er gut?","values":["• Er verbindet Freiheit und Gleichheit.\n• Das Gedankenexperiment macht Unparteilichkeit anschaulich.\n• Er schützt die Schwächsten, ohne Leistungsanreize abzuschaffen.","• Er nimmt freiwillige Entscheidungen ernst.\n• Verteilungen haben eine Geschichte, und Umverteilung bedeutet Zwang."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand (Nozick):** Jedes Muster verlangt ständige Eingriffe in die Freiheit.\n• Harsanyi: Maximin ist übertrieben vorsichtig. Rational wäre, den Durchschnitt zu maximieren; das führt zum Utilitarismus zurück.\n• Sandel: Das Selbst hinter dem Schleier ist eine Abstraktion. Menschen sind immer schon durch Familie, Herkunft und Gemeinschaft geprägt.\n• Wie das Unterschiedsprinzip praktisch umzusetzen ist, bleibt vage.","• **Stärkster Einwand:** Fast aller Besitz ist durch Unrecht belastet (Eroberung, Kolonialismus, Sklaverei). Wie weit die Berichtigung reicht, bleibt offen.\n• Ungleiche Startchancen bleiben: Wer arm geboren wird, hat keinen Anspruch auf Ausgleich.\n• Reicht freiwillige Hilfe gegen Armut?\n• Ein Minimalstaat ist schwer mit modernen, komplexen Gesellschaften vereinbar."]},{"label":"Fazit","values":["Muster oder Geschichte? Rawls und Nozick sind beide Liberale und streiten an zwei Stellen. Kommt es auf das Muster der Verteilung an (Rawls) oder auf ihre Geschichte (Nozick)? Und gehören die Früchte meiner Begabungen mir (Selbsteigentum, Nozick), oder sind Begabungen ein Zufall, dessen Ertrag allen dienen soll (Rawls)?"],"span":true},{"label":"Ausblick","values":["Karl Marx (1818-1883): Für Marx ist Verteilung eine Folge der Eigentumsverhältnisse an den Produktionsmitteln. Nozick setzt Privateigentum voraus; Rawls lässt offen, ob breit gestreutes Privateigentum oder ein liberaler Sozialismus seine Grundsätze besser erfüllt."],"span":true}]},"demokratie":{"sem":"Politische Philosophie","name":"Demokratiekonzepte","leitfrage":"Ist Demokratie die beste aller Regierungsformen - und was macht sie aus?","conn":["platon","machttheorie","liberalismus","naturrecht"],"positions":["Gefahren für die Freiheit","Demokratie als Verfahren","Demokratie als Beteiligung"],"rows":[{"label":"Hauptvertreter","values":["**Alexis de Tocqueville** (1805-1859); erweitert von **John Stuart Mill** (1806-1873)","**Joseph Alois Schumpeter** (1883-1950); weitergeführt von **Karl Popper** (1902-1994)","**Hannah Arendt** (1906-1975); Vorläufer **Jean-Jacques Rousseau** (1712-1778)"]},{"label":"Hauptwerk","values":["**Über die Demokratie in Amerika** (1835/1840)","**Kapitalismus, Sozialismus und Demokratie** (1942); Popper: **Die offene Gesellschaft und ihre Feinde** (1945)","**Über die Revolution** (1963); **Vita activa** (1960)"]},{"label":"Merksatz","values":["Ein fürsorglicher, gewählter Vormund bricht den Willen der Bürger nicht, er schwächt ihn.","Das Volk entscheidet nicht Sachfragen, es wählt, wer entscheidet: Demokratie ist Konkurrenz um Stimmen.","Befreiung ist nicht Freiheit: Freiheit braucht einen festen öffentlichen Raum wie die Räte."]},{"label":"Grundannahmen: Was trauen sie den Bürgern zu?","values":["• Die Demokratie treibt zur Gleichheit. Gleiche, vereinzelte Bürger ziehen sich ins Private zurück: Jeder lebt «nur in sich und für sich selbst».\n• Die Menschen wollen geführt werden und zugleich frei bleiben.","• Wenig: Wähler sind «schlechte, sogar korrumpierbare Richter», oft auch über ihre eigenen Interessen.\n• Die klassische Theorie ist unrealistisch: In der Politik sinkt der Bürger «auf eine tiefere Stufe der gedanklichen Leistung» und folgt Vorurteilen.\n• Der Wille der Mehrheit ist nicht der Wille des Volkes. Gemeinschaften handeln, indem sie eine Führung akzeptieren.","• Viel: Bürger sind gleichrangig und verschieden (**Pluralität**). Politik entsteht im Gespräch zwischen ihnen.\n• Politik ist kein technisches Problem für Experten, sondern gemeinsames Handeln."]},{"label":"Was macht Demokratie aus?","values":["• Freiheit durch Gemeinden, Vereine und freie Presse, in denen Bürger selbst handeln.\n• Unabhängige Justiz sichert die Freiheit zusätzlich.\n• Mill: begrenzte Mehrheitsherrschaft.","• Konkurrenz um Stimmen: Parteien konkurrieren um Wähler wie Firmen um Kunden; Wahlkampf ist Werbung (Konkurrenzdemokratie).\n• Der Wähler bestimmt, wer entscheidet, nicht was entschieden wird. Eine Garantie für Kompetenz gibt es nicht.\n• Popper: Die Frage Wer soll herrschen? ist falsch gestellt. Demokratie heißt, eine Regierung ohne Blutvergießen abwählen zu können. So lassen sich Fehler korrigieren.","• Gemeinsames Handeln im öffentlichen Raum.\n• Rätesystem: Es beginnt in Nachbarschafts- und Betriebsräten. Die Geeignetsten vertreten ihren Rat im nächsthöheren, bis zum Parlament.\n• Macht wird horizontal kontrolliert. Nicht jeder muss mitmachen, aber jeder muss die Chance haben. Vorbilder: Townhall-Versammlungen, Pariser Kommune, Ungarn 1956."]},{"label":"Genügt die Wahl?","values":["• Nein: Die Bürger trösten sich, dass sie ihren Vormund selbst gewählt haben. Für einen Augenblick verlassen sie ihre Abhängigkeit, «und fallen danach wieder in sie zurück».\n• Demokratische Tugend lernt man nur durch Praxis: teilnehmen, nicht nur wählen.","• Ja: Wahl und Abwahl sind der Kern. Zwischen den Wahlen regieren die Gewählten; das ist ihre Aufgabe, nicht die der Wähler.\n• Popper: Eine Wahl ist vor allem ein Urteil über die bisherige Regierung.","• Nein: Im Repräsentativsystem treten die Wähler zusammen, «um sich ihrer eigenen Macht zu entledigen».\n• «Die Zelle, in der wir unsere Stimmzettel abgeben, ist zweifellos zu klein, denn in dieser Zelle ist Platz nur für einen.»\n• Rousseau: Das englische Volk ist «nur frei während der Wahl der Parlamentsmitglieder». Der Gemeinwille kann nicht vertreten werden."]},{"label":"Größte Gefahr","values":["• Tyrannei der Mehrheit (Band 1, 1835): Die Mehrheit kann Minderheiten unterdrücken. Mill: Auch der Druck der öffentlichen Meinung kann Abweichende ohne Gesetz zum Schweigen bringen.\n• Sanfter Despotismus (Band 2, 1840): Eine milde Vormundschaftsgewalt nimmt den Bürgern die Mühe ab, selbst zu denken. «Er bricht den Willen nicht, sondern er schwächt, beugt und leitet ihn.»","• Schumpeter: Irrationalität der Massen. Darum soll das Volk nicht über Sachfragen entscheiden.\n• Popper: Herrschaft, die man nicht loswird. In einer Tyrannei wird man schlechte Herrscher nur durch Umsturz los.","• Lethargie (Teilnahmslosigkeit): Die Trennung von Herrschern und Beherrschten kehrt zurück, Politik wird zum Privileg weniger.\n• Rousseau: die Vertretung selbst."]},{"label":"Was erklärt sie gut?","values":["• Scharfe Diagnose: Gefahren, die gerade in Demokratien entstehen, etwa Bequemlichkeit und der Druck der Mehrheit.\n• Mill schützt den Einzelnen.","• Realistisch: Schumpeter beschreibt, wie repräsentative Politik oft funktioniert.\n• Popper gibt ein klares Kriterium: Kann man die Regierung abwählen?","• Freiheit ist gemeinsames Handeln, mehr als eine Stimme alle fünf Jahre.\n• Rousseau nimmt Volksherrschaft ernst."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Die Gegenmittel bleiben vage.\n• Zivilgesellschaft kann selbst ausgrenzen.\n• Schutzmechanismen reichen vielleicht nicht gegen strukturelle Machtkonzentration.","• **Stärkster Einwand:** Rechtfertigt Gleichgültigkeit (Apathie) der Bürger.\n• Kelsen: Die Wahl ist nur ein Mittel, nicht das Wesen der Demokratie. Der junge Habermas: Die Idee der Volksherrschaft geht verloren.\n• Reines Verfahren: Sagt nichts über Grundrechte, Pressefreiheit oder Verfassungsgerichte.\n• Popper: klares Kriterium, aber wenig Anspruch an Beteiligung.","• **Stärkster Einwand:** Die Räte sind kaum verwirklicht; Arendt selbst hält ihre Chancen für «sehr gering».\n• Beteiligung verlangt viel Zeit, Wissen und Engagement.\n• In großen, komplexen Staaten kaum umsetzbar (gilt auch für Rousseau)."]},{"label":"Fazit","values":["Verfahren oder Lebensform? Demokratie ist entweder ein Verfahren der Auswahl und Abwahl (Schumpeter, Popper) oder eine Lebensform der Beteiligung (Rousseau, Arendt, Kommunitaristen). In beiden Fällen kann Freiheit verloren gehen: durch Gleichgültigkeit, durch Bevormundung, durch die Mehrheit oder durch ungleiche Macht."],"span":true},{"label":"Ausblick","values":["Marx und Engels (Kommunistisches Manifest, 1848): Die Gleichheit der Stimmen ist nur formal; wer die Produktionsmittel besitzt, hat mehr Macht. Demokratie ist für sie nur der erste Schritt zur Befreiung. Was Bürger der Gemeinschaft schulden (Mill, Sandel, Etzioni, Walzer), zeigt der Vergleich Liberalismus - Kommunitarismus."],"span":true}]},"naturrecht":{"sem":"Politische Philosophie","name":"Naturrecht vs. Positives Recht","leitfrage":"Ist das Legale auch das Gerechte - oder muss Recht an einem übergeordneten Maßstab gemessen werden?","conn":["vertragstheorie","menschenrechte","demokratie","widerstand"],"positions":["Rechtspositivismus","Naturrecht"],"rows":[{"label":"Hinweis","values":["• Legal: im Einklang mit dem geltenden Gesetz. Legitim: moralisch gerechtfertigt. Ein Gesetz kann legal und trotzdem illegitim sein.\n• Positives Recht (lat. ponere, setzen): von Menschen gesetzt, gilt zu einer bestimmten Zeit an einem bestimmten Ort (z. B. Strafgesetzbuch, Verfassung). Naturrecht: gilt unabhängig von jeder Setzung, weil es in der Natur des Menschen oder in der Vernunft gründet.\n• Keine sauberen Schubladen: Radbruch war vor 1933 selbst eher Positivist. Achte auf das Argument, nicht auf das Etikett."],"span":true},{"label":"Hauptvertreter","values":["**Hans Kelsen** (1881-1973); praktischer Grund Rechtssicherheit: **Erwin Riezler**","**Leo Strauss** (1899-1973); Tradition: **Thomas von Aquin** (1225-1274), **John Locke** (1632-1704)"]},{"label":"Hauptwerk","values":["**Reine Rechtslehre** (1934, 2. Aufl. 1960)","**Naturrecht und Geschichte** (1953)"]},{"label":"Merksatz","values":["Recht ist, was ordnungsgemäß gesetzt wurde, unabhängig von seinem Inhalt.","Über dem gesetzten Recht steht ein Maßstab, an dem sich jedes Gesetz messen lassen muss."]},{"label":"Was macht eine Regel zu Recht?","values":["• Setzung in einem wirksamen System: Recht gilt, weil es nach einem anerkannten Verfahren gesetzt wurde, nicht weil es moralisch gut ist.\n• Grundnorm: Am Ende der Geltungskette (Bescheid, Gesetz, Verfassung) steht die Regel, der ersten, im Großen und Ganzen wirksamen Verfassung zu folgen.","• Übereinstimmung mit einem überpositiven Maßstab (einem Recht über dem gesetzten Recht), den die Vernunft erkennen kann.\n• Dieser Maßstab gründet in der Natur des Menschen, in der Vernunft oder in Gott und gilt unabhängig vom Staat."]},{"label":"Gilt ein ungerechtes Gesetz?","values":["• Ja, wenn es ordnungsgemäß gesetzt wurde.\n• Geltung ist nicht Gehorsamspflicht: Ein Positivist kann ein Gesetz geltend und zugleich zutiefst ungerecht nennen. Kelsen trennt nur zwei Fragen: Was gilt? Ist es gerecht?","• Nein: Gesetze müssen sich an überpositiven Grundsätzen messen lassen. Im Konflikt hat das Naturrecht Vorrang.\n• Grundgesetz Art. 1: «Die Würde des Menschen ist unantastbar». Dieser Grundsatz ist dem Zugriff der Mehrheit entzogen.\n• Nürnberger Prozesse (Londoner Statut 1945): Die Täter hatten nach NS-Recht oft legal gehandelt, aber gegen ein überpositives Recht verstoßen."]},{"label":"Grundannahmen","values":["• Recht und Moral sind getrennt.\n• Wertrelativismus: Absolute Werte sind wissenschaftlich nicht erkennbar.\n• Es gibt viele, einander widersprechende Gerechtigkeitsvorstellungen. Knüpfte man die Geltung an eine davon, wäre jede Rechtsordnung nach irgendeinem Maßstab ungültig.","• Wer ein Gesetz ungerecht nennt, setzt einen Maßstab über dem Gesetz voraus. Wäre er nur das Ideal der eigenen Gesellschaft, hätten auch Kannibalen gleich gute Ideale (reductio ad absurdum: Widerlegung durch eine absurde Folge).\n• Die Vielfalt widerlegt nichts: Der Streit über Gerechtigkeit ist der Anlass, nach dem von Natur Rechten zu suchen. So greift Strauss Kelsens erste Prämisse an. Beweisen kann er das Naturrecht nicht."]},{"label":"Wovor schützt sie?","values":["• Vor der Willkür von Richtern und Bürgern, die ihre eigene Moral über das Gesetz stellen.","• Vor einem Recht, das zum Werkzeug des Unrechts wird, ohne dass man es noch Unrecht nennen darf."]},{"label":"Fall: Mauerschützen","values":["• 1984 erschossen DDR-Grenzsoldaten einen Flüchtenden. § 27 des DDR-Grenzgesetzes war geltendes Recht und rechtfertigte die Schüsse.\n→ Rechtlich spricht viel für Freispruch. Ob das gerecht ist, ist für Kelsen eine andere, außerrechtliche Frage.","• § 27 bindet nicht, weil er überpositivem Recht widerspricht.\n→ Verurteilung gerechtfertigt. Zum Urteil des BGH (1992) siehe Radbruchsche Formel."]},{"label":"Was erklärt sie gut?","values":["• Rechtssicherheit (Riezler): Jeder kann vorher wissen, was Recht ist.\n• Demokratisch beschlossene Gesetze gelten, auch wenn sie moralisch umstritten sind.","• Warum wir Gesetze überhaupt kritisieren können.\n• Schützt vor bloßem Relativismus (alle Maßstäbe gelten gleich viel)."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Kann schwerstes staatliches Unrecht nicht als Unrecht benennen. Auch im NS-Staat geschah Unrecht in Gesetzesform.\n• Gibt keinen Maßstab, wann Widerstand gegen Gesetze erlaubt ist.","• **Stärkster Einwand:** Offen bleibt, wie man das Naturrecht konkret erkennt und wer es auslegt.\n• Missbrauch möglich: Mit Naturrecht wurden auch Sklaverei und Kolonialherrschaft gerechtfertigt.\n• Ohne Positivierung (Festschreibung als Gesetz) kaum durchsetzbar."]},{"label":"Synthese: Radbruchsche Formel","values":["Gustav Radbruch (1878-1949) vermittelt zwischen beiden Positionen\n• Regel: Das gesetzte Recht hat Vorrang, auch wenn es ungerecht und unzweckmäßig ist (Rechtssicherheit).\n• Ausnahme 1 (Unerträglichkeit): Ist der Widerspruch zur Gerechtigkeit unerträglich, muss das Gesetz als «unrichtiges Recht» weichen.\n• Ausnahme 2 (Verleugnung): Wird die Gleichheit bei der Gesetzgebung bewusst verleugnet, ist das Gesetz gar kein Recht (z. B. Nürnberger Rassengesetze 1935).\n→ Anwendung: Die Formel stammt von 1946. Der BGH griff 1992 im Fall der DDR-Grenzsoldaten auf sie zurück.\n• Grenze: Unerträglich ist unscharf. Am Ende zieht wieder ein Richter die Grenze."],"span":true},{"label":"Fazit","values":["• Beide Seiten unterscheiden sich darin, wovor sie mehr Angst haben (siehe Wovor schützt sie?).\n• Radbruch sucht einen Mittelweg: Im Normalfall bindet das Recht, auch wenn es Fehler hat. Die Grenze ist nicht das private Gewissen, sondern Grundsätze, die alle teilen können, etwa die Menschen- und Bürgerrechte (siehe Menschenrechte)."],"span":true}]},"menschenrechte":{"sem":"Politische Philosophie","name":"Menschenrechte","leitfrage":"Worauf gründen Rechte, die für alle Menschen gelten sollen, und wer sichert sie?","conn":["naturrecht","relativismus","utilitarismus"],"positions":["Vernunft","Zugehörigkeit","Diskurs","Gefühl"],"rows":[{"label":"Einstieg","values":["• Klassische Antwort: Menschenrechte stehen jedem Menschen allein aufgrund seines Menschseins zu. Sie gelten universal (für alle), gleich (für alle in gleichem Maß) und unteilbar (man kann nicht nur einige gewähren). Allgemeine Erklärung der Menschenrechte (AEMR) Art. 1 (1948): «Alle Menschen sind frei und gleich an Würde und Rechten geboren.»\n• Verbindlich wurden Menschenrechte erst durch Verträge: Europäische Menschenrechtskonvention (EMRK, 1950), UN-Menschenrechtspakte (1966)."],"span":true},{"label":"Hauptvertreter","values":["**Immanuel Kant** (1724-1804); Naturrechtstradition, AEMR","**Hannah Arendt** (1906-1975)","**Jürgen Habermas** (1929-2026)","**Richard Rorty** (1931-2007)"]},{"label":"Hauptwerk","values":["**Grundlegung zur Metaphysik der Sitten** (1785)","**Elemente und Ursprünge totaler Herrschaft** (1951), Kap. 9","**Der interkulturelle Diskurs über Menschenrechte**","**Menschenrechte, Rationalität und Empfindsamkeit** (Amnesty Lecture, 1993)"]},{"label":"Merksatz","values":["Jeder Mensch hat Würde, weil er ein vernünftiges, sich selbst bestimmende

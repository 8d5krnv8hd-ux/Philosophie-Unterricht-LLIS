le.","Unbegrenztes Wachstum macht den Menschen zur Krankheit der Erde."]},{"label":"Grundannahmen","values":["• Wohlstand hängt von der Produktivität der Arbeit ab. Sie steigt vor allem durch Arbeitsteilung.\n• Arbeitsteilung entsteht aus der Neigung zu tauschen. Tausch setzt nicht auf das Wohlwollen, sondern auf die Eigenliebe der anderen.","• Gaia: Die Erde mit allem Leben verhält sich wie ein einziges, sich selbst regulierendes System. Der Name kommt von der griechischen Erdgöttin.\n• Der Mensch sichert sein Leben auf Kosten dieses Systems."]},{"label":"Wachstum oder Niedergang?","values":["Wachstum: Arbeitsteilung steigert die Produktivität, und davon profitieren alle.","Niedergang: Ungebremstes Wachstum schwächt die Erde wie eine Krankheit einen Organismus."]},{"label":"Welches Bild der Natur?","values":["Unausgesprochen: Die Natur liefert unbegrenzt. Lovelock deckt diese stille Voraussetzung auf.","Die Erde ist kein Vorrat, sondern wie ein Lebewesen, das krank werden kann."]},{"label":"Was ist zu tun?","values":["Eigeninteresse und Tausch wirken lassen. Unsichtbare Hand: Wer nur seinen Vorteil verfolgt, fördert ohne Absicht das Wohl der Gesellschaft.","Die Erde nicht besser managen, sondern in Symbiose (Zusammenleben zum gegenseitigen Nutzen) mit ihr leben."]},{"label":"Beispiel","values":["• Stecknadelfabrik: Ein Arbeiter allein schafft kaum 20 Nadeln am Tag. Zehn Arbeiter mit je einem Handgriff schaffen zusammen rund 48.000.\n• «Nicht vom Wohlwollen des Metzgers, Brauers und Bäckers erwarten wir das, was wir zum Essen brauchen, sondern davon, dass sie ihre eigenen Interessen wahrnehmen.»","Feuer, Werkzeug, Landwirtschaft: Seit es sie gibt, hält der Mensch seine Umwelt auf Kosten der Erde aufrecht."]},{"label":"Prüfstein: Ultimatumspiel","values":["• Aus Smiths Gedanken wurde später das Modell des Homo oeconomicus: rational, eigennützig, nutzenmaximierend (holt für sich das Meiste heraus). Es ist ein idealisiertes, also bewusst vereinfachtes Modell.\n• Ultimatumspiel: A teilt einen Betrag, B nimmt an oder lehnt ab. Lehnt B ab, bekommen beide nichts. Der Homo oeconomicus müsste jedes Angebot annehmen, auch einen Euro von zehn.\n→ Viele lehnen unfaire Angebote ab: Menschen achten auch auf Fairness. Smith selbst schrieb auch eine Ethik des Mitgefühls (S6). Ausführlich: Vergleich Menschenmodelle."],"span":true},{"label":"Was erklärt sie gut?","values":["Erklärt den historisch einmaligen Wohlstand.","Zeigt die ökologischen Grenzen des Wachstums."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand (Lovelock):** Smith setzt eine unbegrenzte Natur voraus.\n• Ob der Wohlstand wirklich bei allen ankommt, lässt die unsichtbare Hand offen.\n• Sein Menschenbild prüft das Ultimatumspiel (siehe oben).","• **Stärkster Einwand:** Das Krankheitsbild ist eine Metapher, kein Argument.\n• Bleibt vage, wie ein Leben in Symbiose mit der Erde praktisch aussehen soll."]},{"label":"Fazit","values":["Smith zeigt, wie Eigeninteresse Wohlstand schafft. Lovelock zeigt, wie sich dieses Wachstum gegen die Erde wenden kann: Das Gemachte wendet sich gegen den Menschen."],"span":true},{"label":"Querverweise","values":["Verantwortung für die Folgen von Technik und Wachstum: Hans Jonas (S6, Vergleich Verantwortung). Vorgeschichte: Bacons «Wissen ist Macht» und Descartes' Ziel, uns zu «Herren und Besitzern der Natur» zu machen. Homo oeconomicus als Menschenbild: Vergleich Menschenmodelle. Bac 2026: Suzuki."],"span":true}]},"sprache":{"sem":"Anthropologie","name":"Zeichen und Bedeutung","leitfrage":"Woher hat ein Wort seine Bedeutung, und formt die Sprache unsere Welt?","conn":["menschenmodelle","rationalismus","wissenschaft","kommunikation"],"positions":["Natürliche Richtigkeit der Namen","Bedeutung durch Übereinkunft","Sprache baut die Gegenstandswelt","Bedeutung ist Gebrauch"],"rows":[{"label":"Einstieg","values":["Kann alles ein Zeichen sein? Peirce unterscheidet drei Arten von Zeichen: Ikon (verweist durch Ähnlichkeit: Piktogramm, Landkarte), Index (durch einen realen Zusammenhang: Rauch für Feuer, Fußspur) und Symbol (durch Festlegung: Wörter, Ampelfarben). Ein Zeichen steht immer «für jemanden» für etwas: Rauch wird erst für den Förster, der ihn deutet, zum Zeichen. Frege: Jeder darf «irgendeinen willkürlich hervorzubringenden Vorgang oder Gegenstand zum Zeichen für irgendetwas» nehmen. Alles kann ein Zeichen werden, sobald es jemand deutet; nicht alles ist schon eines."],"span":true},{"label":"Hauptvertreter","values":["**Kratylos** (Gesprächspartner in Platons Dialog)","**John Locke** (1632-1704); Hermogenes (bei Platon), Ferdinand de Saussure (1857-1913)","**Ernst Cassirer** (1874-1945); Hans Lenk (1935-2024)","**Ludwig Wittgenstein** (1889-1951)"]},{"label":"Hauptwerk","values":["Platon: **Kratylos**, 383a-384e","**Versuch über den menschlichen Verstand** (1690), III, 2","**Die Sprache und der Aufbau der Gegenstandswelt** (1932); Lenk: **Das flexible Vielfachwesen**","**Philosophische Untersuchungen** (1953)"]},{"label":"Merksatz","values":["Jedes Ding hat von Natur einen richtigen Namen, für alle Menschen derselbe.","Wörter bezeichnen die Ideen des Sprechers, aufgrund einer willkürlichen Festlegung.","Sprache benennt keine fertigen Dinge, sie baut die Welt der Gegenstände mit auf.","«Die Bedeutung eines Wortes ist sein Gebrauch in der Sprache.»"]},{"label":"Grundannahmen","values":["• Die Richtigkeit der Namen ist von Natur gegeben, für Griechen und Nichtgriechen dieselbe.\n• Ein Name kann deshalb zur Sache passen oder nicht.\n• Kratylos begründet das nicht; Platon lässt den Streit im Dialog offen.","• Arbiträr (nicht von Natur begründet): Saussure verbindet Bezeichnendes (Lautbild) und Bezeichnetes (Vorstellung) durch die Regeln einer Sprache.\n• Willkür heißt nicht Beliebigkeit: Der Sprachgebrauch begrenzt sie.","• Animal symbolicum (symbolisches Tier): Der Mensch zieht ein künstliches Netz aus Symbolen über die Welt.\n• Metastufe (Lenk): Nur der Mensch kann über seine Symbole nachdenken und sich auf Abwesendes beziehen.","• Augustinisches Bild (jedes Wort steht für einen Gegenstand): Es passt nur auf einen Teil der Sprache.\n• Sprachspiel: Sprache ist mit Tätigkeiten verwoben."]},{"label":"Woher hat ein Wort Bedeutung?","values":["Aus der Sache selbst: Der richtige Name passt von Natur zu dem, was er benennt.","• Aus Übereinkunft und Gewohnheit.\n• Wörter bezeichnen nicht die Dinge, sondern die Ideen im Kopf des Sprechers.","• Aus Konvention (Übereinkunft), aber das Wort ordnet zugleich die Wahrnehmung.","• Aus dem gemeinsamen Gebrauch in einem Sprachspiel."]},{"label":"Ist Bedeutung privat oder öffentlich?","values":["Weder noch: Sie liegt in der Sache und ist für alle Menschen dieselbe.","Privat: Die Bedeutung ist «auf die Ideen dessen beschränkt, der sie gebraucht».","Geteilt: Der Mensch lebt in einem gemeinsamen Netz aus Symbolen mit konventioneller Bedeutung.","• Öffentlich: Bedeutung entsteht in einer gemeinsamen Lebensform, nicht im Inneren des Einzelnen.\n→ Eine Privatsprache, die nur einer versteht, wäre keine Sprache."]},{"label":"Formt Sprache die Welt?","values":["-","Nein: Die Ideen sind zuerst da, die Wörter werden ihnen zugeordnet.","• Ja: Sprache ist ein Mittel der Gegenstandsbildung, kein nachträgliches Etikett. Die Vorstellungen bilden sich erst mit den Wörtern.\n• Sapir-Whorf-Hypothese (Sprache prägt das Denken): Die Forschung stützt nur die schwache Fassung (sprachliche Relativität).\n→ Sprache lenkt Aufmerksamkeit und Gewohnheiten, sie sperrt uns nicht ein.","Die Grenzen meiner Sprache sind die Grenzen der Sprachspiele, an denen ich mit anderen teilnehme."]},{"label":"Beispiel","values":["• Kuckuck: Das Wort klingt wie der Vogel.\n• Bouba und Kiki: Fast alle Menschen nennen die zackige Form Kiki.\n• Hermogenes heißt Sohn des Hermes, hat aber nie Glück mit dem Geld.","• Nicht einmal Kaiser Augustus konnte ein neues lateinisches Wort schaffen.\n• Hermogenes: Gibt man einem Sklaven einen neuen Namen, ist er so richtig wie der alte.","• Aphasie (Sprachverlust nach Hirnverletzung): Ein Patient ohne Farbwörter sieht jede Nuance, ordnet sie aber keinem Grundton mehr zu.\n• Bienentanz, Washoe, Kanzi: Tiere verwenden Zeichen, aber ohne Metastufe.","• Käfer in der Schachtel: Niemand sieht den Käfer des anderen, trotzdem gebrauchen alle das Wort gemeinsam.\n• «fünf rote Äpfel»: Für fünf gibt es keinen Gegenstand.\n• «Platte!» benennt nichts, es ist ein Befehl."]},{"label":"Was erklärt sie gut?","values":["Warum manche Laute zur Sache zu passen scheinen (Lautmalerei, Bouba und Kiki).","Warum dieselbe Sache in jeder Sprache anders heißt und warum Missverständnisse möglich sind.","Die Sonderstellung des Menschen, und zwar so, dass man sie an Tierbefunden prüfen kann.","Wie Verständigung möglich ist, ohne in fremde Köpfe zu schauen."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Der Hund heißt in jeder Sprache anders; selbst der Kuckuck heißt auf Dänisch gøg.\n• Offen bleibt, woran man die richtige Benennung erkennt.\n• Saussure: Auch lautmalerische Wörter sind keine natürlichen Zeichen.","• **Stärkster Einwand:** Wittgenstein (Käfer): Bedeutung kann nicht privat sein. Locke erklärt nicht, wie Verständigung trotz privater Ideen gelingt.\n• Lautmalerei und Bouba-Kiki zeigen: Nicht alles ist völlig willkürlich.","• **Stärkster Einwand:** Ob Tieren die Metastufe fehlt, ist eine empirische Frage und umstritten.\n• Die starke Fassung der Sapir-Whorf-Hypothese (ohne Wort kein Denken) ist widerlegt: Das russische Blau zeigt nur eine Wirkung, solange man dabei innerlich spricht.","• **Stärkster Einwand:** Wenn Bedeutung Gebrauch ist: Kann sich dann eine ganze Gemeinschaft irren?\n• Gilt nach Wittgenstein selbst nur «für eine große Klasse von Fällen».\n• Erklärt, wie Wörter gebraucht werden, aber kaum, warum sich ein Gebrauch durchsetzt."]},{"label":"Achtung","values":["Tractatus 5.6 (Frühwerk): «Die Grenzen meiner Sprache bedeuten die Grenzen meiner Welt.» Gemeint ist die Grenze des sinnvoll Sagbaren, nicht: Wer weniger Wörter hat, hat weniger Welt. Den Satz nicht mit der Sapir-Whorf-Hypothese verwechseln. Das Spätwerk (Philosophische Untersuchungen) kritisiert das Sprachbild des Frühwerks. Wittgenstein leugnet keine Schmerzen und Gefühle; er bestreitet nur, dass Wörter ihre Bedeutung durch Zeigen auf etwas Inneres bekommen."],"span":true},{"label":"Fazit","values":["Die Bedeutungen der Wörter sind nicht von Natur gegeben (gegen Kratylos), sie liegen auch nicht im einzelnen Kopf (gegen Locke), sondern im gemeinsamen Gebrauch (Wittgenstein). Der Mensch ist ein animal symbolicum, aber seine Zeichen und ihre Bedeutungen macht er mit anderen: Sein Wesen wäre dann eine Fähigkeit, die nur im gemeinsamen Tun wirklich wird. Kommunikation und Medien (Grice, Platon, McLuhan): Vergleich Kommunikation."],"span":true}]},"kunst_mimesis":{"sem":"Anthropologie","name":"Ist Kunst Nachahmung?","leitfrage":"Ist Kunst Nachahmung der Natur?","conn":["kunst_urteil","platon","menschenmodelle"],"positions":["Nachahmung des Scheins","Nachahmung als Erkenntnis","Die Natur ahmt die Kunst nach"],"rows":[{"label":"Hauptvertreter","values":["**Platon** (428-348 v. Chr.)","**Aristoteles** (384-322 v. Chr.)","**Oscar Wilde** (1854-1900)"]},{"label":"Hauptwerk","values":["**Der Staat** (Politeia), Buch X","**Poetik**","**Der Verfall der Lüge** (The Decay of Lying, 1889)"]},{"label":"Merksatz","values":["Kunst ahmt nur den Schein nach und führt deshalb von der Wahrheit weg.","Nachahmen ist dem Menschen angeboren, und durch Kunst lernen wir, was etwas ist.","Nicht die Kunst ahmt die Natur nach, sondern wir sehen die Natur durch die Kunst."]},{"label":"Grundannahmen","values":["• Das wahre Wesen jedes Dinges ist die eine Idee.\n• Der Handwerker stellt nur ein Exemplar nach der Idee her.","• Das Nachahmen ist dem Menschen angeboren; darin ist er allen Lebewesen überlegen.\n• Der Mensch lernt zuerst durch Nachahmung.","• Wir sehen nur, was wir zu sehen gelernt haben."]},{"label":"Was ahmt Kunst nach?","values":["• Den Schein eines Dinges: Der Maler ahmt das Ding des Handwerkers nach, nicht die Idee.\n• Mimesis (griech. Nachahmung): Kunst ist Nachahmung einer Nachahmung.","Das Mögliche und Allgemeine: Der Dichter zeigt nicht, was geschehen ist, sondern was geschehen könnte.","• Umgekehrt: Nicht die Kunst ahmt die Natur nach, die Natur ahmt die Kunst nach.\n• «Life imitates Art far more than Art imitates Life.»"]},{"label":"Führt Kunst zur Wahrheit oder von ihr weg?","values":["• Weg von ihr: Der Maler hat kein Wissen von der Sache; das Gemälde steht noch eine Stufe weiter von der Wahrheit entfernt.\n• Nachahmende Kunst ist «nur eine Spielerei und keine ernstliche Beschäftigung».","• Zu ihr hin: Kunst ist ein natürlicher Weg zur Erkenntnis.\n• Dichtung zeigt das Allgemeine und ist deshalb «philosophischer und ernsthafter» als Geschichtsschreibung.","Kunst bildet nicht nur ab, sie prägt, wie wir die Welt sehen."]},{"label":"Wirkung auf die Zuschauer","values":["• Die Tragödie heizt die Gefühle an.\n→ Politisch: Platon verbannt die Dichter aus dem Staat (Zensur).","Katharsis (Reinigung): Die Tragödie reinigt von Furcht und Mitleid.","Sie lehrt sehen: Was wir sehen und wie, lehren uns Dichter und Maler."]},{"label":"Beispiel","values":["Ein Gemälde zeigt das Ding des Handwerkers nur so, wie es von einer Seite erscheint. Es steht also zwei Stufen von der Idee entfernt.","Bilder von Dingen, die wir in Wirklichkeit ungern sehen: Beim Betrachten freuen wir uns, weil wir lernen, was etwas ist.","Der Londoner Nebel «existiert» erst, seit die Kunst ihn erfand."]},{"label":"Was erklärt sie gut?","values":["Sie stellt die Grundfrage nach dem Verhältnis von Kunst und Wirklichkeit; sie wird bei Fotografie und KI-Bildern neu aktuell.","• Wie Platon: die Grundfrage nach Kunst und Wirklichkeit.\n• Warum Nachahmung Freude macht: Wir lernen dabei.","Warum Kunst prägt, wie wir sehen (Umkehrung der Mimesis)."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Nachahmung passt schlecht zu Musik, abstrakter Kunst und Konzeptkunst.\n• Aristoteles: Gerade Nachahmung lehrt, was etwas ist.\n• Hegel: Kunst zeigt das Wesen der Wirklichkeit (siehe Ausblick).","• **Stärkster Einwand:** Wie bei Platon passt Nachahmung schlecht zu Musik und abstrakter Kunst.\n• Nietzsche zweifelt an der Katharsis: Vielleicht werden die Zuschauer «ängstlicher und rührseliger», und «Plato behielte doch Recht».\n• Umstritten: Reinigt die Tragödie von Furcht und Mitleid oder durch sie?","• **Stärkster Einwand:** Zuspitzung: Nebel gab es auch, bevor Maler ihn darstellten.\n• Erklärt, wie Kunst unser Sehen prägt, aber nicht, was gute Kunst ist.\n• Unsere Wahrnehmung wird nicht nur von Kunst geprägt, sondern auch von Sprache und Wissenschaft."]},{"label":"Fazit","values":["Kunst ist mehr als Nachahmung: Aristoteles und Wilde gegen Platon."],"span":true},{"label":"Ausblick","values":["Hegel (1770-1831) dreht Platons Rangordnung um: Das Schöne ist «das sinnliche Scheinen der Idee», der Kunst kommt «die höhere Realität» zu. Benjamin: Durch technische Reproduktion verliert das Original seine Aura (seine Einmaligkeit). Hat ein KI-Bild, das es in tausend Varianten gibt, überhaupt ein Original? Querbezüge: Platons Ideenlehre und Höhlengleichnis (S6 Erkenntnistheorie); Kant: Wir erkennen von den Dingen a priori nur, was wir selbst in sie legen (vgl. Wilde)."],"span":true}]},"kunst_urteil":{"sem":"Anthropologie","name":"Schönheit und Kreativität","leitfrage":"Wie urteilen wir über Kunst, und wie entsteht sie?","conn":["kunst_mimesis","menschenmodelle","technologie"],"positions":["Maßstab des Geschmacks","Interesseloses Wohlgefallen und Genie","In Ketten tanzen","Kontext-Theorie"],"rows":[{"label":"Hauptvertreter","values":["**David Hume** (1711-1776)","**Immanuel Kant** (1724-1804)","**Friedrich Nietzsche** (1844-1900); zugespitzt bei **Vladimir Jankélévitch** (1903-1985)","**Marcel Duchamp** (1887-1968); gedeutet von **Arthur Danto** (1924-2013)"]},{"label":"Hauptwerk","values":["**Über den Maßstab des Geschmacks** (1757)","**Kritik der Urteilskraft** (1790)","**Menschliches, Allzumenschliches I** (1878); **Der Wanderer und sein Schatten** (1880); Jankélévitch: **Quelque part dans l'inachevé** (1978)","**Fountain** (Readymade)"]},{"label":"Merksatz","values":["Schönheit ist ein Gefühl, aber geschulte Kenner geben den Maßstab vor.","Schön ist, was ohne Interesse gefällt und trotzdem Zustimmung von allen erwartet.","Kreativ ist, wer in überlieferten Regeln tanzt und dabei neue Regeln schafft.","Kunst muss nicht schön sein; der Kontext macht einen Gegenstand zur Kunst."]},{"label":"Grundannahmen","values":["• Schönheit ist ein Gefühl, keine Eigenschaft der Dinge.\n• Manche Eigenschaften der Dinge rufen dieses Gefühl aber hervor.","• Das Angenehme beruht auf einem Privatgefühl und gilt nur für mich.\n• Das Urteil schön lässt sich aus keiner Regel mit Begriff beweisen.","• Jeder Künstler steht in überlieferten Formen und Regeln, schon Homer.\n• Jankélévitch: Schöpfung aus dem Nichts ist oft «eine Kette von Stereotypen».","• Duchamp: «Als ich Readymades entdeckte, ging es mir darum, die Ästhetik zurückzuweisen.»\n• Danto: Das Ästhetische (das Schöne und die sinnliche Wirkung) ist keine wesentliche Eigenschaft der Kunst."]},{"label":"Wer bestimmt, was schön ist?","values":["• Die wahren Kunstrichter: geschulte, vorurteilsfreie Kenner, deren Urteile übereinstimmen.\n→ Nicht jedes Urteil ist gleich richtig.","• Nicht die Kenner: Jeder muss selbst urteilen.\n• Wer etwas schön nennt, «mutet andern eben dasselbe Wohlgefallen zu».\n→ Das Urteil fordert Zustimmung nicht, es «sinnet nur jedermann diese Einstimmung an» (KU § 8).","-","• Schönheit entscheidet nicht darüber, ob etwas Kunst ist.\n• Entscheidend ist der Kontext, in dem ein Gegenstand gezeigt wird."]},{"label":"Wie entsteht Kunst?","values":["-","• Jede Kunst setzt Regeln voraus, aber schöne Kunst kann sich ihre Regel nicht ausdenken.\n→ Das Genie gibt der Kunst die Regel: Durch dieses angeborene Talent wirkt «die Natur im Subjekte».","• Durch Arbeit an überlieferten und selbstgelegten Regeln.\n• Erfindung ist ein neuer Zwang, den der Künstler sich auferlegt und «anmutig besiegt».\n→ Er schafft neue Regeln für die Kommenden.","Durch Auswahl: Der Künstler stellt einen fertigen Gegenstand aus, statt ihn herzustellen (Readymade)."]},{"label":"Kernbegriffe","values":["• Maßstab des Geschmacks: das vereinte Urteil feiner, geschulter, vorurteilsfreier Kenner.\n• Feinheit des Geschmacks: Bei der Weinprobe schmeckt Sancho Leder und Eisen heraus.","• Geschmacksurteil: Wohlgefallen «ohne alles Interesse» mit Anspruch auf Zustimmung aller. «Schön ist das, was ohne Begriff allgemein gefällt.»\n• Merkmale des Genies: Originalität, Exemplarität (Vorbildlichkeit), nicht erklärbar, nur in der schönen Kunst.","• In Ketten tanzen: «es sich schwer machen und dann die Täuschung der Leichtigkeit darüber breiten».\n• Jankélévitch: Die überall geforderte Kreativität ist «das große Fest der Schummler».","• Readymade: ein fertiger Gegenstand, den der Künstler nicht herstellt, sondern als Kunstwerk ausstellt.\n• Kontext-Theorie: Kunst wird ein Gegenstand durch den Zusammenhang, in dem er steht, nicht durch Schönheit."]},{"label":"Was erklärt sie gut?","values":["Warum wir über Geschmack streiten, obwohl wir ihn nicht beweisen können.","• Wie Hume: warum wir über Geschmack streiten, obwohl wir ihn nicht beweisen können.\n• Genie: warum Meisterwerke neu und zugleich vorbildlich sind.","Tradition und Neuerung zugleich; sie entzaubert den Geniekult.","Warum auch ein Gegenstand ohne Schönheit Kunst sein kann (Fountain)."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Zirkel: Wer bestimmt, wer ein Kenner ist?\n• Kant: Nicht die Kenner geben den Maßstab, jeder muss selbst urteilen.","• **Stärkster Einwand:** Schönheit erklärt Kunst nach Duchamp nicht mehr.\n• Bourdieu: Geschmack ist nicht interesselos; mit ihm grenzen sich soziale Klassen voneinander ab.\n• Genie als Naturgabe ist schwer überprüfbar und wurde historisch fast nur Männern zugesprochen.","• **Stärkster Einwand:** Erklärt, wie Neues entsteht, aber nicht, was es wertvoll macht.\n• Jankélévitch übertreibt polemisch.\n• Unterschätzt Werke, die bewusst mit der Tradition brechen (vgl. Duchamp).","• **Stärkster Einwand:** Wenn alles Kunst sein kann, fehlt ein Maßstab für gute und schlechte Kunst.\n• Verschiebt die Frage nur: Wer bestimmt den Kontext?\n• Der Bruch mit der Ästhetik setzt die Ästhetik voraus, gegen die er sich richtet."]},{"label":"Fazit","values":["Das Urteil über Kunst ist mehr als bloßer Geschmack (Hume, Kant), und ihr Schaffen ist weder reiner Regelbruch noch bloße Regelbefolgung (Kant, Nietzsche)."],"span":true},{"label":"Ausblick","values":["Ist eine KI kreativ? Die Frage ist offen. Maßstäbe: Kants Genie-Merkmale Originalität und Exemplarität sowie Nietzsches Frage, wer sich die Fessel auferlegt. Anders fragt: Ist die Maschine das bessere Genie? Benjamin: Hat ein KI-Bild, das es in tausend Varianten gibt, überhaupt eine Aura? Schiller sieht gerade im Zweckfreien das Menschliche: Der Mensch «ist nur da ganz Mensch, wo er spielt»."],"span":true}]},"identitaet":{"sem":"Anthropologie","name":"Personale und soziale Identität","leitfrage":"Sollte man in einer sich verändernden Welt der Gleiche bleiben?","conn":["essentialismus","sinn","menschenmodelle"],"positions":["Identität durch Bewusstsein","Identität als Kontinuität","Plurale Identität","Ästhetik der Existenz"],"rows":[{"label":"Hauptvertreter","values":["**John Locke** (1632-1704)","**Erik H. Erikson** (1902-1994)","**Wolfgang Welsch** (*1946)","**Michel Foucault** (1926-1984); Friedrich Nietzsche (1844-1900)"]},{"label":"Hauptwerk","values":["**Versuch über den menschlichen Verstand** (1694), II, 27","**Das Problem der Ich-Identität** (1959)","**Identität und ästhetisches Denken** (1990)","**Eine Ästhetik der Existenz** (1984); Nietzsche: **Die fröhliche Wissenschaft** (1882/87), Nr. 290"]},{"label":"Merksatz","values":["Ich bin dieselbe Person, soweit mein Bewusstsein zurückreicht.","Nach dem Ausprobieren der Jugend braucht der Mensch Festlegungen und Kontinuität.","Identität entsteht durch Identifikation; die Vielheit der Rollen soll man bejahen.","Man findet sich nicht, man gestaltet sein Leben wie ein Kunstwerk."]},{"label":"Grundannahmen","values":["• Drei Fragen: dieselbe Substanz (Stoff), derselbe Mensch (lebendiger Körper), dieselbe Person.\n• Person: «ein denkendes, vernünftiges Wesen», das sich zu verschiedenen Zeiten als dasselbe auffasst.","• Ich-Identität ist ein «dauerndes inneres Sich-Selbst-Gleichsein».\n• Dazu gehört die Zugehörigkeit zu einer Gruppe.","• In einer Gesellschaft der vielen Lebensstile gibt es keinen festen Personkern.\n• Identität entsteht «durch Identifikation».\n• Plurale Identität ist «aus Überzeugung» zu bejahen, frei vom «Einheits- und Ganzheitsdruck».","• Antike Ethik: «seinem eigenen Leben eine bestimmte Form zu geben».\n• Moral als «Gehorsam gegenüber einem Kodex von Regeln» verschwindet; an ihre Stelle tritt eine Ästhetik der Existenz.\n• Nietzsche: Kräfte und Schwächen überblicken und in einen «künstlerischen Plan» fügen."]},{"label":"Was macht mich zur selben Person?","values":["• Das Bewusstsein: Soweit es sich «rückwärts auf vergangene Handlungen oder Gedanken ausdehnen kann», reicht die Person.\n• Ob Körper oder Seele gleich bleiben, ist gleichgültig.\n→ Person ist auch ein Begriff der Verantwortung.","Das Gefühl der Kontinuität und die Anerkennung durch die anderen.","Kein Kern, sondern wechselnde Identifikationen mit Lebensstilen und Rollen.","Kein vorgefundener Kern, sondern die Form, die ich meinem Leben gebe."]},{"label":"Soll ich gleich bleiben?","values":["Locke beantwortet die Frage nicht: Er beschreibt, was Identität ist, er bewertet nicht.","Ja: Ohne Festlegungen «fürs Leben» droht die Identitätskrise.","Nein: Die Klage über Identitätsverlust ist ein «konservatives Lamento».","Weder einen Kern bewahren noch sich in Rollen auflösen, sondern sich gestalten, mit «langer Übung und täglicher Arbeit»."]},{"label":"Beispiel","values":["Fürst und Schuhflicker: Zieht die Seele des Fürsten mit seinen Erinnerungen in den Körper eines Schuhflickers, ist er dieselbe Person wie der Fürst, aber nicht derselbe Mensch.","Das Kinderfoto: Kontinuität bildet eine «Brücke» zwischen dem Kind, das ich war, und dem Erwachsenen, der ich werde.","Jemand ist zugleich Schülerin, Fußballerin, Luxemburgerin und Gamerin, ohne dass eine dieser Rollen die eigentliche ist.","• Das eigene Leben als «persönliches Kunstwerk».\n• Nietzsche: «Seinem Charakter ‚Stil geben‘ - eine große und seltene Kunst!»"]},{"label":"Was erklärt sie gut?","values":["Die beschreibende Frage: was mich über die Zeit zur selben Person macht (dieselbe Person, nicht derselbe Mensch).","Die wertende Frage aus Sicht der Jugend: warum ohne Festlegungen eine Identitätskrise droht.","Die wertende Frage in einer Gesellschaft der vielen Lebensstile: Identität ohne festen Personkern.","-"]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Reid (tapferer Offizier): Der General ist derselbe wie der Junge und zugleich nicht; das Kriterium widerspricht sich.\n• Vergessen: Wer sein Gedächtnis verliert, wäre nicht mehr dieselbe Person.\n• Verdoppelung (Teleporter): Kopie und Original wären dieselbe Person. Parfit folgert: Wichtig ist, wie stark Erinnerungen, Absichten und Charakter verbunden bleiben, eine Frage des Grades.","• **Stärkster Einwand:** Die Festlegung kann zur Unaufrichtigkeit (Selbstbetrug) werden (Sartre: «Ich bin halt so»).\n• Wer vielfältig lebt, erscheint als Krisenfall.","• **Stärkster Einwand:** Vielheit kann in Beliebigkeit kippen.\n• Offen bleibt, wer sich da identifiziert, wenn es keinen Kern gibt.","• **Stärkster Einwand:** Freiheit oder neuer Leistungsdruck? Auch Selbstgestaltung kann zur Pflicht werden.\n• Ohne Regelkodex bleibt offen, was eine gelungene Lebensform ausmacht.\n• Setzt Zeit und Mittel für «lange Übung» voraus."]},{"label":"Fazit","values":["Das Sich-selbst-Machen hat Grenzen: die Erinnerung (Locke) und die anderen, die einen anerkennen (Erikson). Das Wesen des Menschen besteht darin, kein fertiges Wesen zu haben, sondern sich unter Bedingungen, die er nicht gewählt hat, selbst zu gestalten."],"span":true},{"label":"Querverweise","values":["Sartre und Unaufrichtigkeit (Vergleich Essentialismus); Sinn des Lebens (Vergleich Sinn); Locke als Empirist (Erkenntnistheorie S6)."],"span":true}]},"widerstand":{"sem":"Politische Philosophie","name":"Gehorsam, ziviler Ungehorsam oder Widerstand?","leitfrage":"Wann ist Regelverstoß moralisch erlaubt - und wann darf man sogar Widerstand leisten?","conn":["naturrecht","menschenrechte","vertragstheorie","liberalismus"],"positions":["Pflicht zum Rechtsgehorsam","Ziviler Ungehorsam","Widerstandsrecht"],"rows":[{"label":"Hauptvertreter","values":["**Norbert Hoerster** (*1937)","**Jürgen Habermas** (1929-2026); auch: **Henry David Thoreau** (1817-1862)","**Robert Spaemann** (1927-2018); Tradition: **John Locke** (1632-1704)"]},{"label":"Hauptwerk","values":["**Die moralische Pflicht zum Rechtsgehorsam** (in: Recht und Moral, 1977)","**Ziviler Ungehorsam** (1983); Thoreau: **Über die Pflicht zum Ungehorsam gegen den Staat** (1849)","**Moral und Gewalt** (in: Philosophische Essays, 1994)"]},{"label":"Merksatz","values":["Wer erwartet, dass andere dem Recht gehorchen, muss selbst gehorchen.","Ziviler Ungehorsam bricht einzelne Gesetze, damit die Mehrheit ihre Entscheidung überdenkt.","Wenn alle legalen Türen zu sind, darf man durch die Mauer."]},{"label":"Definition","values":["Es gibt eine moralische Pflicht, dem geltenden Recht zu gehorchen, auch einem Gesetz, das man für ungerecht hält.","Bewusster, öffentlicher, gewaltfreier Gesetzesbruch aus moralischen Gründen, innerhalb der demokratischen Grundordnung.","Das Recht (oder die Pflicht), sich gegen eine illegitime oder tyrannische Herrschaft zu wehren, wenn legale Wege versperrt sind."]},{"label":"Wann ist der Regelbruch erlaubt?","values":["• Kein Kriterium: Die Pflicht gilt auch für Gesetze, die man für ungerecht hält.\n• Sie setzt eine im Ganzen gerechte Ordnung voraus. Wann sie endet, lässt Hoerster offen.","**Habermas' Bedingungen** (Definition nach Rawls)\n• moralisch begründet, nicht aus Eigeninteresse\n• verletzt einzelne Normen, nicht die Rechtsordnung im Ganzen\n• nur im intakten Rechtsstaat, mit Berufung auf die für alle einsichtigen Prinzipien der Verfassung\n→ Die drei übrigen Kriterien betreffen die Form (Zeile Offen, gewaltfrei, Strafe annehmen?).","**Spaemanns drei Kennzeichen** des Unrechtsstaats\n• Beseitigung der Redefreiheit\n• Verbot der Auswanderung\n• gesetzliche Unmöglichkeit, Unrecht auf rechtlichem Weg abzuschaffen"]},{"label":"Grundannahmen","values":["• Test: Was wäre, wenn alle so handelten? Beispiele: nicht wählen, die Berghütte des Vereins nutzen, ohne mitzuarbeiten.\n• Jeder profitiert von der Rechtsordnung, ihre Vorteile überwiegen die Opfer. Sie besteht nur, weil die meisten gehorchen.\n• Trittbrettfahrer: Wer sich ausnimmt, genießt Vorteile, die erst der Gehorsam der anderen möglich macht.","• Auch in einer Demokratie können legale Gesetze illegitim sein (z. B. Rassentrennung in den USA).\n• Thoreau: Das Gewissen steht über dem Gesetz. Wer einem Staat, der Unrecht tut, Steuern zahlt, macht sich mitschuldig.","• Ziviler Ungehorsam setzt einen Staat voraus, der zuhört. Fehlt er, bleibt nur Widerstand.\n• Locke: Das Volk darf sich gegen eine Regierung wehren, die sein Vertrauen bricht.\n• Art. 20 Abs. 4 GG (seit 1968): Widerstand gegen jeden, der die verfassungsmäßige Ordnung beseitigen will, wenn andere Abhilfe nicht möglich ist. Es schützt die Ordnung und ist kein Freibrief."]},{"label":"Erkennt sie die Rechtsordnung an?","values":["• Ganz: Man gehorcht auch Gesetzen, die man für ungerecht hält.","• Im Ganzen ja, einzelne Normen nein (Habermas, Rawls).\n• Ausnahme Thoreau: Er verweigert dem Staat insgesamt die Anerkennung und passt eher zu einer naturrechtlichen Position.","• Nein: Sie spricht der Ordnung die Legitimität ab, weil sie sich gegen das Gemeinwohl oder die Verfassung richtet."]},{"label":"Ziel","values":["Die Rechtsordnung erhalten, von der alle profitieren.","Auf konkrete Ungerechtigkeiten aufmerksam machen. Die Mehrheit soll eine Entscheidung noch einmal überdenken.","Die Unrechtsordnung beseitigen oder die Verfassung wiederherstellen; Freiheit und Menschenrechte schützen."]},{"label":"Offen, gewaltfrei, Strafe annehmen?","values":["• Entfällt: Hoerster rechtfertigt keinen Regelbruch.","• öffentlich und in der Regel angekündigt: Ein Appell, den niemand hört, ist keiner.\n• symbolisch, deshalb gewaltfrei: Gewalt zwingt, statt zu überzeugen.\n• bereit, für die Folgen einzustehen: Wer die Strafe annimmt, zeigt, dass er die Ordnung anerkennt.\n• Thoreau: gewaltfrei, nimmt die Strafe an (eine Nacht im Gefängnis, 1846).","• Auch verdeckt: Ein Unrechtsstaat hört nicht zu. Ankündigen und die Strafe annehmen bringen dort niemanden zum Nachdenken.\n• Im äußersten Fall auch mit Gewalt.\n→ Widerstand ist letztes Mittel."]},{"label":"Beispiel","values":["• Sokrates in Platons Kriton: Er lehnt die Flucht aus dem Gefängnis ab. Er hat von Athens Gesetzen profitiert und hätte auswandern können.","• Gandhi: Salzmarsch (Indien, 1930)\n• Rosa Parks (1955), Martin Luther King, Bürgerrechtsbewegung\n• Sitzblockaden gegen die Raketenstationierung (1983)\n• Klima-Blockaden (umstritten, siehe Kritikpunkte)","• Weiße Rose (1943) und Attentat vom 20. Juli 1944\n• Französische Résistance (1940-45)\n• Solidarność in Polen (1980-89), Arabischer Frühling (ab 2010)"]},{"label":"Was erklärt sie gut?","values":["• Rechtsgehorsam ist keine Unterwerfung, sondern Gleichbehandlung aller (Fairnessargument).","• Klare, öffentlich überprüfbare Kriterien. Versöhnt Ungehorsam mit Demokratie.\n• Thoreau: nimmt die Verantwortung des Einzelnen ernst; historisch wirksam (Gandhi, Bürgerrechtsbewegung).","• Zeigt, wo die Pflicht zum Gehorsam endet: Spaemanns Kennzeichen machen den Unrechtsstaat erkennbar.\n• Erklärt, warum das Kriton-Argument dort nicht trägt: Wer nicht auswandern darf, hat den Gesetzen nicht stillschweigend zugestimmt."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Setzt voraus, dass die Vorteile der Ordnung für jeden überwiegen. Für Sklaven um 1850 oder für Rosa Parks stimmte das nicht.\n• Habermas' Einwand: Wer offen handelt, die Strafe annimmt und die Ordnung anerkennt, ist kein Trittbrettfahrer. Er appelliert an die Mehrheit.","• **Stärkster Einwand:** Die Kriterien prüfen nur die Form, nicht ob das Anliegen berechtigt ist. Klima-Blockade und Corona-Demo können beide alle Merkmale erfüllen.\n• Was für alle einsichtig ist, ist selbst umstritten.\n• Thoreau: Wenn jeder nur seinem Gewissen folgt, fehlt eine Grenze. Auch ein Gewissen kann irren.","• **Missbrauch:** Die Berufung auf Widerstand kann missbraucht werden. Art. 20 Abs. 4 GG ist kein Freibrief gegen jede Entscheidung, die man für falsch hält.\n• Schwer zu begrenzen: Gefahr von Gewaltspiralen.\n• Gefährdet Ordnung und Sicherheit."]},{"label":"Fazit","values":["• Im Normalfall bindet das Recht, auch wenn es Fehler hat. Es gibt aber eine Grenze: nicht das private Gewissen, sondern Grundsätze, die alle teilen können, bei Habermas die Prinzipien der Verfassung.\n• Wo ein Staat seine Legitimität verloren hat, endet der zivile Ungehorsam und beginnt der Widerstand."],"span":true},{"label":"Querverweise","values":["• Vertragstheorie: Locke kennt ein Widerstandsrecht des Volkes, Hobbes nur das Recht des Einzelnen, sein Leben zu verteidigen.\n• Naturrecht: Radbruchsche Formel (Grenze des Unerträglichen)."],"span":true}]},"kommunikation":{"sem":"Anthropologie","name":"Kommunikation und Medien","leitfrage":"Ist Gesprochenes stets explizite Kommunikation?","conn":["sprache","technologie","essentialismus"],"positions":["Mehr gemeint als gesagt","Das Medium bestimmt mit"],"rows":[{"label":"Einstieg","values":["«Es zieht», sagt die Lehrerin, und Lea schließt das Fenster. Gesagt wurde nur etwas über die Luft, gemeint war eine Bitte. Sagen wir immer, was wir meinen? Und was verändert sich, wenn Sprache aufgeschrieben oder gechattet wird?"],"span":true},{"label":"Hauptvertreter","values":["**H. Paul Grice** (1913-1988); John L. Austin (1911-1960), John R. Searle (1932-2025)","**Platon** (428-348 v. Chr.); **Marshall McLuhan** (1911-1980)"]},{"label":"Hauptwerk","values":["**Logik und Konversation** (1975)","Platon: **Phaidros**, 274c-275e; McLuhan: **Die magischen Kanäle** (1964)"]},{"label":"Merksatz","values":["Wir meinen oft mehr, als wir sagen, und geben es durch Implikaturen zu verstehen.","Das Medium bestimmt mit, was ankommt: «Das Medium ist die Botschaft.»"]},{"label":"Grundannahmen","values":["• Kooperationsprinzip: Gesprächspartner unterstellen einander, kooperativ zu sein.\n• Vier Maximen (Erwartungen, keine Gesetze): Quantität (so viel wie nötig), Qualität (nichts Falsches), Relation (etwas Relevantes), Modalität (klar).\n• Austin: Sprechen ist Handeln. Wir versprechen, warnen, taufen, befehlen.","• Thamus (bei Platon): Die Schrift bringt Vergessen statt Gedächtnis und den Schein der Weisheit statt Weisheit.\n• Sokrates: Ein Text sagt «nur ein und dasselbe stets», weiß nicht, «zu wem er reden soll», und kann sich nicht verteidigen.\n• McLuhan: Entscheidend ist der neue Maßstab, den ein Medium für das Zusammenleben setzt."]},{"label":"Was wird mitgeteilt?","values":["• Mehr als gesagt: Der Sprecher gibt etwas zu verstehen, ohne es zu sagen (Implikatur).\n→ Scheint jemand eine Maxime zu verletzen, halten wir ihn trotzdem für kooperativ und schließen, dass er etwas anderes meint.","• Nicht nur ein Inhalt: Das Medium bestimmt mit, was ankommt.\n→ Entscheidend ist nicht nur, was ein Medium transportiert, sondern wie es unser Zusammenleben verändert."]},{"label":"Welche Rolle spielt die Situation?","values":["Implikaturen brauchen eine Situation: Ton, Gesicht, die Möglichkeit nachzufragen.","Der Schrift fehlt die Situation: Sie kann nicht antworten und weiß nicht, wer sie liest."]},{"label":"Kernbegriffe","values":["• Implikatur: das Gemeinte, nicht Gesagte. Sie lässt sich streichen («Die Musik war gut, und der Rest übrigens auch»).\n• Sprechakt (Austin): lokutionär (was gesagt wird), illokutionär (was man damit tut, etwa bitten), perlokutionär (was man damit bewirkt).\n• Indirekter Sprechakt (Searle): der Form nach eine Feststellung, als Handlung eine Bitte.","• Medium: das Mittel, durch das eine Mitteilung geht (Stimme, Schrift, Chat, KI).\n• Theuth und Thamus: Der Gott Theuth bietet die Schrift als Mittel für Verstand und Gedächtnis an, König Thamus widerspricht."]},{"label":"Beispiel","values":["• Das Empfehlungsschreiben: Der Professor lobt nur die Sprache und die Anwesenheit des Studenten. Gemeint ist: Als Philosoph ist er nicht gut.\n• Arbeitszeugnis: «Sie hat sich bemüht» heißt dort schwach.\n• «Es zieht»: Feststellung, gemeint als Bitte.","• Ein «ok.» im Chat misslingt leichter als im Gespräch.\n• Wer fragt, ob man mit KI noch etwas auswendig lernen muss, führt Thamus' Streit weiter."]},{"label":"Ist das Gemeinte gelogen?","values":["Nein: Wer nur andeutet, lügt nicht, weil sich die Implikatur streichen lässt. Er ist aber für das Gemeinte verantwortlich.","-"]},{"label":"Was erklärt sie gut?","values":["Alltagsphänomene wie Andeutung und Ironie; lässt sich auf KI und soziale Medien anwenden.","Missverständnisse im Chat; lässt sich auf KI und soziale Medien anwenden."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Grices Maximen sind auf westliche Gesprächskulturen zugeschnitten.","• **Stärkster Einwand:** Die Schriftkritik von Thamus und Sokrates wird uns nur durch die Schrift überliefert."]},{"label":"Fazit","values":["Gesprochenes ist selten nur explizit. Was implizit bleiben kann, hängt an der Situation und am Medium. Der Mensch ist ein animal symbolicum, aber seine Zeichen, ihre Bedeutungen und ihre Medien macht er mit anderen."],"span":true},{"label":"Querverweise","values":["Zeichen und Bedeutung (Vergleich Sprache); McLuhans Medien als «Ausweitungen» und Gehlens Organersatz, KI als neues Medium (Vergleich Technik); performative Sprache bei Butler (Vergleich Essentialismus); Habermas, herrschaftsfreier Diskurs, und Macht der Sprache (Framing) (Politische Philosophie S7). Bac-Frage: Verändern neue Medien unser Denken?"],"span":true}]}};
const BEGRIFFE=[{"term":"Erkenntnistheorie (Epistemologie)","definition":"Die Erkenntnistheorie fragt: Was können wir überhaupt wissen -\nund wie können wir es begründen?\nSie untersucht die Quellen, Grenzen und Bedingungen menschlichen\nWissens.\nBeispiel: Weißt du wirklich, dass du gerade diesen Text liest -\noder könntest du träumen?","sem":"Erkenntnistheorie","fw_id":null},{"term":"Wissen","definition":"Wissen ist mehr als ein starkes Gefühl. Es setzt drei Dinge\nvoraus: Die Aussage muss wahr sein, du musst sie für wahr halten\nund du musst sie begründen können.\nStarker Glaube allein reicht nicht.\nBeispiel: Aristoteles glaubte, Männer hätten mehr Zähne als\nFrauen - er hat einfach nicht nachgezählt.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Meinung (doxa)","definition":"Eine Meinung ist eine subjektive Überzeugung ohne gesicherte\nBegründung. Sie kann richtig sein - muss es aber nicht.\nFür eine Meinung kann man keinen allgemeinen Wahrheitsanspruch\nerheben.\nBeispiel: „Dieser Film ist der beste aller Zeiten.\" - Das ist\neine Meinung, keine Tatsache.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Glaube (belief / faith)","definition":"Glaube ist eine tiefere, langfristige Überzeugung - stärker als\nMeinung, aber noch kein Wissen.\nFür ihren Glauben waren Menschen bereit zu sterben. Auch der\nstärkste Glaube garantiert keine Wahrheit.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Wahrheit","definition":"Eine Aussage ist wahr, wenn sie mit der Wirklichkeit\nübereinstimmt. Wahrheit ist der Maßstab, an dem Erkenntnis\ngemessen wird.\nBeispiel: „Der Eiffelturm steht in Paris\" ist wahr, weil es\ntatsächlich so ist.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Zweifel","definition":"Zweifel bedeutet, Überzeugungen aktiv in Frage zu stellen. In\nder Philosophie ist Zweifel kein Zeichen von Schwäche, sondern\noft der Anfang echter Erkenntnis.\nBeispiel: Descartes zweifelt an allem - um herauszufinden, was\nwirklich sicher ist.","sem":"Erkenntnistheorie","fw_id":null},{"term":"A priori / A posteriori","definition":"A priori = vor aller Erfahrung gültig, unabhängig von\nBeobachtung.\nA posteriori = durch Erfahrung gewonnen, abhängig von\nBeobachtung.\nBeispiel a priori: 2+2=4 - gilt, ohne je überprüft worden zu\nsein.\nBeispiel a posteriori: „Es regnet draußen\" - weiß ich nur, wenn\nich nachgeschaut habe.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Induktion","definition":"Vom Einzelnen zum Allgemeinen schließen. Aus vielen\nBeobachtungen wird ein allgemeines Gesetz abgeleitet.\nProblem (Hume): Das ist nie vollständig sicher - die Zukunft\nkönnte immer anders sein als die Vergangenheit.\nBeispiel: „Alle Schwäne, die ich je gesehen habe, sind weiß -\nalso sind alle Schwäne weiß.\" Bis jemand Australien besucht.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Deduktion","definition":"Vom Allgemeinen zum Besonderen schließen. Aus einem Prinzip wird\nein konkreter Schluss gezogen.\nBeispiel: „Alle Menschen sind sterblich. Sokrates ist ein Mensch.\nAlso ist Sokrates sterblich.\"","sem":"Erkenntnistheorie","fw_id":null},{"term":"Skeptizismus","definition":"Der Skeptizismus bezweifelt grundsätzlich, ob sicheres Wissen\nmöglich ist. Statt Behauptungen aufzustellen, empfehlen\nSkeptiker, das Urteil zurückzuhalten.\nZiel ist nicht Resignation, sondern kritisches Denken.\nBeispiel: Ein Skeptiker fragt bei jeder Behauptung: Wie weißt du\ndas? Woher kommt diese Information?","sem":"Erkenntnistheorie","fw_id":null},{"term":"Epoché (Urteilsenthaltung)","definition":"Die skeptische Empfehlung, kein endgültiges Urteil zu fällen,\nwenn man es nicht sicher wissen kann.\nBeispiel: „Ich weiß nicht genug, um das zu beurteilen\" - das ist\nEpoché, keine Feigheit.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Ataraxie","definition":"Seelenruhe - der Zustand innerer Gelassenheit, den Skeptiker\nanstreben. Wer nicht ständig nach absoluter Gewissheit sucht,\nlebt ruhiger.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Traumargument","definition":"Du kannst nicht mit Sicherheit wissen, ob du gerade wach bist\noder träumst. Im Traum fühlt sich alles genauso real an wie im\nWachzustand.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Rationalismus","definition":"Wissen kommt aus der Vernunft, nicht aus den Sinnen. Die Sinne\ntäuschen uns - der Verstand kann zu sicheren, notwendigen\nWahrheiten gelangen.\nBeispiel: Mathematische Wahrheiten wie 2+2=4 gelten unabhängig\nvon sinnlicher Erfahrung.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Methodischer Zweifel","definition":"Descartes' Methode: Man zweifelt systematisch an allem, um eine\nunerschütterliche Wahrheit zu finden. Kein echter Zweifel,\nsondern ein Denkwerkzeug - Skepsis als Mittel, nicht als Ziel.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Böser Dämon (malin génie)","definition":"Was, wenn ein mächtiger Dämon uns in allem täuscht - sogar in\nMathematik und einfachsten Sinneswahrnehmungen?\nZweck: Herausfinden, ob es etwas gibt, das selbst ein Täuscher\nnicht erschüttern kann.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Cogito ergo sum","definition":"„Ich denke, also bin ich.\" - Descartes' berühmtester Satz.\nSelbst wenn alles andere unsicher ist: Das Denken selbst beweist,\ndass man existiert. Denn um getäuscht zu werden, muss man denken\n- und wer denkt, existiert.\nBeispiel: Du kannst daran zweifeln, ob dein Stuhl real ist. Aber\nnicht daran, dass du gerade zweifelst.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Angeborene Ideen","definition":"Ideen, die nicht aus der Erfahrung stammen, sondern von Geburt an\nim Geist vorhanden sind.\nDescartes: Ideen wie Gott oder Unendlichkeit müssen angeboren\nsein - wir könnten sie nie sinnlich erfahren.\nLocke widerspricht: Wären sie angeboren, müssten Kleinkinder sie\nschon kennen.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Dualismus","definition":"Zwei grundlegende, voneinander unabhängige Wirklichkeiten:\nres extensa (ausgedehnte, materielle Substanz - Körper) und\nres cogitans (denkende, immaterielle Substanz - Geist).\nProblem: Wie interagieren sie miteinander?","sem":"Erkenntnistheorie","fw_id":null},{"term":"Solipsismus","definition":"Nur ich selbst existiere sicher. Alles andere - andere Menschen,\ndie Außenwelt - könnte nur eine Vorstellung in meinem Bewusstsein\nsein.\nProblem: Diese Position kann man nicht sinnvoll mit anderen\ndiskutieren - sie ist selbstwiderlegend.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Empirismus","definition":"Alles Wissen kommt aus der Erfahrung. Der Geist ist zu Beginn\nleer - erst durch Sinneseindrücke entsteht Wissen.\nVertreter: John Locke, David Hume.\nBeispiel: Ein Kind kennt keine Farben, Töne oder Formen - all\ndas wird durch Erfahrung gelernt.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Tabula rasa","definition":"„Unbeschriebenes Blatt\" - Lockes Bild für den menschlichen Geist\nbei der Geburt. Kein Vorwissen, keine angeborenen Ideen. Alles\nschreiben Erfahrungen auf dieses Blatt.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Kausalität","definition":"Die Überzeugung, dass jedes Ereignis eine Ursache hat.\nHume: Wir beobachten nur, dass Dinge aufeinander folgen - nicht\ndass sie notwendig zusammenhängen. Der Glaube an Kausalität ist\neine Gewohnheit, kein bewiesenes Naturgesetz.\nBeispiel: Wir sehen immer: Feuer brennt, Wärme entsteht. Aber\nwir sehen die Notwendigkeit dieses Zusammenhangs nicht.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Kritizismus (Kant)","definition":"Kant verbindet Empirismus und Rationalismus: Erkenntnis beginnt\nmit Erfahrung, aber entsteht nicht allein aus ihr. Der Verstand\nbringt eigene Strukturen mit, die Erfahrung erst ermöglichen.\nBeispiel: „Anschauungen ohne Begriffe sind blind, Begriffe ohne\nAnschauungen sind leer.\" (Kant)","sem":"Erkenntnistheorie","fw_id":null},{"term":"Kategorien des Verstandes","definition":"Angeborene Denkstrukturen des Verstandes, z.B. Kausalität,\nSubstanz, Möglichkeit. Sie ordnen die rohen Sinneseindrücke zu\neiner erkennbaren Welt - ohne sie gäbe es keine Naturgesetze,\nkeine Wissenschaft.\nBeispiel: Kategorien sind wie das Betriebssystem des Geistes -\ndie Sinne liefern die Daten, der Verstand verarbeitet sie.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Erscheinung / Ding an sich","definition":"Wir erkennen die Welt immer so, wie sie uns erscheint - gefiltert\ndurch Sinne und Denkstrukturen.\nWie die Welt „an sich\" wirklich ist, können wir nie wissen.\nBeispiel: Wir sehen die Welt immer durch eine Brille, die wir nie\nabnehmen können.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Synthetische Urteile a priori","definition":"Aussagen, die gleichzeitig notwendig wahr (a priori) und\nerkenntniserweiternd (synthetisch) sind. Für Kant die Grundlage\naller Wissenschaft.\nBeispiel: „Alles, was geschieht, hat eine Ursache\" - gilt\nnotwendig, obwohl wir es nicht aus der Erfahrung ableiten können.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Ideenlehre (Platon)","definition":"Hinter den sinnlichen Dingen existiert eine höhere Welt\nunveränderlicher Ideen. Nur diese sind wirklich real. Sinnliche\nDinge sind bloß unvollkommene Abbilder.\nBeispiel: Es gibt viele schöne Dinge - aber die Idee des Schönen\nselbst ist ewig und unveränderlich.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Doxa vs. Episteme","definition":"Doxa = bloße Meinung, basiert auf wechselnden Sinneswahrneh-\nmungen - unsicher und subjektiv.\nEpisteme = echtes Wissen, basiert auf der Erkenntnis der Ideen\ndurch Vernunft - sicher und allgemeingültig.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Anamnesis","definition":"Erkenntnis ist Wiedererinnerung. Die Seele hat vor der Geburt die\nIdeen gesehen - Lernen bedeutet, sich daran zu erinnern.\nSinneseindrücke sind nur Auslöser, nicht Quelle von Wissen.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Höhlengleichnis","definition":"Menschen in einer Höhle sehen nur Schatten an der Wand und\nhalten sie für die Wirklichkeit. Einer befreit sich, sieht das\nSonnenlicht (= die Ideen) und kehrt zurück - aber niemand glaubt\nihm.\nBotschaft: Die meisten leben in Illusionen. Wahre Erkenntnis ist\nanstrengend und wird oft abgelehnt.\nBeispiel: Algorithmen und soziale Medien könnten moderne Höhlen\nsein - wir sehen nur, was uns gezeigt wird.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Falsifikation","definition":"Eine Theorie ist nur dann wissenschaftlich, wenn man sich eine\nBeobachtung vorstellen kann, die sie widerlegt.\nNicht Bestätigung, sondern Widerlegbarkeit ist das entscheidende\nKriterium.\nBeispiel: „Alle Schwäne sind weiß.\" - Ein schwarzer Schwan würde\ndie Theorie widerlegen.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Bewährung","definition":"Theorien können viele Tests bestehen und sich bewähren, sind aber\nnie endgültig wahr.\nBewährung bedeutet vorläufige Geltung, keine absolute Sicherheit.\nBeispiel: Die Newtonsche Physik war lange bewährt - wurde aber\ndurch Einsteins Relativitätstheorie ergänzt und teilweise\nkorrigiert.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Theoriegetränktheit der Beobachtung","definition":"Beobachtungen sind nie neutral. Wir sehen die Welt immer im Licht\nvon Vorwissen, Erwartungen und Theorien. Fakten entstehen nicht\nohne Interpretation.\nBeispiel: Ein Arzt und ein Laie schauen auf dasselbe Röntgenbild\nund sehen völlig Verschiedenes.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Kritischer Rationalismus (Popper)","definition":"Wissen entsteht durch Hypothesen, die kritisch geprüft und\nverworfen werden.\nFortschritt entsteht durch Fehlersuche, nicht durch Anhäufen von\nSicherheiten.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Paradigma (Kuhn)","definition":"Ein gemeinsamer Rahmen aus Grundannahmen, Methoden und Regeln,\nin dem eine wissenschaftliche Gemeinschaft arbeitet. Das Paradigma\nbestimmt, welche Fragen überhaupt sinnvoll sind.\nBeispiel: Das geozentrische Weltbild war jahrhundertelang das\ngültige Paradigma der Astronomie.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Normalwissenschaft (Kuhn)","definition":"Der Alltag der Wissenschaft: Forscher lösen Rätsel innerhalb des\nbestehenden Paradigmas. Das Paradigma selbst wird dabei nicht in\nFrage gestellt.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Paradigmenwechsel / Wissenschaftliche Revolution (Kuhn)","definition":"Wenn sich Beobachtungen häufen, die nicht ins Paradigma passen\n(Anomalien), kommt es zur Krise und schließlich zur Revolution:\nDas alte Paradigma wird durch ein neues ersetzt.\nBeispiel: Von Ptolemäus (Erde im Mittelpunkt) zu Kopernikus\n(Sonne im Mittelpunkt) - eine wissenschaftliche Revolution.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Inkommensurabilität (Kuhn)","definition":"Alte und neue Paradigmen sind nicht direkt vergleichbar - sie\nsprechen verschiedene Sprachen und stellen andere Fragen. Ein\nrein logischer Vergleich ist kaum möglich.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Methodenpluralismus / „Anything goes\" (Feyerabend)","definition":"Es gibt keine einheitliche, allgemeingültige Methode für\nWissenschaft. Großer Fortschritt entstand oft durch Regelbrüche\nund unorthodoxes Denken.\n„Anything goes\" bedeutet: Keine Methode darf absolut gesetzt\nwerden.\nBeispiel: Galilei hielt sich nicht an die sauberen Regeln seiner\nZeit - und hatte trotzdem recht.","sem":"Erkenntnistheorie","fw_id":null},{"term":"Ethik","definition":"Ethik ist die philosophische Disziplin, die nach dem richtigen\nHandeln fragt. Sie untersucht, was gut und böse ist, welche Werte\nwir haben sollen und wie wir unser Leben führen sollen.\nZentrale Fragen: Was soll ich tun? Was ist moralisch richtig?","sem":"Ethik","fw_id":null},{"term":"Moral","definition":"Moral bezeichnet die tatsächlich in einer Gesellschaft geltenden\nNormen, Werte und Verhaltensregeln.\nEthik reflektiert Moral kritisch: Moral ist das, was gemacht wird;\nEthik fragt, was gemacht werden sollte.","sem":"Ethik","fw_id":null},{"term":"Autonomie","definition":"Selbstgesetzgebung - die Fähigkeit, sich selbst moralische Regeln\nzu geben, statt sie nur von außen zu empfangen.\nFür Kant ist Autonomie das Kennzeichen vernünftiger Wesen und\nGrundlage der Menschenwürde.\nBeispiel: Wer aus eigenem Nachdenken heraus hilft, handelt\nautonom. Wer nur hilft, weil die Lehrerin zuschaut, handelt\nheteronom.","sem":"Ethik","fw_id":null},{"term":"Menschenwürde","definition":"Jeder Mensch hat einen absoluten, unveräußerlichen Wert allein\ndadurch, dass er ein vernünftiges, freies Wesen ist.\nMenschenwürde darf niemals verletzt oder instrumentalisiert\nwerden.\nBeispiel: Folter ist auch dann verboten, wenn sie nützliche\nInformationen liefern könnte - die Würde des Menschen ist\nunantastbar.","sem":"Ethik","fw_id":null},{"term":"Verantwortung","definition":"Wer handelt, muss für die Folgen seines Handelns einstehen.\nVerantwortung setzt Freiheit voraus: Nur wer anders hätte handeln\nkönnen, kann verantwortlich gemacht werden.","sem":"Ethik","fw_id":null},{"term":"Gewissen","definition":"Das innere Urteilsvermögen, das sagt, ob eine Handlung richtig\noder falsch ist. Es ist die „innere Stimme\", die uns bei\nmoralischen Entscheidungen leitet - und nach einer schlechten Tat\nquält.","sem":"Ethik","fw_id":null},{"term":"Tugendethik","definition":"Nicht „Was soll ich tun?\", sondern „Was für ein Mensch soll ich\nsein?\" ist die zentrale Frage.\nTugenden sind Charaktereigenschaften wie Mut, Gerechtigkeit,\nKlugheit - sie entstehen durch Übung und Gewohnheit.","sem":"Ethik","fw_id":null},{"term":"Eudaimonia (Aristoteles)","definition":"Glück oder Gedeihen im Sinne eines gelingenden, erfüllten Lebens.\nNicht bloß Freude, sondern das Beste aus den eigenen Fähigkeiten\nherausholen.\nEudaimonia ist das höchste Ziel menschlichen Handelns.\nBeispiel: Eudaimonia ist kein Gefühl, sondern eine Lebensform:\naktiv, vernünftig, in Gemeinschaft - wie ein Sportler, der sein\nPotenzial voll ausschöpft.","sem":"Ethik","fw_id":null},{"term":"Mesotes / Goldene Mitte (Aristoteles)","definition":"Tugend liegt in der Mitte zwischen zwei Extremen (Lastern). Die\nrichtige Mitte ist nicht für alle gleich, sondern situations-\nabhängig.\nBeispiel: Mut liegt zwischen Feigheit (zu wenig) und Leichtsinn\n(zu viel Risikobereitschaft).","sem":"Ethik","fw_id":null},{"term":"Zoon politikon (Aristoteles)","definition":"Der Mensch ist von Natur aus ein soziales/politisches Wesen.\nEin gutes Leben ist nur innerhalb einer Gemeinschaft möglich.\nEin Mensch außerhalb der Gemeinschaft wäre entweder ein Gott\noder ein Tier.","sem":"Ethik","fw_id":null},{"term":"Hedonismus (Epikur)","definition":"Das höchste Gut ist die Lust (Hedone) und die Abwesenheit von\nSchmerz (Aponie) und Seelenunruhe (Ataraxie).\nEpikur meint damit aber nicht exzessive Freuden, sondern stille\nZufriedenheit, Freundschaft und Weisheit.\nBeispiel: „Wenn wir sagen, dass Lust das Ziel ist, meinen wir\nnicht die Lüste der Schwelger.\" (Epikur)","sem":"Ethik","fw_id":null},{"term":"Stoa / Stoizismus","definition":"Das gute Leben besteht nicht im Genuss, sondern in der Tugend\nund der Beherrschung der eigenen Reaktionen auf die Welt.\nZentrale Unterscheidung: Was liegt in unserer Macht (Urteile,\nReaktionen) vs. was nicht (Körper, Besitz, Ruf).\nWir können nicht immer bestimmen, was geschieht - aber immer,\nwie wir darauf reagieren.\nBeispiel: Du verlierst dein Handy - das liegt nicht in deiner\nMacht. Aber ob du dich davon ruinieren lässt, liegt in deiner\nMacht.","sem":"Ethik","fw_id":null},{"term":"Utilitarismus","definition":"Der moralische Wert einer Handlung hängt von ihren Folgen ab:\nEine Handlung ist gut, wenn sie das größte Glück für die größte\nZahl erzeugt.\nMoral ist keine Frage von Pflichten oder Absichten, sondern von\nErgebnissen.\nBeispiel: Soll man 1 Person töten, um 5 zu retten? Der\nUtilitarismus sagt: Ja - wenn die Gesamtbilanz besser ist.","sem":"Ethik","fw_id":null},{"term":"Konsequentialismus","definition":"Handlungen werden ausschließlich nach ihren Konsequenzen (Folgen)\nbeurteilt. Motive, Absichten oder Regeln spielen keine eigen-\nständige Rolle.","sem":"Ethik","fw_id":null},{"term":"Hedonistisches Prinzip / Hedone-Kalkül (Bentham)","definition":"Lust ist das einzige Gut, Schmerz das einzige Übel. Alle Lüste\nsind gleich wertvoll - nur Menge und Intensität zählen.\nBentham erfand das Hedone-Kalkül: Lüste können berechnet und\nverglichen werden.\nBeispiel: Eine Stunde Videospiele = eine Stunde Literatur, wenn\ndie Lustmenge gleich ist. Mill kritisierte das später als zu\nsimpel.","sem":"Ethik","fw_id":null},{"term":"Qualitativer Utilitarismus (Mill)","definition":"Nicht alle Lüste sind gleich - geistige Freuden sind wertvoller\nals körperliche. Qualität, nicht nur Quantität der Lust zählt.\nBeispiel: „Besser ein unzufriedener Sokrates als ein zufriedenes\nSchwein.\" (Mill)","sem":"Ethik","fw_id":null},{"term":"Präferenzutilitarismus (Singer)","definition":"Nicht Lust/Schmerz, sondern die Erfüllung von Interessen und\nPräferenzen bestimmt den moralischen Wert einer Handlung.\nAlle leidensfähigen Wesen - auch Tiere - müssen gleich\nberücksichtigt werden.","sem":"Ethik","fw_id":null},{"term":"Speziesismus (Singer)","definition":"Die ungerechtfertigte Bevorzugung der eigenen Spezies. Es gibt\nkeinen moralisch akzeptablen Grund, Tierleid weniger ernst zu\nnehmen als vergleichbares menschliches Leid.\nBeispiel: Massentierhaltung wäre Speziesismus - das Leid der\nTiere wird ignoriert, nur weil sie keine Menschen sind.","sem":"Ethik","fw_id":null},{"term":"Deontologie / Pflichtethik","definition":"Handlungen werden nicht nach ihren Folgen, sondern nach dem\nihnen zugrundeliegenden Prinzip beurteilt.\nEine Handlung ist gut, wenn sie aus Pflicht und nach einem\nmoralisch richtigen Grundsatz (Maxime) geschieht.","sem":"Ethik","fw_id":null},{"term":"Guter Wille (Kant)","definition":"Der gute Wille ist das einzige, was uneingeschränkt gut ist.\nAlles andere - Mut, Intelligenz, Reichtum - kann missbraucht\nwerden.\nEin Wille ist gut, wenn er aus Pflicht handelt, nicht aus\nNeigung oder Eigennutz.\nBeispiel: Wer hilft, weil er Mitleid hat, handelt aus Neigung.\nWer hilft, weil es seine Pflicht ist - auch ohne Lust dazu -\nhandelt aus Pflicht. Kant bevorzugt Letzteres.","sem":"Ethik","fw_id":null},{"term":"Kategorischer Imperativ","definition":"Das zentrale Moralprinzip Kants:\n„Handle nur nach derjenigen Maxime, durch die du zugleich wollen\nkannst, dass sie ein allgemeines Gesetz werde.\"\nTest: Kann ich wollen, dass alle so handeln? Wenn nein -\nunmoralisch.\nBeispiel: „Ich lüge, wenn es mir nützt.\" - Könntest du das als\nallgemeines Gesetz wollen? Nein - dann würde niemand mehr glauben,\nwas jemand sagt. Also ist Lügen unmoralisch.","sem":"Ethik","fw_id":null},{"term":"Maxime","definition":"Der persönliche Grundsatz, nach dem jemand handelt. Kant prüft\nMaximen durch den kategorischen Imperativ: Kann ich wollen, dass\nalle nach dieser Maxime handeln?\nBeispiel: Maxime: „Ich helfe anderen, wenn ich Zeit habe.\" -\nPrüfen: Könnte ich wollen, dass alle so handeln? Ja - das wäre\nuniversalisierbar.","sem":"Ethik","fw_id":null},{"term":"Mensch als Zweck (2. Formulierung des kategorischen Imperativs)","definition":"„Handle so, dass du die Menschheit, sowohl in deiner Person als\nauch in der Person jedes anderen, jederzeit als Zweck, niemals\nbloß als Mittel brauchst.\"\nMenschen dürfen niemals bloß instrumentalisiert werden.\nBeispiel: Jemanden anzulügen, um ihn zu manipulieren, behandelt\nihn als bloßes Mittel - nicht als Zweck an sich.","sem":"Ethik","fw_id":null},{"term":"Pflicht vs. Neigung (Kant)","definition":"Moralisch handeln heißt aus Pflicht handeln, nicht weil man Lust\ndazu hat oder sich dadurch etwas erhofft.\nNur das Handeln aus Pflicht hat moralischen Wert.","sem":"Ethik","fw_id":null},{"term":"Ethischer Relativismus","definition":"Moralische Werte sind relativ - abhängig von Kultur, Zeit oder\nPerson. Es gibt keine universellen moralischen Wahrheiten.\nProblem: Dann kann man keine kulturellen Praktiken wie Sklaverei\noder Folter grundsätzlich verurteilen.","sem":"Ethik","fw_id":null},{"term":"Ethischer Universalismus","definition":"Es gibt moralische Grundprinzipien, die für alle Menschen und\nKulturen gelten - unabhängig von Ort, Zeit und Tradition.\nBeispiel: Menschenrechte als universelle moralische Ansprüche.","sem":"Ethik","fw_id":null},{"term":"Verantwortungsethik (Hans Jonas)","definition":"In der technologischen Zivilisation brauchen wir eine neue Ethik:\n„Handle so, dass die Wirkungen deiner Handlungen mit der\nPermanenz menschlichen Lebens auf Erden vereinbar sind.\"\nVerantwortung gilt nicht nur für die Gegenwart, sondern auch für\nzukünftige Generationen.\nBeispiel: Klimaschutz - wir haben eine Verantwortung gegenüber\nMenschen, die noch nicht geboren sind.","sem":"Ethik","fw_id":null},{"term":"Staat","definition":"Eine politische Gemeinschaft mit einer anerkannten Regierung,\neinem Gebiet und einem Gewaltmonopol. Der Staat setzt Recht durch\nund sorgt für Frieden und Ordnung.\nZentrale Frage: Warum brauchen wir überhaupt einen Staat?","sem":"Politische Philosophie","fw_id":null},{"term":"Legitimität","definition":"Die moralische Berechtigung einer Herrschaft oder Ordnung.\nLegitim ist, was als gerecht und rechtmäßig anerkannt wird -\nnicht nur, was legal (gesetzlich) ist.\nBeispiel: Ein Gesetz kann legal, aber nicht legitim sein - z.B.\nGesetze in Unrechtsstaaten.","sem":"Politische Philosophie","fw_id":null},{"term":"Legalität","definition":"Die Übereinstimmung mit geltendem Recht. Etwas ist legal, wenn es\nden Gesetzen entspricht - unabhängig davon, ob es moralisch\nrichtig ist.\nBeispiel: Ein rassistisches Gesetz war legal, aber nicht legitim.","sem":"Politische Philosophie","fw_id":null},{"term":"Gewaltmonopol","definition":"Nur der Staat darf Gewalt rechtmäßig ausüben (z.B. Polizei,\nMilitär). Kein Einzelner oder keine Gruppe darf Gewalt anwenden -\naußer im Rahmen staatlicher Befugnis.","sem":"Politische Philosophie","fw_id":null},{"term":"Demokratie","definition":"Herrschaft des Volkes: Entscheidungen werden von allen Bürgern\n(direkte Demokratie) oder durch gewählte Vertreter\n(repräsentative Demokratie) getroffen.\nGrundelemente: freie Wahlen, Gewaltenteilung, Grundrechte,\nRechtsstaatlichkeit.","sem":"Politische Philosophie","fw_id":null},{"term":"Gewaltenteilung","definition":"Die Macht des Staates wird auf drei Gewalten aufgeteilt:\nLegislative (Parlament - macht Gesetze)\nExekutive (Regierung - führt Gesetze aus)\nJudikative (Gerichte - prüft Gesetze)\nSie kontrollieren sich gegenseitig.","sem":"Politische Philosophie","fw_id":null},{"term":"Naturzustand","definition":"Ein Gedankenexperiment: Wie wäre das menschliche Leben ohne\nStaat und Gesetze?\nHobbes: Krieg aller gegen alle - brutal, kurz, elend.\nLocke: Mehr oder weniger friedlich, aber ohne verlässliche\nEigentumsrechte.\nRousseau: Ursprünglich gut und harmonisch - erst die Gesellschaft\nhat den Menschen verdorben.","sem":"Politische Philosophie","fw_id":null},{"term":"Gesellschaftsvertrag","definition":"Menschen schließen einen (oft hypothetischen) Vertrag: Sie geben\neinen Teil ihrer Freiheit ab, dafür erhalten sie Schutz, Frieden\nund Recht. Dieser Vertrag begründet die Legitimität des Staates.\nBeispiel: Wenn du in einem Flugzeug landest, stimmst du still-\nschweigend den Sicherheitsregeln zu. Das ist eine Art sozialer\nVertrag.","sem":"Politische Philosophie","fw_id":null},{"term":"Hobbes - Leviathan","definition":"Ohne starken Staat herrscht der „Krieg aller gegen alle\" - das\nLeben wäre einsam, arm, hässlich, brutal und kurz.\nMenschen geben alle Rechte an einen absoluten Souverän ab - nur\ndas Recht auf Selbsterhaltung bleibt.\nNur ein starker Staat kann dauerhaften Frieden garantieren.\nBeispiel: „Der Mensch ist dem Menschen ein Wolf.\"\n(homo homini lupus - Hobbes)","sem":"Politische Philosophie","fw_id":null},{"term":"Locke - Liberaler Staat","definition":"Der Mensch hat von Natur aus Rechte auf Leben, Freiheit und\nEigentum.\nDer Staat dient dem Schutz dieser Rechte - missbraucht er sie,\nhat das Volk das Recht zum Widerstand.\nGewaltenteilung und Einwilligung der Regierten sind\nGrundbedingungen legitimer Herrschaft.\nBeispiel: Lockes Ideen inspirierten die amerikanische\nUnabhängigkeitserklärung: „Life, Liberty and the pursuit of\nHappiness.\"","sem":"Politische Philosophie","fw_id":null},{"term":"Rousseau - Gemeinwille (volonté générale)","definition":"Der Mensch ist von Natur aus gut - die Gesellschaft und das\nEigentum haben ihn verdorben.\nDer Gesellschaftsvertrag soll echte Freiheit sichern. Der\nGemeinwille repräsentiert das Gemeinwohl - nicht nur die Summe\nder Einzelinteressen.\nBeispiel: „Der Mensch ist frei geboren, und überall liegt er in\nKetten.\" (Rousseau)","sem":"Politische Philosophie","fw_id":null},{"term":"Rawls - Schleier des Nichtwissens","definition":"Gerechte Prinzipien wählt man im „Urzustand\" hinter einem\n„Schleier des Nichtwissens\": Man weiß nicht, welche Position man\nin der Gesellschaft einnehmen wird.\nDaher würde jeder faire Grundregeln wählen - und Ungleichheiten\nnur akzeptieren, wenn sie den Ärmsten nützen.\nBeispiel: Wenn du nicht weißt, ob du reich oder arm geboren\nwirst - welche Gesellschaftsregeln würdest du wählen?","sem":"Politische Philosophie","fw_id":null},{"term":"Macht als Herrschaftsinstrument (Machiavelli)","definition":"Macht ist ein Mittel zur Herrschaft, das der Fürst nach Belieben\neinsetzen kann. Er soll weder grausam noch schwach sein - er soll\nden Schein der Tugend wahren, auch wenn er sie nicht hat.\nZiel: Machterhalt, nicht Moral.","sem":"Politische Philosophie","fw_id":null},{"term":"Macht als kollektives Handeln (Hannah Arendt)","definition":"Macht ist kein Besitz eines Einzelnen, sondern entsteht im\ngemeinsamen Handeln von Menschen. Sie beruht auf Zustimmung und\nZusammenarbeit, nicht auf Gewalt.\nGewalt und Macht sind Gegensätze: Wo Gewalt herrscht, hat Macht\naufgehört.\nBeispiel: Diktaturen sind mächtiger Schein - sobald die Menschen\naufhören mitzumachen, bricht die Herrschaft zusammen (z.B. DDR\n1989).","sem":"Politische Philosophie","fw_id":null},{"term":"Macht als Durchsetzungsfähigkeit (Max Weber)","definition":"Macht ist die Chance, den eigenen Willen auch gegen den\nWiderstand anderer durchzusetzen.\nWeber unterscheidet drei Typen legitimer Herrschaft: traditionale,\ncharismatische und legale/rationale Herrschaft.","sem":"Politische Philosophie","fw_id":null},{"term":"Naturrecht","definition":"Es gibt Rechte und Pflichten, die dem Menschen von Natur aus\nzukommen - unabhängig von positiven Gesetzen. Diese Rechte sind\nunveräußerlich und gelten immer.\nBeispiel: Das Verbot der Sklaverei gilt auch dort, wo kein Gesetz\nsie verbietet - weil es dem natürlichen Recht widerspricht.","sem":"Politische Philosophie","fw_id":null},{"term":"Positives Recht","definition":"Das von Menschen gesetzte, tatsächlich geltende Recht in einem\nStaat. Es gilt, weil es gesetzt wurde - unabhängig davon, ob es\nmoralisch gerecht ist.\nRechtspositivismus: Recht ist Recht, weil es Recht ist - nicht\nweil es gut ist.","sem":"Politische Philosophie","fw_id":null},{"term":"Radbruchsche Formel","definition":"Wenn positives Recht so unerträglich ungerecht ist, dass es die\nMenschenwürde verletzt, verliert es seine Verbindlichkeit.\nBeispiel: Grundlage für die Nürnberger Prozesse - Nazi-Täter\nkonnten sich nicht auf „Ich habe nur Befehle befolgt\" berufen.","sem":"Politische Philosophie","fw_id":null},{"term":"Menschenrechte","definition":"Unveräußerliche Rechte, die jedem Menschen allein aufgrund seines\nMenschseins zustehen - unabhängig von Nationalität, Herkunft oder\nGeschlecht. Sie sind universell, unteilbar und unübertragbar.\nBeispiel: Recht auf Leben, Freiheit, Sicherheit, Verbot von\nFolter - diese gelten für jeden Menschen auf der Welt.","sem":"Politische Philosophie","fw_id":null},{"term":"Ziviler Ungehorsam","definition":"Die bewusste, öffentliche, gewaltfreie Verletzung von Gesetzen,\num auf eine als ungerecht empfundene Ordnung aufmerksam zu\nmachen.\nZiel: Veränderung der Politik, nicht Zerstörung des Staates.\nBeispiel: Mahatma Gandhi, Rosa Parks, Klimaaktivisten, die\nStraßen blockieren.","sem":"Politische Philosophie","fw_id":null},{"term":"Widerstandsrecht","definition":"Das Recht der Bürger, sich gegen eine tyrannische Herrschaft zur\nWehr zu setzen - auch mit Gewalt, wenn alle anderen Mittel\nversagen.\nLocke: Wenn der Staat Naturrechte systematisch verletzt, verliert\ner seine Legitimität.","sem":"Politische Philosophie","fw_id":null},{"term":"Soziale Gerechtigkeit","definition":"Wie sollen Güter, Chancen und Rechte in einer Gesellschaft\nverteilt werden?\nPositionen:\n- Egalitarismus: gleiche Verteilung für alle\n- Liberalismus (Nozick): der Markt entscheidet\n- Liberaler Egalitarismus (Rawls): Ungleichheiten nur erlaubt,\nwenn sie den Schwächsten nützen","sem":"Politische Philosophie","fw_id":null},{"term":"Anthropologie (philosophisch)","definition":"Die philosophische Anthropologie fragt: Was ist der Mensch? Was\nunterscheidet ihn von Tieren und Maschinen? Hat er ein Wesen?\nSie untersucht Freiheit, Sprache, Vernunft, Sozialität und Sinn\ndes Lebens.","sem":"Anthropologie","fw_id":null},{"term":"Essentialismus","definition":"Der Mensch hat ein unveränderliches Wesen (essentia), das seine\nNatur bestimmt - unabhängig davon, was er tut oder wie er lebt.\nBeispiel: „Der Mensch ist von Natur aus vernünftig\" oder „Der\nMensch ist ein soziales Wesen\" - das sind essentialistische\nAussagen.","sem":"Anthropologie","fw_id":null},{"term":"Existenzialismus (Sartre)","definition":"Die Existenz geht der Essenz voraus: Der Mensch hat kein\nvorgegebenes Wesen. Er wirft sich selbst in die Welt und erschafft\nsich durch seine Entscheidungen.\n„Der Mensch ist dazu verurteilt, frei zu sein.\" (Sartre)\nBeispiel: Ein Stuhl hat zuerst eine Idee (Zweck), dann existiert\ner. Beim Menschen ist es umgekehrt: Zuerst existiert er, dann\nerschafft er sich selbst.","sem":"Anthropologie","fw_id":null},{"term":"Sozialer Konstruktivismus","definition":"Was als „Menschennatur\" gilt, ist nicht naturgegeben, sondern\nsozial und kulturell konstruiert. Geschlecht, Identität - das\nsind soziale Konstruktionen, keine naturgegebenen Tatsachen.\nBeispiel: „Man kommt nicht als Frau zur Welt, man wird es.\"\n(Simone de Beauvoir)","sem":"Anthropologie","fw_id":null},{"term":"Freiheit","definition":"Die Fähigkeit, selbst zu entscheiden und zu handeln, ohne von\naußen bestimmt zu werden.\nFreiheit ist Voraussetzung für Moral, Verantwortung und\nmenschliche Würde.\nDrei Hauptpositionen: Determinismus, Libertarismus,\nKompatibilismus.","sem":"Ethik","fw_id":null},{"term":"Negative Freiheit","definition":"„Freiheit von...\" - die Abwesenheit von Hindernissen, Zwang und\nEinschränkungen.\nNiemand hindert mich daran, X zu tun.\nBeispiel: Pressefreiheit = keine staatliche Zensur.\nMeinungsfreiheit = man darf seine Meinung sagen, ohne Strafe zu\nfürchten.","sem":"Ethik","fw_id":null},{"term":"Positive Freiheit","definition":"„Freiheit zu...\" - die tatsächliche Fähigkeit, etwas zu tun, die\neigenen Ziele zu verfolgen und das Leben selbst zu gestalten.\nPositive Freiheit setzt Mittel voraus, nicht nur Abwesenheit von\nHindernissen.\nBeispiel: Ich bin frei, Geige zu lernen (kein Verbot) - aber\nohne Instrument, Lehrer und Zeit fehlt mir die positive Freiheit\ndazu.","sem":"Ethik","fw_id":null},{"term":"Willensfreiheit","definition":"Die innere Freiheit: die Fähigkeit, zwischen Alternativen zu\nwählen und den eigenen Willen zu bestimmen - ohne vollständig\ndurch externe Faktoren determiniert zu sein.","sem":"Ethik","fw_id":null},{"term":"Handlungsfreiheit","definition":"Die äußere Freiheit: die Fähigkeit, einen gefassten Willen auch\ntatsächlich in Handlungen umzusetzen, ohne äußere Hindernisse.","sem":"Ethik","fw_id":null},{"term":"Determinismus","definition":"Alle Ereignisse - auch menschliche Handlungen - sind durch\nNaturgesetze und Anfangsbedingungen vollständig vorherbestimmt.\nEs gibt keine echte Wahlmöglichkeit.\nFolge: Willensfreiheit ist eine Illusion. Moralische Verantwortung\nwird problematisch.\nBeispiel: Laplace'scher Dämon - ein Wesen, das alle Naturgesetze\nkennt, könnte jede zukünftige Handlung berechnen.","sem":"Ethik","fw_id":null},{"term":"Libertarismus (Freiheitsdebatte)","definition":"Der Mensch hat echten freien Willen: Unter gleichen Bedingungen\nhätte er auch anders handeln können.\nDer Determinismus ist falsch - menschliche Entscheidungen sind\nnicht vollständig kausal vorherbestimmt.","sem":"Ethik","fw_id":null},{"term":"Kompatibilismus","definition":"Freiheit und Determinismus schließen sich nicht aus: Frei handeln\nbedeutet, gemäß den eigenen Wünschen und Gründen zu handeln -\nohne äußeren Zwang.\nSelbst wenn alles kausal bestimmt ist, können Handlungen trotzdem\nfrei sein.\nBeispiel: Du wählst Schokoladeneis, weil du es magst - das ist\nfrei, auch wenn die Entscheidung kausal erklärbar ist.","sem":"Ethik","fw_id":null},{"term":"Sinn des Lebens","definition":"Vier Hauptantworten:\n1. Existenzialismus (Sartre): Wir erschaffen unseren eigenen Sinn\ndurch Entscheidungen.\n2. Nihilismus (Nietzsche): Das Leben hat keinen objektiven Sinn.\n3. Eudämonismus (Aristoteles): Sinn liegt im Streben nach Glück\nund Entfaltung.\n4. Absurdismus (Camus): Das Leben ist sinnlos - aber wir müssen\nuns dennoch dagegen auflehnen (Revolte).","sem":"Anthropologie","fw_id":null},{"term":"Absurdismus (Albert Camus)","definition":"Das Leben ist sinnlos (absurd) - aber statt sich dem Nihilismus\noder der Religion zu ergeben, soll man sich dem Absurden\nwidersetzen und trotzdem leben.\nDie Spannung zwischen dem menschlichen Verlangen nach Sinn und\nder schweigenden Welt ist das Absurde.\nBeispiel: „Man muss sich Sisyphus als einen glücklichen Menschen\nvorstellen.\" (Camus) - er akzeptiert das Absurde und trotzt ihm.","sem":"Anthropologie","fw_id":null},{"term":"Nihilismus","definition":"Das Leben hat keinen objektiven, vorgegebenen Sinn. Es gibt keine\nunveränderlichen Werte oder Wahrheiten.\nNietzsche: „Gott ist tot\" - mit dem Verlust des religiösen\nWeltbildes verlieren traditionelle Werte ihre Grundlage.","sem":"Anthropologie","fw_id":null},{"term":"Entfremdung (Marx)","definition":"Im kapitalistischen Produktionssystem wird der Arbeiter vom\nErgebnis seiner Arbeit, vom Arbeitsprozess, von anderen Menschen\nund von sich selbst entfremdet.\nArbeit sollte Selbstverwirklichung sein - im Kapitalismus wird sie\nzu bloßer Ware.\nBeispiel: Der Fabrikarbeiter sieht das fertige Produkt nie,\nentscheidet nichts, wiederholt dieselben Griffe - er ist\nentfremdet von seiner eigenen Tätigkeit.","sem":"Anthropologie","fw_id":null},{"term":"Technologie und Menschlichkeit","definition":"Macht Technologie den Menschen mehr zu dem, was er ist\n(Werkzeugmacher, homo faber) - oder bedroht sie das Menschliche?\nTranshumanismus: Technologie soll den Menschen verbessern und\nseine Grenzen überwinden.\nKritik: Verlust von Autonomie, Würde und menschlicher\nVerbundenheit.\nBeispiel: KI, autonome Waffensysteme, genetische Manipulation -\nwo ist die Grenze des Menschlichen?\n================================================================\nEnde des Dokuments\n================================================================","sem":"Anthropologie","fw_id":null},{"term":"Indeterminismus","definition":"Nicht alles, was geschieht, ist durch vorhergehende Ursachen festgelegt.\nDie Naturgesetze schließen viele Verläufe aus, aber nicht alle bis auf einen (Keil).","sem":"Ethik","fw_id":null},{"term":"Bereitschaftspotenzial","definition":"Messbare elektrische Spannung im Gehirn vor einer absichtlichen Bewegung.\nBei Libet (1983) begann sie vor dem bewussten Entschluss.","sem":"Ethik","fw_id":null}];
</script>

function buildPortrait(sp){

  let o = PB.wear[sp.wear||'open']();
  if (sp.back) o += PB.back[sp.back[0]](h(sp.back[1]));
  o += P_FACE + P_HEAD;
  if (sp.extra && sp.extra.includes('wrinkle')) o += PB.extra.wrinkle();
  if (sp.hair) o += PB.hair[sp.hair[0]](h(sp.hair[1]));
  if (sp.beard) o += PB.beard[sp.beard[0]](h(sp.beard[1]));
  if (sp.must) o += PB.must[sp.must[0]](h(sp.must[1]));
  const hasBeard = sp.beard && sp.beard[0] !== 'tuft';
  o += hasBeard || (sp.must && sp.must[0]==='walrus') ? '<path d="M55 79c3-1.6 7-1.6 10 0-3 2.6-7 2.6-10 0Z" style="fill:var(--skin)" stroke-width="2.4"/>' : (sp.must ? '<path d="M56 78c2.7 1 5.3 1 8 0"/>' : P_SMILE);

  else o += P_EYES;
  o += P_NOSE;
  if (sp.extra && sp.extra.includes('cig')) o += PB.extra.cig();
  return o;
}

function portraitSVG(name, cls){
  const inner = PORTRAITS[name] || (PSPEC[name] ? buildPortrait(PSPEC[name]) : genericPortrait(name));

}

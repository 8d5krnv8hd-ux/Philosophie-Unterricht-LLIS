  "Thomas Hobbes": {
    ort: "Westport bei Malmesbury (England)",
    bio: "Hobbes wurde 1588 als Sohn eines Pfarrers geboren. Er studierte in Oxford und war jahrzehntelang Hauslehrer und Sekretär der Adelsfamilie Cavendish, mit der er viel durch Europa reiste. Dabei lernte er Galilei kennen und wollte fortan die Politik so streng erklären wie die Geometrie. Weil er den Streit zwischen König und Parlament fürchtete, ging er 1640 ins Exil nach Paris. Dort schrieb er den „Leviathan“, der 1651 erschien, und kehrte danach nach England zurück. Der Englische Bürgerkrieg zeigte ihm, was ohne starke Ordnung droht: ein „Krieg aller gegen alle“. Darum sollen die Menschen in einem Vertrag ihre Macht an einen Herrscher abgeben, der Frieden sichert. Er starb 1679, und mit seiner Idee des Gesellschaftsvertrags begründete er die moderne politische Philosophie.",
    fun: [
      "Er kam zu früh zur Welt, angeblich, weil seine Mutter vor der spanischen Armada erschrak. Er sagte später: „Die Furcht und ich wurden als Zwillinge geboren.“",
      "Die Geometrie entdeckte er erst mit etwa 40 Jahren, als er zufällig ein Buch von Euklid aufschlug.",
      "Er wurde 91 Jahre alt und soll noch mit über 70 Tennis gespielt haben."
    ]
  },
  "Jean-Jacques Rousseau": {
    ort: "Genf",
    bio: "Rousseau wurde 1712 in Genf als Sohn eines Uhrmachers geboren, seine Mutter starb kurz nach der Geburt. Mit 16 Jahren verließ er Genf, lernte als Autodidakt und verdiente Geld als Notenkopist und Musiker. In Paris schrieb er Artikel über Musik für die „Encyclopédie“ der Aufklärer. Berühmt wurde er 1750 mit einer Preisschrift, die behauptet, Wissenschaften und Künste hätten die Sitten nicht verbessert. 1755 folgte die „Abhandlung über den Ursprung der Ungleichheit“: Der Mensch ist von Natur aus gut, erst Eigentum und Gesellschaft machen ihn ungleich und unfrei. 1762 erschienen „Der Gesellschaftsvertrag“ und der Erziehungsroman „Emile“. Beide Bücher wurden verboten, und Rousseau musste fliehen. Er starb 1778 in Ermenonville bei Paris. Seine Idee der Volkssouveränität (das Volk soll selbst herrschen) beeinflusste die Französische Revolution.",
    fun: [
      "Er komponierte eine Oper, „Le devin du village“, die vor König Ludwig XV. aufgeführt wurde.",
      "Er erfand ein eigenes Notensystem aus Zahlen statt Noten.",
      "Ausgerechnet der Autor eines berühmten Erziehungsbuchs gab seine fünf Kinder ins Findelhaus."
    ]
  },
  "John Rawls": {
    ort: "Baltimore (USA)",
    bio: "Rawls wurde 1921 in Baltimore geboren. Er studierte in Princeton und war im Zweiten Weltkrieg Soldat im Pazifik, in Neuguinea, auf den Philippinen und danach in Japan. Die Kriegserfahrung ließ ihn seinen christlichen Glauben aufgeben. Nach der Promotion 1950 lehrte er in Cornell und am MIT, ab 1962 dann an der Harvard University, bis er 1991 in den Ruhestand ging. 1971 erschien „Eine Theorie der Gerechtigkeit“, an der er rund 20 Jahre gearbeitet hatte. Darin schlägt er ein Gedankenexperiment vor: Hinter einem „Schleier des Nichtwissens“ wählen Menschen Regeln für die Gesellschaft, ohne ihre eigene Stellung darin zu kennen. Das Buch entstand in der Zeit der Bürgerrechtsbewegung und des Vietnamkriegs und belebte die politische Philosophie neu. Spätere Werke sind „Politischer Liberalismus“ (1993) und „Das Recht der Völker“ (1999). Er starb 2002 in Lexington (Massachusetts).",
    fun: [
      "Als Soldat sah er kurz nach dem Atombombenabwurf die Ruinen von Hiroshima.",
      "Er stotterte sein Leben lang und hielt trotzdem jahrzehntelang Vorlesungen.",
      "1999 erhielt er von US-Präsident Bill Clinton die National Humanities Medal."
    ]
  },
  "Niccolò Machiavelli": {
    ort: "Florenz",
    bio: "Machiavelli wurde 1469 in Florenz geboren und starb dort 1527. Ab 1498 war er hoher Beamter und Diplomat der Republik Florenz. Er reiste an den französischen Hof und zu Cesare Borgia und sah, wie Fürsten Macht gewinnen und verlieren. Italien war damals in viele Staaten zersplittert, und fremde Heere aus Frankreich und Spanien führten dort Krieg. Als die Familie Medici 1512 an die Macht zurückkehrte, verlor er sein Amt, wurde 1513 verhaftet und gefoltert. Auf seinem Landgut schrieb er danach „Der Fürst“ (1513). Darin trennt er Politik von der Moral: Ein Herrscher muss tun, was den Staat erhält. In den „Discorsi“ lobt er dagegen die Republik nach dem Vorbild Roms. Das Wort „machiavellistisch“ steht heute für skrupellose Machtpolitik.",
    fun: [
      "„Der Fürst“ wurde erst 1532 gedruckt, fünf Jahre nach seinem Tod.",
      "Er schrieb auch Theaterstücke, darunter die Komödie „Mandragola“.",
      "Abends zog er sich nach eigenen Worten festliche Kleider an, um in Gedanken mit den antiken Autoren zu sprechen."
    ]
  },
  "Max Weber": {
    ort: "Erfurt",
    bio: "Weber wurde 1864 in Erfurt geboren und wuchs in Berlin auf. Weber studierte Rechtswissenschaft und wurde Professor für Nationalökonomie in Freiburg und Heidelberg. Ab 1898 konnte er wegen einer schweren psychischen Krankheit jahrelang nicht unterrichten. Er gilt als einer der Begründer der Soziologie. Berühmt sind „Die protestantische Ethik und der Geist des Kapitalismus“ (1904/05) und seine Vorträge „Wissenschaft als Beruf“ (1917) und „Politik als Beruf“. Er fragte, warum gerade im Westen der moderne Kapitalismus und eine rationale Bürokratie entstanden. Er sprach von der „Entzauberung der Welt“: Magie und Religion verlieren an Macht, Rechnen und Planen gewinnen. Er starb 1920 in München. Sein Hauptwerk „Wirtschaft und Gesellschaft“ erschien erst nach seinem Tod.",
    fun: [
      "Seinen Vortrag „Politik als Beruf“ hielt er 1919 vor Studierenden in München. Er wird bis heute zitiert.",
      "1909 gründete er die Deutsche Gesellschaft für Soziologie mit.",
      "Er beriet die Kommission, die 1919 die Weimarer Verfassung vorbereitete."
    ]
  },
  "Leo Strauss": {
    ort: "Kirchhain (Hessen)",
    bio: "Strauss wurde 1899 in Kirchhain in einer jüdischen Familie geboren. Er studierte in Marburg, Hamburg und Freiburg, unter anderem bei Husserl und Heidegger. 1921 promovierte er in Hamburg bei Ernst Cassirer. Danach forschte er in Berlin an der Akademie für die Wissenschaft des Judentums und schrieb ein Buch über Spinozas Religionskritik (1930). 1932 verließ er Deutschland mit einem Stipendium und blieb nach 1933 im Exil, zuerst in Frankreich und England, ab 1937 in den USA. Er lehrte an der New School in New York und von 1949 bis 1969 an der University of Chicago. Das Scheitern der Weimarer Republik prägte sein Denken: Er hielt den Relativismus, der alle Werte für gleich gültig erklärt, für gefährlich. In „Naturrecht und Geschichte“ (1953) verteidigt er deshalb die Frage nach dem von Natur aus Richtigen. Er starb 1973 in Annapolis.",
    fun: [
      "Er meinte, viele große Philosophen hätten aus Vorsicht „zwischen den Zeilen“ geschrieben, und las ihre Texte entsprechend genau.",
      "Seine Schülerinnen und Schüler prägten später die politische Philosophie in den USA stark.",
      "Er beschäftigte sich ebenso mit Platon wie mit jüdischen und islamischen Philosophen des Mittelalters."
    ]
  },
  "Gustav Radbruch": {
    ort: "Lübeck",
    bio: "Radbruch wurde 1878 in Lübeck geboren und studierte Rechtswissenschaft in München, Leipzig und Berlin. Er war Professor für Strafrecht und Rechtsphilosophie, unter anderem in Kiel und Heidelberg. 1914 erschienen seine „Grundzüge der Rechtsphilosophie“, in denen er fragt, wie Gerechtigkeit, Zweckmäßigkeit und Rechtssicherheit zueinander stehen. In der Weimarer Republik war er für die SPD Reichstagsabgeordneter und zweimal Reichsjustizminister (1921-1922 und 1923). Er setzte sich für eine humanere Strafjustiz ein und wollte die Todesstrafe abschaffen. 1933 entließen ihn die Nationalsozialisten. Nach dem Krieg formulierte er 1946 die nach ihm benannte Radbruchsche Formel: Ein Gesetz, das in unerträglichem Maß ungerecht ist, verliert seine Geltung. Damit reagierte er auf die Verbrechen, die im Nationalsozialismus durch Gesetze gedeckt waren. Er starb 1949 in Heidelberg.",
    fun: [
      "Er war 1933 einer der ersten Professoren, die von den Nationalsozialisten aus dem Amt entfernt wurden.",
      "Er besuchte in Lübeck dasselbe Gymnasium wie der Schriftsteller Thomas Mann.",
      "Deutsche Gerichte stützten sich auf seine Formel, als sie nach 1990 über die Schüsse an der Berliner Mauer urteilten."
    ]
  },
  "Michail Bakunin": {
    ort: "Prjamuchino (Russland)",
    bio: "Bakunin wurde 1814 in Prjamuchino geboren, stammte aus einer russischen Adelsfamilie und war zunächst Offizier. Danach beschäftigte er sich in Moskau und ab 1840 in Berlin mit der Philosophie Hegels und zog nach Westeuropa. 1849 kämpfte er beim Maiaufstand in Dresden. Er wurde verhaftet, in Sachsen und Österreich zum Tod verurteilt, an Russland ausgeliefert und nach Jahren in Festungshaft nach Sibirien verbannt. Nach seiner Flucht wurde er zum bekanntesten Vertreter des Anarchismus: Die Menschen sollen ohne Staat und Herrschaft in freien Gemeinschaften zusammenleben. Darum lehnte er auch eine Diktatur der Arbeiter ab, wie sie Marx vorschwebte. Sein Buch „Staatlichkeit und Anarchie“ erschien 1873, drei Jahre vor seinem Tod in Bern. Seine Ideen wirkten auf die Arbeiterbewegung in Spanien, Italien und Lateinamerika.",
    fun: [
      "Aus Sibirien floh er 1861 einmal um die halbe Welt: über Japan und die USA nach London.",
      "In Dresden stand er 1849 zusammen mit dem Komponisten Richard Wagner auf der Seite der Aufständischen.",
      "Mit Karl Marx stritt er so heftig, dass er 1872 aus der Internationalen Arbeiterassoziation ausgeschlossen wurde."
    ]
  },
  "Robert Nozick": {
    ort: "New York",
    bio: "Robert Nozick wurde 1938 in Brooklyn (New York) geboren. Er studierte an der Columbia University, promovierte 1963 in Princeton und lehrte ab 1969 bis zu seinem Tod 2002 an der Harvard University. 1974 erschien „Anarchie, Staat, Utopia“, eine Antwort auf „Eine Theorie der Gerechtigkeit“ (1971) von John Rawls, seinem Kollegen an derselben Universität. Darin verteidigt Nozick einen Minimalstaat: Der Staat soll nur vor Gewalt, Diebstahl und Betrug schützen und Verträge durchsetzen. Steuern, die Einkommen umverteilen, hält er für unrecht, weil sie in die Rechte der Einzelnen eingreifen. Gerecht ist ein Besitz, wenn er auf faire Weise erworben oder weitergegeben wurde. Später schrieb er vor allem über Erkenntnis, Rationalität und den Sinn des Lebens. In „The Examined Life“ (1989) rückte er selbst von Teilen seiner früheren Position ab. Sein Buch von 1974 ist bis heute ein Grundtext der Debatte über soziale Gerechtigkeit.",
    fun: [
      "Mit 30 Jahren wurde er ordentlicher Professor in Harvard, eine der jüngsten Berufungen dort.",
      "Rawls und Nozick hatten ihre Büros an derselben Fakultät, obwohl sie politisch gegensätzliche Theorien vertraten.",
      "Er erfand die „Erlebnismaschine“: ein Gedankenexperiment, ob ein künstlich erzeugtes glückliches Leben genügen würde."
    ]
  },
  "Simone de Beauvoir": {
    ort: "Paris",
    bio: "Simone de Beauvoir wurde 1908 in Paris geboren und wuchs in einer katholischen, bürgerlichen Familie auf. Sie studierte Philosophie an der Sorbonne und unterrichtete danach an Gymnasien in Marseille, Rouen und Paris. 1943, während der deutschen Besatzung, verlor sie ihre Stelle und lebte von da an als Schriftstellerin. 1945 gründete sie mit Jean-Paul Sartre, mit dem sie lebenslang verbunden war, die Zeitschrift „Les Temps Modernes“. 1949 erschien „Das andere Geschlecht“, ein Grundlagenwerk des Feminismus. Darin zeigt sie, wie die Gesellschaft die Frau als „das Andere“ des Mannes bestimmt und ihr so Freiheit nimmt. Dahinter steht der Existentialismus: Der Mensch hat kein festes Wesen, er macht sich selbst durch sein Handeln. In ihren Erinnerungen, etwa „Memoiren einer Tochter aus gutem Hause“ (1958), beschreibt sie ihren eigenen Weg aus diesem Rollenbild. Sie starb 1986 in Paris.",
    fun: [
      "1929 bestand sie die schwierige Lehramtsprüfung in Philosophie als Zweitbeste, direkt hinter Sartre, und als damals jüngste Absolventin.",
      "Für ihren Roman „Die Mandarins von Paris“ erhielt sie 1954 den Prix Goncourt.",
      "Ihr berühmtester Satz lautet: „Man kommt nicht als Frau zur Welt, man wird es.“"
    ]
  },
  "Albert Camus": {
    ort: "Mondovi (Algerien)",
    bio: "Albert Camus wurde 1913 in Mondovi im damals französischen Algerien geboren. Sein Vater fiel 1914 im Ersten Weltkrieg, danach wuchs Camus mit seiner Mutter in großer Armut in Algier auf. Ein Lehrer förderte ihn, so kam er aufs Gymnasium. Mit 17 Jahren erkrankte er an Tuberkulose. Er studierte Philosophie in Algier und arbeitete als Journalist. Im Zweiten Weltkrieg war er in der Résistance aktiv und schrieb für die Untergrundzeitung „Combat“. Mit „Der Fremde“ und „Der Mythos des Sisyphos“ (beide 1942) wurde er berühmt. Beide Bücher handeln vom Absurden: Der Mensch sucht Sinn, aber die Welt gibt keine Antwort. Camus antwortet darauf mit der Revolte, einem bewussten Leben trotz allem. In „Die Pest“ (1947) kämpfen Menschen gemeinsam gegen eine Seuche. „Der Mensch in der Revolte“ (1951) kritisiert Gewalt im Namen der Geschichte, auch im Kommunismus. Darüber zerstritt er sich 1952 mit Jean-Paul Sartre.",
    fun: [
      "In seiner Jugend war er Torwart in einem Fußballverein in Algier.",
      "1957 erhielt er mit 44 Jahren den Literaturnobelpreis, als einer der jüngsten Preisträger.",
      "Er starb 1960 bei einem Autounfall. In seiner Tasche fand man eine ungenutzte Zugfahrkarte für dieselbe Strecke."
    ]
  },
  "Arnold Gehlen": {
    ort: "Leipzig",
    bio: "Arnold Gehlen wurde 1904 in Leipzig geboren. Er studierte in Leipzig und Köln und promovierte 1927 in Leipzig. 1933 trat er der NSDAP bei und wurde danach Professor für Philosophie in Leipzig, Königsberg und Wien. Sein Hauptwerk „Der Mensch. Seine Natur und seine Stellung in der Welt“ erschien 1940 und gilt als Grundtext der philosophischen Anthropologie, also der Lehre vom Wesen des Menschen. Gehlen vergleicht darin Mensch und Tier: Der Mensch hat keine festen Instinkte und keine passende natürliche Umwelt, deshalb muss er handeln und sich seine Welt selbst schaffen. Nach dem Krieg verlor er seine Professur. Von 1947 bis 1961 lehrte er an der Verwaltungshochschule in Speyer, von 1962 bis 1969 war er Professor für Soziologie in Aachen. In „Die Seele im technischen Zeitalter“ (1957) und „Moral und Hypermoral“ (1969) kritisierte er die moderne Gesellschaft und die Studentenbewegung. Seine Anthropologie wird bis heute diskutiert.",
    fun: [
      "Den Ausdruck „Mängelwesen“ für den Menschen übernahm er vom Philosophen Johann Gottfried Herder.",
      "Er meinte, Institutionen wie Familie oder Staat „entlasten“ den Menschen, weil er nicht alles neu entscheiden muss.",
      "In den 1960er Jahren diskutierte er im Radio mit Theodor W. Adorno, mit dem er in vielem überhaupt nicht übereinstimmte."
    ]
  },
  "Adam Smith": {
    ort: "Kirkcaldy (Schottland)",
    bio: "Adam Smith wurde 1723 in Kirkcaldy getauft, sein genaues Geburtsdatum ist unbekannt. Er studierte in Glasgow, wo ihn der Philosoph Francis Hutcheson prägte, und danach in Oxford. 1752 wurde er Professor für Moralphilosophie in Glasgow. Er lebte in der Zeit der schottischen Aufklärung und war eng mit David Hume befreundet. 1759 erschien „Die Theorie der ethischen Gefühle“: Moral entsteht darin aus Mitgefühl und aus dem Blick eines gedachten „unparteiischen Zuschauers“. Ab 1764 begleitete er einen jungen Herzog als Hauslehrer nach Frankreich und lernte dort führende Ökonomen kennen. 1776 erschien „Der Wohlstand der Nationen“. Darin erklärt er Wohlstand durch Arbeitsteilung und freien Handel. Mit diesem Buch gilt er als Begründer der modernen Volkswirtschaftslehre. Ab 1778 arbeitete er als Zollbeamter in Edinburgh, wo er 1790 starb. Sein Bild von der „unsichtbaren Hand“ des Marktes wird bis heute zitiert.",
    fun: [
      "Er soll als Kleinkind kurz von Fahrenden entführt und schnell wiedergefunden worden sein.",
      "Er war berühmt für seine Zerstreutheit und soll einmal in Gedanken versunken im Morgenmantel weit aus der Stadt hinausgelaufen sein.",
      "Er war jahrelang auf der britischen 20-Pfund-Note abgebildet."
    ]
  },
  "Hans Jonas": {
    ort: "Mönchengladbach",
    bio: "Hans Jonas wurde 1903 in Mönchengladbach in eine jüdische Familie geboren. Er studierte in Freiburg, Berlin, Heidelberg und Marburg, unter anderem bei Husserl und Heidegger. Bei Heidegger promovierte er über die Gnosis, eine religiöse Bewegung der Spätantike. Als Jude verließ er Deutschland 1933 und ging nach London und Palästina. Im Zweiten Weltkrieg kämpfte er in der Jüdischen Brigade der britischen Armee. Seine Mutter wurde in Auschwitz ermordet. Ab 1949 lehrte er in Kanada, von 1955 bis 1976 an der New School for Social Research in New York. 1979 erschien „Das Prinzip Verantwortung“. Seine These: Die moderne Technik kann die Natur und die Zukunft der Menschheit zerstören. Deshalb braucht es eine Ethik der Verantwortung für kommende Generationen. Sinngemäß fordert er: Handle so, dass auch in Zukunft echtes menschliches Leben auf der Erde möglich ist. Er starb 1993 bei New York. Seine Ideen prägen heute die Umwelt- und Technikethik.",
    fun: [
      "Er hatte geschworen, nur als Soldat einer siegreichen Armee nach Deutschland zurückzukehren, und tat das 1945.",
      "Seit dem Studium war er eng mit Hannah Arendt befreundet.",
      "1987 erhielt er den Friedenspreis des Deutschen Buchhandels."
    ]
  },
  "Seneca": {
    ort: "Córdoba (Spanien)",
    bio: "Lucius Annaeus Seneca wurde um die Zeitenwende in Córdoba geboren, sein Vater war ein bekannter Lehrer der Redekunst. Als Kind kam er nach Rom und lernte dort Rhetorik und Philosophie, vor allem die Stoa. Diese Schule lehrt, dass man durch Vernunft innere Ruhe findet, auch im Unglück. Er wurde Redner, Politiker und Schriftsteller. Kaiser Claudius verbannte ihn 41 n. Chr. nach Korsika. 49 n. Chr. holte ihn Agrippina, die Mutter Neros, zurück. Er wurde Erzieher und später Berater des jungen Kaisers Nero und lenkte in dessen ersten Regierungsjahren die Politik mit. 62 n. Chr. zog er sich vom Hof zurück und schrieb die „Briefe an Lucilius“ über ein gutes Leben. 65 n. Chr. warf man ihm vor, an einer Verschwörung beteiligt zu sein. Er musste sich auf Befehl Neros das Leben nehmen. Sein Leben zeigt die Spannung zwischen stoischer Lehre und Macht. Seine Schriften lesen viele bis heute als praktische Lebenshilfe.",
    fun: [
      "Er predigte ein einfaches Leben, war aber einer der reichsten Männer Roms.",
      "Acht Jahre verbrachte er in der Verbannung auf der Insel Korsika.",
      "Er schrieb nicht nur philosophische Briefe, sondern auch Tragödien wie „Medea“."
    ]
  },
  "Epiktet": {
    ort: "Hierapolis (Phrygien, heutige Türkei)",
    bio: "Epiktet wurde um 50 n. Chr. in Hierapolis in Phrygien geboren und kam als Sklave nach Rom. Sein Herr Epaphroditos, ein Freigelassener am Hof Kaiser Neros, ließ ihn beim Stoiker Musonius Rufus lernen. Nach seiner Freilassung lehrte Epiktet selbst in Rom. Als Kaiser Domitian die Philosophen aus Rom verbannte (um 90 n. Chr.), gründete er eine Schule in Nikopolis im Nordwesten Griechenlands. Er schrieb selbst nichts. Sein Schüler Arrian schrieb seine Lehrgespräche (die „Diatriben“) mit und fasste die Lehre im „Handbüchlein“ zusammen. Im Zentrum steht eine Unterscheidung: Manches liegt in unserer Macht, etwa unsere Urteile und Wünsche. Anderes liegt nicht in unserer Macht, etwa Körper, Besitz und Ruf. Frei ist, wer sich nur um das Erste kümmert. Seine Erfahrung als Sklave passt zu dieser Lehre: Die innere Freiheit kann einem niemand nehmen. Epiktets Gedanken wirken bis heute, etwa in der kognitiven Verhaltenstherapie.",
    fun: [
      "Sein Name bedeutet auf Griechisch „der Erworbene“, also: der Gekaufte.",
      "Er hinkte. Der Überlieferung nach verdrehte ihm sein Herr das Bein, und Epiktet sagte nur ruhig: „Du wirst es brechen.“ Als es brach: „Habe ich es dir nicht gesagt?“",
      "Kaiser Mark Aurel las ihn begeistert und zitiert ihn in seinen „Selbstbetrachtungen“."
    ]
  },
  "Peter Singer": {
    ort: "Melbourne (Australien)",
    bio: "Peter Singer wurde 1946 in Melbourne geboren. Seine Eltern waren Wiener Juden, die 1938 vor den Nationalsozialisten nach Australien geflohen waren. Mehrere seiner Großeltern wurden im Holocaust ermordet. Er studierte in Melbourne und Oxford. 1975 erschien „Animal Liberation“ (Die Befreiung der Tiere), das als Gründungstext der Tierrechtsbewegung gilt. Singer ist Utilitarist: Richtig ist, was die Interessen aller Betroffenen am besten berücksichtigt. Dazu zählen für ihn auch Tiere, weil sie leiden können. Sie ohne guten Grund schlechter zu behandeln, nennt er „Speziesismus“. Sein Buch „Praktische Ethik“ (1979) wurde ein Standardwerk. Seine Thesen zur Tötung schwer behinderter Neugeborener lösten heftige Proteste aus, besonders in Deutschland. Von 1999 bis 2024 lehrte er an der Princeton University, heute ist er emeritiert. In seinem Aufsatz „Famine, Affluence, and Morality“ (1972) forderte er, dass Wohlhabende viel mehr gegen Armut tun.",
    fun: [
      "Seit seiner Studienzeit in Oxford lebt er vegetarisch.",
      "Er gründete die Organisation „The Life You Can Save“, die zum wirksamen Spenden gegen Armut aufruft.",
      "Er spendet nach eigenen Angaben einen großen Teil seines Einkommens."
    ]
  },
  "Sextus Empiricus": {
    ort: "",
    bio: "Über das Leben von Sextus Empiricus ist sehr wenig bekannt. Er lebte wahrscheinlich im 2. oder 3. Jahrhundert n. Chr., schrieb auf Griechisch und war Arzt. Er gehörte zu den Pyrrhoneern, die sich auf Pyrrhon von Elis (um 360-270 v. Chr.) beriefen. Seine Schriften, vor allem der „Grundriss der pyrrhonischen Skepsis“, sind die wichtigste Quelle für die antike Skepsis. In seinem großen Werk „Gegen die Gelehrten“ (Adversus mathematicos) prüft er die Lehren anderer Philosophenschulen und der Wissenschaften seiner Zeit. Seine Methode: Zu jeder Behauptung stellt man eine gleich starke Gegenbehauptung. Weil man nicht entscheiden kann, welche wahr ist, hält man sich mit dem Urteil zurück (griechisch „Epoché“). Daraus folgt nach Sextus die Seelenruhe (Ataraxie). Für ihn war Skepsis also keine Theorie, sondern eine Lebenshaltung. Am Ende des „Grundrisses“ vergleicht er den Skeptiker mit einem Arzt, der Menschen von falschen Gewissheiten heilt.",
    fun: [
      "Sein Beiname „Empiricus“ zeigt, dass er zur Ärzteschule der „Empiriker“ gehörte, die sich auf Erfahrung statt auf Theorie stützte.",
      "Man weiß weder genau, wann, noch wo er gelebt hat.",
      "Seine Bücher wurden in der Renaissance wiederentdeckt und beeinflussten Montaigne und Descartes."
    ]
  },
  "Alexis de Tocqueville": {
    ort: "Paris",
    bio: "Alexis de Tocqueville wurde 1805 in Paris geboren und stammte aus einer normannischen Adelsfamilie. In der Französischen Revolution saßen seine Eltern im Gefängnis, ein Urgroßvater starb unter der Guillotine. Er studierte Recht in Paris und wurde Richter in Versailles. Nach der Julirevolution von 1830 reiste er 1831 mit seinem Freund Gustave de Beaumont für neun Monate in die USA. Daraus entstand „Über die Demokratie in Amerika“ (1835/1840). Er wollte verstehen, wie Gleichheit eine Gesellschaft verändert, denn er hielt die Demokratie auch in Europa für unaufhaltsam. Er lobte die Freiheit, die vielen Vereine und die Selbstverwaltung der Gemeinden. Zugleich warnte er vor einer „Tyrannei der Mehrheit“. Ab 1839 war er Abgeordneter und 1849 kurz französischer Außenminister. Nach dem Staatsstreich von Louis Napoleon 1851 zog er sich aus der Politik zurück. 1856 erschien „Der alte Staat und die Revolution“. Er starb 1859 in Cannes.",
    fun: [
      "Der offizielle Grund seiner Amerikareise war ein Bericht über Gefängnisse.",
      "Mit nur 36 Jahren wurde er in die Académie française gewählt.",
      "Er sagte voraus, dass die USA und Russland einmal die beiden großen Weltmächte sein würden."
    ]
  },
  "Josef Alois Schumpeter": {
    ort: "Triesch (Mähren, heute Tschechien)",

<script>
const TF = {

  "Ethik":             {label:"Ethik", c:"#5A8A5A", s:"#E1EEDF"},

};
const TF_DARK = {"Erkenntnistheorie":"#1B3456","Ethik":"#21391F","Politische Philosophie":"#47231D","Anthropologie":"#4A2C26"};
const isDark = () => document.documentElement.classList.contains('dark');
const soft = sem => isDark() ? TF_DARK[sem] : TF[sem].s;
const dash = t => String(t).replace(/-/g, '-');
/* geschuetzte Leerzeichen: "20. Jahrhundert", "z. B." bleiben zusammen */
const nb = t => String(t).replace(/(\d+\.)\s+(?=\S)/g, '$1\u00A0').replace(/\b([zdus]\.)\s(?=[A-Za-z]\.)/g, '$1\u00A0');
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Personen bündeln (mehrere Einträge pro Person = mehrere Themenfelder) */
const PEOPLE = [];
PHILS.forEach(p => {
  let x = PEOPLE.find(y => y.name === p.name);
  if (!x) { x = {name:p.name, dates:p.dates, entries:[]}; PEOPLE.push(x); }
  x.entries.push(p);
});
const ORDER = Object.keys(TF);

/* Anker der Begriffe-Seite (begriffe.html wertet #term_... aus), 21.10.2026 */
const TERM_ID = {"Erkenntnistheorie (Epistemologie)": "term_erkenntnistheorie_epistemologie", "Wissen": "term_wissen", "Meinung (doxa)": "term_meinung_doxa", "Glaube (belief / faith)": "term_glaube_belief_faith", "Wahrheit": "term_wahrheit", "Zweifel": "term_zweifel", "A priori / A posteriori": "term_a_priori_a_posteriori", "Induktion": "term_induktion", "Deduktion": "term_deduktion", "Skeptizismus": "term_skeptizismus", "Epoché (Urteilsenthaltung)": "term_epoch_urteilsenthaltung", "Ataraxie": "term_ataraxie", "Traumargument": "term_traumargument", "Rationalismus": "term_rationalismus", "Methodischer Zweifel": "term_methodischer_zweifel", "Böser Dämon (malin génie)": "term_boeser_daemon_malin_g_nie", "Cogito ergo sum": "term_cogito_ergo_sum", "Angeborene Ideen": "term_angeborene_ideen", "Dualismus": "term_dualismus", "Solipsismus": "term_solipsismus", "Empirismus": "term_empirismus", "Tabula rasa": "term_tabula_rasa", "Kausalität": "term_kausalitaet", "Kritizismus (Kant)": "term_kritizismus_kant", "Kategorien des Verstandes": "term_kategorien_des_verstandes", "Erscheinung / Ding an sich": "term_erscheinung_ding_an_sich", "Synthetische Urteile a priori": "term_synthetische_urteile_a_priori", "Ideenlehre (Platon)": "term_ideenlehre_platon", "Doxa vs. Episteme": "term_doxa_vs_episteme", "Anamnesis": "term_anamnesis", "Höhlengleichnis": "term_hoehlengleichnis", "Falsifikation": "term_falsifikation", "Bewährung": "term_bewaehrung", "Theoriegetränktheit der Beobachtung": "term_theoriegetraenktheit_der_beobachtung", "Kritischer Rationalismus (Popper)": "term_kritischer_rationalismus_popper", "Paradigma (Kuhn)": "term_paradigma_kuhn", "Normalwissenschaft (Kuhn)": "term_normalwissenschaft_kuhn", "Paradigmenwechsel / Wissenschaftliche Revolution (Kuhn)": "term_paradigmenwechsel_wissenschaftliche_revolution_kuhn", "Inkommensurabilität (Kuhn)": "term_inkommensurabilitaet_kuhn", "Methodenpluralismus / „Anything goes\" (Feyerabend)": "term_methodenpluralismus_anything_goes_feyerabend", "Ethik": "term_ethik", "Moral": "term_moral", "Autonomie": "term_autonomie", "Menschenwürde": "term_menschenwuerde", "Verantwortung": "term_verantwortung", "Gewissen": "term_gewissen", "Tugendethik": "term_tugendethik", "Eudaimonia (Aristoteles)": "term_eudaimonia_aristoteles", "Mesotes / Goldene Mitte (Aristoteles)": "term_mesotes_goldene_mitte_aristoteles", "Zoon politikon (Aristoteles)": "term_zoon_politikon_aristoteles", "Hedonismus (Epikur)": "term_hedonismus_epikur", "Stoa / Stoizismus": "term_stoa_stoizismus", "Utilitarismus": "term_utilitarismus", "Konsequentialismus": "term_konsequentialismus", "Hedonistisches Prinzip / Hedone-Kalkül (Bentham)": "term_hedonistisches_prinzip_hedone_kalkuel_bentham", "Qualitativer Utilitarismus (Mill)": "term_qualitativer_utilitarismus_mill", "Präferenzutilitarismus (Singer)": "term_praeferenzutilitarismus_singer", "Speziesismus (Singer)": "term_speziesismus_singer", "Deontologie / Pflichtethik": "term_deontologie_pflichtethik", "Guter Wille (Kant)": "term_guter_wille_kant", "Kategorischer Imperativ": "term_kategorischer_imperativ", "Maxime": "term_maxime", "Pflicht vs. Neigung (Kant)": "term_pflicht_vs_neigung_kant", "Ethischer Relativismus": "term_ethischer_relativismus", "Ethischer Universalismus": "term_ethischer_universalismus", "Verantwortungsethik (Hans Jonas)": "term_verantwortungsethik_hans_jonas", "Staat": "term_staat", "Legitimität": "term_legitimitaet", "Legalität": "term_legalitaet", "Gewaltmonopol": "term_gewaltmonopol", "Demokratie": "term_demokratie", "Gewaltenteilung": "term_gewaltenteilung", "Naturzustand": "term_naturzustand", "Gesellschaftsvertrag": "term_gesellschaftsvertrag", "Hobbes - Leviathan": "term_leviathan_hobbes", "Locke - Liberaler Staat": "term_liberaler_staat_locke", "Rousseau - Gemeinwille (volonté générale)": "term_gemeinwille_volont_g_n_rale_rousseau", "Rawls - Schleier des Nichtwissens": "term_rawls_schleier_des_nichtwissens", "Macht als Herrschaftsinstrument (Machiavelli)": "term_macht_als_herrschaftsinstrument_machiavelli", "Macht als kollektives Handeln (Hannah Arendt)": "term_macht_als_kollektives_handeln_hannah_arendt", "Macht als Durchsetzungsfähigkeit (Max Weber)": "term_macht_als_durchsetzungsfaehigkeit_max_weber", "Naturrecht": "term_naturrecht", "Positives Recht": "term_positives_recht", "Radbruchsche Formel": "term_radbruchsche_formel", "Menschenrechte": "term_menschenrechte", "Ziviler Ungehorsam": "term_ziviler_ungehorsam", "Widerstandsrecht": "term_widerstandsrecht", "Soziale Gerechtigkeit": "term_soziale_gerechtigkeit", "Anthropologie (philosophisch)": "term_anthropologie_philosophisch", "Essentialismus": "term_essentialismus", "Existenzialismus (Sartre)": "term_existentialismus_sartre", "Sozialer Konstruktivismus": "term_sozialer_konstruktivismus", "Freiheit": "term_freiheit", "Negative Freiheit": "term_negative_freiheit", "Positive Freiheit": "term_positive_freiheit", "Willensfreiheit": "term_willensfreiheit", "Handlungsfreiheit": "term_handlungsfreiheit", "Determinismus": "term_determinismus", "Libertarismus (Freiheitsdebatte)": "term_libertarismus_freiheitsdebatte", "Kompatibilismus": "term_kompatibilismus", "Sinn des Lebens": "term_sinn_des_lebens", "Absurdismus (Albert Camus)": "term_absurdismus_albert_camus", "Nihilismus": "term_nihilismus", "Entfremdung (Marx)": "term_entfremdung_marx", "Technologie und Menschlichkeit": "term_technologie_und_menschlichkeit", "Indeterminismus": "term_indeterminismus", "Bereitschaftspotenzial": "term_bereitschaftspotenzial", "Mensch als Zweck (2. Formulierung des kategorischen Imperativs)": "term_zweck_an_sich"};
const TERMS = BEGRIFFE.map(b => b.term).filter(t => TERM_ID[t]).sort((a,b) => b.length - a.length);
function linkTerms(text){
  let out = esc(text), used = 0;
  for (const t of TERMS){
    if (used > 3) break;
    const L = 'A-Za-zÄÖÜäöüß';
    const re = new RegExp('(^|[^' + L + '])(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![' + L + '])', 'i');
    const m = re.exec(out);
    const i = m ? m.index + m[1].length : -1;
    if (i < 0 || /<a [^>]*$/.test(out.slice(0,i)) || out.slice(0,i).lastIndexOf('<a ') > out.slice(0,i).lastIndexOf('</a>')) continue;
    out = out.slice(0,i) + `<a class="xref" href="begriffe.html#${TERM_ID[t]}">${out.slice(i,i+t.length)}</a>` + out.slice(i+t.length);
    used++;
  }
  return out;
}

let fil = 'Alle', q = '';
function filters(){
  const f = document.getElementById('filters');
  f.innerHTML = ['Alle', ...ORDER].map(k => `<button type="button" class="fbtn ${fil===k?'on':''}" data-k="${k}" aria-pressed="${fil===k}">${k==='Alle'?'':`<i style="background:${TF[k].c}"></i>`}${k==='Alle'?'Alle':TF[k].label}</button>`).join('');
  f.querySelectorAll('button').forEach(b => b.onclick = () => { fil = b.dataset.k; filters(); render(); const nb2 = f.querySelector('[data-k="'+fil+'"]'); if (nb2) nb2.focus(); });
}
function render(){
  const ql = q.toLowerCase();
  const vis = PEOPLE.filter(p => (fil==='Alle' || p.entries.some(e => e.sem===fil)) &&
    (!ql || (p.name + p.entries.map(e => e.stroemung + e.kernidee + e.konzepte.join(' ')).join(' ')).toLowerCase().includes(ql)));
  const g = document.getElementById('grid');
  if (!vis.length){ g.innerHTML = '<div class="none">Keine Treffer. Suche leeren oder Filter auf Alle stellen.</div>'; return; }
  g.innerHTML = vis.map(p => {
    if (p.name === openName) return detailHTML(p);
    const sem = (fil!=='Alle' ? fil : p.entries[0].sem);
    const chips = [...new Set(p.entries.map(e => e.sem))].map(s => `<span class="chip"><i style="background:${TF[s].c}"></i>${TF[s].label}</span>`).join('');
    return `<button class="pc" data-n="${esc(p.name)}" style="--tfs:${soft(sem)}" aria-expanded="false">${portraitSVG(p.name)}<h3>${esc(p.name)}</h3><div class="d">${dash(p.dates)}</div><div class="chips">${chips}</div></button>`;
  }).join('');
  g.querySelectorAll('button.pc').forEach(b => b.onclick = () => openP(b.dataset.n));
  const big = g.querySelector('.pc.big');
  if (big) big.querySelector('.close').onclick = closeP;
}

const BULB = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 2.4 1.2 3.9 2.3 5 .8.8 1.2 1.6 1.2 2.6V18h5v-1.4c0-1 .4-1.8 1.2-2.6 1.1-1.1 2.3-2.6 2.3-5a6 6 0 0 0-6-6Z"/><path d="M9.5 21h5"/></svg>';
const PERSON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
const IDEA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg>';

let openName = null;
let vmode = 'alles';
try{ const v = localStorage.getItem('philo-vmode'); if (v === 'kern' || v === 'alles') vmode = v; }catch(e){}
function setVmode(v){ vmode = v; try{localStorage.setItem('philo-vmode', v)}catch(e){}
  document.querySelectorAll('.vbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === vmode)));
  if (openName) render(); }
document.querySelectorAll('.vbtn').forEach(b => b.onclick = () => setVmode(b.dataset.v));
function detailHTML(p){
  const full = vmode !== 'kern';
  const name = p.name;
  const b = BIO[name];
  const sem0 = (fil!=='Alle' && p.entries.some(e=>e.sem===fil)) ? fil : p.entries[0].sem;
  const entries = [...p.entries].sort((a,b) => ORDER.indexOf(a.sem) - ORDER.indexOf(b.sem));
  const chips = [...new Set(entries.map(e => e.sem))].map(s => `<span class="chip"><i style="background:${TF[s].c}"></i>${TF[s].label}</span>`).join('');
  return `<article class="pc big" id="open" style="--tfs:${soft(sem0)}"><div class="inner">
    <button class="close" aria-label="Schliessen">×</button>
    <div class="dh">${portraitSVG(name)}<div><h2>${esc(name)}</h2><div class="meta">${dash(p.dates)}${b?' · geboren in '+esc(b.ort):''}</div><div class="chips">${chips}</div></div></div>
    ${full?`<div class="sec"><div class="lab">${PERSON}Biografie</div>${b?`<p class="bio">${esc(nb(b.bio))}</p>`:'<p class="pending">Folgt.</p>'}</div>`:''}
    ${full&&b&&b.fun?`<div class="sec"><div class="lab">${BULB}Fun Facts</div><ul class="fun">${b.fun.map(f=>`<li>${esc(nb(f))}</li>`).join('')}</ul></div>`:''}
    <div class="sec"><div class="lab">${IDEA}Kerngedanken</div>
      ${entries.map(e => {
        const t = TF[e.sem];
        const kon = e.konzepte.map(c => { const i = c.indexOf(':'); return i>0 ? `<li><span><b>${esc(c.slice(0,i))}</b>: ${linkTerms(c.slice(i+1).trim())}</span></li>` : `<li><span>${esc(c)}</span></li>`; }).join('');
        const vg = (e.querverbindungen||[]).map(id => TOPICS[id] ? `<a href="vergleiche.html?id=${id}">Vergleich: ${esc(dash(TOPICS[id].name))}</a>` : '').join('');
        return `<div class="kg" style="--tf:${t.c};--tfs:${soft(e.sem)}">
          <div class="kg-h"><span class="chip"><i style="background:${t.c}"></i>${t.label}</span><span class="str">${esc(e.stroemung)}</span></div>
          <p class="kern">${linkTerms(e.kernidee)}</p>
          <ul class="kon">${kon}</ul>
          <div class="merk"><span>Merksatz</span><p>${esc(e.merksatz)}</p></div>
          ${vg?`<div class="links-v">${vg}</div>`:''}
        </div>`;
      }).join('')}
    </div></div></article>`;
}
function openP(name){
  openName = name; render();
  const el = document.getElementById('open');
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  const cb = el && el.querySelector('.close'); if (cb) cb.focus({preventScroll:true});
  history.replaceState(null, '', '#' + encodeURIComponent(name));
}
function closeP(){
  const n = openName; openName = null; render();
  const card = [...document.querySelectorAll('button.pc')].find(b => b.dataset.n === n);
  if (card){ card.scrollIntoView({behavior:'smooth', block:'center'}); card.focus({preventScroll:true}); }
  history.replaceState(null, '', location.pathname + location.search);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openName) closeP(); });
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });

(function(){
  const h = document.documentElement, b = document.getElementById('themeBtn');
  const p = () => { const d = h.classList.contains('dark'); b.innerHTML = '<svg aria-hidden="true"><use href="#i-' + (d ? 'sonne' : 'mond') + '"/></svg>'; b.setAttribute('aria-pressed', String(d)); };
  p();
  b.onclick = () => { const d = h.classList.toggle('dark'); try{localStorage.setItem('philo-theme', d?'dark':'light')}catch(e){} p(); render(); };
  const bg = document.getElementById('burger');
  bg.onclick = () => { const o = document.getElementById('links').classList.toggle('open'); bg.setAttribute('aria-expanded', String(o)); };
})();

filters(); setVmode(vmode); render();
const params = new URLSearchParams(location.search);
const start = decodeURIComponent(location.hash.slice(1)) || params.get('name');
if (start) openP(start);
</script>

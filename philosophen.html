s Wesen ist.","Allen Rechten geht ein Recht voraus: das Recht, Rechte zu haben, also dazuzugehören.","Wer ernsthaft mit anderen streitet, erkennt sie schon als Gleichberechtigte an.","Menschenrechte wachsen nicht durch Argumente, sondern durch die Erziehung der Gefühle."]},{"label":"Worauf gründen Menschenrechte?","values":["• Würde: Wert, der keinen Preis hat. Sie gründet in der Vernunft.\n• Autonomie: Vernunftwesen geben sich selbst Gesetze. Das verleiht ihnen gleiche Würde.\n• Zweckformel: Jeder Mensch ist Zweck an sich, nie bloß Mittel.","• Recht auf Rechte: das Recht, einer politischen Gemeinschaft anzugehören, in der man nach Handlungen und Meinungen beurteilt wird.\n• Aporie der Menschenrechte (Ausweglosigkeit): Die Staatenlosen des 20. Jahrhunderts waren nur noch Menschen, und gerade sie verloren alle Rechte.\n• Drei Verluste: Heimat, Schutz einer Regierung und, am grundlegendsten, die Zugehörigkeit. Staatenlose sind «politisch gesprochen, lebende Leichname».","• Jede Diskussion, die auf Verständigung zielt, setzt gegenseitige Anerkennung, Perspektivenübernahme und Lernbereitschaft voraus. Das wissen alle intuitiv, unabhängig von ihrer Kultur.\n→ Wer ernsthaft argumentiert, erkennt den anderen als Gleichberechtigten an. Darin steckt der Kern der Menschenrechte.","• Wer Rechte bekommt, hängt davon ab, wen wir zur moralischen Gemeinschaft zählen.\n• Kants Forderung gleicher Achtung ist gut, wurde aber «noch nie durch ein auf neutralen Prämissen beruhendes Argument begründet». Ausgrenzung ist tief empfunden und Teil der Identität, nicht bloß ein Denkfehler.\n→ Statt Begründung: sentimentale Erziehung durch Geschichten, Romane und Begegnungen, die lehren, sich in Verachtete hineinzuversetzen. Querbezug: Humes Sympathie, Smiths unparteiischer Zuschauer."]},{"label":"Wer sichert sie?","values":["• Jeder Staat: Kein Staat verleiht diese Rechte, er muss sie nur achten.\n• Verfassungen und internationale Erklärungen schreiben Rechte fest, die vor dem Staat gelten (AEMR Art. 1).","• Eine politische Gemeinschaft: Ein Staatsbürger trägt seinen Rechtsstatus überallhin mit. Wer zu keinem Staat gehört, hört auf, eine juristische Person zu sein.\n• Die AEMR reagiert: Art. 6 (Rechtsperson), Art. 15 (Recht auf Staatsangehörigkeit).\n• Fall Nasseri: 18 Jahre im Pariser Flughafen, versorgt, aber ohne Platz in einer Gemeinschaft.","• Janusgesicht: Moralisch gelten Menschenrechte für alles, «was Menschenantlitz trägt». Rechtlich schützen sie nur Mitglieder einer Rechtsgemeinschaft.\n• Zwei Wege: Alle Staaten werden demokratische Rechtsstaaten, oder jeder wird direkt Weltbürger (Weltbürgerrecht, AEMR Art. 28).\n→ Ein wirksames Weltbürgerrecht würde Arendts Lücke schließen.","• Eine Menschenrechtskultur: Sie wächst durch Geschichten, Filme und Begegnungen, am besten bei Menschen, die sicher und geborgen aufwachsen."]},{"label":"Universal oder westlich?","values":["• Universal kraft Vernunft: Menschenrechte gelten unabhängig von Kultur, Religion und Staat.\n• Einwand: Wessen Vernunft? Westliche Begriffe haben andere Kulturen oft ausgeschlossen.","• Universal gemeint, faktisch an Staaten gebunden: Gerade wer nur noch Mensch ist, verliert seine Rechte.","• Kulturübergreifend begründbar: Die Voraussetzungen der Verständigung kennen alle.\n• Nimmt den Einwand ernst, Menschenrechte seien ein Machtanspruch des Westens: Die westliche Form muss «nicht die einzige oder gar die beste» sein.","• Universalität ist kein Fundament, sondern ein Ziel.\n• Rorty bekennt sich offen zu «unserer eurozentrischen Menschenrechtskultur» und hofft, dass sie sich ausbreitet."]},{"label":"Was erklärt sie gut?","values":["• Warum Rechte vor jedem Staat gelten.\n• Prägt die AEMR (Art. 1).","• Zeigt eine reale Lücke im System der Nationalstaaten.\n• Erklärt, warum Rechte Zugehörigkeit brauchen.","• Begründung über Kulturen hinweg, nicht auf westlichen Glauben angewiesen.\n• Grundlage, um Missbrauch zu kritisieren, etwa wenn ein Staat Menschenrechte nur nutzt, wenn es ihm dient.","• Realistisch: erklärt, wie Menschenrechtskultur tatsächlich wächst.\n• Nimmt die Tiefe von Ausgrenzung ernst."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Überzeugt nur, wer andere schon als vernünftig anerkennt.\n• Sichert nichts ohne Gemeinschaft (Arendt).","• **Stärkster Einwand:** Nennt keine Instanz, die das Recht auf Rechte garantiert. Die EMRK schließt die Lücke nur regional und nur gegenüber Staaten, die sich gebunden haben.\n• Bindet Rechte an Gemeinschaften, die selbst ausgrenzen können.","• **Stärkster Einwand:** Setzt voraus, dass alle sich verständigen wollen. Wer andere nur ausschließen will, wird nicht erreicht.\n• Abstrakt, und beide Wege (Rechtsstaaten überall, Weltbürgerrecht) liegen noch in weiter Ferne.","• **Stärkster Einwand:** Kein Maßstab gegen Propaganda: Auch Hass wird über Gefühle erzeugt.\n• Gefühle können sich wieder verengen, etwa in Krisen und Kriegen.\n• Wer nicht sicher und wohlhabend aufwächst, bleibt außen vor."]},{"label":"Fazit","values":["• Keiner der vier ist gegen die Menschenrechte. Der Streit geht um das Fundament, nicht um das Ziel.\n• Vernunft (Kant), Zugehörigkeit (Arendt), Diskurs (Habermas) oder Gefühl (Rorty): Sie unterscheiden sich darin, was Menschenrechte trägt und was sie sichert."],"span":true}]},"grenzen":{"sem":"Politische Philosophie","name":"Grenzen staatlicher Macht (Ausblick)","leitfrage":"Wie weit darf staatliche Macht gehen - und wann muss man ihr widerstehen?","conn":["liberalismus","vertragstheorie","machttheorie","demokratie"],"positions":["Anarchismus","Libertarismus","Republikanismus"],"rows":[{"label":"Hinweis","values":["Vertiefung, nicht prüfungsrelevant. Prüfungsstoff zu den Grenzen des Staates: Hobbes, Locke, Rousseau (Vertragstheorie), Rawls und Nozick (Soziale Gerechtigkeit), Ziviler Ungehorsam und Widerstandsrecht."],"span":true},{"label":"Einstieg","values":["Achse Staatsmacht\n← weniger Staatsmacht · Kein Staat (Anarchismus) → Minimalstaat (Libertarismus) → Staat mit Schutz vor Willkür (Republikanismus) → Totaler Staat (Totalitarismus, siehe unten) · mehr Staatsmacht →"],"span":true},{"label":"Hauptvertreter","values":["**Michail Bakunin** (1814-1876), **Pjotr Kropotkin** (1842-1921)","**Robert Nozick** (1938-2002), **Friedrich August von Hayek** (1899-1992)","**Philip Pettit** (*1945), **Quentin Skinner** (*1940); Vorbild: **Cicero** (106-43 v. Chr.)"]},{"label":"Hauptwerk","values":["**Staatlichkeit und Anarchie** (1873)","**Anarchie, Staat, Utopia** (1974)","**Republicanism** (1997)"]},{"label":"Merksatz","values":["Jeder Staat unterdrückt; Freiheit gibt es nur ohne Zwang und Herrschaft.","Der Staat darf nur so viel Macht haben, wie der Schutz individueller Rechte verlangt.","Frei ist, wer keiner willkürlichen Herrschaft ausgeliefert ist."]},{"label":"Was heißt Freiheit?","values":["• Keine Herrschaft: auch keine demokratisch legitimierte.\n• Ordnung soll durch freiwillige Zusammenarbeit entstehen, nicht durch Zwang.","• Nicht-Einmischung: Möglichst wenig soll verboten sein.\n→ Minimalstaat: Der Staat soll schützen, nicht umverteilen (siehe Soziale Gerechtigkeit, Nozick).","• Nicht-Beherrschung: Niemand soll willkürlicher Herrschaft ausgeliefert sein, auch nicht gutmeinender.\n• Institutionen sichern diese Freiheit."]},{"label":"Verhältnis zur Demokratie","values":["• Auch demokratische Mehrheiten können unterdrücken: 51 % können 49 % entrechten.\n• Bevorzugt Konsens in kleinen Gemeinschaften statt Mehrheitsentscheid.","• Demokratie ist nur gut, wenn sie Rechte schützt. Die Verfassung ist wichtiger als Wahlen.\n• Hayek: Ohne Grenzen durch die Verfassung kann Demokratie in Tyrannei kippen.","• Demokratie braucht starke Institutionen.\n• Pettit: Herrschaft ist nur legitim, wenn alle wirksam Einspruch erheben können (Anfechtbarkeit)."]},{"label":"Wann ist Widerstand berechtigt?","values":["• Jede Herrschaft ist widerstandswürdig.\n• Direkte Aktion und Verweigerung als Dauermittel.","• Wenn der Staat über seinen Schutzauftrag hinausgreift.","• Letztes Mittel, wenn Institutionen selbst willkürlich herrschen.\n• Cicero: Tyrannenmord, wenn der Tyrann das Gemeinwohl zerstört."]},{"label":"Kritikpunkte","values":["• Ist freiwillige Zusammenarbeit in großen Gesellschaften möglich?\n• Ohne Gewaltmonopol: Wer schützt die Schwachen?","• Ohne Sozialstaat entstehen extreme Ungleichheiten.\n• Viele Eigentumsrechte entstanden durch Gewalt.","• Wer bestimmt, was Willkür und Beherrschung ist?\n• Was, wenn die Institutionen selbst korrupt sind?"]},{"label":"Ausblick","values":["Totalitarismus: keine vierte Position, sondern die Gegenfolie\n• Totale Herrschaft will alle Lebensbereiche kontrollieren und zerstört den politischen Raum, in dem Menschen gemeinsam handeln. Beispiele: NS-Deutschland (1933-1945), die Sowjetunion unter Stalin.\n• **Hannah Arendt**, **Elemente und Ursprünge totaler Herrschaft** (1951): Auch totale Herrschaft braucht eine Machtbasis, die Geheimpolizei und ihr Netz von Spitzeln. Gewalt kann Macht vernichten, aber nicht erzeugen.\n• **Karl Popper** (1902-1994): In einer Demokratie kann man die Regierung ohne Blutvergießen abwählen. Genau das schließt totale Herrschaft aus.\n→ Alle drei Positionen oben enthalten ein Recht auf Widerstand gegen totalitäre Ansprüche (Vergleich Ziviler Ungehorsam und Widerstandsrecht)."],"span":true},{"label":"Querverweise","values":["• Vertragstheorie: radikale Ablehnung von Hobbes.\n• Machttheorie: Bakunin gegen Weber: Macht ohne Herrschaft?","• Soziale Gerechtigkeit: Nozick gegen Rawls.\n• Vertragstheorie und Liberalismus: Nachfolger Lockes, Zuspitzung des klassischen Liberalismus.","• Vertragstheorie: Abgrenzung von Rousseaus Gemeinwillen.\n• Demokratie: Ergänzung zu Arendt, Alternative zu Schumpeter."]}]},"essentialismus":{"sem":"Anthropologie","name":"Essentialismus - Existenzialismus - Sozialkonstruktivismus","leitfrage":"Hat der Mensch ein vorgegebenes Wesen - oder erschafft er sich selbst?","conn":["freiheit","sinn","moralkritik"],"positions":["Essentialismus","Existenzialismus","Feministische Existenzphilosophie","Sozialkonstruktivismus"],"rows":[{"label":"Hinweis","values":["• Grenzfall Pico della Mirandola (1486): Gott gibt allen Geschöpfen eine feste Natur, nur dem Menschen nicht. Er formt sich selbst als «Bildhauer und Dichter» seiner selbst und kann zum Tier absinken oder zum Göttlichen aufsteigen.\n→ Das Wesen des Menschen ist seine Unbestimmtheit. Aber Freiheit und Maßstab (die Stufenleiter von der Pflanze bis zum Engel) sind von Gott gegeben."],"span":true},{"label":"Hauptvertreter","values":["**Aristoteles** (384-322 v. Chr.), **Platon** (428-348 v. Chr.)","**Jean-Paul Sartre** (1905-1980); Einfluss: Martin Heidegger (1889-1976)","**Simone de Beauvoir** (1908-1986)","**Judith Butler** (*1956), **Michel Foucault** (1926-1984)"]},{"label":"Hauptwerk","values":["**Nikomachische Ethik** (Aristoteles); **Politeia** (Platon)","**Das Sein und das Nichts** (1943); **Der Existenzialismus ist ein Humanismus** (Vortrag 1945, Druck 1946)","**Das andere Geschlecht** (1949)","**Das Unbehagen der Geschlechter** (1990, Butler); **Die Ordnung der Dinge** (1966, Foucault)"]},{"label":"Merksatz","values":["Der Mensch hat ein festes Wesen, die Vernunft, gültig für alle Zeiten und Kulturen.","«Die Existenz geht der Essenz voraus»: Der Mensch macht sich erst durch seine Entscheidungen.","«Man kommt nicht als Frau zur Welt, man wird es.»","Was als menschlich oder natürlich gilt, bringen Gesellschaften durch Sprache und Normen hervor."]},{"label":"Grundannahmen","values":["• Jedes Lebewesen hat eine feste Natur. Sie legt fest, wozu es da ist.\n• Der Mensch ist das vernünftigste Lebewesen. Gut leben kann er nur in Gemeinschaft (politisches Lebewesen).\n• Ein gelungenes Leben entfaltet dieses Wesen.","• Kein Gott und keine Natur legen fest, was der Mensch ist.\n• Der Mensch existiert zuerst. Dann macht er sich durch freie Entscheidungen selbst.","• Die Rolle der Frau in der Gesellschaft machen die anderen, seit der frühesten Kindheit.\n• Der Mann gilt als Subjekt, die Frau als Objekt. Das ist nicht natürlich, sondern aufgezwungen.","• Es gibt kein festes menschliches Wesen. Identität wird gesellschaftlich hergestellt.\n• Was als normal oder natürlich gilt, entsteht durch Sprache und Diskurse."]},{"label":"Wesen oder Entwurf?","values":["Wesen: Die Vernunft ist jedem Menschen vorgegeben, unabhängig von Kultur und Geschichte.","Entwurf: Es gibt kein Wesen. Der Mensch «ist nichts anderes, als wozu er sich macht».","Entwurf unter Bedingungen: Freiheit bleibt der Kern des Menschen. Sie braucht aber eine Situation, in der man sie ergreifen kann.","Weder noch: Jede Bestimmung des Wesens ist an eine Zeit und Kultur gebunden (Foucault). Auch «kein Wesen» wäre noch eine Aussage über das Wesen."]},{"label":"Kernbegriffe","values":["• Essenz: das Wesen, also das, was etwas notwendig ist.\n• Teleologie: Erklärung aus dem Zweck (griech. telos, Ziel). Die Natur «tut nichts umsonst».\n• Zoon logon echon: das Lebewesen mit Vernunft und Sprache (lat. animal rationale).","• Existenz: die bloße Tatsache, dass der Mensch da ist.\n• Mauvaise foi (Unaufrichtigkeit): Selbsttäuschung; man tut so, als wäre man festgelegt.\n• Engagement: Verantwortung für die eigene Wahl, auch politisch.","• Das Andere: die Frau als Gegenstück zum Mann, nicht als eigenständiges Subjekt.\n• Situation: die konkrete Lebenslage, die Freiheit ermöglicht oder einschränkt.\n• Transzendenz und Immanenz: die Welt gestalten (Männern zugeschrieben) oder das Gegebene wiederholen (Frauen zugeschrieben).\n• Komplizenschaft: Wer die Unterordnung annimmt, macht sich mitschuldig.","• Diskurs: die Art, wie in einer Zeit über etwas gesprochen wird. Sie legt fest, was als wahr und normal gilt.\n• Performativ: Eine Äußerung stellt her, was sie sagt («Hiermit erkläre ich euch zu Ehepartnern»). Geschlecht entsteht durch wiederholtes Bezeichnen und Darstellen.\n• Subjektivierung: Man wird erst durch Zuschreibungen anderer zu einem Ich."]},{"label":"Was ist gegeben, was gemacht?","values":["Gegeben ist das Wesen, die Vernunft. Gemacht wird nur, wie weit ein Mensch es entfaltet.","• Gegeben ist die Faktizität: Körper, Herkunft, Vergangenheit, Lage.\n• Gemacht wird das Wesen durch Transzendenz: Der Mensch entwirft Möglichkeiten über das Gegebene hinaus.","Der Körper ist gegeben, seine Bedeutung wird gemacht.","• Auch die Unterscheidung des Körpers ist gemacht, nicht nur das soziale Geschlecht (gender), sondern auch das biologische (sex).\n• Starke These: Der Körper selbst ist schon sprachlich bezeichnet. Schwächere These: Welche Merkmale zählen und welche Rollen folgen, ist gemacht."]},{"label":"Wie frei ist der Mensch?","values":["Begrenzt: Freiheit heißt, vernünftig und im Einklang mit der eigenen Natur zu handeln.","Radikal: Der Mensch ist «verurteilt, frei zu sein». Freiheit ist keine Möglichkeit, sondern Grundbedingung: Auch Nicht-Entscheiden ist eine Entscheidung.","Situiert: Gegen Sartre kann die Situation die Freiheit tatsächlich verengen. Wer zum Objekt erzogen wurde, entwirft manche Ziele gar nicht. Befreiung braucht eine andere Situation.","Relativ: Niemand kann aus den Normen heraustreten. Freiheit heißt, sie anders zu wiederholen und umzudeuten (**Resignifikation**)."]},{"label":"Wer ist verantwortlich?","values":["• Der Einzelne, im Rahmen seiner Natur: Er soll sein Wesen verwirklichen.\n• Erziehung soll dieses Wesen entfalten.\n→ Weil alle dieselbe Natur haben, ist eine universelle Moral möglich, und alle haben die gleiche Würde.","• Jeder ist für alles verantwortlich, was er tut, ohne Ausreden.\n• «Indem ich mich wähle, wähle ich den Menschen»: Ich bin für alle Menschen verantwortlich.\n• Authentisch lebt, wer ehrlich zu seiner Freiheit steht.","• Die Gesellschaft macht die Frau zum Anderen. Die Unterordnung ist historisch, nicht biologisch, und darum überwindbar.\n• Auch die Frau trägt Verantwortung: Wer die Unterordnung annimmt, macht sich mitschuldig (Komplizenschaft).\n• Frauen müssen ihre Situation gemeinsam verändern. Dafür braucht es Bildung, Beruf und eigenes Geld.","• Es gibt kein Ich, das vor den Normen fertig ist und dann wählt. Das Ich entsteht erst in den Wiederholungen.\n• Man wählt sein Geschlecht also nicht morgens wie ein Kleidungsstück.\n• Was als natürlich gilt, muss man kritisch prüfen."]},{"label":"Beispiel","values":["Hand-Argument: Die Hand ist das «Werkzeug für Werkzeuge». Der Mensch hat Hände, weil er das vernünftigste Lebewesen ist, nicht umgekehrt (gegen Anaxagoras).","• Papiermesser: Bei ihm ist erst der Plan da, dann das Ding. Beim Menschen ist es umgekehrt.\n• Kellner: Er spielt, Kellner zu sein, als wäre das seine feste Natur (Unaufrichtigkeit).","Kinder erfassen die Welt «mit den Augen, mit den Händen, nicht mit den Geschlechtsteilen». Erst die anderen machen das Mädchen zum Anderen.","«Es ist ein Mädchen!»: Darauf folgen Name, Kleidung, Spielzeug, Erwartungen. Der Satz beschreibt nicht nur, er setzt eine Kette des Bezeichnens in Gang."]},{"label":"Was erklärt sie gut?","values":["• Warum Körper und Vernunft zusammenpassen.\n• Gibt eine Norm für ein gelungenes Leben.","• Nimmt Freiheit und Verantwortung ernst; keine Festlegung durch Natur oder Herkunft.\n• Entlarvt Ausreden: Unaufrichtigkeit ist im Alltag gut wiederzuerkennen.","• Zeigt, wie viel von dem, was als natürlich gilt, gesellschaftlich gemacht ist.\n• Korrigiert Sartre durch den Begriff der Situation.\n→ Vorläuferin des heutigen Feminismus und der Geschlechterforschung.","• Zeigt, dass auch scheinbar natürliche Einteilungen gemacht sein können.\n• Erklärt, wie sich Normen durch abweichende Wiederholung verändern.\n→ Wichtige Grundlage der heutigen Geschlechterforschung."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Die Teleologie widerspricht der Evolution. Die Natur verfolgt keine Zwecke.\n• Wessen Wesen? Die Idee eines festen Wesens diente oft dazu, Menschen auszugrenzen.\n• Die Vielfalt menschlicher Lebensformen spricht gegen ein Wesen, das für alle gilt.","• **Stärkster Einwand:** Eine Natur braucht keinen Entwerfer. Darwin erklärt gemeinsame Eigenschaften einer Art ohne Plan. Dann hätte der Mensch auch ohne Gott ein Wesen.\n• Überschätzt die Freiheit und unterschätzt Körper, Herkunft und Gesellschaft. Sartre räumte das 1969 selbst ein.\n• Beliebigkeit: Wenn keine Werte vorgegeben sind, kann jede Tat als authentische Wahl gelten.","• **Stärkster Einwand:** Zeitgebunden und einseitig. Beauvoir beschreibt vor allem westliche, bürgerliche Frauen; Armut oder Hautfarbe kommen kaum vor (Kritik von bell hooks).\n• Sie unterschätzt, wie stark der Körper selbst die Freiheit prägt.\n• Frauen sollen Transzendenz anstreben wie Männer. Damit bleiben männliche Werte der Maßstab.","• **Stärkster Einwand (Ladwig):** Ehen sind sprachabhängig, Chromosomen nicht; sie werden entdeckt. Das trifft die starke These, nicht die schwächere.\n• Wenn alles gemacht ist, verliert auch die Kritik an Unterdrückung ihr Fundament.\n• Wie kann das Subjekt Normen unterlaufen, wenn es erst durch sie entsteht?"]},{"label":"Fazit","values":["Das Wesen des Menschen besteht darin, kein fertiges Wesen zu haben, sondern sich unter Bedingungen, die er nicht gewählt hat, selbst zu gestalten: Körper, Situation (Beauvoir), Sprache und Normen (Butler)."],"span":true}]},"menschenmodelle":{"sem":"Anthropologie","name":"Menschenmodelle im Vergleich","leitfrage":"Was ist der Mensch seinem Wesen nach?","conn":["technologie","arbeit","essentialismus"],"positions":["Homo faber","Homo oeconomicus","Mängelwesen","Animal symbolicum"],"rows":[{"label":"Hauptvertreter","values":["**Benjamin Franklin** (1706-1790), **Karl Marx** (1818-1883)","Modell der Wirtschaftswissenschaft (rationale Wahl); Ausgangspunkt: **Adam Smith** (1723-1790)","**Arnold Gehlen** (1904-1976)","**Ernst Cassirer** (1874-1945); aufgegriffen von **Hans Lenk** (1935-2024)"]},{"label":"Hauptwerk","values":["Marx: **Pariser Manuskripte** (1844)","Smith: **Der Wohlstand der Nationen** (1776)","**Der Mensch. Seine Natur und seine Stellung in der Welt** (1940)","**Philosophie der symbolischen Formen** (1923-1929); **Versuch über den Menschen** (1944)"]},{"label":"Merksatz","values":["Der Mensch schafft Werkzeuge und gestaltet durch Arbeit und Technik die Welt.","Der Mensch handelt rational und eigennützig und maximiert seinen Nutzen.","Weil der Mensch biologisch mangelhaft ausgestattet ist, schafft er Kultur, Technik und Institutionen.","Der Mensch lebt in einem Netz aus Symbolen und kann über seine Zeichen nachdenken."]},{"label":"Grundannahmen","values":["• Der Mensch bestimmt sich dadurch, dass er die Welt aktiv gestaltet.\n• Arbeit und Technik drücken seine Kreativität und Vernunft aus.\n• Achtung: Bei Arendt heißt Homo faber nur der Herstellende, im Unterschied zum Arbeitenden (Vergleich Arbeit).","• Menschen wählen das Mittel, das ihnen den größten Nutzen zu den geringsten Kosten bringt.\n• Ihre Vorlieben sind stabil und bekannt.\n• Sie entscheiden mit vollständiger Information.","• Die Mängel des Menschen zwingen ihn, Kultur zu schaffen. Technik, Sprache und Institutionen gleichen sie aus.\n→ Ausführlich: Vergleiche Mensch und Tier und Technik.","• Der Mensch lebt nicht nur in einer natürlichen, sondern in einer symbolischen Wirklichkeit: Sprache, Mythos, Religion, Kunst, Wissenschaft.\n• Sprache hängt keine Namen an fertige Dinge. Sie baut die Welt der Gegenstände erst mit auf."]},{"label":"Wesen oder Entwurf?","values":["Wesen = Gattungswesen, aber geschichtlich: Es verwirklicht sich in freier Arbeit und geht in der Lohnarbeit verloren (Marx).","Kein Wesen: ein idealisiertes Modell, also ein bewusst vereinfachtes Bild des Menschen.","Wesen = Offenheit: Der Mensch ist nicht festgelegt und muss sich durch Handeln selbst erhalten.","Wesen als Fähigkeit: Sie wird erst im gemeinsamen Gebrauch der Zeichen wirklich."]},{"label":"Was unterscheidet den Menschen vom Tier?","values":["• Er macht Werkzeuge. Franklin: «Man is a tool-making animal.» (ein Werkzeug machendes Tier)\n• Marx: Er produziert bewusst, frei und vielseitig (Gattungswesen).","Tausch und Kalkül: Die Neigung zu tauschen findet Smith «nirgends in der Tierwelt».","Instinktarmut: Tiere passen mit spezialisierten Organen in eine Umwelt, der Mensch in keine.","Metastufe (Lenk): Auch Tiere nutzen Zeichen, aber nicht im selben Umfang. Nur der Mensch kann über seine Symbole nachdenken und über Abwesendes, Vergangenes und Mögliches sprechen."]},{"label":"Beispiel","values":["Biene: Sie baut immer dieselbe Wabe. Der Mensch produziert sogar «nach den Gesetzen der Schönheit» und erkennt sich in seinem Werk wieder.","• Ultimatumspiel: A teilt einen Betrag, B nimmt an oder lehnt ab. Lehnt B ab, bekommen beide nichts.\n• Der Homo oeconomicus müsste jedes Angebot annehmen, auch einen Euro von zehn.\n→ Viele lehnen unfaire Angebote ab.","Physiologische Frühgeburt (Portmann): Der Mensch kommt etwa ein Jahr zu früh zur Welt und reift schon in Gesellschaft und Kultur.","• Patient mit Aphasie (Sprachstörung nach Hirnverletzung): Ohne Farbwörter unterscheidet er jede Nuance, ordnet aber nichts mehr. Seine Welt ist «bunter» und doch ärmer.\n• Washoe lernte etwa 250 Gebärden, Kanzi nutzt eine Tafel mit Symboltasten."]},{"label":"Was erklärt es gut?","values":["• Erklärt technischen Fortschritt.\n• Verbindet Arbeit mit Würde und Sinn.\n• Marx gibt Begriffe für Leid in der Arbeit (Entfremdung).","• Klares, mathematisch fassbares Modell. Macht Entscheidungen gut vorhersagbar.\n• Smiths Ausgangsgedanke erklärt den historisch einmaligen Wohlstand.","• Erklärt Kultur, Technik und Institutionen aus der Biologie des Menschen.\n• Verbindet Körper, Handeln und Kultur.","• Antwortet auf die Frage nach der Sonderstellung des Menschen, und zwar prüfbar an Tierbefunden.\n• Erklärt Kunst, Mythos und Wissenschaft einheitlich."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand (Arendt):** Wer alles Tun als Arbeit versteht, macht aus dem Homo faber ein Animal laborans (Vergleich Arbeit).\n• Reduziert den Menschen auf seine Funktion als Macher.\n• Spiel, Muße und Nachdenken haben keinen Platz.","• **Stärkster Einwand:** Erklärt Fairness nicht (Ultimatumspiel).\n• Übersieht Mitgefühl, Kooperation und Moral.\n• Karikatur von Smith: Smith war kein Prediger des Egoismus. Er schrieb auch eine Ethik des Mitgefühls.","• **Stärkster Einwand:** Die Mängel sind ein Vergleich mit Tieren, die der Mensch gar nicht sein muss.\n• Konservativ (Adorno, Habermas): Institutionen bekommen zu viel Eigenwert.\n→ Ausführlich: Vergleich Mensch und Tier.","• **Stärkster Einwand:** Ob Tiere keine Metastufe haben, ist eine empirische Frage und umstritten.\n• Zu stark auf Denken und Symbole ausgerichtet; Körper und Triebe kommen kaum vor.\n• Vernachlässigt materielle und soziale Bedingungen."]},{"label":"Fazit","values":["Jedes Modell hebt eine Fähigkeit hervor. Homo faber und Mängelwesen klingen nach Entwurf, begründen ihn aber mit einer Natur des Menschen (Gattungswesen, Mängelwesen). Das animal symbolicum zeigt: Das Wesen des Menschen wäre eine Fähigkeit, die nur im gemeinsamen Tun wirklich wird."],"span":true}]},"technologie":{"sem":"Anthropologie","name":"Technik: Kompensation, Scham oder System?","leitfrage":"Besteht in der Technik das Wesen des Menschen, oder bedroht sie ihn?","conn":["menschenmodelle","arbeit","verantwortung"],"positions":["Technik als Kompensation","Prometheische Scham","Autonome Technik"],"rows":[{"label":"Hauptvertreter","values":["**Arnold Gehlen** (1904-1976)","**Günther Anders** (1902-1992)","**Jacques Ellul** (1912-1994)"]},{"label":"Hauptwerk","values":["**Technik als Kompensation von Mängeln**, in: Anthropologische Forschung (1961)","**Die Antiquiertheit des Menschen**, Bd. 1 (1956)","**Le Système technicien** (1977); Pflichttext im Europäischen Abitur 2026"]},{"label":"Merksatz","values":["Technik gleicht die Mängel des Menschen aus und gehört deshalb zu seinem Wesen.","Vor seinen perfekten Geräten schämt sich der Mensch, weil er geworden statt gemacht ist.","Technik ist autonom geworden: Was effizient ist, gilt bald auch als gut."]},{"label":"Grundannahmen","values":["• Der Mensch ist ein **Mängelwesen**: Ihm fehlen spezialisierte Organe und sichere Instinkte (ausführlich: Vergleich Mensch und Tier).\n• Er überlebt nur, wenn er seine Mängel ausgleicht und überbietet.","• Die Produkte des Menschen sind präzise, berechnet und fehlerlos.\n• Der Mensch selbst ist «geworden statt gemacht»: ungenau, müde, sterblich.\n→ Der Stolz des Herstellers schlägt in Minderwertigkeit um.","• Früher kontrollierten Glaube und Moral das menschliche Handeln.\n• Heute entwickelt sich Technik nach eigenen Gesetzen."]},{"label":"Wesen oder Bedrohung?","values":["Wesen: Technik gehört zu den «Konstitutionsmerkmalen» des Menschen, also zu seiner Grundausstattung. Sie ist kein bloßer Zusatz der Vernunft.","Bedrohung: Der Mensch wird seinen eigenen Produkten unterlegen.","Bedrohung: Technik wird autonom und ersetzt die Moral als Maßstab."]},{"label":"Kernbegriffe","values":["• Organersatz: Die Waffe ersetzt die Krallen, die Kleidung das Fell.\n• Organentlastung: Der Wagen trägt die Last.\n• Organüberbietung: Das Flugzeug fliegt, das Mikroskop sieht, was kein Auge sieht.","• Prometheische Scham: Scham des Menschen vor seinen eigenen Produkten.\n• Antiquiert: veraltet gegenüber den eigenen Geräten.","• Autonome Technik: Technik setzt sich selbst die Ziele.\n• Technik als Wert: Was sie fördert, gilt als gut, was sie behindert, als schlecht."]},{"label":"Worin liegt die Gefahr?","values":["«Unbehagen» am Maßlosen und Weltweiten der Technik.","Der Mensch wird «antiquiert» und möchte selbst wie ein Produkt werden, optimiert und fehlerfrei.","Die Moral verliert ihre Kontrolle: Eine moralische Regel gilt nur noch, wenn sie ins technische System passt."]},{"label":"Wo liegt das Menschliche?","values":["Im Handeln aus Mangel: Der Mensch muss die Natur umarbeiten.","Im Nicht-Gemachtsein, das der Mensch selbst als Makel empfindet.","In einer Freiheit, die das technische System kaum noch zulässt."]},{"label":"Wesen oder Entwurf?","values":["Wesen = Offenheit: Der Mensch ist nicht festgelegt und muss sich durch Technik selbst erhalten.","Der Mensch misst sich am Produkt und will selbst gemacht sein.","-"]},{"label":"Beispiel","values":["Brille (Ersatz), Bagger (Entlastung), Smartphone-Navigation (Überbietung).","Fitness-Tracker, Selbstoptimierung, der Vergleich mit einer KI, die schneller schreibt als wir.","Was technisch möglich und effizient ist, wird eingeführt, ohne dass jemand fragt, ob es gut ist."]},{"label":"Was erklärt sie gut?","values":["• Erklärt Technik aus der Biologie des Menschen.\n• Frühe Werkzeugfunde stützen das empirisch.","Sieht früh, wie sich Menschen an Maschinen messen (heute: KI, Selbstoptimierung).","Sieht früh, wie Technik Normen setzt (heute: KI)."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Technik, die keinen Mangel ausgleicht (Kunst, Spiel), bleibt unerklärt.\n• Erklärt, warum der Mensch Technik braucht, nicht, wann sie ihm schadet.\n→ Kritik am Mängelwesen: Vergleich Mensch und Tier.","• **Stärkster Einwand:** Kulturpessimistisch (sieht vor allem Verfall). Der Einzelne erscheint ohnmächtig, obwohl Technik gestaltet und reguliert wird.\n• Scham ist nicht die einzige mögliche Reaktion.\n• Beschreibt ein Gefühl, keine zwingende Entwicklung.","• **Stärkster Einwand:** Ebenso kulturpessimistisch. Technik wird politisch gesteuert und reguliert.\n• Autonom ist eine Zuspitzung: Hinter Technik stehen Entscheidungen von Menschen.\n• Sagt wenig darüber, wie man das System verändern könnte."]},{"label":"Fazit","values":["Gehlen sieht in der Technik das Wesen des Menschen: Er bringt sich durch sein Tun selbst hervor. Zugleich kann sich das Gemachte gegen ihn wenden: als überlegene Maschine (Anders) und als System, das die Werte setzt (Ellul)."],"span":true},{"label":"Querverweise","values":["Prometheus-Mythos (Platon, Protagoras): Der Mensch bleibt «nackt, ohne Schuhe, ohne Decken und ohne Waffen» und bekommt dafür Feuer und Handwerk. Verantwortung für die Folgen der Technik: Hans Jonas (S6, Vergleich Verantwortung). Exkurs: Heidegger nennt die moderne Technik das Gestell."],"span":true}]},"sinn":{"sem":"Anthropologie","name":"Sinn des Lebens","leitfrage":"Gibt es einen Sinn des Lebens - oder muss der Mensch sich selbst einen geben?","conn":["hedonismus","essentialismus","arbeit"],"positions":["Gegebener Sinn: Eudaimonia","Erfundener Sinn","Absurdität aus der Außensicht","Ertrotzter Sinn: Auflehnung","Gefundener Sinn"],"rows":[{"label":"Einstieg","span":true,"values":["Nietzsches Dämon: Müsstest du dein Leben «noch einmal und noch unzählige Male leben», wäre das Fluch oder Segen? Wer sein Leben so bejaht, dass er es unendlich oft wollte, hat die Sinnfrage für sich beantwortet (ewige Wiederkehr als Prüfstein)."]},{"label":"Hauptvertreter","values":["**Aristoteles** (384-322 v. Chr.)","**Jean-Paul Sartre** (1905-1980)","**Thomas Nagel** (*1937)","**Albert Camus** (1913-1960)","**Viktor E. Frankl** (1905-1997)"]},{"label":"Hauptwerk","values":["**Nikomachische Ethik** (ca. 330 v. Chr.)","**Der Existentialismus ist ein Humanismus** (1945); **Das Sein und das Nichts** (1943)","**Was bedeutet das alles?** (1987)","**Der Mythos des Sisyphos** (1942)","**... trotzdem Ja zum Leben sagen** (1946); **Ärztliche Seelsorge** (1946)"]},{"label":"Merksatz","values":["Das Leben hat ein Endziel: ein gelungenes Tätigsein gemäß der Tugend.","Es gibt keinen vorgegebenen Sinn; der Mensch erfindet ihn durch seine Wahl.","Von außen ist unser Leben gleichgültig, trotzdem nehmen wir uns ernst: Das ist absurd.","Das Leben ist absurd, aber «wir müssen uns Sisyphos als einen glücklichen Menschen vorstellen».","Nicht wir fragen das Leben, das Leben fragt uns: Sinn wird gefunden."]},{"label":"Grundannahmen","values":["• Teleologie (Erklärung aus dem Zweck): Alles Handeln strebt nach einem Ziel, die Ziele sind einander untergeordnet.\n• Telos: das Endziel, das man um seiner selbst willen will. Es heißt eudaimonia (Glück als gelungenes Leben im Ganzen).\n• Funktionsargument (ergon, Leistung): Dem Menschen eigen ist das Wirken der Vernunft; darin liegt sein Glück.","• Die Existenz geht der Essenz (dem Wesen) voraus: Es gibt keine vorgegebene Natur und keine vorgegebenen Werte.\n• Der Mensch ist «verurteilt, frei zu sein» und für alles verantwortlich (ausführlich: Vergleich Essentialismus).","• Innerhalb des Lebens lassen sich die meisten Handlungen begründen.\n• Von außen betrachtet hat das Leben als Ganzes keinen Sinn.\n• Trotzdem können wir nicht anders, als uns ernst zu nehmen.","• Die Grundfrage der Philosophie: Ist das Leben es wert, gelebt zu werden?\n• Camus lehnt zwei Auswege ab: den Selbstmord und den «philosophischen Selbstmord» (Sprung in die Hoffnung auf einen Sinn jenseits dieser Welt).","• Logotherapie: Psychotherapie, die bei der Suche nach Sinn ansetzt. Das Streben nach Sinn ist die wichtigste Antriebskraft des Menschen, nicht Lust oder Macht.\n• Kopernikanische Wende: Es zählt nicht, was wir vom Leben erwarten, sondern «was das Leben von uns erwartet»."]},{"label":"Gibt es einen Sinn?","values":["• Ja, er ist gegeben und gilt für alle.\n→ Gut leben und glücklich sein fallen zusammen.","• Nein, kein vorgegebener Sinn.\n→ «Sie sind frei, wählen Sie, das heißt, erfinden Sie.»","• Nicht für das Leben als Ganzes.\n→ Das Leben ist «nicht allein sinnlos, sondern absurd».","• Kein objektiver Sinn. Die Auflehnung gegen das Absurde gibt «dem Leben seinen Wert».\n→ «Sein Fels ist seine Sache.»","• Ja, er wird gefunden, nicht erfunden, auf drei Wegen: etwas schaffen oder tun; etwas oder jemanden erleben und lieben; zu unabänderlichem Leid eine Haltung einnehmen.\n• Glück lässt sich nicht direkt anstreben; es folgt aus sinnvollem Tun."]},{"label":"Liegt Sinn in der Welt oder in uns?","values":["In der Welt: in der Natur des Menschen, die ihm sein Ziel vorgibt.","In uns: Der Mensch gibt sich Sinn durch Entscheidung und Engagement.","• Von innen nehmen wir unser Leben wichtig.\n• Von außen wäre es «ganz egal, wenn es uns überhaupt nicht gegeben hätte».","Weder in der Welt noch im Menschen: Absurd ist «die Gegenüberstellung des Irrationalen und des glühenden Verlangens nach Klarheit».","In der konkreten Situation: Jede Situation stellt uns eine Frage, wir antworten durch Handeln."]},{"label":"Beispiel","values":["Um-zu-Kette: Du lernst für die Note, die Note brauchst du fürs Studium, das Studium für den Beruf. Ohne Endziel wäre das Streben «leer und sinnlos».","Sartres Schüler unter der Besatzung: bei der Mutter bleiben oder nach England gehen? Weder Moral noch Gefühl noch Ratgeber nehmen ihm die Wahl ab.","«In hundert Jahren ist sowieso alles egal.» Wir arbeiten für Geld und essen, weil wir hungrig sind. Aber wozu das Ganze?","Sisyphos wälzt ewig einen Stein den Berg hinauf. Auf dem Rückweg, in der «Stunde des Bewusstseins», ist er «stärker als sein Fels».","Frankl hat mehrere Konzentrationslager überlebt. Auch dort bleibt die Freiheit, zum Leid eine Haltung einzunehmen."]},{"label":"Was erklärt sie gut?","values":["Sie verbindet Glück, Charakter und Handeln und nimmt Gefühle ernst.","Sie nimmt Freiheit und Verantwortung ernst und entlarvt Ausreden.","Die Sinnfrage ohne religiöse Voraussetzungen: warum uns der Gedanke «In hundert Jahren ist alles egal» trifft.","Die Sinnfrage ohne religiöse Voraussetzungen: eine Lebenshaltung ohne Hoffnung auf ein Jenseits.","Die Sinnfrage ohne religiöse Voraussetzungen: Sinn auch im unabänderlichen Leid."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Sein-Sollen: Dass nur der Mensch vernünftig denken kann, heißt nicht, dass er so leben soll.\n• Glück hängt auch von äußeren Gütern ab (Gesundheit, Freunde, Geld), also vom Zufall.\n• Foucault: Jede Bestimmung des menschlichen Wesens ist an Zeit und Kultur gebunden.","• **Stärkster Einwand:** Freiheit ohne Grade: Zwang, Armut und Unterdrückung werden unterschätzt (Beauvoir, Merleau-Ponty).\n• Beliebigkeit: Jede Tat kann sich als authentische Wahl ausgeben (Salamun: Gefahr des Dezisionismus, Entscheiden ohne Maßstab).\n• Sartre räumte 1969 selbst ein, nicht jede Situation lasse eine freie Entscheidung zu.","• **Stärkster Einwand:** Camus: Das Absurde zeigt sich nicht im Blick von außen, sondern im Alltag: «Eines Tages aber steht das Warum da.»\n• Frankl: Sinn liegt nicht im Leben als Ganzem, sondern in der konkreten Situation.","• **Stärkster Einwand:** Nagel: Camus' Trotz wirkt heroisch, «romantisch».\n• Wenn alles absurd ist, warum ist dann die Auflehnung wertvoll? Camus setzt einen Wert voraus, den er bestreitet.\n• Die Auflehnung bleibt unkonkret: Was soll man tun?","• **Stärkster Einwand:** Ein Sinn, der gefunden wird, setzt eine Ordnung voraus, die Frankl nicht begründet.\n• Zu individualistisch: Armut und Gewalt als Ursachen von Leid treten zurück.\n• Sinnsuche als Antwort auf politisches Unrecht kann zynisch wirken."]},{"label":"Fazit","values":["Sinn kann gegeben (Aristoteles), erfunden (Sartre), ertrotzt (Camus) oder gefunden (Frankl) sein. Ob das Gestalten des eigenen Lebens einem gegebenen Sinn folgt, einen Sinn erfindet, einen Sinn findet oder sich ohne Sinn behauptet, ist die Frage, mit der das Semester endet."],"span":true},{"label":"Querverweise","span":true,"values":["Aristoteles' Glücksethik und Bac 2023 «Hat das menschliche Leben eine Bestimmung?» (Ethik S6, Vergleich Hedonismus); Sartre und Unaufrichtigkeit (Vergleich Essentialismus); Camus' Arbeiter von heute und Marx (Vergleich Arbeit); Identität (Vergleich Identität)."]}]},"arbeit":{"sem":"Anthropologie","name":"Arbeit: Selbstverwirklichung oder Entfremdung?","leitfrage":"Besteht Selbstverwirklichung im Arbeiten - oder ist Arbeit primär Notwendigkeit und Entfremdung?","conn":["menschenmodelle","technologie","sozgerechtigkeit","sinn"],"positions":["Arbeit und Entfremdung","Drei Tätigkeitsformen"],"rows":[{"label":"Hauptvertreter","values":["**Karl Marx** (1818-1883)","**Hannah Arendt** (1906-1975)"]},{"label":"Hauptwerk","values":["**Pariser Manuskripte** (1844)","**Vita activa oder Vom tätigen Leben** (1960; engl. The Human Condition, 1958)"]},{"label":"Merksatz","values":["Freie Arbeit verwirklicht den Menschen, kapitalistische Lohnarbeit entfremdet ihn.","Der Mensch verwirklicht sich nicht in der Arbeit, sondern im Handeln mit anderen."]},{"label":"Grundannahmen","values":["• Der Mensch ist ein **Gattungswesen**: Er produziert bewusst, frei und vielseitig, sogar «nach den Gesetzen der Schönheit». In seinem Werk erkennt er sich wieder.\n• In der Lohnarbeit gehören Produkt und Tätigkeit einem anderen. Arbeit wird bloßes Mittel zum Leben.\n• **Entfremdung**: Der Arbeiter ist entfremdet vom Produkt, von der Tätigkeit, von seinem Gattungswesen und von den anderen Menschen.","• Arbeiten (Animal laborans): dient dem Überleben. Das Ergebnis wird verbraucht, am nächsten Tag beginnt alles neu.\n• Herstellen (Homo faber): schafft dauerhafte Dinge wie Tische, Häuser, Werke und damit eine gemeinsame Welt.\n• Handeln: geschieht direkt zwischen Menschen, im Sprechen und gemeinsamen Tun. Es setzt **Pluralität** voraus: Wir sind viele und verschieden.\n• **Natalität**: Weil jeder Mensch als ein Neuer zur Welt kommt, kann er im Handeln etwas Neues anfangen."]},{"label":"Verwirklicht sich der Mensch in der Arbeit?","values":["• Ja, in freier Arbeit. Im Kapitalismus ist das verkehrt: Frei fühlt sich der Arbeiter nur noch beim Essen, Trinken und Zeugen, also in dem, was er mit Tieren teilt.\n→ Das Menschliche liegt in freier, bewusster Arbeit.","• Nein: Ein Leben ohne Arbeit bleibt menschlich. Ein Leben ohne Sprechen und Handeln wäre «ein in die Länge eines Menschenlebens gezogenes Sterben».\n→ Das Menschliche liegt im Sprechen und Handeln mit anderen."]},{"label":"Was geht verloren?","values":["Das eigene Wesen: Der Arbeiter wird sich selbst fremd (Selbstentfremdung).","Die gemeinsame Welt: «Weltentfremdung und nicht Selbstentfremdung, wie Marx meinte, ist das Kennzeichen der Neuzeit.»"]},{"label":"Wo wird der Mensch frei?","values":["• In freier, vielseitiger Arbeit nach Aufhebung der Entfremdung («morgens jagen, nachmittags fischen»).\n• Weg dahin: **Kapitalismuskritik** und **Klassenkampf** für eine klassenlose Gesellschaft.","• Im politischen Handeln, nicht in der Arbeit. Der öffentliche Raum muss deshalb erhalten bleiben.\n• Warnung: eine Arbeitsgesellschaft, der die Arbeit ausgeht, weil Maschinen sie übernehmen.\n→ Wer nur Arbeiten gelernt hat, wird dadurch nicht frei. Er füllt die freie Zeit mit Konsum."]},{"label":"Wesen oder Entwurf?","values":["Wesen = Gattungswesen, aber geschichtlich: Es muss in freier Arbeit erst verwirklicht werden.","Bedingungen statt Wesen: Der Mensch lebt unter Bedingungen wie Pluralität und Natalität, nicht nach einem festen Wesen."]},{"label":"Beispiel","values":["• Die Biene baut immer dieselbe Wabe, der Mensch produziert frei und vielseitig.\n• In der Lohnarbeit wird die Arbeit «als eine Pest geflohen», sobald kein Zwang besteht.","Kochen ist Arbeiten, ein Haus bauen ist Herstellen, eine Schülervertretung gründen ist Handeln."]},{"label":"Was erklärt sie gut?","values":["Gibt Begriffe für Leid in der Arbeit (Entfremdung).","Unterscheidet, was im Wort Arbeit zusammengeworfen wird: Arbeiten, Herstellen, Handeln."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand (Popper):** Marx gibt Deutungen der Geschichte als Gesetze aus (Historizismus). Verelendung der Arbeiter und Zusammenbruch des Kapitalismus sind nicht eingetreten.\n• Im Ideal bleibt unklar, wer die notwendige Arbeit tut.\n• Unterschätzt, dass auch Lohnarbeit Anerkennung, Struktur und Sinn stiften kann.","• **Stärkster Einwand:** Arendt wertet Arbeit ab und denkt kaum an die, die sie tun müssen.\n• Die strenge Dreiteilung lässt sich in der Wirklichkeit kaum durchhalten.\n• Was Handeln heute heißt, bleibt unscharf."]},{"label":"Fazit","values":["Marx sieht den Menschen in der Arbeit sich selbst hervorbringen und begründet das mit einer Natur, dem Gattungswesen. Arendt verschiebt die Frage: Das Menschliche liegt nicht darin, was wir herstellen, sondern darin, wie wir miteinander handeln."],"span":true}]},"stoa":{"sem":"Ethik","name":"Stoa","leitfrage":"Wie lebt man tugendhaft und unerschütterlich - unabhängig von äußeren Umständen?","conn":["hedonismus","sinn","moralkritik"],"positions":["Alte Stoa (Zenon, Chrysipp)","Mittlere Stoa (Panaitios, Poseidonios)","Späte Stoa (Seneca, Epiktet)"],"rows":[{"label":"Hauptvertreter","values":["Zenon von Kition (ca. 334-262 v. Chr.), Chrysipp (ca. 280-207 v. Chr.)","Panaitios (ca. 185-110 v. Chr.), Poseidonios (ca. 135-51 v. Chr.)","Seneca (ca. 4 v. Chr. - 65 n. Chr.), Epiktet (ca. 50-138 n. Chr.), Mark Aurel (121-180 n. Chr.)"]},{"label":"Schwerpunkt","values":["Begründung der Schule (Zenon) und Ausbau zum System aus Logik, Physik und Ethik (Chrysipp)","Öffnung für Rom: alltagsnähere Ethik der Pflichten","Praktische Lebensphilosophie und Seelenführung"]},{"label":"Merksatz","values":["«Lebe gemäß der Natur - das ist die Tugend.»","Nicht nur der vollkommene Weise zählt: Auch wer Fortschritte macht, soll seine Pflichten erfüllen.","«Nicht wie lange man lebt, sondern wie gut man lebt, macht das Leben wertvoll.»"]},{"label":"Kerngedanke","values":["• Logos: Die Vernunft durchdringt den Kosmos als göttliches Prinzip. Der Mensch soll gemäß seiner Vernunftnatur leben.\n• Tugend (arete) als einziges Gut: Nur das Tugendhafte ist wirklich gut - Reichtum, Gesundheit, Ansehen sind gleichgültig (Adiaphora).\n• Vier Kardinaltugenden: Weisheit, Gerechtigkeit, Tapferkeit, Besonnenheit.\n• Systematik: Chrysipp, das dritte Schulhaupt, baute die Lehre zu einem geschlossenen System aus Logik, Physik und Ethik aus.\n• Determinismus und Apatheia (Chrysipp): Alles folgt dem göttlichen Logos, frei ist nur unser Urteil. Affekte sind falsche Urteile, der Weise ist frei davon.","• Panaitios brachte die Stoa nach Rom und milderte ihre Strenge.\n• Pflichten (kathekonta): Im Mittelpunkt steht nicht mehr nur der kaum erreichbare Weise, sondern der Mensch, der Fortschritte macht. Panaitios' Pflichtenlehre wurde zur Vorlage für Ciceros Schrift über die Pflichten (De officiis).\n• Poseidonios verband Philosophie mit Naturforschung, Geschichte und Geografie und erkannte auch unvernünftige Kräfte in der Seele an.","• Praktische Ethik: Seneca übersetzte die stoische Theorie in konkrete Lebensführung.\n• In unserer Macht (Epiktet): Die Unterscheidung zwischen dem, was von uns abhängt, und dem, was nicht, wird zum Kern der Lebenskunst.\n• Memento mori: Bewusstsein der Vergänglichkeit als Weg zu Klarheit und echtem Engagement.\n• Innere Freiheit: Selbst als Sklave oder Gefangener kann der Mensch innerlich frei sein.\n• Freundschaft und Gemeinschaft: Trotz Weltabgewandtheit betonte Seneca die Pflicht gegenüber Mitmenschen."]},{"label":"Adiaphora (Gleichgültige Dinge)","values":["Reichtum, Gesundheit, Ansehen, Schmerz, Tod sind moralisch neutral - weder gut noch schlecht. Chrysipp unterscheidet aber: Manches ist vorzuziehen (Gesundheit), anderes zurückzustellen (Krankheit).","Die vorzuziehenden Dinge bekommen mehr Gewicht: Panaitios und Poseidonios halten die Tugend allein nicht für ausreichend, man braucht auch Gesundheit, Mittel und Kraft.","Seneca lebte selbst als wohlhabender Mann - er betonte, dass Reichtum kein Übel ist, solange man ihn nicht braucht, um glücklich zu sein."]},{"label":"Kritikpunkte","values":["• Idealbild des «Weisen» ist schwer erreichbar.\n• Stark deterministisch - lässt wenig Raum für echte Freiheit.\n• Apatheia-Ideal wirkt lebensfremd.\n• Komplexe Logik schwer zugänglich.","• Kritiker sahen in der Milderung eine Aufweichung der stoischen Strenge.\n• Die Nähe zu Platon und Aristoteles macht das eigene Profil unschärfer.\n• Von beiden Denkern sind nur Bruchstücke erhalten.","• Spannung zwischen eigenem Reichtum und stoischer Lehre.\n• Praktische Anwendung bleibt oft elitär.\n• Weltabgewandtheit steht im Widerspruch zur politischen Beteiligung."]}]},"gefuehlsethik":{"sem":"Ethik","name":"Gefühlsethik / Moralischer Sentimentalismus","leitfrage":"Ist Moral eine Sache der Vernunft oder des Gefühls - und was bewegt uns wirklich zum Handeln?","conn":["utilitarismus","moralkritik","rationalismus"],"positions":["Moralischer Sentimentalismus (Hume)","Emotivismus (Ayer)","Empathieethik (Schopenhauer)"],"rows":[{"label":"Hauptvertreter","values":["David Hume (1711-1776)","Alfred Jules Ayer (1910-1989)","Arthur Schopenhauer (1788-1860)"]},{"label":"Hauptwerk","values":["Traktat über die menschliche Natur (1739)","Sprache, Wahrheit und Logik (1936)","Die Welt als Wille und Vorstellung (1819)"]},{"label":"Merksatz","values":["«Vernunft ist und soll nur die Sklavin der Leidenschaften sein.»","«Moralische Aussagen sind keine Tatsachenbehauptungen - sie drücken Gefühle aus.»","«Mitleid ist die Grundlage aller Moral.»"]},{"label":"Grundthese","values":["Moralische Urteile gründen nicht auf Vernunft, sondern auf Sympathie und moralischem Gefühl. Vernunft erkennt Fakten, aber kann uns nicht motivieren - das tut nur das Gefühl.\n\nHumes Guillotine: Aus dem Sein (Tatsachen) lässt sich kein Sollen (Normen) logisch ableiten.","Moralische Sätze («Mord ist falsch») sind keine beschreibenden Aussagen, sondern Ausdrücke von Billigung oder Missbilligung. Sie haben keinen Wahrheitswert - sie drücken nur emotionale Einstellungen aus (Buh/Hurra-Theorie).","Die Grundlage jeder Moral ist Mitleid (Compassio): das unmittelbare Mitfühlen mit dem Leid anderer. Vernunft und Egoismus allein können keine echte Moral begründen."]},{"label":"Konsequenzen","values":["• Moralisches Wissen ist kein rationales Wissen, sondern emotionale Reaktion.\n• Kulturelle Unterschiede in der Moral erklären sich durch unterschiedliche Empfindungen.\n• Grundlage für den späteren Utilitarismus (Bentham, Mill).","• Moralische Debatten sind letztlich Ausdruck von Präferenzen, keine rationalen Diskussionen.\n• Ethik gehört nicht zur Wissenschaft.\n• Konsequenz: Moralische Überzeugung ist nicht wahr oder falsch - sie ist nur mehr oder weniger verbreitet.","• Altruismus als moralischer Maßstab: Wer sich ins andere hineinversetzt, handelt moralisch.\n• Askese als Konsequenz: Wer das Leiden der Welt erkennt, reduziert den eigenen Willen.\n• Basis für moderne Empathieforschung und Tierethik."]},{"label":"Kritikpunkte","values":["• Wenn Moral nur Gefühl ist, verliert sie ihren universellen Anspruch.\n• Hume beschreibt eher, wie Moral funktioniert, als wie sie sein sollte.\n• Moralische Reformen (Abschaffung der Sklaverei) können nicht allein durch Gefühle begründet werden.","• Reduziert Ethik auf Ausdruck - lässt keine Möglichkeit für moralische Argumentation.\n• Moralische Fortschritte (Menschenrechte) wären dann nur Modewechsel.\n• Ayer selbst revidierte später Teile dieser Position.","• Pessimismus als Ausgangspunkt ist nicht universell nachvollziehbar.\n• Mitleid allein reicht nicht - wir brauchen Prinzipien für Gerechtigkeitsfragen.\n• Schopenhauers Askese-Ideal ist lebensfeindlich."]}]},"skeptizismus":{"sem":"Erkenntnistheorie","name":"Skeptizismus","leitfrage":"Gibt es überhaupt sicheres Wissen?","conn":["rationalismus","wahrheit","wissenschaft"],"positions":["Pyrrhonische Skepsis","Methodischer Zweifel","Gemilderter Skeptizismus","Fallibilismus"],"rows":[{"label":"Hauptvertreter","values":["**Sextus Empiricus** (um 200 n. Chr.)\nbenannt nach Pyrrhon von Elis (um 360-270 v. Chr.)","**René Descartes** (1596-1650)","**David Hume** (1711-1776)","**Karl Popper** (1902-1994)\nund viele Philosophen heute"]},{"label":"Hauptwerk","values":["**Grundriss der pyrrhonischen Skepsis**","**Meditationen über die Erste Philosophie** (1641)","**Eine Untersuchung über den menschlichen Verstand** (1748)","**Logik der Forschung** (1934)"]},{"label":"Merksatz","values":["Wer sich des Urteils enthält, findet Seelenruhe; die Erscheinungen bleiben unbezweifelt.","Der Zweifel ist nur ein Werkzeug, um einen Punkt zu finden, der jedem Zweifel standhält.","Die Zukunft lässt sich nicht beweisen, aber die Gewohnheit lässt uns trotzdem handeln.","Wissen ist möglich, auch wenn wir uns grundsätzlich irren könnten."]},{"label":"Was wird bezweifelt?","values":["• Alles Verborgene: wie die Dinge an sich sind, etwa ob der Honig an sich süß ist.","• Die Sinne, die ganze Außenwelt, sogar die Mathematik.\n• Der Zweifel ist rein theoretisch. Im Alltag folgt man auch ungewissen Meinungen.","• Kausalität (Ursache und Wirkung) und jeder Schluss auf die Zukunft.","• Grundsätzlich jede Überzeugung: Jede könnte sich als falsch erweisen.\n• Nicht bezweifelt wird, dass Wissen überhaupt möglich ist."]},{"label":"Was bleibt sicher?","values":["• Die Erscheinungen: «Dass uns der Honig süß zu schmecken scheint, das räumen wir ein.»\n→ Im Alltag folgt der Skeptiker den Erscheinungen, Gewohnheiten und Gesetzen.","• Das Cogito: «Ich denke, also bin ich», selbst gegen den allmächtigen Täuscher.\n• Mit Gott als Garanten: Was ich klar und deutlich erkenne, ist wahr; die Außenwelt existiert.","• Mathematik und Logik: Die Winkelsumme im Dreieck beträgt 180 Grad.\n• Über Tatsachen gibt es nur Erwartungen aus Gewohnheit, nie Notwendigkeit.","Nichts endgültig, aber Bewährtes: Eine gut geprüfte Überzeugung ist besser begründet als ein bloßes Gerücht."]},{"label":"Was ist der Maßstab für Wissen?","values":["• Wissen müsste zureichend begründet sein. Das gelingt nie: Für jede Behauptung gibt es eine gleich starke Gegenbehauptung (Isosthenie, gleiche Stärke).\n• Deshalb kein Urteil über das Verborgene.\n• Der Pyrrhoneer behauptet nicht einmal «Man kann nichts wissen». Das ist die These der akademischen Skepsis.","• Als wahr gilt nur, was jedem Zweifel standhält.\n• Ziel: ein völlig sicheres Fundament des Wissens, so beweisbar wie Mathematik.","• Gewiss sind nur Beziehungen der Ideen (Mathematik, Logik): Sie sind durch Denken gewiss.\n• Tatsachen kennen wir nur aus Erfahrung; ihr Gegenteil ist immer denkbar (Humes Gabel).","• Dem Skeptiker wird zugegeben: Absolute Gewissheit ist kaum erreichbar.\n• Bestritten wird, dass Wissen absolute Gewissheit verlangt (lateinisch fallibilis, fehlbar).\n• Fehlbarkeit bedeutet nicht Beliebigkeit."]},{"label":"Argumente","values":["• Meerwasser: für Fische gesund, für Menschen schädlich. Wie es an sich ist, bleibt offen.\n• Fünf Tropen (Argumentmuster): Widerstreit, unendlicher Regress (Begründung ohne Ende), Relativität, bloße Voraussetzung, Zirkel.\n• Agrippa- oder Münchhausen-Trilemma: Jede Begründung läuft ins Unendliche, bricht ab oder dreht sich im Kreis.","• Sinne: Ein Stab im Wasser sieht geknickt aus.\n• Traum: Kein sicheres Zeichen unterscheidet Wachen und Träumen. Die ganze Außenwelt wird zweifelhaft.\n• Allmächtiger Täuscher (Gott oder böser Geist): Selbst Mathematik wird zweifelhaft.","• Kausalität (Ursache und Wirkung): Eine Billardkugel trifft die andere, und diese rollt. Eine notwendige Verbindung sehen wir nie.\n• Induktionsproblem: Dass die Zukunft der Vergangenheit gleicht, lässt sich weder durch Denken noch durch Erfahrung beweisen. Der Beweis durch Erfahrung wäre ein Zirkel.\n• Russells Truthahn wird jeden Morgen gefüttert und ist sich immer sicherer, bis zum Morgen vor dem Fest.","• Unfairer Maßstab: Wissen kann auch ohne absolute Sicherheit sinnvoll und berechtigt sein.\n• Szenarien wie das Gehirn im Tank zeigen nur, dass Täuschung möglich ist, nicht dass sie tatsächlich vorliegt."]},{"label":"Rolle des Zweifels","values":["• Epoché: Urteilsenthaltung über das Verborgene.\n• Ataraxie: Seelenruhe stellt sich danach «wie zufällig» ein, die Seele ist wie ein Meer ohne Wellen.\n→ Skepsis ist keine Verzweiflung, sondern Lebenskunst.","• Mittel, nicht Ziel: Der Zweifel trennt Sicheres von Unsicherem.\n• Es genügt, dass eine Täuschung möglich ist. Descartes behauptet nicht, dass er träumt.\n→ Aus dem Ende des Wissens wird sein Anfang.","• Der Zweifel zeigt die Grenze der Vernunft: Unsere Erwartungen über die Welt sind nicht durch Vernunft begründet.\n• Trotzdem rät Hume nicht, der Erfahrung zu misstrauen. Wir können gar nicht anders, als ihr zu folgen.","• Dauerzustand der Prüfung: Theorien gelten so lange, bis sie widerlegt werden (Popper).\n• Wissenschaftliche Skepsis bezweifelt nicht alles. Sie prüft systematisch, welche Aussagen begründet sind."]},{"label":"Was erklärt er gut?","values":["• Kritik an naivem Wissensoptimismus: «Ich sehe es, also ist es wahr» reicht nicht.\n• Philosophie heißt auch, Behauptungen kritisch zu prüfen, nicht nur Wahrheiten zu verkünden.","• Wahrheit entsteht durch eigenes Denken, nicht durch Autoritäten oder Tradition.\n• Erkenntnis muss nachvollziehbar begründet sein, nicht bloß geglaubt.","• Die Rolle der Gewohnheit: Unser Denken über die Welt ist Teil der menschlichen Natur (Gewohnheit und Instinkt).\n• Ehrlichkeit über Grenzen: Philosophie wird bescheidener und überprüfbarer.","• Wie Wissenschaft Wissen sichert: Forschende prüfen die Ergebnisse anderer Teams; nur was reproduzierbar ist, gilt als gesichert.\n• Den Unterschied zwischen prüfendem Zweifel und bloßer Verweigerung (Fake News)."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Kann man ohne Urteile handeln? Selbst Skeptiker handeln, als gäbe es Tische, Menschen und Konsequenzen.\n• Selbstwiderspruch? Sextus: Seine Formeln heben sich selbst mit auf wie ein Abführmittel. Der Preis: Er kann keine Theorie mehr vertreten.\n• Dauerhafte Urteilsenthaltung widerspricht dem Bedürfnis nach Orientierung und Entscheidung.","• **Stärkster Einwand:** Cartesischer Zirkel: Gott soll die klaren Ideen garantieren, wird aber mit klaren Ideen bewiesen.\n• Lichtenberg: «Es denkt». Das Cogito beweist Gedanken, aber kein Ich.\n• Zu starker Glaube an absolute Gewissheit: Viele Erkenntnisse sind nur vorläufig.","• **Stärkster Einwand:** Die Gewissheit der Mathematik und das Kausalprinzip (alles hat eine Ursache) bleiben unerklärt. Kant antwortet: Sie stammen aus der Struktur unseres Erkennens.\n• Dann ist auch die Naturwissenschaft nicht durch Vernunft begründet.\n• Ist Gewohnheit ein guter Grund für einen Glauben oder nur seine Ursache?","• **Stärkster Einwand:** Niederlage oder Sieg über den Skeptiker? Der Fallibilismus widerlegt ihn nicht, sondern senkt den Maßstab für Wissen.\n• Lässt offen, wann eine Überzeugung gut genug geprüft ist."]},{"label":"Fazit","values":["Der Skeptizismus ist schwer zu widerlegen: Sinne, Erinnerung und Denken sind fehlbar, und jede Begründungskette endet im Regress, im Abbruch oder im Zirkel. Der Skeptiker ist nicht unbesiegbar, aber jeder Sieg über ihn hat einen Preis. Zweifel ist keine Schwäche, sondern eine Bedingung ernsthafter Suche nach Erkenntnis."],"span":true},{"label":"Querverweise","values":["Skeptische Szenarien nach Reichweite: Sinnestäuschung, Traum, Gehirn im Tank (Film Matrix), allmächtiger Täuscher. Weitere Antworten auf den Skeptiker: Moore («Hier ist eine Hand»), Dretske (nur relevante Alternativen zählen), Putnam (der Satz «Ich bin ein Gehirn im Tank» widerlegt sich selbst). Descartes als Rationalist und Hume als Empirist: Vergleich Klassische Erkenntnistheorie. Popper und das Induktionsproblem: Vergleich Wissenschaftstheorie. Kant: Wir erkennen die Dinge nur, wie sie uns erscheinen. Seelenruhe als Lebensziel auch bei Epikur und der Stoa."],"span":true}]},"demokratiekonzepte":{"sem":"Politische Philosophie","name":"Demokratiekonzepte","leitfrage":"Was bedeutet Demokratie wirklich - Herrschaft des Volkes, Freiheitsschutz oder Elitenwettbewerb?","conn":["machttheorie","vertragstheorie","sozgerechtigkeit"],"positions":["Liberale Demokratietheorie (Tocqueville)","Elitäre Demokratietheorie (Schumpeter)","Partizipative Demokratie (Rousseau)"],"rows":[{"label":"Hauptvertreter","values":["Alexis de Tocqueville (1805-1859)","Josef Alois Schumpeter (1883-1950)","Jean-Jacques Rousseau (1712-1778)"]},{"label":"Hauptwerk","values":["Über die Demokratie in Amerika (1835/1840)","Kapitalismus, Sozialismus und Demokratie (1942)","Vom Gesellschaftsvertrag (1762)"]},{"label":"Merksatz","values":["«Freiheit geht nicht durch Gewalt verloren, sondern durch die sanfte Macht der Gleichheit.»","«Demokratie bedeutet nicht, dass das Volk regiert - sondern dass das Volk entscheiden kann, wer regiert.»","«Der Gemeinwille kann nicht irren - aber er kann verfehlt werden.»"]},{"label":"Demokratieverständnis","values":["Demokratie ist der politische Ausdruck des Gleichheitsprinzips. Sie schützt individuelle Freiheit - birgt aber die Gefahr der Tyrannei der Mehrheit und sanfter Despotie: Bürger werden nicht durch Gewalt, sondern durch Bevormundung unmerklich entmündigt.","Demokratie ist kein Selbstregieren des Volkes, sondern ein geregelter Wettbewerb politischer Eliten um Wählerstimmen. Der Bürger wählt Führungspersonen - er regiert nicht selbst. Politische Partizipation bleibt minimal und episodisch.","Demokratie bedeutet die direkte Ausübung des Gemeinwillens (volonté générale). Repräsentation ist Verrat an der Souveränität - das Volk muss selbst entscheiden, nicht durch Vertreter."]},{"label":"Kernkonzepte","values":["• Tyrannei der Mehrheit: Demokratische Mehrheiten können Minderheiten und individuelle Freiheit unterdrücken.\n• Sanfte Despotie: Übermäßiger Wohlfahrtsstaat entmündigt Bürger.\n• Zivilgesellschaft: Freiwillige Vereinigungen und lokale Selbstverwaltung als Gegengewicht zur Staatsmacht.\n• Individualismus als Gefahr: Rückzug ins Private schwächt politisches Engagement.","• Schöpferische Zerstörung: Kapitalismus erneuert sich durch permanente Innovation - alte Strukturen werden aufgebrochen.\n• Politischer Unternehmer: Politiker agieren wie Unternehmer - sie verkaufen Programme um Wählerstimmen.\n• Elitäre Führung: Demokratie funktioniert besser, wenn kompetente Eliten führen, das Volk aber kontrolliert.\n• Kapitalismuskritik: Das System untergräbt langfristig die bürgerlichen Institutionen, die es tragen.","• Gemeinwille (volonté générale): Der gemeinsame Wille aller Bürger auf das Gemeinwohl - verschieden von der bloßen Mehrheitsmeinung.\n• Volkssouveränität: Souveränität ist unteilbar und unveräußerlich.\n• Gleichheit als Voraussetzung: Extreme Ungleichheit korrumpiert den Gemeinwillen.\n• Direkte Demokratie: Repräsentation untergräbt die Freiheit."]},{"label":"Gefahren der Demokratie","values":["• Gleichheitsstreben kann in Konformismus und Mittelmäßigkeit umschlagen.\n• Sanfte Despotie durch einen übermächtigen Verwaltungsstaat.\n• Verlust politischen Engagements durch Individualismus.","• Demokratie ist instabil, wenn Massen irrational entscheiden.\n• Eliten können sich verselbständigen und vom Volk entkoppeln.\n• Schöpferische Zerstörung destabilisiert soziale Strukturen.","• Gemeinwille kann zur Rechtfertigung von Zwang gegen Minderheiten werden.\n• Direkte Demokratie ist in modernen Großgesellschaften kaum praktikabel.\n• Rousseau vernachlässigt Mechanismen zur Machtbegrenzung."]},{"label":"Bedeutung heute","values":["• Warnung vor «illiberaler Demokratie» - Mehrheitsentscheidung ohne Minderheitenschutz.\n• Zivilgesellschaft und lokale Demokratie als Gegengewicht zum Zentralstaat.","• Demokratie als Wettbewerb erklärt moderne politische Kommunikation und Kampagnen.\n• Schumpeter beschreibt eher, wie Demokratie funktioniert, als wie sie sein sollte.","• Direkte Demokratie (Volksabstimmungen) als Ergänzung zur repräsentativen Demokratie.\n• Gemeinwillens-Idee beeinflusst partizipative Demokratiemodelle."]}]},"wahrheit":{"sem":"Erkenntnistheorie","name":"Wahrheitstheorien","leitfrage":"Was macht eine Aussage wahr?","conn":["skeptizismus","wissenschaft","relativismus"],"positions":["Korrespondenztheorie","Kohärenztheorie","Konsenstheorie"],"rows":[{"label":"Hauptvertreter","values":["**Aristoteles** (384-322 v. Chr.)\n**Thomas von Aquin** (1225-1274)","**Otto Neurath** (1882-1945)\n**G. W. F. Hegel** (1770-1831)","**Charles Sanders Peirce** (1839-1914)\n**Jürgen Habermas** (1929-2026)"]},{"label":"Merksatz","values":["Eine Aussage ist wahr, wenn sie mit der Wirklichkeit übereinstimmt.","Eine Aussage ist wahr, wenn sie widerspruchsfrei zu unserem übrigen Wissen passt.","Wahr ist, worauf sich alle Vernünftigen in einem freien, fairen Gespräch einigen würden."]},{"label":"Grundannahmen","values":["• Wahrheit ist eine Beziehung zwischen dem, was gesagt wird, und dem, was der Fall ist (lateinisch correspondere, entsprechen).\n• Wahrheit liegt in der Welt, nicht in unseren Köpfen.\n→ Deshalb kann man sich irren: Man glaubt etwas, und die Welt ist anders.","• Wir können eine Aussage nie direkt mit der Wirklichkeit vergleichen, nur mit anderen Aussagen.\n• Wahr ist, was sich widerspruchsfrei in ein System anerkannter Aussagen einfügt (lateinisch cohaerere, zusammenhängen).\n→ Wahrheit ist eine Frage des Zusammenhangs, nicht des einzelnen Satzes.","• Wahrheit beansprucht, für alle zu gelten: Wer etwas wahr nennt, meint: Das müsstest du auch anerkennen.\n• Gemeint ist keine Mehrheit, sondern eine Einigung unter idealen Bedingungen (lateinisch consensus, Übereinstimmung).\n• Habermas: Ein tatsächlicher Konsens (was eine Gruppe gerade teilt) kann falsch sein. Nur der ideale Konsens garantiert Wahrheit."]},{"label":"Bild und Beispiel","values":["• «Es regnet» ist genau dann wahr, wenn es regnet.\n• Thomas von Aquin: Wahrheit ist die Übereinstimmung von Verstand und Sache (adaequatio rei et intellectus).\n• «Die Sonne kreist um die Erde» war auch dann falsch, als fast alle es glaubten.","• Schiff auf offener See (Neurath): Wir bauen unser Wissen Planke für Planke um, ohne es je im Trockendock neu aufbauen zu können.\n• Teilchen schneller als das Licht (2011): Man bezweifelte zuerst die Messung, weil sie nicht ins System passte. Ursache war ein lockeres Kabel.\n• Hegel: «Das Wahre ist das Ganze.»","• Peirce: Wahr ist, worauf sich eine unbegrenzte Forschergemeinschaft auf lange Sicht einigen würde.\n• Ideale Bedingungen: alle Betroffenen, gleiche Rederechte, kein Zwang, nur der «zwanglose Zwang des besseren Arguments».\n• Geozentrisches Weltbild: jahrhundertelang tatsächlicher Konsens, trotzdem falsch."]},{"label":"Welche Seite der Wahrheit erfasst sie?","values":["Sagt, worin Wahrheit besteht: in der Übereinstimmung mit der Wirklichkeit.","Zeigt, wie wir prüfen: durch Abgleich mit unserem übrigen Wissen.","Zeigt, dass Wahrheit für alle gilt und sich in der Begründung vor anderen bewähren muss."]},{"label":"Passt sie auf moralische und mathematische Aussagen?","values":["• Nein: Womit stimmen «Versprechen soll man halten» oder 2 + 2 = 4 überein? Sie haben kein klares Gegenstück in der Welt.","• Auf begriffliche Aussagen ja: Fabeln sind keine wahrheitsgetreuen Berichte. Das ist wahr, weil es zu unserem Verständnis von Fabeln passt.","• Auf moralische Aussagen ja: Ob ein moralischer Satz wahr ist, heißt dann: Würden alle Vernünftigen ihm nach gründlicher Diskussion zustimmen?\n• Er lässt sich nicht durch einen Blick in die Welt entscheiden."]},{"label":"Was erklärt sie gut?","values":["• Entspricht unserem Alltagsverständnis: Ein Zeuge vor Gericht berichtet, was wirklich passiert ist.\n• Wahrheit hängt nicht davon ab, wie viele etwas glauben.","• Beschreibt, wie wir in Alltag und Wissenschaft tatsächlich prüfen (Gerüchte, Messfehler).","• Erklärt, warum wir Behauptungen begründen und der Kritik anderer aussetzen müssen."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Kein direkter Vergleich möglich. Wir haben nur Wahrnehmungen und Aussagen, und Wahrnehmungen können täuschen. Wir können nicht aus unserem Kopf heraustreten und von außen nachsehen.","• **Stärkster Einwand:** Ein stimmiges System kann als Ganzes falsch sein (Harry Potter, Verschwörungstheorie).\n• Zwischen zwei stimmigen Systemen, die sich widersprechen, kann Kohärenz nicht entscheiden.\n→ Irgendwo muss doch wieder der Kontakt zur Wirklichkeit ins Spiel kommen.","• **Stärkster Einwand:** Ideale Bedingungen sind nie erfüllt. Kein Gespräch ist frei von Macht, nie sind alle Betroffenen dabei.\n• Woran erkennt man, ob ein Konsens nur tatsächlich oder schon ideal ist?\n• Einigen sich Forscher, weil die Erde um die Sonne kreist? Dann wäre der Konsens nur Zeichen der Wahrheit, nicht ihr Grund."]},{"label":"Fazit","values":["Keine Theorie kommt ohne Probleme aus, aber wir brauchen alle drei. Beispiel «Der Klimawandel ist menschengemacht»: Messdaten zeigen, ob die Aussage zur Wirklichkeit passt. Physikalische Gesetze zeigen, ob sie zu unserem übrigen Wissen passt. Jahrzehntelange offene Prüfung durch Fachleute weltweit zeigt, dass sie der Kritik standhält. Wer sagt «Das ist eben meine Wahrheit», verlässt alle drei Theorien."],"span":true},{"label":"Ausblick","values":["Eine vierte Antwort: Nach der pragmatischen Theorie von **William James** (1842-1910) ist wahr, was sich im Handeln bewährt. Einwand: Auch Falsches kann lange nützen; das geozentrische Weltbild reichte jahrhundertelang, um Kalender zu berechnen. Induktion und Deduktion sind keine Wahrheitstheorien, sondern Schlussformen: Sie fragen, wie wir zu neuen Aussagen kommen (Vergleich Wissenschaftstheorie). Offene Frage: Können wir überhaupt sicher sein, dass eine Aussage wahr ist? (Vergleich Skeptizismus)"],"span":true}]},"weltbuergertum":{"sem":"Politische Philosophie","name":"Weltbürgertum: Bund oder Weltrepublik?","leitfrage":"Kann Vernunft den Krieg abschaffen, und braucht der Frieden einen Weltstaat?","conn":["vertragstheorie","menschenrechte","demokratie"],"positions":["Friedensbund freier Staaten","Föderale Staatenrepublik"],"rows":[{"label":"Einstieg","values":["• Naturzustand zwischen Staaten: Es gibt kein gemeinsames Gesetz, keinen Richter über allen und keine Macht, die ein Urteil durchsetzt. Im Zweifel entscheidet der Krieg.\n• Streitfrage: Gibt es Frieden ohne ein Minimum an globalem Zwang?"],"span":true},{"label":"Hauptvertreter","values":["**Immanuel Kant** (1724-1804)","**Otfried Höffe** (*1943)"]},{"label":"Hauptwerk","values":["**Zum ewigen Frieden** (1795)","**Demokratie im Zeitalter der Globalisierung** (1999); im Unterricht der Auszug **Völkerbund oder Weltrepublik?**"]},{"label":"Merksatz","values":["Frieden braucht Republiken, einen freien Staatenbund und ein Besuchsrecht für alle.","Ein Bund ohne Schwert bleibt Naturzustand; Frieden braucht eine Weltrepublik mit wenigen Aufgaben."]},{"label":"Was sichert den Frieden?","values":["• Recht: Staaten «lädieren» (beschädigen) sich «schon durch ihr Nebeneinandersein». Frieden muss deshalb durch Recht gestiftet werden, auf drei Ebenen (Zeilen unten).\n• Garantie der Natur: Konflikte, Handelsgeist und Eigennutz treiben die Menschen zum Recht. Ein Staat lässt sich «selbst für ein Volk von Teufeln (wenn sie nur Verstand haben)» einrichten.\n→ Das sagt den Frieden nicht voraus. Es zeigt nur, dass er möglich ist.","• Nur Zwang: Die «gewurzelte Bösartigkeit» (Kant) zeigt sich zwischen Staaten «unverhohlen», weil dort äußerer Zwang fehlt.\n→ Was zwischen Menschen gilt, muss auch zwischen Staaten gelten: Es braucht eine Rechtsordnung mit Sanktionen (Strafmaßnahmen)."]},{"label":"Staatsrecht (Bürger untereinander)","values":["• Republikanische Verfassung: Gewaltenteilung und Vertretung, keine direkte Demokratie.\n• Die Bürger müssen dem Krieg zustimmen und tragen selbst Kampf, Kosten, Verwüstung und Schulden. Sie werden sich «sehr bedenken»; für den Despoten ist Krieg eine «Lustpartie».\n→ Eine Neigung zum Frieden, keine sichere Folge.","• Primärstaaten: Die Einzelstaaten behalten Zivil- und Strafrecht, Arbeits- und Sozialrecht, Sprache, Religion und Kultur.\n• Die Weltrepublik ist nur ein Sekundärstaat darüber."]},{"label":"Völkerrecht (Staaten untereinander)","values":["• Eigentlich verlangt die Vernunft eine Weltrepublik. Aber die Staaten wollen das nicht und sind fremdem Zwang «entwachsen».\n• Negatives Surrogat (Ersatz): ein Friedensbund freier Staaten (foedus pacificum), der sich immer weiter ausbreitet.\n• Friedensbund, nicht Friedensvertrag: Er will «alle Kriege auf immer» beenden, ohne gemeinsamen Zwang über seine Mitglieder.","• Ein Bund ohne «Schwert der Gerechtigkeit» bleibt ein (modifizierter) Naturzustand, also nur ein Waffenstillstand.\n→ Nötig ist eine Staatenrepublik mit Sanktionen und kleiner Restzuständigkeit: Streit zwischen Staaten wird nicht durch Gewalt entschieden.\n• Die Staaten verzichten «nur in voller Freiwilligkeit» auf einen minimalen Teil ihrer Souveränität (Recht, allein über sich zu entscheiden)."]},{"label":"Einig: kein homogener Weltstaat","values":["• Kant: Die Staaten wollen ihn nicht. Begrifflicher Widerspruch: Viele Völker in einem Staat wären nur noch ein Volk, das Recht zwischen Völkern wäre aufgehoben. Gefahr: Ein Weltstaat unter einer Macht droht zum «seelenlosen Despotism» zu werden, ohne Flucht und ohne Verbündete.\n• Höffe gibt Kant recht: Der homogene (einheitliche) Weltstaat «maßt sich zu viel an Staatlichkeit an». Drei Optionen: freie Assoziation (zu wenig), homogener Weltstaat (zu viel), Staatenrepublik (richtig)."],"span":true},{"label":"Weltbürgerrecht (Menschen gegenüber fremden Staaten)","values":["• Hospitalität als Besuchsrecht: Niemand darf auf fremdem Boden feindselig behandelt werden, denn die Erde gehört ursprünglich allen gemeinsam.\n• Kein Gastrecht: Aufnahme braucht einen besonderen Vertrag. Abweisen darf man nur, wenn es «ohne seinen Untergang» geschehen kann.\n• Fälle: Touristin (Besuchsrecht), Schiffbrüchiger (nicht zurück ins Meer), Einwanderer (Vereinbarung nötig). Der Artikel richtet sich auch gegen die Kolonialmächte.","Teil einer globalen Rechtsordnung mit Sanktionen."]},{"label":"Fall: Vereinte Nationen","values":["• Die Charta (1945) verbietet «Androhung oder Anwendung von Gewalt» zwischen Staaten (Art. 2 Ziff. 4). Der Sicherheitsrat kann Zwangsmaßnahmen beschließen, jedes der fünf ständigen Mitglieder kann sie per Veto verhindern.\n→ Mehr als Kants Friedensbund (Zwang möglich), weniger als Höffes Staatenrepublik (kein Gewaltmonopol, Veto)."],"span":true},{"label":"Was erklärt er gut?","values":["• Frieden als erreichbare Pflicht: rechnet mit dem Egoismus von Menschen und Staaten und hält trotzdem am Vernunftanspruch fest.\n• Respektiert die Freiheit der Staaten.\n• Begründet ein Recht für jeden Menschen, nicht nur für Bürger.","• Nimmt das Sicherungsproblem ernst.\n• Zeigt einen Weg zwischen Bund und Weltstaat."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Ein Bund ohne Zwang kann Kriege nicht verhindern, wenn ein Mitglied ihn bricht. Höffe nennt ihn eine «halbherzige Lösung».\n• Das Weltbürgerrecht schützt Geflüchtete nur minimal: kein Untergang, aber kein Anspruch auf Aufnahme. Reicht das für Staatenlose (Arendt)?","• **Stärkster Einwand:** Woher soll der freiwillige Souveränitätsverzicht kommen, wenn Staaten schon den Bund oft verweigern?\n• Wer kontrolliert die Staatenrepublik, wenn sie selbst ihre Macht missbraucht?"]},{"label":"Fazit","values":["Kant und Höffe sind sich einig, dass Frieden eine Pflicht der Vernunft ist. Sie streiten darüber, ob Frieden ohne ein Minimum an globalem Zwang gesichert werden kann: Kant vertraut auf einen wachsenden Bund freier Republiken, Höffe verlangt eine Weltrepublik mit wenigen, aber durchsetzbaren Aufgaben."],"span":true},{"label":"Querverweise","values":["• Hobbes: Naturzustand, aber Kant lehnt einen Leviathan zwischen Staaten ab.\n• Arendt: Recht auf Rechte. Habermas: erneuert die Idee eines Weltbürgerrechts.\n• Demokratie: Kant nennt die direkte Demokratie einen Despotismus, weil Gesetzgebung und Ausführung nicht getrennt sind."],"span":true}]},"mensch_tier":{"sem":"Anthropologie","name":"Mensch und Tier: Grad, Wesen oder Struktur?","leitfrage":"Unterscheidet sich der Mensch vom Tier nur im Grad, im Wesen oder in seiner ganzen Lebensform?","conn":["essentialismus","menschenmodelle","technologie"],"positions":["Unterschied im Grad","Unterschied im Wesen (Geist)","Unterschied in der Struktur (Mangel und Handeln)"],"rows":[{"label":"Einstieg","values":["• Schimpansen benutzen Stöcke als Werkzeuge, manche Tiere erkennen sich im Spiegel, Menschenaffen lernen Symbole, Schimpansen haben regional verschiedene Traditionen. Was kann nur der Mensch?\n• Vorgeschichte: Für Aristoteles hat allein der Mensch eine vernünftige Seele. Bei Pico della Mirandola kann der Mensch zum Tier absinken oder zum Göttlichen aufsteigen (Vergleich Essentialismus)."],"span":true},{"label":"Hauptvertreter","values":["**Charles Darwin** (1809-1882)","**Max Scheler** (1874-1928)","**Arnold Gehlen** (1904-1976)"]},{"label":"Hauptwerk","values":["**Die Abstammung des Menschen** (1871)","**Die Stellung des Menschen im Kosmos** (1928)","**Der Mensch. Seine Natur und seine Stellung in der Welt** (1940)"]},{"label":"Merksatz","values":["Mensch und Tier unterscheiden sich nur im Grad, nicht in der Art.","Der Geist macht den Menschen weltoffen: Er hat nicht nur Umwelt, sondern Welt.","Der Mensch passt in keine Umwelt, deshalb muss er handeln und Kultur schaffen."]},{"label":"Grundannahmen","values":["• Embryonen, Homologien (gleich gebaute Knochen) und Rudimente (verkümmerte Organe wie das Steißbein) zeigen: Der Mensch stammt von einem behaarten, geschwänzten Vierfüßer ab.\n• Geistige Fähigkeiten variieren, werden vererbt und helfen beim Überleben.\n→ Die natürliche Zuchtwahl erklärt auch Verstand, Sprache und das Gewissen. Es entsteht aus sozialen Instinkten.","• Scheler akzeptiert die Evolution, bestreitet aber, dass sie alles erklärt.\n• Auch Tiere haben praktische Intelligenz und Wahl. Mehr Intelligenz ergäbe nur ein klügeres Tier.","• Gehlen schaut auf den Körper des Menschen.\n• Physiologische Frühgeburt (Adolf Portmann): Der Mensch kommt etwa ein Jahr zu früh zur Welt. Er reift schon in Gesellschaft und Kultur.\n• Gehlen will «jenseits» der Alternative von Grad (Darwin) und Geist (Scheler) stehen."]},{"label":"Worin unterscheidet sich der Mensch vom Tier?","values":["• Im Grad: Die geistigen Kräfte der höheren Tiere sind «der Art nach» dieselben wie beim Menschen, nur «dem Grade nach» verschieden.\n→ Querbezug Singer (S6): Ist die Bevorzugung der eigenen Art dann Speziesismus?","• Im Wesen: Das Neue am Menschen ist der Geist, ein dem Leben «entgegengesetztes Prinzip» (Vernunft, Anschauung, Güte, Liebe, Reue, freie Entscheidung).\n• Das Tier nimmt nur wahr, was für seine Triebe wichtig ist. Der Mensch kann alles zum Gegenstand machen, sogar sich selbst, und zu seinen Trieben Nein sagen.","• In der Struktur: Der Mensch ist ein Mängelwesen. Kein Fell, keine Angriffsorgane, schwache Sinne, kaum Instinkte, sehr lange hilflos.\n• Tiere passen mit spezialisierten Organen genau in eine Umwelt, der Mensch in keine.\n→ Er muss handeln, planen und die Natur umarbeiten, um zu überleben."]},{"label":"Ist Weltoffenheit Freiheit oder Last?","values":["-","Freiheit: Der Geist löst den Menschen von Trieb und Umwelt.","Zuerst Last, dann Chance: Was Scheler als Freiheit feiert, zwingt den Menschen zum Handeln."]},{"label":"Was ist Kultur für den Menschen?","values":["Folge der Evolution.","Ausdruck des Geistes, der sich von Trieb und Umwelt löst.","• Notwendige «zweite Natur»: Einen Menschen im reinen Naturzustand gibt es nicht.\n• Institutionen (Sprache, Recht, Sitte, Religion) entlasten ihn davon, ständig alles selbst zu entscheiden."]},{"label":"Wann ist ein Wesen ein Mensch?","values":["Nach der Abstammung: Mensch ist, wer von Menschen abstammt (Fall Wachkoma).","Nach den Fähigkeiten: Mensch ist, wer Geist hat und zu seinen Trieben Nein sagen kann (Fall KI).","-"]},{"label":"Wesen oder Entwurf?","values":["Biologische Natur, kein metaphysisches Wesen (kein Wesen jenseits der Erfahrung).","Wesen: Das Wesen des Menschen ist der Geist (Essentialismus).","Wesen = Offenheit: Das Wesen ist das Nicht-festgestellt-Sein. Nietzsche: Der Mensch ist «das noch nicht festgestellte Tier»."]},{"label":"Was erklärt er gut?","values":["• Empirisch überprüfbar.\n• Erklärt die Ähnlichkeiten mit Tieren, die die Forschung bestätigt.","• Nimmt Darwin ernst und zeigt trotzdem, was am Menschen besonders ist.","• Nimmt Darwin ernst und zeigt trotzdem, was am Menschen besonders ist.\n• Verbindet Körper, Handeln und Kultur."]},{"label":"Kritikpunkte","values":["• **Stärkster Einwand:** Erklärt die Entstehung von Moral, aber nicht ihre Geltung. Warum soll ich dem Gewissen folgen?\n• Kant hält dagegen: Dass der Mensch «in seiner Vorstellung das Ich haben kann», macht ihn zur Person mit Würde.\n• Abstammung sagt noch nicht, welche Fähigkeiten ein Wesen zum Menschen machen.","• **Stärkster Einwand:** Der Geist ist nicht überprüfbar. Ist er falsifizierbar (Popper)?\n• Ein dem Leben entgegengesetztes Prinzip passt schlecht zur Evolution, die Scheler selbst akzeptiert.\n• Werkzeuge, Spiegeltest und Symbole bei Tieren machen eine scharfe Wesensgrenze fraglich.","• **Stärkster Einwand:** Die Mängel sind ein Vergleich mit Tieren, die der Mensch gar nicht sein muss.\n• Adorno und Habermas: Gehlen gibt den Institutionen zu viel Eigenwert und übersieht, dass sie unterdrücken können.\n• Aristoteles sah dieselben Mängel und hielt sie für keine: Die Hand gleicht sie aus."]},{"label":"Fazit","values":["Mit Darwin ist die Frage nach dem Wesen des Menschen nicht erledigt, sie verschiebt sich: vom Geist (Scheler) zu einem Wesen, das gerade in seiner Offenheit liegt (Gehlen). Vielleicht besteht das Wesen des Menschen darin, nicht festgelegt zu sein."],"span":true}]},"oekologie":{"sem":"Anthropologie","name":"Ökologie: Wachstum oder Niedergang?","leitfrage":"Ist der Mensch ein Homo oeconomicus, und führt sein Wirtschaften zu unendlichem Wachstum oder zum Niedergang?","conn":["menschenmodelle","verantwortung","technologie"],"positions":["Wohlstand durch Eigeninteresse","Erde als System (Gaia)"],"rows":[{"label":"Hauptvertreter","values":["**Adam Smith** (1723-1790)","**James Lovelock** (1919-2022)"]},{"label":"Hauptwerk","values":["**Der Wohlstand der Nationen** (1776)","**Die Erde ist ein Lebewesen** (dt. 1991)"]},{"label":"Merksatz","values":["Wenn jeder seinen eigenen Vorteil verfolgt, entsteht Wohlstand für al

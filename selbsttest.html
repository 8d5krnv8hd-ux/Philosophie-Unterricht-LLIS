as Geld“", "k": "4", "f": "Locke nennt zwei Grenzen der Aneignung. Welche hebt das Geld faktisch auf?", "a": [["Man darf nur so viel nehmen, wie man nutzen kann, bevor es verdirbt.", 1], ["Für andere muss „genug und ebenso Gutes“ übrig bleiben.", 0, null, "Das ist das Suffizienzprinzip. Das Geld betrifft die andere Grenze, weil es selbst nicht verdirbt."], ["Man darf sich nur aneignen, was man mit eigener Arbeit bearbeitet hat.", 0, null, null], ["Der Staat darf Eigentum nur mit Zustimmung der Eigentümer besteuern.", 0, null, null]], "e": "Geld verdirbt nicht. Wer Überschuss gegen Geld tauscht, kann großen Besitz anhäufen, ohne etwas verderben zu lassen (§36, §46-50). Locke rechtfertigt ungleichen Besitz so durch die stillschweigende Zustimmung zum Gebrauch des Geldes und nimmt die Ungleichheit als Folge der Zivilisation hin. Genau hier setzen Rousseau und Marx an."}, {"typ": "arg", "teil": "Teil C · Staat als Treuhänder", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Lockes Argument vom Naturzustand zum Staat? (Auszug)", "zeilen": [["P5", "Der Genuss der Rechte ist im Naturzustand sehr unsicher, denn es fehlen ein feststehendes Gesetz, ein unparteiischer Richter und eine vollstreckende Gewalt."], ["K3", null], ["K4", "Die Staatsgewalt ist an diesen Zweck gebunden: Die Legislative ist die höchste Gewalt, aber eine Treuhand (trust)."]], "a": [["Deshalb schließen sich die Menschen zur Erhaltung ihres Eigentums zu einer politischen Gesellschaft zusammen.", 1], ["Deshalb übertragen alle ihr Recht auf alles an einen Souverän, der selbst keine Vertragspartei ist und ungeteilt herrscht.", 0, "Hobbes", "So entsteht bei Hobbes der Leviathan. Dann wäre die Staatsgewalt aber nicht an einen Zweck gebunden wie in K4."], ["Deshalb gibt sich jeder mit allen seinen Rechten völlig an das Gemeinwesen als Ganzes hin.", 0, "Rousseau", null], ["Deshalb erwirbt jeder Eigentum, indem er seine Arbeit mit etwas aus der Natur mischt.", 0, null, "Das ist Lockes Eigentumslehre (Teil B). Sie erklärt, wie Eigentum schon vor dem Staat entsteht, nicht warum man einen Staat gründet."]], "e": "K3 nennt den Zweck des Staates, und an diesen Zweck ist die Staatsgewalt in K4 gebunden. „Eigentum“ meint Leben, Freiheit und Besitz. Die Menschen geben ihre Strafgewalt ganz ab, ihre natürliche Freiheit nur so weit, wie es die Erhaltung aller verlangt. Weil die Macht nur zu diesem Zweck übertragen wurde, folgt das Widerstandsrecht: Verraten die Gesetzgeber den Zweck, fällt die Macht an das Volk zurück."}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Der Gesellschaftsvertrag“", "f": "Was gibt der Mensch bei Locke beim Eintritt in die politische Gesellschaft auf?", "a": [["Seine Strafgewalt ganz, seine natürliche Freiheit nur so weit, wie es die Erhaltung aller verlangt.", 1], ["Sein ganzes Recht auf alles, zugunsten eines Souveräns mit ungeteilter, unbegrenzter und absoluter Macht.", 0, "Hobbes", null], ["Alle seine Rechte ohne Vorbehalt, an das Gemeinwesen als Ganzes und an niemanden sonst.", 0, "Rousseau", "Das ist Rousseaus völlige Entäußerung. Bei Locke behalten die Menschen ihre natürlichen Rechte, der Staat soll sie sichern."], ["Sein Eigentum, das der Staat danach gerecht unter allen Bürgern neu verteilt.", 0, null, null]], "e": "Die Menschen gewinnen durch den Vertrag keine neuen Rechte, aber Sicherheit für die Rechte, die sie schon haben. Das Naturrecht bleibt bestehen und wird durch Institutionen gesichert: Die Legislative schreibt es als allgemeines Gesetz fest, bekannte Richter entscheiden Streitfälle, die Exekutive setzt Urteile durch. Locke sagt es knapp: „Wo kein Gesetz ist, da ist keine Freiheit.“ (§57)"}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Regierung als Treuhand“", "f": "Regierungsmacht ist bei Locke Treuhandmacht (trust). Was folgt daraus?", "a": [["Die Macht ist an ihren Zweck gebunden; missbraucht die Regierung sie, erlischt ihre Legitimität.", 1], ["Die Macht ist ungeteilt und unbegrenzt, weil der Herrscher selbst keine Vertragspartei ist.", 0, "Hobbes", "So begründet Hobbes die absolute Souveränität. Bei Locke ist Macht gerade nicht Eigentum der Herrschenden."], ["Die Regierung besitzt die Macht wie ein persönliches Eigentum und darf sie daher an ihre Erben weitergeben.", 0, null, null], ["Die Bürger müssen der Regierung blind vertrauen, auch wenn sie ihr Eigentum antastet.", 0, null, null]], "e": "Die Legislative ist die höchste Gewalt im Staat, aber sie darf nicht willkürlich herrschen und keine Entscheidungen „nach Beschlüssen des Augenblicks“ treffen: Gesetze müssen dauerhaft, gerecht und allgemein sein. Vor allem darf sie niemandem ohne Zustimmung sein Eigentum nehmen (§138). Damit legt Locke einen Grundstein des Rechtsstaats, in dem auch die Regierung selbst dem Gesetz unterworfen ist."}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Der Staat schützt das Eigentum“", "k": "4", "f": "„Die Legislative darf keinem Menschen einen Teil seines Eigentums ohne seine eigene Zustimmung wegnehmen“ (§138). Welches Prinzip folgt daraus?", "a": [["Keine Steuern ohne politische Mitbestimmung der Bürger", 1], ["Der Staat darf überhaupt keine Steuern erheben", 0, null, "Locke verbietet Steuern nicht. Er verlangt, dass die Bürger, die zahlen, politisch vertreten sind."], ["Reiche müssen mehr Steuern zahlen als Arme", 0, null, null], ["Kein Bürger darf so reich sein, dass er andere kaufen kann", 0, "Rousseau", null]], "e": "„No taxation without representation“: Der Staat darf nur dann Steuern erheben, wenn die Bürger politisch mitentscheiden können. Wer zahlt, muss vertreten sein. Der Grundsatz wurde zu einem Leitgedanken der amerikanischen Revolution. In der Declaration of Independence (1776) wurden aus Lockes Grundrechten life, liberty, property die Rechte auf life, liberty and the pursuit of happiness."}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Zustimmung, auch stillschweigend“", "k": "4", "f": "Wer die Vorteile des Staates nutzt, stimmt nach Locke stillschweigend zu. Was wendet David Hume ein?", "a": [["Diese Zustimmung ist kaum freiwillig, wie bei einem Mann, den man im Schlaf auf ein Schiff trug.", 1], ["Stillschweigende Zustimmung gilt nur für Landbesitzer und Erben, nicht aber für alle anderen Bürger des Staates.", 0, null, "Bei Locke stimmt nicht nur zu, wer Land besitzt oder erbt, sondern sogar, wer eine Landstraße benutzt."], ["Zustimmung zählt nur, wenn sie ausdrücklich und schriftlich gegeben wurde.", 0, null, null], ["Zustimmung ist überflüssig, weil der Staat eine natürliche Gemeinschaft ist.", 0, "Aristoteles", null]], "e": "Humes Bild (1748): Ein Mann wird im Schlaf auf ein Schiff getragen und „stimmt“ der Herrschaft des Kapitäns zu, weil er nicht ins Meer springen will. Wer bleibt, weil er keine echte Wahl hat, stimmt nicht wirklich frei zu. Locke unterscheidet ausdrückliche und stillschweigende Zustimmung (§119-122): Wer Land besitzt, erbt oder die Vorteile des Staates nutzt, ist den Gesetzen verpflichtet."}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Das Widerstandsrecht“", "f": "Hobbes würde fragen: Wer entscheidet, ob die Regierung das Vertrauen gebrochen hat? Was antwortet Locke?", "a": [["Das Volk als Ganzes, und zwar erst nach einer langen Kette von Missbräuchen.", 1], ["Jeder Einzelne für sich, sobald ihm ein Gesetz ungerecht erscheint.", 0, null, "Dann wäre jeder wieder Richter in eigener Sache, genau das ist Hobbes' Einwand. Locke lässt deshalb nicht jeden Einzelnen urteilen."], ["Ein Gericht, das die Regierung selbst einsetzt und dessen Richter sie ernennt.", 0, null, null], ["Niemand, denn gegen die höchste Gewalt gibt es kein Recht auf Widerstand.", 0, "Hobbes", null]], "e": "„Das Volk soll Richter sein“ (§240). Wollen die Gesetzgeber dem Volk sein Eigentum nehmen oder es versklaven, versetzen sie sich in den Kriegszustand mit dem Volk, und die Macht fällt an das Volk zurück (§222). Dabei löst sich nur die Regierung auf, nicht die Gesellschaft (§211): Das Volk setzt eine neue Legislative ein, ohne in den Naturzustand zurückzufallen. Außerdem ist das Volk eher zu geduldig und erhebt sich nicht wegen einzelner Fehler (§225)."}, {"teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Gewaltenteilung“", "k": "4", "f": "Welche Gewalten unterscheidet Locke klar?", "a": [["Legislative und Exekutive, dazu die föderative Gewalt für Außenbeziehungen", 1], ["Legislative, Exekutive und Judikative als drei unabhängige Gewalten", 0, "Montesquieu", "Die Drei-Gewalten-Lehre entwickelt erst Montesquieu (Vom Geist der Gesetze, 1748). Locke erwähnt die Judikative nur beiläufig."], ["Weltliche und geistliche Gewalt, beide vereint in der Hand des Souveräns", 0, "Hobbes", null], ["Volk und Souverän, die gemeinsam und gleichberechtigt die Gesetze geben", 0, null, null]], "e": "Locke unterscheidet als Erster klar zwischen Legislative und Exekutive. Sie sollen in verschiedenen Händen liegen, um Machtmissbrauch zu verhindern, und beide sind an das Gesetz gebunden. Locke liefert damit das Grundmodell begrenzter Macht; Montesquieu führt es fort und macht die Judikative zur dritten, unabhängigen Gewalt. Kurz: Locke liefert die Begründung, Montesquieu die institutionelle Form."}, {"typ": "offen", "teil": "Teil C · Staat als Treuhänder", "nach": "Teil C, Abschnitt „Regierung als Treuhand“", "f": "Warum kann Lockes Legislative Unrecht tun, Hobbes' Souverän aber nicht?", "m": "Bei Locke gibt es Recht schon vor dem Staat: Das Gesetz der Natur schützt Leben, Freiheit und Besitz, also das Eigentum im weiten Sinn. Die Menschen gründen den Staat nur, um diese Rechte besser zu sichern. Die Legislative ist deshalb eine Treuhand und an diesen Zweck gebunden. Nimmt sie den Bürgern ohne Zustimmung ihr Eigentum oder will sie sie versklaven, verletzt sie Rechte, die älter sind als sie, und tut damit Unrecht; sie versetzt sich in den Kriegszustand mit dem Volk. Bei Hobbes entstehen Recht und Unrecht erst durch den Staat. Der Souverän ist keine Vertragspartei, er hat niemandem etwas versprochen, und die Bürger sind die Autoren seiner Handlungen. Es gibt also keinen Maßstab außerhalb des Souveräns, an dem man ihn als ungerecht messen könnte."}]}, {"id": "rousseau", "tf": "PP", "gruppe": "Vertragstheorien", "kapitel": "Rousseau - Du contrat social", "titel": "Rousseau", "sub": "Gehorchen und trotzdem frei bleiben", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Diagnose", "nach": "Teil A, Abschnitt „Der Mensch ist von Natur aus nicht böse“", "k": "4", "f": "Wie lebt der Mensch im Naturzustand nach Rousseau?", "a": [["Friedlich, einfach und genügsam; er empfindet Mitleid, ist frei, aber noch nicht moralisch.", 1], ["Misstrauisch und jederzeit bereit, anderen durch Vorbeugung zuvorzukommen.", 0, "Hobbes", null], ["Frei und gleich unter einem Gesetz der Natur, das er schon ohne Staat mit seiner Vernunft erkennt.", 0, "Locke", null], ["Als „edler Wilder“, wie Rousseau den Naturmenschen selbst genannt hat.", 0, null, "Das Schlagwort vom „edlen Wilden“ wird Rousseau oft zugeschrieben, stammt aber nicht von ihm."]], "e": "Rousseaus politische Theorie beruht auf seinem Menschenbild: Der Mensch ist von Natur aus nicht böse. Er folgt seinen Bedürfnissen und handelt nicht aus Bosheit, sondern aus Selbsterhaltung. Moral entsteht erst in der Gesellschaft. Verdorben wird der Mensch erst durch Eigentum, Ungleichheit und Konkurrenz."}, {"teil": "Teil A · Diagnose", "nach": "Teil A, Abschnitt „Mit dem Eigentum beginnt die Ungleichheit“", "k": "4", "f": "„Der Erste, der ein Stück Land eingezäunt hatte und auf den Gedanken kam zu sagen ‚Dies ist mein‘ …“ Was beginnt nach Rousseau mit diesem Zaun?", "a": [["Ungleichheit, Konkurrenz, Eitelkeit und Gier: die bürgerliche Gesellschaft", 1], ["Rechtmäßiges Eigentum, das durch Arbeit entsteht und das der Staat schützen soll", 0, "Locke", "So sieht es Locke: Für ihn ist Eigentum die Grundlage der Freiheit. Rousseau sieht darin den Ursprung der Ungleichheit."], ["Die Moral, die den Menschen erst vom Tier unterscheidet und ihn frei macht", 0, null, null], ["Der Frieden, weil nun jeder genau weiß, was ihm gehört und was nicht", 0, null, null]], "e": "Der Mann, der Leute fand, „die einfältig genug waren, ihm zu glauben, war der wahre Begründer der bürgerlichen Gesellschaft“ (Diskurs über die Ungleichheit, 1755). Mit dem Eigentum beginnt der Mensch, sich an anderen zu messen, und verliert seine natürliche Unschuld. Es entstehen Abhängigkeit und Herrschaft, die „Ketten“ aus dem ersten Satz des Contrat social: „Der Mensch ist frei geboren, und überall liegt er in Ketten.“ Ein Zurück zur Natur gibt es für Rousseau aber nicht."}, {"teil": "Teil A · Diagnose", "nach": "Teil A, Abschnitt „Ein scheinbares Paradox“", "f": "Welche Aufgabe soll Rousseaus Gesellschaftsvertrag lösen?", "a": [["Jeden mit der gemeinsamen Kraft schützen, wobei doch jeder nur sich selbst gehorcht.", 1], ["Eine Macht schaffen, die so stark ist, dass niemand sie herauszufordern wagt.", 0, "Hobbes", null], ["Herrschaft so begründen, dass sie begrenzt bleibt und vorstaatliche Rechte sichert.", 0, "Locke", "Das ist Lockes Frage. Rousseau geht weiter: Niemand soll überhaupt einem fremden Willen gehorchen."], ["Den Naturzustand wiederherstellen, in dem jeder unabhängig und friedlich lebt.", 0, null, null]], "e": "Rousseau formuliert: „Finde eine Form des Zusammenschlusses, die mit ihrer ganzen gemeinsamen Kraft die Person und das Vermögen jedes einzelnen Mitglieds verteidigt und schützt und durch die doch jeder, indem er sich mit allen vereinigt, nur sich selbst gehorcht und so frei bleibt wie vorher.“ (I, 6) Hobbes und Locke lösen das Sicherheitsproblem, indem die Menschen ihre Freiheit ganz oder teilweise abgeben. Für Rousseau genügt Sicherheit ohne Freiheit nicht: „Im Kerker lebt man auch ruhig. Genügt das, um sich darin wohlzufühlen?“"}, {"typ": "arg", "teil": "Teil B · Gesellschaftsvertrag", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welche Prämisse fehlt in Rousseaus Argument?", "zeilen": [["P1", "Jeder gibt sich mit allen seinen Rechten völlig an das Gemeinwesen hin (völlige Entäußerung)."], ["P2", "Da alle dasselbe geben, ist die Bedingung für alle gleich."], ["P3", null], ["K1", "Souverän ist das Volk als Ganzes (Volkssouveränität)."], ["K2", "Wer dem Gesetz gehorcht, gehorcht sich selbst als Teil des Ganzen."]], "a": [["Da sich jeder allen gibt, gibt er sich niemandem im Besonderen.", 1], ["Der Souverän steht außerhalb des Vertrags und garantiert den Frieden.", 0, "Hobbes", "Bei Hobbes steht der Souverän über den Bürgern. Bei Rousseau gibt es gerade keinen Herrscher über dem Volk."], ["Jeder behält seine natürlichen Rechte auf Leben, Freiheit und Besitz.", 0, "Locke", null], ["Die Mehrheit entscheidet, was dem Gemeinwohl am besten dient.", 0, null, null]], "e": "Die völlige Entäußerung klingt zunächst radikaler als bei Hobbes, soll aber gerade die Freiheit retten. Weil alle dasselbe geben, ist die Bedingung für alle gleich, und niemand hat ein Interesse, sie für die anderen drückend zu machen (P2). Weil sich jeder allen gibt und niemandem im Besonderen (P3), gibt es keinen Herrscher über dem Volk. Daraus folgt die Volkssouveränität: Wer dem Gesetz gehorcht, gehorcht sich selbst als Teil des Ganzen."}, {"teil": "Teil B · Gesellschaftsvertrag", "nach": "Teil B, Abschnitt „Volkssouveränität“", "f": "Wer ist bei Rousseau der Souverän, und welche Rolle hat die Regierung?", "a": [["Das Volk als Ganzes gibt die Gesetze; die Regierung führt sie nur aus.", 1], ["Gewählte Vertreter geben dauerhaft die Gesetze; das Volk wählt sie alle paar Jahre.", 0, null, "Eine dauerhafte Übertragung der Gesetzgebung an Repräsentanten lehnt Rousseau ab: Die Souveränität des Volkes ist weder teilbar noch vertretbar."], ["Eine gewählte Legislative ist höchste Gewalt, aber nur als Treuhand des Volkes.", 0, "Locke", null], ["Ein Monarch oder eine Versammlung, von allen autorisiert und keine Vertragspartei.", 0, "Hobbes", null]], "e": "Rousseaus Vertrag ist kein Unterwerfungsvertrag, sondern ein Akt gemeinsamer Selbstbindung: Jeder Bürger verpflichtet sich, nur solchen Gesetzen zu gehorchen, an deren Entstehung er selbst als Teil des Volkes beteiligt war. So entsteht Freiheit durch den Staat, nicht gegen ihn. Die Souveränität liegt ausschließlich beim Volk (Volkssouveränität); Regierung und Verwaltung haben nur eine ausführende Funktion."}, {"teil": "Teil B · Gesellschaftsvertrag", "nach": "Teil B, Abschnitt „Drei Arten von Freiheit“", "k": "4", "f": "Was gewinnt der Mensch nach Rousseau durch den Gesellschaftsvertrag?", "a": [["Bürgerliche und moralische Freiheit; er verliert dafür die natürliche Freiheit.", 1], ["Sicherheit für Leben und Besitz; seine Freiheit gibt er dafür fast vollständig auf.", 0, "Hobbes", "Freiheit gegen Sicherheit zu tauschen ist Hobbes' Lösung. Rousseau will beides zugleich: Schutz und Freiheit."], ["Natürliche Freiheit, also das Recht auf alles, was ihn lockt und was er erreichen kann.", 0, null, "Diese natürliche Freiheit verliert der Mensch gerade durch den Vertrag. Sie ist unbegrenzt, aber nicht gesichert."], ["Die Freiheit von allen Regeln, weil er von nun an nur noch sich selbst gehorcht.", 0, null, null]], "e": "Die bürgerliche Freiheit ist durch den Gemeinwillen begrenzt, dafür aber rechtlich gesichert, samt Eigentum. Die moralische Freiheit fasst Rousseau so: „Der Gehorsam gegen das Gesetz, das man sich selbst gegeben hat, ist Freiheit“ (I, 8). Diese Idee wirkt bei Immanuel Kant nach: Moralisch ist, wer sich selbst Gesetze gibt, die für alle gelten könnten. Freiheit heißt also Selbstgesetzgebung, nicht Beliebigkeit."}, {"teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Sonderwille, Wille aller, Gemeinwille“", "f": "Was unterscheidet den Gemeinwillen (volonté générale) vom Willen aller (volonté de tous)?", "a": [["Der Wille aller ist die Summe der Sonderwillen; der Gemeinwille zielt allein auf das Gemeininteresse.", 1], ["Der Gemeinwille ist das, was die Mehrheit beschließt; der Wille aller verlangt Einstimmigkeit.", 0, null, "Der Gemeinwille ist nicht einfach das Ergebnis einer Mehrheitsabstimmung, sondern Ausdruck gemeinsamer Vernunft."], ["Der Wille aller ist „immer richtig“; der Gemeinwille dagegen kann durch Parteiungen leicht verfälscht werden.", 0, null, "Hier sind die Begriffe vertauscht: „Immer richtig“ ist der Gemeinwille, Parteiungen verfälschen den Willen aller."], ["Beide meinen dasselbe; es sind nur zwei Übersetzungen der volonté générale.", 0, null, null]], "e": "Rousseau unterscheidet drei Begriffe: Der Sonderwille (volonté particulière) zielt auf den eigenen Vorteil. Der Wille aller (volonté de tous) ist die bloße Summe der Sonderwillen. Der Gemeinwille (volonté générale) entsteht, wenn Bürger ihre Eigeninteressen zurückstellen und das Gemeinwohl ins Zentrum rücken. Vorsicht bei Übersetzungen: „Gesamtwille“ steht mal für die volonté générale, mal für die volonté de tous. Im Zweifel den französischen Begriff verwenden."}, {"teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Sonderwille, Wille aller, Gemeinwille“", "f": "Bei einer Abstimmung über Steuern stimmen viele für niedrige Steuern, weil es ihnen persönlich nützt. Was ergibt sich daraus nach Rousseau?", "a": [["Der Wille aller (volonté de tous)", 1], ["Der Gemeinwille (volonté générale)", 0, null, "Der Gemeinwille würde fragen, was der Gemeinschaft als Ganzer dient, zum Beispiel höhere Steuern, um Schulen zu finanzieren."], ["Volkssouveränität", 0, null, null], ["Moralische Freiheit", 0, null, null]], "e": "Jeder stimmt hier nach seinem Sonderwillen, also danach, was ihm selbst nützt. Addiert man diese Sonderwillen, erhält man den Willen aller. Stimmen Interessengruppen zusätzlich als Block ab, wird er noch weiter verfälscht. Der Gemeinwille fragt dagegen: Was dient der Gemeinschaft als Ganzer?"}, {"teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Immer richtig, aber nicht immer erkannt“", "f": "Der Gemeinwille ist nach Rousseau „immer richtig“. Folgt daraus, dass die Beschlüsse des Volkes immer richtig sind?", "a": [["Nein: Das Volk wird nie bestochen, wohl aber oft irregeführt.", 1], ["Ja: Was die Mehrheit beschließt, ist per Definition der Gemeinwille.", 0, null, "Gemeinwille und Abstimmungsergebnis können auseinanderfallen. Genau darin liegt das Problem: Wer darf feststellen, dass das Volk irregeführt ist?"], ["Ja, solange die Regierung die Beschlüsse korrekt ausführt.", 0, null, null], ["Nein: Das Volk ist von Natur aus verdorben und will das Schlechte.", 0, null, null]], "e": "Der Gemeinwille zielt immer auf das öffentliche Wohl, aber die Bürger erkennen es nicht immer (Contrat social II, 3). Damit sich der Gemeinwille in der Abstimmung zeigt, sollen die Bürger wohlunterrichtet und ohne Verbindung untereinander abstimmen. Kritisch gelesen (z. B. Jacob Talmon) öffnet das die Möglichkeit, dass jemand beansprucht, den wahren Gemeinwillen besser zu kennen als das Abstimmungsergebnis."}, {"teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Warum keine Teilgesellschaften?“", "f": "Warum misstraut Rousseau Parteien und Interessengruppen?", "a": [["Dann gibt es nur noch so viele Stimmen wie Vereinigungen, und das Ergebnis wird weniger allgemein.", 1], ["Parteien vertreten verschiedene Perspektiven und kontrollieren so gegenseitig die Macht der Regierung.", 0, null, "Das ist das Argument moderner Demokratien für den Pluralismus. Rousseau sieht darin eher eine Verfälschung des Gemeinwillens."], ["Parteien bilden einen Staat im Staat und bedrohen die ungeteilte Macht eines Monarchen.", 0, null, null], ["Parteien sind zu teuer, und ihre Wahlkämpfe lenken die Bürger von ihrer Arbeit ab.", 0, null, null]], "e": "Stimmen die Bürger wohlunterrichtet und ohne Verbindung untereinander ab, heben sich die vielen kleinen Abweichungen der Sonderwillen gegenseitig auf; als Summe der Unterschiede bleibt der Gemeinwille. Bilden sich Parteiungen, werden die Unterschiede weniger zahlreich. Ist eine Vereinigung stärker als alle anderen, setzt sich nur noch eine Sonderanschauung durch. Rousseau folgert: möglichst keine Teilgesellschaften, und jeder vertritt nur seine eigene Meinung."}, {"teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Zwei Lesarten“", "k": "4", "f": "Wer sich dem Gemeinwillen widersetzt, wird „gezwungen, frei zu sein“. Was befürchtet die kritische Lesart (z. B. Jacob Talmon)?", "a": [["Jemand beansprucht, den wahren Gemeinwillen besser zu kennen als das Abstimmungsergebnis.", 1], ["Der Staat ist zu schwach, um seine Gesetze gegen Einzelne durchzusetzen.", 0, null, null], ["Wahre Freiheit heißt, sich an vernünftige, gemeinsam gesetzte Regeln zu halten, auch gegen Eigeninteressen.", 0, null, "Das ist die wohlwollende Deutung des Satzes, keine Befürchtung."], ["Das Volk leistet zu oft Widerstand und stürzt jede neue Regierung.", 0, null, null]], "e": "Wenn das Gemeinwohl als eindeutig feststehend gilt, können abweichende Meinungen schnell als irrational oder unmoralisch gelten (Gefahr des Monismus). Pluralismus erscheint dann nicht als Stärke, sondern als Verfall. Dazu passt Rousseaus „Zivilreligion“: Wer ihre Glaubenssätze nicht anerkennt, kann verbannt werden. Die Jakobiner beriefen sich während der Schreckensherrschaft auf Rousseau."}, {"teil": "Teil D · Republik und Citoyen", "nach": "Teil D, Abschnitt „Rousseaus Begriffe: Republik und Demokratie“", "k": "4", "f": "Warum ist Rousseau vor allem Republikaner und kein Demokrat im heutigen Sinn?", "a": [["Das Volk muss die Gesetze geben; dass es sie auch selbst ausführt, hält er für kaum möglich.", 1], ["Er hält die Monarchie für die beste Form, weil ein Einzelner nicht mit sich uneins sein kann.", 0, "Hobbes", "So begründet Hobbes, warum er die Monarchie für die beste Form hält."], ["Er will große Staaten mit gewählten Vertretern und gegenseitiger Kontrolle der Gewalten.", 0, "Montesquieu", "Das ist Montesquieus Lösung für große Staaten. Rousseau lehnt sie ab, weil die Souveränität weder teilbar noch vertretbar sei."], ["Er lehnt jede Beteiligung des Volkes ab und überlässt die Politik einer Elite.", 0, null, null]], "e": "Rousseau unterscheidet: Der Souverän (das ganze Volk) gibt die Gesetze, die Regierung führt sie aus. „Demokratie“ heißt bei ihm, dass das Volk die Gesetze auch selbst ausführt: „Gäbe es ein Volk von Göttern, so würde es sich demokratisch regieren. Eine so vollkommene Regierung passt nicht für Menschen“ (III, 4). Republik nennt er jeden Staat, in dem das Volk die Gesetze gibt (II, 6)."}, {"teil": "Teil D · Republik und Citoyen", "nach": "Teil D, Abschnitt „Citoyen und Bourgeois“", "k": "4", "f": "Was unterscheidet bei Rousseau den Citoyen vom Bourgeois?", "a": [["Der Citoyen engagiert sich für das Gemeinwohl, der Bourgeois sucht Sicherheit, Komfort und Besitz.", 1], ["Der Bourgeois engagiert sich für das Gemeinwohl, der Citoyen sucht Sicherheit, Komfort und Besitz.", 0, null, "Hier sind die Begriffe vertauscht. Der Bourgeois zieht sich ins Private zurück."], ["Der Citoyen gehört zum Adel, der Bourgeois zum einfachen Volk, das von ihm abhängig ist.", 0, null, null], ["Der Citoyen wählt nur seine Vertreter, der Bourgeois beteiligt sich direkt an der Gesetzgebung.", 0, null, null]], "e": "Für Rousseau ist Demokratie eine Lebensform, die aktive Beteiligung verlangt. Sie scheitert dort, wo Bürger sich ins Private zurückziehen und Eigentum wichtiger wird als gemeinsame Verantwortung. Rousseau warnt: „Sobald man bei Staatsangelegenheiten die Worte hört: ‚Was geht das mich an?‘, kann man darauf rechnen, dass der Staat verloren ist.“ (III, 15)"}, {"typ": "offen", "teil": "Teil C · Gemeinwille", "nach": "Teil C, Abschnitt „Immer richtig, aber nicht immer erkannt“", "f": "Wenn ich überstimmt werde: Habe ich mich geirrt oder die Mehrheit? Erläutere mit Rousseaus Begriffen, welches Problem entsteht, wenn der Gemeinwille vom Abstimmungsergebnis abweichen kann.", "m": "Für Rousseau zielt der Gemeinwille immer auf das Gemeininteresse und ist in diesem Sinn „immer richtig“. Die Beschlüsse des Volkes haben aber nicht immer dieselbe Richtigkeit: Das Volk wird nie bestochen, wohl aber oft irregeführt. Stimmen alle wohlunterrichtet und ohne Absprachen ab, heben sich die Sonderwillen auf, und die Abstimmung zeigt den Gemeinwillen; wer dann überstimmt wird, ist womöglich seinem Sonderwillen gefolgt. Haben aber Parteiungen das Ergebnis verfälscht, ist es nur der Wille aller oder sogar eine Sonderanschauung; dann kann die Mehrheit irren. Das Problem: Wer darf feststellen, welcher Fall vorliegt? Wenn jemand beansprucht, den wahren Gemeinwillen besser zu kennen als die Abstimmung, kann er Andersdenkende als irrational behandeln und sie „zwingen, frei zu sein“. Das ist die kritische Lesart (Talmon) und die Gefahr des Monismus."}]}, {"id": "vertrag-vergleich", "tf": "PP", "gruppe": "Vertragstheorien", "kapitel": "Hobbes, Locke, Rousseau", "titel": "Im Vergleich", "sub": "Wer sagt was?", "kurse": ["4", "2"], "fragen": [{"teil": "Methode", "nach": "Kapitel Rousseau, Fazit „Die Vertragstheorien im Überblick“", "f": "Was haben Hobbes, Locke und Rousseau gemeinsam?", "a": [["Dieselbe Methode: Naturzustand und Vertrag; Herrschaft wird durch Zustimmung begründet.", 1], ["Sie sehen den Staat als natürliche Gemeinschaft, die dem guten Leben dient.", 0, "Aristoteles", "Das ist die antike Grundantwort von Platon und Aristoteles. Für die Vertragstheoretiker ist der Staat von Menschen gemacht."], ["Sie beschreiben, wie die ersten Staaten in der Geschichte tatsächlich entstanden sind.", 0, null, "Der Naturzustand ist bei allen dreien ein Gedankenexperiment, kein Geschichtsbericht."], ["Sie begründen die Macht des Herrschers durch göttliche Einsetzung und Tradition.", 0, "Gottesgnadentum", null]], "e": "Hobbes, Locke und Rousseau benutzen dieselbe Methode, den Naturzustand und den Vertrag, und kommen zu drei verschiedenen Staaten. Gemeinsam ist ihnen, dass sie Herrschaft nicht durch Gott, Natur oder Tradition begründen, sondern durch die Zustimmung freier und vernünftiger Menschen (Kontraktualismus). Jede Lösung erzeugt ein neues Problem, das der Nächste aufgreift."}, {"teil": "Wer sagt das?", "nach": "Kapitel Locke, Teil A, Abschnitt „Frei und gleich unter einem Gesetz der Natur“", "f": "„Der Staat erschafft die Rechte nicht, er soll sie sichern.“", "a": [["Hobbes", 0, null, "Bei Hobbes ist es umgekehrt: Ohne allgemeine Gewalt gibt es kein Gesetz und keine Ungerechtigkeit, Recht entsteht erst mit dem Staat."], ["Locke", 1], ["Rousseau", 0, null, null]], "e": "Das ist der entscheidende Unterschied zwischen Locke und Hobbes. Bei Locke gibt es Recht und Unrecht schon im Naturzustand: Das Gesetz der Natur verbietet, einem anderen an Leben, Gesundheit, Freiheit oder Besitz zu schaden. Der Staat soll diese Rechte durch Gesetz, Richter und Exekutive sichern."}, {"teil": "Wer sagt das?", "nach": "Kapitel Hobbes, Teil A, Abschnitt „Recht und Unrecht im Naturzustand“", "f": "„Wo keine allgemeine Gewalt ist, ist kein Gesetz, und wo kein Gesetz ist, keine Ungerechtigkeit.“", "a": [["Hobbes", 1], ["Locke", 0, null, "Für Locke wäre der Satz falsch: Das Gesetz der Natur gilt auch ohne Staat, und jeder darf Übertreter bestrafen."], ["Rousseau", 0, null, null]], "e": "Leviathan, Kap. 13. Für Hobbes sind gerecht und ungerecht keine natürlichen Eigenschaften von Handlungen, sondern setzen eine Ordnung voraus, die Verträge erzwingt. Im Naturzustand gibt es deshalb auch kein Eigentum und kein festes „Mein und Dein“."}, {"teil": "Wer sagt das?", "nach": "Kapitel Rousseau, Teil B, Abschnitt „Völlige Entäußerung“", "f": "„Jeder gibt sich mit allen seinen Rechten völlig an das Gemeinwesen hin.“", "a": [["Hobbes", 0, null, "Auch bei Hobbes verzichten alle auf ihr Recht auf alles, aber zugunsten eines Souveräns, der über ihnen steht. Bei Rousseau gibt sich jeder allen und damit niemandem im Besonderen."], ["Locke", 0, null, null], ["Rousseau", 1]], "e": "Rousseaus völlige Entäußerung klingt radikaler als Hobbes' Vertrag. Weil aber alle dasselbe geben, ist die Bedingung für alle gleich, und weil sich jeder allen gibt, gibt er sich niemandem im Besonderen. Souverän ist das Volk als Ganzes (Volkssouveränität)."}, {"teil": "Wer sagt das?", "nach": "Kapitel Hobbes, Teil B, Abschnitt „Verträge ohne Schwert“", "f": "„Verträge ohne Schwert sind bloße Worte.“", "a": [["Hobbes", 1], ["Locke", 0, null, "Locke braucht zwar auch eine vollstreckende Gewalt, aber bei ihm gilt das Gesetz der Natur schon vor dem Staat. Das Bild vom Schwert stammt aus dem Leviathan."], ["Rousseau", 0, null, null]], "e": "Leviathan, Kap. 17. Die Naturgesetze allein reichen nicht, weil sie den natürlichen Leidenschaften entgegengesetzt sind. Wer Verträge hält, während andere sie brechen, macht sich zur Beute. Erst ein Souverän mit Gewaltmonopol macht es vernünftig, Verträge zu halten."}, {"teil": "Wer sagt das?", "nach": "Kapitel Locke, Teil C, Abschnitt „Das Widerstandsrecht“", "f": "„Wollen die Gesetzgeber dem Volk sein Eigentum nehmen oder es versklaven, versetzen sie sich in den Kriegszustand mit dem Volk.“", "a": [["Hobbes", 0, null, "Das Wort „Kriegszustand“ lockt zu Hobbes. Doch bei Hobbes gibt es kein Widerstandsrecht gegen den Souverän; dass Gesetzgeber Unrecht tun können, ist Lockes Gedanke."], ["Locke", 1], ["Rousseau", 0, null, null]], "e": "Dann fällt die Macht an das Volk zurück, das eine neue Legislative errichten darf (§222). Das ist Lockes Widerstandsrecht: Die Regierung ist eine Treuhand, gebunden an den Zweck, Leben, Freiheit und Besitz zu schützen. Richter darüber ist das Volk als Ganzes, und es erhebt sich erst nach einer „langen Kette von Missbräuchen“."}, {"teil": "Wer sagt das?", "nach": "Kapitel Rousseau, Teil B, Abschnitt „Drei Arten von Freiheit“", "k": "4", "f": "„Der Gehorsam gegen das Gesetz, das man sich selbst gegeben hat, ist Freiheit.“", "a": [["Hobbes", 0, null, null], ["Locke", 0, null, "Auch Locke verbindet Gesetz und Freiheit („Wo kein Gesetz ist, da ist keine Freiheit“). Die Selbstgesetzgebung durch das Volk ist aber Rousseaus Gedanke."], ["Rousseau", 1]], "e": "Contrat social I, 8: die moralische Freiheit. Wer dem Gesetz gehorcht, gehorcht sich selbst als Teil des Ganzen. Hobbes dagegen versteht Freiheit als Abwesenheit äußerer Hindernisse; sie ist im Naturzustand maximal, aber ohne Sicherheit."}, {"teil": "Problem und neues Problem", "nach": "Kapitel Rousseau, Fazit „Die Vertragstheorien im Überblick“", "f": "Jede Vertragstheorie erzeugt ein neues Problem. Welches bleibt nach Rousseau offen?", "a": [["Wer bestimmt den Gemeinwillen, und wie werden Minderheiten geschützt?", 1], ["Wer schützt die Bürger vor dem übermächtigen Souverän, dem Leviathan?", 0, "Hobbes", "Das ist die offene Frage nach Hobbes, die Locke aufgreift."], ["Wer entscheidet, ob die Regierung das Vertrauen gebrochen hat?", 0, "Locke", null], ["Wie lässt sich der Krieg eines jeden gegen jeden beenden?", 0, "Hobbes", null]], "e": "Das Fazit des Rousseau-Kapitels fasst zusammen: Hobbes beendet die Unsicherheit durch einen ungeteilten Souverän, hinterlässt aber die Frage, wer uns vor dem Leviathan schützt. Locke begrenzt die Macht durch Treuhand und Widerstandsrecht; offen bleiben, wer über den Vertrauensbruch entscheidet, und die Ungleichheit durch Eigentum. Rousseau antwortet mit Gemeinwille und Volkssouveränität; offen bleibt, wer den Gemeinwillen bestimmt und wie Minderheiten geschützt werden."}, {"teil": "Freiheit im Vertrag", "nach": "Kapitel Locke, Teil C, Abschnitt „Der Gesellschaftsvertrag“", "f": "Was geben die Menschen im Vertrag ab? Welche Zuordnung stimmt?", "a": [["Hobbes: Recht auf alles. Locke: Strafgewalt ganz, Freiheit teilweise. Rousseau: alle Rechte an das Gemeinwesen.", 1], ["Hobbes: Strafgewalt ganz, Freiheit teilweise. Locke: alle Rechte an das Gemeinwesen. Rousseau: Recht auf alles.", 0, null, "Hier sind die Positionen vertauscht. Die völlige Entäußerung an das Gemeinwesen ist Rousseaus Lösung, nicht Lockes."], ["Hobbes: alle Rechte an das Gemeinwesen. Locke: Recht auf alles. Rousseau: Strafgewalt ganz, Freiheit teilweise.", 0, null, null], ["Hobbes: Recht auf alles. Locke: alle Rechte an das Gemeinwesen. Rousseau: Strafgewalt ganz, Freiheit teilweise.", 0, null, null]], "e": "Bei Hobbes verzichten alle auf ihr Recht auf alles und autorisieren einen Souverän: Der Preis ist Freiheit, der Gewinn Sicherheit. Bei Locke geben die Menschen ihre Strafgewalt ganz ab, ihre natürliche Freiheit nur so weit, wie es die Erhaltung aller verlangt; ihre natürlichen Rechte behalten sie. Bei Rousseau gibt sich jeder völlig an das Gemeinwesen, verliert die natürliche Freiheit und gewinnt bürgerliche und moralische Freiheit."}, {"teil": "Eigentum", "nach": "Kapitel Locke, Exkurs 4 „Eigentum - Freiheit oder Ungleichheit?“", "k": "4", "f": "Wie stehen die drei zum Eigentum? Welche Zuordnung stimmt?", "a": [["Hobbes: gibt es erst im Staat. Locke: entsteht vorher durch Arbeit. Rousseau: Ursprung der Ungleichheit.", 1], ["Hobbes: entsteht durch Arbeit. Locke: gibt es erst im Staat. Rousseau: Ursprung der Ungleichheit.", 0, null, null], ["Hobbes: Ursprung der Ungleichheit. Locke: entsteht vorher durch Arbeit. Rousseau: gibt es erst im Staat.", 0, null, null], ["Hobbes: gibt es erst im Staat. Locke: entsteht vorher durch Arbeit. Rousseau: muss abgeschafft werden.", 0, null, "Rousseau fordert keine Abschaffung, sondern eine politische Begrenzung des Eigentums."]], "e": "Bei Hobbes gibt es im Naturzustand kein festes „Mein und Dein“: Jedem gehört nur, was er erlangen und behaupten kann. Bei Locke entsteht Eigentum schon vor dem Staat, wenn jemand seine Arbeit mit etwas aus der Natur mischt; sein Schutz ist der Hauptzweck des Staates. Rousseau sieht im Eigentum den Ursprung der Ungleichheit, will es aber nur begrenzen: Kein Bürger soll so reich sein, dass er einen anderen kaufen kann, und keiner so arm, dass er gezwungen ist, sich zu verkaufen."}, {"typ": "offen", "teil": "Problem und neues Problem", "nach": "Kapitel Rousseau, Fazit „Die Vertragstheorien im Überblick“", "f": "Dieselbe Methode, drei verschiedene Staaten: Erkläre, wie jede Vertragstheorie ein Problem löst und dabei ein neues erzeugt, das der Nächste aufgreift.", "m": "Hobbes beginnt mit der Unsicherheit im Naturzustand: Ohne gemeinsame Macht herrscht der Krieg eines jeden gegen jeden. Seine Lösung ist ein Vertrag jeder mit jedem, der einen ungeteilten Souverän schafft, den Leviathan. Gegen ihn gibt es kein Widerstandsrecht, und so bleibt die Frage: Wer schützt uns vor dem Leviathan? Locke greift sie auf. Bei ihm gibt es Rechte schon vor dem Staat; die Regierung ist eine Treuhand, die an den Schutz von Leben, Freiheit und Besitz gebunden ist, und bei Missbrauch hat das Volk ein Widerstandsrecht. Offen bleibt, wer über den Vertrauensbruch entscheidet, und das Eigentum, das Locke schützt, erzeugt Ungleichheit. Rousseau fragt, wie man gehorchen und trotzdem frei bleiben kann. Seine Antwort sind die völlige Entäußerung an das Gemeinwesen, der Gemeinwille und die Volkssouveränität. Daraus entsteht ein neues Problem: Wer bestimmt den Gemeinwillen, und wie werden Minderheiten geschützt?"}]}, {"id": "vertrag-interview", "tf": "PP", "gruppe": "Vertragstheorien", "quelle": "Text", "kapitel": "Wozu braucht man eigentlich einen Staat?", "titel": "Im Interview", "sub": "Hobbes, Locke und Rousseau im Streitgespräch", "hinweis": "Grundlage ist das fiktive Streitgespräch „Wozu braucht man eigentlich einen Staat?“ (S. 52-62). Die Fragen beziehen sich auf das, was die Personen im Text sagen, nicht auf dein übriges Wissen über die Philosophen. Leg den Text daneben.", "kurse": ["4", "2"], "fragen": [{"teil": "Hobbes", "nach": "S. 52-53", "f": "Warum hat Hobbes seinem Hauptwerk laut Text den Titel „Leviathan“ gegeben?", "a": [["Der Leviathan ist im Alten Testament ein gütiger Beschützer des Volkes, so wie der Staat die Bürger schützen soll.", 0, null, "Im Text jagt der Leviathan den Menschen Furcht und Schrecken ein. Von einem gütigen Beschützer ist keine Rede."], ["Das biblische Meeresungeheuer jagt den Menschen Furcht und Schrecken ein, und der Staat verbreitet als höchste irdische Macht ebenfalls Furcht und Schrecken und unterwirft alle anderen Mächte.", 1], ["Der Staat ist wie der Leviathan aus vielen einzelnen Menschen zusammengesetzt.", 0, null, "Das zeigt das berühmte Titelbild des Leviathan. Im Interview sagt Hobbes es aber nicht, und die Fragen beziehen sich nur auf den Text."], ["Der Name verweist auf die Schlange im Paradies, die den Menschen zum Ungehorsam gegen Gott verführt.", 0, null, "Hobbes spricht von einem Meeresungeheuer aus den Büchern Hiob und Jesaja und aus den Psalmen, „eine Art Schlange oder Drache“, nicht von der Schlange im Paradies."]], "e": "Hobbes erklärt, dass im Alten Testament ein Meeresungeheuer namens Leviathan erwähnt wird, das den Menschen Furcht und Schrecken einjagt. Er benutzt es als Sinnbild für die Staatsgewalt: Der Staat verbreitet als höchste irdische Macht Furcht und Schrecken und unterwirft sich dadurch alle anderen Mächte."}, {"teil": "Hobbes", "nach": "S. 53", "f": "Worin unterscheidet sich Hobbes laut Text von Aristoteles?", "a": [["Aristoteles sieht den Menschen als soziales Wesen und den Staat als Erfüllung des Menschseins; Hobbes geht vom Einzelnen und seiner Freiheit aus, deren Einschränkung nur gerechtfertigt ist, wenn jeder Bürger zustimmen kann.", 1], ["Aristoteles hält den Staat für Furcht einflößend, Hobbes für ein natürliches Gemeinwesen.", 0, null, "Die Positionen sind vertauscht: Furcht und Schrecken verbreitet der Staat bei Hobbes."], ["Beide sehen den Menschen als soziales Wesen, unterscheiden sich aber in der bevorzugten Staatsform.", 0, null, "Hobbes sagt ausdrücklich: „Ich betrachte den Menschen nicht mehr als soziales Wesen.“"], ["Aristoteles leitet den Staat aus einem Vertrag ab, Hobbes aus der Natur des Menschen.", 0, null, "Auch hier sind die Positionen vertauscht: Den Vertrag hat Hobbes."]], "e": "Für Aristoteles ist der Staat laut Moderator „gewissermaßen die Erfüllung des Menschseins“. Hobbes geht dagegen vom einzelnen Menschen und seiner individuellen Freiheit aus: Niemand ist von Natur aus einem anderen untertan. Deshalb ist jede Einschränkung dieser Freiheit, auch durch den Staat, nur gerechtfertigt, wenn ihr jeder einzelne Bürger zustimmen kann. Der Staat, der Furcht und Schrecken verbreitet, beruht also letztlich auf der Zustimmung aller."}, {"teil": "Hobbes", "nach": "S. 53-54", "f": "Was meint Hobbes im Text mit dem „Naturzustand“?", "a": [["Eine frühe historische Epoche, in der die Menschen noch ohne technische Hilfsmittel lebten.", 0, null, "Diese Deutung des Moderators weist Hobbes zurück: „Sie haben mich nicht richtig verstanden.“ Er meint keinen primitiven Entwicklungszustand."], ["Einen Zustand, der heute nur noch bei Völkern ohne Staat vorkommt.", 0], ["Ein Gedankenexperiment: Er stellt sich einen Zustand ohne Staat, Herrschaft und Gesetze vor, um zu untersuchen, welche Mängel dann auftreten würden.", 1], ["Den englischen Bürgerkrieg, den er selbst erlebt hat.", 0, null, "Der Bürgerkrieg hat sein Menschenbild geprägt (S. 54), ist aber nicht der Naturzustand."]], "e": "Naturzustand heißt für Hobbes: der Zustand der Menschheit, wenn es keinen Staat gibt, also ohne Herrschaft, ohne Gesetze. Es ist ein Gedankenexperiment. Hobbes nimmt einen solchen Zustand an, um zu untersuchen, welche Mängel dann auftreten würden. Daraus lässt sich ableiten, wozu ein Staat notwendig ist. Er geht davon aus, dass alle Menschen einer staatlichen Autorität zustimmen würden, wenn sie diese Mängel abstellen könnte."}, {"teil": "Hobbes", "nach": "S. 54", "f": "Womit begründet Hobbes im Text, dass im Naturzustand niemand einen sicheren Vorteil für sich beanspruchen kann?", "a": [["Alle Menschen sind von Natur aus gleich friedfertig.", 0, null, "Im Text nennt Hobbes die Menschen Egoisten, die vor allem an ihrem eigenen Wohlergehen interessiert sind."], ["Die Natur hat die Menschen annähernd gleich geschaffen: Selbst der Schwächste ist stark genug, den Stärksten durch List oder Bündnisse zu töten.", 1], ["Ein natürliches Gesetz verbietet jedem, einem anderen zu schaden.", 0, "Locke", "So beschreibt Locke den Naturzustand (S. 57): Die Vernunft lehrt, dass niemand den anderen töten, verletzen, bestehlen oder seiner Freiheit berauben darf."], ["Im Naturzustand gibt es noch kein Eigentum, das man verteidigen könnte.", 0, null, "Das nennt Hobbes im Text nicht als Begründung. Er sagt im Gegenteil, dass ohne Staat jeder ein Recht auf alles hat."]], "e": "Weil die Natur die Menschen annähernd gleich geschaffen hat, kann auch der Schwächste den Stärksten töten, wenn er sich einer List bedient oder sich mit anderen verbündet. Daraus folgt, dass im Naturzustand niemand einen Vorteil für sich beanspruchen kann, den nicht ein anderer ebenso gut verlangen könnte. Ohne Staat hat jeder ein Recht auf alles, und so kommt es zu Konkurrenz und Streit."}, {"teil": "Hobbes", "nach": "S. 54", "f": "Welche Aussage über den „Krieg eines jeden gegen jeden“ entspricht dem Text?", "a": [["Die Menschen würden ununterbrochen mit Waffen gegeneinander kämpfen.", 0, null, "Hobbes widerspricht dem ausdrücklich: „Damit will ich nicht sagen, dass Menschen ohne Staat immer in einem Kriegszustand leben würden.“"], ["Der Krieg entsteht erst, wenn Menschen beginnen, Eigentum zu erwerben.", 0, null, "Das erinnert an Rousseau, der die Ungleichheit mit dem Eigentum beginnen lässt. Bei Hobbes entsteht der Streit aus dem Recht aller auf alles."], ["Der Krieg betrifft nur die Starken; die Schwachen unterwerfen sich freiwillig.", 0], ["Die Menschen würden sich misstrauisch und feindselig gegenüberstehen und wären jederzeit bereit loszuschlagen; es muss nicht ständig gekämpft werden.", 1]], "e": "Krieg heißt bei Hobbes: Die Menschen stünden sich misstrauisch und feindselig gegenüber und wären jederzeit bereit, mit Waffengewalt aufeinander loszugehen. Bildlich gesagt: Homo homini lupus, der Mensch ist dem Menschen ein Wolf. Rousseau unterbricht sofort: Der Mensch sei von Natur aus gar nicht egoistisch und bösartig."}, {"teil": "Hobbes", "nach": "S. 55", "f": "Wie unterscheidet Hobbes im Text den Gesellschaftsvertrag vom Herrschaftsvertrag?", "a": [["Den Gesellschaftsvertrag schließen Fürst und Volk, den Herrschaftsvertrag die Bürger untereinander.", 0, null, "Die Begriffe sind vertauscht: Zwischen Fürst und Volk wird der Herrschaftsvertrag geschlossen."], ["Der Gesellschaftsvertrag ist befristet, der Herrschaftsvertrag gilt dauerhaft.", 0], ["Den Gesellschaftsvertrag schließen die Bürger untereinander; er darf nicht mit einem Vertrag zwischen Fürst und Volk verwechselt werden.", 1], ["Der Gesellschaftsvertrag regelt das Eigentum, der Herrschaftsvertrag die Sicherheit.", 0, null, "Davon steht nichts im Text. Der Unterschied liegt darin, wer den Vertrag mit wem schließt."]], "e": "Der Gesellschaftsvertrag ist für Hobbes der Geburtsakt des Staates. Die Bürger schließen ihn untereinander, nicht mit dem Herrscher. Sie erklären darin, dass sie auf ihr Recht auf alles verzichten, und übertragen ihre Macht auf einen Menschen, den Souverän. Diese Aufgabe kann auch eine Versammlung übernehmen. Der Souverän schützt sie vor gegenseitigen Übergriffen und vor Angriffen von außen."}, {"teil": "Hobbes", "nach": "S. 55", "f": "Warum ist laut Hobbes gerade ein Egoist bereit, den Gesellschaftsvertrag zu schließen?", "a": [["Er sieht ein, dass es auf lange Sicht vorteilhafter für ihn ist, in Frieden und Sicherheit zu leben als in ständiger Todesfurcht.", 1], ["Er gewinnt durch den Vertrag mehr Macht über andere.", 0, null, "Im Gegenteil: Er verzichtet auf sein Recht auf alles und überträgt seine Macht auf den Souverän."], ["Der Souverän garantiert ihm im Gegenzug sein Eigentum.", 0, "Locke", "Den Schutz des Eigentums als Zweck des Staates betont Locke. Hobbes nennt im Text Frieden und Sicherheit."], ["Die Vernunft zeigt ihm, dass er moralisch verpflichtet ist, auf Gewalt zu verzichten.", 0, null, "Hobbes argumentiert nicht mit einer moralischen Pflicht, sondern mit dem Eigeninteresse."]], "e": "Selbst ein Egoist sieht ein, dass es für ihn auf lange Sicht vorteilhafter ist, in Frieden und Sicherheit zu leben als in ständiger Todesfurcht. Ein Egoist möchte möglichst angenehm leben, und dafür ist der Friede eine Voraussetzung. Hobbes braucht also keine guten Menschen: Der Vertrag lohnt sich gerade für Egoisten."}, {"teil": "Hobbes", "nach": "S. 55-56", "f": "Welches Problem entsteht laut Hobbes, wenn einige Menschen den Vertrag nicht unterzeichnen?", "a": [["Der Souverän müsste die Verweigerer bestrafen und würde damit selbst den Vertrag brechen.", 0], ["Die Verweigerer würden einen eigenen Staat gründen und Krieg führen.", 0], ["Ohne Einstimmigkeit wäre der Vertrag nach dem Naturrecht ungültig.", 0, null, "Hobbes stellt keine juristische Frage nach der Gültigkeit. Es geht darum, ob der Verzicht für den Einzelnen vernünftig ist."], ["Wer auf seine Rechte verzichtet, während andere es nicht tun, wäre im Nachteil; deshalb käme der Vertrag erst zustande, wenn alle außer dem Souverän verzichten.", 1]], "e": "Ein Mensch ist nur bereit, auf etwas zu verzichten, wenn alle anderen es auch tun und keinen Vorteil daraus ziehen, dass er sein Recht aufgibt. Wer allein verzichtet, macht sich verwundbar. Deshalb kann sich jeder ausrechnen, dass der Vertrag gar nicht zustande käme, wenn nicht alle, mit Ausnahme des Souveräns, auf ihre Rechte verzichten würden."}, {"teil": "Hobbes", "nach": "S. 56", "f": "Wie geht Hobbes im Text mit diesem Problem um?", "a": [["Er verlangt, dass der Vertrag schriftlich festgehalten und von allen unterschrieben wird.", 0, null, "Gerade das nicht: Der Vertrag wird laut Hobbes gar nicht wirklich abgeschlossen."], ["Er räumt ein, dass der Vertrag nicht wirklich geschlossen wird; er will zeigen, dass alle vernünftigerweise zustimmen würden, und leitet daraus ab, dass ein Staat gerechtfertigt ist.", 1], ["Er schlägt vor, die Verweigerer aus dem Staatsgebiet zu verbannen.", 0], ["Er erklärt, dass der Souverän die Zustimmung mit Gewalt erzwingen darf.", 0, null, "Von erzwungener Zustimmung spricht Hobbes im Text nicht. Er will zeigen, dass alle freiwillig zustimmen würden."]], "e": "Hobbes erinnert daran, dass alles ein Gedankenexperiment ist: Der Vertrag wird nicht wirklich abgeschlossen. Er will zeigen, dass alle Menschen einem solchen Vertrag zustimmen würden, wenn sie darüber nachdenken. Daraus leitet er ab, dass man unterstellen kann, dass ein Staat gerechtfertigt ist. Diese hypothetische Zustimmung ist der Kern der Vertragstheorie: Sie beschreibt keine Staatsgründung, sondern rechtfertigt den Staat."}, {"teil": "Hobbes", "nach": "S. 56", "f": "Wann endet laut Hobbes im Text die Gehorsamspflicht der Untertanen?", "a": [["Wenn der Souverän Unschuldige hinrichten lässt.", 0, null, "Im Text sagt Hobbes das Gegenteil: Der Souverän kann nicht einmal zur Rechenschaft gezogen werden, wenn er einen Menschen unschuldig hinrichten lässt, sofern es im Interesse des Friedens nötig ist."], ["Wenn die Mehrheit der Bürger dem Souverän das Vertrauen entzieht.", 0, "Locke", "Dass das Volk eine gesetzgebende Versammlung abberufen kann, wenn sie seinem Vertrauen zuwiderhandelt, sagt Locke (S. 58-59)."], ["Wenn der Staat seine Aufgabe der Friedenssicherung nicht mehr erfüllt.", 1], ["Nie, denn der Souverän ist niemandem Rechenschaft schuldig.", 0, null, "Fast: Rechenschaft schuldet der Souverän nicht. Aber Hobbes nennt eine Grenze, die Friedenssicherung."]], "e": "Solange der Staat Frieden und Sicherheit garantiert, schulden ihm die Bürger totalen Gehorsam. Niemand hat das Recht, Widerstand zu leisten, auch nicht, wer sich ungerecht behandelt fühlt. Erst wenn der Staat seiner Aufgabe der Friedenssicherung nicht mehr nachkommen kann, endet die Gehorsamspflicht. Rousseau ruft dazwischen: „Skandalös!“ Damit könnte man sogar eine absolute Monarchie rechtfertigen."}, {"teil": "Locke", "nach": "S. 57", "f": "Worin stimmt Locke laut Text mit Hobbes überein, und worin nicht?", "a": [["Übereinstimmung: Rechtfertigung des Staates durch den Gesellschaftsvertrag. Unterschied: Der Naturzustand ist kein zügelloser Zustand, denn es gibt natürliche Rechte und Pflichten.", 1], ["Übereinstimmung: pessimistisches Menschenbild. Unterschied: Locke lehnt den Vertragsgedanken ab.", 0, null, "Locke nennt den Gesellschaftsvertrag „eine der genialsten Ideen der politischen Philosophie“."], ["Übereinstimmung: Naturzustand als Kriegszustand. Unterschied: Locke fordert Gewaltenteilung.", 0, null, "Der Unterschied stimmt, die Übereinstimmung nicht: Für Locke ist der Naturzustand gerade kein zügelloser Zustand."], ["Übereinstimmung: ungeteilte Herrschaft. Unterschied: Locke will einen gewählten Herrscher.", 0, "Hobbes", "Ungeteilte Herrschaft ist Hobbes' Modell. Locke hält das Gewaltmonopol für eine große Gefahr für die Freiheit."]], "e": "Locke beurteilt Hobbes „sehr zwiespältig“. Die Rechtfertigung des Staates durch den Gesellschaftsvertrag hält er für eine der genialsten Ideen der politischen Philosophie. Aber selbst ohne staatliche Autorität gibt es natürliche Rechte und Pflichten: das Recht auf Leben und körperliche Unversehrtheit, auf Freiheit und auf Eigentum. Diese Rechte verleiht nicht erst der Staat, sie existieren schon im Naturzustand."}, {"teil": "Locke", "nach": "S. 57-58", "f": "Warum braucht es laut Locke im Text trotz natürlicher Rechte einen Staat?", "a": [["Die Menschen im Naturzustand kennen die natürlichen Rechte nicht.", 0, null, "Im Text lehrt die Vernunft die Menschen diese Rechte (S. 57)."], ["Die natürlichen Rechte sind allgemein und abstrakt: Über ihre Anwendung im Einzelfall kann Streit entstehen, die Beteiligten sind parteiisch, und Rechte lassen sich nicht immer durchsetzen.", 1], ["Die natürlichen Rechte entstehen erst durch den Staat.", 0, null, "Das widerspricht Lockes Grundthese: Die natürlichen Rechte existieren schon im Naturzustand."], ["Gott hat den Menschen befohlen, sich einer Obrigkeit zu unterwerfen.", 0]], "e": "Die natürlichen Rechte sind allgemein und abstrakt und nicht eindeutig formuliert. Deshalb kann Streit entstehen, wie sie im Einzelfall auszulegen sind, besonders wenn die Beteiligten parteiisch sind. Manchmal lassen sie sich auch nicht durchsetzen: Jemand ist im Recht, bekommt aber nicht Recht. Daraus folgen die Aufgaben des Staates: eindeutige Gesetze, Aufsicht über ihre Einhaltung und unparteiische Richter, kurz: die Sicherung der natürlichen Rechte."}, {"teil": "Rousseau", "nach": "S. 59", "f": "Welche Kritik äußert Rousseau im Text an Lockes Liberalismus?", "a": [["Locke schränke die Freiheit des Einzelnen durch zu viele Gesetze ein.", 0], ["Lockes Gewaltenteilung mache den Staat handlungsunfähig.", 0], ["Locke vertraue zu sehr auf die Vernunft und zu wenig auf das Mitgefühl der Menschen.", 0, null, "Das klingt nach Rousseau, ist aber nicht die Kritik, die er im Text an Locke äußert."], ["Lockes Freiheit sei nur die Freiheit der Reichen und Besitzenden; sein Staat sei ein Nachtwächterstaat, der den Besitz der Wohlhabenden bewacht.", 1]], "e": "Rousseau nennt Lockes Liberalismus eine Rechtfertigung der bürgerlichen Klasse: Freiheit bedeute bei Locke nur die Freiheit der Reichen und Besitzenden, sein Staat sei ein Nachtwächterstaat. Für Rousseau hat ein Mensch nicht nur das Recht, dass ihm nichts weggenommen wird, sondern einen positiven Anspruch auf Eigentum. Der Staat soll deshalb den Unterschied zwischen Arm und Reich aufheben."}, {"teil": "Rousseau", "nach": "S. 60", "f": "Welche Voraussetzungen nennt Rousseau im Text dafür, dass die natürliche Freiheit im Staat erhalten bleibt?", "a": [["Alle Rechte werden einem Souverän übertragen, der außerhalb des Vertrags steht.", 0, "Hobbes", "Das ist Hobbes' Souverän. Genau den lehnt Rousseau ab."], ["Jeder behält einen Teil seiner Rechte, den der Staat nicht antasten darf.", 0, "Locke", "Ein Bereich von Rechten, den der Staat beachten muss, passt eher zu Locke."], ["Alle werden beim Vertragsschluss gleich behandelt; es gibt keinen Souverän außerhalb des Vertrags, und der staatliche Wille stimmt mit dem Willen des Einzelnen überein, sodass jeder nur seinem eigenen Willen folgt.", 1], ["Die Bürger wählen Vertreter, die ihre Interessen im Parlament wahrnehmen.", 0, null, "Die repräsentative Demokratie erwähnt Rousseau im Text erst am Ende, und nur als das, was in Flächenstaaten eingeführt wurde. Er selbst fordert die direkte Befragung aller Bürger."]], "e": "Die erste Voraussetzung: Beim Vertragsschluss werden alle ohne Ausnahme gleich behandelt. Es darf keinen Souverän geben, der außerhalb des Vertrags steht. Nicht die Willkür eines Souveräns, sondern der allgemeine Wille soll das staatliche Handeln lenken. Das führt für Rousseau zur Demokratie als direkter Befragung aller Bürger. Stimmen der staatliche Wille und der Wille des Einzelnen überein, folgt jeder, der dem Staat gehorcht, nur seinem eigenen Willen."}, {"teil": "Rousseau", "nach": "S. 60-61", "f": "Wie begründet Rousseau im Text seine Forderung, die gesellschaftlichen Güter gleich zu verteilen?", "a": [["Nach dem natürlichen Recht gehört alles Eigentum allen gemeinsam.", 0, null, "Von einem natürlichen Recht auf Gemeineigentum spricht Rousseau im Text nicht."], ["Unterschiedliche Interessen entstehen aus unterschiedlichen Besitzverhältnissen; bei gleichem Besitz gäbe es nur noch das gemeinsame Interesse an der Sicherung des Lebens, sodass der allgemeine Wille herrschen kann.", 1], ["Armut treibt die Menschen zu Verbrechen und gefährdet so den Frieden.", 0, null, "Rousseaus Begründung ist politisch, nicht kriminologisch: Es geht um die Einheit des Willens."], ["Nur Besitzlose sind frei von Egoismus.", 0]], "e": "Locke wendet ein, dass bei Abstimmungen kein einheitlicher Wille herauskommt, weil die Interessen verschieden sind: Ein Fabrikant hat andere als ein Arbeiter. Rousseau gibt ihm recht: Der allgemeine Wille ist nicht die Summe der Einzelwillen. Wenn die Interessenunterschiede aus unterschiedlichem Besitz stammen, müssen alle das Gleiche besitzen. Dann bleibt nur das gemeinsame Interesse an der Sicherung des Lebens, und der allgemeine Wille kann herrschen."}, {"typ": "offen", "teil": "Zusatzaufgabe", "nach": "S. 52-62", "f": "Das Streitgespräch vereinfacht die Positionen an mehreren Stellen. Wähle eine Stelle aus und erläutere, worin die Vereinfachung besteht.", "m": "Mögliche Stellen: Hobbes nennt die Menschen pauschal „Egoisten“ und spricht von seinem „pessimistischen Menschenbild“ (S. 54); im Fachwissen betont Hobbes dagegen, dass nicht alle Menschen böse sind, sondern dass auch Friedliche vorbeugen müssen, weil man nicht erkennt, wer angreift. „Homo homini lupus“ wird als Hobbes-Formel ausgegeben. Rousseau fordert im Text die „direkte Befragung aller Bürger bei allen politischen Beschlüssen“ (S. 60), obwohl er Gesetzgebung und Regierung unterscheidet: Das Volk gibt die Gesetze, ausführen kann sie eine Regierung. Aus Rousseaus Forderung, dass niemand so reich sein soll, einen anderen kaufen zu können, und niemand so arm, sich verkaufen zu müssen, wird im Text eine „Gleichverteilung der Güter“ (S. 61). Locke vertritt im Text die Gewaltenteilung (S. 58), obwohl bei Locke die Legislative die höchste Gewalt ist und die unabhängige Judikative erst bei Montesquieu kommt."}]}, {"id": "pp-macht", "tf": "PP", "gruppe": "Macht und Recht", "kapitel": "Macht und Gewalt", "titel": "Macht und Gewalt", "sub": "Mittel der Macht oder ihr Gegenteil?", "kurse": ["4"], "fragen": [{"teil": "Teil A · Weber", "nach": "Teil A, Abschnitt „Macht ist ‚amorph‘“", "f": "Warum nennt Weber Macht „soziologisch amorph“?", "a": [["Weil jede Grundlage zählt, ob Kraft, List, Geld, Charme oder Waffen, und Macht deshalb viele Formen annimmt.", 1], ["Weil Macht nur entsteht, wo Menschen sich zusammenschließen, und mit der Gruppe wieder zerfällt.", 0, "Arendt", "Das ist Arendts Machtbegriff. Für Weber kann auch ein Einzelner Macht haben, etwa eine Erpresserin über ihr Opfer."], ["Weil Macht auf dem Glauben an Tradition, Charisma oder Legalität beruht und sich mit ihm ändert.", 0, null, "Das ist der Legitimitätsglaube, und der trägt bei Weber die Herrschaft, nicht die Macht im weiten Sinn."], ["Weil Macht vom unberechenbaren Glück abhängt, das etwa die Hälfte unserer Handlungen regiert.", 0, "Machiavelli", null]], "e": "Weber definiert: „Macht bedeutet jede Chance, innerhalb einer sozialen Beziehung den eigenen Willen auch gegen Widerstreben durchzusetzen, gleichviel worauf diese Chance beruht.“ Entscheidend sind die letzten Worte: Ein Lehrer, eine Erpresserin und ein Konzern haben alle Macht. Weil der Begriff so gestaltlos ist, auch Gewalt einschließt und damit für die Politik zu weit ist, braucht Weber einen zweiten, präziseren Begriff: Herrschaft."}, {"teil": "Teil A · Weber", "nach": "Teil A, Abschnitt „Herrschaft: Gehorsam finden“", "f": "Der Schiedsrichter zeigt Rot, und der Spieler verlässt wütend den Platz. Was liegt nach Weber vor?", "a": [["Herrschaft: Ein Befehl findet bei einer bestimmten Person Gehorsam, weil sie die Regeln anerkennt.", 1], ["Bloße Macht: Der Schiedsrichter setzt sich gegen den Widerstand des Spielers durch, wie ein Räuber mit Messer.", 0, null, "Der Spieler wird nicht gezwungen, er geht von sich aus. Gehorsam aus Anerkennung ist das Kennzeichen der Herrschaft."], ["Einfluss: Der Schiedsrichter gibt keinen Befehl, und niemand ist verpflichtet, ihm zu folgen.", 0, null, "So beschreibt das Kapitel den Fall der Influencerin. Die Rote Karte ist dagegen ein Befehl an eine bestimmte Person."], ["Charismatische Herrschaft: Der Spieler folgt der außergewöhnlichen Persönlichkeit des Schiedsrichters.", 0, null, null]], "e": "Herrschaft ist bei Weber „die Chance, für einen Befehl bestimmten Inhalts bei angebbaren Personen Gehorsam zu finden“. Wer Macht hat, setzt sich durch, notfalls gegen Widerstand; wer herrscht, findet Gehorsam, die anderen folgen von sich aus. Der Spieler gehorcht, obwohl er wütend ist, weil er die Regeln anerkennt. Ebenso hält die Fahrerin bei der Verkehrskontrolle an, ohne dass die Polizistin sie aus dem Wagen zerren muss."}, {"teil": "Teil A · Weber", "nach": "Teil A, Abschnitt „Drei Gründe zu gehorchen“", "f": "Ordne Webers Herrschaftstypen zu: ein Dorfältester, ein Finanzamt, ein Revolutionsführer.", "a": [["traditional, legal, charismatisch", 1], ["charismatisch, legal, traditional", 0, null, "Dem Dorfältesten folgt man, weil es „schon immer so war“; außergewöhnliches Vertrauen in eine Person kennzeichnet dagegen den Revolutionsführer."], ["traditional, charismatisch, legal", 0, null, null], ["legal, traditional, charismatisch", 0, null, null]], "e": "Dauerhafte Herrschaft beruht auf dem Legitimitätsglauben. Je nach Grund unterscheidet Weber drei reine Typen (Idealtypen): traditionale Herrschaft (Glaube an die Heiligkeit alter Traditionen, etwa Patriarch oder Erbmonarchie), charismatische Herrschaft (Vertrauen in eine außergewöhnliche Person, etwa Napoleon oder Gandhi) und legale (bürokratische) Herrschaft (Glaube an korrekt gesetzte Gesetze und Zuständigkeiten, etwa Finanzamt oder Polizei). In der Wirklichkeit kommen die Typen fast nie rein vor; sie sind Werkzeuge der Beschreibung."}, {"teil": "Teil A · Weber", "nach": "Teil A, Abschnitt „Achtung: zwei Bedeutungen von ‚legitim‘“", "f": "Kann eine Diktatur im Sinne Webers legitim sein?", "a": [["Ja, solange viele an sie glauben, denn Weber meint mit legitim das, was als legitim angesehen wird.", 1], ["Nein, denn legitim ist nur eine Herrschaft, die sich moralisch rechtfertigen lässt.", 0, null, "Das ist die normative Bedeutung. Ob eine Herrschaft moralisch gerechtfertigt ist, lässt Weber als Wissenschaftler bewusst offen."], ["Nein, denn Gewalt kann zwar gerechtfertigt, aber nie legitim sein.", 0, "Arendt", "Diese Unterscheidung zwischen legitim und gerechtfertigt stammt von Arendt, nicht von Weber."], ["Ja, aber nur, wenn sie ihre Macht aus der Zustimmung eines Gesellschaftsvertrags ableitet.", 0, null, null]], "e": "Weber meint die empirische Legitimität: das, woran die Beherrschten tatsächlich glauben. Die normative Legitimität, also die moralische Rechtfertigung, ist die Frage der Vertragstheorien und des Kapitels „Recht und Gerechtigkeit“. Genau hier liegt Webers Grenze: Eine Diktatur, an die viele glauben, ist für ihn genauso „legitim“ wie eine Demokratie. Kläre im Bac-Aufsatz deshalb immer, welche Bedeutung du meinst."}, {"teil": "Teil A · Weber", "nach": "Teil A, Abschnitt „Der Staat und das Gewaltmonopol“", "f": "Dein Fahrrad wird gestohlen, du erwischst den Dieb und bestrafst ihn selbst. Welcher Begriff Webers erklärt, warum das nicht erlaubt ist?", "a": [["Das Gewaltmonopol", 1], ["Die Staatsräson", 0, null, "Staatsräson heißt, dass das Wohl des Staates über der privaten Moral des Herrschers steht. Sie betrifft den Herrscher, nicht dich als Bürger."], ["Die charismatische Herrschaft", 0, null, null], ["Die amorphe Macht", 0, null, null]], "e": "In Politik als Beruf (1919) bestimmt Weber den modernen Staat als die Gemeinschaft, die in einem Gebiet „das Monopol legitimer physischer Gewaltsamkeit für sich (mit Erfolg) beansprucht“. Nur der Staat darf Gewalt anwenden oder erlauben, durch Polizei und Justiz. Wer den Dieb selbst bestraft, übt Selbstjustiz. Hier erkennst du Hobbes wieder: Der Leviathan ist das Gewaltmonopol in Reinform."}, {"teil": "Teil B · Arendt", "nach": "Teil B, Abschnitt „Macht entsteht, wo Menschen gemeinsam handeln“", "f": "Was heißt es nach Arendt, wenn man sagt, jemand „habe die Macht“?", "a": [["Eine Gruppe hat ihn ermächtigt, in ihrem Namen zu handeln; zerfällt sie, vergeht auch seine Macht.", 1], ["Er hat die Chance, seinen Willen auch gegen Widerstreben durchzusetzen, gleich worauf sie beruht.", 0, "Weber", "Das ist Webers Definition. Arendt hält genau diese Gleichsetzung von Durchsetzung und Macht für eine Verwechslung."], ["Er besitzt eine Eigenschaft, die ihn den anderen überlegen macht, etwa Kraft oder Klugheit.", 0, null, "Das nennt Arendt Stärke. Sie gehört einem Einzelnen und unterliegt der Macht der Vielen immer."], ["Er wird fraglos anerkannt, ohne zwingen oder mit Argumenten überzeugen zu müssen.", 0, null, null]], "e": "Arendt definiert: „Macht entspricht der menschlichen Fähigkeit, nicht nur zu handeln oder etwas zu tun, sondern sich mit anderen zusammenzuschließen und im Einvernehmen mit ihnen zu handeln.“ Macht hat deshalb nie ein Einzelner. Auch Institutionen und Gesetze haben Macht nur durch die Unterstützung des Volkes; fehlt sie, „erstarren und verfallen“ selbst die stolzesten Institutionen."}, {"teil": "Teil B · Arendt", "nach": "Teil B, Abschnitt „Stärke, Autorität, Gewalt“", "f": "Eine Lehrerin droht nur noch mit Strafarbeiten, und die Klasse lacht über sie. Was hat sie nach Arendt verloren?", "a": [["Ihre Autorität", 1], ["Ihre Stärke", 0, null, "Stärke ist eine Eigenschaft eines Einzelnen, etwa eines Boxweltmeisters oder eines robusten Schlosses. Um sie geht es hier nicht."], ["Ihre Gewalt", 0, null, null], ["Ihre Herrschaft", 0, "Weber", null]], "e": "Autorität ist für Arendt fraglose Anerkennung einer Person oder eines Amtes; sie braucht weder Zwang noch Überredung. Ihr gefährlichster Gegner ist die Verachtung, „am sichersten unterminiert“ wird sie durch Lachen. Wer drohen muss, hat sie schon verloren. Ebenso verliert ein Vater seine Autorität, wenn er das Kind schlägt (tyrannisch), aber auch, wenn er es mit Argumenten überzeugen will (demokratisch)."}, {"teil": "Teil B · Arendt", "nach": "Teil B, Abschnitt „Gewalt ist das Gegenteil von Macht“", "f": "Ein Regime lässt Panzer gegen Demonstrierende auffahren. Was zeigt das nach Arendt?", "a": [["Dass seine Macht schwindet, denn wo Gewalt absolut herrscht, fehlt Macht.", 1], ["Dass es viel Macht hat, denn Gewalt ist eine mögliche Grundlage der Macht.", 0, "Weber", "So kann man mit Weber argumentieren, für den Gewalt kein Gegensatz zur Macht ist. Arendt sieht in Gewalt gerade das Gegenteil."], ["Dass es klug handelt, denn ein Herrscher muss auch wie ein Löwe kämpfen können.", 0, "Machiavelli", null], ["Dass es legitim ist, solange die Soldaten noch an die Ordnung glauben.", 0, null, null]], "e": "Für Arendt sind Macht und Gewalt Gegensätze: Macht hängt von der Zahl ab, Gewalt stützt sich auf Werkzeuge. „Gewalt kann Macht vernichten; sie ist absolut außerstande, Macht zu erzeugen.“ Der Extremfall der Macht ist „Alle gegen Einen“, der der Gewalt „Einer gegen Alle“. Das Beispiel DDR 1989: Am 9. Oktober gingen die Sicherheitskräfte in Leipzig nicht gegen 70.000 Demonstrierende vor, einen Monat später fiel die Mauer. Das Regime brach zusammen, obwohl es noch alle Waffen besaß."}, {"teil": "Teil B · Arendt", "nach": "Teil B, Abschnitt „Legitim oder nur gerechtfertigt?“", "f": "Warum kann Gewalt nach Arendt höchstens gerechtfertigt, aber nie legitim sein?", "a": [["Legitimität beruft sich auf den gemeinsamen Anfang in der Vergangenheit, Gewalt nur auf einen Zweck in der Zukunft.", 1], ["Legitim ist, was die Beherrschten für rechtmäßig halten, und an bloße Gewalt glaubt auf Dauer niemand.", 0, null, "Das vermischt Arendt mit Webers empirischem Legitimitätsbegriff. Für Arendt stammt Legitimität aus dem gemeinsamen Anfang, nicht aus dem Glauben der Beherrschten."], ["Gewalt verstößt immer gegen die Moral, und legitim ist nur, was in jeder Hinsicht moralisch gut ist.", 0, null, "Arendt hält Gewalt durchaus für rechtfertigbar, etwa als Notwehr. Legitimität ist für sie eine Frage des Ursprungs."], ["Gewalt ist allein dem Staat vorbehalten, der sie in seinem Gebiet monopolisiert.", 0, "Weber", null]], "e": "Macht braucht Legitimität, und die stammt aus dem Moment, in dem Menschen sich zusammengeschlossen haben: Sie beruft sich auf die Vergangenheit. Gewalt kann nur durch einen Zweck in der Zukunft gerechtfertigt werden, etwa Notwehr, sie wird aber nie legitim. Deshalb zeigen ein Generalstreik oder die friedlichen Revolutionen von 1989 Macht ohne Gewalt."}, {"typ": "arg", "teil": "Teil C · Machiavelli", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Machiavellis Argument?", "zeilen": [["P1", "Es gibt eine Kluft zwischen dem, wie Menschen leben, und dem, wie sie leben sollten (Kap. 15)."], ["P2", null], ["K1", "Ein Herrscher, der sich behaupten will, muss lernen, nicht gut zu sein: gut und nicht gut handeln können, je nach Notwendigkeit, und den Schein der Tugend wahren."], ["K2", "Das Wohl des Staates steht über der privaten Moral des Herrschers. Maßstab ist der Erfolg, nicht die Tugend."]], "a": [["Wer in allem gut sein will, geht unter so vielen, die es nicht sind, zugrunde.", 1], ["Wer Gewalt einsetzt, verliert die Unterstützung der Vielen und damit seine Macht.", 0, "Arendt", "Das ist die neue P2 aus dem Minimal-Umbau. Mit ihr kippt die Konklusion: Wer Macht erhalten will, darf gerade nicht zur Gewalt greifen."], ["Der Zweck heiligt die Mittel, im politischen wie im privaten Leben.", 0, null, "Diesen Satz vertritt Machiavelli nicht als allgemeine Moral. Es geht nur um den Erhalt des Staates."], ["Herrschaft ist von Gott eingesetzt, und der Herrscher ist nur ihm verantwortlich.", 0, "Gottesgnadentum", null]], "e": "P2 ist die „weiche Stelle“ des Arguments. Machiavelli schreibt in Kap. 15: „Wer in allem gut sein will, muss notwendigerweise zugrunde gehen unter so vielen, die es nicht sind.“ Daraus folgt nicht, dass der Fürst böse sein soll: Er soll gut und nicht gut handeln können, je nach Notwendigkeit (necessità). Das ist politischer Realismus: Der Herrscher muss mit den Menschen arbeiten, wie sie sind."}, {"teil": "Teil C · Machiavelli", "nach": "Teil C, Abschnitt „Fuchs und Löwe“", "f": "Warum braucht der Fürst nach Machiavelli Fuchs und Löwe?", "a": [["Der Löwe schreckt die Wölfe ab, erkennt aber keine Fallen; der Fuchs erkennt sie, ist aber zu schwach.", 1], ["Der Fuchs steht für die Gesetze, mit denen Menschen kämpfen, der Löwe für die Gewalt der Tiere.", 0, null, "Beide Tiere gehören zur zweiten, tierischen Art zu kämpfen. Die Gesetze sind die menschliche Art, die oft nicht reicht."], ["Der Löwe sichert ihm die Liebe des Volkes, der Fuchs die Furcht seiner Gegner im Ausland.", 0, null, null], ["Der Fuchs verkörpert Fortuna, die man nicht beherrscht, der Löwe die Virtù des Herrschers.", 0, null, null]], "e": "In Kap. 18 nennt Machiavelli zwei Arten zu kämpfen: mit Gesetzen, wie es Menschen eigen ist, und mit Gewalt, wie Tiere es tun. Der Fürst braucht Stärke und List: „Man muss also Fuchs sein, um die Schlingen zu wittern, und Löwe, um die Wölfe zu erschrecken.“ Er muss sein Wort nicht halten, wenn es ihm schadet, soll aber mild, treu und fromm wirken. Die Menge urteilt nach dem Ergebnis."}, {"teil": "Teil C · Machiavelli", "nach": "Teil C, Abschnitt „Virtù und Fortuna“", "f": "Was meint Machiavelli mit Virtù?", "a": [["Politische Tüchtigkeit: Entschlossenheit, Klugheit, Stärke und die Fähigkeit, sich der Lage anzupassen.", 1], ["Die moralische Tugend, die einen guten Herrscher in der Tradition seit Platon auszeichnet.", 0, null, "Genau gegen diese Tradition wendet sich Machiavelli. Virtù ist keine moralische Tugend."], ["Das unberechenbare Schicksal, das etwa die Hälfte unserer Handlungen regiert wie ein reißender Fluss.", 0, null, "Das ist Fortuna, der Gegenbegriff zu Virtù."], ["Den Glauben der Beherrschten an die außergewöhnliche Persönlichkeit und das Vorbild ihres Führers.", 0, "Weber", null]], "e": "Virtù und Fortuna tragen Machiavellis Denken. Fortuna regiert etwa die Hälfte unserer Handlungen und gleicht einem reißenden Fluss; wer aber in ruhigen Zeiten Dämme und Deiche baut, kann ihre Wucht in einen Kanal leiten (Kap. 25). Fortuna bevorzugt den Entschlossenen. Zur Virtù gehört auch, die Gelegenheit (occasione) zu erkennen und zu ergreifen."}, {"teil": "Teil C · Machiavelli", "nach": "Teil C, Abschnitt „Was Machiavelli erklärt und wo er an Grenzen stößt“", "f": "Welcher Einwand trifft Machiavellis Berufung auf die Notwendigkeit am stärksten?", "a": [["Er nennt keine Grenze: Aus „muss können“ wird leicht „darf immer“.", 1], ["Er beschreibt nur, woran Menschen glauben, und fragt nicht, ob es gerecht ist.", 0, "Weber", "Das ist die Grenze Webers. Machiavelli fragt, was ein Herrscher tun muss, um sich zu behaupten."], ["Sein Machtbegriff weicht stark davon ab, was die meisten unter Macht verstehen.", 0, "Arendt", null], ["Er stellt die private Moral des Herrschers über das Wohl des Staates.", 0, null, "Umgekehrt: Bei Machiavelli steht das Wohl des Staates über der privaten Moral."]], "e": "Was für den Erhalt des Staates notwendig ist (necessità), ist bei Machiavelli erlaubt; Spätere nennen das Staatsräson. Wer aber entscheidet, wann die Notwendigkeit unmoralisches Handeln verlangt? Machiavelli nennt keine Grenze, die Trennung von Politik und Moral kann als Freibrief für Willkür dienen, und die Ausnahme droht zur Regel zu werden. Weitere Grenzen: enge Staatsziele und ein Menschenbild, das eine Vorentscheidung ist, keine Tatsache."}, {"typ": "offen", "teil": "Teil C · Machiavelli", "nach": "Teil C, Abschnitt „Die weiche Stelle: Machiavelli gegen Arendt“", "f": "Zeige, wie aus Machiavellis Argument mit einer neuen Prämisse Arendts Position wird. Was folgt daraus für den Streit zwischen beiden?", "m": "Machiavelli argumentiert: Zwischen dem, wie Menschen leben, und dem, wie sie leben sollten, klafft eine Lücke (P1). Wer in allem gut sein will, geht unter so vielen, die es nicht sind, zugrunde (P2). Also muss der Fürst lernen, nicht gut zu sein (K). Die weiche Stelle ist P2. Ersetzt man sie durch Arendts Gedanken „Wer Gewalt einsetzt, verliert die Unterstützung der Vielen und damit seine Macht“, dann kippt die Konklusion: Wer Macht erhalten will, darf gerade nicht zur Gewalt greifen, sondern muss Zustimmung und gemeinsames Handeln suchen. Mit einer einzigen Prämisse wird so aus Machiavelli Arendt. Daraus folgt, dass der Streit nicht in der Moral liegt, sondern im Machtbegriff: Für Machiavelli (wie für Weber) ist Gewalt ein Mittel der Macht, für Arendt ihr Gegenteil."}]}, {"id": "pp-recht", "tf": "PP", "gruppe": "Macht und Recht", "kapitel": "Recht und Gerechtigkeit", "titel": "Recht und Gerechtigkeit", "sub": "Ist das Legale auch das Gerechte?", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Antigone: legal oder legitim?“", "f": "Antigone bestattet ihren Bruder gegen Kreons Verbot und beruft sich auf die „ungeschriebenen Gesetze“ der Götter. Was behauptet sie damit?", "a": [["Kreons Verbot mag legal sein, ist aber nicht legitim, weil ein höherer Maßstab dagegensteht.", 1], ["Kreons Verbot ist legitim, aber nicht legal, weil er es nicht ordnungsgemäß erlassen hat.", 0, null, "Die Begriffe sind vertauscht. Legal heißt gesetzmäßig gesetzt, legitim heißt moralisch gerechtfertigt."], ["Kreons Verbot ist legal und legitim, sie selbst handelt aber aus einem privaten Interesse.", 0, null, null], ["Ein Gesetz gilt nur, wenn die erste, im Großen und Ganzen wirksame Verfassung es vorsieht.", 0, "Kelsen", null]], "e": "Ein Gesetz ist legal, wenn es nach den Regeln eines Staates gesetzt wurde; legitim ist, was sich moralisch rechtfertigen lässt. Das gesetzte Recht heißt positives Recht (lat. ponere, setzen). Antigone beruft sich auf Gesetze, die älter sind als jedes Gebot eines Herrschers, also auf etwas wie Naturrecht. Schon Augustinus fragt: Was sind Reiche ohne Gerechtigkeit anderes als große Räuberbanden?"}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Antigone: legal oder legitim?“", "f": "Was versteht man im Kapitel unter Naturrecht?", "a": [["Grundsätze, die unabhängig von jeder Setzung gelten, weil sie in der Natur des Menschen oder in der Vernunft gründen.", 1], ["Das Recht jedes Einzelnen, im Naturzustand alles zu tun, was seinem eigenen Überleben dient.", 0, "Hobbes", "So verwendet Hobbes das Wort (ius naturale, das „Recht auf alles“). Hier ist Naturrecht ein Maßstab über dem gesetzten Recht."], ["Das Recht, das ein Staat nach den Regeln seiner Verfassung tatsächlich gesetzt hat und durchsetzt.", 0, null, "Das ist die Definition des positiven Rechts, des Gegenbegriffs zum Naturrecht."], ["Das alte Gewohnheitsrecht eines Volkes, das schon vor den geschriebenen Gesetzen galt.", 0, null, null]], "e": "Naturrecht nennt man Grundsätze, die unabhängig von jeder Setzung gelten, weil sie in der Natur des Menschen oder in der Vernunft gründen. Sein Gegenbegriff ist das positive Recht, das ein Staat tatsächlich gesetzt hat. Wer wie Strauss oder Radbruch ein Gesetz an einem Maßstab über dem Gesetz misst, argumentiert naturrechtlich. Radbruch verweist für solche Grundsätze auf die Erklärungen der Menschen- und Bürgerrechte."}, {"typ": "arg", "teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Kelsens Argument?", "zeilen": [["P1", null], ["P2", "Es gibt viele, einander widersprechende Gerechtigkeitsvorstellungen. Würde man die Geltung an eine davon knüpfen, wäre jede Rechtsordnung nach irgendeinem Maßstab ungültig."], ["K", "Also gilt Recht kraft einer vorausgesetzten Grundnorm: Man soll sich so verhalten, wie es die erste, im Großen und Ganzen wirksame Verfassung vorschreibt."]], "a": [["Absolute Werte lassen sich wissenschaftlich nicht erkennen, nur relative.", 1], ["Es gibt keine Gerechtigkeit, also schuldet man jedem gültigen Gesetz Gehorsam.", 0, null, "Das ist die verbreitete Fehldeutung. Kelsen leugnet nicht, dass es Gerechtigkeit gibt, und fordert keinen absoluten Gehorsam."], ["Wer ein Gesetz ungerecht nennt, setzt einen Maßstab über dem Gesetz voraus.", 0, "Strauss", "Das ist Strauss' erste Prämisse, mit der er Kelsen gerade angreift."], ["Rohe Durchsetzung ist teuer und brüchig, dauerhafter Gehorsam braucht Glauben.", 0, "Weber", null]], "e": "P1 ist Kelsens Wertrelativismus: Die Wissenschaft kann feststellen, was ist, aber nicht beweisen, welcher Wert absolut gilt. Ob etwa ein Steuergesetz gerecht ist, hängt vom Maßstab ab. Genau hier setzt Strauss an: Der Streit zwischen beiden liegt bei der Frage, ob Gerechtigkeit erkennbar ist. Riezler ergänzt den praktischen Vorteil von Kelsens Sicht: Rechtssicherheit."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Die Grundnorm und die Rechtssicherheit“", "f": "Worauf beruht nach Kelsen letztlich die Geltung einer Rechtsordnung?", "a": [["Auf einer vorausgesetzten Grundnorm: Man soll der ersten, im Großen und Ganzen wirksamen Verfassung folgen.", 1], ["Auf ihrer Übereinstimmung mit einem überpositiven Maßstab, den die Vernunft erkennen kann.", 0, "Strauss", "Das ist die naturrechtliche Antwort. Kelsen knüpft die Geltung gerade nicht an einen Gerechtigkeitsmaßstab."], ["Auf dem Glauben der Beherrschten, dass die Ordnung korrekt gesetzt ist und gehorcht werden soll.", 0, "Weber", "Das ist Webers legale Herrschaft, eine Beschreibung, warum Menschen gehorchen. Kelsen fragt, warum eine Norm gilt."], ["Auf der stillschweigenden Zustimmung aller Bürger, die im Land bleiben, statt auszuwandern.", 0, "Sokrates", null]], "e": "Kelsen denkt die Geltung als Kette: Ein Bußgeldbescheid gilt, weil ein Gesetz ihn erlaubt; das Gesetz gilt, weil es nach der Verfassung beschlossen wurde. Am Ende der Kette steht eine Grundnorm, die nirgends geschrieben steht, sondern im Rechtsdenken vorausgesetzt wird. Der Zusatz „im Großen und Ganzen wirksam“ ist wichtig: Eine Verfassung, an die sich niemand hält, ist keine Grundlage, und nach einer erfolgreichen Revolution gilt eine neue."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Ein häufiges Missverständnis“", "f": "Was ist falsch an dem Satz „Kelsen meint, man müsse jedem Gesetz gehorchen“?", "a": [["Kelsen trennt Geltung und Gehorsamspflicht: Ein Gesetz kann gelten und doch moralisch nicht befolgt werden sollen.", 1], ["Nichts, denn für Kelsen ist jedes geltende Gesetz zugleich auch gerecht und damit ver

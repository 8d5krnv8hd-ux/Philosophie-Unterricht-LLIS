bindlich.", 0, null, "Kelsen nennt ein Gesetz ausdrücklich geltend und zugleich möglicherweise zutiefst ungerecht."], ["Kelsen meint, man müsse nur Gesetzen gehorchen, die mit dem Naturrecht übereinstimmen.", 0, "Strauss", null], ["Kelsen meint, ein Gesetz verliere seine Geltung, sobald es ein unerträgliches Maß erreicht.", 0, "Radbruch", "Das ist Radbruchs Unerträglichkeitsformel, keine positivistische These."]], "e": "Kelsen trennt zwei Fragen: Gilt dieses Gesetz? Und ist es gerecht? Ein Positivist kann ein Gesetz geltend und zugleich zutiefst ungerecht nennen und sogar sagen, man solle ihm moralisch nicht folgen; das ist für ihn nur keine Frage der Rechtswissenschaft mehr. Er schreibt selbst, eine positivistische Rechtslehre behaupte nicht, „dass es keine Gerechtigkeit gebe“. Kelsen wurde 1933 von seinem Kölner Lehrstuhl vertrieben; ein Freund staatlicher Willkür war er nicht."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Strauss: der Maßstab über dem Gesetz“", "k": "4", "f": "Wozu dient bei Strauss das Kannibalen-Beispiel?", "a": [["Ist das Ideal der eigenen Gesellschaft der höchste Maßstab, ließe sich nicht einmal Kannibalismus kritisieren.", 1], ["Es zeigt, dass alle Völker trotz verschiedener Sitten dieselben Grundsätze teilen, also ein Naturrecht.", 0, null, "Strauss beweist nicht, dass es ein Naturrecht gibt. Das Beispiel widerlegt nur eine Annahme durch ihre absurde Folge."], ["Es zeigt, dass Gerechtigkeit nicht erkennbar ist, weil jede Gesellschaft andere Ideale für gut hält.", 0, "Kelsen", "Das ist Kelsens Wertrelativismus, den Strauss mit dem Beispiel angreifen will."], ["Es berichtet von Völkern, deren Recht ohne Staat und ohne geschriebene Gesetze funktionierte.", 0, null, null]], "e": "Das Beispiel ist ein Gedankenexperiment, kein Bericht: eine reductio ad absurdum. Wer ein Gesetz „ungerecht“ nennt, setzt einen Maßstab über dem positiven Recht voraus. Wäre dieser Maßstab nur das Ideal der eigenen Gesellschaft, hätten alle Gesellschaften gleich gute Ideale, auch Kannibalen. Strauss: „Wenn es keinen höheren Maßstab gibt als das Ideal unserer Gesellschaft, dann sind wir vollkommen außerstande, kritischen Abstand von diesem Ideal zu gewinnen.“ Die Vielfalt der Rechtsvorstellungen widerlegt das Naturrecht nicht, sie ist der Anlass, es zu suchen."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Radbruch: die Grenze des Unerträglichen“", "f": "Welche Aussage gibt die Regel und die erste Ausnahme der Radbruchschen Formel korrekt wieder?", "a": [["Gesetztes Recht hat Vorrang, auch wenn es ungerecht ist, außer der Widerspruch zur Gerechtigkeit wird unerträglich.", 1], ["Ein Gesetz gilt nur, wenn es mit dem Naturrecht übereinstimmt; jede Ungerechtigkeit macht es ungültig.", 0, null, "Dann gäbe es keine Rechtssicherheit mehr. Radbruch lässt auch ungerechtes Recht in der Regel gelten."], ["Gesetztes Recht gilt immer; ob es gerecht ist, bleibt eine Frage außerhalb der Rechtswissenschaft.", 0, "Kelsen", null], ["Jeder Bürger darf ein Gesetz brechen, das er nach seinem Gewissen für unerträglich ungerecht hält.", 0, null, "Radbruchs Formel richtet sich an Richter, nicht an das private Gewissen des Einzelnen."]], "e": "Recht soll für Radbruch drei Werte verwirklichen: Rechtssicherheit, Zweckmäßigkeit und Gerechtigkeit. Rechtssicherheit bringt jedes Gesetz schon mit, deshalb ist ein schlechtes Gesetz meist besser als keins. Die Unerträglichkeitsformel: Erreicht der Widerspruch zur Gerechtigkeit ein „unerträgliches Maß“, muss das Gesetz als „unrichtiges Recht“ weichen. Radbruch gibt selbst zu, dass sich diese Grenze nicht scharf ziehen lässt."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Radbruch: die Grenze des Unerträglichen“", "f": "Die Nürnberger Rassengesetze von 1935 behandelten Menschen als „Untermenschen“. Was sagt Radbruch über solche Gesetze?", "a": [["Sie sind überhaupt kein Recht, weil die Gleichheit bei ihrer Setzung bewusst verleugnet wurde.", 1], ["Sie bleiben Recht, bis ein Richter sie im Einzelfall als unrichtiges Recht weichen lässt.", 0, null, "Das wäre die erste Ausnahme. Für bewusst verleugnete Gleichheit gilt die schärfere zweite: Das Gesetz ist gar kein Recht."], ["Sie gelten weiter, weil ein schlechtes Gesetz immer noch besser ist als gar keins.", 0, null, null], ["Sie gelten, solange die Verfassung, auf der sie beruhen, im Großen und Ganzen wirksam ist.", 0, "Kelsen", null]], "e": "Die zweite Ausnahme (Verleugnungsformel) ist schärfer als die erste: Wo die Gleichheit, der Kern der Gerechtigkeit, bei der Gesetzgebung bewusst verleugnet wird, ist das Gesetz nicht nur „unrichtiges Recht“, es entbehrt überhaupt der Rechtsnatur. Während Radbruch bei der Unerträglichkeit zugibt, dass sich keine scharfe Linie ziehen lässt, kann diese Grenze „mit aller Schärfe“ gezogen werden."}, {"teil": "Teil A · Gilt ungerechtes Recht?", "nach": "Teil A, Abschnitt „Die Formel im Fall der Grenzsoldaten“", "k": "4", "f": "Wie entschied der Bundesgerichtshof 1992 im Fall der Grenzsoldaten?", "a": [["§ 27 des DDR-Grenzgesetzes musste, so wie die DDR ihn anwandte, als unrichtiges Recht weichen.", 1], ["Die Soldaten wurden freigesprochen, weil § 27 zur Tatzeit geltendes DDR-Recht war.", 0, null, "So könnte man mit Kelsen argumentieren. Das Gericht bestätigte aber die Verurteilung."], ["Die Soldaten wurden wegen Mordes zu langen Haftstrafen ohne Bewährung verurteilt.", 0, null, null], ["Das Verfahren wurde eingestellt, weil das Rückwirkungsverbot jede Strafe ausschloss.", 0, null, "Das Bundesverfassungsgericht entschied 1996, dass das Rückwirkungsverbot nicht schützt, wenn ein Staat schwerstes Unrecht ausdrücklich erlaubt."]], "e": "Der BGH wandte Radbruchs Unerträglichkeitsformel an: Ein Rechtfertigungsgrund, der die Grenzsicherung über das Leben stellt, ist ein offensichtlich grober Verstoß gegen elementare Gebote der Gerechtigkeit und Menschlichkeit. Der stärkste Einwand war das Rückwirkungsverbot (Art. 103 Abs. 2 GG). Dass die Soldaten nur Bewährungsstrafen wegen Totschlags bekamen, nimmt ihn trotzdem ernst: Sie hatten Befehle und waren in einem System aufgewachsen, das ihnen die Schüsse als Pflicht darstellte."}, {"teil": "Teil B · Darf ich ein Gesetz brechen?", "nach": "Teil B, Abschnitt „Gleichheitsgebot und Trittbrettfahrer“", "k": "4", "f": "Hoerster begründet eine moralische Pflicht zum Rechtsgehorsam. Welche seiner Prämissen trifft auf Rosa Parks nicht zu?", "a": [["Die Vorteile der Rechtsordnung überwiegen für jeden die Opfer, die sie verlangt.", 1], ["Eine Handlung kann falsch sein, wenn sie schadet, sobald alle sie tun.", 0, null, "Diese Prämisse bleibt unberührt; sie wird mit den Beispielen Wahl und Berghütte belegt."], ["Jeder Bürger durfte jederzeit mit seiner Habe auswandern.", 0, "Sokrates", null], ["Absolute Werte lassen sich wissenschaftlich nicht erkennen.", 0, "Kelsen", null]], "e": "Hoerster argumentiert: Jeder profitiert von der Rechtsordnung, die Vorteile überwiegen die Opfer, und sie besteht nur, weil die meisten gehorchen. Daraus folgt das Gleichheitsgebot: Wer erwartet, dass andere dem Recht gehorchen, muss es selbst tun, sonst ist er ein Trittbrettfahrer. Die Schwachstelle ist diese zweite Prämisse: Für einen Sklaven in Amerika um 1850 oder für Rosa Parks im Bus von Montgomery überwogen die Vorteile gerade nicht. Hoerster setzt also eine im Ganzen gerechte Ordnung voraus."}, {"teil": "Teil B · Darf ich ein Gesetz brechen?", "nach": "Teil B, Abschnitt „Thoreau: das Gewissen über dem Gesetz“", "f": "Thoreau und Habermas rechtfertigen beide den Bruch eines Gesetzes. Worauf beruft sich Habermas, anders als Thoreau?", "a": [["Auf die für alle einsichtigen Prinzipien der Verfassung.", 1], ["Auf das eigene Gewissen, das einem höheren Gesetz folgt.", 0, "Thoreau", "Das ist Thoreaus Berufung. Habermas lässt gerade keine Privatmoral und keinen privilegierten Zugang zur Wahrheit gelten."], ["Auf das Recht des Einzelnen, sein Leben zu verteidigen.", 0, "Hobbes", null], ["Auf das Recht des Volkes, eine neue Legislative einzusetzen.", 0, "Locke", null]], "e": "Thoreau weigerte sich, die Kopfsteuer zu zahlen, weil er einen Staat, der Sklaverei duldete und Krieg gegen Mexiko führte, nicht mitfinanzieren wollte. Über dem Gesetz steht für ihn das Gewissen: „Unter einer Regierung, die irgendjemanden unrechtmäßig einsperrt, ist das Gefängnis der angemessene Platz für einen gerechten Menschen.“ Habermas dagegen verlangt, dass ziviler Ungehorsam sich auf Prinzipien beruft, die alle teilen können. Der Einwand gegen Thoreau: Wenn jeder nur seinem Gewissen folgt, fehlt jede Grenze, und auch ein Gewissen kann irren."}, {"teil": "Teil B · Darf ich ein Gesetz brechen?", "nach": "Teil B, Abschnitt „Warum die Demokratie ihn braucht“", "f": "Eine angekündigte Straßenblockade für den Klimaschutz und eine Demonstration ohne Maske gegen Corona-Maßnahmen erfüllen beide alle Merkmale von Habermas. Was folgt daraus?", "a": [["Die Kriterien prüfen nur die Form; ob die Regel gegen für alle einsichtige Prinzipien verstößt, entscheiden sie nicht.", 1], ["Nur die Klimablockade ist ziviler Ungehorsam, weil allein ihr Anliegen von der Mehrheit geteilt wird.", 0, null, "Nach denselben Kriterien muss man beide gleich beurteilen. Ein Unterschied darf nicht davon abhängen, ob man das Ziel teilt."], ["Beide sind Widerstand, weil sie der Rechtsordnung im Ganzen die Legitimität absprechen.", 0, null, "Widerstand richtet sich gegen einen Unrechtsstaat. Beide Proteste erkennen die Rechtsordnung im Ganzen an."], ["Beide sind kriminell, weil jeder Gesetzesbruch in der Demokratie die Ordnung gefährdet.", 0, null, null]], "e": "Habermas übernimmt Rawls' Definition: Ziviler Ungehorsam ist öffentlich, gewaltlos, gewissensbestimmt, aber gesetzwidrig und soll eine Änderung von Gesetzen oder Politik herbeiführen. Alle Merkmale folgen aus dem Ziel, dass die Mehrheit eine Entscheidung überdenken soll: moralisch begründet, öffentlich angekündigt, nur einzelne Normen verletzend, bereit, die Strafe anzunehmen, symbolisch und gewaltfrei, nur im intakten Rechtsstaat. Diese Kriterien betreffen die Form des Protests. Der Streit verschiebt sich deshalb auf die Frage, ob die kritisierte Regelung wirklich illegitim ist."}, {"teil": "Teil C · Und im Unrechtsstaat?", "nach": "Teil C, Abschnitt „Ziviler Ungehorsam oder Widerstand?“", "f": "Die Studierenden der Weißen Rose verteilten 1943 heimlich Flugblätter. Warum spricht man hier von Widerstand und nicht von zivilem Ungehorsam?", "a": [["Im Unrechtsstaat gab es keine Mehrheit, die zuhört; sie handelten verdeckt gegen eine Ordnung ohne Legitimität.", 1], ["Sie brachen ein Gesetz, und ziviler Ungehorsam bleibt immer im Rahmen der geltenden Gesetze.", 0, null, "Auch ziviler Ungehorsam ist gesetzwidrig. Der Unterschied liegt im Rahmen: Der NS-Staat ließ keine Appelle an die Mehrheit zu und hatte seine Legitimität verloren."], ["Sie handelten aus Eigeninteresse und nicht aus moralischen Gründen, die andere überzeugen können.", 0, null, null], ["Sie beriefen sich auf das Widerstandsrecht aus Art. 20 Abs. 4 des Grundgesetzes.", 0, null, "Das Widerstandsrecht steht erst seit 1968 im Grundgesetz."]], "e": "Ziviler Ungehorsam setzt einen Staat voraus, der zuhört. Die Weiße Rose konnte ihre Flugblätter nicht ankündigen und keine Strafe „annehmen“, um die Mehrheit zum Nachdenken zu bringen; die Studierenden wurden hingerichtet. Widerstand erkennt die Ordnung nicht mehr an, handelt auch verdeckt und kann im äußersten Fall Gewalt einschließen, wie beim Attentat vom 20. Juli 1944. Spaemann nennt drei Kennzeichen eines solchen Staates: Beseitigung der Redefreiheit, Verbot der Auswanderung, gesetzliche Unmöglichkeit, Unrecht auf rechtlichem Weg abzuschaffen."}, {"typ": "offen", "teil": "Teil B · Darf ich ein Gesetz brechen?", "nach": "Teil B, Abschnitt „Warum die Demokratie ihn braucht“", "k": "4", "f": "Ist jemand, der zivilen Ungehorsam im Sinne von Habermas leistet, ein Trittbrettfahrer im Sinne Hoersters? Begründe.", "m": "Für Hoerster ist ein Trittbrettfahrer, wer die Vorteile der Rechtsordnung genießt, die andere durch ihren Gehorsam erst möglich machen, sich selbst aber vom Gehorsam ausnimmt. Daraus folgt sein Gleichheitsgebot: Wer erwartet, dass andere dem Recht gehorchen, muss es selbst tun. Ziviler Ungehorsam nach Habermas ist aber öffentlich und angekündigt, verletzt nur einzelne Normen und erkennt die Rechtsordnung im Ganzen an. Vor allem steht der Handelnde für die rechtlichen Folgen ein und nimmt die Strafe an. Damit genießt er keine Vorteile heimlich auf Kosten anderer, sondern appelliert offen an die Mehrheit, ihre Entscheidung zu überdenken. Er ist also kein Trittbrettfahrer im Sinne Hoersters. Hoerster könnte entgegnen, dass auch ein offener Regelbruch die Ordnung schwächt, wenn alle so handeln. Seine Pflicht setzt aber eine im Ganzen gerechte Ordnung voraus, und gerade das bestreitet der Ungehorsame für die kritisierte Regel."}]}, {"id": "pp-menschenrechte", "tf": "PP", "gruppe": "Rechte und Gerechtigkeit", "kapitel": "Menschenrechte", "titel": "Menschenrechte", "sub": "Worauf gründen Rechte für alle?", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Die klassische Antwort", "nach": "Teil A, Abschnitt „Die klassische Antwort“", "f": "Wie begründet die Allgemeine Erklärung der Menschenrechte (1948) in Art. 1 die Menschenrechte?", "a": [["Mit dem Menschsein selbst: Alle sind frei und gleich an Würde und Rechten geboren und mit Vernunft begabt.", 1], ["Mit der Zugehörigkeit zu einer Gemeinschaft, in der man nach Handlungen und Meinungen beurteilt wird.", 0, "Arendt", "Das ist Arendts Gegenvorschlag. Sie kritisiert gerade die Begründung im bloßen Menschsein."], ["Mit den Voraussetzungen jeder ernsthaften Diskussion zwischen Menschen verschiedener Kulturen.", 0, "Habermas", null], ["Mit der Staatsangehörigkeit, durch die jeder Staat seinen Bürgern ihre Rechte erst verleiht.", 0, null, "Nach der klassischen Antwort bestehen Menschenrechte vor jedem Staat. Kein Staat verleiht sie, er muss sie nur achten."]], "e": "Art. 1 lautet: „Alle Menschen sind frei und gleich an Würde und Rechten geboren. Sie sind mit Vernunft und Gewissen begabt.“ Dahinter steht die Tradition von Naturrecht und Kant: Jeder Mensch hat Würde, weil er ein vernünftiges, sich selbst bestimmendes Wesen ist. Daraus folgen Rechte, die universal (für alle), gleich (für alle in gleichem Maß) und unteilbar sind (man kann nicht einige gewähren und andere verweigern)."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Arendts Erfahrung: die Staatenlosen“", "f": "Was nennt Arendt die „Aporie der Menschenrechte“?", "a": [["Gerade die Staatenlosen, die nur noch Menschen waren, verloren alle Rechte.", 1], ["Menschenrechte lassen sich durch kein Argument auf neutralen Prämissen begründen.", 0, "Rorty", "Das ist Rortys These. Arendt bestreitet nicht, dass man Menschenrechte begründen kann, sie kritisiert eine bestimmte Begründung."], ["Menschenrechte gelten moralisch für alle, rechtlich schützen sie aber nur Mitglieder einer Rechtsgemeinschaft.", 0, "Habermas", "Das ist Habermas' „Janusgesicht“. Er nimmt damit Arendts Problem auf, beschreibt aber eine Spannung, keinen Widerspruch."], ["Menschenrechte sind Rechte des egoistischen Menschen, der im anderen nur eine Schranke sieht.", 0, "Marx", null]], "e": "Aporie heißt Ausweglosigkeit, ein Problem ohne Lösung. Nach dem Ersten Weltkrieg bürgerten Staaten Millionen Menschen aus. Diese Staatenlosen waren genau das, was die Menschenrechte voraussetzen: nur noch Menschen, ohne politischen Status. Wenn Menschenrechte aus dem Menschsein folgen, hätten gerade sie geschützt sein müssen, und das Gegenteil trat ein. Arendt war selbst staatenlos: 1937 ausgebürgert, erst 1951 amerikanische Staatsbürgerin."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Drei Verluste“", "f": "Welche drei Verluste der Staatenlosen beschreibt Arendt?", "a": [["Heimat, Schutz einer Regierung, Zugehörigkeit zu einer Gemeinschaft", 1], ["Leben, Freiheit, Besitz", 0, "Locke", "Das sind die natürlichen Rechte, die bei Locke der Staat schützen soll. Arendt fragt, was den Staatenlosen tatsächlich verloren ging."], ["Heimat, Besitz, Recht auf freie Meinungsäußerung", 0, null, null], ["Arbeit, Familie, Staatsangehörigkeit", 0, null, null]], "e": "Erstens verloren sie die Heimat, den Ort, an dem man einen Platz in der Welt hat. Zweitens den Schutz einer Regierung: Wer zu keinem Staat gehört, fällt aus dem Netz der Verträge zwischen Staaten heraus und hört auf, eine juristische Person zu sein. Drittens, und das ist das Grundlegendste, die Zugehörigkeit zu einer Gemeinschaft, in der man nach seinen Handlungen und Meinungen beurteilt wird. Auch wenn man ihnen das Leben sichert, sind solche Menschen „politisch gesprochen, lebende Leichname“."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Drei Verluste“", "f": "Was war nach Arendt an der Lage der Staatenlosen historisch beispiellos?", "a": [["Nicht der Verlust der Heimat, sondern die Unmöglichkeit, eine neue zu finden.", 1], ["Dass Menschen zum ersten Mal in der Geschichte ihre Heimat verloren.", 0, null, "Den Verlust der Heimat hat es nach Arendt in der Geschichte oft gegeben. Neu war etwas anderes."], ["Dass es auf der Welt keinen Platz mehr für so viele Flüchtlinge gab.", 0, null, "Arendt betont: Es war kein Raumproblem, sondern eine Frage politischer Organisation."], ["Dass Staaten erstmals Verträge zum Schutz ihrer Bürger im Ausland schlossen.", 0, null, null]], "e": "Arendt schreibt: „Historisch beispiellos ist nicht der Verlust der Heimat, wohl aber die Unmöglichkeit, eine neue zu finden.“ Nach dem Ersten Weltkrieg kamen nicht mehr einzelne Verfolgte über die Grenze, sondern ganze Volksgruppen, und kein Land nahm sie auf. Das lag nicht am fehlenden Platz, sondern daran, wie die Welt politisch organisiert ist: als System von Nationalstaaten, in dem jeder Mensch einem Staat angehören muss, um geschützt zu sein."}, {"typ": "arg", "teil": "Teil A · Arendt", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Arendts Argument?", "zeilen": [["P1", "Menschenrechte sollen allein aus dem Menschsein folgen, unabhängig vom politischen Status."], ["P2", null], ["P3", "Sie verloren die Heimat, den Schutz einer Regierung und die Zugehörigkeit zu einer Gemeinschaft, in der man nach Handlungen und Meinungen beurteilt wird."], ["K", "Allen Rechten geht ein Recht voraus: das Recht, Rechte zu haben, also einer politischen Gemeinschaft anzugehören."]], "a": [["Die Staatenlosen des 20. Jahrhunderts waren nur noch Menschen, und gerade sie verloren alle Rechte.", 1], ["Jeder Mensch hat Würde, weil er ein vernünftiges, sich selbst bestimmendes Wesen ist.", 0, "Kant", "Das ist die klassische Begründung, die Arendt gerade in Frage stellt."], ["Dass alle Menschen dazugehören, lässt sich durch kein Argument auf neutralen Prämissen begründen.", 0, "Rorty", null], ["Jede Diskussion, die auf Verständigung zielt, setzt gegenseitige Anerkennung voraus.", 0, "Habermas", null]], "e": "P2 ist der Erfahrungsbefund, an dem die klassische Begründung scheitert: Die Staatenlosen erfüllten genau die Bedingung, die P1 nennt, sie waren nur noch Menschen, und hatten trotzdem keine Rechte. P3 erklärt, was ihnen fehlte. Daraus schließt Arendt, dass Rechte Zugehörigkeit brauchen. Wichtig: Arendt ist nicht gegen die Menschenrechte, sie kritisiert ihre Begründung im bloßen Menschsein."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Das Recht, Rechte zu haben“", "f": "Was meint Arendt mit dem „Recht, Rechte zu haben“?", "a": [["Das Recht, einer politischen Gemeinschaft anzugehören, in der das, was man sagt und tut, zählt.", 1], ["Das Recht jedes Menschen, im Naturzustand alles zu tun, was seinem Überleben dient.", 0, "Hobbes", "Das ist Hobbes' „Recht auf alles“. Arendt meint ein politisches Recht auf Zugehörigkeit."], ["Das Recht, als Weltbürger direkt und ohne Staat in den Genuss der Menschenrechte zu kommen.", 0, "Habermas", "Das ist einer der zwei Wege, die Habermas als Fernziel nennt. Arendt selbst nennt keine solche Instanz."], ["Das Recht des Volkes, einer Regierung, die sein Vertrauen bricht, Widerstand zu leisten.", 0, "Locke", null]], "e": "Allen einzelnen Rechten geht ein Recht voraus: einer Gemeinschaft anzugehören, in der man nach seinen Handlungen und Meinungen beurteilt wird. Arendt erinnert an Aristoteles, der den Menschen als Lebewesen bestimmt, das sprechen kann, also gemeinsame Angelegenheiten durch Sprechen statt durch Gewalt regelt. Wer keiner Gemeinschaft angehört, verliert die Sprache nicht physisch, aber sein Wort hat kein Gewicht mehr. Die Grenze dieser Position: Arendt nennt keine Instanz, die das Recht auf Rechte garantieren könnte."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Der Fall Nasseri“", "f": "Mehran Karimi Nasseri lebte ab 1988 im Pariser Flughafen, hatte zu essen und war nicht in Gefahr. Was fehlte ihm nach Arendt vor allem?", "a": [["Ein Platz in einer Gemeinschaft, die ihn als Handelnden und Sprechenden anerkennt.", 1], ["Der Schutz seines Lebens, denn ohne gültige Papiere war er jederzeit bedroht.", 0, null, "Sein Leben war gesichert, er wurde von Angestellten und Reisenden versorgt. Genau darin zeigt sich Arendts Punkt."], ["Eine Erklärung, die ihm Rechte allein wegen seines Menschseins zuspricht.", 0, null, "Die gab es längst: Nasseri strandete vierzig Jahre nach der Allgemeinen Erklärung der Menschenrechte."], ["Eine Heimat, die vor ihm noch kein Mensch in der Geschichte verloren hatte.", 0, null, null]], "e": "Nasseri konnte nicht arbeiten, nicht reisen, nicht wählen, und jahrelang war kein Staat für ihn zuständig. Mit Arendt gesagt: Er verlor nicht das Leben, sondern den Platz in einer Gemeinschaft, also das Recht, Rechte zu haben. Für Arendts Problem steht vor allem das erste Jahrzehnt, denn als Belgien (1995) und Frankreich (1999) ihm Papiere anboten, verweigerte er die Unterschrift und blieb bis 2006 im Terminal."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Die Antwort der Staaten nach 1945“", "f": "Wie reagierte die Allgemeine Erklärung der Menschenrechte von 1948 auf die Erfahrung der Staatenlosen?", "a": [["Mit Art. 6 (Anerkennung als Rechtsperson) und Art. 15 (Recht auf Staatsangehörigkeit), begründet wieder mit dem Menschsein.", 1], ["Mit einem Weltgericht, vor dem jeder Staatenlose gegen jeden Staat der Erde auf seine Rechte klagen kann.", 0, null, "Eine solche weltweite Instanz gibt es nicht. Der Straßburger Gerichtshof ist regional und gilt nur für Staaten, die sich gebunden haben."], ["Mit einem Recht auf Zugehörigkeit, das sie anders als früher nicht mehr im Menschsein, sondern in der Gemeinschaft begründet.", 0, "Arendt", "Gerade das tut die AEMR nicht: Sie begründet wieder mit dem Menschsein, so wie Arendt es kritisiert."], ["Mit einer verbindlichen Pflicht aller Staaten, Staatenlose sofort einzubürgern und zu schützen.", 0, null, null]], "e": "Art. 6 garantiert jedem die Anerkennung als Rechtsperson, Art. 15 ein Recht auf Staatsangehörigkeit. Beide antworten auf Verluste, die Arendt beschreibt. Als Resolution der Vereinten Nationen ist die AEMR aber rechtlich nicht verbindlich, und begründet wird wieder mit dem Menschsein. Dass das Problem damit nicht gelöst war, zeigt der Fall Nasseri vierzig Jahre später."}, {"teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Die Antwort der Staaten nach 1945“", "k": "4", "f": "Wodurch wurden Menschenrechte rechtlich verbindlich?", "a": [["Erst durch Verträge wie die Europäische Menschenrechtskonvention (1950) und die UN-Pakte (1966).", 1], ["Schon durch die AEMR von 1948, die als Resolution der Vereinten Nationen alle Staaten bindet.", 0, null, "Als Resolution ist die AEMR gerade nicht rechtlich verbindlich."], ["Durch die Erklärung der Menschen- und Bürgerrechte von 1789, die bis heute weltweit gilt.", 0, null, null], ["Bis heute gar nicht, weil es keine Instanz gibt, vor der ein Einzelner klagen könnte.", 0, null, "Eine Instanz gibt es: Vor dem Gerichtshof in Straßburg kann jeder Mensch, auch ein Staatenloser, gegen einen Mitgliedstaat klagen."]], "e": "Verbindlich wurden Menschenrechte durch Verträge, an die sich Staaten gebunden haben. Vor dem Gerichtshof der Europäischen Menschenrechtskonvention in Straßburg kann jeder Mensch, auch ein Staatenloser, gegen einen Mitgliedstaat klagen. Eine Instanz gibt es also, aber nur regional und nur gegenüber Staaten, die sich gebunden haben. Arendts Lücke ist damit verkleinert, aber nicht geschlossen."}, {"teil": "Teil B · Habermas", "nach": "Teil B, Abschnitt „Das Janusgesicht“", "f": "Was meint Habermas mit dem „Janusgesicht“ der Menschenrechte?", "a": [["Moralisch gelten sie für alles, „was Menschenantlitz trägt“, rechtlich schützen sie nur Mitglieder einer Rechtsgemeinschaft.", 1], ["Sie sind eine westliche Idee und zugleich ein Machtinstrument, das anderen Kulturen aufgezwungen wird.", 0, null, "Das ist der Westen-Einwand, den Habermas ernst nimmt, aber nicht übernimmt."], ["Sie gründen zugleich in der Vernunft und im Gefühl, wie die Positionen von Kant und Hume zeigen.", 0, null, null], ["Gerade wer nur noch Mensch ist, verliert alle Rechte, obwohl sie allen Menschen zustehen sollen.", 0, "Arendt", "Das ist Arendts Aporie. Habermas nimmt sie auf, beschreibt aber eine Spannung zwischen Moral und Recht."]], "e": "Janus ist der römische Gott mit zwei Gesichtern. „Menschenrechte tragen ein Janusgesicht, das gleichzeitig der Moral und dem Recht zugewandt ist.“ Zwischen dem universalen Anspruch und der lokalen Durchsetzung, meist durch einen Nationalstaat, besteht eine Spannung. Habermas nennt zwei Wege: Alle Staaten werden echte demokratische Rechtsstaaten mit einem Recht auf Staatsangehörigkeit nach Wahl, oder jeder kommt als Weltbürger direkt in den Genuss der Menschenrechte (AEMR Art. 28). Beide Ziele liegen noch in weiter Ferne."}, {"teil": "Teil B · Habermas", "nach": "Teil B, Abschnitt „Was jede ehrliche Diskussion voraussetzt“", "k": "4", "f": "Worauf gründet Habermas Menschenrechte, die nicht nur im Westen überzeugen sollen?", "a": [["Auf dem, was jede ernsthafte Verständigung voraussetzt: gegenseitige Anerkennung und Perspektivenübernahme.", 1], ["Auf der Würde jedes vernünftigen, sich selbst bestimmenden Wesens, wie Naturrecht und Kant sie lehren.", 0, "Kant", "Das ist die klassische Begründung. Habermas setzt bei der Diskussion selbst an."], ["Auf der Erziehung der Gefühle durch Geschichten, Romane, Filme und Begegnungen mit Verachteten.", 0, "Rorty", null], ["Auf der Überlegenheit der westlichen Form, die sich in allen Kulturen durchsetzen soll.", 0, null, "Habermas räumt ausdrücklich ein, dass die westliche Form „nicht die einzige oder gar die beste“ sein muss."]], "e": "Wer mit Menschen anderer Kulturen ernsthaft darüber streitet, was gelten soll, setzt symmetrische Beziehungen voraus: gegenseitige Anerkennung, Perspektivenübernahme und die Bereitschaft, voneinander zu lernen (P1). Das wissen alle Beteiligten intuitiv, unabhängig von ihrer Kultur (P2). Darin steckt der Kern der Menschenrechte, und zugleich lässt sich ihr Missbrauch kritisieren, etwa wenn ein Staat sie nur auswählt, wenn es ihm nützt (K). Grenze: Wer gar nicht diskutieren will, wird von dieser Begründung nicht erreicht."}, {"teil": "Teil C · Rorty", "nach": "Teil C, Abschnitt „Kein Argument überzeugt den Rassisten“", "k": "4", "f": "Warum hält Rorty Argumente gegen Rassisten für wirkungslos?", "a": [["Ausgrenzung ist für sie tief empfunden und Teil ihrer Identität, kein bloßer Denkfehler.", 1], ["Rassisten sind unvernünftig und können einem Argument grundsätzlich nicht folgen.", 0, null, "Rorty nennt ihre Reaktion ausdrücklich „keineswegs irrational“."], ["Kants Forderung nach gleicher Achtung aller Menschen ist falsch und deshalb nicht begründbar.", 0, null, "Rorty findet Kants Forderung „ausgezeichnet“. Er bestreitet nur, dass man sie neutral begründen kann."], ["Argumente überzeugen nur, wenn eine staatliche Instanz sie durchsetzt.", 0, null, null]], "e": "Für Rorty hängt alles davon ab, wen wir als Mitmenschen und Teil unserer moralischen Gemeinschaft ansehen. Kants Forderung wurde „noch nie durch ein auf neutralen Prämissen beruhendes Argument begründet“, und das werde auch nicht gelingen. Wer anderen das Menschsein abspricht, fühlt sich gekränkt, wenn man ihn belehrt; die Identität vieler Menschen beruht darauf, wer sie nicht sind. Was hilft, ist die Erziehung der Gefühle („sentimentale Erziehung“): Geschichten und Begegnungen, die lehren, sich in Verachtete hineinzuversetzen."}, {"teil": "Teil C · Rorty", "nach": "Teil C, Abschnitt „Was Rorty erklärt und wo er an Grenzen stößt“", "k": "4", "f": "Welcher Einwand trifft Rortys Position am stärksten?", "a": [["Ohne Maßstab lässt sich die Erziehung der Gefühle nicht von Propaganda unterscheiden.", 1], ["Sie setzt voraus, dass alle Beteiligten verständigungsorientiert sprechen wollen.", 0, "Habermas", "Das ist die Grenze von Habermas' Begründung. Rorty setzt gerade nicht auf Diskussion."], ["Sie nennt keine Instanz, die das Recht, Rechte zu haben, garantieren könnte.", 0, "Arendt", null], ["Sie überzeugt nur, wer andere schon als vernünftige Wesen anerkennt.", 0, "Kant", null]], "e": "Auch Hass wird über Gefühle erzeugt. Wenn es keinen Maßstab gibt, der über den Gefühlen steht, kann man nicht sagen, warum eine Geschichte, die Mitgefühl weckt, besser ist als eine, die Verachtung schürt. Zudem können sich Gefühle wieder verengen, etwa in Krisen und Kriegen. Rortys Stärke bleibt sein Realismus: Er erklärt, wie Menschenrechtskultur tatsächlich wächst. Universalität ist für ihn kein Fundament, sondern ein Ziel."}, {"typ": "offen", "teil": "Teil A · Arendt", "nach": "Teil A, Abschnitt „Die Antwort der Staaten nach 1945“", "f": "Hat die Allgemeine Erklärung der Menschenrechte von 1948 Arendts Problem gelöst? Denk an den Fall Nasseri.", "m": "Arendt zeigt, dass gerade die Staatenlosen, die nur noch Menschen waren, alle Rechte verloren. Ihnen fehlte das Recht, Rechte zu haben, also die Zugehörigkeit zu einer politischen Gemeinschaft. Die AEMR reagiert auf diese Erfahrung: Art. 6 garantiert jedem die Anerkennung als Rechtsperson, Art. 15 ein Recht auf Staatsangehörigkeit. Gelöst ist das Problem damit nicht. Die AEMR begründet die Rechte wieder mit dem bloßen Menschsein, und als Resolution ist sie rechtlich nicht verbindlich. Es bleibt offen, wer einem Menschen, für den kein Staat zuständig ist, diese Rechte verschafft. Das zeigt der Fall Nasseri: Vierzig Jahre nach der Erklärung lebte er jahrelang im Pariser Flughafen, versorgt, aber ohne Platz in einer Gemeinschaft. Erst Verträge wie die Europäische Menschenrechtskonvention schaffen eine Instanz, doch nur regional und nur gegenüber Staaten, die sich gebunden haben."}]}, {"id": "pp-sozgerechtigkeit", "tf": "PP", "gruppe": "Rechte und Gerechtigkeit", "kapitel": "Soziale Gerechtigkeit", "titel": "Rawls und Nozick", "sub": "Wann ist die Verteilung in einer Gesellschaft gerecht?", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Gerechtigkeit betrifft die Grundstruktur“", "f": "Was ist für Rawls der erste Gegenstand der Gerechtigkeit?", "a": [["Die Grundstruktur: wie die wichtigsten Institutionen Rechte, Pflichten und die Früchte der Zusammenarbeit verteilen", 1], ["Das einzelne Gehalt: ob jede Person genau das bekommt, was sie durch ihre Leistung verdient hat", 0, null, "Rawls fragt ausdrücklich nicht, ob ein einzelnes Gehalt gerecht ist, sondern wie die Institutionen insgesamt verteilen."], ["Die Geschichte des Besitzes: ob jedes Besitztum gerecht angeeignet oder freiwillig übertragen wurde", 0, "Nozick", "Das ist Nozicks historische Frage. Rawls beurteilt die Regeln der Grundstruktur, nicht den Weg jedes einzelnen Besitzes."], ["Die Ordnung der Stände: ob jeder das Seine tut und sich nicht in fremde Angelegenheiten einmischt", 0, "Platon", null]], "e": "Zur Grundstruktur gehören etwa Verfassung, Wirtschaftsordnung, Steuer- und Bildungssystem. Sie bestimmen, was Menschen werden können und wie gut es ihnen geht. Rawls' Hauptwerk Eine Theorie der Gerechtigkeit (1971) beginnt deshalb mit dem Satz: „Die Gerechtigkeit ist die erste Tugend sozialer Institutionen, so wie die Wahrheit bei Gedankensystemen.“ Eine noch so gut funktionierende Ordnung muss geändert werden, wenn sie ungerecht ist."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Der Urzustand: ein neuer Gesellschaftsvertrag“", "f": "Was ist der Urzustand bei Rawls?", "a": [["Ein Gedankenexperiment: eine faire Ausgangslage, in der freie und gleiche Menschen Grundsätze der Gerechtigkeit wählen", 1], ["Ein historischer Zustand vor der Gründung der ersten Staaten, den man aus Quellen rekonstruieren kann", 0, null, "Wie Hobbes' Naturzustand ist der Urzustand kein historischer Zustand, sondern ein Gedankenexperiment."], ["Ein Zustand ohne allgemeine Macht, in dem jeder jeden bedroht und Vorbeugung am vernünftigsten ist", 0, "Hobbes", "Das ist Hobbes' Naturzustand. Rawls' Urzustand ist keine Kriegslage, sondern eine faire Verhandlungssituation."], ["Ein Zustand, in dem alle Güter gleich verteilt sind und niemand mehr besitzt als ein anderer", 0, null, null]], "e": "Rawls greift die Vertragstheorien von Hobbes, Locke und Rousseau auf und hebt sie „auf eine höhere Abstraktionsebene“. Gerecht sind die Grundsätze, auf die sich freie und gleiche Menschen in einer fairen Ausgangslage einigen würden (P2). Die Beteiligten sind vernünftig und an ihrem eigenen Wohl interessiert, aber nicht an den Interessen anderer: weder Egoisten noch Altruisten."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Der Schleier des Nichtwissens“", "f": "Was wissen die Beteiligten hinter dem Schleier des Nichtwissens nicht?", "a": [["Ihre Stellung in der Gesellschaft, ihre Begabungen und sogar ihre eigene Vorstellung vom guten Leben", 1], ["Ihre Stellung und ihr Einkommen; ihre Vorstellung vom guten Leben kennen sie aber genau", 0, null, "Rawls geht weiter: Nicht einmal die eigene Vorstellung vom guten Leben ist bekannt, sonst könnte man Regeln zugunsten der eigenen Werte wählen."], ["Die Interessen der anderen; deshalb handeln sie aus Rücksicht auf alle wie Altruisten", 0, null, "Die Beteiligten sind gerade keine Altruisten. Fair wird die Wahl durch das fehlende Wissen über sich selbst, nicht durch Nächstenliebe."], ["Welche Gesetze im Staat gelten; sie kennen nur das Naturrecht, das die Vernunft erkennen lässt", 0, "Locke", null]], "e": "Der Schleier soll verhindern, dass jemand die Regeln zu seinen Gunsten biegt: Wer nicht weiß, ob er reich oder arm, begabt oder unbegabt, gesund oder krank sein wird, kann keine Grundsätze vorschlagen, die gerade ihn bevorzugen. Die Einigung ist fair, weil die Ausgangslage fair ist, daher der Name Gerechtigkeit als Fairness. Im WG-Experiment zeigte sich das: Ohne Wissen um Zimmer und Einkommen achten meist alle stärker darauf, dass auch die Schwächsten mit den Regeln leben können."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Zwei Grundsätze“", "f": "Was verlangt Rawls' zweiter Grundsatz?", "a": [["Ungleichheiten sind nur erlaubt, wenn die Ämter allen bei fairer Chancengleichheit offenstehen und die am wenigsten Begünstigten den größten Vorteil haben.", 1], ["Ungleichheiten sind erlaubt, wenn dadurch der Gesamtnutzen der Gesellschaft am größten wird, auch wenn Einzelne dabei schlechter gestellt werden.", 0, "Utilitarismus", "Das ist das utilitaristische Prinzip vom größten Glück der größten Zahl. Rawls lehnt es ab, weil es die Schwächsten gegen den Gesamtnutzen verrechnen kann."], ["Ungleichheiten sind gerecht, wenn sie durch gerechte Aneignung und freiwillige Übertragung entstanden sind, wie groß sie auch werden mögen.", 0, "Nozick", "So argumentiert Nozicks Anspruchstheorie. Für Rawls zählt, wem die Ungleichheit nützt, nicht nur, wie sie entstanden ist."], ["Ungleichheiten sind nur für eine Übergangszeit erlaubt; danach müssen alle Einkommen wieder angeglichen werden.", 0, null, null]], "e": "Teil (b) des zweiten Grundsatzes heißt Unterschiedsprinzip (auch Differenzprinzip). Der erste Grundsatz sichert gleiche Grundfreiheiten für alle, etwa Meinungs-, Gewissens- und Versammlungsfreiheit, Wahlrecht und Schutz der Person. „Fair“ heißt beim zweiten Grundsatz: Wer gleich begabt und gleich motiviert ist, soll unabhängig von seiner Herkunft die gleichen Aussichten haben. Rawls ist also kein Anhänger der Gleichverteilung."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Die lexikalische Ordnung“", "f": "Eine Regierung will die Versammlungsfreiheit einschränken. Dadurch wächst die Wirtschaft so stark, dass auch die Ärmsten mehr Geld haben. Wie urteilt Rawls?", "a": [["Unzulässig: Die Grundfreiheiten gehen vor und dürfen nicht gegen wirtschaftliche Vorteile verrechnet werden.", 1], ["Zulässig: Das Unterschiedsprinzip ist erfüllt, weil die am wenigsten Begünstigten am meisten profitieren.", 0, null, "Das Unterschiedsprinzip gehört zum zweiten Grundsatz. In der lexikalischen Ordnung geht der erste Grundsatz, die gleichen Grundfreiheiten, immer vor."], ["Zulässig: Wenn die Mehrheit der Bürger zustimmt, darf eine Demokratie ihre Freiheiten selbst begrenzen.", 0, null, null], ["Unzulässig: Rawls lehnt Wirtschaftswachstum ab, weil es die Ungleichheit zwischen Arm und Reich vergrößert.", 0, null, "Rawls hat nichts gegen Wachstum und erlaubt Ungleichheit, wenn sie den Schwächsten nützt."]], "e": "Lexikalische Ordnung heißt: wie im Lexikon, erst entscheidet der erste Buchstabe, dann der zweite. Keine Wohlstandssteigerung rechtfertigt es, die Grundfreiheiten einzuschränken: Man darf nicht die Meinungsfreiheit abschaffen, nur weil die Wirtschaft dann schneller wächst. Innerhalb des zweiten Grundsatzes geht außerdem die faire Chancengleichheit dem Unterschiedsprinzip vor."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Das Unterschiedsprinzip im Test“", "f": "Höhere Arztgehälter führen nur dazu, dass es mehr Schönheitschirurgen in Beverly Hills gibt; arme Regionen werden nicht besser versorgt. Wie beurteilt man das mit dem Unterschiedsprinzip?", "a": [["Kaum zu rechtfertigen, weil die Ungleichheit den am wenigsten Begünstigten nichts nützt", 1], ["Ungerecht, weil der Abstand zwischen Arzt- und Busfahrergehalt einfach zu groß ist", 0, null, "Für Rawls ist entscheidend, wem die Ungleichheit nützt, nicht wie groß sie ist."], ["Gerecht, weil die Ärztinnen und Ärzte ihr Gehalt durch lange Ausbildung verdient haben", 0, null, "Mit Verdienst argumentiert Rawls nicht: Begabungen und günstige Startbedingungen hat sich niemand verdient."], ["Gerecht, solange die Patienten die Behandlungen freiwillig bezahlen", 0, null, "Freiwilliges Bezahlen wäre ein Maßstab im Sinne von Nozicks gerechter Übertragung. Das Unterschiedsprinzip fragt dagegen, ob die Ungleichheit den am wenigsten Begünstigten nützt."]], "e": "Den Fall erklärt Michael Sandel: Führen höhere Gehälter dazu, dass auch arme ländliche Regionen wie die Appalachen gut versorgt werden, ist die Ungleichheit mit Rawls vereinbar. Bringen sie nur mehr Schönheitschirurgen in reiche Viertel, ist sie kaum zu rechtfertigen. Rawls beurteilt dabei nicht jeden Einzelfall, sondern fragt, ob das System insgesamt, etwa mit progressiver Besteuerung, den am wenigsten Begünstigten ein besseres Leben ermöglicht als eine gleichere Regelung."}, {"teil": "Teil A · Rawls", "nach": "Teil A, Abschnitt „Begabungen sind Glück“", "f": "Ist es nach Rawls ungerecht, dass Menschen mit unterschiedlichen Begabungen geboren werden?", "a": [["Nein, das ist Zufall; gerecht oder ungerecht ist nur, wie die Institutionen damit umgehen.", 1], ["Nein, denn jeder gehört sich selbst und damit auch seine Begabungen und deren Früchte.", 0, "Nozick", "Das ist Nozicks Selbsteigentum. Rawls zieht aus dem Zufall den umgekehrten Schluss: Der Ertrag der Begabungen soll auch den weniger Glücklichen zugutekommen."], ["Ja, deshalb muss der Staat alle natürlichen Unterschiede zwischen den Menschen ausgleichen.", 0, null, "Die natürliche Verteilung ist für Rawls weder gerecht noch ungerecht. Er will Unterschiede nicht beseitigen, sondern regeln, wem ihr Ertrag nützt."], ["Nein, denn wer begabter ist, hat sich seinen Vorteil auch redlich verdient.", 0, null, null]], "e": "Für Rawls hat sich niemand seine Intelligenz, seine Gesundheit oder sein Elternhaus verdient. Die natürliche Verteilung der Begabungen ist „weder gerecht noch ungerecht“, sie ist einfach Zufall. Daraus folgt: Der Ertrag der Begabungen soll auch denen zugutekommen, die weniger Glück hatten, und der Staat darf dafür umverteilen. Genau hier liegt der Gegensatz zu Nozick."}, {"teil": "Teil A · Rawls", "k": "4", "nach": "Teil A, Abschnitt „Einwände: Risiko und Gemeinschaft“", "f": "Welcher Einwand gegen Rawls stammt von John Harsanyi?", "a": [["Die Maximin-Regel ist übertrieben vorsichtig; rational wäre es, den Durchschnitt zu maximieren.", 1], ["Das Selbst hinter dem Schleier gibt es nicht, weil Menschen immer schon durch Gemeinschaft geprägt sind.", 0, "Sandel", "Das ist der Einwand der Kommunitaristen wie Michael Sandel. Harsanyi kritisiert die Entscheidungsregel, nicht das Menschenbild."], ["Jedes Verteilungsmuster wird durch freiwillige Tauschakte sofort wieder zerstört.", 0, "Nozick", null], ["Rawls schützt die Schwächsten zu wenig, weil er große Ungleichheiten erlaubt.", 0, null, null]], "e": "Rawls begründet die Wahl seiner Grundsätze mit der Maximin-Regel: Wer seine Position und die Wahrscheinlichkeiten nicht kennt, wählt die Ordnung, deren schlechteste Position besser ist als die schlechteste Position jeder anderen Ordnung. Kritiker halten das nur bei extremer Risikoscheu für rational. Harsanyis Vorschlag, den Durchschnitt zu maximieren, führt allerdings zum Utilitarismus zurück, den Rawls gerade überwinden wollte."}, {"teil": "Teil B · Nozick", "k": "4", "nach": "Teil B, Abschnitt „Ein libertärer Gegenentwurf“", "f": "Welche Aussage über Nozicks libertäre Position trifft zu?", "a": [["Armut ist ihm nicht gleichgültig; er bestreitet nur, dass der Staat sie durch Zwang beheben darf.", 1], ["Armut ist für ihn kein Problem, weil jeder, der arm ist, selbst an seiner Lage schuld ist.", 0, null, "Das ist eine Karikatur. Freiwillige Hilfe ist für Nozick erlaubt und gut; abgelehnt wird nur die erzwungene Umverteilung."], ["Der Staat soll Zufälle ausgleichen und darf dafür das Einkommen der Begabten umverteilen.", 0, "Rawls", null], ["Der Staat soll abgeschafft werden, weil jede Form von Herrschaft die Freiheit verletzt.", 0, null, "Nozick verlangt keinen Verzicht auf den Staat, sondern einen Minimalstaat, der Leben, Eigentum und Verträge schützt."]], "e": "Nozick antwortet 1974 mit Anarchie, Staat, Utopia auf Rawls. Libertär heißt: Gerechtigkeit bedeutet vor allem, dass Eigentum respektiert wird, und jede Umverteilung durch den Staat ist ein Eingriff in die Freiheit des Einzelnen. Rawls und Nozick sind beide Liberale, die die Freiheit des Einzelnen schützen wollen; sie streiten darüber, was daraus für die Verteilung folgt."}, {"teil": "Teil B · Nozick", "nach": "Teil B, Abschnitt „Drei Grundsätze der Anspruchstheorie“", "f": "Welche drei Grundsätze hat Nozicks Anspruchstheorie?", "a": [["Gerechte Aneignung, gerechte Übertragung, Berichtigung früheren Unrechts", 1], ["Gleiche Grundfreiheiten, faire Chancengleichheit, Unterschiedsprinzip", 0, "Rawls", "Das sind die Bestandteile von Rawls' zwei Grundsätzen."], ["Eigentum durch Arbeit, nur so viel wie man nutzen kann, genug für andere", 0, "Locke", "Das sind Lockes Eigentumsbegründung und seine Grenzen der Aneignung. Nozick knüpft beim ersten Grundsatz an Locke an, übernimmt aber nicht alles."], ["Jedem nach seiner Leistung, nach seinem Bedarf, nach seinem Verdienst", 0, null, null]], "e": "Der Grundsatz der gerechten Aneignung regelt, wie man herrenlose Dinge rechtmäßig in Besitz nimmt. Der Grundsatz der gerechten Übertragung regelt, wie Besitz durch freiwilligen Tausch oder Schenkung übergeht, nicht durch Betrug oder Diebstahl. Der dritte Grundsatz berichtigt früheres Unrecht. Daraus folgt: „Ist der Besitz jedes Einzelnen gerecht, so ist die Gesamtmenge (die Verteilung) der Besitztümer gerecht.“", "k": "4"}, {"typ": "arg", "teil": "Teil B · Nozick", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Nozicks Fußballspieler-Argument?", "zeilen": [["P1", "Angenommen, die Verteilung V1 ist nach Rawls gerecht."], ["P2", "Eine Million Zuschauer geben einem Fußballspieler freiwillig 50 Cent ihres gerechten Besitzes."], ["P3", null], ["K", "Also ist auch die neue, ungleiche Verteilung V2 gerecht."]], "a": [["Dritte behalten ihre gerechten Anteile; niemand kann sich über Unrecht beklagen.", 1], ["Der Fußballspieler hat seine Begabung durch hartes Training selbst verdient.", 0, null, "Nozick argumentiert nicht mit Verdienst, sondern mit Freiwilligkeit: Entscheidend ist, dass niemandem etwas genommen wurde."], ["Hinter dem Schleier würde niemand eine so große Ungleichheit wählen.", 0, "Rawls", null], ["Der Staat darf nur Leben, Eigentum und Verträge schützen, sonst nichts.", 0, null, "Der Minimalstaat ist eine Folgerung aus dem Argument, keine Prämisse."]], "e": "P3 sichert den Schluss ab: Wenn alle freiwillig gezahlt haben und alle anderen ihre gerechten Anteile behalten, sieht Nozick niemanden, dem Unrecht geschehen ist. „Wenn V1 eine gerechte Verteilung war und die Menschen freiwillig zu V2 übergingen [...], ist dann nicht auch V2 gerecht?“ Daraus folgt: Wer ein Verteilungsmuster erhalten will, muss ständig in freiwillige Tauschhandlungen eingreifen. Nozicks Originalbeispiel ist der Basketballstar Wilt Chamberlain."}, {"teil": "Teil B · Nozick", "nach": "Teil B, Abschnitt „Historisch statt strukturell“", "f": "Zwei Gesellschaften haben heute genau dieselbe Verteilung. In der einen ist sie durch Tausch entstanden, in der anderen durch Raub. Nach welcher Art von Grundsatz sind beide trotzdem gleich gerecht?", "a": [["Nach einem strukturellen Grundsatz, der nur fragt, wer jetzt was hat", 1], ["Nach einem historischen Grundsatz, der nur auf das heutige Ergebnis achtet", 0, null, "Historische Grundsätze fragen gerade, wie eine Verteilung zustande kam. Für sie wäre die durch Raub entstandene Verteilung ungerecht."], ["Nach Nozicks Anspruchstheorie, weil beide Verteilungen gleich aussehen", 0, "Nozick", "Die Anspruchstheorie ist historisch: Der Raub verletzt den Grundsatz der gerechten Übertragung und verlangt Berichtigung."], ["Nach dem Grundsatz der Berichtigung früheren Unrechts", 0, null, null]], "e": "Nozick unterscheidet historische Grundsätze, die fragen, wie eine Verteilung zustande kam, von strukturellen, die nur den Zeitquerschnitt betrachten: Für sie sind zwei gleich aussehende Verteilungen immer gleich gerecht. Außerdem lehnt er Grundsätze ab, die einem Muster folgen („jedem nach seiner Leistung, seinem Bedarf ...“), weil jedes Muster durch freiwillige Tauschakte sofort wieder zerstört wird. Rawls' Unterschiedsprinzip ist für Nozick ein solches Muster."}, {"teil": "Teil B · Nozick", "k": "4", "nach": "Teil B, Abschnitt „Steuern als Zwangsarbeit?“", "f": "Warum stellt Nozick die Besteuerung von Arbeitseinkommen zur Umverteilung auf eine Stufe mit Zwangsarbeit?", "a": [["Wer mir einen Teil meines Lohns nimmt, verfügt über einen Teil meiner Arbeitszeit und damit über mich selbst.", 1], ["Steuern werden immer ohne Zustimmung der Bürger erhoben und verletzen deshalb den Gesellschaftsvertrag.", 0, null, "Nozick argumentiert nicht mit fehlender Zustimmung, sondern mit dem Selbsteigentum: Jeder gehört sich selbst."], ["Der Ertrag von Begabungen soll allen dienen, deshalb darf der Staat auf die Früchte der Begabten zugreifen.", 0, "Rawls", "Das ist Rawls' Begründung für Umverteilung. Nozick hält genau diesen Zugriff auf die Früchte der Begabung für unzulässig."], ["Steuern belasten die Armen stärker als die Reichen und zwingen sie zu immer mehr Arbeit.", 0, null, null]], "e": "Hinter dem Vergleich steht das Selbsteigentum: Jeder gehört sich selbst, und damit auch seine Begabungen und deren Früchte. Hier liegt der Gegensatz zu Rawls, für den Begabungen ein Zufall sind. Der Staat soll deshalb nur schützen, nicht umverteilen: Leben, Eigentum und Verträge sichern, sonst nichts. Das ist der Minimalstaat."}, {"typ": "offen", "teil": "Fazit", "nach": "Fazit „Muster oder Geschichte?“", "f": "Rawls und Nozick sind beide Liberale. An welchen zwei Stellen streiten sie, und wie würde Rawls auf das Fußballspieler-Argument antworten?", "m": "Erstens streiten sie darüber, ob es auf das Muster einer Verteilung ankommt (strukturell, Rawls) oder auf ihre Geschichte (historisch, Nozick). Für Nozick ist eine Verteilung gerecht, wenn jeder Besitz gerecht angeeignet oder freiwillig übertragen wurde; wie ungleich sie am Ende aussieht, spielt keine Rolle. Zweitens streiten sie über die Begabungen: Für Nozick gehören die Früchte meiner Begabungen mir (Selbsteigentum), für Rawls sind Begabungen ein Zufall, dessen Ertrag allen dienen soll. Auf das Fußballspieler-Argument antwortet Rawls, dass er nicht in einzelne Tauschakte eingreift, sondern die Regeln gestaltet, unter denen getauscht wird. Viele für sich faire Geschäfte können zusammen die faire Ausgangslage zerstören, etwa wenn sich Vermögen über Generationen so anhäuft, dass die Kinder der Armen keine fairen Chancen mehr haben. Deshalb muss die Grundstruktur die fairen Bedingungen laufend sichern."}]}, {"id": "pp-demokratie", "tf": "PP", "gruppe": "Demokratie und Weltordnung", "kapitel": "Demokratie", "titel": "Demokratie", "sub": "Wer herrscht, was schulden Bürger, was bedroht die Freiheit?", "kurse": ["4", "2"], "fragen": [{"teil": "Einführung", "k": "4", "nach": "Einführung, Abschnitt „Rom: Das Volk stimmt der Herrschaft zu“", "f": "Warum würde Aristoteles unsere heutigen Staaten gar nicht Demokratien nennen?", "a": [["Weil in ihnen wenige herrschen, auch wenn diese Wenigen gewählt sind", 1], ["Weil heute auch Frauen, Jugendliche und Fremde mitbestimmen dürfen", 0, null, "Das Wahlrecht wurde zwar ausgeweitet, doch Aristoteles' Punkt ist ein anderer: Nicht das Volk entscheidet, sondern gewählte Wenige."], ["Weil heute die Armen in ihrem eigenen Interesse regieren", 0, "Aristoteles", "So beschreibt Aristoteles gerade die Demokratie selbst, die er deshalb zu den entarteten Staatsformen zählt."], ["Weil die Souveränität des Volkes nicht vertreten werden kann", 0, "Rousseau", null]], "e": "In Athen entschied die Volksversammlung (ekklesia) selbst über die Gesetze: direkte Demokratie. Rom dagegen entwickelte die Republik mit gewählten Ämtern und Senat; das Volk muss nicht mehr selbst herrschen, es genügt, dass es der Herrschaft zustimmt. Die moderne Demokratie steht eher in dieser römischen Linie, hält aber am Grundsatz der Volkssouveränität fest: „Alle Staatsgewalt geht vom Volk aus“ (Art. 20 GG)."}, {"teil": "Teil A · Wer entscheidet?", "nach": "Teil A, Abschnitt „Schumpeter: Konkurrenz um Stimmen“", "f": "Wie bestimmt Schumpeter die demokratische Methode?", "a": [["Einzelne erwerben die Entscheidungsbefugnis durch einen Konkurrenzkampf um die Stimmen des Volkes.", 1], ["Man kann eine Regierung ohne Blutvergießen loswerden, wenn sie schlecht gearbeitet hat.", 0, "Popper", "Das ist Poppers Kriterium. Popper geht noch einen Schritt weiter als Schumpeter und fragt nur nach der Abwählbarkeit."], ["Das Volk gibt sich selbst Gesetze, die Ausdruck des Gemeinwillens sind.", 0, "Rousseau", null], ["Bürger bilden ihre Meinung gemeinsam im Gespräch und kontrollieren Macht horizontal.", 0, "Arendt", "Das beschreibt Arendts Rätesystem, also gerade ein Gegenmodell zu Schumpeter."]], "e": "Schumpeter hält die klassische Theorie für unrealistisch: Wähler sind „schlechte, sogar korrumpierbare Richter“ über politische Fragen, und der Wille der Mehrheit ist nicht der Wille des Volkes. Er dreht das Verhältnis um: Das Volk entscheidet nicht über Sachfragen, es wählt, wer entscheidet. Demokratie funktioniert wie ein Markt, auf dem Parteien um Wähler konkurrieren wie Firmen um Kunden. Man spricht von Konkurrenzdemokratie."}, {"teil": "Teil A · Wer entscheidet?", "nach": "Teil A, Abschnitt „Was das für den Wähler bedeutet“", "f": "Was heißt Schumpeters Modell ganz praktisch für dich als Wählerin oder Wähler?", "a": [["Du entscheidest alle paar Jahre, welches Team künftig entscheiden darf, und kannst es wieder abwählen.", 1], ["Du solltest den Gewählten auch zwischen den Wahlen regelmäßig schreiben und Anweisungen geben.", 0, null, "Genau das hält Schumpeter für schädlich: Zwischen den Wahlen ist politisches Handeln Sache der Gewählten."], ["Du stimmst über jede wichtige Sachfrage selbst ab, so wie die Bürger in der Volksversammlung Athens.", 0, null, null], ["Du berätst mit Nachbarn an einem Tisch und schickst den Geeignetsten in den nächsthöheren Rat.", 0, "Arendt", null]], "e": "Du entscheidest nicht, ob eine Straße gebaut oder eine Steuer erhöht wird. Wahlkampf ist für Schumpeter so etwas wie Werbung: Parteien bieten Personen und Programme an, die Wähler wählen aus dem Angebot. Die Initiative liegt bei den Führenden: Viele Wünsche der Bürger bleiben ohne Wirkung, bis ein Politiker sie aufgreift. Schumpeter hält das nicht für einen Mangel, sondern für eine ehrliche Beschreibung moderner Demokratien."}, {"teil": "Teil A · Wer entscheidet?", "k": "4", "nach": "Teil A, Abschnitt „Popper: Regierungen ohne Blutvergießen loswerden“", "f": "Wie geht Popper mit der alten Frage „Wer soll herrschen?“ um?", "a": [["Er hält sie für falsch gestellt und fragt, wie man schlechte Herrscher ohne Gewalt absetzen kann.", 1], ["Er antwortet: die Weisesten, denn nur wer die Idee des Guten kennt, weiß, was für alle gut ist.", 0, "Platon", "Das ist Platons Antwort. Popper sieht gerade in Platons Staat das Urbild einer geschlossenen Gesellschaft."], ["Er antwortet: das Volk selbst, das sich von unten nach oben in Räten organisiert.", 0, "Arendt", null], ["Er antwortet: die Fachleute, weil Wähler über politische Fragen schlecht urteilen.", 0, null, "Popper gibt gar keine Antwort auf die Frage, wer herrschen soll, weil sich jede Antwort als Irrtum erweisen kann."]], "e": "Welche Antwort man auf „Wer soll herrschen?“ auch gibt, man kann sich irren, und jeder Herrscher kann sich als schlecht herausstellen. Popper fragt deshalb, wie wir Institutionen so einrichten, dass schlechte Herrscher möglichst wenig Schaden anrichten. In einer Demokratie kann man die Regierung durch Wahlen ohne Blutvergießen loswerden, in einer Tyrannei nur durch Umsturz. Entscheidend ist, dass Fehler korrigiert werden können, ähnlich wie in der Wissenschaft."}, {"teil": "Teil A · Wer entscheidet?", "nach": "Teil A, Abschnitt „Rousseau: nur frei während der Wahl“", "f": "„Das englische Volk glaubt frei zu sein, es täuscht sich gewaltig, es ist nur frei während der Wahl der Parlamentsmitglieder.“ Was kritisiert Rousseau?", "a": [["Der Gemeinwille kann nicht vertreten werden; wer nur wählt, regiert sich nicht selbst.", 1], ["Die Wähler sind schlechte Richter über politische Fragen und geben Vorurteilen nach.", 0, "Schumpeter", "Das ist Schumpeters Begründung für die Konkurrenzdemokratie. Rousseau zweifelt nicht am Volk, sondern an seiner Vertretung."], ["Das Parlament verwaltet nur die gemeinschaftlichen Geschäfte der Bourgeoisie.", 0, "Marx und Engels", null], ["Die Mehrheit und die herrschende Meinung bedrücken Abweichende.", 0, "Mill", null]], "e": "Für Rousseau ist das Volk als Ganzes souverän, und Gesetze sind Ausdruck des Gemeinwillens. Ein Wille kann nicht von anderen vertreten werden. Wer nur alle paar Jahre einen Zettel abgibt, gibt seine Souveränität deshalb ab, statt sie auszuüben. Arendt knüpft an diese Kritik an: Auch sie sieht in der bloßen Wahl zu wenig Freiheit."}, {"teil": "Teil A · Wer entscheidet?", "nach": "Teil A, Abschnitt „Arendt: Befreiung ist nicht Freiheit“", "f": "„Die Zelle, in der wir unsere Stimmzettel abgeben, ist zweifellos zu klein, denn in dieser Zelle ist Platz nur für einen.“ Was meint Arendt?", "a": [["In der Wahlkabine handelt jeder allein; Freiheit braucht einen Raum, in dem Bürger gemeinsam beraten.", 1], ["Geheime Wahlen sind undemokratisch und sollten durch offene Abstimmungen ersetzt werden.", 0, null, "Arendt kritisiert nicht das Wahlgeheimnis, sondern dass sich Politik auf diesen einsamen Akt beschränkt."], ["Weil Wähler schlecht urteilen, sollten sie nur noch über Führungspersonal abstimmen.", 0, "Schumpeter", null], ["Die Bürger trösten sich über ihre Abhängigkeit, weil sie ihren Vormund selbst gewählt haben.", 0, "Tocqueville", "Das ist Tocquevilles sanfter Despotismus. Arendt zielt auf die Vereinzelung des Wählers, nicht auf einen fürsorglichen Vormund."]], "e": "Arendt unterscheidet Befreiung von Freiheit: Ein Volk, das einen Tyrannen stürzt, ist befreit, aber noch nicht frei. Freiheit muss in Institutionen verankert werden. Im Repräsentativsystem treten die Wähler aber nur periodisch zusammen, „um sich ihrer eigenen Macht zu entledigen“. Politik wird so wieder zum Privileg weniger."}, {"typ": "arg", "teil": "Teil A · Wer entscheidet?", "k": "4", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Arendts Argument?", "zeilen": [["P1", "Befreiung ist nicht Freiheit; Freiheit muss in Institutionen verankert werden."], ["P2", null], ["P3", "So kehrt die Trennung von Herrschern und Beherrschten zurück; Politik wird Privileg weniger."], ["K", "Gebraucht wird ein Raum der Mitbestimmung von unten: das Rätesystem."]], "a": [["Im Repräsentativsystem treten die Wähler periodisch zusammen, „um sich ihrer eigenen Macht zu entledigen“.", 1], ["Wähler sind schlechte, sogar korrumpierbare Richter über politische Fragen und ihre eigenen Interessen.", 0, "Schumpeter", "Diese Prämisse führt bei Schumpeter zum entgegengesetzten Schluss: weniger Beteiligung, Konkurrenz von Eliten um Stimmen."], ["Die moderne Staatsgewalt ist nur ein Ausschuss, der die Geschäfte der ganzen Bourgeoisklasse verwaltet.", 0, "Marx und Engels", null], ["Über den vereinzelten Bürgern erhebt sich eine milde Vormundschaftsgewalt, die ihren Willen schwächt.", 0, "Tocqueville", null]], "e": "P2 verbindet die beiden anderen Schritte: Weil die Bürger ihre Macht bei der Wahl an Vertreter abgeben, entsteht wieder die alte Trennung von Herrschern und Beherrschten. Das Volk versinkt dann in Lethargie oder bleibt im Widerstand gegen jede gewählte Macht. Hinter Arendts Gegenmodell steht ihr Begriff der Macht als gemeinsames Handeln."}, {"teil": "Teil A · Wer entscheidet?", "nach": "Teil A, Abschnitt „Das Rätesystem“", "f": "Welche Aussage über Arendts Rätesystem trifft zu?", "a": [["Nicht jeder muss mitmachen, aber jeder muss die Chance dazu haben.", 1], ["Alle Bürger sind verpflichtet, an den Sitzungen ihres Rates teilzunehmen.", 0, null, "Arendt verlangt keine Pflicht zur Teilnahme. Wer sich nicht für öffentliche Angelegenheiten interessiert, muss hinnehmen, dass ohne ihn entschieden wird."], ["Die Räte werden von der Regierung eingesetzt und kontrollieren von oben.", 0, null, null], ["Arendt ist sicher, dass sich das Rätesystem bald überall durchsetzt.", 0, null, "Arendt selbst hält die Chancen der Räte für „sehr gering, wenn überhaupt irgendwelche“."]], "e": "Das Rätesystem beginnt ganz unten, mit Nachbarschafts-, Betriebs- oder Hausräten. Wenn zehn Leute um einen Tisch sitzen, sagt jeder seine Meinung, hört die der anderen, und die Meinungen klären sich im Gespräch. Wer am besten geeignet ist, vertritt die Gruppe im nächsthöheren Rat. Macht wird so nicht von oben nach unten, sondern „horizontal“ kontrolliert. Räte entstanden in fast allen Revolutionen spontan, von der Französischen Revolution bis Ungarn 1956."}, {"teil": "Teil B · Was schulden Bürger?", "k": "4", "nach": "Teil B, Abschnitt „Mill: Freiheit mit einer Grenze“", "f": "Worüber streiten Mill und die Kommunitaristen eigentlich?", "a": [["Ob der Staat bürgerliches Engagement erzwingen darf", 1], ["Ob Beteiligung am Gemeinwesen überhaupt einen Wert hat", 0, null, "Darüber sind sie sich einig: Auch Mill hält Beteiligung für wertvoll, weil man als Geschworener oder in der Gemeinde lernt, an das Gemeinwohl zu denken."], ["Ob der Staat Steuern und Zeugenaussagen verlangen darf", 0, null, "Das darf er auch nach Mill: Wer den Schutz der Gesellschaft genießt, muss seinen Teil beitragen."], ["Ob die Demokratie besser ist als die Herrschaft der Weisesten", 0, null, null]], "e": "Für den Liberalen Mill gilt: Anderen nicht schaden und seinen Teil beitragen, etwa Steuern zahlen oder vor Gericht aussagen, darf der Staat erzwingen. Was nur einen selbst betrifft, bleibt frei; mehr Engagement soll durch Überzeugung entstehen. Die Kommunitaristen (von engl. community) betonen dagegen, dass Menschen in Gemeinschaften verankert sind und eine Demokratie vom Gemeinsinn ihrer Bürger lebt."}, {"teil": "Teil B · Was schulden Bürger?", "k": "4", "nach": "Teil B, Abschnitt „Der Fall: Wahlpflicht in Luxemburg“", "f": "Mit welcher Frage prüft man die Luxemburger Wahlpflicht im Sinne Mills?", "a": [["Schadet es anderen, wenn jemand nicht wählt?", 1], ["Hat, wer Rechte genießt, nicht auch Pflichten?", 0, "Etzioni", "Das ist Etzionis Frage: „Zu Individualrechten gehören Sozialpflichten.“"], ["Wie viel Engagement kann man im wirklichen Leben zumuten?", 0, "Walzer", null], ["Begegnen sich Arm und Reich noch in öffentlichen Räumen?", 0, "Sandel", null]], "e": "Mill zieht die Grenze beim Schaden: Was nur einen selbst betrifft, bleibt frei, was anderen schadet, darf die Gemeinschaft regeln. In Luxemburg müssen alle eingetragenen Wähler wählen, über 75-Jährige sind befreit; die vorgesehenen Geldstrafen wurden seit Jahrzehnten nicht verfolgt. Die Wahlpflicht ist eine kleine Pflicht; ein verpflichtendes Schöffenamt oder ein Gemeindedienst wären größere."}, {"teil": "Teil C · Was bedroht die Freiheit?", "nach": "Teil C, Abschnitt „Tocqueville: der sanfte Despotismus“", "f": "Was ist neu an der Gefahr, die Tocqueville in der Demokratie sieht?", "a": [["Eine milde Vormundschaftsgewalt, die den Willen nicht bricht, sondern schwächt, beugt und leitet", 1], ["Eine gewählte Regierung, die Abweichende mit Terror verfolgt und ihren Willen bricht", 0, null, "Genau das tut der neue Despotismus nicht: „Er bricht den Willen nicht“. Die Vormundschaftsgewalt ist mild und sorgt für das Wohlergehen der Bürger."], ["Eine Klasse, die den Staat als organisierte Gewalt zur Unterdrückung einer anderen nutzt", 0, "Marx und Engels", null], ["Ein Herrscher, der seine Untertanen gar nicht erst um ihre Zustimmung fragt", 0, null, null]], "e": "Tocqueville sieht eine Menge gleicher, vereinzelter Menschen, die sich nur um ihre kleinen Freuden drehen. Über ihnen erhebt sich eine „gewaltige Vormundschaftsgewalt“, „absolut, ins Einzelne gehend, pünktlich, vorausschauend und milde“. Sie hält die Menschen in der Kindheit fest und nimmt ihnen die Mühe ab, selbst zu denken. Das Besondere: Die Bürger trösten sich damit, dass sie ihren Vormund selbst gewählt haben. Als Gegenmittel setzt Tocqueville auf Gemeinden, Vereine und eine freie Presse."}, {"teil": "Teil C · Was bedroht die Freiheit?", "nach": "Teil C, Abschnitt „Mill: Tyrannei der Mehrheit auch ohne Gesetz“", "f": "Wie erweitert Mill Tocquevilles Begriff der Tyrannei der Mehrheit?", "a": [["Vom Staat auf die Gesellschaft: Auch ohne Gesetz kann die öffentliche Meinung Abweichende zum Schweigen bringen.", 1], ["Er setzt als Gegenmittel auf Gemeinden, Vereine und eine freie Presse, in denen die Bürger selbst handeln.", 0, "Tocqueville", "Das sind Tocquevilles Gegenmittel. Mills eigene Erweiterung betrifft die Quelle der Unfreiheit: den Druck der herrschenden Meinung."], ["Er überträgt ihn auf die Wirtschaft: Wer die Produktionsmittel besitzt, beherrscht auch die Wähler.", 0, "Marx und Engels", null], ["Er beschränkt ihn auf Gesetze, mit denen eine gewählte Mehrheit die Minderheit benachteiligt.", 0, null, null]], "e": "Tocqueville warnt schon im ersten Band (1835) vor der Allmacht der Mehrheit. Mill übernimmt den Begriff und erweitert ihn vom Staat auf die Gesellschaft: Die Mehrheit und die herrschende Meinung können Abweichende bedrücken, auch ohne Gesetz. Wer anders denkt oder lebt, kann durch gesellschaftlichen Druck ebenso unfrei werden wie durch ein Verbot."}, {"teil": "Teil C · Was bedroht die Freiheit?", "k": "4", "nach": "Teil C, Abschnitt „Gleiche Stimme, ungleiche Macht“", "f": "Was meinen Marx und Engels, wenn sie die Gleichheit in der bürgerlichen Demokratie „formal“ nennen?", "a": [["Jeder hat eine Stimme, doch in der Wirtschaft bleibt die Macht der Besitzer der Produktionsmittel bestehen.", 1], ["Ungleichheit ist erlaubt, solange sie den am wenigsten Begünstigten den größten Vorteil bringt.", 0, "Rawls", "Das ist Rawls' Unterschiedsprinzip. Marx und Engels fragen nicht nach einem gerechten Verteilungsmaßstab, sondern nach der Macht, die aus dem Besitz der Produktionsmittel folgt."], ["Die Bürger ziehen sich ins Private zurück und lassen sich von einem milden Vormund bevormunden.", 0, "Tocqueville", null], ["Die Wähler entscheiden nicht über Sachfragen, sondern nur darüber, wer künftig entscheidet.", 0, "Schumpeter", null]], "e": "Vor dem Gesetz sind alle gleich, aber diese Gleichheit steht nur auf dem Papier. Der Fabrikbesitzer bestimmt über Lohn, Arbeitszeit und Entlassung und hat Geld für Zeitungen, Parteien und Einfluss; der Arbeiter hat am Wahltag eine Stimme und den Rest der Zeit keine Macht. Der Staat ist deshalb nicht neutral: „Die moderne Staatsgewalt ist nur ein Ausschuss, der die gemeinschaftlichen Geschäfte der ganzen Bourgeoisklasse verwaltet.“ Die Demokratie ist für Marx und Engels trotzdem der erste Schritt zur Befreiung."}, {"typ": "offen", "teil": "Teil C · Was bedroht die Freiheit?", "nach": "Teil C, Abschnitt „Den Vormund selbst gewählt“", "f": "Warum passt für Tocqueville das alte Wort „Despotismus“ nicht, und wie hängt die neue Gefahr mit Wahlen zusammen?", "m": "Der alte Despotismus herrscht durch Gewalt und Angst, er bricht den Willen der Untertanen. Die Gefahr, die Tocqueville beschreibt, ist anders: Eine „gewaltige Vormundschaftsgewalt“ sorgt mild und vorausschauend für das Wohlergehen der Bürger. Sie tyrannisiert nicht, sondern nimmt ihnen nach und nach die Mühe ab, selbst zu denken und zu entscheiden: „Er bricht den Willen nicht, sondern er schwächt, beugt und leitet ihn.“ Vorbereitet wird das durch die Gleichheit und die Vereinzelung: Jeder lebt nur in sich und für sich selbst. Gerade Wahlen machen diese Vormundschaft erträglich, denn die Bürger trösten sich damit, ihren Vormund selbst gewählt zu haben. Für einen Augenblick verlassen sie ihre Abhängigkeit, um ihren Herrn zu bestimmen, und fallen danach wieder in sie zurück. Man kann also unfrei sein, obwohl man wählt."}]}, {"id": "pp-weltbuergertum", "tf": "PP", "gruppe": "Demokratie und Weltordnung", "kapitel": "Weltbürgertum", "titel": "Weltbürgertum", "sub": "Kann Vernunft den Krieg abschaffen?", "kurse": ["4"], "fragen": [{"teil": "Einführung", "nach": "Einführung „Der Naturzustand zwischen den Staaten“", "f": "Warum herrscht nach diesem Kapitel zwischen den Staaten noch immer ein Naturzustand?", "a": [["Es gibt kein gemeinsames Gesetz, keinen Richter über allen und keine Macht, die ein Urteil durchsetzt.", 1], ["Staaten sind von Natur aus böse und wollen ständig Krieg gegeneinander führen.", 0, null, "Der Naturzustand ist durch das Fehlen einer Rechtsordnung bestimmt. Auch Kant behauptet keinen ständigen Kampf, sondern ständige Bedrohung."], ["Mit dem Eigentum sind Ungleichheit, Konkurrenz, Eitelkeit und Gier entstanden.", 0, "Rousseau", null], ["Zwischen Staaten gibt es weder Verträge noch Diplomatie, nur Gewalt.", 0, null, "Verträge gibt es durchaus. Kant unterscheidet den gewöhnlichen Friedensvertrag, der einen Krieg beendet, vom Friedensbund."]], "e": "Innerhalb eines Staates gibt es seit dem Gesellschaftsvertrag Gesetze, Richter und eine Polizei, die Streit ohne Gewalt entscheiden. Zwischen den Staaten fehlt das alles: Jeder Staat ist Richter in eigener Sache, und im Zweifel entscheidet der Krieg. Das ist die Analogie zum Naturzustand bei Hobbes, Locke und Rousseau. Kant schreibt Zum ewigen Frieden 1795, mitten in den Kriegen nach der Französischen Revolution."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Frieden muss gestiftet werden“", "f": "Auf welchen drei Ebenen muss Frieden für Kant durch Recht gestiftet werden?", "a": [["Staatsrecht, Völkerrecht, Weltbürgerrecht", 1], ["Legislative, Exekutive, Judikative", 0, null, "Das sind die drei Staatsgewalten. Kants Ebenen betreffen dagegen verschiedene Rechtsverhältnisse: Bürger, Staaten, Menschen gegenüber fremden Staaten."], ["Naturrecht, Naturgesetz, Gesellschaftsvertrag", 0, null, null], ["Präliminarartikel, Definitivartikel, Zusatz", 0, null, "Das sind Teile von Kants Schrift. Die drei Definitivartikel entsprechen zwar den drei Ebenen, sind aber nicht die Ebenen selbst."]], "e": "Für jede Ebene formuliert Kant einen Definitivartikel: Das Staatsrecht regelt das Verhältnis der Bürger untereinander (republikanische Verfassung), das Völkerrecht das der Staaten untereinander (Friedensbund), das Weltbürgerrecht das der Menschen zu fremden Staaten (Hospitalität). Frieden ist kein natürlicher Zustand: Wie bei Hobbes droht im Naturzustand jederzeit Gewalt, und Staaten „lädieren“ sich „schon durch ihr Nebeneinandersein“."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Erster Artikel: Republiken führen seltener Krieg“", "f": "Was meint Kant, wenn er fordert, die Verfassung jedes Staates solle „republikanisch“ sein?", "a": [["Eine Verfassung mit Gewaltenteilung und Vertretung, in der die Gesetze von den Bürgern ausgehen", 1], ["Eine direkte Demokratie, in der die Bürger in einer Versammlung alle Gesetze selbst beschließen", 0, null, "Republik heißt bei Kant gerade nicht direkte Demokratie. Diese nennt er sogar einen Despotismus, weil Gesetzgebung und Ausführung nicht getrennt sind."], ["Ein Souverän, dem alle ihr Recht auf alles übertragen und der ungeteilte Macht besitzt", 0, "Hobbes", null], ["Eine Herrschaft der Weisesten, die durch ihr Wissen um das Gute legitimiert sind", 0, "Platon", null]], "e": "Die Republik ist Kants erster Definitivartikel: „Die bürgerliche Verfassung in jedem Staate soll republikanisch sein.“ Entscheidend für den Frieden ist, dass in der Republik die Bürger zustimmen müssen, ob Krieg sein soll. Kant behauptet damit eine Neigung zum Frieden, keine sichere Folge."}, {"typ": "arg", "teil": "Teil A · Kant", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt im Argument des ersten Definitivartikels?", "zeilen": [["P1", "In der Republik müssen die Bürger zustimmen, ob Krieg sein soll."], ["P2", null], ["K", "Also werden sie sich „sehr bedenken“; für den Despoten dagegen ist Krieg eine „Lustpartie“."]], "a": [["Sie tragen selbst Kampf, Kosten, Verwüstung und Schulden.", 1], ["Sie sind von Natur aus friedlicher als Könige und Fürsten.", 0, null, "Kant ist kein Träumer: Er begründet die Friedensneigung mit den Lasten, die die Bürger tragen, nicht mit ihrer guten Natur."], ["Stehende Heere sollen mit der Zeit ganz aufhören.", 0, null, "Das ist einer der Präliminarartikel, nicht eine Prämisse des ersten Definitivartikels."], ["Die Erde gehört ursprünglich allen Menschen gemeinsam.", 0, null, null]], "e": "Für den Despoten, der an seiner Tafel, seinen Jagden und Lustschlössern nichts einbüßt, ist Krieg eine „Lustpartie“. Die Bürger einer Republik dagegen müssen selbst kämpfen, die Kosten zahlen, die Verwüstung wieder aufbauen und die Schulden abtragen. Deshalb werden sie sich „sehr bedenken“, ein so schlimmes Spiel anzufangen. Kant behauptet eine Neigung, keine sichere Folge."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Selbst für ein Volk von Teufeln“", "f": "Was will Kant mit dem Satz zeigen, ein Staat lasse sich „selbst für ein Volk von Teufeln (wenn sie nur Verstand haben)“ einrichten?", "a": [["Auch Egoisten verstehen, dass Gesetze ihnen nützen; Frieden ist also möglich, wenn auch nicht vorhergesagt.", 1], ["Die Natur garantiert, dass der ewige Frieden mit Sicherheit eintreten wird, gleich was die Menschen tun.", 0, null, "Die „Garantie“ sagt den Frieden nicht voraus. Sie zeigt nur, dass er möglich ist und die Pflicht zum Frieden kein bloßer Traum ist."], ["Nur ein Souverän mit ungeteilter Macht, dem alle ihr Recht auf alles übertragen, kann den Krieg aller gegen alle beenden.", 0, "Hobbes", "Das ist Hobbes' Lösung. Kant will mit dem Satz zeigen, dass schon der Eigennutz verständiger Menschen zum Recht führt."], ["Nur moralisch gute Menschen können einen Rechtsstaat gründen; Teufel brauchen erst Erziehung.", 0, null, null]], "e": "Kant antwortet damit im „Ersten Zusatz“ auf den Vorwurf, er sei zu optimistisch. Die Natur selbst treibt die Menschen durch Konflikte, Handelsgeist und Eigennutz zum Recht. Ein Rechtsstaat setzt also keine guten Menschen voraus, nur verständige. Das verbindet Realismus mit dem Vernunftanspruch: Frieden ist eine erreichbare Pflicht."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Zweiter Artikel: ein Bund statt eines Weltstaats“", "f": "Was meint Kant mit dem „negativen Surrogat“?", "a": [["Einen Friedensbund freier Staaten als Ersatz für die Weltrepublik, die die Vernunft eigentlich verlangt", 1], ["Eine Staatenrepublik mit echtem Staatscharakter, aber nur wenigen, durchsetzbaren Aufgaben", 0, "Höffe", "Das ist Höffes Vorschlag. Kants Bund hat gerade keine Zwangsgewalt über seine Mitglieder."], ["Einen Friedensvertrag, der einen bestimmten Krieg zwischen zwei Staaten beendet", 0, null, "Ein Friedensvertrag (pactum pacis) beendet einen Krieg, der Friedensbund will „alle Kriege auf immer“ beenden."], ["Einen homogenen Weltstaat, der alle bestehenden Staaten ersetzt", 0, null, null]], "e": "Eigentlich müssten Staaten wie Menschen ihre „wilde (gesetzlose) Freiheit“ aufgeben und einen Völkerstaat bilden. Weil sie das nicht wollen und als Rechtsordnungen „dem Zwange anderer“ „entwachsen“ sind, tritt an die Stelle der Weltrepublik ihr negatives Surrogat (Ersatz): ein Friedensbund freier Staaten (foedus pacificum). Er kann entstehen, wenn ein mächtiges und aufgeklärtes Volk sich zur Republik bildet und andere Staaten sich anschließen."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Warum kein Weltstaat?“", "f": "Kant nennt drei Gründe gegen einen Weltstaat. Welcher davon ist der begriffliche Grund?", "a": [["Viele Völker in einem Staat wären nur noch ein Volk, und das Recht zwischen verschiedenen Völkern wäre aufgehoben.", 1], ["Ein Weltstaat unter einer einzigen Macht droht zum „seelenlosen Despotism“ zu werden, der die Freiheit erstickt.", 0, null, "Auch das ist Kants Grund, aber kein begrifflicher: Es ist eine Gefahr, sein dritter Grund."], ["Die Staaten wollen ihre Souveränität nicht aufgeben und lassen sich nicht unter gemeinsame Zwangsgesetze stellen.", 0, null, "Das ist Kants erster Grund, der Unwille der Staaten, also eine Tatsache, kein begrifflicher Widerspruch."], ["Ein bloßer Bund ohne „Schwert der Gerechtigkeit“ bliebe ein (modifizierter) Naturzustand zwischen den Staaten.", 0, "Höffe", "Das ist Höffes Einwand gegen Kants Bund, kein Grund Kants gegen den Weltstaat."]], "e": "Kants drei Gründe: erstens der Unwille der Staaten, zweitens der begriffliche Widerspruch eines Völkerstaats, drittens die Gefahr des „seelenlosen Despotism“. Gegen eine Weltdiktatur gäbe es keine Flucht und keinen Verbündeten mehr. In diesem Punkt gibt Höffe Kant recht: Ein homogener Weltstaat ginge zu weit."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Dritter Artikel: Besuchsrecht, nicht Gastrecht“", "f": "Ein Schiffbrüchiger strandet an einer fremden Küste. Was folgt aus Kants drittem Definitivartikel?", "a": [["Man darf ihn nicht abweisen, wenn das seinen Untergang bedeutet; ein Recht zu bleiben hat er aber nicht.", 1], ["Er hat ein Gastrecht: Der fremde Staat muss ihn aufnehmen und ihm erlauben, dauerhaft zu bleiben.", 0, null, "Ein Gastrecht, also einen Anspruch auf Aufnahme, gibt Kant ausdrücklich nicht; dafür braucht es einen besonderen Vertrag."], ["Man darf ihn sofort zurückschicken, weil er mit diesem Staat keinen Vertrag geschlossen hat.", 0, null, "Abweisen darf man nur, wenn es „ohne seinen Untergang“ geschehen kann. Den Schiffbrüchigen darf man nicht zurück ins Meer schicken."], ["Er hat nur dann Rechte, wenn sein Heimatstaat Mitglied im Friedensbund ist.", 0, null, null]], "e": "Hospitalität heißt bei Kant Besuchsrecht: Jeder Mensch darf nicht feindselig behandelt werden, wenn er fremden Boden betritt. „Es ist kein Gastrecht, worauf dieser Anspruch machen kann [...], sondern ein Besuchsrecht, welches allen Menschen zusteht.“ Eine Touristin hat ein Besuchsrecht; für einen Einwanderer, der bleiben will, braucht es eine Vereinbarung. Hier liegt eine Grenze: Geflüchtete schützt das Weltbürgerrecht nur minimal."}, {"teil": "Teil A · Kant", "nach": "Teil A, Abschnitt „Dritter Artikel: Besuchsrecht, nicht Gastrecht“", "f": "Wie begründet Kant das Besuchsrecht, das jedem Menschen zusteht?", "a": [["Die Erdoberfläche gehört ursprünglich allen gemeinsam, und auf einer Kugel können sich Menschen nicht unendlich zerstreuen.", 1], ["Wer seine Arbeit mit einem Stück Land mischt, macht es zu seinem Eigentum und darf es gegen Fremde verteidigen.", 0, "Locke", "Das ist Lockes Eigentumsbegründung. Sie erklärt privaten Besitz, nicht das Recht eines Fremden, Boden zu betreten."], ["Alle Menschen sind bereits Bürger einer Weltrepublik, die ihnen überall dieselben Bürgerrechte garantiert.", 0, null, null], ["Der Handel zwischen den Völkern steigert den Wohlstand aller, deshalb müssen Grenzen offen sein.", 0, null, "Den Handelsgeist nennt Kant im „Ersten Zusatz“ als Antrieb zum Recht, nicht als Begründung des Besuchsrechts."]], "e": "Weil niemand ursprünglich mehr Recht auf einen Ort hat als ein anderer, darf niemand einen Fremden feindselig behandeln, nur weil er fremden Boden betritt. Zugleich schränkt Kant das Weltbürgerrecht ausdrücklich auf diese Hospitalität ein. Er richtet den Artikel auch gegen die Kolonialmächte, die das Besuchsrecht als Vorwand für Eroberung missbrauchten."}, {"teil": "Teil B · Höffe", "nach": "Teil B, Abschnitt „Ein Bund ohne Schwert“", "f": "Warum ist Kants Friedensbund für Höffe nur ein „(modifizierter) Naturzustand“?", "a": [["Ohne „Schwert der Gerechtigkeit“ kann der Bund den Frieden nicht sichern und bleibt ein Waffenstillstand.", 1], ["Der Bund verschmilzt viele Völker zu einem einzigen Volk und hebt so das Völkerrecht auf.", 0, null, "Das verwechselt den Bund mit dem Völkerstaat: Diesen begrifflichen Einwand erhebt Kant gegen einen Völkerstaat, nicht Höffe gegen den Bund."], ["Im Bund verlieren die Staaten ihre gesamte Souveränität an eine übermächtige Zentrale.", 0, null, null], ["Vereinbarungen zwischen Staaten sind schlechter als offener Krieg, weil sie Schwäche zeigen.", 0, null, "Höffe sagt ausdrücklich, Vereinbarungen zwischen Staaten seien besser als Krieg; sie reichen nur nicht aus."]], "e": "Höffe kritisiert Kant mit dessen eigenen Begriffen: Nach Kants erstem Präliminarartikel ist ein Friede ohne Sicherung nur ein Waffenstillstand. Für die Sicherung des Weltfriedens „fehlen die geeigneten Instrumente“. Der große Entwurf wird so zur „halbherzigen Lösung“. Der Streit dreht sich um die Frage, ob es Frieden ohne eine Macht geben kann, die ihn erzwingt."}, {"teil": "Teil B · Höffe", "nach": "Teil B, Abschnitt „Das Böse zwischen den Staaten“", "f": "Welche Rolle spielt der Begriff des Bösen in Höffes Argument?", "a": [["Die „gewurzelte Bösartigkeit“ zeigt sich zwischen Staaten unverhohlen, weil dort äußerer Zwang fehlt; also braucht es Sanktionen.", 1], ["Das Böse verschwindet, sobald alle Staaten Republiken sind, weil die Bürger dann keinen Krieg mehr wollen.", 0, null, "Kant behauptet bei Republiken nur eine Neigung zum Frieden. Höffe betont ge

Descartes will „einmal im Leben alles von Grund auf umstürzen und ganz neu anfangen“. Hintergrund: Die Autoritäten der Scholastik (Bibel, Kirchenväter, Aristoteles) hatten sich durch Naturforscher wie Kopernikus und Galilei als fehlbar erwiesen. Vorbild ist die Mathematik, die mit wenigen sicheren Grundsätzen beginnt und daraus Schritt für Schritt alles Weitere ableitet."}, {"teil": "Teil A · Das Projekt", "nach": "Teil A, Abschnitt „Methodischer Zweifel statt Skepsis“", "f": "Worin unterscheidet sich Descartes' methodischer Zweifel vom Zweifel des Sextus Empiricus?", "a": [["Für Descartes ist der Zweifel ein Werkzeug, um Sicheres von Unsicherem zu trennen.", 1], ["Für Descartes ist der Zweifel ein Ziel, das am Ende zur Seelenruhe führt.", 0, "Sextus Empiricus", "Das ist die Haltung des Skeptikers. Descartes will beim Zweifel gerade nicht stehen bleiben."], ["Descartes zweifelt auch im Alltag und handelt nur nach völlig sicheren Meinungen.", 0, null, "Der Zweifel ist rein theoretisch: Im Handeln folgt Descartes auch ungewissen Meinungen, sonst könnte er gar nicht handeln."], ["Descartes zweifelt nur an den Sinnen, nicht an Mathematik und Logik.", 0]], "e": "Descartes nennt seinen Zweifel methodisch, weil er ein Mittel ist: Er verwirft alles, woran sich auch nur der geringste Zweifel denken lässt, um zu sehen, ob etwas völlig Sicheres übrig bleibt. Das folgt aus der ersten der vier Regeln: nur das annehmen, was gewiss ist. Für den Skeptiker ist der Zweifel dagegen ein Ziel, das zur Seelenruhe führt."}, {"teil": "Teil B · Der methodische Zweifel", "nach": "Teil B, Abschnitt „Zweite Stufe: Vielleicht träume ich“", "f": "Was lässt das Traumargument nach Descartes noch unberührt?", "a": [["Die Mathematik: Ob ich schlafe oder wache, zwei und drei geben zusammen fünf.", 1], ["Den eigenen Körper: Dass ich meine Hände vor mir sehe, kann der Traum nicht bezweifeln.", 0, null, "Genau das fällt beim Traum: Auch im Traum sitze ich am Tisch und sehe meine Hände. Unberührt bleibt das nur bei der ersten Stufe."], ["Die Außenwelt im Ganzen: Nur einzelne Wahrnehmungen unter schlechten Bedingungen werden fraglich.", 0, null, "Das beschreibt die erste Stufe (Stab im Wasser, Turm). Der Traum reicht weiter und macht die ganze Außenwelt zweifelhaft."], ["Die Erinnerung: Was ich heute Morgen erlebt habe, kann kein Traum gewesen sein.", 0]], "e": "Weil es kein sicheres Zeichen gibt, an dem ich Wachen und Träumen unterscheiden kann (P2), wird nicht nur die einzelne Wahrnehmung zweifelhaft, sondern die ganze Außenwelt, sogar der eigene Körper. Die Mathematik bleibt aber bestehen: „Denn ob ich schlafe oder wache: Zwei und drei geben zusammen fünf, und ein Quadrat hat nicht mehr als vier Seiten.“ Deshalb braucht Descartes eine dritte Stufe, den allmächtigen Täuscher."}, {"teil": "Teil B · Der methodische Zweifel", "nach": "Teil B, Abschnitt „Dritte Stufe: Der allmächtige Täuscher“", "f": "Welche Überzeugung wird erst durch den allmächtigen Täuscher (genius malignus) zweifelhaft?", "a": [["Ein Quadrat hat vier Seiten.", 1], ["Ich sitze hier am Tisch.", 0, null, "Das fällt schon beim Traum: Auch im Traum sitze ich am Tisch."], ["Der Turm dort ist rund.", 0], ["Ich denke gerade nach.", 0, null, "Das kann nicht einmal der Täuscher erschüttern: Um getäuscht zu werden, muss ich denken. Das ist das Cogito."]], "e": "Der böse Geist, der „all seinen Fleiß daran gewandt hat, mich zu täuschen“ (P3), könnte mich sogar beim einfachsten Rechnen und in der Geometrie irren lassen. Damit reicht der Zweifel weiter als der Traum, der die Mathematik übrig lässt. Eine moderne Fassung ist das Gehirn im Tank, sofern der Computer auch das Denken manipuliert. Descartes behauptet nicht, dass es den Täuscher gibt; es genügt, dass er ihn nicht ausschließen kann (K1)."}, {"typ": "arg", "teil": "Teil B · Der methodische Zweifel", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Descartes' Argument für den methodischen Zweifel?", "zeilen": [["P1", "Die Sinne täuschen uns manchmal."], ["P2", "Im Traum scheint die Wirklichkeit echt, ist aber Illusion. → Die ganze Außenwelt ist zweifelhaft."], ["P3", null], ["K1", "Alles ist zweifelhaft, solange eine Täuschung möglich ist."]], "a": [["Ein allmächtiger Täuscher könnte mich sogar in Mathematik und Logik täuschen.", 1], ["Auch wenn ich an allem zweifle, kann ich nicht bezweifeln, dass ich zweifle.", 0, null, "Das ist P4, der Beginn des Cogito (Teil C). Es führt aus dem Zweifel heraus, nicht weiter in ihn hinein."], ["Was ich klar und deutlich erkenne, ist wahr, denn ein vollkommener Gott täuscht nicht.", 0, null, "Das ist das Ergebnis von Teil D. Es kommt erst nach dem Cogito und würde K1 gerade widersprechen."], ["Der Geist ist bei der Geburt ein unbeschriebenes Blatt (tabula rasa).", 0, "Locke", null]], "e": "P3 ist die stärkste Stufe des Zweifels. Die Sinne (P1) und der Traum (P2) lassen die Mathematik noch übrig; erst der allmächtige Täuscher, ein Gott oder böser Geist (genius malignus), macht auch „2 + 3 = 5“ zweifelhaft. Daraus folgt K1. Den Täuscher gibt es erst in den Meditationen (1641); im Discours (1637) nennt Descartes Sinne, Fehlschlüsse und Traum."}, {"teil": "Teil C · Das Cogito", "nach": "Teil C, Abschnitt „Der Zweifel kann sich selbst nicht bezweifeln“", "f": "Warum hält der Satz „Ich denke, also bin ich“ sogar dem allmächtigen Täuscher stand?", "a": [["Um getäuscht zu werden, muss ich da sein und denken.", 1], ["Ein vollkommener Gott täuscht nicht, deshalb ist mein Dasein gesichert.", 0, null, "Gott als Garant kommt erst in Teil D. Das Cogito gilt schon vorher, sonst wäre es nicht das erste Fundament."], ["Das Cogito ist eine angeborene Idee, die der Täuscher nicht erreicht.", 0, null, "Das Cogito wird im Vollzug des Zweifelns gewonnen. Angeboren sind nur Begriffe wie „Denken“ und „Existenz“."], ["Meinen eigenen Körper spüre ich unmittelbar und ohne Täuschung.", 0]], "e": "Der Täuscher kann mich über alles täuschen, worüber ich nachdenke, aber nicht darüber, dass ich denke. Auch wer am Zweifel zweifelt, zweifelt, und Zweifeln ist eine Art des Denkens (P4). Daraus folgt K2: „Ich denke, also bin ich“ (cogito ergo sum). Descartes nennt den Satz „so fest und sicher, dass die ausgefallensten Unterstellungen der Skeptiker ihn nicht zu erschüttern vermöchten“."}, {"teil": "Teil C · Das Cogito", "nach": "Teil C, Abschnitt „Was das Cogito nicht erlaubt“", "f": "Welche Abwandlung des Cogito hält nach Descartes dem Zweifel stand?", "a": [["Ich werde getäuscht, also bin ich.", 1], ["Ich atme, also bin ich.", 0, null, "Atmen setzt einen Körper voraus, und der ist seit dem Traumargument zweifelhaft."], ["Ich dachte gestern, also bin ich.", 0, null, "Das setzt die Erinnerung voraus. Gewiss bin ich mir nur im gegenwärtigen Vollzug des Denkens."], ["René denkt, also ist er.", 0, null, "Über das Denken und die Existenz anderer kann ich nichts sicher wissen."]], "e": "Sicher ist nur, was im Moment des Denkens selbst gegeben ist. Getäuschtwerden ist wie Zweifeln eine Form des Denkens: Wer getäuscht wird, muss da sein. Die anderen Sätze setzen etwas voraus, das der Zweifel schon erschüttert hat: den Körper, die Erinnerung oder andere Menschen. Auch „Ich denke nicht, also bin ich auch nicht“ scheitert, denn wer denkt, er denke nicht, denkt."}, {"teil": "Teil C · Das Cogito", "nach": "Teil C, Abschnitt „Ein Schluss oder eine Einsicht?“", "f": "Was ist das Cogito nach Descartes' eigener Auskunft in seinen Antworten auf Einwände?", "a": [["Eine Intuition: Im Vollzug des Denkens sehe ich unmittelbar, dass ich bin.", 1], ["Ein Schluss aus der allgemeinen Prämisse „Alles, was denkt, existiert“.", 0, null, "So klingt das „also“. Descartes bestreitet es aber, denn diese Prämisse wäre selbst nicht bewiesen."], ["Eine angeborene Idee, die schon vor jedem Zweifel fertig im Geist liegt.", 0, null, "Angeboren sind nur die Begriffe im Cogito, etwa „Denken“ und „Existenz“. Das Cogito selbst wird im Zweifeln gewonnen."], ["Eine Idee der inneren Wahrnehmung, gewonnen durch Reflexion.", 0, "Locke", null]], "e": "Das Wort „also“ klingt nach einer Schlussfolgerung. Dann bräuchte das Cogito aber eine weitere Prämisse, „Alles, was denkt, existiert“, die selbst unbewiesen wäre. Descartes antwortet: Das Cogito ist eine Intuition, eine unmittelbare Einsicht der Vernunft, die keinen Beweis braucht. Ob das überzeugt, ist in der Forschung bis heute umstritten."}, {"teil": "Teil C · Das Cogito", "nach": "Teil C, Abschnitt „Lichtenbergs Einwand“", "f": "„Es denkt, sollte man sagen, so wie man sagt: es blitzt.“ Was bestreitet Lichtenberg damit?", "a": [["Dass aus dem Denken ein Ich folgt, das die Gedanken hat.", 1], ["Dass überhaupt Gedanken stattfinden, solange ein Täuscher möglich ist.", 0, null, "Das bestreitet Lichtenberg gerade nicht: Gewiss ist für ihn, dass Gedanken stattfinden."], ["Dass Gott die klaren Ideen garantiert, obwohl er mit ihnen bewiesen wird.", 0, null, "Das ist der cartesische Zirkel, ein anderer Einwand. Lichtenberg setzt früher an, beim Cogito selbst."], ["Dass ein immaterieller Geist auf den Körper einwirken kann.", 0]], "e": "Lichtenberg (1742-1799) hält schon das „Ich“ für zu viel: „Zu sagen cogito, ist schon zu viel, sobald man es durch Ich denke übersetzt.“ Gewiss ist nur, dass gedacht wird. Dass es ein Ich gibt, das die Gedanken hat, und dass dieses Ich eine denkende Substanz (res cogitans) ist, folgt daraus nicht. Descartes könnte antworten, dass jeder Gedanke als mein Gedanke erlebt wird."}, {"teil": "Teil D · Vom Cogito zum Wissen", "nach": "Teil D, Abschnitt „Klar und deutlich“", "f": "Wann ist eine Erkenntnis nach Descartes klar, wann deutlich?", "a": [["Klar, wenn sie sich unmittelbar im Bewusstsein zeigt; deutlich, wenn sie sich von allen anderen Vorstellungen unterscheiden lässt.", 1], ["Klar, wenn sie sich von allen anderen Vorstellungen unterscheiden lässt; deutlich, wenn sie sich unmittelbar im Bewusstsein zeigt.", 0, null, "Die Begriffe sind vertauscht. Klar heißt evident, deutlich heißt genau bestimmt."], ["Klar, wenn die Sinne sie unter guten Bedingungen bestätigen; deutlich, wenn sie sich in vielen Fällen wiederholt hat.", 0, null, "Das wären Kennzeichen der Erfahrung. Für Descartes liefern die Sinne nur verworrene Eindrücke."], ["Klar, wenn eine anerkannte Autorität sie lehrt; deutlich, wenn sie sich mit den übrigen Lehren der Tradition verträgt.", 0]], "e": "Klar heißt evident: Die Erkenntnis zeigt sich unmittelbar. Deutlich heißt so genau bestimmt, dass sie sich von allen anderen Vorstellungen unterscheiden lässt. Beispiel aus dem Kapitel: Ich erkenne klar, dass ein Dreieck drei Seiten hat; deutlich ist die Erkenntnis, wenn ich „dreiseitig“ so bestimmen kann, dass sich das Dreieck eindeutig vom Viereck unterscheidet. Aus diesem Merkmal des Cogito macht Descartes ein allgemeines Kriterium der Wahrheit."}, {"teil": "Teil D · Vom Cogito zum Wissen", "nach": "Teil D, Abschnitt „Das Stück Wachs“", "f": "Was zeigt Descartes' Argument mit dem Stück Wachs, und was zeigt es nicht?", "a": [["Es zeigt, dass wir Körper durch den Verstand erkennen, beweist aber nicht, dass es das Wachs gibt.", 1], ["Es beweist, dass das Wachs existiert, weil es auch nach dem Schmelzen dasselbe Wachs bleibt.", 0, null, "Die Existenz des Wachses ist damit nicht bewiesen. Dafür braucht Descartes erst Gott als Garanten."], ["Es zeigt, dass wir Körper durch die Einbildungskraft erfassen, weil wir uns ihre Formen vorstellen.", 0, null, "Die Einbildungskraft scheidet aus: Das Wachs kann mehr Formen annehmen, als ich mir je vorstellen kann."], ["Es zeigt, dass die Sinne das Wesen der Körper zuverlässig erfassen, wenn wir genau hinsehen.", 0]], "e": "Am Feuer ändern sich Geschmack, Duft, Härte, Form und Klang, und doch sagt jeder, es sei dasselbe Wachs. Weder die Sinne noch die Einbildungskraft erfassen, was gleich bleibt: „etwas Ausgedehntes, Biegsames, Veränderliches“. Das erfasst allein der Verstand durch einen „geistigen Einblick“. Außerdem zeigt das Wachs, dass der eigene Geist leichter zu erkennen ist als jeder Körper, denn jedes Urteil über das Wachs ist selbst ein Denken."}, {"teil": "Teil D · Vom Cogito zum Wissen", "nach": "Teil D, Abschnitt „Gott als Garant“", "f": "Kritiker werfen Descartes einen Zirkel vor. Worin besteht der cartesische Zirkel?", "a": [["Gott soll die klaren und deutlichen Ideen garantieren, wird aber selbst mit klaren und deutlichen Ideen bewiesen.", 1], ["Der Beweis, dass die Zukunft der Vergangenheit gleicht, setzt schon voraus, was er beweisen soll.", 0, "Hume", "Das ist der Zirkel aus Humes Induktionsproblem. Er betrifft Erfahrungsschlüsse, nicht Gott."], ["Das Cogito setzt mit dem Wort „also“ schon voraus, dass ich existiere, und beweist es danach noch einmal.", 0], ["Der methodische Zweifel bezweifelt am Ende sich selbst und hebt sich dadurch wieder vollständig auf.", 0, null, "Der Zweifel hebt sich nicht auf: Wer am Zweifel zweifelt, zweifelt, und gerade das führt zum Cogito."]], "e": "Descartes braucht Gott, um vom sicheren Ich zur Außenwelt zurückzukehren: Die Idee eines vollkommenen Wesens kann nicht von mir stammen, weil ich endlich und unvollkommen bin; ein vollkommener Gott täuscht nicht, denn Täuschung ist ein Mangel. Also ist wahr, was ich klar und deutlich erkenne. Der Gottesbeweis stützt sich aber selbst auf klare und deutliche Ideen. So hängt die Rettung der Außenwelt an einem Beweis, der voraussetzt, was er sichern soll."}, {"teil": "Exkurs", "nach": "Exkurs 1 „Angeborene Ideen bei Descartes“", "f": "Zu welcher Art von Ideen gehört nach Descartes die Idee eines Einhorns?", "a": [["Selbstgebildete Idee (factae)", 1], ["Von außen kommende Idee (adventitiae)", 0, null, "Dazu gehört etwa „es ist warm“. Ein Einhorn ist mir nie von außen begegnet."], ["Angeborene Idee (innatae)", 0], ["Komplexe Idee aus einfachen Ideen", 0, "Locke", "So erklärt Locke das Einhorn (Pferd + Horn). Gefragt ist Descartes' Einteilung."]], "e": "Descartes unterscheidet angeborene Ideen (innatae, z. B. Gott, Zahl, Wahrheit), von außen kommende Ideen (adventitiae, z. B. „es ist warm“) und selbstgebildete Ideen (factae, z. B. ein Einhorn). Nur die angeborenen Ideen haben für ihn den Charakter absoluter Gewissheit. Sie sind keine Erinnerungen an eine frühere Welt wie bei Platon, sondern Strukturen und Begriffe, die das Denken von sich aus bereitstellt."}, {"typ": "offen", "teil": "Teil D · Vom Cogito zum Wissen", "nach": "Teil D, Abschnitt „Gott als Garant“", "f": "Warum braucht Descartes Gott, um vom Cogito zur Außenwelt zurückzukehren? Welches Problem entsteht dabei?", "m": "Das Cogito sichert nur das eigene Denken. Solange der böse Geist möglich ist, könnte sogar das klar und deutlich Erkannte falsch sein; es droht der Solipsismus: Sicher bin nur ich als denkendes Wesen. Descartes findet in sich die Idee eines vollkommenen, unendlichen Wesens. Sie kann nicht von ihm stammen, weil er endlich und unvollkommen ist und das Größere nicht aus dem Kleineren entstehen kann. Also existiert Gott. Ein vollkommener Gott täuscht nicht, denn Täuschung ist ein Mangel. Deshalb ist wahr, was ich klar und deutlich erkenne, und die Außenwelt existiert. Das Problem ist der cartesische Zirkel: Gott soll die klaren und deutlichen Ideen garantieren, wird aber selbst mit klaren und deutlichen Ideen bewiesen. Wer den Gottesbeweis nicht akzeptiert, bleibt beim Ich stehen."}]}, {"id": "et-descartes-phil2", "tf": "ET", "gruppe": "Zweifel und Gewissheit", "kapitel": "Zweifel und Gewissheit (PHIL2)", "titel": "Descartes", "sub": "Gibt es etwas, woran ich nicht zweifeln kann?", "kurse": ["2"], "fragen": [{"teil": "Teil A · Warum zweifeln?", "nach": "Teil A, Abschnitt „Was der Skeptiker behauptet und was nicht“", "f": "Was behauptet der Skeptiker über unsere Sinne?", "a": [["Weil sie manchmal täuschen und wir nicht immer erkennen, wann, ist keine Wahrnehmung völlig sicher.", 1], ["Weil sie immer täuschen, ist alles falsch, was wir mit Augen, Ohren und Händen wahrnehmen.", 0, null, "Das sagt der Skeptiker gerade nicht. Es genügt ihm, dass die Sinne manchmal täuschen."], ["Weil sie täuschen, muss man auch im Alltag an allem zweifeln, bevor man irgendetwas tut.", 0, null, "Im Alltag zweifeln wir nur, wenn wir einen konkreten Grund haben. Der philosophische Zweifel ist grundsätzlich."], ["Weil sie täuschen, liefert allein die Vernunft sicheres Wissen über die Welt.", 0, "Descartes", null]], "e": "Der Skeptizismus (griechisch skeptesthai, prüfen, genau hinsehen) argumentiert: Unser Wissen beruht auf Sinneswahrnehmung und Denken (P1), beide sind fehlbar (P2), also gibt es keinen absolut sicheren Maßstab für Wahrheit (K). Ein Stab im Wasser sieht geknickt aus, und wir verrechnen uns, obwohl wir sicher waren. Gemeint ist also nicht, dass alles falsch ist, sondern dass wir nie völlig sicher sein können."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „Was ist ein skeptisches Szenario?“", "f": "Was ist bei einem skeptischen Szenario entscheidend?", "a": [["Ob wir es sicher ausschließen können.", 1], ["Ob es wahrscheinlich ist.", 0, null, "Wie wahrscheinlich die Geschichte ist, spielt keine Rolle. Es reicht, dass wir sie nicht ausschließen können."], ["Ob es schon einmal passiert ist.", 0], ["Ob ein Realitätstest es entlarvt.", 0]], "e": "Ein skeptisches Szenario ist eine Geschichte, nach der viele oder fast alle unsere Überzeugungen falsch wären, obwohl sich für uns alles genauso anfühlen würde wie jetzt. Deshalb hilft der Einwand nicht, ein Gehirn im Tank sei doch sehr unwahrscheinlich. Die Szenarien bilden eine Leiter: S1 Sinnestäuschung, S2 Traum, S3 großer Täuscher; jede Stufe reicht weiter als die vorige."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „S2 Traum“", "f": "Bei welcher Stufe der Leiter fällt die Überzeugung „Ich habe heute Morgen gefrühstückt“ zuerst?", "a": [["S2 Traum", 1], ["S1 Sinnestäuschung", 0, null, "Sinnestäuschungen betreffen einzelne Wahrnehmungen unter ungünstigen Bedingungen, etwa den Turm aus der Ferne."], ["S3 großer Täuscher", 0, null, "Der Täuscher würde sie auch erschüttern, aber sie fällt schon eine Stufe früher."], ["bei keinem Szenario", 0]], "e": "Woher weißt du, dass du gefrühstückt hast? Aus der Erinnerung. Auch die Erinnerung könnte aber geträumt sein. Mit dem Traumargument fallen die ganze Außenwelt, der eigene Körper und die Erinnerung: „Ich habe zwei Hände“ ebenso wie „Ich habe heute Morgen gefrühstückt“. Es gibt kein sicheres Zeichen, an dem ich Wachen und Träumen unterscheide."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „S3 Der große Täuscher“", "f": "Warum reicht Descartes der Traum nicht, sodass er den großen Täuscher braucht?", "a": [["Auch im Traum ergeben 2 und 3 zusammen 5; erst ein Täuscher macht sogar das Rechnen zweifelhaft.", 1], ["Träume sind meist unlogisch, deshalb erkennt man sie beim genauen Hinsehen fast immer sofort.", 0, null, "Im Traum halten wir das Geträumte meist für wirklich. Es gibt kein sicheres Zeichen, an dem ich Wachen und Träumen unterscheide."], ["Der Traum macht nur einzelne Wahrnehmungen fraglich, aber noch nicht den eigenen Körper.", 0, null, "Das beschreibt S1. Mit dem Traum fallen schon die ganze Außenwelt und der eigene Körper."], ["Erst der Täuscher zeigt, dass wir wirklich in einem Tank liegen; der Traum zeigt das noch nicht.", 0]], "e": "Jede Stufe der Leiter reicht weiter. Der Traum erschüttert Außenwelt, Körper und Erinnerung, aber nicht die Mathematik, denn im Traum rechne ich gleich. Erst ein allmächtiger böser Geist, der mich so geschaffen hat, dass ich mich sogar beim einfachsten Rechnen irre, macht „2 + 3 = 5“ zweifelhaft. Das Gehirn im Tank reicht so weit wie der Täuscher, wenn der Computer auch mein Denken manipuliert; spielt er nur Bilder und Gefühle ein, reicht es so weit wie der Traum."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „S3 Der große Täuscher“", "f": "Bei welcher Stufe fällt die Überzeugung „Mir scheint gerade, dass ich etwas Rotes sehe“?", "a": [["bei keinem Szenario", 1], ["S1 Sinnestäuschung", 0, null, "Vielleicht ist da gar nichts Rotes. Behauptet wird aber nur, wie es mir vorkommt, und darin kann mich keine Täuschung irren lassen."], ["S2 Traum", 0], ["S3 großer Täuscher", 0]], "e": "Der Satz sagt nichts über die Welt, sondern nur, wie es mir gerade vorkommt. Ob das Rote wirklich da ist, ob ich träume oder getäuscht werde: Dass es mir so scheint, bleibt wahr. Unberührt von allen Szenarien bleiben nur zwei Sätze: „Mir scheint, dass ...“ und „Ich existiere“."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „Nur in der Theorie, nicht im Alltag“", "f": "Was tut Descartes beim „Tun und Lassen“, also im Alltag?", "a": [["Er folgt auch sehr ungewissen Meinungen, als wären sie unzweifelhaft.", 1], ["Er handelt erst, wenn er sich einer Meinung ganz sicher ist.", 0, null, "Wer erst handeln will, wenn er sich ganz sicher ist, könnte gar nicht mehr leben."], ["Er verwirft alle Meinungen als falsch und hält sich mit dem Handeln zurück.", 0, null, "Verwerfen will Descartes nur bei der Suche nach Wahrheit, nicht beim Handeln."], ["Er folgt nur den Meinungen, die jedem Zweifel standgehalten haben.", 0]], "e": "Descartes sagt gleich zu Beginn, dass man beim „Tun und Lassen“ auch Meinungen folgen muss, die „sehr ungewiss“ sind, „als wären sie unzweifelhaft“. Nur bei der Suche nach Wahrheit will er „all das als völlig falsch verwerfen“, wofür er sich „nur den geringsten Zweifel ausdenken könnte“. Er hält seine Meinungen also nicht für falsch, er lässt nur gelten, was „gänzlich unbezweifelbar“ ist. Diesen Zweifel als Werkzeug nennt man den methodischen Zweifel."}, {"teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „Kann ich testen, ob ich träume?“", "f": "Du kneifst dich, um zu prüfen, ob du träumst. Warum hilft das nach dem Kapitel nicht?", "a": [["Auch der Schmerz könnte geträumt oder eingespielt sein.", 1], ["Im Traum spürt man keinen Schmerz, deshalb wäre ein Traum zu leicht zu entlarven.", 0, null, "Dann wäre Kneifen ja ein sicherer Test. Das Problem ist, dass auch der Schmerz zum Traum gehören könnte."], ["Es ist grundsätzlich unvernünftig, den eigenen Sinnen zu vertrauen.", 0, null, "Das folgt nicht: Etwas nicht beweisen können ist nicht dasselbe wie einen guten Grund zum Zweifeln haben."], ["Der Täuscher kann nur das Rechnen verfälschen, nicht das Fühlen.", 0]], "e": "Kein Realitätstest, ob Kneifen, einen Satz zweimal lesen, die Freundin fragen oder nachrechnen, schließt Traum oder Täuscher sicher aus, denn auch das Ergebnis des Tests könnte geträumt oder eingespielt sein. Daraus folgt aber nicht, dass es unvernünftig ist, den eigenen Händen zu vertrauen. Man muss unterscheiden: „Ich kann es nicht sicher beweisen“ stimmt, „Ich habe einen guten Grund, daran zu zweifeln“ stimmt nicht."}, {"teil": "Teil C · Ich denke, also bin ich", "nach": "Teil C, Abschnitt „Der Zweifel kann sich selbst nicht bezweifeln“", "f": "Warum kann selbst der große Täuscher den Satz „Ich denke, also bin ich“ nicht erschüttern?", "a": [["Um getäuscht zu werden, muss ich da sein und denken.", 1], ["Weil der Satz so oft bestätigt wurde, dass er inzwischen sicher ist.", 0, null, "Die Gewissheit kommt nicht aus vielen Fällen. Sie zeigt sich in jedem einzelnen Moment des Denkens."], ["Weil ich meinen Körper spüre, solange ich nachdenke.", 0, null, "Der Körper ist schon seit dem Traum zweifelhaft. Deshalb hält „Ich atme, also bin ich“ nicht stand."], ["Weil der Täuscher nur die Sinne, nicht das Denken täuschen kann.", 0, null, "Der Täuscher kann sogar das Rechnen verfälschen. Er kann mich nur nicht darüber täuschen, dass ich denke."]], "e": "Descartes: „Alsbald aber fiel mir auf, dass, während ich auf diese Weise zu denken versuchte, alles sei falsch, doch notwendig ich, der es dachte, etwas sei.“ Der Täuscher kann mich über alles täuschen, worüber ich nachdenke, aber nicht darüber, dass ich denke. Auch wer am Zweifel zweifelt, zweifelt, und Zweifeln ist eine Form des Denkens. Nach Descartes ist das „also“ eigentlich kein Schluss, sondern eine Intuition, eine unmittelbare Einsicht."}, {"teil": "Teil C · Ich denke, also bin ich", "nach": "Teil C, Abschnitt „Wie weit reicht die Gewissheit?“", "f": "Welcher Satz hält dem Zweifel nicht stand?", "a": [["Ich dachte gestern nach, also bin ich.", 1], ["Ich träume gerade, also bin ich.", 0, null, "Dieser Satz hält stand: Auch Träumen ist ein Erleben im Bewusstsein, und wer träumt, existiert."], ["Ich werde getäuscht, also bin ich.", 0], ["Ich zweifle gerade, also bin ich.", 0]], "e": "Der Satz setzt die Erinnerung voraus, und die könnte geträumt sein. Gewiss bin ich mir nur jetzt, während ich denke. Ebenso scheitern „Ich atme, also bin ich“ (setzt einen Körper voraus) und „René denkt, also ist er“ (über das Denken anderer weiß ich nichts sicher). Zweifeln und Getäuschtwerden sind dagegen Formen des Denkens, Träumen ist ein Erleben im Bewusstsein."}, {"typ": "arg", "teil": "Teil D · Das Stück Wachs", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Descartes' Wachs-Argument?", "zeilen": [["P1", "Alle Eigenschaften, die ich mit den Sinnen wahrnehme, haben sich am Feuer verändert."], ["P2", "Trotzdem ist es noch dasselbe Stück Wachs."], ["P3", null], ["K", "Also erfasse ich, was das Wachs ist, allein durch den Verstand."]], "a": [["Was gleich bleibt, ist nur etwas Ausgedehntes, Biegsames, Veränderliches, das ich mir nicht bildhaft vorstellen kann.", 1], ["Was gleich bleibt, sind Farbe, Duft und Härte, die ich mit den Sinnen nach dem Abkühlen wieder wahrnehme.", 0, null, "Nach P1 haben sich gerade alle Sinneseigenschaften verändert. Sie können nicht das sein, was gleich bleibt."], ["Was gleich bleibt, ist die Form des Wachses, die ich mir in der Einbildung ganz genau vorstellen kann.", 0, null, "Die Einbildung scheidet aus: Das Wachs kann mehr Formen und Größen annehmen, als ich mir je vorstellen kann."], ["Wer über das Wachs nachdenkt, der muss auch existieren, und das kann kein Täuscher bezweifeln.", 0]], "e": "P3 ist der Kern: Wenn man alles abzieht, was nicht zum Wachs gehört, bleibt „lediglich etwas Ausgedehntes, Biegsames, Veränderliches“. Das lässt unzählige Veränderungen zu, darum erfassen es weder die Sinne noch die Einbildung. Es bleibt der Verstand mit seinem „geistigen Einblick“. Descartes: „So erfasse ich also das, was ich mit den Augen zu sehen meinte, in Wahrheit nur durch das Urteilsvermögen, welches meinem Geiste innewohnt.“"}, {"teil": "Teil D · Das Stück Wachs", "nach": "Teil D, Abschnitt „Verworren oder klar und deutlich“", "f": "Wann erfasst man das Wachs nach Descartes klar und deutlich statt verworren?", "a": [["Wenn man darauf achtet, was es eigentlich ist: ein ausgedehnter Körper mit vielen möglichen Zuständen.", 1], ["Wenn man ganz genau auf Farbe, Duft und Form achtet, also auf das, was sich gerade zeigt.", 0, null, "Das ist gerade die verworrene Auffassung: Sie bleibt bei der Erscheinung stehen."], ["Wenn man das Wachs nicht nur ansieht, sondern auch betastet, riecht und beim Klopfen hört.", 0, null, "Mehr Sinne machen die Erkenntnis nicht klarer. Alle Sinneseigenschaften haben sich am Feuer verändert."], ["Wenn man sich alle Formen, die das Wachs annehmen kann, nacheinander bildhaft vorstellt.", 0]], "e": "Der „geistige Einblick“ kann verworren oder klar und deutlich sein, je nachdem, worauf ich achte. Verworren ist er, wenn ich nur auf die Erscheinung achte. Klar und deutlich ist er, wenn ich erfasse, was das Wachs ist. Daraus folgt noch etwas: Wer über das Wachs urteilt, denkt dabei immer. Deshalb kann Descartes sagen, dass er „nichts leichter und evidenter wahrnehmen kann“ als seinen eigenen Geist."}, {"typ": "offen", "teil": "Teil B · Die Leiter der skeptischen Szenarien", "nach": "Teil B, Abschnitt „Kann ich testen, ob ich träume?“", "f": "Ist es unvernünftig, darauf zu vertrauen, dass du zwei Hände hast? Begründe mit dem Traumargument und mit Descartes' Haltung im Alltag.", "m": "Nach dem Traumargument kann ich nicht sicher wissen, dass ich zwei Hände habe: Auch im Traum sehe ich meine Hände, und es gibt kein sicheres Zeichen, an dem ich Wachen und Träumen unterscheide. Kein Realitätstest hilft, denn auch sein Ergebnis könnte geträumt sein. Daraus folgt aber nicht, dass mein Vertrauen unvernünftig ist. Man muss unterscheiden: Ich kann es nicht sicher beweisen, aber ich habe keinen guten Grund, daran zu zweifeln. Auch Descartes zweifelt nur in der Theorie, bei der Suche nach einem absolut sicheren Fundament. Beim „Tun und Lassen“ folgt er auch ungewissen Meinungen, als wären sie unzweifelhaft, weil man sonst gar nicht leben könnte. Es ist also vernünftig, den eigenen Händen zu vertrauen, auch wenn es nicht absolut gewiss ist."}]}, {"id": "et-empirismus", "tf": "ET", "gruppe": "Vernunft oder Erfahrung", "kapitel": "Der Empirismus - Locke und Hume", "titel": "Locke und Hume", "sub": "Alles Material des Denkens stammt aus der Erfahrung", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Was Locke ‚Idee‘ nennt“", "f": "Was nennt Locke eine „Idee“?", "a": [["Alles, was der Geist denkt oder wahrnimmt, etwa gelb, Wärme oder zweifeln.", 1], ["Ein unveränderliches Urbild, das in einer eigenen Welt jenseits der Sinne existiert.", 0, "Platon", "Das sind Platons Ideen. Locke grenzt seinen Begriff ausdrücklich davon ab."], ["Eine Vorstellung wie Gott oder Zahl, die der Verstand schon bei der Geburt mitbringt.", 0, "Descartes", "Das sind Descartes' angeborene Ideen. Genau die bestreitet Locke."], ["Eine Vorstellung, die nur dann zählt, wenn sie klar und deutlich erkannt wird.", 0]], "e": "Lockes Begriff ist sehr weit: Idee ist alles, was der Geist denkt oder wahrnimmt, die Farbe Gelb, die Empfindung Wärme, der Gedanke an einen Freund, die Tätigkeit des Zweifelns. Das ist etwas anderes als Platons Ideen (unveränderliche Urbilder) und als Descartes' angeborene Ideen. Lockes Frage im Versuch über den menschlichen Verstand (1690) lautet: Woher hat der Verstand all dieses Material?"}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Gegen die angeborenen Ideen“", "k": "4", "f": "Mit welchem Argument bestreitet Locke, dass es angeborene Ideen gibt?", "a": [["Dann müssten alle Menschen sie kennen, auch kleine Kinder; das ist offensichtlich nicht so.", 1], ["Ein vollkommener Gott würde uns keine Ideen eingeben, über die wir uns täuschen können.", 0, null, "Gott als Garant der klaren und deutlichen Ideen ist ein Gedanke von Descartes. Lockes Argument setzt bei den Kindern an."], ["Angeborene Ideen wären Erinnerungen an ein früheres Leben, und das lässt sich nicht beweisen.", 0, null, "Erinnerung an eine frühere Welt ist Platons Lehre. Lockes Argument setzt bei den Kindern an."], ["Die Sinne täuschen uns manchmal, also kann auch der Verstand nichts Sicheres mitbringen.", 0]], "e": "Wären Ideen wie die Idee Gottes oder die Grundsätze der Logik angeboren, müssten alle Menschen sie kennen, auch kleine Kinder und Menschen, die nie zur Schule gegangen sind. Ein Kleinkind weiß aber nichts vom Satz des Widerspruchs, und die Vorstellungen von Gott unterscheiden sich von Kultur zu Kultur. Darum gleicht der Geist bei der Geburt einem unbeschriebenen Blatt, einer tabula rasa (eigentlich: abgeschabte Wachstafel), das erst die Erfahrung beschreibt."}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Zwei Quellen: Sensation und Reflexion“", "f": "Woher hat ein Mensch nach Locke die Idee „zweifeln“?", "a": [["Aus der Reflexion: Er beobachtet die Tätigkeit seines eigenen Geistes.", 1], ["Aus der Sensation: Er sieht, wie andere Menschen zweifeln.", 0, null, "Zweifeln kann man bei anderen nicht sehen. Man kennt es, weil man selbst schon gezweifelt hat."], ["Sie ist angeboren: Der Geist bringt sie wie die Idee des Denkens schon mit.", 0, "Descartes", "Descartes hält das Denken für eine angeborene Idee. Locke bestreitet gerade, dass es angeborene Ideen gibt."], ["Durch Abstraktion aus vielen verschiedenen Sinneseindrücken.", 0]], "e": "Erfahrung hat bei Locke zwei Quellen. Die Sensation ist die äußere Wahrnehmung durch die Sinne (gelb, heiß, bitter, süß). Die Reflexion ist die innere Wahrnehmung der eigenen Geistestätigkeit (wahrnehmen, denken, zweifeln, glauben, wollen). Die Reflexion ist kein sechster Sinn, sondern die Beobachtung des eigenen Geistes. Locke: „Woher hat er all das Material für seine Vernunft und seine Erkenntnis? Ich antworte darauf mit einem einzigen Worte: aus der Erfahrung.“"}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Der Ideen-Baukasten“", "f": "Wie verhält sich der Geist nach Locke?", "a": [["Einfache Ideen empfängt er passiv, komplexe bildet er aktiv durch Verbinden, Vergleichen und Abstrahieren.", 1], ["Er ist ganz passiv, wie ein Blatt Papier, auf das die Erfahrung alle Ideen fertig schreibt.", 0, null, "Das Bild der tabula rasa gilt nur für den Anfang. Der Geist arbeitet mit den einfachen Ideen wie mit einem Baukasten."], ["Er ist aktiv und kann aus eigener Kraft auch neue einfache Ideen erschaffen, die er nie erfahren hat.", 0, null, "Keine einzige einfache Idee kann der Geist selbst erschaffen. Wer nie Ananas gegessen hat, dem kann man ihren Geschmack nicht beschreiben."], ["Er bringt Ideen wie Gott, Zahl oder Substanz mit und ordnet mit ihnen die Sinneseindrücke.", 0, "Descartes", null]], "e": "Einfache Ideen wie rot, süß, fest lassen sich nicht weiter zerlegen; der Geist empfängt sie passiv. Aus ihnen bildet er aktiv alle übrigen: durch Verbinden (Apfel = rot + rund + süß + fest; Einhorn = Pferd + Horn), Vergleichen (Ideen von Beziehungen wie „größer als“) und Abstrahieren (allgemeine Ideen wie Dreieck oder Mensch). Dabei bleibt er aber „an die einfachen Ideen gebunden“, die aus Sensation und Reflexion stammen."}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Primäre und sekundäre Qualitäten“", "k": "4", "f": "Was soll Lockes Experiment mit kaltem, warmem und lauwarmem Wasser zeigen?", "a": [["Die Wärme, wie wir sie empfinden, ist in uns, nicht im Wasser; sie ist eine sekundäre Qualität.", 1], ["Weil die Sinne uns täuschen, müssen wir alles verwerfen, woran sich zweifeln lässt.", 0, "Descartes", "Locke zieht keinen allgemeinen Zweifel daraus. Er unterscheidet, was im Ding ist und was nur in uns."], ["Auch Ausdehnung und Gestalt existieren nur als Ideen in uns, nicht in den Dingen.", 0, "Berkeley", "Das ist Berkeleys radikale Folgerung. Für Locke sind Ausdehnung und Gestalt primäre Qualitäten im Ding selbst."], ["Temperatur ist eine primäre Qualität, die zum Wasser selbst gehört und sich messen lässt.", 0]], "e": "Dasselbe lauwarme Wasser fühlt sich für die eine Hand warm, für die andere kalt an. Dasselbe Wasser kann aber nicht zugleich warm und kalt sein. Also ist die empfundene Wärme in uns. Primäre Qualitäten wie Festigkeit, Ausdehnung, Gestalt, Bewegung und Zahl gehören zum Körper selbst (ein Weizenkorn behält beim Teilen Ausdehnung und Gestalt). Sekundäre Qualitäten wie Farbe, Ton, Geschmack und Wärme sind im Ding nur Kräfte, in uns Empfindungen hervorzurufen."}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Das Molyneux-Problem“", "f": "Ein Blindgeborener wird operiert und sieht zum ersten Mal eine Kugel und einen Würfel. Was antwortet Locke auf Molyneux' Frage?", "a": [["Nein: Er kennt Kugel und Würfel nur aus dem Tasten; wie sie aussehen, muss er erst lernen.", 1], ["Ja: Der Verstand erkennt die Form sofort wieder, auch ganz ohne vorherige Seherfahrung.", 0, "Rationalismus", "Das würde ein Rationalist erwarten. Für Locke stammen die Ideen „Kugel“ und „Würfel“ beim Blinden nur aus dem Tasten."], ["Ja: Gestalt ist eine primäre Qualität im Ding selbst, also sieht er sie sofort.", 0, null, "Dass Gestalt im Ding ist, heißt nicht, dass man Gesehenes und Ertastetes ohne Erfahrung verbinden kann."], ["Nein: Weil die Sinne täuschen, kann er seinem neuen Sehen überhaupt nicht trauen.", 0]], "e": "Die Antwort hängt davon ab, woher unser Wissen kommt. Locke sagt Nein: Der geheilte Blinde muss erst durch Erfahrung lernen, Gesehenes und Ertastetes miteinander zu verbinden. Ein Rationalist würde dagegen erwarten, dass der Verstand die Form sofort wiedererkennt. Eine Studie von 2011 mit Menschen, die nach einer Operation zum ersten Mal sehen konnten, stützt Lockes Antwort; sie lernten die Zuordnung aber schon nach wenigen Tagen."}, {"teil": "Teil A · Locke", "nach": "Teil A, Abschnitt „Was Locke erklärt und wo er an Grenzen stößt“", "k": "4", "f": "Womit vergleicht Leibniz den menschlichen Geist, um Locke zu widersprechen?", "a": [["Mit einem Marmorblock, dessen Adern die Gestalt einer Figur schon vorzeichnen.", 1], ["Mit einer abgeschabten Wachstafel, die erst die Erfahrung nach und nach beschreibt.", 0, "Locke", "Das ist Lockes tabula rasa, also genau die Position, gegen die Leibniz sich wendet."], ["Mit einem Korb voller Äpfel, die man einzeln prüfen und sortieren muss.", 0, "Descartes", null], ["Mit einem Baukasten, in dem aus wenigen Teilen viele Formen entstehen.", 0, null, "Der Baukasten ist Lockes eigenes Bild für das Bilden komplexer Ideen."]], "e": "Leibniz ergänzt den Grundsatz der Empiristen „Nichts ist im Verstand, was nicht vorher in den Sinnen war“ um den Zusatz „außer dem Verstand selbst“. Der Geist ist für ihn kein leeres Blatt: Der Bildhauer, also die Erfahrung, legt nur frei, was im Marmor schon angelegt ist. Leibniz trifft eine Grenze Lockes: Die Reflexion ist keine Sinneswahrnehmung, und wenn auch sie als „Erfahrung“ gilt, nähert sich der Empirismus dem Rationalismus wieder an."}, {"teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Das Kopierprinzip“", "f": "Ein Philosoph redet von der „notwendigen Verknüpfung“ zwischen Ursache und Wirkung. Was fragt Hume als Erstes?", "a": [["Von welchem Eindruck stammt diese Idee?", 1], ["Erkenne ich diese Idee klar und deutlich?", 0, "Descartes", "Das ist Descartes' Wahrheitskriterium. Hume prüft Ideen an ihrer Herkunft aus Eindrücken."], ["Ist diese Idee allen Menschen angeboren?", 0], ["Folgt diese Idee aus dem Begriff „Ursache“?", 0]], "e": "Nach dem Kopierprinzip sind alle Ideen, die schwächeren Perzeptionen, nur Kopien von Eindrücken, den lebhaften Perzeptionen beim Sehen, Hören, Fühlen oder Wollen. Das macht das Prinzip zu einem Prüfwerkzeug: Findet sich zu einer Idee kein Eindruck, ist sie verdächtig. Genau so prüft Hume die Idee der notwendigen Verknüpfung und findet keinen Eindruck, von dem sie stammen könnte."}, {"teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Humes Gabel“", "f": "„Brot macht satt.“ Was liegt nach Humes Gabel vor?", "a": [["Eine Tatsache: Sie ist nur aus Erfahrung bekannt, und ihr Gegenteil ist ohne Widerspruch denkbar.", 1], ["Eine Beziehung der Ideen: Sie ist durch bloßes Denken gewiss, und ihr Gegenteil wäre ein Widerspruch.", 0, null, "Dass Brot morgen nicht mehr satt macht, ist ohne Widerspruch denkbar. Bei 3 x 5 = 30 : 2 wäre das Gegenteil widersprüchlich."], ["Eine Tatsache, die nach unzähligen bestätigten Fällen inzwischen notwendig und gewiss geworden ist.", 0, null, "Tatsachen werden durch noch so viele Fälle nie notwendig. Ihr Gegenteil bleibt immer denkbar."], ["Ein Satz ohne Erfahrungsgrundlage, den man als „Sophisterei und Blendwerk“ den Flammen übergeben soll.", 0]], "e": "Hume teilt alle Aussagen in zwei Klassen. Beziehungen der Ideen (Mathematik, Logik) sind durch bloßes Denken gewiss, ihr Gegenteil ist ein Widerspruch. Tatsachen (Die Sonne geht morgen auf, Feuer verbrennt, Brot macht satt) kennen wir nur aus Erfahrung, ihr Gegenteil ist immer denkbar, sie sind nie notwendig. Hume: „Dass die Sonne morgen nicht aufgehen werde, ist ein ebenso verständlicher und widerspruchsfreier Satz als die Behauptung: dass sie aufgehen werde.“"}, {"teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Sehen wir Ursachen?“", "f": "Was sehen wir nach Hume, wenn eine Billardkugel eine zweite anstößt?", "a": [["Ein Nacheinander und, nach vielen Fällen, eine regelmäßige Verbindung.", 1], ["Die Kraft, mit der die erste Kugel die zweite notwendig bewegen muss.", 0, null, "Genau diese Notwendigkeit sehen wir nie. Nach dem Kopierprinzip fehlt der Eindruck, von dem sie stammen könnte."], ["Eine notwendige Verknüpfung, die schon Adam beim ersten Stoß erkannt hätte.", 0, null, "Adam hätte mit vollkommenem Verstand, aber ohne Erfahrung keine einzige Wirkung vorhersagen können."], ["Nur Farben und Formen; die Bewegung selbst erschließt erst der Verstand.", 0]], "e": "Über das gerade Wahrgenommene kommen wir nur durch die Beziehung von Ursache und Wirkung hinaus, und die kennen wir nicht durch bloßes Denken: Adam könnte aus der Durchsichtigkeit des Wassers nicht schließen, dass er darin ersticken würde. Auch die Erfahrung zeigt weniger, als wir glauben: Wir sehen, dass erst die eine und dann die andere Kugel rollt, und nach vielen Fällen eine regelmäßige Verbindung. Die notwendige Verknüpfung selbst sehen wir nie."}, {"typ": "arg", "teil": "Teil B · Hume", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Humes Argument zum Induktionsproblem?", "zeilen": [["P1", "Alle Schlüsse über nicht wahrgenommene Tatsachen stützen sich auf Ursache und Wirkung."], ["P2", "Ursache und Wirkung kennen wir nur aus Erfahrung, nicht a priori."], ["P3", "Jeder Erfahrungsschluss setzt voraus, dass die Zukunft der Vergangenheit gleicht."], ["P4", null], ["K", "Unser Schluss auf die Zukunft beruht nicht auf Vernunft, sondern auf Gewohnheit. Das ist das Induktionsproblem."]], "a": [["Das lässt sich weder durch Denken beweisen (kein Widerspruch im Gegenteil) noch durch Erfahrung (Zirkel).", 1], ["Das lässt sich durch Erfahrung beweisen, denn bisher glich die Zukunft immer der Vergangenheit.", 0, null, "Dieser Beweis „dreht sich im Zirkel“: Er setzt voraus, was er beweisen soll."], ["Das wissen wir durch eine angeborene Idee, die der Verstand schon vor aller Erfahrung besitzt.", 0, "Descartes", "Angeborene Ideen lehnen die Empiristen gerade ab."], ["Das lässt sich durch bloßes Denken beweisen, denn das Gegenteil wäre ein Widerspruch.", 0, null, "Das Gegenteil ist kein Widerspruch: Es ist denkbar, dass das Brot morgen nicht mehr satt macht."]], "e": "P4 begründet, warum der Schluss auf die Zukunft keine Leistung der Vernunft ist. Durch bloßes Denken lässt sich die Voraussetzung nicht beweisen, weil ihr Gegenteil keinen Widerspruch enthält. Durch Erfahrung auch nicht, denn das hieße: Die Zukunft war bisher immer wie die Vergangenheit, also wird sie es auch künftig sein. Ein solcher Beweis „dreht sich im Zirkel“. Daraus folgt K: Wir erwarten die Wirkung aus Gewohnheit, einer Art natürlichem Instinkt."}, {"teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Das Induktionsproblem“", "f": "„Nichts gleicht sich so wie Eier; aber Niemand erwartet [...] denselben Wohlgeschmack bei allen.“ Was soll das Beispiel zeigen?", "a": [["Wäre der Schluss eine Leistung der Vernunft, müsste er schon beim ersten Fall gelten; er wird aber erst durch viele Fälle stark.", 1], ["Dinge, die sich äußerlich gleichen, haben immer auch dieselben inneren Eigenschaften, und das erkennt die Vernunft sofort.", 0, null, "Das Gegenteil ist gemeint: Die Ähnlichkeit allein bringt uns noch nicht dazu, denselben Geschmack zu erwarten."], ["Geschmack ist eine sekundäre Qualität, die nur in uns liegt; deshalb schmecken gleiche Eier für jeden anders.", 0, "Locke", "Die Unterscheidung der Qualitäten stammt von Locke. Hume geht es hier um den Schluss von früheren auf künftige Fälle."], ["Die Sinne täuschen uns, denn Eier, die gleich aussehen, schmecken in Wirklichkeit oft ganz unterschiedlich gut.", 0]], "e": "Die Vernunft braucht keine Wiederholung: Ein mathematischer Beweis gilt beim ersten Mal. Der Erfahrungsschluss dagegen wird erst nach einer langen Reihe von Einzelfällen stark. Bei den Eiern erwarten wir trotz großer Ähnlichkeit nicht sofort denselben Geschmack, erst nach langer Erfahrung. Das ist ein weiteres Indiz dafür, dass unsere Erwartungen auf Gewohnheit beruhen und nicht auf Vernunft."}, {"teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Humes Lösung: Gewohnheit“", "f": "Ein Truthahn wird jeden Morgen gefüttert und ist sich mit jedem Tag sicherer, dass es so weitergeht, bis zum Morgen vor dem Fest. Was zeigt das Beispiel?", "a": [["Wie riskant eine Erwartung ist, die nur auf Gewohnheit beruht.", 1], ["Dass Tiere anders als Menschen nicht aus Erfahrung lernen.", 0, null, "Der Truthahn lernt ja aus Erfahrung, genau wie wir. Darin liegt das Problem."], ["Dass genug Fälle am Ende doch ein sicheres Wissen ergeben.", 0, null, "Gerade nach den meisten Fällen ist der Truthahn am sichersten und irrt sich trotzdem."], ["Dass auch Beziehungen der Ideen nur auf Gewohnheit beruhen.", 0]], "e": "Nach vielen gleichen Fällen wird der Geist „durch Gewohnheit getrieben“, die Wirkung zu erwarten. Dieser Glaube ist keine Leistung der Vernunft, sondern eine Art natürlicher Instinkt. Hume empfiehlt trotzdem nicht, der Erfahrung zu misstrauen: Wir können gar nicht anders, als ihr zu folgen. Er nennt das einen gemilderten Skeptizismus. Bertrand Russells Truthahn zeigt, wie riskant diese Gewohnheit sein kann."}, {"typ": "offen", "teil": "Teil B · Hume", "nach": "Teil B, Abschnitt „Sehen wir Ursachen?“", "f": "Was kann Adam, der erste Mensch mit vollkommenem Verstand, aber ohne jede Erfahrung, wissen, und was nicht? Erkläre mit Humes Gabel, warum.", "m": "Adam könnte wissen, dass die Winkelsumme im Dreieck 180 Grad beträgt, denn das ist eine Beziehung der Ideen: Sie wird durch bloßes Denken erkannt, unabhängig von der Welt, und ihr Gegenteil wäre ein Widerspruch. Er könnte aber nicht wissen, dass er im Wasser ersticken würde oder dass das Feuer brennt. Das sind Tatsachen über Ursache und Wirkung. Ihr Gegenteil ist ohne Widerspruch denkbar, deshalb kann der Verstand sie nicht aus den sichtbaren Eigenschaften des Wassers oder Feuers ableiten. Kenntnis von Ursache und Wirkung stammt nach Hume nur aus Erfahrung, wenn wir sehen, dass Gegenstände beständig miteinander verbunden sind. Selbst dann sehen wir nur ein Nacheinander und eine regelmäßige Verbindung, nie die Notwendigkeit selbst."}]}, {"id": "et-kant", "tf": "ET", "gruppe": "Vernunft oder Erfahrung", "kapitel": "Immanuel Kant - Kritizismus", "titel": "Kant", "sub": "Alle Erkenntnis fängt mit der Erfahrung an, aber nicht alle entspringt aus ihr", "kurse": ["4"], "fragen": [{"teil": "Teil A · Kants Frage", "nach": "Teil A, Abschnitt „Ein Streit ohne Sieger“", "f": "Warum kann Kant den Empirismus Humes nicht einfach übernehmen?", "a": [["Dann wären auch die Mathematik und die Grundsätze der Naturwissenschaft nicht begründet.", 1], ["Seine Behauptungen über Gott, Seele und Welt widersprechen sich und lassen sich nicht prüfen.", 0, null, "Das ist Kants Einwand gegen den Rationalismus, die Metaphysik als „Kampfplatz endloser Streitigkeiten“."], ["Hume bestreitet, dass unsere Erkenntnis überhaupt mit der Erfahrung anfängt.", 0, null, "Dass alle Erkenntnis mit der Erfahrung anfängt, sagen Hume und Kant gleichermaßen."], ["Hume hält am Ende doch an angeborenen Ideen wie Gott und Substanz fest.", 0]], "e": "Kant sieht beide Seiten in einer Sackgasse. Die Rationalisten erkennen angeblich aus eigener Kraft auch Gott, Seele und Welt im Ganzen, aber ihre Behauptungen lassen sich nicht prüfen. Hume hat gezeigt: Erfahrung zeigt nur, was bisher war, nie, was sein muss. Dann wären auch Mathematik und Naturwissenschaft nicht begründet, und das kann Kant nicht hinnehmen, denn Newtons Physik funktioniert offensichtlich. Hume habe ihn aus dem „dogmatischen Schlummer“ geweckt."}, {"teil": "Teil A · Kants Frage", "nach": "Teil A, Abschnitt „Mit der Erfahrung, aber nicht aus ihr“", "f": "Ein Kind lernt mit Äpfeln auf dem Tisch, dass 7 + 5 = 12 ist. Was zeigt das Beispiel nach Kant?", "a": [["Die Erkenntnis fängt mit Erfahrung an, aber ihre Geltung hängt nicht von den Äpfeln ab.", 1], ["Mathematik stammt aus der Erfahrung und gilt nur, solange man beim Nachzählen keine Ausnahme findet.", 0, null, "Das Kind muss gerade nicht jedes Mal nachzählen, um sicher zu sein."], ["Die Zahl 12 liegt schon im Kopf bereit, und die Äpfel erinnern nur an sie.", 0, "Platon", "Erinnerung an schon Gewusstes ist Platons Gedanke. Kant lehnt angeborene Ideen ab."], ["Rechnen ist eine Gewohnheit, die erst durch viele gleiche Fälle entsteht.", 0]], "e": "„Dass alle unsere Erkenntnis mit der Erfahrung anfange, daran ist gar kein Zweifel.“ Ohne Sinneseindrücke käme unser Erkennen nie in Gang. Daraus folgt aber nicht, dass alles in unserer Erkenntnis aus der Erfahrung stammt. Dass 7 + 5 = 12 ist, hängt nicht von den Äpfeln ab. Kants Vermutung: Unser Erkenntnisvermögen bringt selbst etwas mit, das zu den Sinneseindrücken hinzukommt."}, {"teil": "Teil A · Kants Frage", "nach": "Teil A, Abschnitt „A priori und a posteriori“", "f": "Woran erkennt man nach Kant eine Erkenntnis a priori?", "a": [["An Notwendigkeit und strenger Allgemeinheit.", 1], ["Daran, dass sie angeboren ist und schon vor jeder Erfahrung im Kopf liegt.", 0, null, "A priori heißt nicht „angeboren“. Es geht nicht darum, wann etwas in den Kopf kommt, sondern worauf seine Geltung beruht."], ["Daran, dass sie bisher ohne jede Ausnahme bestätigt wurde.", 0, null, "Das ist nur vergleichsweise Allgemeinheit aus der Erfahrung: „Alle Schwäne sind weiß“ galt, bis jemand einen schwarzen fand."], ["Daran, dass sie klar und deutlich erkannt wird.", 0, "Descartes", null]], "e": "Erfahrung lehrt, „dass etwas so oder so beschaffen sei, aber nicht, dass es nicht anders sein könne“. Was als notwendig gedacht wird, stammt also nicht aus der Erfahrung. Und Erfahrung gibt nur eine vergleichsweise Allgemeinheit: Bisher gab es keine Ausnahme. Was in strenger Allgemeinheit gilt, ohne jede mögliche Ausnahme, ist a priori. Erkenntnis a posteriori stammt dagegen aus der Erfahrung, etwa ob es heute in Junglinster regnet."}, {"teil": "Teil A · Kants Frage", "nach": "Teil A, Abschnitt „Die Matrix der Urteile“", "f": "Welches dieser Urteile ist nach Kant analytisch?", "a": [["Jede Wirkung hat eine Ursache.", 1], ["Alles, was geschieht, hat eine Ursache.", 0, null, "Im Begriff „Geschehen“ steckt keine Ursache. Dieses Urteil ist synthetisch a priori."], ["Alle Körper sind schwer.", 0, null, "Gewicht steckt nicht im Begriff „Körper“. Das Urteil erweitert unser Wissen."], ["7 + 5 = 12", 0]], "e": "In einem analytischen Urteil ist das Prädikat schon im Begriff des Subjekts enthalten; das Urteil erläutert nur. Eine Wirkung ist per Definition etwas Verursachtes. Weitere Beispiele: „Alle Junggesellen sind unverheiratet“, „Alle Körper sind ausgedehnt“. Ein synthetisches Urteil fügt etwas Neues hinzu und erweitert unser Wissen. Achte auf den feinen Unterschied zum synthetischen Satz „Alles, was geschieht, hat eine Ursache“."}, {"teil": "Teil A · Kants Frage", "nach": "Teil A, Abschnitt „Das Argument für das dritte Feld“", "f": "Warum ist „7 + 5 = 12“ nach Kant ein synthetisches Urteil?", "a": [["Die 12 steckt nicht im Begriff „Summe von 7 und 5“; man muss etwas tun, etwa weiterzählen.", 1], ["Man lernt Rechnen mit Äpfeln, also stammt das Ergebnis letztlich aus der Erfahrung.", 0, null, "Das verwechselt synthetisch mit a posteriori. Der Satz gilt notwendig, also a priori."], ["Sein Gegenteil ist ohne Widerspruch denkbar, wie bei jeder Tatsache über die Welt.", 0, "Hume", "Das ist Humes Merkmal für Tatsachen. Für Hume ist Mathematik eine Beziehung der Ideen, und auch Kant hält den Satz für notwendig."], ["Zahlen sind angeborene Ideen, die die Vernunft im Rechnen miteinander verbindet.", 0, "Descartes", null]], "e": "Synthetisch heißt: Das Prädikat fügt etwas hinzu, was im Subjektbegriff nicht enthalten ist. Bei großen Zahlen merkt man das deutlich: Dass 3.587 + 2.968 = 6.555 ist, sieht man dem Begriff nicht an. Zugleich gilt der Satz notwendig und streng allgemein, also a priori. Damit gehört er ins dritte Feld der Matrix, das Hume nicht kannte: synthetische Urteile a priori."}, {"typ": "arg", "teil": "Teil A · Kants Frage", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Kants Argument für synthetische Urteile a priori?", "zeilen": [["P1", "Sätze wie „Alles, was geschieht, hat eine Ursache“ oder 7 + 5 = 12 gelten notwendig und streng allgemein."], ["P2", "Was notwendig und streng allgemein gilt, ist a priori."], ["P3", null], ["K", "Also gibt es synthetische Urteile a priori. → Kants Grundfrage: Wie sind sie möglich?"]], "a": [["Diese Sätze erweitern unser Wissen; sie sind synthetisch.", 1], ["Diese Sätze erläutern nur, was im Subjektbegriff schon steckt.", 0, null, "Dann wären die Sätze analytisch, und die Konklusion folgte nicht."], ["Was aus Erfahrung stammt, gilt nie notwendig und allgemein.", 0, null, "Das stimmt für Kant, steckt aber schon in P2. Für „synthetisch“ fehlt noch ein Schritt."], ["Die Gegenstände richten sich nach unserer Erkenntnis.", 0, null, "Das ist Kants Antwort auf die Grundfrage (Teil B), keine Prämisse dafür, dass es solche Urteile gibt."]], "e": "P1 und P2 zeigen, dass die Sätze a priori sind. Erst P3 zeigt, dass sie synthetisch sind: Im Begriff „Geschehen“ steckt keine Ursache, und in „Summe von 7 und 5“ steckt die 12 nicht einfach drin. Beides zusammen ergibt das dritte Feld. Daraus folgt die Grundfrage der Kritik der reinen Vernunft: Wie sind synthetische Urteile a priori möglich? Was Subjekt und Prädikat verbindet, wenn es weder der Begriff noch die Erfahrung ist, nennt Kant das „Unbekannte = X“."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Die kopernikanische Wende“", "f": "Worin besteht Kants kopernikanische Wende?", "a": [["Nicht die Erkenntnis richtet sich nach den Gegenständen, sondern die Gegenstände nach unserer Erkenntnis.", 1], ["Nicht die Gegenstände richten sich nach unserer Erkenntnis, sondern die Erkenntnis nach den Gegenständen.", 0, null, "Das ist genau die bisherige Annahme. Unter ihr bleibt Wissen a priori unerklärlich."], ["Nicht die Welt steht im Mittelpunkt, sondern das denkende Subjekt, das sich seine Welt frei erfindet.", 0, null, "Kant behauptet nicht, dass wir die Welt erfinden. Den Stoff der Erkenntnis liefern die Sinne."], ["Nicht die Vernunft, sondern allein die Erfahrung ist die Quelle aller unserer Erkenntnis.", 0]], "e": "Kopernikus kam nicht weiter, solange er annahm, alle Sterne drehten sich um den Zuschauer; er versuchte es umgekehrt. Kant schlägt für die Erkenntnistheorie dieselbe Umkehrung vor. Solange sich die Erkenntnis nach den Gegenständen richten muss, kann ich nicht vorher wissen, wie ein Gegenstand beschaffen sein muss. Richten sich die Gegenstände nach unserer Erkenntnis, wird Wissen a priori erklärbar: Was zu den Bedingungen unseres Erkennens gehört, gilt notwendig für jeden Gegenstand, den wir erkennen können."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Stoff und Form“", "f": "Was soll Kants Vergleich mit den Regeln des Schachspiels verdeutlichen?", "a": [["Die Form bringen wir mit; darum wissen wir im Voraus, dass jede Erfahrung ihr folgt.", 1], ["Die Regeln entdeckt man erst, wenn man sehr viele Partien genau beobachtet.", 0, null, "Gerade nicht: Die Regeln findet man nicht, indem man die Figuren untersucht."], ["Wir erfinden die Welt wie ein Spiel, dessen Regeln wir beliebig ändern können.", 0, null, "Kant behauptet nicht, dass wir die Welt erfinden. Den Stoff liefern die Sinne."], ["Wer die Regeln kennt, braucht keine Figuren: Das Denken erkennt die Welt allein.", 0]], "e": "Den Stoff der Erkenntnis liefern die Sinne, die Form, in der er uns erscheint und in der wir ihn denken, bringen wir mit. Ohne Regeln gäbe es keine Schachpartie, und jede Partie folgt ihnen notwendig. Deshalb weiß ein Schachspieler im Voraus, dass ein Läufer nie die Feldfarbe wechselt. Ebenso wissen wir im Voraus, dass alles, was wir je erfahren werden, räumlich, zeitlich und ursächlich verknüpft sein wird."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Sinnlichkeit und Verstand“", "f": "Ein Laie sieht auf einem Röntgenbild genau dasselbe wie die Ärztin, erkennt aber den Knochenbruch nicht. Was liegt nach Kant vor?", "a": [["Eine blinde Anschauung: Ihm fehlen die Begriffe.", 1], ["Ein leerer Gedanke: Ihm fehlt die Anschauung.", 0, null, "Die Anschauung hat der Laie ja, er sieht dasselbe Bild. Leer sind Gedanken ohne Anschauung, etwa über „die Seele“."], ["Eine Sinnestäuschung: Sein Auge zeigt Falsches.", 0], ["Ein Ding an sich: Der Bruch ist unerkennbar.", 0, null, "Die Ärztin erkennt den Bruch, er ist also Erscheinung und erkennbar."]], "e": "„Gedanken ohne Inhalt sind leer. Anschauungen ohne Begriffe sind blind.“ Die Sinnlichkeit ist empfänglich (Rezeptivität): Durch sie wird uns ein Gegenstand in Anschauungen gegeben. Der Verstand ist selbsttätig (Spontaneität): Durch ihn wird der Gegenstand in Begriffen gedacht. Keine kann die Arbeit der anderen übernehmen. Damit antwortet Kant beiden Seiten: dem Rationalismus, dass Denken ohne Anschauung nichts erkennt, dem Empirismus, dass Eindrücke ohne Begriffe noch keine Erkenntnis sind."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Raum und Zeit: Formen der Anschauung“", "f": "Man kann sich alle Dinge aus dem Raum wegdenken, aber nicht den Raum selbst. Was folgt daraus nach Kant?", "a": [["Raum und Zeit sind die Formen, in denen uns überhaupt etwas erscheint.", 1], ["Raum und Zeit sind Eigenschaften, die wir an allen Dingen ablesen.", 0, null, "Dann könnte man sie mit den Dingen wegdenken. Kant schließt das Gegenteil."], ["Raum und Zeit sind Kategorien des Verstandes, wie die Kausalität.", 0, null, "Kategorien sind Formen des Denkens. Raum und Zeit sind Formen der Anschauung, sie gehören zur Sinnlichkeit."], ["Raum und Zeit sind Ideen, die aus der Erfahrung abstrahiert werden.", 0]], "e": "Raum und Zeit sind keine Eigenschaften, die wir an den Dingen ablesen, sondern die Formen, in denen uns überhaupt etwas erscheint: Anschauungsformen. Darum gilt die Geometrie, die Lehre vom Raum, notwendig für alles Räumliche, und die Arithmetik, die auf dem Nacheinander des Zählens beruht, für alles, was sich zählen lässt. So wird verständlich, wie Mathematik synthetisch und a priori zugleich sein kann."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Kategorien: Formen des Denkens“", "f": "Wie antwortet Kant auf Humes Kritik am Begriff der Ursache?", "a": [["Die Notwendigkeit liest man nicht an den Dingen ab; sie ist eine feste Regel des Verstandes.", 1], ["Die notwendige Verknüpfung entsteht aus Gewohnheit, nachdem man viele gleiche Fälle gesehen hat.", 0, "Hume", "Das ist Humes eigene Erklärung. Kant gibt Hume nur darin recht, dass man die Notwendigkeit nicht an den Dingen sieht."], ["Wer genau hinsieht, beobachtet die Kraft, mit der eine Kugel die andere bewegt.", 0, null, "Darin hatte Hume für Kant recht: Die Notwendigkeit lesen wir nicht an den Dingen ab."], ["Kausalität gilt notwendig auch für die Dinge an sich, unabhängig von unserer Erfahrung.", 0]], "e": "Die Kausalität ist eine der zwölf Kategorien, sie gehört zur Gruppe der Relation. Wenn wir Erscheinungen als Ursache und Wirkung verbinden, folgen wir einer Regel unseres Verstandes. Ohne diese Regel könnten wir nicht zwischen einem bloßen Nacheinander in der Wahrnehmung und einem wirklichen Geschehen in der Welt unterscheiden. Deshalb gilt „Alles, was geschieht, hat eine Ursache“ notwendig für alle Erfahrung, aber nur für Erscheinungen."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Erscheinung und Ding an sich“", "f": "Warum führt das Bild einer „roten Sonnenbrille, die wir nicht abnehmen können“ nach dem Kapitel in die Irre?", "a": [["Eine Brille verfälscht; Kants Formen machen Erfahrung erst möglich, und einen Blick ohne sie gibt es nicht.", 1], ["Weil Erscheinungen bloßer Schein sind, den jeder Mensch durch seine eigene Brille anders sieht.", 0, null, "Erscheinung heißt nicht Schein: Was uns erscheint, ist objektiv gültig und für alle Menschen gleich."], ["Weil wir die Brille mit genug Übung des Verstandes doch abnehmen und die Dinge an sich erkennen können.", 0, null, "Die Dinge an sich können wir denken, aber nicht erkennen."], ["Weil die Brille nur Farben verändert, Kants Formen aber nur die Gestalt der Dinge betreffen.", 0]], "e": "Wir erkennen die Dinge nur, wie sie uns in Raum und Zeit erscheinen und wie wir sie durch die Kategorien denken, als Erscheinungen. Wie sie an sich sind, unabhängig von jeder möglichen Erfahrung, können wir denken, aber nicht erkennen. Erscheinung ist kein Schein, sondern objektiv und für alle gleich. Bei einer Brille könnte man die Welt mit und ohne sie vergleichen; bei Kants Formen geht das nicht, weil sie Erfahrung erst möglich machen."}, {"teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Die Grenze der Vernunft“", "f": "Warum gibt es nach Kant kein theoretisches Wissen über Gott, die unsterbliche Seele und die Welt als Ganzes?", "a": [["Sie können nie in Raum und Zeit erscheinen, und Wissen reicht nur so weit wie mögliche Erfahrung.", 1], ["Weil die Vorstellungen von Gott sich von Kultur zu Kultur unterscheiden und nicht angeboren sind.", 0, "Locke", "Mit diesem Argument bestreitet Locke angeborene Ideen. Kants Grenze folgt aus den Bedingungen möglicher Erfahrung."], ["Weil man solche Ideen nur durch Gewohnheit bildet, nachdem man sie oft gehört hat.", 0], ["Weil die Vernunft sie zwar klar, aber nie deutlich von anderen Vorstellungen unterscheiden kann.", 0, null, "Klar und deutlich ist Descartes' Wahrheitskriterium; Kant argumentiert mit Raum, Zeit und Erfahrung."]], "e": "Synthetische Urteile a priori gelten notwendig, aber nur für Erscheinungen, also für alles, was uns in der Erfahrung begegnen kann. Gott, Seele und Welt als Ganzes können nie in Raum und Zeit erscheinen. Hier erklärt sich der „Kampfplatz“ der Metaphysik: Die Vernunft hat versucht, über die Grenze möglicher Erfahrung hinaus zu erkennen. Kant nennt seine Untersuchung deshalb eine Kritik (griechisch krinein, unterscheiden), seine Position heißt Kritizismus."}, {"typ": "offen", "teil": "Teil B · Kants Antwort", "nach": "Teil B, Abschnitt „Die kopernikanische Wende“", "f": "Erkläre, warum die kopernikanische Wende Kants Grundfrage „Wie sind synthetische Urteile a priori möglich?“ beantworten kann.", "m": "Kants Grundfrage lautet: Wie kann es Wissen geben, das notwendig gilt und trotzdem etwas Neues über die Welt sagt, etwa 7 + 5 = 12 oder „Alles, was geschieht, hat eine Ursache“? Solange man annimmt, dass sich die Erkenntnis nach den Gegenständen richtet, ist das unerklärlich, denn ich kann nicht vorher wissen, wie ein Gegenstand beschaffen sein muss, den ich noch nicht kenne. Kant kehrt das um wie Kopernikus: Die Gegenstände richten sich, sofern wir sie erkennen, nach unserer Erkenntnis. Den Stoff liefern die Sinne, die Form bringen wir mit: Raum und Zeit als Anschauungsformen, die Kategorien wie Kausalität als Formen des Denkens. Was zu diesen Bedingungen gehört, gilt notwendig für alles, was uns je erscheinen kann. Darum ist Mathematik synthetisch a priori und das Kausalprinzip gilt für alle Erfahrung. Der Preis: Dieses Wissen gilt nur für Erscheinungen, nicht für die Dinge an sich."}]}, {"id": "et-vergleich", "tf": "ET", "gruppe": "Vernunft oder Erfahrung", "kapitel": "Descartes, Locke, Hume, Kant", "titel": "Im Vergleich", "sub": "Vernunft oder Erfahrung?", "kurse": ["4", "2"], "fragen": [{"teil": "Wer sagt das?", "nach": "Kapitel Empirismus, Teil A, Abschnitt „Zwei Quellen: Sensation und Reflexion“", "f": "„Woher hat er all das Material für seine Vernunft und seine Erkenntnis? Ich antworte darauf mit einem einzigen Worte: aus der Erfahrung.“", "a": [["Locke", 1], ["Hume", 0, null, "Hume teilt den Grundsatz, spricht aber von Eindrücken und Ideen. Die Frage nach dem Material des Verstandes stellt Locke im Versuch über den menschlichen Verstand."], ["Descartes", 0], ["Kant", 0, null, "Kant sagt nur, dass alle Erkenntnis mit der Erfahrung anfängt, nicht, dass alles aus ihr stammt."]], "e": "Locke begründet damit den Empirismus: Der Geist ist bei der Geburt ein unbeschriebenes Blatt (tabula rasa), und alles Material des Denkens stammt aus zwei Quellen der Erfahrung, der Sensation (äußere Wahrnehmung) und der Reflexion (Wahrnehmung der eigenen Geistestätigkeit). Er richtet sich damit gegen Descartes' angeborene Ideen."}, {"teil": "Wer sagt das?", "nach": "Kapitel Empirismus, Teil B, Abschnitt „Das Kopierprinzip“", "f": "„Alle unsere Ideen oder schwächeren Perzeptionen sind nur Kopien unserer Eindrücke.“", "a": [["Hume", 1], ["Locke", 0, null, "Locke spricht von einfachen und komplexen Ideen aus Sensation und Reflexion. Die Unterscheidung von Eindrücken und Ideen als Kopien stammt von Hume."], ["Descartes", 0], ["Platon", 0]], "e": "Das ist Humes Kopierprinzip. Eindrücke sind die lebhaften Perzeptionen beim Sehen, Hören, Fühlen oder Wollen, Ideen ihre schwächeren Abbilder. Selbst ein goldenes Gebirge setzt sich aus Bekanntem zusammen. Das Prinzip wird zum Prüfwerkzeug: Von welchem Eindruck stammt diese Idee? Für die notwendige Verknüpfung von Ursache und Wirkung findet Hume keinen."}, {"teil": "Wer sagt das?", "nach": "Kapitel Empirismus, Teil B, Abschnitt „Humes Gabel“", "f": "„Dass die Sonne morgen nicht aufgehen werde, ist ein ebenso verständlicher und widerspruchsfreier Satz als die Behauptung: dass sie aufgehen werde.“", "a": [["Hume", 1], ["Descartes", 0, null, "Descartes zweifelt an der Außenwelt mit Traum und Täuscher, nicht mit der Frage, ob das Gegenteil widerspruchsfrei denkbar ist."], ["Locke", 0], ["Kant", 0]], "e": "Der Satz zeigt Humes Gabel: Tatsachen wie der Sonnenaufgang sind nur aus Erfahrung bekannt, ihr Gegenteil ist immer ohne Widerspruch denkbar, deshalb sind sie nie notwendig. Beziehungen der Ideen wie in der Mathematik sind dagegen durch bloßes Denken gewiss. Daraus entwickelt Hume das Induktionsproblem: Unser Schluss auf die Zukunft beruht auf Gewohnheit."}, {"teil": "Wer sagt das?", "nach": "Kapitel Descartes, Teil D, Abschnitt „Das Stück Wachs“ (PHIL2: Kapitel Zweifel und Gewissheit, Teil D, Abschnitt „Nicht die Sinne, sondern der Verstand“)", "f": "Sinngemäß: Was ich mit den Augen zu sehen meinte, erfasse ich in Wahrheit durch das Urteilsvermögen meines Geistes.", "a": [["Descartes", 1], ["Kant", 0, null, "Auch Kant betont den Verstand, aber nur im Zusammenwirken mit der Sinnlichkeit. Der Satz ist Descartes' Ergebnis aus dem Wachs-Argument."], ["Locke", 0], ["Hume", 0]], "e": "Mit diesem Gedanken schließt Descartes das Wachs-Argument in der Zweiten Meditation ab: Alle Sinneseigenschaften des Wachses ändern sich am Feuer, und doch ist es dasselbe Wachs. Was gleich bleibt, „etwas Ausgedehntes, Biegsames, Veränderliches“, erfasst allein der Verstand durch einen „geistigen Einblick“. Das ist Rationalismus: Sichere Erkenntnis stammt aus der Vernunft, nicht aus den Sinnen."}, {"teil": "Wer sagt das?", "nach": "Kapitel Kant, Teil A, Abschnitt „Mit der Erfahrung, aber nicht aus ihr“", "k": "4", "f": "„Dass alle unsere Erkenntnis mit der Erfahrung anfange, daran ist gar kein Zweifel.“", "a": [["Kant", 1], ["Locke", 0, null, "Der Satz klingt empiristisch, ist aber der Anfang der Einleitung zur Kritik der reinen Vernunft. Kant fährt fort: Nicht alle Erkenntnis entspringt aus der Erfahrung."], ["Hume", 0], ["Descartes", 0]], "e": "Mit diesem Satz beginnt Kant die Einleitung der Kritik der reinen Vernunft (1781). Er gibt den Empiristen recht, dass ohne Sinneseindrücke unser Erkennen nie in Gang käme. Daraus folgt für ihn aber nicht, dass alles in unserer Erkenntnis aus der Erfahrung stammt: Notwendigkeit und strenge Allgemeinheit sind Kennzeichen von Erkenntnis a priori."}, {"teil": "Wer sagt das?", "nach": "Kapitel Kant, Teil B, Abschnitt „Sinnlichkeit und Verstand“", "k": "4", "f": "„Gedanken ohne Inhalt sind leer. Anschauungen ohne Begriffe sind blind.“", "a": [["Kant", 1], ["Descartes", 0, null, "Für Descartes erfasst allein der Verstand, was das Wachs ist. Der Satz richtet sich gerade gegen ein Denken ohne Anschauung."], ["Hume", 0], ["Locke", 0]], "e": "Kant nennt zwei Grundquellen der Erkenntnis: Durch die Sinnlichkeit wird uns ein Gegenstand gegeben, durch den Verstand wird er gedacht. Keine kann die Arbeit der anderen übernehmen. Damit antwortet er beiden Seiten des Streits: dem Rationalismus, dass Denken ohne Anschauung nichts erkennt, dem Empirismus, dass Eindrücke ohne Begriffe noch keine Erkenntnis sind."}, {"teil": "Vergleich · Descartes und Locke", "nach": "Kapitel Empirismus, Teil A, Abschnitt „Das Molyneux-Problem“", "f": "Ein Blindgeborener, der Kugel und Würfel nur ertastet hat, kann plötzlich sehen. Wie würden ein Rationalist und Locke antworten, ob er sie allein durch Hinsehen unterscheidet?", "a": [["Rationalist: Ja, der Verstand erkennt die Form sofort wieder. Locke: Nein, Sehen muss erst gelernt werden.", 1], ["Rationalist: Nein, ohne Erfahrung weiß der Verstand nichts. Locke: Ja, die Gestalt ist im Ding selbst.", 0, null, "Die Positionen sind vertauscht. Für Locke stammen die Ideen „Kugel“ und „Würfel“ beim Blinden nur aus dem Tasten."], ["Rationalist: Nein, weil die Sinne täuschen. Locke: Nein, weil der Geist eine tabula rasa ist.", 0, null, "Der Rationalist würde dem Verstand gerade zutrauen, die Form ohne neue Erfahrung zu erkennen."], ["Beide: Ja, denn Gestalt und Ausdehnung erkennt jeder Mensch mit dem Verstand sofort.", 0]], "e": "Die Antwort hängt davon ab, woher unser Wissen kommt. Ein Rationalist erwartet, dass der Verstand die Form sofort wiedererkennt. Locke sagt Nein: Der geheilte Blinde muss erst durch Erfahrung lernen, Gesehenes und Ertastetes zu verbinden. Eine Studie von 2011 stützt Lockes Antwort; die Menschen lernten die Zuordnung aber schon nach wenigen Tagen."}, {"teil": "Vergleich · Descartes und Locke", "nach": "Kapitel Empirismus, Teil A, Abschnitt „Der Ideen-Baukasten“", "f": "Descartes und Locke sind sich einig, dass der Geist beim Erkennen arbeitet. Worüber streiten sie eigentlich?", "a": [["Darüber, woher das Material des Denkens stammt: aus der Vernunft oder aus der Erfahrung.", 1], ["Darüber, ob der Geist überhaupt etwas tut oder alles nur passiv aufnimmt.", 0, null, "Auch bei Locke arbeitet der Geist: Er verbindet, vergleicht und abstrahiert. Das ist nicht der Streitpunkt."], ["Darüber, ob das Wachs nach dem Schmelzen noch dasselbe Stück Wachs ist.", 0, null, "Dass es dasselbe Wachs ist, bestreitet niemand. Strittig ist, woher wir die Ideen haben, mit denen wir das beurteilen."], ["Darüber, ob die Sinne uns manchmal täuschen können oder niemals.", 0]], "e": "Für Descartes stammt sichere Erkenntnis aus der Vernunft, und der Verstand bringt angeborene Ideen wie Gott, Zahl oder Substanz mit. Für Locke ist der Geist bei der Geburt eine tabula rasa; er bildet zwar aktiv komplexe Ideen, bleibt aber „an die einfachen Ideen gebunden“, die aus Sensation und Reflexion stammen. Woher hast du die Ideen „ausgedehnt“ und „biegsam“, aus dem Denken oder aus Sehen und Tasten? Daran entscheidet sich der Streit."}, {"teil": "Vergleich · Descartes und Hume", "nach": "Kapitel Empirismus, Teil B, Abschnitt „Humes Gabel“", "f": "Wie sicher ist „2 + 3 = 5“? Welche Zuordnung stimmt?", "a": [["Descartes: Der Täuscher macht es zweifelhaft. Hume: Es ist durch bloßes Denken gewiss.", 1], ["Descartes: Schon der Traum macht es zweifelhaft. Hume: Es ist eine Tatsache aus Erfahrung.", 0, null, "Der Traum lässt die Mathematik übrig. Und für Hume ist Mathematik eine Beziehung der Ideen, deren Gegenteil ein Widerspruch wäre."], ["Descartes: Es ist durch bloßes Denken gewiss. Hume: Der Täuscher macht es zweifelhaft.", 0, null, "Die Positionen sind vertauscht. Den Täuscher braucht Descartes gerade, um auch die Mathematik zu erschüttern."], ["Descartes: Kein Szenario erreicht es. Hume: Es beruht auf Gewohnheit.", 0]], "e": "Bei Descartes reicht erst die dritte Stufe des Zweifels, der allmächtige Täuscher, bis zur Mathematik: Im Traum ergeben 2 und 3 weiterhin 5. Bei Hume gehört Mathematik zu den Beziehungen der Ideen; sie wird durch bloßes Denken erkannt, ihr Gegenteil ist ein Widerspruch. Gewohnheit erklärt bei Hume nur unsere Erwartungen über Tatsachen, etwa dass die Sonne morgen aufgeht."}, {"teil": "Vergleich · Hume und Kant", "nach": "Kapitel Kant, Teil B, Abschnitt „Kategorien: Formen des Denkens“", "k": "4", "f": "Worin gibt Kant Hume beim Begriff der Ursache recht, und worin nicht?", "a": [["Recht: Notwendigkeit sieht man nicht an den Dingen. Nicht: Sie stammt aus einer Regel des Verstandes.", 1], ["Recht: Kausalität beruht auf Gewohnheit. Nicht: Gewohnheit gilt auch für die Dinge an sich.", 0, null, "Kant bestreitet gerade, dass die Notwendigkeit aus bloßer Gewohnheit stammt."], ["Recht: Kausalität ist eine Beziehung der Ideen. Nicht: Sie ist kein synthetisches Urteil a priori.", 0, null, "Für Hume ist Kausalität keine Beziehung der Ideen, sondern nur aus Erfahrung bekannt."], ["Recht: Ursachen kennt man nur aus Erfahrung. Nicht: Man sieht die Kraft beim Billard doch.", 0]], "e": "Hume hatte gezeigt, dass wir beim Billard nur ein Nacheinander und eine regelmäßige Verbindung sehen, nie die notwendige Verknüpfung; er erklärt unsere Erwartung aus Gewohnheit. Kant stimmt dem ersten Teil zu. Aber die Notwendigkeit stammt für ihn aus der Kategorie der Kausalität, einer festen Regel des Verstandes. Ohne sie könnten wir nicht zwischen bloßem Nacheinander in der Wahrnehmung und wirklichem Geschehen unterscheiden. Deshalb gilt „Alles, was geschieht, hat eine Ursache“ notwendig für alle Erfahrung."}, {"teil": "Vergleich · Kant", "nach": "Kapitel Kant, Fazit „Weder Rationalist noch Empirist“", "k": "4", "f": "Wie schlichtet Kant den Streit zwischen Rationalismus und Empirismus?", "a": [["Erkenntnis entsteht nur aus dem Zusammenwirken von Sinnlichkeit und Verstand: Stoff aus der Erfahrung, Form aus uns.", 1], ["Er gibt dem Rationalismus recht: Die Vernunft erkennt aus eigener Kraft auch Gott, Seele und Welt im Ganzen.", 0, null, "Genau das bestreitet Kant: Über Gott, Seele und Welt als Ganzes gibt es kein theoretisches Wissen."], ["Er gibt dem Empirismus recht: Alles Wissen stammt aus Erfahrung und erreicht deshalb nie Notwendigkeit.", 0, null, "Dann wären Mathematik und Naturwissenschaft nicht begründet. Kant will gerade ihre Gewissheit retten."], ["Er erklärt den Streit für unentscheidbar und empfiehlt, sich des Urteils zu enthalten.", 0, "Sextus Empiricus", "Das ist die skeptische Epoché. Kant will den Streit gerade entscheiden und zeigen, was wir sicher wissen können."]], "e": "Mit dem Empirismus sagt Kant: Alle Erkenntnis fängt mit der Erfahrung an, ohne Sinnlichkeit wird uns kein Gegenstand gegeben. Mit dem Rationalismus sagt er: Notwendige Strukturen stammen nicht aus der Erfahrung. Gegen beide sagt er: Entscheidend ist, unter welchen Bedingungen Erkenntnis überhaupt möglich ist. Der Preis: Wir erkennen die Welt nur, wie sie uns erscheint."}, {"typ": "offen", "teil": "Vergleich · Vernunft oder Erfahrung", "nach": "Kapitel Empirismus, Fazit „Erfahrung und ihre Grenzen“", "f": "Stammt unser Wissen aus der Vernunft oder aus der Erfahrung? Vergleiche Descartes und Locke (oder Hume) an einem Beispiel aus dem Unterricht und nenne für jede Seite eine Grenze.", "m": "Descartes ist Rationalist: Sicheres Wissen stammt aus der Vernunft, nicht aus den Sinnen. Beim Wachs ändern sich am Feuer alle Sinneseigenschaften, und doch ist es dasselbe Wachs; was gleich bleibt, etwas Ausgedehntes, Biegsames, Veränderliches, erfasst allein der Verstand. Locke ist Empirist: Der Geist ist bei der Geburt eine tabula rasa, alle Ideen stammen aus Sensation und Reflexion. Beim Molyneux-Problem sagt er deshalb, der geheilte Blinde müsse das Sehen erst lernen. Hume geht weiter: Ursache und Wirkung kennen wir nur aus Erfahrung, und der Schluss auf die Zukunft beruht auf Gewohnheit. Grenze des Rationalismus: Er erklärt, warum Mathematik notwendig gilt, aber nicht, wie wir etwas über die Welt erfahren; ohne die Sinne hätte Descartes das Wachs nie kennengelernt. Grenze des Empirismus: Er erklärt, wie wir etwas über die Welt erfahren, aber nicht, warum manches Wissen notwendig gilt. Kant wird beide verbinden: Alle Erkenntnis fängt mit der Erfahrung an, aber nicht alle entspringt aus ihr."}]}, {"id": "et-wissenschaft", "tf": "ET", "gruppe": "Wissenschaft", "kapitel": "Wissenschaftstheorie - Was macht Wissenschaft aus", "titel": "Wissenschaftstheorie", "sub": "Was unterscheidet Wissenschaft von Nicht-Wissenschaft?", "kurse": ["4"], "fragen": [{"teil": "Teil A · Abgrenzungsproblem", "nach": "Teil A, Abschnitt „Das Abgrenzungsproblem“", "f": "Horoskop und Vorhersage einer Sonnenfinsternis: Worin liegt nach dem Kapitel der entscheidende Unterschied?", "a": [["Die Finsternis ist auf Ort und Minute bestimmt, und man weiß, was als Fehlschlag zählen würde.", 1], ["Nur die Astronomie macht Vorhersagen und bezieht sich auf die Stellung der Himmelskörper.", 0, null, "Beides tun auch Horoskope. Genau deshalb ist die Abgrenzung schwierig."], ["Astrologie wird von Laien betrieben, Astronomie von Fachleuten mit einer langen Tradition.", 0, null, "Beide haben Fachleute und Tradition; Kepler erstellte selbst Horoskope. Der Unterschied liegt nicht in den Personen."], ["Nur die Astronomie stützt sich auf Experimente, die man im Labor wiederholen kann.", 0, null, "Das Kriterium „Experiment“ würde auch Geschichte und Evolutionsbiologie ausschließen."]], "e": "Das Horoskop ist so allgemein formuliert, dass es fast immer „passt“ (Forer-Effekt: Allgemeine Aussagen werden als persönlich zutreffend empfunden). Die Vorhersage der Sonnenfinsternis kann dagegen klar scheitern. Ein einziges Merkmal wie „Experiment“, „Vorhersage“ oder „Erklärung“ trennt Wissenschaft aber nicht sauber von Nicht-Wissenschaft. Diese Schwierigkeit heißt Abgrenzungsproblem."}, {"teil": "Teil A · Bacon", "nach": "Teil A, Abschnitt „Bacon: Die Sinne versagen“", "f": "Jemand hält eine Lehrmeinung für richtig, weil sie seit Jahrhunderten in den Büchern steht. Welches Idol liegt nach Bacon vor?", "a": [["Idol des Theaters", 1], ["Idol des Stammes", 0, null, "Das sind Vorurteile der menschlichen Natur überhaupt, die alle Menschen teilen."], ["Idol der Höhle", 0, null, "Die Höhle steht für Verzerrungen durch die eigene Erziehung und Neigung, nicht durch überlieferte Lehren."], ["Idol des Marktes", 0, null, "Das Marktidol entsteht durch die Sprache."]], "e": "Bacon misstraut der bloßen Wahrnehmung: Die Sinne versagen, „entweder lassen sie uns im Stich oder sie täuschen“. Noch gefährlicher sind die Idole, Trugbilder des Verstandes: des Stammes (menschliche Natur), der Höhle (Erziehung, Neigung), des Marktes (Sprache) und des Theaters (überlieferte Lehrmeinungen). Die Idolenlehre gilt als Vorläufer der Ideologiekritik."}, {"teil": "Teil A · Wiener Kreis", "nach": "Teil A, Abschnitt „Wahr, falsch oder sinnlos“", "f": "Zwei Geografen sind sich über Lage und Höhe eines Berges einig, streiten aber, ob er „außerdem real“ ist. Wie beurteilt Carnap diesen Streit?", "a": [["Beide Thesen sind sinnlos, weil sich der Streit durch kein Experiment entscheiden lässt.", 1], ["Beide Thesen sind nicht wissenschaftlich, können aber sinnvoll und sogar fruchtbar sein.", 0, "Popper", "So urteilt Popper über Metaphysik. Für den Wiener Kreis ist Unprüfbares dagegen sinnlos."], ["Der Realist hat recht, weil beide Geografen die Existenz des Berges anerkennen.", 0, null, null], ["Die These des Idealisten ist falsch, weil man den Berg beobachten und vermessen kann.", 0, null, "Falsch wäre ein Satz, den man prüfen und widerlegen kann. Der Streit um „außerdem real“ lässt sich gar nicht prüfen."]], "e": "Nach dem Sinnkriterium (Reichenbach) ist sinnvoll, was sich im Prinzip als wahr oder falsch zeigen lässt: Sätze der Logik und Mathematik sowie Erfahrungssätze, die sich auf Protokollsätze zurückführen lassen. Daneben gibt es eine dritte Mögli

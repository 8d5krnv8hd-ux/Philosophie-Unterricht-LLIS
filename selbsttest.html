rade, dass ohne Zwang das Böse offen hervortritt."], ["Weil die Staaten böse sind, braucht es einen homogenen Weltstaat, der alle Einzelstaaten ersetzt.", 0, null, "Diesen Weltstaat lehnt Höffe ab: Er „maßt sich zu viel an Staatlichkeit an“."], ["Der Mensch ist von Natur aus nicht böse; Abhängigkeit und Herrschaft entstehen erst mit Eigentum und Konkurrenz.", 0, "Rousseau", null]], "e": "Höffe erinnert an einen Begriff, den die meisten Leser Kants übersehen. Innerhalb eines Staates ist die Bösartigkeit verdeckt, weil die Regierung Gewalt verhindert. Zwischen den Staaten zeigt sie sich „unverhohlen“, wie die vielen Kriege in Europa beweisen. Höffes Umkehrschluss: Was zwischen Menschen gilt, muss auch zwischen Staaten gelten; es braucht eine Rechtsordnung mit Sanktionen, eine internationale Staatlichkeit."}, {"teil": "Teil B · Höffe", "nach": "Teil B, Abschnitt „Primärstaaten und Weltrepublik“", "f": "Wie sieht Höffes Staatenrepublik aus?", "a": [["Die Einzelstaaten bleiben Primärstaaten; die Weltrepublik sorgt nur dafür, dass Streit zwischen Staaten nicht gewaltsam entschieden wird.", 1], ["Eine Weltregierung übernimmt Zivil-, Straf-, Arbeits- und Sozialrecht und vereinheitlicht Sprache und Kultur.", 0, null, "Das wäre der homogene Weltstaat. Bei Höffe bleiben genau diese Bereiche Sache der Einzelstaaten."], ["Ein freier Bund souveräner Staaten, der sich ausbreitet, aber keine Zwangsgewalt über seine Mitglieder hat.", 0, "Kant", null], ["Ein Leviathan über den Staaten, dessen Macht ungeteilt und durch keinen Vertrag begrenzt ist.", 0, null, "Einen Leviathan zwischen den Staaten lehnt schon Kant ab. Höffes Weltrepublik ist nur ein Sekundärstaat mit kleiner Restzuständigkeit."]], "e": "Höffe prüft drei Optionen: Die freie Assoziation ist zu wenig, der homogene Weltstaat zu viel, übrig bleibt die Staatenrepublik (ein „Staatenstaat“) mit echtem Staatscharakter, aber wenigen Aufgaben. Die Staaten verzichten dafür auf einen minimalen Teil ihrer Souveränität, und zwar „nur in voller Freiwilligkeit“. Man kann sich das wie einen Bundesstaat im Großen vorstellen. Offen bleibt, woher dieser freiwillige Verzicht kommen soll und wer die Weltrepublik kontrolliert."}, {"teil": "Teil B · Höffe", "nach": "Teil B, Abschnitt „Der Fall: die Vereinten Nationen“", "f": "Wie lassen sich die Vereinten Nationen zwischen Kant und Höffe einordnen?", "a": [["Mehr als Kants Bund, weil sie Zwang vorsehen; weniger als Höffes Republik, weil ein Gewaltmonopol fehlt.", 1], ["Genau Kants Friedensbund, weil die UNO keinerlei Zwangsmaßnahmen gegen ihre Mitglieder kennt.", 0, null, "Der Sicherheitsrat kann Zwangsmaßnahmen beschließen. Das geht über Kants Bund ohne Zwang hinaus."], ["Genau Höffes Staatenrepublik, weil der Sicherheitsrat ein wirksames Gewaltmonopol besitzt.", 0, null, "Jedes der fünf ständigen Mitglieder kann Zwangsmaßnahmen mit einem Veto verhindern; ein Gewaltmonopol hat die UNO nicht."], ["Ein homogener Weltstaat, der die Souveränität seiner Mitglieder vollständig aufgehoben hat.", 0, null, null]], "e": "Die Charta der Vereinten Nationen (1945) verbietet die Androhung und Anwendung von Gewalt zwischen Staaten (Art. 2 Ziff. 4). Der Sicherheitsrat mit 15 Mitgliedern kann Zwangsmaßnahmen beschließen, aber China, Frankreich, Russland, das Vereinigte Königreich und die USA können sie mit einem Veto blockieren. Die UNO steht damit zwischen Kants Friedensbund und Höffes Staatenrepublik."}, {"typ": "offen", "teil": "Fazit", "nach": "Fazit „Pflicht oder Traum?“", "f": "Worin sind sich Kant und Höffe einig, und worüber streiten sie?", "m": "Beide gehen davon aus, dass zwischen den Staaten ein Naturzustand herrscht und Frieden durch Recht gestiftet werden muss. Einig sind sie sich, dass Frieden eine Pflicht der Vernunft ist und dass ein homogener Weltstaat zu weit ginge: Kant fürchtet einen „seelenlosen Despotism“, Höffe sagt, er maße sich zu viel an Staatlichkeit an. Sie streiten darüber, ob Frieden ohne ein Minimum an globalem Zwang gesichert werden kann. Kant vertraut auf einen wachsenden Bund freier Republiken, der seine Mitglieder nicht zwingt. Höffe hält diesen Bund für einen „(modifizierten) Naturzustand“, weil ihm das „Schwert der Gerechtigkeit“ fehlt und sich die Bösartigkeit zwischen Staaten unverhohlen zeigt. Er verlangt deshalb eine Weltrepublik mit wenigen, aber durchsetzbaren Aufgaben, in der die Einzelstaaten Primärstaaten bleiben."}]}]};
  var TF={ET:['Erkenntnistheorie','--st-et'],EH:['Ethik','--st-eh'],PP:['Politische Philosophie','--st-pp'],AN:['Anthropologie','--st-an']};
  var app=document.getElementById('stApp');
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
  function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function falle(n){
    if(/(ismus|tum|ung|theorie|lehre)$/i.test(n))return 'Falle: Das gehört zu „'+n+'“';
    if(/\s/.test(n))return 'Falle: Das ist die Position von '+n;
    return 'Falle: Das ist '+(/[sxzß]$/.test(n)?n+"'":n+'s')+' Position';}
  var K=ls('philo-st-kurs')==='2'?'2':'4';
  function inKurs(t){return !t.kurse||t.kurse.indexOf(K)>=0;}
  function qIdx(t){var r=[];t.fragen.forEach(function(q,i){if(K==='4'||!q.k)r.push(i);});return r;}
  function key(t){return 'philo-st-'+K+'-'+t.id;}
  function nachText(t,n){if(t.quelle)return t.quelle+' „'+t.kapitel+'“, '+n;return /^Kapitel /.test(n)?n:'Fachwissen „'+t.kapitel+'“, '+n;}
  function tfVar(t){return 'var('+TF[t.tf][1]+')';}
  function byId(id){for(var i=0;i<DATA.tests.length;i++)if(DATA.tests[i].id===id)return DATA.tests[i];return null;}
  function run(on){document.body.classList.toggle('st-run',!!on);}
  function setHash(h){if(history.replaceState)history.replaceState(null,'',h?'#'+h:location.pathname);}

  /* ---------- Übersicht ---------- */
  function overview(){
    setHash('');run(false);
    var h='<div class="st-lead"><p>Wähle ein Kapitel und beantworte die Fragen. Nach jeder Antwort siehst du sofort, ob sie stimmt, warum, und wo du im Fachwissen nachlesen kannst.</p>'+
          '<p class="st-note"><b>Achtung:</b> Viele falsche Antworten sind keine Fantasie, sondern Aussagen einer anderen Position. Genau diese Verwechslungen kosten in Tests und im Bac Punkte.</p></div>';
    h+='<div class="st-kurs" role="group" aria-label="Kurs wählen"><span class="st-kl"><span class="st-kl-m">Mein </span>Kurs</span>'+
       '<button type="button" data-k="4" aria-pressed="'+(K==='4')+'">Philosophie 4</button>'+
       '<button type="button" data-k="2" aria-pressed="'+(K==='2')+'">Philosophie 2</button></div>';
    ['ET','EH','PP','AN'].forEach(function(code){
      var tests=DATA.tests.filter(function(t){return t.tf===code&&inKurs(t);});
      if(!tests.length)return;
      h+='<section class="st-tf" style="--tf:'+tfVar(tests[0])+'"><div class="st-tf-h">'+TF[code][0]+'</div>';
      var groups=[];tests.forEach(function(t){if(groups.indexOf(t.gruppe)<0)groups.push(t.gruppe);});
      groups.forEach(function(g){
        h+='<h2 class="st-grp">'+esc(g)+'</h2><div class="st-grid">';
        tests.filter(function(t){return t.gruppe===g;}).forEach(function(t){
          var last=ls(key(t)),lh='';
          if(last==='ok')lh='<span class="last ok"><i></i>Zuletzt: alles sicher</span>';
          else if(last)lh='<span class="last"><i></i>Zuletzt: noch Lücken</span>';
          h+='<button type="button" class="st-card" data-id="'+t.id+'"><span class="ey">'+esc(t.kapitel)+'</span><h3>'+esc(t.titel)+'</h3><p>'+esc(t.sub)+'</p>'+lh+'</button>';
        });
        h+='</div>';
      });
      h+='</section>';
    });
    app.innerHTML=h;
    app.querySelectorAll('.st-card').forEach(function(c){c.addEventListener('click',function(){start(byId(c.dataset.id));});});
    app.querySelectorAll('.st-kurs button').forEach(function(b){b.addEventListener('click',function(){K=b.dataset.k;ls('philo-st-kurs',K);overview();var nb=app.querySelector('.st-kurs button[data-k="'+K+'"]');if(nb)nb.focus();});});
  }

  /* ---------- Quiz ---------- */
  var S=null;
  function start(t,only){
    var idx=only||qIdx(t);
    S={t:t,order:idx,pos:0,res:{},answered:false};
    setHash(t.id);run(true);
    question();
    window.scrollTo({top:0,behavior:'smooth'});
  }
  function prog(){
    return '<div class="st-prog">'+S.order.map(function(qi,p){
      var r=S.res[qi],c=r===true?'ok':r===false?'no':r==='open'?'open':(p===S.pos?'now':'');
      return '<i class="'+c+'"></i>';}).join('')+'</div>';
  }
  function head(){
    return '<div class="st-top"><button type="button" class="st-back" id="stBack">Alle Tests</button><span class="st-kchip">Philosophie '+K+'</span></div>'+
      '<div class="st-qhead" style="--tf:'+tfVar(S.t)+'"><span class="ey">'+esc(TF[S.t.tf][0])+' · '+esc(S.t.kapitel)+'</span><h2>'+esc(S.t.titel)+'</h2>'+(S.t.hinweis&&S.pos===0&&!S.done?'<p class="st-note st-hinweis">'+esc(S.t.hinweis)+'</p>':'')+'</div>';
  }
  function bindBack(){document.getElementById('stBack').addEventListener('click',overview);}
  var booted=false;
  function focusQ(){if(!booted)return;var f=document.getElementById('stF');if(f)f.focus({preventScroll:true});}
  function question(){
    var qi=S.order[S.pos],q=S.t.fragen[qi],typ=q.typ||'mc';S.answered=false;
    var h=head()+prog()+'<div class="st-q"><div class="st-teil">'+esc(q.teil)+'</div><p class="st-f" id="stF" tabindex="-1">'+esc(q.f)+'</p>';
    if(typ==='offen'){
      var key='philo-st-note-'+S.t.id+'-'+qi,v=ls(key)||'';
      h+='<div class="st-open"><p class="hint">Schreib zuerst selbst ein paar Sätze, dann vergleiche mit der Musterantwort. Diese Frage zählt nicht zur Auswertung.</p>'+
         '<textarea id="stNote" aria-label="Deine Antwort">'+esc(v)+'</textarea>'+
         '<div class="st-muster" id="stMuster" hidden><span class="v">Musterantwort</span>'+esc(q.m)+'</div>'+
         '<div class="st-btns"><button type="button" class="st-btn ghost" id="stShow" aria-expanded="false" aria-controls="stMuster">Musterantwort zeigen</button><button type="button" class="st-btn" id="stNext">'+(S.pos+1<S.order.length?'Weiter':'Auswertung')+'</button></div></div></div>';
      app.innerHTML=h;bindBack();focusQ();
      var ta=document.getElementById('stNote');ta.addEventListener('input',function(){ls(key,ta.value);});
      document.getElementById('stShow').addEventListener('click',function(){var m=document.getElementById('stMuster');m.hidden=!m.hidden;this.textContent=m.hidden?'Musterantwort zeigen':'Musterantwort ausblenden';this.setAttribute('aria-expanded',!m.hidden);});
      document.getElementById('stNext').addEventListener('click',function(){S.res[qi]='open';next();});
      return;
    }
    if(typ==='arg'){
      h+='<div class="st-arg">'+q.zeilen.map(function(z){
        return z[1]===null?'<div class="gap" id="stGap"><b>'+esc(z[0])+'</b><span>Welcher Schritt fehlt hier?</span></div>':'<div><b>'+esc(z[0])+'</b><span>'+esc(z[1])+'</span></div>';}).join('')+'</div>';
    }
    var opts=shuffle(q.a);
    h+='<div class="st-opts" role="group" aria-label="Antworten">'+opts.map(function(a,i){
      return '<button type="button" class="st-opt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(a[0])+'</span></button>';}).join('')+'</div><div id="stFb" role="status" aria-live="polite"></div><div id="stAfter"></div></div>';
    app.innerHTML=h;bindBack();focusQ();
    var btns=[].slice.call(app.querySelectorAll('.st-opt'));
    btns.forEach(function(b){b.addEventListener('click',function(){answer(+b.dataset.i);});});
    function answer(i){
      if(S.answered)return;S.answered=true;
      var a=opts[i],right=a[1]===1;S.res[qi]=right;
      btns.forEach(function(b,j){b.disabled=true;
        if(opts[j][1]===1)b.classList.add('ok');else if(j===i)b.classList.add('trap');else b.classList.add('dim');
        var z=[];if(j===i)z.push('deine Antwort');if(opts[j][1]===1)z.push('richtige Antwort');
        if(z.length)b.insertAdjacentHTML('beforeend','<span class="sr-only">, '+z.join(', ')+'</span>');});
      if(typ==='arg'){var g=document.getElementById('stGap'),ok=opts.filter(function(o){return o[1]===1;})[0];g.classList.add('filled');g.querySelector('span').textContent=ok[0];}
      var fb='<div class="st-fb'+(right?' ok':'')+'"><span class="v">'+(right?'Richtig.':'Nicht ganz.')+'</span>';
      if(!right&&a[2])fb+='<span class="von">'+esc(falle(a[2]))+'</span>';
      if(!right&&a[3])fb+='<p class="st-why"><b>Zu deiner Antwort:</b> '+esc(a[3])+'</p>';
      fb+='<p>'+(right?'':'<b>Richtig ist:</b> ')+esc(q.e)+'</p>';
      if(q.nach)fb+='<p class="st-nach">Nachlesen: '+esc(nachText(S.t,q.nach))+'</p>';
      fb+='</div>';
      var after='';
      var others=opts.filter(function(o,j){return o[1]!==1&&j!==i&&o[3];});
      if(others.length)after+='<details class="st-more"><summary>Warum die anderen Antworten nicht passen</summary><ul>'+others.map(function(o){
        return '<li><s>'+esc(o[0])+'</s>'+(o[2]?'<span class="von">'+esc(falle(o[2]))+'</span>':'')+'<span>'+esc(o[3])+'</span></li>';}).join('')+'</ul></details>';
      after+='<div class="st-btns"><button type="button" class="st-btn" id="stNext">'+(S.pos+1<S.order.length?'Weiter':'Auswertung')+'</button></div>';
      document.getElementById('stFb').innerHTML=fb;
      document.getElementById('stAfter').innerHTML=after;
      app.querySelector('.st-prog').outerHTML=prog();
      var n=document.getElementById('stNext');n.addEventListener('click',next);n.focus({preventScroll:true});
      var r=n.getBoundingClientRect();if(r.bottom>window.innerHeight-20)n.scrollIntoView({behavior:'smooth',block:'end'});
    }
    S.answer=answer;S.count=opts.length;
  }
  function next(){S.pos++;if(S.pos<S.order.length){question();window.scrollTo({top:0,behavior:'smooth'});}else end();}
  function end(){
    var t=S.t,miss=[],teile=[],scored=0,right=0;
    S.order.forEach(function(qi){var r=S.res[qi];if(r==='open')return;scored++;if(r===true)right++;else{miss.push(qi);var q=t.fragen[qi],tl=q.nach?nachText(t,q.nach):q.teil;if(teile.indexOf(tl)<0)teile.push(tl);}});
    var all=S.order.length===qIdx(t).length;
    if(all)ls(key(t),miss.length?'gap':'ok');
    var msg=!miss.length?['Alles sicher.','Du kannst die Positionen sauber auseinanderhalten.']:
      right/scored>=.7?['Fast alles sicher.','Ein paar Stellen lohnen einen zweiten Blick.']:
      ['Da lohnt sich ein zweiter Blick.','Lies die genannten Teile im Fachwissen noch einmal und versuch es dann erneut.'];
    var h=head()+'<div class="st-end"><h2>'+msg[0]+'</h2><p>'+msg[1]+'</p><div class="st-dots">'+
      S.order.map(function(qi){var r=S.res[qi];return '<i class="'+(r===true?'':r==='open'?'open':'no')+'"></i>';}).join('')+'</div>'+
      '<div class="st-legend"><span style="--c:var(--st-ok)">sicher</span><span style="--c:var(--st-trap)">verpasst</span>'+(scored<S.order.length?'<span style="--c:var(--st-amber)">offene Frage</span>':'')+'</div>';
    if(teile.length)h+='<p style="margin-top:16px"><b>'+(t.quelle?'Im Text noch einmal nachlesen:':'Im Fachwissen noch einmal nachlesen:')+'</b></p><ul>'+teile.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    h+='<div class="st-btns">'+(miss.length?'<button type="button" class="st-btn" id="stMiss">Nur die verpassten Fragen</button>':'')+
       '<button type="button" class="st-btn'+(miss.length?' ghost':'')+'" id="stAgain">Nochmal von vorn</button><button type="button" class="st-btn ghost" id="stAll">Alle Tests</button></div></div>';
    S.done=true;app.innerHTML=h;bindBack();S.answer=null;
    if(miss.length)document.getElementById('stMiss').addEventListener('click',function(){start(t,miss);});
    document.getElementById('stAgain').addEventListener('click',function(){start(t);});
    document.getElementById('stAll').addEventListener('click',overview);
  }
  /* Tastatur: A-D oder 1-4 wählt, Enter geht weiter */
  document.addEventListener('keydown',function(e){
    if(!S||!S.answer||e.target.tagName==='TEXTAREA'||e.metaKey||e.ctrlKey||e.altKey)return;
    var k=e.key.toUpperCase(),i='ABCD'.indexOf(k);if(i<0)i='1234'.indexOf(k);
    if(i>=0&&i<S.count&&!S.answered){e.preventDefault();S.answer(i);}
  });
  var h0=location.hash.slice(1);
  if(h0&&byId(h0))start(byId(h0));else overview();
  booted=true;
})();
</script>
<style>/* ===== Überarbeitung 21.10.2026 (Selbsttest/Quiz) ===== */

.page-hero:not(#_k){padding:3rem 0 2rem !important}

.st-q :is(.st-f,.qz-ask):focus{outline-offset:4px;border-radius:6px}
/* Dunkelmodus: Zweitknöpfe waren unsichtbar (dunkle Schrift auf dunkler Fläche) */

@media(hover:hover){html:not(.light) .st-btn.ghost:hover{color:var(--text)}}
</style>

<style>
:root {
  --bg:#0f172a; --bg-2:#1e293b; --surface:#1e293b; --surface-2:#273548;
  --text:#f1f5f9; --text-2:#cbd5e1; --text-3:#94a3b8; --muted:#64748b;
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.14);
  --nav-bg:rgba(15,23,42,.85);
  --accent:#003462; --accent-hover:#0B4A85;
  --accent-soft:rgba(0,52,98,.12); --accent-glow:rgba(0,52,98,.25);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Georgia,serif;
  --r:10px; --rl:14px;
  --topnav-h:52px; --sidebar-w:220px;
  /* legacy aliases */
  --b:#f1f5f9; --bm:#94a3b8; --bl:rgba(255,255,255,.09); --ba:#64748b;
  --w:#1e293b; --br:rgba(255,255,255,.09);
  --gold:#fbbf24; --goldl:rgba(251,191,36,.12);
}
html.light {
  --bg:#ffffff; --bg-2:#f8fafc; --surface:#f8fafc; --surface-2:#f1f5f9;
  --text:#0f172a; --text-2:#1e293b; --text-3:#475569; --muted:#94a3b8;
  --border:rgba(0,0,0,.08); --border-2:rgba(0,0,0,.13);
  --nav-bg:rgba(255,255,255,.88);
  --accent:#003462; --accent-hover:#003462;
  --accent-soft:rgba(0,52,98,.1); --accent-glow:rgba(0,52,98,.2);
  --b:#0f172a; --bm:#475569; --bl:rgba(0,0,0,.08); --ba:#64748b;
  --w:#ffffff; --br:rgba(0,0,0,.08);
  --gold:#d97706; --goldl:rgba(217,119,6,.1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{padding-top:52px;font-family:var(--font);background:var(--bg);color:var(--text);font-size:17px;}












.lf-wrap{max-width:960px;margin:0 auto;padding:1.25rem;}
.lf-hero{background:linear-gradient(135deg,var(--b),var(--bm));color:#fff;
  border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1.25rem;}
.lf-hero h1{font-size:20px;font-weight:600;margin-bottom:2px;}
.lf-hero p{font-size:16px;opacity:.85;}
.lf-sem{margin-bottom:1.5rem;}
.lf-sem-hdr{font-size:14.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  padding:5px 0;margin-bottom:.6rem;border-bottom:2px solid;}
.lf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}
.lf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:12px 14px;}
.lf-topic{font-size:13.5px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
.lf-q{font-size:16px;color:var(--text-2);font-style:italic;line-height:1.55;margin-bottom:8px;}
.lf-pos{font-size:14.5px;color:var(--muted);margin-bottom:7px;}
.lf-btn{font-size:15px;color:var(--bm);background:none;border:none;cursor:pointer;
  font-weight:600;padding:0;font-family:inherit;}
.lf-btn:hover{text-decoration:underline;}

.topnav{position:fixed;top:0;left:0;right:0;z-index:300;
  background:#1a1d24;height:48px;
  display:flex;align-items:center;padding:0 1rem;gap:.25rem;
  box-shadow:0 2px 10px rgba(26,29,36,.18);}
.topnav .brand{color:#fff;font-weight:700;font-size:15.5px;margin-right:.5rem;white-space:nowrap;flex-shrink:0;}
.topnav a{color:rgba(255,255,255,.65);text-decoration:none;font-size:15px;
  padding:4px 8px;border-radius:5px;transition:all .15s;white-space:nowrap;flex-shrink:0;}
.topnav a:hover{background:rgba(255,255,255,.12);color:#fff;}
.topnav a.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600;}
.topnav .sp{flex:1;}


/* ── HAMBURGER MOBILE ── */
.topnav .nav-hamburger{display:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:background .15s;}
.topnav .nav-hamburger:hover{background:rgba(255,255,255,.15);color:#fff;}
html.light .topnav .nav-hamburger{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1);color:var(--text-3);}
.topnav .nav-links{display:contents;}
@media(max-width:640px){
  .topnav .nav-hamburger{display:flex;}
  .topnav .nav-links{display:none;position:fixed;top:52px;left:0;right:0;background:var(--nav-bg,rgba(15,23,42,.95));backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--border);flex-direction:column;padding:.5rem 1rem .75rem;gap:.25rem;z-index:299;}
  .topnav .nav-links.open{display:flex;}
  .topnav .nav-links a{font-size:17px;padding:10px 12px;border-radius:8px;width:100%;}
}
.ci-lvl{font-weight:400;color:var(--text-3,#6B7785)}
</style>
<style>

   NEW DESIGN SYSTEM - injected override
   ═══════════════════════════════════════════════ */

html.light {
  --bg:#ffffff; --bg-2:#f8fafc; --surface:#f8fafc; --surface-2:#f1f5f9;
  --text:#0f172a; --text-2:#1e293b; --text-3:#475569; --muted:#94a3b8;

}

/* ── Base ─────────────────────────────────────── */
*, *::before, *::after { box-sizing:border-box; }

  background:var(--bg) !important;
  color:var(--text) !important;
  font-family:var(--font) !important;

  -webkit-font-smoothing:antialiased;
}
html.light body { color:var(--text) !important; }

/* ── Nav ──────────────────────────────────────── */
.topnav {
  position:fixed !important; top:0 !important; left:0 !important; right:0 !important;
  z-index:300 !important; height:52px !important;
  background:var(--nav-bg) !important;
  backdrop-filter:saturate(180%) blur(20px) !important;
  -webkit-backdrop-filter:saturate(180%) blur(20px) !important;
  border-bottom:1px solid var(--border) !important;
  box-shadow:none !important;
  display:flex !important; align-items:center !important;
  padding:0 1.5rem !important; gap:.25rem !important;
}
.topnav .brand, .topnav .nav-home {
  color:var(--text) !important; font-weight:700 !important; font-size:16.5px !important;
  margin-right:1.25rem !important; white-space:nowrap !important;
  letter-spacing:-.02em !important; text-decoration:none !important;
  flex-shrink:0 !important;
}
.topnav .brand span, .topnav .nav-home span { color:var(--accent) !important; }
.topnav a {
  color:var(--text-3) !important; text-decoration:none !important; font-size:15.5px !important;
  padding:6px 11px !important; border-radius:6px !important;
  transition:background .15s,color .15s !important; font-weight:400 !important;
  white-space:nowrap !important; flex-shrink:0 !important;
}
.topnav a:hover { background:rgba(255,255,255,.07) !important; color:var(--text) !important; }
html.light .topnav a:hover { background:rgba(0,0,0,.05) !important; }
.topnav a.active {
  color:var(--accent) !important; font-weight:600 !important;
  background:var(--accent-soft) !important;
}
.topnav .sp { flex:1 !important; min-width:0 !important; }
.topnav .srch input {
  background:rgba(255,255,255,.07) !important; border:1px solid var(--border-2) !important;
  color:var(--text) !important; border-radius:8px !important;
  font-family:var(--font) !important;
}
.topnav .srch input:focus {
  background:var(--surface) !important; border-color:var(--accent) !important;
  box-shadow:0 0 0 3px var(--accent-soft) !important;
}
.topnav .srch input::placeholder { color:var(--muted) !important; }
html.light .topnav .srch input { background:rgba(0,0,0,.04) !important; }
.topnav .nav-print, .topnav button:not(.theme-toggle) {
  background:rgba(255,255,255,.07) !important; border:1px solid var(--border-2) !important;
  color:var(--text-3) !important; border-radius:6px !important; font-size:15.5px !important;
  font-family:var(--font) !important;
}
.theme-toggle {
  background:rgba(255,255,255,.08) !important; border:1px solid var(--border-2) !important;
  color:var(--text-3) !important; width:32px !important; height:32px !important;
  border-radius:8px !important; display:flex !important;
  align-items:center !important; justify-content:center !important;
  cursor:pointer !important; font-size:16.5px !important;
  transition:all .15s !important; flex-shrink:0 !important;
}
.theme-toggle:hover { background:rgba(255,255,255,.14) !important; }
html.light .theme-toggle {
  background:rgba(0,0,0,.05) !important; border-color:rgba(0,0,0,.1) !important;
}

/* ── Cards / surfaces ─────────────────────────── */
.pcard, .tile, .pc, .card, .bgcard, .htab,
.ptbl, .sidebar, .main .cbar {
  background:var(--surface) !important;
  border-color:var(--border) !important;
}
.pcard:hover { border-color:var(--border-2) !important; box-shadow:0 4px 20px rgba(0,0,0,.25) !important; }
.pcard.exp { border-color:var(--accent) !important; box-shadow:0 4px 16px var(--accent-soft) !important; }

/* ── Filter bars ──────────────────────────────── */
.filter-bar, .cbar, .lf-filter-bar {
  background:var(--surface) !important; border-color:var(--border) !important;
}
.fbtn, .nb, .vb {
  background:var(--surface) !important; border-color:var(--border-2) !important;
  color:var(--text-3) !important; font-family:var(--font) !important;
}
.fbtn:hover, .nb:hover { border-color:var(--accent) !important; color:var(--text) !important; background:rgba(255,255,255,.05) !important; }
.fbtn.on, .nb.on, .vb.on {
  background:var(--accent) !important; color:#fff !important;
  border-color:var(--accent) !important;
}
html.light .fbtn, html.light .nb, html.light .vb {
  background:var(--surface) !important; border-color:rgba(0,0,0,.12) !important; color:#374151 !important;
}

/* ── Text overrides ───────────────────────────── */
.pname, .tn { color:var(--text) !important; }
.pstroem, .pdates, .tp, .stl { color:var(--text-3) !important; }
.pmerk, .pbio, .pkonzept, .ptbl td { color:var(--text-2) !important; }
.pkernidee-lbl, .pkonzepte-lbl, .pmerksatz-lbl, .pquer-lbl,
.slbl, .shdr, .lbl { color:var(--muted) !important; }
.no-r { color:var(--muted) !important; }
.parr { color:var(--muted) !important; }

/* ── Highlight boxes ──────────────────────────── */
.pkernidee {
  background:rgba(0,52,98,.08) !important;
  border-left-color:var(--accent) !important;
  color:var(--text-2) !important;
}
.pmerksatz {
  background:rgba(34,197,94,.07) !important;
  border-left-color:#22c55e !important;
  color:#86efac !important;
}
html.light .pkernidee { background:#EEF3F8 !important; color:#003462 !important; }
html.light .pmerksatz { background:#f0fdf4 !important; color:#166534 !important; }

/* ── Sidebar (begriffe, vergleiche) ──────────────*/
.sidebar {
  background:var(--surface) !important;
  border-color:var(--border) !important;
}
.ni { color:var(--text-3) !important; }
.ni:hover { background:rgba(255,255,255,.05) !important; color:var(--text) !important; }
.ni.on { background:var(--accent-soft) !important; color:var(--accent) !important; border-left-color:var(--accent) !important; }
.fni { color:var(--text-3) !important; }
.fni:hover, .fni.on { background:rgba(234,179,8,.1) !important; color:#fbbf24 !important; border-left-color:#fbbf24 !important; }
.sb-sem-link { border-left-color:transparent !important; }
.sb-sem-link:hover { background:rgba(255,255,255,.05) !important; border-left-color:var(--accent) !important; }
.sb-sem-link.active { background:var(--accent-soft) !important; border-left-color:var(--accent) !important; }
.sb-sem-name { color:var(--text) !important; }
.sb-sem-sub { color:var(--muted) !important; }
.sb-sub-link { color:var(--text-3) !important; }
.sb-sub-link:hover, .sb-sub-link.active { color:var(--accent) !important; background:var(--accent-soft) !important; }
html.light .sidebar { background:#f8fafc !important; border-color:rgba(0,0,0,.08) !important; }
html.light .ni { color:#374151 !important; }
html.light .ni.on { background:rgba(0,52,98,.08) !important; color:#003462 !important; border-left-color:#003462 !important; }
html.light .sb-sem-name { color:#0f172a !important; }
html.light .sb-sub-link { color:#475569 !important; }

/* ── Vergleich table ──────────────────────────── */
.ptbl { border-color:var(--border) !important; }
.ptbl th { color:var(--text) !important; }
.ptbl th.rh { background:var(--surface-2) !important; color:var(--muted) !important; }
.ptbl td { color:var(--text-2) !important; border-color:rgba(255,255,255,.04) !important; }
.ptbl td.rl { background:var(--surface-2) !important; color:var(--muted) !important; border-right-color:var(--border) !important; }
.ptbl tr:hover td { background:rgba(255,255,255,.03) !important; }
.ptbl tr:hover td.rl { background:var(--surface-2) !important; }
.ptbl tbody tr:nth-child(even) td { background:rgba(255,255,255,.02) !important; }
.ptbl tbody tr:nth-child(even) td.rl { background:var(--surface-2) !important; }
.ptbl tbody tr:nth-child(even):hover td { background:rgba(255,255,255,.04) !important; }
/* Merksatz row in table */
.mr td { background:rgba(0,52,98,.12) !important; color:#C9D6E8 !important; border-top-color:var(--accent) !important; border-bottom-color:var(--accent) !important; }
.mr td.rl { background:rgba(0,52,98,.25) !important; color:#8EC5F0 !important; }
html.light .ptbl td { color:#1e293b !important; border-color:rgba(0,0,0,.06) !important; }
html.light .ptbl th.rh, html.light .ptbl td.rl { background:#f8fafc !important; color:#94a3b8 !important; }
html.light .ptbl tr:hover td { background:#f8fafc !important; }
html.light .mr td { background:#EEF3F8 !important; color:#92400e !important; }
html.light .mr td.rl { background:#C9D6E8 !important; color:#003462 !important; }

/* ── Hero/stats boxes (vergleiche) ───────────────*/
.hero {
  background:linear-gradient(135deg,rgba(15,23,42,1),rgba(30,41,59,1)) !important;
  border:1px solid var(--border) !important;
}
.stat { background:rgba(255,255,255,.08) !important; }
.stat .stn { color:var(--accent) !important; }
.htab { border:1px solid var(--border) !important; color:var(--text-2) !important; }

html.light .stat { background:rgba(255,255,255,.15) !important; }
html.light .htab { background:var(--surface) !important; }
html.light .lf { background:#EEF3F8 !important; border-left-color:#003462 !important; color:#003462 !important; }

/* ── Karteikarten ─────────────────────────────── */
.card-shell, .card-inner, .card-front, .card-back { border-color:var(--border) !important; }
.card-front { background:var(--surface) !important; }
.card-back { background:var(--surface-2) !important; }
.card-front-term { color:var(--text) !important; }
.card-back-body { color:var(--text-2) !important; }

  background:var(--surface) !important; border:1px solid var(--border-2) !important;
  color:var(--text-2) !important; font-family:var(--font) !important;
}
.deck-btn:hover, .ctrl-btn:hover { border-color:var(--accent) !important; color:var(--text) !important; }
.deck-btn.active { background:var(--accent) !important; border-color:var(--accent) !important; color:#fff !important; }
.progress-bar { background:var(--border) !important; }
.progress-fill { background:var(--accent) !important; }

/* ── Begriffe article ─────────────────────────── */
.article-wrap, .entry, .bcard {
  background:var(--surface) !important; border-color:var(--border) !important;
}
.entry-title, .bcard-title, .art-h1, .art-h2 { color:var(--text) !important; }
.entry-body, .bcard-body { color:var(--text-2) !important; }

  background:var(--surface-2) !important; border-color:var(--border) !important;
  color:var(--text-3) !important;
}
.tag-pill:hover, .alpha-sb-link:hover, .alpha-sb-link.active {
  background:var(--accent-soft) !important; color:var(--accent) !important; border-color:var(--accent) !important;
}
html.light .entry, html.light .bcard, html.light .article-wrap {
  background:var(--surface) !important; border-color:rgba(0,0,0,.07) !important;
}

/* ── Leitfragen ───────────────────────────────── */
.qcard, .qblock, .qa-wrap {
  background:var(--surface) !important; border-color:var(--border) !important;
}
.qcard:hover { border-color:var(--accent) !important; }
.qcard-title { color:var(--text) !important; }
.qcard-body, .qa-body { color:var(--text-2) !important; }
.antwort, .answer-block {
  background:rgba(0,52,98,.07) !important;
  border-left:3px solid var(--accent) !important;
  color:var(--text-2) !important;
}
html.light .qcard, html.light .qblock { background:var(--surface) !important; }
html.light .antwort { background:#EEF3F8 !important; color:#003462 !important; }

/* ── Scrollbar ────────────────────────────────── */
::-webkit-scrollbar { width:5px; height:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--bg-3,#334155); border-radius:99px; }
html.light ::-webkit-scrollbar-thumb { background:#cbd5e1; }
</style>

<script>/* Selbsttest */
(function(){
  var DATA={"_hinweis": "Fragen für selbsttest.html. Quelle: Fachwissen-Kapitel (HTML-Master in 01 Masterdokumente/01 Fachwissen/Kapitel). Test: kurse [\"4\",\"2\"] = für welche Kurse. Frage: k \"4\" = nur PHIL4; nach = Stelle im Fachwissen zum Nachlesen; a = [Text, 1] richtig oder [Text, 0, Position der Falle oder null, Kommentar oder null]; e = Erklärung. Typen: mc (Standard), arg (fehlender Schritt im Argument), offen (Musterantwort m, nicht bewertet). Neues Kapitel: Test ergänzen und web_selbsttest_build.py laufen lassen.", "tests": [{"id": "et-einfuehrung", "tf": "ET", "gruppe": "Grundlagen", "kapitel": "Einführung in die Erkenntnistheorie", "titel": "Einführung", "sub": "Meinen, Glauben und Wissen", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Was ist Erkenntnistheorie?", "nach": "Teil A, Abschnitt „Was können wir wissen?“", "f": "Womit beschäftigt sich die Erkenntnistheorie (Epistemologie)?", "a": [["Mit den Bedingungen, dem Umfang und den Grenzen menschlichen Wissens", 1], ["Mit der Frage, wie man handeln soll und was ein gelungenes Leben ist", 0, null, "Das ist die Frage der Ethik. Die Erkenntnistheorie fragt, was wir wissen können und wie wir es begründen."], ["Mit dem Aufbau des Gehirns und der Arbeitsweise der Sinnesorgane", 0, null, "Das untersuchen Biologie und Psychologie. Die Erkenntnistheorie fragt nach der Begründung von Wissen, nicht nach seinen körperlichen Abläufen."], ["Mit der Frage, wie eine gerechte Ordnung des Staates aussehen soll", 0, null, null]], "e": "Erkenntnistheorie (griechisch Epistemologie, von episteme, Wissen) fragt: Was können wir wissen, und wie können wir es begründen? Sie untersucht Bedingungen, Umfang und Grenzen menschlichen Wissens und fragt, worin sich Wissen vom bloßen Meinen oder Glauben unterscheidet. Dabei spielt die Einsicht eine Rolle, dass menschliche Erkenntnis fehleranfällig ist und Zweifel oft der Anfang von Wissen ist."}, {"teil": "Teil A · Was ist Erkenntnistheorie?", "nach": "Teil A, Abschnitt „Die großen Strömungen“", "f": "Welche Zuordnung von Strömung und Grundgedanke stimmt?", "a": [["Rationalismus: Vernunft und angeborene Ideen als Quelle des Wissens", 1], ["Kritizismus: bezweifelt, dass sicheres Wissen überhaupt möglich ist", 0, null, "Das ist der Skeptizismus. Der Kritizismus (Kant) will die Grenzen und Bedingungen der Erkenntnis aufzeigen."], ["Empirismus: zeigt die Grenzen und Bedingungen der Erkenntnis auf", 0, null, "Das ist Kants Kritizismus. Der Empirismus sieht die Erfahrung als Quelle allen Wissens."], ["Skeptizismus: sieht die Sinneswahrnehmung als Quelle allen Wissens", 0, null, null]], "e": "Die vier Strömungen begleiten dich durch das ganze Themenfeld. Der Skeptizismus bezweifelt sicheres Wissen, der Rationalismus vertraut auf die Vernunft und auf Ideen, die wir schon mitbringen (angeborene Ideen), der Empirismus sieht die Erfahrung als Quelle allen Wissens, und der Kritizismus (Kant) bestimmt die Grenzen und Bedingungen der Erkenntnis. Dazu kommen moderne Wissenschaftstheorien (Popper, Kuhn, Feyerabend)."}, {"teil": "Teil A · Was ist Erkenntnistheorie?", "nach": "Teil A, Abschnitt „Warum das heute wichtig ist“", "f": "Ein Video mit Millionen Klicks stellt eine Behauptung auf. Was folgt daraus für ihre Wahrheit?", "a": [["Nichts: Dass viele das Video gesehen haben, macht die Behauptung nicht wahr.", 1], ["Sie ist wahrscheinlich wahr, weil so viele Zuschauer sie geprüft haben.", 0, null, "Klicks sind keine Prüfung. Auch ein Experte, dem kaum jemand zuhört, hat nicht deshalb unrecht."], ["Sie ist Wissen, weil sehr viele Menschen von ihr überzeugt sind.", 0, null, "Überzeugung ist nur eine Bedingung von Wissen. Es fehlen Wahrheit und Rechtfertigung."], ["Sie ist falsch, weil Behauptungen in sozialen Medien nie stimmen.", 0, null, null]], "e": "Das Kapitel nennt genau dieses Beispiel: „Ein Video mit Millionen Klicks ist nicht deshalb wahr, weil viele es gesehen haben.“ Aufmerksamkeit ist kein Kriterium für Wahrheit. Gerade in Zeiten von Fake News und Verschwörungstheorien braucht man Kriterien für Wahrheit und Gewissheit, und man muss zwischen Meinen, Glauben und Wissen unterscheiden können."}, {"teil": "Teil B · Meinung, Glaube, Wissen", "nach": "Teil B, Abschnitt „Die Meinung“", "f": "Lina sagt: „Pizza Hawaii schmeckt besser als Pizza Margherita.“ Was liegt vor?", "a": [["Eine Meinung: Sie hält es subjektiv für wahr und gesteht anderen ein anderes Urteil zu.", 1], ["Ein Glaube: eine tiefe Überzeugung, die mit ihren Lebenszielen verbunden ist.", 0, null, "Ein Glaube ist tiefer und längerfristig und hängt mit Lebenseinstellungen zusammen. Für eine Geschmacksfrage setzt niemand sein Leben ein."], ["Wissen: Für sie ist es gewiss, und ihr Geschmack ist eine gute Begründung.", 0, null, "Wissen müsste auch objektiv zureichend sein, also mit Gründen, die andere überzeugen müssten."], ["Ein Irrtum: Sie hält etwas für wahr, das objektiv falsch ist.", 0, null, null]], "e": "Geschmacksfragen sind typische Meinungen. Eine Meinung ist ein bloß subjektives Fürwahrhalten: Ich bin von ihr überzeugt, erhebe aber keinen objektiven Wahrheitsanspruch und gestehe anderen jederzeit zu, anderer Meinung zu sein. Dass unterschiedliche Meinungen akzeptiert werden, ist nach dem Kapitel sogar ein Kennzeichen offener Gesellschaften."}, {"teil": "Teil B · Meinung, Glaube, Wissen", "nach": "Teil B, Abschnitt „Der Glaube“", "f": "Worin unterscheidet sich ein Glaube von einer Meinung?", "a": [["Er ist tiefer und längerfristig und hängt mit Lebenseinstellungen zusammen.", 1], ["Er ist objektiv begründet, sodass andere ihn anerkennen müssten.", 0, null, "Objektiv zureichend ist nach Kant erst Wissen. Ein Glaube ist nur subjektiv zureichend."], ["Er ist weniger sicher, weil er sich nicht auf Tatsachen stützt.", 0, null, "Subjektiv ist ein Glaube gerade sehr sicher: Religiös ist er mit dem höchsten Grad an subjektiver Gewissheit verbunden."], ["Er betrifft nur religiöse Fragen, eine Meinung nur weltliche.", 0, null, null]], "e": "Glaube setzt eine tiefere, längerfristige und allgemeinere Überzeugung voraus, schon im weltlichen Sinn (belief) und erst recht im religiösen Sinn (faith). Für ihren Glauben waren viele Menschen bereit zu kämpfen und zu sterben, für eine Meinung setzt niemand sein Leben ein. Ein Glaube kann Halt geben, erfüllt aber nicht den Anspruch wissenschaftlicher Begründung."}, {"teil": "Teil B · Meinung, Glaube, Wissen", "nach": "Teil B, Abschnitt „Kants Unterscheidung“", "f": "Ein Fürwahrhalten ist subjektiv zureichend, aber objektiv nicht zureichend. Was liegt nach Kant vor?", "a": [["Glauben", 1], ["Meinen", 0, null, "Meinen ist weder subjektiv noch objektiv zureichend."], ["Wissen", 0, null, "Wissen ist subjektiv und objektiv zureichend."]], "e": "Kant fragt bei jedem Fürwahrhalten zweimal: Reicht es subjektiv, also für mich selbst? Und reicht es objektiv, also mit Gründen, die auch andere überzeugen müssten? Meinen: nein/nein. Glauben: ja/nein, ich bin mir gewiss, kann es aber nicht für alle begründen. Wissen: ja/ja."}, {"teil": "Teil C · Was ist Wissen?", "nach": "Teil C, Abschnitt „Kein Wissen ohne Rechtfertigung“", "f": "Lena hat keine Ahnung, wie viele Einwohner Australien hat, tippt im Quiz auf 26 Millionen und liegt richtig. Welche Bedingung für Wissen fehlt?", "a": [["Rechtfertigung: Sie hatte keinen Grund für ihre Antwort.", 1], ["Wahrheit: Eine geratene Antwort kann nie wahr sein.", 0, null, "Lenas Antwort ist wahr, sie liegt ja richtig. Wahrheit hängt nicht davon ab, wie man zur Antwort kommt."], ["Überzeugung: Wer rät, glaubt nicht an seine Antwort.", 0, null, "Das Kapitel behandelt Raten als überzeugt und wahr, aber nicht gerechtfertigt."], ["Einigkeit: Sie hat sich nicht mit anderen abgesprochen.", 0, null, null]], "e": "Lenas Antwort war wahr, aber sie hat es nicht gewusst, weil sie keinen Grund hatte. „Ein wahrer Glaube ist noch kein gerechtfertigter Glaube.“ Ebenso beim Wunschdenken: Wer glaubt, dass seine Lieblingssängerin den Eurovision Song Contest gewinnt, und sie gewinnt, hat es trotzdem nicht gewusst. Daraus folgt P3: Kein Wissen ohne Rechtfertigung."}, {"teil": "Teil C · Was ist Wissen?", "nach": "Teil C, Abschnitt „Begründet und trotzdem falsch“", "f": "Das geozentrische Weltbild war fast 2000 Jahre lang die am besten begründete Position. Warum war es trotzdem kein Wissen?", "a": [["Weil es nicht wahr ist: Die Erde steht nicht im Mittelpunkt.", 1], ["Weil die Menschen damals unvernünftig und schlecht informiert waren.", 0, null, "Das Kapitel betont: Wer daran festhielt, war nicht unvernünftig. Es stützte sich auf Beobachtung und Mathematik (Ptolemäus)."], ["Weil es nur ein religiöser Glaube ohne Begründung war.", 0, null, null], ["Weil niemand wirklich davon überzeugt war.", 0, null, null]], "e": "Das Beispiel zeigt, dass Wahrheit und Rechtfertigung voneinander unabhängig sind. Eine Überzeugung kann sehr gut begründet und trotzdem falsch sein: „Begründung schützt also nicht vor Irrtum, und Wahrheit ohne Begründung ist bloßer Zufall.“ Erst beide zusammen machen aus einer Überzeugung Wissen."}, {"teil": "Teil C · Was ist Wissen?", "nach": "Teil C, Abschnitt „Die klassische Definition“", "f": "Was behauptet die klassische Definition über ihre drei Bedingungen?", "a": [["Jede ist notwendig, und alle drei zusammen sind hinreichend.", 1], ["Jede ist für sich allein schon hinreichend für Wissen.", 0, null, "Dann wäre schon jede Überzeugung Wissen. Das widerlegen die Beispiele Mont Blanc und Wunschdenken."], ["Zwei von dreien reichen, wenn die Begründung stark ist.", 0, null, "Das geozentrische Weltbild war stark begründet und trotzdem kein Wissen. Fehlt eine Bedingung, liegt kein Wissen vor."], ["Zusammen sind sie hinreichend, aber nicht jede ist nötig.", 0, null, null]], "e": "Notwendig heißt: Fehlt eine Bedingung, liegt kein Wissen vor. Hinreichend heißt: Sind alle drei erfüllt, fehlt nichts mehr. Die Definition „Wissen ist wahre, gerechtfertigte Überzeugung“ geht auf Platons Dialog Theätet zurück, wird dort aber am Ende nicht als ausreichend anerkannt. Gettier greift später genau den Anspruch an, dass die drei Bedingungen hinreichend sind."}, {"teil": "Teil C · Was ist Wissen?", "nach": "Teil C, Abschnitt „Reicht ‚wahr und gerechtfertigt‘? Gettier“", "f": "Die Bahnhofsuhr zeigt 12:00 Uhr, ist aber seit genau zwölf Stunden stehen geblieben. Zufällig ist es tatsächlich 12:00 Uhr. Was zeigt das Beispiel?", "a": [["Eine Überzeugung kann wahr und gerechtfertigt sein und trotzdem auf Glück beruhen.", 1], ["Eine gut begründete Überzeugung kann falsch sein, wie das geozentrische Weltbild.", 0, null, "Hier ist die Überzeugung gerade wahr. Das Beispiel zielt auf etwas anderes als die Unabhängigkeit von Wahrheit und Rechtfertigung."], ["Ohne Wahrheit gibt es kein Wissen, egal wie fest man etwas glaubt.", 0, null, null], ["Weil die Sinne täuschen, gibt es überhaupt kein sicheres Wissen.", 0, "Skeptizismus", "Das ist die skeptische Folgerung. Gettier bezweifelt nicht jedes Wissen, sondern prüft die Definition."]], "e": "Edmund Gettier zeigte 1963, dass eine Überzeugung wahr und gerechtfertigt sein kann, ohne dass wir von Wissen sprechen würden. Eine Bahnhofsuhr ist normalerweise verlässlich, also ist die Überzeugung gerechtfertigt, und sie ist wahr, und trotzdem hatte ich nur Glück. Gettier greift damit den Anspruch an, dass die drei Bedingungen hinreichend sind. Die Rechtfertigung muss wohl auf die richtige Weise mit der Wahrheit verbunden sein; wie genau, ist bis heute umstritten."}, {"typ": "arg", "teil": "Teil C · Was ist Wissen?", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in der klassischen Definition von Wissen?", "zeilen": [["P1", "Wer etwas weiß, ist davon überzeugt."], ["P2", null], ["P3", "Kein Wissen ohne Rechtfertigung."], ["K", "Wissen ist wahre, gerechtfertigte Überzeugung."]], "a": [["Kein Wissen ohne Wahrheit.", 1], ["Kein Wissen ohne Erfahrung.", 0, "Empirismus", "Dass alles Wissen aus der Erfahrung stammt, ist die These des Empirismus, keine Bedingung der klassischen Definition."], ["Kein Wissen ohne Zweifel.", 0, null, null], ["Kein Wissen ohne Gewissheit.", 0, null, "Gewissheit ist keine der drei Bedingungen. Ob es eine Rechtfertigung gibt, die jeden Zweifel ausschließt, fragt erst der Skeptizismus."]], "e": "P2 lautet: Kein Wissen ohne Wahrheit. Wer fest glaubt, der Mont Blanc sei der höchste Berg der Schweiz, weiß es nicht, weil es nicht wahr ist; ebenso Aristoteles, der glaubte, Männer hätten mehr Zähne als Frauen. Nach der klassischen Auffassung ist Wahrheit die Übereinstimmung von Aussage und Wirklichkeit. Ob das ausreicht, prüft das Kapitel „Was ist Wahrheit?“."}, {"teil": "Exkurs", "k": "4", "nach": "Exkurs 1 „Die Lüge“", "f": "Was unterscheidet eine Lüge von einem Irrtum?", "a": [["Der Lügner behauptet bewusst, was er selbst für falsch hält, um zu täuschen.", 1], ["Der Lügner sagt immer etwas Falsches, der Irrende sagt immer etwas Wahres.", 0, null, "Auch der Irrende sagt etwas Falsches. Er glaubt aber, die Wahrheit zu sagen."], ["Die Lüge betrifft moralische Fragen, der Irrtum betrifft nur Tatsachen.", 0, null, null], ["Der Irrende will täuschen, der Lügner hat sich nur nicht genug informiert.", 0, null, null]], "e": "Eine Lüge ist eine absichtliche Verfälschung: Jemand behauptet bewusst etwas, das er selbst für falsch hält, um andere zu täuschen. Der Irrende glaubt dagegen, die Wahrheit zu sagen. Die Lüge zeigt die ethische Dimension der Wahrheit. Platon erlaubte den Herrschenden die „edle Lüge“, Augustinus lehnte die Lüge grundsätzlich ab, und für Kant ist sie in jedem Fall moralisch falsch."}, {"typ": "offen", "teil": "Teil C · Was ist Wissen?", "nach": "Teil C, Abschnitt „Die klassische Definition“", "f": "Was bedeuten „notwendig“ und „hinreichend“? Welchen der beiden Ansprüche greift Gettier an?", "m": "Eine Bedingung ist notwendig, wenn ohne sie kein Wissen vorliegt. Die klassische Definition nennt drei notwendige Bedingungen: Überzeugung, Wahrheit und Rechtfertigung. Fehlt die Wahrheit (Mont Blanc) oder die Rechtfertigung (Lena rät), liegt kein Wissen vor. Hinreichend sind Bedingungen, wenn nichts mehr fehlt, sobald sie alle erfüllt sind. Gettier lässt die Notwendigkeit unangetastet und greift die Behauptung an, dass die drei zusammen hinreichend sind. Bei der stehen gebliebenen Bahnhofsuhr ist meine Überzeugung, dass es 12:00 Uhr ist, wahr und gerechtfertigt, und trotzdem habe ich nur Glück gehabt. Also braucht die Definition wohl eine weitere Bedingung: Die Rechtfertigung muss auf die richtige Weise mit der Wahrheit verbunden sein."}]}, {"id": "et-platon", "tf": "ET", "gruppe": "Grundlagen", "kapitel": "Platon - Die Ideenlehre", "titel": "Platon", "sub": "Vom Schein zum Sein", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Warum die Sinne nicht genügen", "nach": "Teil A, Abschnitt „Das Problem der Sinneswahrnehmung“", "f": "Ein Stab im Wasser sieht geknickt aus, obwohl er gerade ist. Für welchen von Platons Gründen gegen die Sinne ist das ein Beispiel?", "a": [["Sinneseindrücke können täuschen.", 1], ["Die Dinge verändern sich ständig.", 0, null, "Dafür steht die Blume, die blüht, verwelkt und vergeht."], ["Menschen nehmen dasselbe verschieden wahr.", 0, null, "Dafür steht das Wasser, das dem einen warm, dem anderen kalt vorkommt."], ["Die Sinne sind nicht angeboren.", 0, null, null]], "e": "Platon nennt drei Gründe, warum die Sinneswahrnehmung für sicheres Wissen ungeeignet ist: Die Dinge verändern sich ständig (Blume), Menschen nehmen dieselbe Sache unterschiedlich wahr (warmes oder kaltes Wasser), und Sinneseindrücke können täuschen (geknickter Stab). Daraus folgt P1 seines Arguments: Die Sinneswahrnehmung ist unsicher und veränderlich."}, {"teil": "Teil A · Warum die Sinne nicht genügen", "nach": "Teil A, Abschnitt „Meinung und Wissen“", "f": "Was kennzeichnet nach Platon wahres Wissen (episteme)?", "a": [["Es ist sicher, allgemeingültig und unveränderlich.", 1], ["Es stammt aus genauer Wahrnehmung der sichtbaren Welt.", 0, null, "Das beschreibt die doxa (Meinung): Sie entsteht durch Sinneswahrnehmung und bezieht sich auf die sichtbare Welt."], ["Es ist gut begründet, aber vorläufig und revidierbar.", 0, "Fallibilismus", "So versteht die moderne Wissenschaft Wissen (vgl. Popper). Genau diese Auffassung gilt als Einwand gegen Platon."], ["Es ist das, worauf sich die meisten Bürger einigen.", 0, null, null]], "e": "Platon unterscheidet Meinung (doxa) und wahres Wissen (episteme). Meinungen entstehen durch Sinneswahrnehmung und beziehen sich auf die sichtbare Welt. Wahres Wissen muss dagegen sicher, allgemeingültig und unveränderlich sein: „Wer weiß, dass zwei plus zwei vier ist, weiß es für immer und überall.“ Diese Unterscheidung gilt als Stärke der Ideenlehre und als grundlegend für jede Erkenntnistheorie."}, {"typ": "arg", "teil": "Zentrale Argumentation", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Platons Argument für die Ideenwelt?", "zeilen": [["P1", "Sinneswahrnehmung ist unsicher und veränderlich."], ["P2", null], ["K1", "Deshalb kann wahre Erkenntnis nicht aus der Sinneswelt stammen."], ["P3", "Wir erkennen aber Gerechtigkeit, Gleichheit oder Schönheit als Maßstab, an dem wir Einzeldinge messen."], ["K2", "Also gibt es eine ewige, vollkommene und unveränderliche Ideenwelt."], ["K3", "Wahre Erkenntnis entsteht nicht durch die Sinne, sondern durch die Vernunft."]], "a": [["Wahres Wissen muss aber sicher und unveränderlich sein.", 1], ["Die Seele hat die Ideen schon vor der Geburt geschaut.", 0, null, "Das ist die Anamnesis. Sie erklärt, wie die Seele Ideen erkennt, stützt aber nicht den Schluss auf K1."], ["Die Dinge der Sinneswelt sind Abbilder der Ideen.", 0, null, "Das ist schon Teil des Ergebnisses K2 und kann nicht Voraussetzung für K1 sein."], ["Wissen ist wahre, gerechtfertigte Überzeugung.", 0, null, null]], "e": "Erst P2 macht aus der Unsicherheit der Sinne (P1) ein Problem: Wenn Wissen sicher und unveränderlich sein muss, die Sinneswelt aber veränderlich ist, kann Erkenntnis nicht aus ihr stammen (K1). Genau diese Prämisse greift Schwäche 5 der Kritischen Würdigung an: Die moderne Wissenschaft versteht Wissen als gut begründet, aber vorläufig und revidierbar (Fallibilismus). Platon könnte antworten, dass schon das Erkennen von Veränderung einen gleichbleibenden Maßstab voraussetzt."}, {"teil": "Teil B · Die Ideenwelt", "nach": "Teil B, Abschnitt „Maßstäbe, die wir nie gesehen haben“", "f": "Warum nimmt Platon an, dass es eine Ideenwelt gibt?", "a": [["Wir messen Dinge an Maßstäben wie vollkommener Gleichheit, die wir nie gesehen haben.", 1], ["Wir haben vollkommene Kreise und vollkommene Gerechtigkeit oft genug beobachtet.", 0, null, "Gerade das bestreitet Platon: Kein gezeichneter Kreis ist vollkommen rund."], ["Ein vollkommener Gott garantiert, dass unsere klaren und deutlichen Ideen wahr sind.", 0, "Descartes", "Gott als Garant der Wahrheit gehört zu Descartes' Weg vom Cogito zur Außenwelt."], ["Alle Begriffe entstehen, indem der Verstand Sinneseindrücke vergleicht und ordnet.", 0, null, null]], "e": "Wir sagen: Diese Handlung ist gerechter als jene, diese Hölzer sind fast gleich lang. Dafür brauchen wir einen Maßstab (P3). Vollkommene Gerechtigkeit oder Gleichheit haben wir aber in der Sinneswelt nie gesehen. Platons Antwort: Es gibt eine ewige, vollkommene und unveränderliche Ideenwelt (K2), und die Dinge der Sinneswelt sind nur unvollkommene Abbilder dieser Ideen."}, {"teil": "Teil B · Die Ideenwelt", "nach": "Teil B, Abschnitt „Was Platon unter einer Idee versteht“", "f": "Was versteht Platon unter einer „Idee“?", "a": [["Ein objektiv existierendes Urbild, das unabhängig vom Menschen besteht", 1], ["Alles, was der Geist denkt oder wahrnimmt, etwa die Farbe Gelb", 0, "Locke", "So verwendet Locke das Wort „Idee“. Platons Ideen sind dagegen unveränderliche Urbilder in einer eigenen Welt."], ["Einen Begriff, den unser Denken von Anfang an von sich aus bereitstellt", 0, "Descartes", "Das sind Descartes' angeborene Ideen. Sie sind keine Erinnerungen an eine frühere Welt und keine eigenständig existierenden Urbilder."], ["Eine Vorstellung, die sich ein einzelner Mensch in seinem Kopf macht", 0, null, null]], "e": "Platons Ideen sind keine bloßen Gedanken im menschlichen Geist. Sie sind objektiv existierende Urbilder, nicht räumlich, nicht zeitlich und nicht veränderlich. Es gibt viele Bäume, große und kleine, Eichen und Tannen, aber nur eine Idee des Baums. Die Ideen machen Erkenntnis erst möglich: Ohne die Idee der Schönheit könnten wir einzelne Dinge nicht als „schön“ erkennen."}, {"teil": "Teil B · Die Ideenwelt", "nach": "Teil B, Abschnitt „Die Idee des Guten“", "f": "Warum vergleicht Platon die Idee des Guten mit der Sonne?", "a": [["Wie die Sonne die Dinge sichtbar macht, macht die Idee des Guten die Ideen erkennbar.", 1], ["Wie die Sonne auf- und untergeht, verändert sich auch das Gute mit der Zeit.", 0, null, "Ideen sind nach Platon gerade unveränderlich. Der Vergleich betrifft die Wirkung der Sonne, nicht ihren Lauf."], ["Wie die Sonne blendet, kann der Mensch das Gute überhaupt nie erkennen.", 0, null, "Im Höhlengleichnis kann der Befreite zuletzt die Sonne selbst betrachten. Das Licht blendet nur am Anfang."], ["Wie die Sonne im Mittelpunkt der Welt steht, steht das Gute im Mittelpunkt des Staates.", 0, null, null]], "e": "An der Spitze der Ideenwelt steht die Idee des Guten, die Platon im Sonnengleichnis darstellt. Wie die Sonne die Dinge sichtbar macht und wachsen lässt, so macht die Idee des Guten die Ideen erkennbar. Sie ist also nicht nur moralischer Maßstab, sondern Voraussetzung dafür, dass Erkenntnis überhaupt gelingen kann. Im Höhlengleichnis steht die Sonne außerhalb der Höhle für sie."}, {"teil": "Teil C · Das Höhlengleichnis", "nach": "Teil C, Abschnitt „Der Aufstieg“", "f": "Wofür stehen im Höhlengleichnis die Dinge außerhalb der Höhle?", "a": [["Für die Ideen, die nur durch Denken erkannt werden", 1], ["Für die Dinge der Sinneswelt, die wir sehen und anfassen", 0, null, "Für die Sinnesdinge stehen die Gegenstände, die in der Höhle vor dem Feuer vorbeigetragen werden."], ["Für die Idee des Guten, die alles andere erkennbar macht", 0, null, "Für die Idee des Guten steht die Sonne, die der Befreite erst ganz zuletzt betrachten kann."], ["Für die Meinungen, die in der Polis allgemein gelten", 0, null, null]], "e": "Jedes Element hat eine Bedeutung: Die Gefesselten sind Menschen, die nur Sinneswahrnehmung und Meinungen folgen. Die Schatten sind Abbilder, die für die ganze Wirklichkeit gehalten werden. Gegenstände und Feuer stehen für die Dinge der Sinneswelt und das, was sie sichtbar macht. Die Dinge draußen sind die Ideen, die Sonne ist die Idee des Guten."}, {"teil": "Teil C · Das Höhlengleichnis", "nach": "Teil C, Abschnitt „Der Aufstieg“", "f": "Warum will der Befreite zunächst zurück zu den vertrauten Schatten?", "a": [["Das Licht blendet ihn; Bildung ist für Platon ein schmerzhafter Weg.", 1], ["Er erkennt, dass die Schatten die eigentliche Wirklichkeit sind.", 0, null, null], ["Die anderen Gefesselten verlachen ihn und drohen ihm mit dem Tod.", 0, null, "Das geschieht erst bei der Rückkehr in die Höhle, nicht beim Aufstieg."], ["Er hat draußen die Sonne gesehen und ist von ihr enttäuscht.", 0, null, null]], "e": "Der Befreite wird zum Ausgang gezwungen, das Licht blendet ihn, und erst allmählich gewöhnt er sich daran. Platon beschreibt Erkenntnis als mühsamen Aufstieg: Man muss sich aus Gewohnheiten, Meinungen und Sinnestäuschungen lösen, und dabei gehen vertraute Sicherheiten verloren. Erkenntnis ist ein Übergang vom Schein zum Sein, von Meinung zu Wissen, von Sinneswahrnehmung zu begrifflichem Denken."}, {"teil": "Teil C · Das Höhlengleichnis", "nach": "Teil C, Abschnitt „Die Rückkehr“", "f": "Worauf spielt Platon an, wenn der Befreite in der Höhle verlacht und mit dem Tod bedroht wird?", "a": [["Auf Sokrates, den die Athener 399 v. Chr. zum Tod verurteilten", 1], ["Auf Aristoteles, der eine eigene Ideenwelt bezweifelte", 0, null, "Aristoteles ist Platons Schüler und Kritiker. Die Rückkehr verweist auf Platons Lehrer Sokrates."], ["Auf Platons eigene Reisen nach Süditalien und Sizilien", 0, null, null], ["Auf die Sophisten, die für Geld Redekunst lehrten", 0, null, null]], "e": "Der Befreite kehrt zurück, um die anderen zu befreien, sieht aber im Dunkeln schlecht und wird verlacht und bedroht. Das spielt auf Sokrates an, dessen Hinrichtung Platon so erschütterte, dass er sich ganz der Philosophie zuwandte. Zugleich leitet die Rückkehr zur politischen Frage über, wer im Staat herrschen soll."}, {"teil": "Teil B · Die Ideenwelt", "k": "4", "nach": "Teil B, Abschnitt „Lernen ist Wiedererinnerung“", "f": "Was soll das Beispiel des Sklavenjungen im Dialog Menon zeigen?", "a": [["Lernen ist Wiedererinnerung an Ideen, die die Seele vor der Geburt geschaut hat.", 1], ["Der Geist ist bei der Geburt ein unbeschriebenes Blatt, das erst die Erfahrung füllt.", 0, "Locke", "Das ist Lockes tabula rasa, die Gegenposition zu angeborenem oder erinnertem Wissen."], ["Unser Denken bringt Begriffe mit, die keine Erinnerung an eine frühere Welt sind.", 0, "Descartes", "So beschreibt das Fachwissen Descartes' angeborene Ideen, ausdrücklich im Unterschied zu Platon."], ["Durch Beobachtung und Experiment gewinnt man zuverlässige Erkenntnisse.", 0, null, null]], "e": "Wie kann die Seele Ideen erkennen, die sie nie gesehen hat? Platon antwortet mit der Anamnesis (Wiedererinnerung): Die Seele hat die Ideen vor der Geburt geschaut, Lernen heißt sich erinnern. Sokrates bringt einen Sklavenjungen, der nie Geometrie gelernt hat, allein durch geschickte Fragen dazu, eine Geometrieaufgabe selbst zu lösen. Daraus folgt K3: Wahre Erkenntnis entsteht durch die Vernunft, nicht durch die Sinne."}, {"teil": "Teil D · Die vier Stufen der Erkenntnis", "k": "4", "nach": "Teil D, Abschnitt „Die vier Stufen an einem Ball“", "f": "Ich berechne die Oberfläche einer Kugel mit der Formel O = 4 · π · r². Auf welcher Stufe des Liniengleichnisses stehe ich?", "a": [["Nachdenken (diskursives Denken)", 1], ["Erkennen (Ideenschau)", 0, null, "Die Mathematik stützt sich noch auf Voraussetzungen, die sie einfach annimmt. Erst die Ideenschau prüft auch diese."], ["Meinen oder Glauben", 0, null, null], ["Vermutung (Einbildung)", 0, null, null]], "e": "Im Liniengleichnis unterscheidet Platon vier Stufen: Vermutung (Schatten und Abbilder), Meinen/Glauben (sinnlich wahrgenommene Dinge), Nachdenken (Mathematik und Verstand, noch auf Voraussetzungen gestützt) und Erkennen (Schau der Ideen selbst). Die Formel setzt gleiche Abstände aller Oberflächenpunkte einfach voraus. Die Stufen 1-2 entsprechen der doxa, die Stufen 3-4 der episteme."}, {"teil": "Kritische Würdigung", "k": "4", "nach": "Kritische Würdigung, Schwäche 6", "f": "Welchen Einwand gegen die Ideenlehre erhebt schon Aristoteles?", "a": [["Unklar ist, wie Einzeldinge an getrennten Ideen teilhaben; die Form liegt in den Dingen.", 1], ["Vernunft ist immer leiblich vermittelt, deshalb darf man die Sinne nicht abwerten.", 0, "Nietzsche", "Diesen Einwand gegen die Abwertung der Sinnlichkeit nennt das Kapitel unter Schwäche 3."], ["Wissen ist gut begründet, aber vorläufig, und muss nicht unveränderlich sein.", 0, "Fallibilismus", "Das ist die moderne Kritik an Prämisse P2 (Schwäche 5, vgl. Popper)."], ["Die Stufen der Erkenntnis sind keine Stufen der Wahrheit, sondern der Klarheit.", 0, null, null]], "e": "Das Problem der Teilhabe (methexis): Wenn die Ideen getrennt von den Dingen existieren, bleibt unklar, wie ein einzelner Baum an der Idee des Baums „teilhaben“ soll. Deshalb bezweifelte schon Platons Schüler Aristoteles eine eigene Ideenwelt: Für ihn liegt die Form in den Dingen selbst. Eine weitere Schwäche ist die metaphysische Überfrachtung: Eine Ideenwelt ist empirisch nicht überprüfbar."}, {"teil": "Exkurs", "k": "4", "nach": "Exkurs 1 „Warum steht das Höhlengleichnis in der Politeia?“", "f": "Warum steht das Höhlengleichnis in Platons Politeia, einem Werk über den Staat?", "a": [["Nur wer das Wahre kennt, kann gerecht regieren; daher sollen Philosophen herrschen.", 1], ["Der Staat soll die Bürger in der Höhle ihrer Meinungen schützen und ruhig halten.", 0, null, "Bei Platon hat der Befreite die Pflicht, zurückzukehren und den anderen Orientierung zu geben."], ["Philosophen sollen herrschen, weil sie die größte Macht und das meiste Geld haben.", 0, null, "Platon begründet die Herrschaft der Philosophen nicht mit Macht, sondern mit ihrem Zugang zur Wahrheit."], ["Herrschen soll, worauf sich alle Bürger im freien Gespräch einigen würden.", 0, null, null]], "e": "Die Politeia fragt nach der gerechten Ordnung der Gesellschaft. Das Höhlengleichnis verbindet Erkenntnistheorie und Politik: Die meisten Menschen sind in der „Höhle“ der Meinungen gefangen, der Philosoph wagt den Aufstieg und erkennt die Ideen. Wer diese Erkenntnis hat, soll in die Höhle zurückkehren und anderen Orientierung geben. Deshalb sollen in Platons idealem Staat Philosophen herrschen, wegen ihres Zugangs zur Wahrheit."}, {"typ": "offen", "teil": "Teil C · Das Höhlengleichnis", "nach": "Teil C, Abschnitt „Erkenntnis als anstrengender Prozess“", "f": "Ordne jedem Element des Höhlengleichnisses seine Bedeutung zu und erkläre, was das Gleichnis über Erkenntnis aussagt.", "m": "Die Gefesselten stehen für Menschen, die nur der Sinneswahrnehmung und den üblichen Meinungen folgen. Die Schatten an der Wand sind Abbilder, die sie für die ganze Wirklichkeit halten. Die vorbeigetragenen Gegenstände und das Feuer stehen für die Dinge der Sinneswelt und das, was sie sichtbar macht. Die Dinge außerhalb der Höhle sind die Ideen, die nur durch Denken erkannt werden, und die Sonne ist die Idee des Guten, die alles erkennbar macht. Der Aufstieg zeigt, dass Erkenntnis mühsam und schmerzhaft ist: Das Licht blendet, vertraute Sicherheiten gehen verloren. Erkenntnis ist ein Übergang vom Schein zum Sein, von der doxa zur episteme. Die Rückkehr, bei der der Befreite verlacht und bedroht wird, spielt auf Sokrates an und führt zur Frage, wer im Staat herrschen soll."}]}, {"id": "et-wahrheit", "tf": "ET", "gruppe": "Grundlagen", "kapitel": "Was ist Wahrheit", "titel": "Wahrheit", "sub": "Drei Wahrheitstheorien", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Korrespondenztheorie", "nach": "Teil A, Abschnitt „Aristoteles und Thomas von Aquin“", "f": "Wer sagt das? „Wahrheit ist die Übereinstimmung von Verstand und Sache (adaequatio rei et intellectus).“", "a": [["Thomas von Aquin", 1], ["Hegel", 0, null, "Von Hegel stammt „Das Wahre ist das Ganze“. Er wird der Kohärenztheorie zugeordnet."], ["Habermas", 0, null, null], ["Peirce", 0, null, null]], "e": "Thomas von Aquin (1224-1274) fasst im Mittelalter die Korrespondenztheorie in diese berühmte Formel. Schon Aristoteles hatte gesagt: „Zu sagen, das Seiende sei und das Nicht-Seiende sei nicht, ist wahr.“ Modern zugespitzt: Der Satz „Es regnet“ ist genau dann wahr, wenn es regnet."}, {"teil": "Teil A · Korrespondenztheorie", "nach": "Teil A, Abschnitt „Wahrheit hängt nicht vom Glauben ab“", "f": "Was folgt aus der Korrespondenztheorie?", "a": [["Ob eine Aussage wahr ist, hängt nicht davon ab, wie viele sie glauben.", 1], ["Wahr ist eine Aussage erst, wenn sie zu allen anerkannten Aussagen passt.", 0, "Kohärenztheorie", "Das ist die Grundidee der Kohärenztheorie: Wahrheit als Frage des Zusammenhangs."], ["Wahr ist, worauf sich die Forschergemeinschaft auf lange Sicht einigen würde.", 0, "Peirce", "Das ist Peirces Konsenstheorie."], ["Wahr ist eine Aussage, wenn sie sich im Handeln bewährt und funktioniert.", 0, "William James", null]], "e": "Wahrheit liegt nach der Korrespondenztheorie in der Welt, nicht in unseren Köpfen. „Der Mond umkreist die Erde“ war schon wahr, bevor es Menschen gab, die das wussten, und „Die Sonne kreist um die Erde“ war falsch, auch als fast alle es glaubten. Genau deshalb kann man sich irren: Man glaubt etwas, und die Welt ist anders."}, {"teil": "Teil A · Korrespondenztheorie", "nach": "Teil A, Abschnitt „Was die Theorie erklärt und wo sie an Grenzen stößt“", "f": "Wo stößt die Korrespondenztheorie an ihre Grenze?", "a": [["Wir können eine Aussage nie direkt neben die Wirklichkeit legen und vergleichen.", 1], ["Auch ein in sich widerspruchsfreies System kann als Ganzes falsch sein.", 0, "Kohärenztheorie", "Das ist die Grenze der Kohärenztheorie (Harry Potter, Verschwörungstheorie)."], ["Die idealen Bedingungen eines freien Gesprächs sind nie ganz erfüllt.", 0, "Konsenstheorie", "Das ist die Grenze der Konsenstheorie von Habermas."], ["Auch eine falsche Theorie kann lange Zeit nützlich und erfolgreich sein.", 0, null, null]], "e": "Um Übereinstimmung zu prüfen, müssten wir aus unserem Kopf heraustreten und von außen nachsehen, ob Gedanke und Welt zusammenpassen. Wir haben aber immer nur Wahrnehmungen und andere Aussagen; auch der Blick aus dem Fenster auf den Regen ist eine Wahrnehmung, die täuschen kann. Eine zweite Grenze: Womit stimmen „Versprechen soll man halten“ oder „2 + 2 = 4“ überein? Moralische und mathematische Aussagen haben kein klares Gegenstück in der Welt."}, {"teil": "Teil B · Kohärenztheorie", "nach": "Teil B, Abschnitt „So prüfen wir tatsächlich“", "f": "2011 melden Physiker, sie hätten Teilchen gemessen, die schneller als das Licht sind. Kaum jemand glaubt es, weil es der Relativitätstheorie widerspricht. Welche Theorie beschreibt dieses Vorgehen?", "a": [["Kohärenztheorie", 1], ["Korrespondenztheorie", 0, null, "Niemand hat die Messung direkt mit der Wirklichkeit verglichen. Man hat sie mit dem übrigen Wissen abgeglichen."], ["Konsenstheorie", 0, null, null], ["Pragmatische Theorie", 0, null, null]], "e": "Die Messung passte nicht in das System gut abgesicherter Aussagen, deshalb zweifelte man zuerst an ihr, und tatsächlich hatte ein lockeres Kabel den Fehler verursacht. Genauso prüfen wir Gerüchte: Wer hört, der Lehrer sei gestern in Tokio gewesen, ihn aber im Unterricht gesehen hat, glaubt es nicht, ohne nach Tokio zu fahren. Das ist die Stärke der Kohärenztheorie: Sie beschreibt, wie wir tatsächlich prüfen."}, {"teil": "Teil B · Kohärenztheorie", "nach": "Teil B, Abschnitt „Neurath und das Schiff auf offener See“", "f": "Was will Otto Neurath mit dem Bild vom Schiff auf offener See sagen?", "a": [["Wir können unser Wissen nie von einem festen Punkt außerhalb neu aufbauen, nur Planke für Planke umbauen.", 1], ["Man muss einmal im Leben alle Überzeugungen ausschütten und nur die sicheren wieder zurücklegen.", 0, "Descartes", "Das ist Descartes' Bild vom Korb mit Äpfeln. Neurath hält gerade diesen Neuanfang von außen für unmöglich."], ["Wie Seeleute nach den Sternen sollen wir jede Aussage an der Wirklichkeit selbst ausrichten.", 0, null, null], ["Wie Baron Münchhausen müsste sich unser Wissen an den eigenen Haaren aus dem Sumpf ziehen.", 0, "Hans Albert", "Das ist das Münchhausen-Trilemma aus dem Kapitel zum Skeptizismus."]], "e": "Seeleute müssen ihr Schiff auf offener See umbauen, ohne es je im Trockendock zerlegen zu können. Ebenso gleichen wir jede neue Aussage mit dem Bestand anerkannter Aussagen ab: Passt sie, wird sie aufgenommen; widerspricht sie, verwerfen wir sie oder ändern Teile des Bestands. Wahrheit ist nach der Kohärenztheorie keine Eigenschaft eines einzelnen Satzes, sondern eine Frage des Zusammenhangs."}, {"teil": "Teil B · Kohärenztheorie", "nach": "Teil B, Abschnitt „Was die Theorie erklärt und wo sie an Grenzen stößt“", "f": "Warum ist eine gut gebaute Verschwörungstheorie ein Problem für die Kohärenztheorie?", "a": [["Sie kann in sich widerspruchsfrei sein und als Ganzes trotzdem falsch.", 1], ["Viele Menschen glauben an sie, obwohl sie offensichtlich falsch ist.", 0, null, "Dass Mehrheit nicht Wahrheit ist, betrifft die Konsenstheorie. Die Kohärenztheorie fragt nach dem Zusammenhang, nicht nach der Zahl der Anhänger."], ["Ein einziger Gegenfall reicht aus, um sie endgültig zu widerlegen.", 0, "Popper", null], ["Sie passt zu keiner einzigen Beobachtung, die wir machen können.", 0, null, null]], "e": "Eine gut gebaute Verschwörungstheorie erklärt jede Beobachtung und jeden Einwand, und gerade das macht sie schwer zu widerlegen. Ebenso ist die Welt von Harry Potter weitgehend widerspruchsfrei und trotzdem erfunden. Außerdem können zwei Systeme in sich stimmig sein und sich gegenseitig widersprechen; Kohärenz allein kann dann nicht entscheiden. Irgendwo muss wieder der Kontakt zur Wirklichkeit ins Spiel kommen."}, {"teil": "Teil C · Konsenstheorie", "nach": "Teil C, Abschnitt „Habermas: tatsächlicher und idealer Konsens“", "f": "Über Jahrhunderte waren sich fast alle einig, dass die Sonne um die Erde kreist. Wie ordnet Habermas diese Einigung ein?", "a": [["Als tatsächlichen Konsens, der falsch sein kann", 1], ["Als idealen Konsens, der Wahrheit verbürgt", 0, null, "Ein idealer Konsens entsteht erst im freien Gespräch aller Betroffenen, in dem allein das bessere Argument zählt."], ["Als Beleg dafür, dass die Mehrheit entscheidet", 0, null, null], ["Als Kohärenz, weil das Weltbild stimmig war", 0, null, null]], "e": "Habermas unterscheidet zwei Arten der Einigung. Ein tatsächlicher Konsens ist das, was eine Gruppe zu einem Zeitpunkt teilt; er kann falsch sein. Ein idealer Konsens käme in einem freien Gespräch zustande, an dem alle Betroffenen mit gleichen Rederechten teilnehmen, niemand unter Druck steht und allein der „zwanglose Zwang des besseren Arguments“ zählt. Nur ein solcher Konsens verbürgt Wahrheit."}, {"teil": "Teil C · Konsenstheorie", "nach": "Teil C, Abschnitt „Mehrheit ist nicht Wahrheit“", "f": "Eine Klasse stimmt nach einer Diskussion ab. Einige trauen sich aus Angst vor Spott nicht zu widersprechen. Ist das Ergebnis ein idealer Konsens?", "a": [["Nein, denn unter Gruppendruck zählt nicht allein das bessere Argument.", 1], ["Ja, denn alle Betroffenen waren dabei und durften abstimmen.", 0, null, "Teilnahme allein reicht nicht. Es darf auch niemand unter Druck gesetzt werden."], ["Ja, sobald eine klare Mehrheit zustimmt, gilt der Konsens als ideal.", 0, null, null], ["Nein, denn einen idealen Konsens können nur Fachleute erzielen.", 0, null, "Habermas verlangt gerade, dass alle Betroffenen teilnehmen dürfen, nicht nur Experten."]], "e": "Die Konsenstheorie fragt nicht, worauf wir uns geeinigt haben, sondern worauf wir uns einigen würden, wenn alle frei, gleich und gut informiert streiten könnten. Ein Konsens aus Angst, Werbung, Gruppendruck oder fehlender Information zählt nicht. Deshalb macht auch ein Video mit Millionen Klicks seine Aussage nicht wahr: Mehrheit ist nicht Wahrheit."}, {"teil": "Teil D · Induktion und Deduktion", "nach": "Teil D, Abschnitt „Eine andere Frage“", "f": "Wie verhalten sich Induktion und Deduktion zu den drei Wahrheitstheorien?", "a": [["Sie sind Schlussformen: Sie fragen, wie wir von vorhandenen zu neuen Aussagen kommen.", 1], ["Sie sind eine vierte und fünfte Wahrheitstheorie neben den drei klassischen Theorien.", 0, null, "Sie werden oft zusammen besprochen, beantworten aber nicht die Frage, was eine Aussage wahr macht."], ["Die Deduktion gehört zur Korrespondenztheorie, die Induktion zur Kohärenztheorie.", 0, null, null], ["Sie ersetzen die Wahrheitstheorien, weil sie selbst entscheiden, was wahr ist.", 0, null, "Die Deduktion überträgt Wahrheit nur von den Prämissen auf die Konklusion. Sie kann keine Wahrheit erzeugen, die vorher nicht da war."]], "e": "Die Wahrheitstheorien fragen: Was macht eine Aussage wahr? Induktion und Deduktion fragen: Wie kommen wir von Aussagen, die wir schon haben, zu neuen Aussagen? Es sind zwei Arten des Schließens. Die Deduktion ist sicher, bringt aber nichts Neues; die Induktion erweitert das Wissen, liefert aber keine Gewissheit."}, {"typ": "arg", "teil": "Teil D · Induktion und Deduktion", "nach": "Teil D, Abschnitt „Deduktion: vom Allgemeinen zum Besonderen“", "f": "Welcher Schritt fehlt in diesem deduktiven Schluss?", "zeilen": [["P1", "Alle Säugetiere atmen mit Lungen."], ["P2", null], ["K", "Also atmet ein Delfin mit Lungen."]], "a": [["Ein Delfin ist ein Säugetier.", 1], ["Alle Delfine, die ich bisher sah, atmeten mit Lungen.", 0, null, "Das wäre ein Schluss von beobachteten Einzelfällen auf eine Regel, also eine Induktion."], ["Ein Delfin lebt im Meer wie ein Fisch.", 0, null, null], ["Manche Tiere im Meer atmen mit Lungen.", 0, null, "Daraus folgt nichts über den Delfin. Die Deduktion braucht einen Satz, der den Einzelfall unter die allgemeine Regel stellt."]], "e": "Bei der Deduktion schließen wir von allgemeinen Aussagen auf einen Einzelfall. Ihre Stärke: Sind die Prämissen wahr und ist der Schluss gültig, muss die Konklusion wahr sein. Der Preis: Die Konklusion sagt nichts Neues, denn dass der Delfin mit Lungen atmet, steckte schon in den Prämissen."}, {"teil": "Teil D · Induktion und Deduktion", "nach": "Teil D, Abschnitt „Gültig heißt nicht wahr“", "f": "„Alle Border Collies sind braun-weiß gefleckt. Rex ist ein Border Collie. Also ist Rex braun-weiß gefleckt.“ Warum ist der Schluss gültig, das Ergebnis aber trotzdem falsch?", "a": [["Die Form stimmt, aber die erste Prämisse ist falsch.", 1], ["Er schließt vorschnell von einem Hund auf alle Border Collies.", 0, null, "Das wäre eine vorschnelle Induktion wie beim gefleckten Nachbarshund. Der Rex-Schluss ist eine Deduktion."], ["Die Konklusion sagt etwas Neues, das nicht in den Prämissen steht.", 0, null, null], ["Er dreht sich im Kreis, weil die Konklusion vorausgesetzt wird.", 0, null, null]], "e": "Es gibt auch schwarz-weiße Border Collies, die erste Prämisse ist also falsch. Ein Schluss kann formal einwandfrei (gültig) sein und trotzdem zu einem falschen Ergebnis führen. Die Deduktion überträgt Wahrheit zuverlässig von den Prämissen auf die Konklusion, sie kann aber keine Wahrheit erzeugen, die vorher nicht da war."}, {"teil": "Teil D · Induktion und Deduktion", "nach": "Teil D, Abschnitt „Das Induktionsproblem“", "f": "Ein Truthahn wird jeden Morgen gefüttert und wird immer sicherer, dass es so weitergeht. Am Morgen vor dem Fest kommt der Bauer ohne Futter. Was zeigt Russells Geschichte?", "a": [["Auch viele Bestätigungen beweisen nicht, dass eine Regel künftig gilt.", 1], ["Ein deduktiver Schluss ist unsicher, wenn die Prämissen geraten sind.", 0, null, "Der Truthahn schließt nicht deduktiv, sondern von vielen Einzelfällen auf eine Regel."], ["Die Sinne täuschen, deshalb ist keine Wahrnehmung völlig sicher.", 0, null, null], ["Gewohnheiten sind vernünftig, weil sie sich lange bewährt haben.", 0, null, null]], "e": "Das ist das Induktionsproblem, das schon David Hume formuliert hat: Der Schluss von bisherigen auf zukünftige Fälle lässt sich nicht logisch begründen. Dass die Sonne bisher jeden Morgen aufging, beweist nicht, dass sie es morgen tut. Je mehr Bestätigungen der Truthahn gesammelt hatte, desto sicherer war er sich, und trotzdem lag er falsch."}, {"teil": "Teil D · Induktion und Deduktion", "nach": "Teil D, Abschnitt „Poppers Antwort: Falsifikation“", "f": "Warum kann nach Popper ein einziger schwarzer Schwan mehr beweisen als eine Million weiße?", "a": [["Bestätigungen beweisen eine Regel nie, ein Gegenfall widerlegt sie aber.", 1], ["Seltene Beobachtungen sind grundsätzlich verlässlicher als häufige.", 0, null, null], ["Weil sich die Fachleute auf den schwarzen Schwan geeinigt haben.", 0, null, "Popper argumentiert logisch, nicht mit Einigung: Ein Gegenfall widerspricht der allgemeinen Regel."], ["Eine Million reicht nicht; ab einer Milliarde wäre die Regel bewiesen.", 0, null, "Keine Zahl von Bestätigungen macht eine allgemeine Regel gewiss. Das ist ja das Induktionsproblem."]], "e": "Allgemeine Regeln lassen sich nie endgültig beweisen, aber durch einen einzigen Gegenfall widerlegen. Als europäische Seefahrer 1697 in Australien schwarze Schwäne entdeckten, war „Alle Schwäne sind weiß“ erledigt. Popper folgert: Forscher sollen ihre Theorien möglichst streng prüfen und widerlegen wollen (Falsifikation). Eine Theorie, die viele Prüfungen überstanden hat, gilt als bewährt, aber immer nur vorläufig."}, {"typ": "offen", "teil": "Teil C · Konsenstheorie", "nach": "Teil C, Abschnitt „Was die Theorie erklärt und wo sie an Grenzen stößt“", "f": "Einigen sich Forscher, weil eine Aussage wahr ist, oder ist sie wahr, weil sie sich einigen? Was folgt daraus für die Konsenstheorie?", "m": "Die Konsenstheorie sagt: Wahr ist, worauf sich alle vernünftig Urteilenden unter idealen Bedingungen einigen würden (Peirce, Habermas). Danach wäre eine Aussage wahr, weil man sich auf sie einigt. Fragt man aber, warum sich Forscher am Ende einig sind, dass die Erde um die Sonne kreist, lautet die naheliegende Antwort: weil die Erde tatsächlich um die Sonne kreist. Dann wäre die Übereinstimmung mit der Wirklichkeit der eigentliche Grund für die Wahrheit, und der Konsens nur ihr Zeichen. Das spricht dafür, dass die Konsenstheorie eher beschreibt, wie wir Wahrheit feststellen und prüfen, als worin Wahrheit besteht. Das Fazit des Kapitels passt dazu: Die Korrespondenztheorie sagt, worin Wahrheit besteht, die Konsenstheorie erinnert daran, dass sich Wahrheit in der Begründung vor anderen bewähren muss."}]}, {"id": "et-skepsis", "tf": "ET", "gruppe": "Zweifel und Gewissheit", "kapitel": "Der Skeptizismus", "titel": "Skeptizismus", "sub": "Gibt es überhaupt sicheres Wissen?", "kurse": ["4"], "fragen": [{"teil": "Teil A · Warum zweifeln?", "nach": "Teil A, Abschnitt „Die Konklusion: kein sicherer Maßstab“", "f": "Worin unterscheidet sich der philosophische Zweifel des Skeptikers vom alltäglichen Zweifel?", "a": [["Er zweifelt grundsätzlich, auch dort, wo es keinen konkreten Anlass gibt.", 1], ["Er zweifelt nur dann, wenn er einen konkreten Grund zum Zweifeln hat.", 0, null, "So zweifeln wir im Alltag. Der Skeptiker braucht keinen konkreten Anlass."], ["Er zweifelt nur an den Sinnen, dem Denken vertraut er dagegen völlig.", 0, null, "P2 sagt: Beide Quellen sind fehlbar. Auch das Denken irrt (Fehlschlüsse, Rechenfehler)."], ["Er zweifelt nur als Mittel, um ein unbezweifelbares Fundament zu finden.", 0, "Descartes", "Das ist Descartes' methodischer Zweifel. Bei Sextus führt der Zweifel nicht zu einer ersten Gewissheit, sondern zu Urteilsenthaltung und Seelenruhe."]], "e": "Aus P1 (Wissen beruht auf Wahrnehmung und Denken) und P2 (beide sind fehlbar) folgt K: Es gibt keinen absolut sicheren Maßstab für Wahrheit. Der Skeptiker sagt nicht, dass alles falsch ist oder die Sinne immer täuschen. Weil sie manchmal täuschen und wir nicht erkennen können, wann, ist keine Wahrnehmung völlig sicher. Deshalb zweifelt er grundsätzlich, nicht nur aus konkretem Anlass."}, {"typ": "arg", "teil": "Teil A · Warum zweifeln?", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt im skeptischen Grundargument?", "zeilen": [["P1", "Unser Wissen beruht auf Sinneswahrnehmung und auf Denken."], ["P2", null], ["K", "Also gibt es keinen absolut sicheren Maßstab, der Wahrheit garantiert."]], "a": [["Beide sind fehlbar.", 1], ["Beide täuschen uns immer.", 0, null, "Das behauptet der Skeptiker gerade nicht. Es reicht, dass sie manchmal täuschen und wir nicht wissen, wann."], ["Beide sind uns angeboren.", 0, null, null], ["Beide sind durch Gott gesichert.", 0, "Descartes", "Gott als Garant der Wahrheit ist Descartes' Antwort auf den Zweifel, keine skeptische Prämisse."]], "e": "P2 lautet: Beide Quellen sind fehlbar. Die Sinne täuschen (der Stab im Wasser, die Pfeillinien, das Phantomvibrieren des Handys), Erinnerungen vermischen sich mit späteren Erzählungen, und das Denken macht Fehler. Daraus folgt nicht, dass alles falsch ist, sondern dass Zweifel an allen Erkenntnisansprüchen möglich wird."}, {"teil": "Teil B · Skeptische Szenarien", "nach": "Teil B, Abschnitt „Das Traumargument“", "f": "Was ist der Kern des Traumarguments?", "a": [["Es gibt kein sicheres Kennzeichen, an dem ich Wachen und Träumen unterscheiden kann.", 1], ["Ein Supercomputer könnte alle meine Wahrnehmungen durch elektrische Reize erzeugen.", 0, "Putnam", "Das ist das Gehirn im Tank, die moderne Fassung des Gedankens."], ["Im Traum irre ich mich sogar beim Rechnen, also ist auch die Mathematik unsicher.", 0, null, "Selbst im Traum gilt: Zwei und drei ergeben fünf. Erst der allmächtige Täuscher zieht die Mathematik in Zweifel."], ["Träume zeigen, dass einzelne Wahrnehmungen unter schlechten Bedingungen täuschen.", 0, null, null]], "e": "Im Traum halten wir das Geträumte meist für wirklich, und im Traum selbst gibt es oft kein sicheres Zeichen, das uns verrät, dass wir träumen. Descartes folgert in den Meditationen: Dann kann ich auch jetzt nicht sicher wissen, dass ich wach bin. Das Traumargument zieht alle Überzeugungen über die Außenwelt und den eigenen Körper in Zweifel, lässt aber Mathematik und Logik stehen."}, {"teil": "Teil B · Skeptische Szenarien", "nach": "Teil B, Abschnitt „Wie weit reichen die Szenarien?“", "f": "Was bleibt selbst beim stärksten skeptischen Szenario, dem allmächtigen Täuscher, unberührt?", "a": [["Dass mir etwas so erscheint und dass ich bin, solange ich denke", 1], ["Dass die Mathematik gilt und es die Außenwelt im Großen gibt", 0, null, "Der allmächtige Täuscher könnte mich gerade auch bei Mathematik und Logik täuschen."], ["Dass Gott mich nicht täuscht und klare Ideen deshalb wahr sind", 0, "Descartes", "Diesen Schritt geht Descartes erst später, um vom Cogito zur Welt zurückzufinden. Unberührt vom Szenario ist er nicht."], ["Dass meine Erinnerungen an frühere Gedanken zuverlässig sind", 0, null, null]], "e": "Je stärker das Szenario, desto mehr Überzeugungen fallen. Zwei Dinge lässt aber selbst der allmächtige Täuscher unberührt: dass mir etwas so erscheint, und darauf baut Sextus Empiricus, und dass ich existiere, solange ich zweifle und denke, und darauf baut Descartes. Das Skeptizismus-Kapitel bereitet damit beide Wege vor: die antike Skepsis und den methodischen Zweifel."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Zwei Formen antiker Skepsis“", "f": "Worin unterscheidet sich die pyrrhonische Skepsis des Sextus von der akademischen Skepsis?", "a": [["Sie enthält sich sogar der Behauptung, es gebe kein sicheres Wissen.", 1], ["Sie behauptet, es gebe kein sicheres Wissen, nur Wahrscheinliches.", 0, "Akademische Skepsis", "Das ist die These der akademischen Skepsis (Arkesilaos, Karneades)."], ["Sie nutzt den Zweifel als Mittel, um am Ende Gewissheit zu finden.", 0, "Descartes", "Für Descartes ist der Zweifel ein Werkzeug, für Sextus führt er zur Seelenruhe."], ["Sie bezweifelt sogar, dass uns der Honig süß zu schmecken scheint.", 0, null, null]], "e": "Die akademische Skepsis (Arkesilaos, Karneades) behauptete: Es gibt kein sicheres Wissen, nur Wahrscheinliches. Die pyrrhonische Skepsis, benannt nach Pyrrhon von Elis, ging radikaler vor und enthielt sich auch dieser Behauptung. Ihr wichtigster Zeuge ist Sextus Empiricus mit dem Grundriss der pyrrhonischen Skepsis."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Gleichgewicht der Gründe“", "f": "Meerwasser ist für Fische gesund und lebenswichtig, für Menschen ungenießbar und schädlich. Was will Sextus damit zeigen?", "a": [["Isosthenie: Jeder Behauptung steht eine gleich starke Gegenbehauptung gegenüber.", 1], ["Diallele: Jede Begründung stützt sich am Ende wieder auf sich selbst.", 0, null, "Die Diallele ist der Zirkel, etwa beim Gedächtnis, das sich mit Erinnerungen selbst bestätigt."], ["Induktionsproblem: Aus vielen Einzelfällen folgt keine sichere Regel.", 0, "Hume", null], ["Fallibilismus: Wissen ist möglich, auch wenn wir uns irren könnten.", 0, null, null]], "e": "Der Skeptiker stellt Wahrnehmung gegen Wahrnehmung und Gedanke gegen Gedanke und merkt, dass sich für jede Behauptung eine gleich starke Gegenbehauptung finden lässt. Dieses Gleichgewicht heißt Isosthenie (gleiche Stärke). Ist Meerwasser gut oder schlecht? Je nachdem, für wen; wie es an sich ist, lässt sich nicht entscheiden. Wenn sich die Gründe die Waage halten, bleibt nur die Urteilsenthaltung (Epoché)."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Die fünf Tropen“", "f": "„Mein Gedächtnis ist zuverlässig, denn ich erinnere mich, dass es mich nie getäuscht hat.“ Welcher Tropus liegt vor?", "a": [["Diallele (Zirkel)", 1], ["Unendlicher Regress", 0, null, "Beim Regress braucht jede Begründung eine weitere, ohne Ende. Hier kehrt die Begründung zum Ausgangspunkt zurück."], ["Voraussetzung", 0, null, null], ["Relativität", 0, null, null]], "e": "Die Diallele liegt vor, wenn A durch B gestützt wird, B aber wieder durch A: Das Gedächtnis wird mit einer Erinnerung, also mit dem Gedächtnis selbst, begründet. Die fünf Tropen sind Widerstreit, unendlicher Regress, Relativität, Voraussetzung und Diallele. Widerstreit und Relativität zeigen, dass wir Begründungen brauchen; Regress, Voraussetzung und Diallele zeigen, dass jeder Versuch scheitert, sie zu liefern."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Das Argument gegen jede Begründung“", "f": "Was zeigt das Agrippa- oder Münchhausen-Trilemma?", "a": [["Jede Begründungskette endet im Regress, im Abbruch oder im Zirkel, und keins davon reicht aus.", 1], ["Wahrnehmung, Erinnerung und Denken sind drei Quellen des Wissens, die alle täuschen können.", 0, null, "Das ist das skeptische Grundargument aus Teil A, nicht das Trilemma der Begründung."], ["Traum, Gehirn im Tank und allmächtiger Täuscher lassen sich logisch nicht widerlegen.", 0, null, null], ["Wissen braucht Überzeugung, Wahrheit und Rechtfertigung, und alle drei zugleich.", 0, null, null]], "e": "Das Argument setzt die drei letzten Tropen zusammen: Wer etwas zu wissen behauptet, muss es begründen (P1); jede Begründung stützt sich auf weitere Aussagen (P2); die Kette läuft ins Unendliche, bricht ab oder dreht sich im Kreis (P3); keiner der Wege reicht (P4). Hans Albert nannte das Münchhausen-Trilemma, nach dem Baron, der sich an den eigenen Haaren aus dem Sumpf ziehen wollte. Wer das Argument angreifen will, muss eine Prämisse bestreiten."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Erscheinung und Verborgenes“", "f": "Sextus schreibt: „Dass uns der Honig süß zu schmecken scheint, das räumen wir ein.“ Was zeigt der Satz?", "a": [["Er bezweifelt nicht die Erscheinung, sondern ob der Honig an sich süß ist.", 1], ["Der Skeptiker bezweifelt alles, sogar das, was er gerade selbst schmeckt.", 0, null, "Das ist das häufige Missverständnis, dem Sextus ausdrücklich widerspricht."], ["Die Sinne liefern sicheres Wissen, wenn sie unter guten Bedingungen arbeiten.", 0, null, null], ["Wahr ist das, was ich klar und deutlich als süß erkenne und erlebe.", 0, "Descartes", "„Klar und deutlich“ ist Descartes' Wahrheitskriterium."]], "e": "Was uns unwillkürlich erscheint, bezweifelt Sextus nicht. Sein Urteil hält er nur über das Verborgene zurück, also das, was hinter den Erscheinungen liegt. Im Alltag folgt der Skeptiker deshalb den Erscheinungen, Gewohnheiten und Gesetzen: Er isst, wenn er Hunger hat, und weicht aus, wenn ihm ein Wagen entgegenkommt."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Widerspricht sich der Skeptiker?“", "f": "Ein Kritiker sagt: „Wer sagt ‚Man kann nichts wissen‘, beansprucht, genau das zu wissen.“ Wie antwortet Sextus?", "a": [["Der Pyrrhoneer behauptet das gar nicht; er teilt nur mit, wie es ihm erscheint.", 1], ["Dieser eine Satz ist die einzige Ausnahme, die man sicher wissen kann.", 0, null, null], ["Der Zweifel kann sich selbst nicht bezweifeln, also bleibt das Ich gewiss.", 0, "Descartes", "Das ist der Weg zum Cogito. Sextus will gerade keine erste Gewissheit gewinnen."], ["Der Satz ist zwar nicht sicher, aber immerhin wahrscheinlich wahr.", 0, "Akademische Skepsis", "Die These, es gebe kein sicheres Wissen, nur Wahrscheinliches, vertrat die akademische Skepsis (Arkesilaos, Karneades)."]], "e": "„Man kann nichts wissen“ ist nach Sextus die These der akademischen Skeptiker. Seine eigenen Formeln wie „Ich bestimme nichts“ oder „Um nichts eher“ setzt er nicht als wahr; sie heben sich mit allem anderen auf, wie ein Abführmittel, das sich selbst mit ausscheidet. Der Einwand trifft also den dogmatischen, nicht den pyrrhonischen Skeptiker. Der Preis: Der Pyrrhoneer kann keine Theorie mehr vertreten, nicht einmal den Skeptizismus."}, {"teil": "Teil C · Sextus Empiricus", "nach": "Teil C, Abschnitt „Epoché und Ataraxie“", "f": "Was folgt nach Sextus aus der Urteilsenthaltung (Epoché)?", "a": [["Seelenruhe: Die Seele ist ungestört wie ein Meer ohne Wellen.", 1], ["Verzweiflung, weil sich keine Wahrheit mehr finden lässt.", 0, null, null], ["Handlungsunfähigkeit, weil man ohne Urteile nicht leben kann.", 0, null, "Das ist ein Einwand gegen den Skeptizismus (Schwäche 1). Sextus folgt im Alltag den Erscheinungen und handelt."], ["Gewissheit, weil am Ende nur das denkende Ich übrig bleibt.", 0, "Descartes", null]], "e": "Der Skeptiker begann zu philosophieren, um Wahres von Falschem zu unterscheiden und so Ruhe zu finden. Er fand keine Entscheidung, hielt inne, und gerade da stellte sich die Ruhe „wie zufällig“ ein: die Ataraxie. Wer fest überzeugt ist, dass etwas von Natur aus gut ist, jagt ihm nach oder fürchtet, es zu verlieren. Skepsis ist für Sextus also eine Lebenskunst, darin ähnlich wie bei Epikur und den Stoikern."}, {"teil": "Teil D · Antworten auf den Skeptizismus", "nach": "Teil D, Abschnitt „Fred Dretske: Nur relevante Alternativen zählen“", "f": "Welche Prämisse des modernen skeptischen Arguments greift Fred Dretske an, und wie?", "a": [["P1: Man muss nur die relevanten Alternativen ausschließen, nicht alle denkbaren.", 1], ["P2: Der Satz „Ich bin ein Gehirn im Tank“ wäre falsch, selbst wenn ich eins wäre.", 0, "Putnam", "Putnam bestreitet P2 mit einer Theorie der Bedeutung."], ["K: Dass ich Hände habe, weiß ich sicherer als jede Prämisse eines Arguments.", 0, "Moore", "Moore dreht das Argument um. Einwand: Er setzt voraus, was zu beweisen wäre."], ["Keine Prämisse: Er bestreitet nur, dass Wissen absolute Gewissheit verlangt.", 0, "Fallibilismus", null]], "e": "Das moderne Argument lautet: P1 Wenn ich nicht ausschließen kann, ein Gehirn im Tank zu sein, weiß ich nicht, dass ich zwei Hände habe; P2 Ich kann es nicht ausschließen; K Also weiß ich es nicht. Dretske bestreitet P1 mit dem Zebra-Beispiel: Vor dem Gehege mit der Aufschrift „Zebras“ musst du nicht ausschließen, dass es bemalte Esel sind, solange es keinen Anlass gibt. Schwierigkeit: Was als relevant gilt, ist selbst erklärungsbedürftig und hängt vom Zusammenhang ab."}, {"teil": "Teil D · Antworten auf den Skeptizismus", "nach": "Teil D, Abschnitt „Wissen ohne absolute Gewissheit“", "f": "Was bedeutet Fallibilismus?", "a": [["Wir können etwas wissen, auch wenn wir uns grundsätzlich irren könnten.", 1], ["Weil wir uns irren können, sollten wir uns des Urteils enthalten.", 0, "Sextus Empiricus", "Das ist die Epoché der pyrrhonischen Skepsis. Der Fallibilist hält Wissen gerade für möglich."], ["Da alles fehlbar ist, sind alle Überzeugungen gleich gut begründet.", 0, null, "Fehlbarkeit bedeutet nicht Beliebigkeit: Eine gut geprüfte Überzeugung ist besser begründet als ein Gerücht."], ["Es gibt kein sicheres Wissen, sondern nur Wahrscheinliches.", 0, "Akademische Skepsis", null]], "e": "Viele Philosophen geben dem Skeptiker zu, dass absolute Gewissheit kaum erreichbar ist, bestreiten aber, dass Wissen absolute Gewissheit verlangt. Diese Haltung heißt Fallibilismus (lateinisch fallibilis, fehlbar). Karl Popper machte daraus eine Methode für die Wissenschaft: Theorien gelten so lange, bis sie widerlegt werden. Die Kritische Würdigung nennt das als Einwand gegen den Skeptizismus: Er setzt unfaire Maßstäbe für Wissen an."}, {"typ": "offen", "teil": "Teil B · Skeptische Szenarien", "nach": "Teil B, Abschnitt „Wie weit reichen die Szenarien?“", "f": "Was unterscheidet das Traumargument vom allmächtigen Täuscher?", "m": "Beide sind skeptische Szenarien: logisch mögliche Geschichten, nach denen fast alle unsere Überzeugungen falsch wären, ohne dass wir es merken. Sie unterscheiden sich in ihrer Reichweite. Das Traumargument stützt sich darauf, dass es kein sicheres Kennzeichen gibt, an dem wir Wachen und Träumen unterscheiden können. Es zieht deshalb alle Überzeugungen über die Außenwelt und den eigenen Körper in Zweifel. Mathematik und Logik bleiben aber stehen, denn auch im Traum ergeben zwei und drei fünf, und ein Quadrat hat vier Seiten. Der allmächtige Täuscher, ein Gott oder böser Geist (malin génie), geht weiter: Er könnte mich so geschaffen haben, dass ich mich sogar bei den einfachsten Rechnungen irre. Damit sind auch Mathematik und Logik unsicher. Übrig bleibt nur, dass mir etwas so erscheint (Sextus) und dass ich bin, solange ich denke (Descartes)."}]}, {"id": "et-descartes", "tf": "ET", "gruppe": "Zweifel und Gewissheit", "kapitel": "Descartes - Rationalismus und methodischer Zweifel", "titel": "Descartes", "sub": "Ich denke, also bin ich", "kurse": ["4"], "fragen": [{"teil": "Teil A · Das Projekt", "nach": "Teil A, Abschnitt „Der Korb mit Äpfeln“", "f": "Was veranschaulicht Descartes mit dem Bild vom Korb voller Äpfel, von denen einige faul sind?", "a": [["Man muss alle Überzeugungen erst beiseitelegen und nur die zurücknehmen, die jeder Prüfung standhalten.", 1], ["Man soll vorsichtig von oben sortieren und nur die Überzeugungen entfernen, die sich schon als falsch erwiesen haben.", 0, null, "Genau das lehnt Descartes ab: Wer nur oben sortiert, lässt die Fäulnis weiterwirken. Er kippt den ganzen Korb aus."], ["Weil einige Überzeugungen falsch sind, soll man sich jedes Urteils enthalten und so zur Seelenruhe finden.", 0, "Sextus Empiricus", "Das wäre das Ziel des Skeptikers. Descartes will die guten Äpfel zurücklegen, also sicheres Wissen gewinnen."], ["Die Autoritäten der Scholastik sollen jede Überzeugung einzeln prüfen und die falschen aussortieren.", 0]], "e": "

chkeit: sinnlos. Die Astrologie ist für den Wiener Kreis dagegen sinnvoll, weil sie sich prüfen lässt, und vermutlich nur falsch."}, {"teil": "Teil A · Wiener Kreis", "nach": "Teil A, Abschnitt „Was Bacon und der Wiener Kreis erklären und wo sie an Grenzen stoßen“", "f": "Welcher Einwand trifft das Sinnkriterium des Wiener Kreises an sich selbst?", "a": [["Es ist weder ein Beobachtungssatz noch ein logischer Satz, also nach eigenem Maßstab sinnlos.", 1], ["Es erklärt auch die Astrologie für sinnlos, obwohl man Horoskope durchaus testen kann.", 0, null, "Der Wiener Kreis hält die Astrologie gerade für sinnvoll, weil sie prüfbar ist."], ["Es verlangt, dass jede Prüfung schon tatsächlich durchgeführt wurde, bevor ein Satz Sinn hat.", 0, null, "Es genügt, dass die Prüfung im Prinzip möglich ist: Der Satz über Krater auf der Mondrückseite war schon vor der Raumsonde sinnvoll."], ["Es lässt nur Sätze der Logik und Mathematik als sinnvoll gelten, keine Erfahrungssätze.", 0, null, null]], "e": "Das ist das Problem der Selbstanwendung. Dazu kommt Humes Induktionsproblem: Ein Naturgesetz wie „Alle Körper fallen im Vakuum gleich schnell“ spricht über unendlich viele Fälle, und keine endliche Zahl von Beobachtungen kann es verifizieren. Die Stärke des Wiener Kreises bleibt ein klares Werkzeug gegen leere Behauptungen: Frag, wie man es prüfen könnte."}, {"teil": "Teil B · Popper", "nach": "Teil B, Abschnitt „Die Asymmetrie“", "f": "Welche Antwort gibt Popper auf Humes Induktionsproblem?", "a": [["Die Wissenschaft braucht keine Induktion: Allgemeine Sätze werden an möglichen Gegenbeispielen geprüft.", 1], ["Induktion lässt sich nicht rechtfertigen; wir schließen aus Gewohnheit auf künftige Fälle.", 0, "Hume", "Das ist Humes Ergebnis. Popper zieht daraus ausdrücklich nicht den Schluss, wir folgten bloß der Gewohnheit."], ["Notwendige Gesetze sind möglich, weil die Formen der Erfahrung von uns selbst stammen.", 0, "Kant", "So erklärt Kant, warum Naturgesetze überhaupt möglich sind."], ["Viele Bestätigungen machen ein Gesetz zwar nicht sicher, aber immerhin wahrscheinlich.", 0, "Reichenbach", "Für Popper ist eine bewährte Theorie weder bewiesen noch „wahrscheinlich“."]], "e": "Aus „Alle Schwäne sind weiß“ folgt „Dieser Schwan ist weiß“. Ist er schwarz, ist der allgemeine Satz logisch gültig widerlegt; ist er weiß, folgt daraus nichts. Allgemeine Sätze kann man nie verifizieren, wohl aber falsifizieren (Asymmetrie). Ein Gegenbeispiel wiegt mehr als tausend Bestätigungen. Popper löst das Induktionsproblem also nicht, er umgeht es."}, {"teil": "Teil B · Popper", "nach": "Teil B, Abschnitt „Die Falle der Bestätigung“", "f": "Wason-Aufgabe: Du vermutest hinter 2-4-6 die Regel „gerade Zahlen, die um zwei steigen“. Welche Folge solltest du nach Popper testen?", "a": [["1-7-50", 1], ["8-10-12", 0, null, "Diese Folge passt zu deiner Vermutung. Ein „passt“ bestätigt sie nur, prüft sie aber nicht ernsthaft."], ["20-22-24", 0, null, null], ["100-102-104", 0, null, "Auch das ist nur ein weiterer Bestätigungsversuch."]], "e": "Die meisten testen Folgen, die zur eigenen Vermutung passen, hören jedes Mal „passt“, sind sicher und liegen falsch: Die Regel lautet einfach „drei steigende Zahlen“. Finden kann man sie nur mit Folgen, die die eigene Vermutung widerlegen könnten. Genau das verlangt Popper von der Wissenschaft: Widerlegungen suchen statt Bestätigungen sammeln (Bestätigungsfalle)."}, {"teil": "Teil B · Popper", "nach": "Teil B, Abschnitt „Das Abgrenzungskriterium“", "f": "Warum ist Adlers Psychologie für Popper keine Wissenschaft, Einsteins Relativitätstheorie dagegen schon?", "a": [["Adlers Theorie erklärt jedes Verhalten und verbietet daher nichts; Einsteins hätte scheitern können.", 1], ["Adlers Theorie lässt sich nicht prüfen und ist deshalb sinnlos; Einsteins Sätze sind sinnvoll.", 0, "Wiener Kreis", "Popper nennt nicht falsifizierbare Sätze ausdrücklich nicht sinnlos. Sein Kriterium trennt Wissenschaft von Nicht-Wissenschaft."], ["Adlers Theorie wurde widerlegt, Einsteins wurde 1919 durch Eddington endgültig bewiesen.", 0, null, "Bewiesen ist eine Theorie für Popper nie. Sie hat sich höchstens bewährt."], ["Adlers Theorie hat zu wenige Bestätigungen gesammelt, Einsteins dagegen sehr viele.", 0, null, "Bestätigungen zählen nur, wenn sie Ergebnis ernsthafter Widerlegungsversuche sind."]], "e": "Wissenschaftlich ist, was an der Erfahrung scheitern kann: „Je mehr eine Theorie verbietet, desto besser ist sie.“ Einstein sagte eine Ablenkung des Sternenlichts um 1,75 Bogensekunden voraus, doppelt so viel wie nach Newton. Adler konnte den Mann, der ein Kind ins Wasser stößt, ebenso erklären wie den, der es rettet. Was alles erklärt, verbietet nichts. Übersteht eine Theorie ernsthafte Widerlegungsversuche, hat sie sich bewährt, bewiesen ist sie damit nicht. Wichtig: falsifizierbar heißt nicht falsifiziert."}, {"teil": "Teil C · Kuhn", "nach": "Teil C, Abschnitt „Normale Wissenschaft“", "f": "Eine Astronomin misst etwas, das nicht zur anerkannten Theorie passt. Was tut sie nach Kuhn fast immer zuerst?", "a": [["Sie prüft ihr Teleskop, ihre Rechnung und ihre Annahmen, nicht die Theorie selbst.", 1], ["Sie betrachtet die Theorie als falsifiziert und sucht nach einer neuen Theorie.", 0, "Popper", "So sieht es Poppers Modell vor. Kuhn meint, Popper beschreibe nur die seltenen revolutionären Phasen."], ["Sie erfindet eine Hilfsannahme, die nur dazu dient, die Theorie zu retten.", 0, null, null], ["Sie bricht bewusst die Methodenregeln, weil Regelbruch den Fortschritt bringt.", 0, "Feyerabend", "Das passt zu Feyerabends „Anything goes“, nicht zu Kuhns normaler Wissenschaft."]], "e": "Im Normalfall prüfen Wissenschaftler ihre Grundlagen nicht, sondern wenden sie an. Sie bringen Theorie und Beobachtung besser zur Übereinstimmung, dehnen die Theorie aus und sammeln Daten. Kuhn nennt das Rätsellösen innerhalb eines Paradigmas. Gelingt ein Rätsel nicht, sucht man den Fehler bei sich. Grundlage ist ein Paradigma wie Newtons Principia, später genauer: die disziplinäre Matrix."}, {"teil": "Teil C · Kuhn", "nach": "Teil C, Abschnitt „Inkommensurabilität“", "f": "Was meint Kuhn, wenn er Paradigmen „inkommensurabel“ nennt?", "a": [["Es gibt kein neutrales Maß für einen Vergleich Punkt für Punkt, wohl aber gemeinsame Werte.", 1], ["Paradigmen lassen sich überhaupt nicht vergleichen, ein Wechsel hat keine guten Gründe.", 0, null, "Inkommensurabel heißt nicht unvergleichbar. Kuhn bestreitet nur, dass die Gründe wie ein Algorithmus entscheiden."], ["Wissenschaft ist nur ein Machtspiel, in dem sich die stärkere Gruppe durchsetzt.", 0, null, "Diese Folgerung einiger Soziologen nannte Kuhn „absurd“."], ["Ein neues Paradigma kommt der Wahrheit „da draußen“ näher als das alte.", 0, "Popper", "Annäherung an die Wahrheit ist Poppers Bild. Kuhn sieht Fortschritt im Lösen von Problemen."]], "e": "Inkommensurabel heißt „ohne gemeinsames Maß“. Selbst gleiche Wörter ändern ihre Bedeutung: „Masse“ ist bei Newton unveränderlich, bei Einstein in Energie umwandelbar; „Planet“ umfasst bei Ptolemäus Sonne und Mond, bei Kopernikus die Erde. Vergleichen kann man Paradigmen an gemeinsamen Werten: Genauigkeit, Widerspruchsfreiheit, Reichweite, Einfachheit, Fruchtbarkeit."}, {"teil": "Teil C · Lakatos", "nach": "Teil C, Abschnitt „Lakatos: Forschungsprogramme“", "f": "Le Verrier nahm zweimal einen unbekannten Planeten an: Neptun (1846) und Vulkan (1859). Wie beurteilt Lakatos das?", "a": [["Neptun zeigt ein progressives Programm, Vulkan ein degenerierendes, weil nur nachträglich geflickt wurde.", 1], ["Beide Annahmen waren Ad-hoc-Hypothesen, Newtons Theorie war schon 1846 falsifiziert.", 0, null, "Die Neptun-Annahme war selbst prüfbar und sagte Neues vorher, das sich bestätigte."], ["Nach Vulkan hätte man Newton sofort aufgeben müssen, auch ohne eine andere Theorie.", 0, null, "Aufgeben soll man ein Programm nach Lakatos erst, wenn ein progressiveres bereitsteht, hier Einsteins Relativitätstheorie."], ["Beide Fälle sind normale Wissenschaft: Rätsellösen innerhalb des Newton-Paradigmas.", 0, "Kuhn", null]], "e": "Für Lakatos werden nicht einzelne Theorien geprüft, sondern Forschungsprogramme. Ihr harter Kern (bei Newton die Bewegungsgesetze und das Gravitationsgesetz) wird bewusst geschützt, Anomalien fängt ein Schutzgürtel von Hilfsannahmen ab. Das ist vernünftig, solange das Programm progressiv ist, also Neues vorhersagt, das sich bestätigt. Grenze: Ob ein Programm degeneriert, weiß man oft erst im Nachhinein."}, {"teil": "Teil D · Feyerabend", "nach": "Teil D, Abschnitt „Galilei und der Turm“", "f": "Wie setzt sich Galilei nach Feyerabend gegen das Turm-Argument durch?", "a": [["Er deutet die Beobachtung neu und überredet, denn die stützende Physik gab es noch nicht.", 1], ["Er zeigt durch ein Experiment, dass der Stein in Wirklichkeit weit vom Turm entfernt landet.", 0, null, "Galilei bestreitet die Beobachtung nicht: Der Stein fällt am Fuß des Turms."], ["Er falsifiziert die ruhende Erde streng nach Methode, durch eine genaue Vorhersage.", 0, "Popper", "Genau das bestreitet Feyerabend: Galilei siegt nicht mit Methode."], ["Er wartet ab, bis sich so viele Anomalien häufen, dass ein neues Paradigma bereitsteht.", 0, "Kuhn", null]], "e": "Das Turm-Argument: Drehte sich die Erde, müsste der fallende Stein weit vom Turm aufschlagen; er tut es nicht, also steht die Erde still. Galilei bestreitet nur den „Wirklichkeitsgehalt“ der Beobachtung: Der Stein bewegt sich mit der Erde, wie ein Ball, den du im fahrenden Zug hochwirfst. So ändert er die Sprache, in der wir Beobachtungen deuten. Für Feyerabend zeigt das: „Tatsachen allein sind nicht stark genug“, um zwischen Theorien zu entscheiden."}, {"teil": "Teil D · Feyerabend", "nach": "Teil D, Abschnitt „Anything goes“", "f": "Was meint Feyerabend mit „Anything goes“?", "a": [["Für jede Methodenregel gibt es Fälle, in denen ihr Bruch den Fortschritt brachte.", 1], ["Alle Theorien und Meinungen sind gleich gut, Vernunft spielt keine Rolle mehr.", 0, null, "Das meint Feyerabend ausdrücklich nicht: Er kritisiert nur eine „versteinerte und überhebliche Version“ der Vernunft."], ["Wissenschaftlich ist alles, was an der Erfahrung scheitern kann.", 0, "Popper", null], ["Erlaubt ist jede Hilfsannahme, solange sie Neues vorhersagt, das sich bestätigt.", 0, "Lakatos", "Das ist Lakatos' Kriterium für ein progressives Forschungsprogramm."]], "e": "Würde man jede Theorie verwerfen, die einer Tatsache widerspricht, bliebe keine Wissenschaft übrig. Wer eine Regel für alle Fälle sucht, erhält nur die leere Regel „Anything goes“: mach, was funktioniert. Politisch folgt daraus: Wissenschaft ist eine Tradition unter anderen; beansprucht sie die einzig richtige Methode, sei sie „Ideologie“ und müsse vom Staat getrennt werden, und Laien sollen mitentscheiden. Grenze: Gefahr der Beliebigkeit, etwa bei Medizin oder Klimaforschung."}, {"typ": "arg", "teil": "Zentrale Argumentation", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in der Entwicklung der Wissenschaftstheorie? (Auszug)", "zeilen": [["Bacon", "Die Sinne versagen; das geplante, offengelegte Experiment entscheidet. Problem: Experimente zeigen Einzelfälle, Gesetze gelten für alle Fälle."], ["Wiener Kreis", "Nur Sätze, deren Wahrheit sich prüfen lässt, sind sinnvoll (Verifikation). Problem: Naturgesetze lassen sich nie verifizieren."], ["Popper", "Allgemeine Sätze kann man nicht beweisen, aber widerlegen. Problem: In der Geschichte werden Theorien trotz Widersprüchen beibehalten."], ["Kuhn", null], ["Feyerabend", "Jede Methodenregel wurde irgendwann mit Gewinn gebrochen. „Anything goes“."]], "a": [["Normale Wissenschaft löst Rätsel innerhalb eines Paradigmas; erst in Krisen kommt es zur Revolution.", 1], ["Geprüft werden Forschungsprogramme, deren harter Kern geschützt wird, solange sie Neues vorhersagen.", 0, "Lakatos", "Das ist Lakatos' Antwort auf dasselbe Problem. Er will Kuhns Einwand aufnehmen, ohne die Rationalität aufzugeben."], ["Wissenschaft ist ein Machtspiel; Theorien setzen sich durch, weil ihre Anhänger mächtiger sind.", 0, null, "Diese Lesart einiger Soziologen nannte Kuhn „absurd“."], ["Wissenschaftlich ist nur, was sich durch Beobachtungen endgültig als wahr beweisen lässt.", 0, null, null]], "e": "Kuhn antwortet auf Poppers Problem: Dass Forscher an Theorien trotz Widersprüchen festhalten, ist der Normalfall. Anomalien werden zunächst übersehen oder korrigiert; häufen sie sich, entsteht eine Krise, und erst wenn ein neues Paradigma bereitsteht, kommt es zur Revolution (Kopernikus). Offen bleibt: Ist der Wechsel eines Paradigmas noch rational?"}, {"typ": "offen", "teil": "Teil B · Popper", "nach": "Teil B, Abschnitt „Neptun und die Ad-hoc-Hypothese“", "f": "Hätten die Astronomen 1846 Newtons Theorie aufgeben sollen, als die Uranusbahn nicht stimmte? Begründe mit Popper und Duhem.", "m": "Nein. Die Uranusbahn widersprach zwar Newtons Berechnungen, doch nach Duhem wird eine Theorie nie allein geprüft, sondern immer zusammen mit Hilfsannahmen, etwa über Messgeräte oder die Zahl der Planeten. Widerspricht eine Beobachtung, ist nur sicher, dass irgendeine Annahme falsch ist, nicht welche. Le Verrier änderte deshalb eine Hilfsannahme: Er nahm einen unbekannten Planeten an und berechnete seine Position. Für Popper ist das keine unerlaubte Ad-hoc-Hypothese, denn die Annahme war selbst prüfbar und hätte scheitern können. Neptun wurde fast genau an der berechneten Stelle gefunden. Der Fall zeigt aber auch Poppers Grenze: Forscher halten Theorien trotz Widersprüchen fest, und das ist oft vernünftig."}]}, {"id": "et-konstruktivismus", "tf": "ET", "gruppe": "Wirklichkeit", "kapitel": "Radikaler Konstruktivismus und Neuer Realismus", "titel": "Konstruktivismus", "sub": "Erkennen wir die Wirklichkeit, oder konstruieren wir sie?", "kurse": ["2"], "fragen": [{"teil": "Teil A · Radikaler Konstruktivismus", "nach": "Teil A, Abschnitt „Der Kapitän in der Meeresenge“", "f": "Watzlawicks Kapitän kommt heil durch die unbekannte Meeresenge. Was weiß er danach?", "a": [["Nur, dass sein Kurs nirgends anstieß, nicht, wie die Enge beschaffen ist.", 1], ["Wie die Enge wirklich beschaffen ist, denn sein Kurs hat sich bewährt.", 0, null, "Genau das lehrt ihn der Erfolg nicht: „Er passierte die Enge wie ein Blinder.“"], ["Dass sein Kurs der kürzeste und sicherste Weg durch die Enge war.", 0, null, "Es könnte kürzere und sicherere Wege geben, die er nie gesehen hat."], ["Nichts, denn die Enge gibt es nur in seiner Vorstellung.", 0, null, "Die Klippen gibt es, an ihnen scheitern Kurse. Der Konstruktivismus leugnet die Wirklichkeit nicht."]], "e": "Scheitert der Kapitän an den Klippen, weiß er immerhin, wie die Durchfahrt nicht ist. Kommt er durch, beweist das „nur, dass sein Kurs im buchstäblichen Sinne nirgends anstieß“. Über die wahre Beschaffenheit der Enge lehrt ihn sein Erfolg nichts. Das Bild steht für unser Wissen überhaupt: Erfolg zeigt Gangbarkeit, kein Abbild der Welt."}, {"teil": "Teil A · Radikaler Konstruktivismus", "nach": "Teil A, Abschnitt „Viabel statt wahr“", "f": "Wann ist eine Vorstellung für Glasersfeld „viabel“?", "a": [["Wenn sie der Erfahrung standhält und Vorhersagen ermöglicht, ohne die Welt abzubilden.", 1], ["Wenn sie sich im Handeln bewährt, denn genau das heißt es, dass sie wahr ist.", 0, null, "Glasersfeld nennt das Bewährte gerade nicht wahr: Er ersetzt den Begriff der Wahrheit ganz durch Viabilität."], ["Wenn sie mit der Wirklichkeit übereinstimmt, so wie diese unabhängig von uns ist.", 0, null, "Gerade das können wir nach Glasersfeld nie wissen."], ["Wenn sie sich widerspruchsfrei in ein System anerkannter Aussagen einfügt.", 0, null, null]], "e": "Viabilität kommt von lateinisch via, der Weg: Wissen ist „nie Bild oder Widerspiegelung der Wirklichkeit“, sondern „stets nur einen möglichen Weg, um zwischen den ‚Gegenständen‘ durchzukommen“. Dass eine Vorstellung sich bewährt, heißt „keineswegs, dass wir nun wissen, wie die objektive Welt beschaffen ist; es heißt lediglich, dass wir einen gangbaren Weg zu einem Ziel wissen“."}, {"teil": "Teil A · Radikaler Konstruktivismus", "nach": "Teil A, Abschnitt „Viabel statt wahr“", "f": "Warum darf für Glasersfeld keine Vorstellung als „die objektiv richtige oder wahre“ gelten?", "a": [["Weil das Finden eines befriedigenden Wegs nie ausschließt, dass es andere befriedigende Wege gibt.", 1], ["Weil unsere Sinne uns ständig täuschen und darum alle unsere Vorstellungen falsch sind.", 0, null, "Glasersfeld sagt nicht, dass unser Wissen falsch ist. Er sagt, dass wir nicht wissen können, ob es der Welt entspricht."], ["Weil es außerhalb unserer Erfahrung gar keine Wirklichkeit gibt, an der man messen könnte.", 0, null, "Das wäre ein Leugnen der Welt. Der Konstruktivismus behauptet nur, dass wir über die Wirklichkeit nichts wissen können."], ["Weil jeder Mensch seine eigene Wahrheit hat und alle Meinungen gleich gut sind.", 0, null, null]], "e": "Glasersfelds Argument: Wir haben nur Zugang zu unserer Erfahrung, nie zu einer Welt jenseits davon. Bewährt sich eine Vorstellung, zeigt das nur, dass sie bisher geleistet hat, was wir erwarteten. Andere Vorstellungen könnten sich ebenso gut bewähren. Also bleibt nur „viabel“ (gangbar) statt „wahr“. Gemeint ist eine Haltung der Bescheidenheit, keine Beliebigkeit."}, {"teil": "Teil A · Radikaler Konstruktivismus", "nach": "Teil A, Abschnitt „Leugnet der Konstruktivismus die Welt?“", "f": "Ein Mitschüler sagt: „Für Konstruktivisten gibt es gar keine Wirklichkeit.“ Wie lässt sich der Satz berichtigen?", "a": [["Es gibt sie, wie die Klippen zeigen; wir können nur nichts über sie wissen.", 1], ["Es gibt sie, und wir erkennen sie, wie sie ist, aber immer aus einer Perspektive.", 0, "Gabriel", "Das ist die Position des Neuen Realismus, nicht des Konstruktivismus."], ["Es gibt sie, und sie ist genau so, wie wir sie wahrnehmen.", 0, "naiver Realismus", null], ["Der Satz stimmt: Die Welt ist nur ein Produkt unseres Gehirns.", 0, null, "Das ist ein häufiges Missverständnis. Am Kurs des Kapitäns sieht man: Kurse können an etwas Wirklichem scheitern."]], "e": "Die Klippen in Watzlawicks Bild gibt es: Rennt der Kapitän auf sie auf, erfährt er, wie die Durchfahrt nicht ist. Der radikale Konstruktivismus behauptet nur, dass wir über diese Wirklichkeit nichts wissen können. Er ist eine Position der Bescheidenheit, keine Leugnung der Außenwelt. Merke: Konstruktivismus heißt „wir wissen nichts über die Wirklichkeit“, nicht „es gibt keine Wirklichkeit“."}, {"teil": "Teil B · Neuer Realismus", "nach": "Teil B, Abschnitt „Gegen das kognitive Gefängnis“", "f": "Was meint Gabriel mit dem „kognitiven Gefängnis“?", "a": [["Die Idee, dass wir keinen direkten Zugang zur Wirklichkeit haben, weil Begriffe, Systeme oder Gehirne dazwischenstehen.", 1], ["Die Idee, dass ein böser Geist uns täuschen könnte, sodass wir über die Außenwelt nichts sicher wissen.", 0, "Descartes", "Das ist ein skeptisches Szenario aus Descartes' methodischem Zweifel, nicht Gabriels Bild."], ["Die Haltung des naiven Realismus, der an der Wahrnehmung festhält und keine Vermittlung zulässt.", 0, null, "Gabriel richtet das Bild gegen den Konstruktivismus, nicht gegen den naiven Realismus."], ["Die Einsicht, dass wir die Wirklichkeit begrifflich und perspektivisch vermittelt erfahren.", 0, null, "Diese Vermittlung gibt Gabriel selbst zu. Er bestreitet nur, dass sie uns von der Wirklichkeit trennt."]], "e": "Gabriel fasst unter „Konstruktivismus“ alle Positionen zusammen, die behaupten, wir erfassten die Wirklichkeit nur durch Begriffe, Systeme oder heute durch „bestimmte Gehirnareale“. Was bleibe, sei „die Idee eines kognitiven Gefängnisses“. Dagegen hält der Neue Realismus am Wissen und an der Wahrheit „im eigentlichen Sinn“ fest: „Warum sollte ich nicht wissen können, dass Hamburg nördlich von Köln liegt oder dass die Wiese vor mir grün ist?“"}, {"teil": "Teil B · Neuer Realismus", "nach": "Teil B, Abschnitt „Der Würfel: perspektivisch heißt nicht konstruiert“", "f": "Gabriel sieht einen blauen Würfel nur von vorn. Was folgt daraus für ihn?", "a": [["Er erkennt den Würfel selbst, nur eben aus einer Perspektive, die er auch erkennen kann.", 1], ["Er erkennt nur ein Bild, das er sich vom Würfel macht, nicht den Würfel selbst.", 0, null, "Genau das bestreitet Gabriel: „Ich erkenne ja nicht etwa ein Bild, das ich mir vom Würfel mache.“"], ["Er erkennt den Würfel als Erscheinung; wie er an sich ist, bleibt ihm verborgen.", 0, "Kant", "Das ist Kants Unterscheidung von Erscheinung und Ding an sich."], ["Er sieht den Würfel genau so, wie er ist, denn Wahrnehmung bildet die Welt ab.", 0, "naiver Realismus", null]], "e": "Gabriel gibt zu, dass er die Rückseite nicht sieht und dass jeder mit blauen Würfeln etwas anderes verbindet. „Doch daraus folgt keineswegs, dass ich den Würfel nicht wirklich erkennen kann.“ Perspektivisch heißt also nicht konstruiert: Perspektiven sind keine Mauern zwischen uns und der Welt, sondern Zugänge zu ihr. Darin unterscheidet sich der Neue Realismus vom naiven Realismus."}, {"teil": "Teil B · Neuer Realismus", "nach": "Teil B, Abschnitt „Der Würfel: perspektivisch heißt nicht konstruiert“", "f": "Was unterscheidet Gabriels Neuen Realismus vom naiven Realismus?", "a": [["Gabriel gibt zu, dass Erkennen perspektivisch vermittelt ist, und hält es trotzdem für Erkenntnis der Wirklichkeit.", 1], ["Gabriel hält die Welt für genau so, wie wir sie wahrnehmen, der naive Realismus dagegen für konstruiert.", 0, null, "Umgekehrt: „Die Welt ist genau so, wie wir sie wahrnehmen“ ist die Definition des naiven Realismus."], ["Gabriel ersetzt die Wahrheit durch Viabilität, der naive Realismus hält an der Wahrheit fest.", 0, "Glasersfeld", "Viabilität ist Glasersfelds Begriff. Gabriel hält an der Wahrheit „im eigentlichen Sinn“ fest."], ["Gabriel bestreitet, dass es Tatsachen gibt, die unabhängig von Gehirnen und Systemen bestehen.", 0, null, null]], "e": "Der naive Realismus meint: Die Welt ist genau so, wie wir sie wahrnehmen. Gabriel ist kein naiver Realist. Er gibt zu, dass wir die Wirklichkeit „begrifflich und perspektivisch vermittelt“ erfahren, bestreitet aber, dass Vermittlung Konstruktion bedeutet. Neuer Realismus heißt: Wir erkennen die Wirklichkeit, wie sie ist, aber immer aus einer Perspektive."}, {"teil": "Teil B · Neuer Realismus", "nach": "Teil B, Abschnitt „Warum Wahrheit befreit“", "f": "Was wirft Gabriel jemandem vor, der einen Krieg für eine bloße mediale und politische Konstruktion hält?", "a": [["Er entlastet sich vom Grauen, verdrängt aber eine faktisch bedrohliche Wirklichkeit.", 1], ["Er ist bescheidener als der Realist und vermeidet dadurch vorschnelle Urteile.", 0, null, "Gerade diese Haltung, hinter jeder Wahrheit eine Verzerrung zu vermuten, kritisiert Gabriel."], ["Er verwechselt Viabilität mit Wahrheit und hält Gangbares für objektiv richtig.", 0, null, null], ["Er übersieht, dass hinter jeder Wahrheit ein politischer Machtanspruch steckt.", 0, null, "Das ist die Haltung, die Gabriel zurückweist: hinter jedem Wissen nur einen Machtanspruch zu vermuten."]], "e": "Für Gabriel haben Wissen und Wahrheit „eine viel größere emanzipatorische Kraft“ (befreiend, mündig machend) als die Haltung, hinter jedem Wissen einen Machtanspruch und hinter jeder Wahrheit eine Verzerrung zu vermuten. Darin liegt die politische Pointe seines Realismus: Wahrheit ist ein Maßstab gegen Beliebigkeit und Desinformation."}, {"teil": "Teil B · Neuer Realismus", "nach": "Teil B, Abschnitt „Warum Wahrheit befreit“", "f": "Ein Politiker sagt: „Es gibt keine Fakten, es gibt nur Perspektiven.“ Wie antwortet Gabriel?", "a": [["Perspektiven sind immer Perspektiven auf Tatsachen; sonst kann man Lügen nicht mehr als Lügen zurückweisen.", 1], ["Keine Sicht ist wahr, aber nicht jede ist viabel: Entscheidend ist, ob sie der Erfahrung standhält.", 0, "Glasersfeld", "So könnte Glasersfeld antworten. Gabriel hält dagegen an Wahrheit und Fakten fest."], ["Der Politiker hat recht, denn auch Gabriel sagt, dass wir alles nur aus einer Perspektive erkennen.", 0, null, "Gabriel betont die Perspektive, aber gerade als Zugang zur Wirklichkeit, nicht als Ersatz für Fakten."], ["Gewiss sind nur die Beziehungen der Ideen; Tatsachen kennen wir nur aus Erfahrung.", 0, "Hume", null]], "e": "Für Gabriel folgt aus der Perspektivität gerade nicht, dass es keine Fakten gibt: Wer behauptet, es gebe „keine Fakten, nur Perspektiven“, kann Lügen nicht mehr als Lügen zurückweisen. Hier zeigt sich auch eine Grenze des Konstruktivismus: Er kann Falsches nicht mehr falsch nennen, nur sagen, dass sich eine Vorstellung nicht bewährt."}, {"typ": "arg", "teil": "Teil B · Neuer Realismus", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Gabriels Regress-Argument?", "zeilen": [["P1", "Angenommen, alle Tatsachen bestehen nur relativ auf eine Instanz: Wiesen sind nur grün, weil es Gehirne gibt, Verbrecher nur, weil es Strafsysteme gibt."], ["P2", null], ["P3", "Dieser Regress endet nie; dann wäre auch die Konstruktion selbst nicht wirklich."], ["K", "Also muss es eine nicht konstruierte Wirklichkeit geben, zu der wir Zugang haben. „Der Realismus ist deswegen unvermeidbar.“"]], "a": [["Dann bestehen auch diese Instanzen (Gehirn, Strafsystem, Evolution) nur relativ auf eine weitere Instanz.", 1], ["Wir haben nur Zugang zu unserer Erfahrung, nie zu einer Welt jenseits der Erfahrung.", 0, "Glasersfeld", "Das ist die erste Prämisse des Konstruktivismus, also das Gegenargument."], ["Dann ist die Welt genau so, wie Gehirne und Strafsysteme sie uns zeigen.", 0, null, null], ["Andere Vorstellungen könnten sich ebenso gut bewähren wie die bisherigen.", 0, "Glasersfeld", "Auch das gehört zu Glasersfelds Argument für Viabilität."]], "e": "Gabriel prüft den Konstruktivismus an sich selbst. Annahme: Alles besteht nur relativ auf eine Instanz. Rückfrage: „Doch wie steht es mit den Kortizes, dem Strafsystem, der Evolution?“ Sind auch sie konstruiert, lässt sich die Frage endlos wiederholen. Wer den Regress beenden will, muss irgendwo anhalten: „An irgendeiner Stelle muss man eine Wirklichkeit einführen, die selbst nicht konstruiert ist.“"}, {"typ": "offen", "teil": "Fazit", "nach": "Fazit „Zwei Antworten nach Kant“", "f": "Sind Illusionen notwendig? Stelle Glasersfeld und Gabriel einander gegenüber und nimm ein Beispiel (Kapitän, Würfel oder Politiker).", "m": "Für Glasersfeld ist alles Wissen eine Konstruktion, die sich bewährt: Es ist viabel, aber nie ein Abbild der Wirklichkeit. Der Kapitän weiß nach der Fahrt nur, dass sein Kurs nirgends anstieß, nicht, wie die Enge beschaffen ist. Eine Illusion wäre sein Kurs, wenn er glaubte, die wahre Beschaffenheit der Enge zu kennen. In diesem Sinn bleibt jede Vorstellung von der Welt unsicher, und Illusionen lassen sich nicht ausschließen. Gabriel widerspricht: Perspektivisch heißt nicht konstruiert. Wer den Würfel von vorn sieht, erkennt den Würfel selbst, nicht ein Bild von ihm. Außerdem setzt jede Rede von Konstruktion schon eine Wirklichkeit voraus (Regress-Argument). Illusionen sind für ihn also nicht notwendig, und wer sie für notwendig hält, kann Lügen wie „Es gibt keine Fakten“ nicht mehr zurückweisen."}]}, {"id": "pp-einfuehrung", "tf": "PP", "gruppe": "Grundlagen", "kapitel": "Einführung in die Politische Philosophie", "titel": "Einführung", "sub": "Wie sollen wir zusammenleben?", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Gegenstand", "nach": "Teil A, Abschnitt „Zusammenleben statt Einzelhandeln“", "f": "Was unterscheidet die Politische Philosophie von der Ethik?", "a": [["Sie fragt, wie Menschen in einer Gesellschaft zusammenleben können und sollen.", 1], ["Sie fragt nach dem guten Handeln des Einzelnen, die Ethik nach dem Staat.", 0, null, "Hier sind die beiden Fächer vertauscht: Das gute Handeln des Einzelnen ist die Frage der Ethik."], ["Sie beschreibt nur, wie Staaten tatsächlich funktionieren, ohne sie zu bewerten.", 0, null, "Die Politische Philosophie sucht Grundprinzipien, an denen man politische Ordnungen messen kann. Sie bewertet also."], ["Sie klärt, welche Partei in aktuellen Streitfragen die besseren Argumente hat.", 0, null, null]], "e": "Während die Ethik nach dem guten Handeln des Einzelnen fragt, untersucht die Politische Philosophie die Ordnung des Zusammenlebens. Ihre zentralen Themen sind Staat, Macht, Recht, Menschenrechte, Gerechtigkeit, Freiheit und Demokratie. Zu jedem Thema gehört eine Leitfrage, etwa beim Staat: Wozu brauchen wir ihn?"}, {"teil": "Teil A · Gegenstand", "nach": "Teil A, Abschnitt „Keine Tagespolitik“", "f": "Welche Frage gehört zur Politischen Philosophie und nicht zur Tagespolitik?", "a": [["Darf ein Staat seine Bürger überhaupt zum Wählen zwingen?", 1], ["Soll in Luxemburg die Wahlpflicht bestehen bleiben?", 0, null, "Das ist das Beispiel des Kapitels für eine politische Frage: Es geht um eine konkrete Entscheidung, nicht um das Prinzip dahinter."], ["Um wie viel Prozent soll die Einkommensteuer steigen?", 0, null, null], ["Welche Partei hat in der Debatte um die Wahlpflicht recht?", 0, null, null]], "e": "Politische Philosophie fragt nicht, welche Partei recht hat oder wie hoch die Steuern sein sollen, sondern nach den Grundprinzipien, an denen man solche Entscheidungen messen kann: Was macht Herrschaft gerecht? Wann muss man Gesetzen folgen? Ob die Wahlpflicht in Luxemburg bleiben soll, ist eine politische Frage. Ob ein Staat seine Bürger überhaupt zum Wählen zwingen darf, ist eine Frage der Politischen Philosophie."}, {"teil": "Teil A · Gegenstand", "nach": "Teil A, Abschnitt „Sechs Leitfragenbereiche“", "f": "Zu welchem Leitfragenbereich gehört die Frage „Ist das Legale auch das Gerechte?“", "a": [["Recht und Moral", 1], ["Gerechtigkeit", 0, null, "Klingt naheliegend, aber im Bereich Gerechtigkeit geht es um die Verteilung von Chancen und Gütern. Hier geht es um das Verhältnis von Gesetz und Moral."], ["Staat und Legitimität", 0, null, null], ["Demokratie", 0, null, null]], "e": "Der Bereich Recht und Moral fragt, ob Recht immer moralisch gerecht sein muss oder ob gilt: „Gesetz ist Gesetz“ (Rechtspositivismus). Dahinter steht der Konflikt zwischen Naturrecht und positivem Recht. Die sechs Bereiche sind Staat und Legitimität, Macht und Herrschaft, Recht und Moral, Gerechtigkeit, Demokratie sowie Menschenrechte und Weltfrieden. Vorsicht: Sie überschneiden sich, und jede Antwort hängt von einem Menschenbild ab."}, {"teil": "Teil B · Legitimität", "nach": "Teil B, Abschnitt „Was ein Staat ist“", "f": "Aus welchen drei Elementen besteht ein Staat nach der Drei-Elemente-Lehre (Georg Jellinek)?", "a": [["Staatsvolk, Staatsgebiet, Staatsgewalt", 1], ["Legislative, Exekutive, Judikative", 0, null, "Das ist die Gliederung der Staatsgewalt im modernen Verfassungsstaat, also nur eines der drei Elemente."], ["Verfassung, Regierung, Armee und Polizei", 0, null, null], ["Monarchie, Aristokratie, Demokratie", 0, null, null]], "e": "Ein Staat braucht ein Staatsvolk, ein abgegrenztes Staatsgebiet und eine Staatsgewalt, die nach innen und außen Herrschaft ausübt. Die Staatsgewalt gliedert sich im modernen Verfassungsstaat in Gesetzgebung (Legislative), ausführende Gewalt (Exekutive) und Rechtsprechung (Judikative). Diese Aufteilung heißt Gewaltenteilung."}, {"teil": "Teil B · Legitimität", "nach": "Teil B, Abschnitt „Das Gewaltmonopol“", "f": "Max Weber definiert den Staat über das „Monopol legitimer physischer Gewaltsamkeit“. Warum ist das Wort „legitim“ entscheidend?", "a": [["Nicht jede Gewalt ist staatlich, sondern nur die, die als rechtmäßig gilt.", 1], ["Der Staat darf Gewalt nur anwenden, wenn jeder Bürger einzeln zustimmt.", 0, null, null], ["Gewalt ist immer illegitim, deshalb darf auch der Staat keine ausüben.", 0, null, "Weber beschreibt gerade, dass der Staat Gewalt beansprucht, etwa um Steuern durchzusetzen. Monopol heißt: nur er, und nur als rechtmäßige Gewalt."], ["Legitim bedeutet hier, dass die Gewalt von Gott selbst eingesetzt worden ist.", 0, null, null]], "e": "Jeder Staat erlässt Gesetze, erhebt Steuern und setzt sie notfalls mit Zwang durch: Wer nicht zahlt, bekommt erst eine Mahnung und am Ende den Gerichtsvollzieher. Wer dagegen selbst Gewalt anwendet, um sich sein Recht zu holen, macht sich strafbar. Nach Max Weber ist der moderne Staat der Herrschaftsverband, der innerhalb eines Gebietes das Monopol legitimer physischer Gewaltsamkeit erfolgreich für sich beansprucht."}, {"typ": "arg", "teil": "Teil B · Legitimität", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt im Argument zur Grundfrage der Legitimität?", "zeilen": [["P1", "Jeder Staat beansprucht Herrschaft: Er erlässt Gesetze, erhebt Steuern und setzt sie notfalls mit Zwang durch (Gewaltmonopol)."], ["P2", null], ["K", "Also braucht jede politische Ordnung eine Rechtfertigung."]], "a": [["Herrschaft über Menschen ist nicht selbstverständlich; Zwang ohne Begründung wäre bloße Gewalt.", 1], ["Der Mensch ist von Natur aus auf Gemeinschaft angelegt, und der Staat dient dem guten Leben.", 0, "Aristoteles", "Das ist die erste Grundantwort aus Teil C (Platon, Aristoteles). Sie erklärt, woher der Staat kommt, nicht warum Zwang begründet werden muss."], ["Was mit dem geltenden Recht übereinstimmt, ist damit immer auch gerecht und zustimmungswürdig.", 0, null, "Damit würde Legalität mit Legitimität gleichgesetzt. Das Kapitel betont: Beides kann auseinanderfallen."], ["Legitim herrscht nur, wer am besten weiß oder am tugendhaftesten handelt.", 0, "Platon", null]], "e": "Erst P2 macht aus der Beobachtung, dass Staaten Zwang ausüben, eine Forderung: Zwang muss begründet werden. Schon Augustinus fragte, was Reiche ohne Gerechtigkeit anderes seien als große Räuberbanden. Daraus ergibt sich die Leitfrage des Semesters: Wer darf herrschen, und mit welchem Recht? Durch Geburt, durch Stärke, durch Wissen oder durch Zustimmung?"}, {"teil": "Teil B · Legitimität", "nach": "Teil B, Abschnitt „Legal und legitim“", "f": "Die Rassentrennung war in den USA bis 1964 geltendes Recht. Rosa Parks widersetzte sich ihr. Wie ist ihr Handeln einzuordnen?", "a": [["illegal, aber legitim", 1], ["legal, aber illegitim", 0, null, "Hier sind die Begriffe vertauscht. Legal heißt gesetzmäßig, und gegen das geltende Gesetz hat sie gerade verstoßen."], ["legal und legitim", 0, null, null], ["illegal und illegitim", 0, null, null]], "e": "Legal ist, was mit dem geltenden Recht übereinstimmt. Legitim ist, was sich als gerecht und zustimmungswürdig begründen lässt. Wer sich der Rassentrennung widersetzte, handelte illegal und doch zu Recht. Umgekehrt kann ein Gesetz legal zustande kommen und dennoch illegitim sein. Der Unterschied begleitet dich durch das ganze Semester, besonders im Kapitel „Recht und Gerechtigkeit“."}, {"teil": "Teil B · Legitimität", "nach": "Teil B, Abschnitt „Warum Menschen Herrschaft anerkennen“", "f": "Max Weber unterscheidet traditionale, charismatische und legale Herrschaft. Welche Frage beantwortet diese Einteilung nicht?", "a": [["Ob der Glaube an die Rechtmäßigkeit einer Herrschaft auch begründet ist.", 1], ["Warum Menschen eine Herrschaft tatsächlich als rechtmäßig anerkennen.", 0, null, "Genau das beschreibt Weber: den Legitimitätsglauben. Das ist eine empirische Frage."], ["Worauf die Anerkennung einer Erbmonarchie durch ihre Untertanen in der Regel beruht.", 0, null, null], ["Wodurch ein charismatischer Revolutionsführer Anhänger gewinnt.", 0, null, null]], "e": "Weber fragt nicht, ob Herrschaft gerecht ist, sondern warum Menschen sie tatsächlich anerkennen: aus Glauben an die Heiligkeit des Althergebrachten (traditional, z. B. Erbmonarchie), aus Hingabe an die außergewöhnliche Ausstrahlung einer Person (charismatisch) oder aus Glauben an korrekt gesetzte Regeln (legal, z. B. im Rechtsstaat). Das ist eine empirische Beschreibung. Die Politische Philosophie fragt darüber hinaus normativ, ob dieser Glaube begründet ist."}, {"teil": "Teil C · Natürlich oder gemacht", "nach": "Teil C, Abschnitt „Der Staat als Vertrag“", "f": "Welche Aussage gehört zur Grundantwort „Der Staat ist ein künstlicher Vertrag“ (Hobbes, Locke, Rousseau)?", "a": [["Legitim ist Herrschaft, der die Betroffenen zustimmen (könnten).", 1], ["Legitim herrscht, wer am besten weiß oder am tugendhaftesten handelt.", 0, "Platon", "Das ist die erste Grundantwort (Platon, Aristoteles): Der Staat ist natürlich, Legitimität kommt aus Wissen oder Tugend."], ["Der Mensch ist auf Gemeinschaft angelegt; der Staat dient dem guten Leben.", 0, "Aristoteles", null], ["Legitim ist Herrschaft, die schon seit vielen Generationen besteht.", 0, null, null]], "e": "Die Vertragstheoretiker gründen den Staat auf eine Entscheidung der Menschen: Sie schaffen ihn, weil das Leben ohne ihn unsicher oder ungerecht ist. Legitimität kommt deshalb aus der Zustimmung der Betroffenen. Am Anfang steht ein Gedankenexperiment: Wie sähe das Leben ohne Staat aus, im Naturzustand? Platon und Aristoteles dagegen halten den Staat für natürlich."}, {"teil": "Teil C · Natürlich oder gemacht", "nach": "Teil C, Abschnitt „Der Staat als natürliche Gemeinschaft“", "f": "Warum macht für Platon das Fachwissen der Zimmerleute oder Schmiede einen Staat nicht „weise“?", "a": [["Es betrifft nur einen Teil des Staates, nicht den Staat als Ganzen.", 1], ["Handwerker sind zu ungebildet, um überhaupt etwas zu wissen.", 0, null, null], ["Weise ist ein Staat nur, wenn alle Bürger gemeinsam mitberaten.", 0, null, "Bei Platon besitzen nur die wenigen „vollendeten Wächter“ das nötige Wissen. Die Teilhabe vieler Bürger ist der Gedanke des Aristoteles."], ["Fachwissen ändert sich ständig, Weisheit dagegen bleibt immer gleich.", 0, null, null]], "e": "In der Politeia fragt Sokrates, was einen Staat „weise“ macht. Das Wissen der Handwerker betrifft nur ihren Bereich. Weise ist ein Staat erst durch ein Wissen, das sich über ihn als Ganzen berät, und das besitzen nur die wenigen „vollendeten Wächter“, also die Herrscher. Daraus folgt Platons These: „Solange nicht die Philosophen Könige werden […] gibt es keine Ruhe von den Übeln der Staaten.“"}, {"teil": "Teil C · Natürlich oder gemacht", "nach": "Teil C, Abschnitt „Der Staat als Vertrag“", "f": "Was ist der Naturzustand, mit dem die Vertragstheoretiker beginnen?", "a": [["Ein Gedankenexperiment: Wie sähe das Leben ohne Staat aus?", 1], ["Die historische Zeit, bevor die ersten Staaten gegründet wurden.", 0, null, "Der Naturzustand ist kein Geschichtsbericht. Er soll zeigen, warum ein Staat nötig ist."], ["Ein Krieg aller gegen alle, darin sind sich alle drei Denker einig.", 0, null, "Gerade nicht: Hobbes, Locke und Rousseau beurteilen den Naturzustand ganz unterschiedlich, und daraus folgen verschiedene Staaten."], ["Die Polis, auf die der Mensch von Natur aus angelegt ist.", 0, null, null]], "e": "Der Naturzustand ist das Gedankenexperiment eines Lebens ohne Staat, also ohne Regierung und verbindliche Gesetze. Das entspricht dem Begriff Anarchie (griech. an-arché, „ohne Herrschaft“), den manche mit Chaos und Gewalt gleichsetzen, andere (Anarchismus) mit einer freiheitlichen Ordnung ohne Zwang (Exkurs 1). Aus den unterschiedlichen Urteilen über den Naturzustand folgen verschiedene Antworten: von Hobbes' starkem Souverän über Lockes begrenzte Regierung bis zu Rousseaus Volkssouveränität."}, {"teil": "Exkurs", "nach": "Exkurs 2 „Widerstandsrecht“", "f": "Schülerinnen und Schüler blockieren öffentlich und gewaltfrei eine Straße, um auf ein ungerechtes Gesetz aufmerksam zu machen, und nehmen die Strafe in Kauf. Was liegt vor?", "a": [["Ziviler Ungehorsam", 1], ["Widerstandsrecht", 0, null, "Das Widerstandsrecht gilt im Rechtsstaat nur als letztes Mittel, wenn die gesamte Verfassungsordnung zerstört oder systematisch missbraucht wird."], ["Legaler Protest", 0, null, "Eine Blockade ist ein bewusster Gesetzesverstoß. Legale Proteste oder Streiks sind dagegen Gebrauch von Grundrechten."], ["Anarchie", 0, null, null]], "e": "Ziviler Ungehorsam ist ein bewusster, öffentlicher und gewaltfreier Gesetzesverstoß, mit dem man auf eine Ungerechtigkeit aufmerksam machen will. Wer ihn übt, erkennt die Rechtsordnung im Ganzen an und nimmt die Strafe in Kauf (so John Rawls). Das Widerstandsrecht ist dagegen die Befugnis, einer Obrigkeit zu widerstehen, die grundlegende Rechte verletzt; am einflussreichsten vertrat es John Locke."}, {"typ": "offen", "teil": "Teil B · Legitimität", "nach": "Teil B, Abschnitt „Legal und legitim“", "f": "Finde ein Beispiel, in dem etwas legal, aber nicht legitim ist, und eines für den umgekehrten Fall. Erkläre daran den Unterschied.", "m": "Legal ist, was mit dem geltenden Recht übereinstimmt; legitim ist, was sich als gerecht und zustimmungswürdig begründen lässt. Legal, aber nicht legitim ist ein Gesetz, das ordnungsgemäß beschlossen wurde, aber eine Gruppe ungerecht benachteiligt, etwa die Rassentrennung in den USA bis 1964. Sie war geltendes Recht, ließ sich aber nicht als gerecht begründen. Illegal, aber legitim war der Widerstand von Rosa Parks: Sie brach dieses Gesetz und handelte doch zu Recht. Ähnlich kann ziviler Ungehorsam gegen ein ungerechtes Gesetz illegal und trotzdem legitim sein. Das zeigt: Ob etwas im Gesetz steht, beantwortet noch nicht, ob es gerechtfertigt ist. Herrschaft braucht deshalb eine Begründung, die über die bloße Gesetzmäßigkeit hinausgeht."}]}, {"id": "pp-antike", "tf": "PP", "gruppe": "Grundlagen", "kapitel": "Platon und Aristoteles - Antike Staatstheorie", "titel": "Platon und Aristoteles", "sub": "Die Weisesten oder viele Bürger?", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Platon", "nach": "Teil A, Abschnitt „Arbeitsteilung als Ursprung des Staates“", "f": "Warum hält Platon die Ständeordnung für natürlich und nicht für eine Erfindung?", "a": [["Die Menschen sind verschieden begabt und voneinander abhängig; die Ordnung spiegelt ihre Begabungen.", 1], ["Der Mensch ist von Natur aus ein staatenbildendes Wesen, wie seine Sprache (logos) zeigt.", 0, "Aristoteles", "Das ist die Begründung des Aristoteles. Platon erklärt den Staat aus der Unvollständigkeit des Einzelnen und der Arbeitsteilung."], ["Die Stände werden durch Geburt vererbt, so wie es der Wille der Götter von Anfang an vorsieht.", 0, null, "Der Stand hängt bei Platon an der Veranlagung, die durch Erziehung erkannt wird, nicht an Geburt oder Besitz."], ["Die Menschen haben die Stände in einem Vertrag festgelegt, um sicher, friedlich und geordnet zusammenzuleben.", 0, null, null]], "e": "Weil die Menschen unterschiedliche Fähigkeiten haben und zugleich voneinander abhängig sind, ist es für das Gemeinwohl wie für den Einzelnen besser, wenn sie sich spezialisieren: einer ist Bauer, einer Handwerker, einer Soldat. So erfüllt der Staat die menschliche Natur. Er ist für Platon deshalb nicht bloß eine zweckhafte Vereinigung, sondern eine natürliche Ordnung."}, {"teil": "Teil A · Platon", "nach": "Teil A, Abschnitt „Seele und Staat: drei Stände“", "f": "Welcher Seelenteil und welche Tugend gehören bei Platon zum Wehrstand (Wächter)?", "a": [["Mut und Tapferkeit", 1], ["Vernunft und Weisheit", 0, null, "Vernunft und Weisheit gehören zu den Philosophenkönigen (Lehrstand), den „vollkommenen Wächtern“."], ["Begierde und Mäßigung", 0, null, null], ["Mut und Mäßigung", 0, null, null]], "e": "Der Staat ist für Platon die Seele im Großen. Der Vernunft mit der Tugend Weisheit entsprechen die Herrscher (archontes), dem Mut mit der Tugend Tapferkeit die Wächter oder „Helfer“ (epikouroi), der Begierde, die durch Mäßigung (Besonnenheit) gezügelt werden muss, der Nährstand aus Bauern und Handwerkern. „Wächter“ (phylakes) ist bei Platon der Oberbegriff für beide oberen Stände."}, {"teil": "Teil A · Platon", "nach": "Teil A, Abschnitt „Gerechtigkeit: Jeder tut das Seine“", "f": "Wann ist ein Staat nach Platon gerecht?", "a": [["Wenn jeder Stand das Seine tut und sich nicht in fremde Angelegenheiten einmischt.", 1], ["Wenn alle Bürger das gleiche Stimmrecht haben und gemeinsam entscheiden.", 0, null, "Gerade das kritisiert Platon: Gleiches Stimmrecht unabhängig von Einsicht führe zur Herrschaft der Unwissenden."], ["Wenn ein starker Mittelstand zwischen den Reichen und den Armen ausgleicht.", 0, "Aristoteles", null], ["Wenn jeder, der durch Fleiß reich geworden ist, auch in den Herrscherstand aufrücken darf.", 0, null, "Wer durch Reichtum in einen Stand drängt, für den er nicht befähigt ist, gefährdet den Staat. Platon nennt das „Vielgeschäftigkeit“."]], "e": "Platons Formel lautet: „Gerechtigkeit bedeutet, dass jeder das Seine tut und sich nicht in fremde Angelegenheiten einmischt.“ Die Bauern sorgen für Nahrung, die Wächter für Schutz, die Herrscher für kluge Leitung, so wie in der gerechten Seele die Vernunft führt und Mut und Begierde ihr folgen. Vermischungen der Stände nennt Platon „Vielgeschäftigkeit“, den Untergang des Staates."}, {"typ": "arg", "teil": "Teil A · Platon", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welche Prämisse fehlt in Platons Argument für die Herrschaft der Philosophen?", "zeilen": [["P1", "Die Menschen haben unterschiedliche Fähigkeiten und sind voneinander abhängig; deshalb spezialisieren sie sich arbeitsteilig."], ["P2", "Die Seele hat drei Teile: Vernunft, Mut und Begierde. Der Staat ist die Seele im Großen: Herrscher, Wächter und Nährstand."], ["P3", "Gerecht ist ein Staat, wenn jeder das Seine tut, so wie in der gerechten Seele die Vernunft führt."], ["P4", null], ["K", "Also sollen die Philosophen herrschen."]], "a": [["Nur wer die Idee des Guten erkennt, weiß, was für alle das Beste ist; das erreichen nur wenige.", 1], ["Viele Bürger urteilen gemeinsam besser als wenige, weil Urteilskraft in der Praxis wächst.", 0, "Aristoteles", "Das spricht gerade gegen die Herrschaft weniger. Es ist das Argument des Aristoteles für die Politie."], ["Die Philosophen stammen aus den angesehensten Familien und sind zum Herrschen geboren.", 0, null, null], ["Das Volk hat den Philosophen die Herrschaft vertraglich übertragen und kann sie jederzeit zurückfordern.", 0, null, "Platons Herrscher sind durch Wissen legitimiert, nicht durch Zustimmung. Eine Kontrolle durch die anderen Stände ist nicht vorgesehen."]], "e": "P4 verbindet die Politik mit der Ideenlehre: Philosophische Naturen verlangen nach einem Wissen über die unveränderlichen Ideen. Diese Einsicht erreichen nur wenige nach jahrzehntelanger Ausbildung: Elementarerziehung bis 20, Mathematik, Astronomie und Harmonie bis 30, Dialektik bis 35, praktische Tätigkeit im Staat bis 50; erst dann herrschen sie. Sie verzichten auf Privatleben und Besitz und sind an kein Gesetz gebunden. Das Kapitel fasst zusammen: Legitimität durch Wissen."}, {"teil": "Teil A · Platon", "nach": "Teil A, Abschnitt „Metallmythos und ‚edle Lüge‘“", "f": "Wozu dient bei Platon der Metallmythos?", "a": [["Die Bürger sollen die Ständeordnung glauben und sie dadurch annehmen.", 1], ["Er beweist, dass der Stand eines Menschen durch die Geburt für immer feststeht.", 0, null, "Im Mythos können Kinder in einen anderen Stand aufsteigen oder absteigen. Der Stand hängt an der Veranlagung."], ["Er erklärt, wie die Polis natürlich aus Haus und Dorf entstanden ist.", 0, "Aristoteles", null], ["Er soll den Herrschern zeigen, dass auch sie an die Gesetze gebunden sind.", 0, null, null]], "e": "Nach dem Metallmythos hat Gott den Herrschern Gold, den Wächtern Silber und den Bauern und Handwerkern Eisen und Erz beigemischt. Platon nennt ihn selbst eine „edle Lüge“: Die Ordnung soll nicht nur vernünftig sein, sie soll auch geglaubt werden. Wichtig ist, dass der Stand auf Veranlagung beruht, die durch Erziehung erkannt wird, nicht auf Geburt oder Besitz."}, {"teil": "Teil A · Platon", "nach": "Teil A, Abschnitt „Kritik an Platon: Popper und Russell“", "f": "Platons Schiffsgleichnis: Nur der Steuermann versteht die Kunst der Navigation, nicht die streitenden Schiffseigner. Was setzt Karl Popper gegen diese Denkweise?", "a": [["Man soll fragen, wie man schlechte Herrscher ohne Blutvergießen wieder loswerden kann.", 1], ["Weisheit lässt sich nicht so eindeutig feststellen, dass daraus ein Herrschaftsanspruch folgt.", 0, "Russell", "Das ist der Einwand von Bertrand Russell. Popper geht es um Kritik an den Herrschern und darum, sie loswerden zu können."], ["Viele Bürger urteilen gemeinsam besser, wie bei einem Mahl, zu dem viele beitragen.", 0, "Aristoteles", null], ["Der Steuermann muss vom Volk gewählt werden, sonst navigiert er nicht legitim.", 0, null, null]], "e": "Für Popper (Die offene Gesellschaft und ihre Feinde, 1945) ist Platons Staat das Urbild einer geschlossenen, totalitären Gesellschaft: Wer beansprucht, das Gute zu kennen, entzieht seine Herrschaft der Kritik. Selbst ein wohlwollender Herrscher erfährt dann nicht mehr, ob seine Maßnahmen wirken, weil niemand ihn zu kritisieren wagt. Deshalb ersetzt Popper die Frage „Wer soll herrschen?“ durch die Frage, wie man schlechte Herrscher ohne Blutvergießen wieder loswird."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Die Sprache (logos)“", "f": "Woran zeigt sich für Aristoteles, dass der Mensch ein zoon politikon ist?", "a": [["An der Sprache, mit der er über gerecht und ungerecht beraten kann.", 1], ["An seiner Schwäche: Allein ist er unvollständig und auf andere angewiesen.", 0, "Platon", "So erklärt Platon die Entstehung des Staates. Aristoteles sieht im Menschen selbst eine natürliche Neigung zur Gemeinschaft."], ["Daran, dass er wie Bienen und Herdentiere in Gruppen zusammenlebt.", 0, null, "Aristoteles betont gerade den Unterschied: Der Mensch ist „mehr als jede Biene“ ein staatsbezogenes Lebewesen. Tiere haben nur Laute für Schmerz und Lust."], ["An seiner Angst vor dem gewaltsamen Tod, die ihn zum Vertrag treibt.", 0, null, null]], "e": "Tiere verfügen lediglich über Laute, mit denen sie Gefühle wie Schmerz oder Lust ausdrücken. Menschen können mithilfe der Sprache (logos) über Gut und Böse, Gerechtigkeit und Ungerechtigkeit und über das Gemeinwohl nachdenken und sich austauschen. Aristoteles nennt den Menschen deshalb auch zoon logon echon, das „Lebewesen mit Vernunft und Sprache“. Wer ohne Polis lebt, ist nach ihm entweder „ein Tier oder ein Gott“."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Vom Haus zur Polis“", "f": "Aristoteles nennt die Polis „natürlich“. Was meint er damit?", "a": [["Sie ist das Ziel, auf das Haus und Dorf von Anfang an angelegt sind.", 1], ["Sie wächst ohne menschliches Zutun, so wie eine Pflanze aus dem Samen.", 0, null, "Das Kapitel betont: „Natürlich“ heißt nicht, dass der Staat ohne menschliches Zutun wächst. „Die Natur jedoch bedeutet Ziel“."], ["Sie spiegelt die drei Teile der Seele in drei Ständen wider.", 0, "Platon", null], ["Sie bestand schon, bevor es Häuser und Dörfer gab.", 0, null, null]], "e": "Am Anfang stehen die Grundgemeinschaften (Mann und Frau, Eltern und Kinder, Herr und Sklave). Mehrere bilden die Hausgemeinschaft (oikos), mehrere Häuser das Dorf, mehrere Dörfer die Polis. Erst die Polis ermöglicht Autarkie, also Selbstgenügsamkeit und Unabhängigkeit, und damit ein gutes und tugendhaftes Leben. Sie ist die vollendete Form der Gemeinschaft."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Der Staat und das gute Leben“", "f": "Wozu dient der Staat nach Aristoteles?", "a": [["Er ermöglicht das gute Leben (eudaimonia) und erzieht die Bürger zur Tugend.", 1], ["Er ist ein Zweckbündnis, um Sicherheit und Eigentum der Bürger zu schützen.", 0, null, "So sehen es später Hobbes und Locke. Für Aristoteles ist der Staat immer auch eine moralische und sittliche Gemeinschaft."], ["Er soll die Idee des Guten durch eine kleine Elite von Weisen verwirklichen.", 0, "Platon", null], ["Er sichert vor allem das bloße Überleben, das Haus und Dorf nicht leisten.", 0, null, "Der Staat entsteht zwar um des Lebens willen, besteht aber um des guten Lebens willen."]], "e": "Ohne Staat könnten Menschen zwar überleben, aber nicht gut leben. Tugenden wie Gerechtigkeit, Mut oder Freundschaft entstehen nur im Umgang mit anderen; erst in der Polis wird der Mensch ein „vollständiger Bürger“. Das Gesetz ist dabei eine Schule der Tugend: Es hat nicht nur Ordnungs-, sondern auch Erziehungsfunktion und bringt die Bürger dazu, schlechte Gewohnheiten abzulegen."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Sechs Staatsformen“", "f": "Viele regieren, aber im Interesse der Armen gegen die Reichen. Wie heißt diese Staatsform bei Aristoteles?", "a": [["Demokratie", 1], ["Politie", 0, null, "Die Politie ist die gute Form der Herrschaft vieler: Alle freien Bürger regieren zum Gemeinwohl."], ["Oligarchie", 0, null, null], ["Tyrannis", 0, null, null]], "e": "Aristoteles ordnet die Staatsformen nach zwei Fragen: Wer regiert (einer, wenige, viele), und in wessen Interesse (Gemeinwohl oder Eigennutz)? Gute Formen sind Monarchie, Aristokratie und Politie, entartete Formen Tyrannis, Oligarchie (Herrschaft der Reichen) und Demokratie. Demokratie bedeutet bei ihm also etwas anderes als heute: eine Herrschaft, in der die Armen zu ihrem eigenen Vorteil regieren."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Die Mitte und der Mittelstand“", "f": "Welchen Grund nennt Aristoteles dafür, dass ein starker Mittelstand den Staat trägt?", "a": [["Er folgt eher der Vernunft, während Reiche zu Übermut und Arme zu Heimtücke neigen.", 1], ["Er hat als einziger Stand genug Muße für eine lange philosophische Ausbildung.", 0, null, null], ["Er erkennt durch Dialektik die Idee des Guten besser als die Reichen und die Armen.", 0, "Platon", "Einsicht in die Idee des Guten ist Platons Begründung für die Philosophenherrschaft. Aristoteles setzt auf Vernunft, Ausgleich und Stabilität."], ["Er sorgt dafür, dass am Ende alle Bürger genau gleich viel besitzen.", 0, null, null]], "e": "Aristoteles nennt drei Gründe: Der Mittelstand ist eher bereit, der Vernunft zu folgen; er ist frei von Neid und Verachtung und daher fähiger zu Solidarität und Freundschaft; und er garantiert Stabilität: „Wo der Mittelstand zahlreich ist, da entstehen am wenigsten Aufstände und Zwiste unter den Bürgern.“ Dahinter steht die Lehre von der Mitte (mesotes) aus seiner Ethik: Tugend ist das richtige Maß zwischen Extremen, etwa Mut zwischen Feigheit und Tollkühnheit."}, {"teil": "Teil B · Aristoteles", "nach": "Teil B, Abschnitt „Die Politie: die beste erreichbare Verfassung“", "f": "Warum ist die Politie eine Mischverfassung?", "a": [["Alle freien Vollbürger entscheiden mit, aber Ämter werden durch Wahl statt durch Los vergeben.", 1], ["Philosophen geben die Gesetze, Wächter setzen sie durch, und der Nährstand stimmt ihnen in einer Versammlung zu.", 0, null, "Einen festen Herrscherstand gibt es in der Politie nicht: Die Bürger regieren abwechselnd und lernen, zu herrschen und beherrscht zu werden."], ["Reiche und Arme regieren abwechselnd, jede Gruppe jeweils zu ihrem eigenen Vorteil.", 0, null, "Herrschaft zum eigenen Vorteil kennzeichnet bei Aristoteles die entarteten Formen. Die Politie bleibt an das Gemeinwohl gebunden."], ["Ein König teilt die Macht mit einem Rat der Tugendhaftesten, das Volk bleibt außen vor.", 0, null, null]], "e": "Die Politie mischt Demokratie und Oligarchie. Demokratisch ist sie, weil alle freien Vollbürger am Entscheidungsprozess teilnehmen; Bürger ist, wer an Rechtsprechung und Ämtern teilhat. Oligarchisch sind etwa die Wahl der Ämter statt des Loses und ein mäßiger Besitz als Voraussetzung. Schlechthin am besten wäre die Herrschaft der Tugendhaftesten, aber weil solche Menschen selten sind, ist die Politie die beste erreichbare Verfassung."}, {"teil": "Kritische Würdigung", "nach": "Kritische Würdigung, Aristoteles, Schwäche „Ausschluss vieler Menschen“", "f": "Welche Kritik trifft Aristoteles, aber nicht Platon?", "a": [["Frauen gelten nicht als vollwertige Mitglieder der Gemeinschaft.", 1], ["Die Herrscher sind an kein Gesetz gebunden; Missbrauch wäre kaum zu verhindern.", 0, "Platon", null], ["Herrscher und Wächter dürfen weder Familie noch Besitz haben.", 0, "Platon", null], ["Werke wie die Homers sollen teilweise verboten werden.", 0, "Platon", "Die Zensur von Literatur, Musik und Theater fordert Platon, damit „falsche“ Vorbilder die Bürger nicht verderben."]], "e": "Nach Aristoteles gelten nur freie männliche Bürger als vollwertige Mitglieder der Polis; Frauen, Sklaven und Fremde (Metöken) sind ausgeschlossen, und die Sklaverei hält er für „natürlich“. Platon dagegen macht in der Erziehung keinen Unterschied zwischen Mädchen und Jungen: Auch Frauen können Wächterinnen werden, gemeinsam trainieren und kämpfen. Die Hauptkritik an Platon lautet: elitär, keine Kontrolle der Herrscher (Popper)."}, {"typ": "offen", "teil": "Fazit", "nach": "Fazit „Platon und Aristoteles im Vergleich“", "f": "„Der Unterschied ist nicht einfach ‚wenige gegen viele‘.“ Erkläre, worin der eigentliche Unterschied zwischen Platon und Aristoteles liegt und was beide von den Vertragstheorien trennt.", "m": "Bei Platon herrschen wenige, die Philosophenkönige, bei Aristoteles beteiligen sich viele freie Bürger in der Politie. Der Kern liegt aber in der Frage, woher politische Urteilskraft kommt. Für Platon kommt sie aus philosophischer Erkenntnis: Nur wer nach langer Ausbildung die Idee des Guten erkennt, weiß, was für alle das Beste ist. Für Aristoteles wächst sie in der Praxis, durch Gewöhnung und gemeinsames Handeln in der Polis; viele können gemeinsam besser urteilen als wenige Hervorragende, so wie ein Mahl, zu dem viele beitragen, besser sein kann. Gemeinsam ist beiden, dass der Staat eine natürliche Gemeinschaft ist und dem guten Leben dient, nicht nur dem Überleben. Genau das bestreiten Hobbes, Locke und Rousseau: Für sie ist der Staat von Menschen gemacht, und seine Legitimität muss aus der Zustimmung der Einzelnen begründet werden."}]}, {"id": "hobbes", "tf": "PP", "gruppe": "Vertragstheorien", "kapitel": "Hobbes - Leviathan", "titel": "Hobbes", "sub": "Der Staat als künstlicher Körper", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Der Naturzustand als Gedankenexperiment“", "f": "Was ist der Naturzustand bei Hobbes?", "a": [["Ein Gedankenexperiment, das zeigen soll, warum ein Staat notwendig ist.", 1], ["Eine frühe historische Epoche der Menschheit, bevor es Ackerbau und Städte gab.", 0, null, "Der Naturzustand ist keine historische Epoche. Dass es darin keinen Ackerbau gibt, leitet Hobbes als Folge ab."], ["Der Englische Bürgerkrieg, vor dem Hobbes nach Frankreich floh.", 0, null, "Der Bürgerkrieg ist der Hintergrund, vor dem Hobbes schreibt, aber nicht der Naturzustand selbst."], ["Ein friedlicher Zustand, der erst mit dem Eigentum verloren ging.", 0, "Rousseau", null]], "e": "Man stelle sich eine Welt ohne Polizei, ohne Gesetze, ohne Gerichte vor, nur einzelne Menschen mit ihren Trieben, Wünschen und Ängsten. Mit diesem Modell beantwortet Hobbes eine radikale Frage: Warum brauchen wir überhaupt einen Staat, und warum sollten wir ihm gehorchen? Seine Antwort: Der Staat ist kein Naturprodukt und kein göttliches Geschenk, sondern ein künstliches Werk der Menschen, geschaffen aus Angst, Vernunft und Eigeninteresse."}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Gleich an Körper und Geist“", "f": "Worin sind die Menschen im Naturzustand nach Hobbes gleich?", "a": [["Selbst der Schwächste kann den Stärksten töten, durch List, Überraschung oder Waffen.", 1], ["Alle sind frei und gleich unter einem Gesetz der Natur, das verbietet, anderen zu schaden.", 0, "Locke", "Das ist Lockes Naturzustand. Bei Hobbes gibt es vor dem Staat kein Gesetz, das wirksam schützt."], ["Alle sind gleich stark und gleich klug, keiner ist dem anderen überlegen.", 0, null, "Hobbes behauptet nicht, dass alle gleich stark oder klug sind. Gleich sind sie darin, dass jeder jeden töten kann."], ["Alle haben von Gott dieselben unveräußerlichen Rechte erhalten.", 0, null, null]], "e": "Die Gleichheit ist negativ begründet: Jeder ist für jeden gefährlich. Daraus erwächst eine Gleichheit der Hoffnungen, denn jeder glaubt, seine Wünsche durchsetzen zu können. Wollen nun zwei dasselbe Gut, das nicht beide haben können, werden sie Feinde. Das ist der erste Schritt zum Krieg eines jeden gegen jeden."}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Drei Ursachen des Streits“", "f": "Welche drei Konfliktursachen nennt Hobbes?", "a": [["Konkurrenz, Misstrauen, Ruhmsucht", 1], ["Kein festes Gesetz, kein unparteiischer Richter, keine durchsetzende Gewalt", 0, "Locke", "Das sind Lockes drei Mängel des Naturzustands: Sie beschreiben, was fehlt, nicht warum Menschen kämpfen."], ["Eigentum, Ungleichheit, Eitelkeit", 0, "Rousseau", null], ["Hunger, Kälte, Angst vor wilden Tieren", 0, null, "Hobbes geht es nicht um Not, sondern um das Verhältnis der Menschen zueinander."]], "e": "Die Konkurrenz führt zu Übergriffen des Gewinns wegen, das Misstrauen zu Übergriffen der Sicherheit wegen: Weil man nie weiß, ob der andere angreift, ist es am vernünftigsten, ihm zuvorzukommen (Vorbeugung). Die Ruhmsucht führt zu Gewalt des Ansehens wegen, „wegen Kleinigkeiten wie ein Wort, ein Lächeln, eine verschiedene Meinung“. Hobbes fasst selbst zusammen: „So liegen also in der menschlichen Natur drei hauptsächliche Konfliktursachen: erstens Konkurrenz, zweitens Misstrauen, drittens Ruhmsucht.“"}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Krieg eines jeden gegen jeden“", "f": "Was meint Hobbes mit dem „Krieg eines jeden gegen jeden“ (bellum omnium contra omnes)?", "a": [["Es wird nicht ständig gekämpft, aber es kann jederzeit gekämpft werden.", 1], ["Alle Menschen kämpfen ununterbrochen mit Waffen gegeneinander.", 0, null, "Krieg ist bei Hobbes ein Zustand, keine Dauerschlacht. Entscheidend ist die ständige Bedrohung."], ["Nur die Starken kämpfen, die Schwachen unterwerfen sich freiwillig.", 0, null, null], ["Krieg beginnt erst, wenn jemand Land einzäunt und „Dies ist mein“ sagt.", 0, null, null]], "e": "Weil es keine allgemeine Macht gibt, die alle im Zaum hält, herrscht ständige Bedrohung. Die Folgen beschreibt Hobbes im 13. Kapitel: Für Fleiß ist kein Raum, „da man sich seiner Früchte nicht sicher sein kann“; es gibt keinen Ackerbau, keine Schifffahrt, keine Künste, keine Literatur. Das Schlimmste ist die „beständige Furcht und Gefahr eines gewaltsamen Todes - das menschliche Leben ist einsam, armselig, ekelhaft, tierisch und kurz“."}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Krieg eines jeden gegen jeden“", "f": "Jemand sagt: „Hobbes hält alle Menschen für böse.“ Was antwortet Hobbes' eigenes Argument darauf?", "a": [["Nicht alle sind böse; weil man aber nicht erkennt, wer angreift, müssen auch Friedliche vorbeugen.", 1], ["Das stimmt: Der Mensch ist von Natur aus schlecht und kann nur durch Strafe gebessert werden.", 0, null, "Hobbes braucht diese Annahme gar nicht. Es reicht, dass einige Lust an Eroberung haben und man sie nicht von den Friedlichen unterscheiden kann."], ["Der Mensch ist von Natur aus nicht böse und empfindet Mitleid; erst die Gesellschaft verdirbt ihn.", 0, "Rousseau", null], ["Der Mensch ist vernünftig und hält sich auch ohne Staat meist an das Gesetz der Natur.", 0, "Locke", null]], "e": "Gewalt ist im Naturzustand vernünftig, und gerade das macht ihn so schlimm. Einige Menschen haben Lust an Eroberung. Wer friedlich in bescheidenen Grenzen leben möchte, kann sich durch bloße Verteidigung nicht halten, weil er die Eroberer nicht von den Friedlichen unterscheiden kann. Deshalb ist Vorbeugung für jeden der vernünftigste Weg zur Selbstsicherung."}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Recht und Unrecht im Naturzustand“", "f": "Gibt es bei Hobbes im Naturzustand Recht und Unrecht?", "a": [["Nein: Wo keine allgemeine Gewalt ist, ist kein Gesetz, und wo kein Gesetz, keine Ungerechtigkeit.", 1], ["Ja: Ein Gesetz der Natur gilt schon vor dem Staat, und jeder darf Übertreter maßvoll bestrafen.", 0, "Locke", "So argumentiert Locke. Für Hobbes setzen gerecht und ungerecht eine Ordnung voraus, die Verträge erzwingt."], ["Ja: Was recht und unrecht ist, haben Gott und die Kirche von Anfang an verbindlich für alle festgelegt.", 0, null, null], ["Nein, denn im Naturzustand gibt es noch keine Sprache, um Regeln zu formulieren.", 0, null, null]], "e": "Hobbes schreibt im 13. Kapitel: „Gewalt und Betrug sind im Krieg die beiden Kardinaltugenden.“ Es gibt auch kein Eigentum und kein festes „Mein und Dein“: Jedem gehört nur, was er erlangen und behaupten kann. Daraus folgt nicht, dass alles gleichgültig wäre: Die Naturgesetze verpflichten im Gewissen (in foro interno), wirksam werden sie aber erst durch die Staatsgewalt."}, {"typ": "arg", "teil": "Teil A · Naturzustand", "nach": "Zentrale Argumentation (Auf einen Blick)", "f": "Welcher Schritt fehlt in Hobbes' Argument? (Auszug)", "zeilen": [["P1", "Die Menschen sind an Körper und Geist annähernd gleich: Selbst der Schwächste kann den Stärksten töten."], ["P3", "Aus gegenseitigem Misstrauen ist Vorbeugung der vernünftigste Weg zur Selbstsicherung."], ["P5", "Menschen verlangen Wertschätzung und reagieren auf Geringschätzung mit Gewalt (Ruhmsucht)."], ["P6", null], ["K1", "Also herrscht der „Krieg aller gegen alle“."]], "a": [["Es gibt keine allgemeine Macht, die alle im Zaum hält.", 1], ["Alle Menschen sind von Natur aus böse und wollen herrschen.", 0, null, "Das behauptet Hobbes gerade nicht. Auch Friedliche müssen vorbeugen, weil sie Angreifer nicht erkennen."], ["Es gibt noch kein Eigentum, das man schützen könnte.", 0, null, null], ["Ein Gesetz der Natur verbietet, anderen zu schaden.", 0, "Locke", null]], "e": "Erst P6 macht aus Konkurrenz, Misstrauen und Ruhmsucht einen Dauerzustand: Weil keine Macht da ist, die alle im Zaum hält, wird Vorbeugung für jeden vernünftig. Ausgelassen sind P2 (Gleichheit der Hoffnung, Konkurrenz) und P4 (Eroberer zwingen auch Bescheidene zur Gewalt). Genau an P6 setzt Hobbes' Lösung an: Der Staat wird diese allgemeine Macht."}, {"teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Naturrecht und Naturgesetze“", "k": "4", "f": "Was unterscheidet bei Hobbes das Naturrecht von den Naturgesetzen?", "a": [["Naturrecht: Jedem ist alles erlaubt, was dem Überleben dient. Naturgesetze: Vernunftregeln für Frieden.", 1], ["Das Naturrecht verbietet jedem, einem anderen an Leben, Gesundheit, Freiheit oder Besitz zu schaden.", 0, "Locke", "Das ist Lockes Gesetz der Natur. Bei Hobbes ist das Naturrecht gerade ein „Recht auf alles“."], ["Das Naturrecht gilt nur für den Souverän, die Naturgesetze dagegen gelten für alle seine Untertanen.", 0, null, null], ["Naturrecht und Naturgesetze sind zwei Übersetzungen desselben lateinischen Begriffs.", 0, null, null]], "e": "Das Naturrecht (ius naturale) gibt im Naturzustand jedem ein „Recht auf alles“. Die Naturgesetze (leges naturales) erkennt die Vernunft. Das wichtigste lautet: „Suche Frieden, wenn du ihn erreichen kannst; und wenn nicht, gebrauche alle Mittel des Krieges.“ Daraus folgen: Verzichte auf dein Recht auf alles, wenn die anderen es auch tun, und halte geschlossene Verträge. Nur durch Frieden kann Selbsterhaltung gelingen."}, {"teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Verträge ohne Schwert“", "f": "„Verträge ohne Schwert sind bloße Worte.“ Was meint Hobbes?", "a": [["Ohne Zwang ist es unvernünftig, Verträge allein zu halten: Wer sie hält, wird zur Beute.", 1], ["Verträge sind nur gültig, wenn sie unter Androhung von Waffengewalt geschlossen wurden.", 0, null, "Das Schwert steht für die Macht, Verträge durchzusetzen, nicht für Zwang beim Abschluss."], ["Menschen halten ihre Versprechen grundsätzlich nie, weil sie von Natur aus durch und durch böse sind.", 0, null, null], ["Nur schriftlich festgehaltene und gesiegelte Verträge sind wirklich verbindlich.", 0, null, null]], "e": "Die Naturgesetze allein reichen nicht. Sie sind nach Hobbes „unseren natürlichen Leidenschaften entgegengesetzt“, die uns zu Parteilichkeit, Hochmut und Rachsucht verleiten. Wer einen Vertrag hält, während andere ihn brechen, schadet sich selbst. Deshalb braucht es eine Macht, die Vertragsbruch bestraft: den Souverän mit dem Gewaltmonopol."}, {"teil": "Exkurs", "nach": "Exkurs 5 „Das Gefangenendilemma“", "k": "4", "f": "Im Gefangenendilemma ist Defektieren für jeden Einzelnen die bessere Wahl, obwohl beide mit Kooperation besser dastünden. Wie löst Hobbes das Dilemma?", "a": [["Ein Souverän bestraft Vertragsbruch, sodass Kooperation für jeden zur rationalen Strategie wird.", 1], ["Weil sich dieselben Personen immer wieder treffen, lohnt sich Kooperation auch ohne Staat.", 0, "Axelrod", "Das ist der Einwand gegen Hobbes (Strategie „Wie du mir, so ich dir“, Robert Axelrod, 1984): Ordnung kann auch aus Gegenseitigkeit entstehen."], ["Die Vernunft erkennt die Naturgesetze, und schon diese Einsicht genügt, damit alle dauerhaft Frieden halten.", 0, null, null], ["Jeder verpflichtet sich im Gewissen, den anderen nicht auszunutzen, und vertraut ihm.", 0, null, null]], "e": "Kooperiert B, kann A ihn ausnutzen (sehr gut statt gut). Defektiert B, schützt sich A durch Defektieren (schlecht statt sehr schlecht). Weil beide so rechnen, defektieren beide und landen im schlechtesten kollektiven Ergebnis, dem Krieg aller gegen alle: individuell rational, kollektiv irrational. Der Souverän verändert die Auszahlungsmatrix. „Verträge ohne Schwert sind bloße Worte“ formuliert intuitiv, was die Spieltheorie erst 300 Jahre später formalisiert."}, {"teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Der Vertrag aller mit allen“", "f": "Wer schließt bei Hobbes den Gesellschaftsvertrag?", "a": [["Jeder mit jedem; der Souverän ist selbst keine Vertragspartei.", 1], ["Das Volk mit dem Herrscher, der sich im Gegenzug zum Schutz verpflichtet.", 0, null, "Gerade nicht: Der Souverän verspricht nichts. Deshalb kann er den Vertrag auch nicht brechen."], ["Jeder gibt sich ganz dem Gemeinwesen hin, das Volk als Ganzes wird souverän.", 0, "Rousseau", null], ["Der König mit Gott, der ihm die Herrschaft über das Volk überträgt.", 0, "Gottesgnadentum", null]], "e": "Die Menschen verzichten auf ihr schrankenloses Naturrecht, unter der Bedingung, dass alle anderen dasselbe tun. Indem sie einander versprechen, sich zu unterwerfen, autorisieren sie eine oberste Gewalt. Der Souverän kann ein Monarch oder eine Versammlung sein; wichtig ist nur, dass er verbindliche Regeln setzen und durchsetzen kann. Er erhält das Gewaltmonopol."}, {"teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Das Titelbild des Leviathan“", "f": "Auf dem Titelbild des Leviathan hält der Riese ein Schwert und einen Bischofsstab. Wofür steht das?", "a": [["Weltliche und geistliche Macht sind in der Hand des Souveräns vereint.", 1], ["Der König teilt sich die Macht mit der Kirche, die ihn kontrolliert.", 0, null, "Auch Kirche, Mitra und Konzil auf der rechten Bildleiste unterstehen dem Staat. Die Macht des Souveräns ist ungeteilt."], ["Das Schwert steht für die Exekutive, der Bischofsstab für die Judikative.", 0, null, null], ["Der Herrscher ist von Gott eingesetzt, wie es das Gottesgnadentum lehrt.", 0, "Gottesgnadentum", "Hobbes lässt das Gottesgnadentum gerade nicht gelten: Der Staat ist ein künstliches Werk der Menschen."]], "e": "Der Körper des Riesen besteht aus unzähligen kleinen Figuren, den Bürgern: Der Staat ist ein „künstlicher Körper“, von den Menschen selbst geschaffen. Die linke Bildleiste zeigt Burg, Krone, Kanonen und Schlacht, die rechte Kirche, Mitra, Bannstrahl und Konzil. Das Motto aus dem Buch Hiob lautet: „Keine Macht auf Erden ist mit ihm zu vergleichen.“ Hobbes nennt den Leviathan auch den „sterblichen Gott“."}, {"teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Die Grenze des Gehorsams“", "f": "Wann endet bei Hobbes die Gehorsamspflicht der Bürger?", "a": [["Wenn der Souverän die Bürger nicht mehr schützt; das Recht auf Selbsterhaltung bleibt immer.", 1], ["Wenn die Regierung nach einer langen Kette von Missbräuchen das Vertrauen gebrochen hat.", 0, "Locke", "Das ist Lockes Widerstandsrecht. Bei Hobbes gibt es kein Recht auf Widerstand, solange der Souverän schützt."], ["Wenn die Mehrheit der Bürger in einer freien Abstimmung gegen ein neues Gesetz des Souveräns gestimmt hat.", 0, null, null], ["Nie, auch nicht, wenn der Souverän befiehlt, sich widerstandslos töten zu lassen.", 0, null, "Niemand muss sich selbst töten oder sich widerstandslos töten lassen, auch nicht auf Befehl des Souveräns (Kap. 21)."]], "e": "Der Souverän ist nur für Schutz und Sicherheit der Bürger autorisiert. Erfüllt er diese Aufgabe nicht mehr, fällt das Naturrecht an die Einzelnen zurück. Ein Widerstandsrecht wie bei Locke gibt es dagegen nicht: Die Bürger sind gleichsam die Autoren seiner Handlungen. Genau hier setzt Locke an: Wer schützt uns vor dem Leviathan?"}, {"typ": "offen", "teil": "Teil B · Vom Naturzustand zum Staat", "nach": "Teil B, Abschnitt „Ungeteilte Souveränität und Repräsentation“", "f": "Warum gibt es bei Hobbes kein Widerstandsrecht gegen den Souverän, und wo endet trotzdem die Gehorsamspflicht?", "m": "Den Vertrag schließen bei Hobbes nur die Bürger untereinander, jeder mit jedem. Der Souverän ist selbst keine Vertragspartei: Er hat niemandem etwas versprochen und kann den Vertrag deshalb auch nicht brechen. Die Bürger haben ihn autorisiert, in ihrem Namen zu handeln (Repräsentation); sie sind gleichsam die Autoren seiner Handlungen. Wer sich gegen ihn wendet, wendet sich also gegen Handlungen, die er selbst autorisiert hat. Außerdem ist seine Macht ungeteilt und nicht vertraglich begrenzt. Eine Grenze gibt es trotzdem: Der Souverän ist nur für Schutz und Sicherheit autorisiert. Schützt er die Bürger dauerhaft nicht mehr, endet die Gehorsamspflicht. Und das Recht auf Selbsterhaltung bleibt immer bestehen: Niemand muss sich widerstandslos töten lassen."}]}, {"id": "locke", "tf": "PP", "gruppe": "Vertragstheorien", "kapitel": "Locke - Über die Regierung", "titel": "Locke", "sub": "Herrschaft mit Grenzen", "kurse": ["4", "2"], "fragen": [{"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Wer schützt uns vor dem Löwen?“", "k": "4", "f": "Locke spottet: Man schütze sich vor Iltissen und Füchsen und lasse sich dann von einem Löwen fressen. Was meint er?", "a": [["Wer sich mit einem absoluten Herrscher vor kleinen Gefahren schützt, liefert sich ihm selbst aus.", 1], ["Gegen die Gefahren des Naturzustands hilft nur ein Herrscher, der stärker ist als alle anderen.", 0, "Hobbes", "Das ist eher Hobbes' Folgerung. Locke kritisiert gerade, dass gegen den übermächtigen Herrscher selbst kein Schutz bleibt."], ["Der Staat hat vor allem die Aufgabe, die Bürger vor wilden Tieren zu schützen.", 0, null, null], ["Kleine Staaten werden früher oder später immer von großen Staaten geschluckt.", 0, null, null]], "e": "Locke wendet sich gegen zwei Lösungen: Robert Filmer verteidigt das Gottesgnadentum, der König herrsche kraft göttlicher Einsetzung absolut. Hobbes meint, nur ein ungeteilter, unbeschränkter Souverän beende den Krieg aller gegen alle. Beide haben dasselbe Problem: Gegen den Herrscher selbst gibt es keinen Schutz (§93). Daraus entsteht Lockes Frage: Lässt sich Herrschaft so begründen, dass sie zugleich begrenzt ist?"}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Frei und gleich unter einem Gesetz der Natur“", "f": "Wie sieht der Naturzustand bei Locke aus?", "a": [["Die Menschen sind frei und gleich, aber an ein Gesetz der Natur gebunden, das die Vernunft erkennt.", 1], ["Ein Krieg eines jeden gegen jeden, in dem es weder Recht noch Unrecht gibt.", 0, "Hobbes", "Das ist Hobbes' Naturzustand. Für Locke ist der Naturzustand nicht von selbst ein Kriegszustand (§19)."], ["Ein friedliches, einfaches und genügsames Leben; der Mensch empfindet Mitleid, ist aber noch nicht moralisch.", 0, "Rousseau", null], ["Ein Zustand völliger Zügellosigkeit, in dem jeder ohne Schranken tun darf, was er will.", 0, null, "Freiheit ist bei Locke keine Zügellosigkeit. Schon vor dem Staat verpflichtet das Gesetz der Natur jeden."]], "e": "Niemand braucht die Erlaubnis eines anderen, niemand hat mehr Macht als ein anderer (§4). Das Gesetz der Natur lautet: „Niemand darf einem anderen schaden an Leben, Gesundheit, Freiheit oder Besitz.“ (§6) Locke begründet es theologisch: Alle Menschen sind Werk und Eigentum eines Schöpfers. Wer das Gesetz bricht, darf von jedem maßvoll bestraft werden. Es gibt also Recht und Unrecht schon vor dem Staat: Der Staat erschafft die Rechte nicht, er soll sie sichern."}, {"teil": "Teil A · Naturzustand", "nach": "Teil A, Abschnitt „Drei Mängel“", "f": "Was fehlt dem Naturzustand nach Locke?", "a": [["Ein festes, bekanntes Gesetz, ein unparteiischer Richter und eine vollstreckende Gewalt", 1], ["Die Sicherheit vor Konkurrenz, Misstrauen und Ruhmsucht unter den Menschen", 0, "Hobbes", "Das sind Hobbes' drei Konfliktursachen. Sie erklären, warum Menschen kämpfen, nicht welche Einrichtungen fehlen."], ["Ein Recht auf Leben, Freiheit und Besitz, das erst der Staat durch seine Gesetze erschaffen muss", 0, null, "Diese Rechte gibt es bei Locke schon im Naturzustand. Es fehlt nur ihre Sicherung."], ["Ein König, eine Staatskirche und ein stehendes Heer zur Verteidigung", 0, null, null]], "e": "Das Naturrecht gilt zwar, aber es ist nicht kodifiziert, und jeder legt es zu seinen Gunsten aus. Es gibt kein neutrales Organ: Jeder ist Richter in eigener Sache, und wer verletzt wurde, straft im Zorn oft zu hart. Selbst ein gerechtes Urteil bleibt wirkungslos, wenn niemand es vollstrecken kann; wer im Recht ist, ist nicht immer der Stärkere. Der Naturzustand ist also kein Chaos, aber ein unsicherer Rechtszustand."}, {"teil": "Teil B · Eigentum", "nach": "Teil B, Abschnitt „Leben, Freiheit, Besitz“", "f": "Der Staat dient nach Locke der „Erhaltung des Eigentums“. Was meint er mit Eigentum (property)?", "a": [["Leben, Freiheit und Besitz", 1], ["Nur Grund und Boden", 0, null, null], ["Alles, was man erlangen und behaupten kann", 0, "Hobbes", "So beschreibt Hobbes den Naturzustand ohne festes „Mein und Dein“. Für Locke ist Eigentum ein Recht, das schon vor dem Staat besteht."], ["Das, was der Staat jedem zuteilt", 0, null, null]], "e": "Property ist bei Locke eine umfassende Kategorie: Eigentum = Leben + Freiheit + Besitz. Jeder Mensch hat ein Eigentum an seiner Person, also auch an seiner Arbeit (§27). Wenn Locke sagt, die Menschen schließen sich zur Erhaltung ihres Eigentums zusammen, meint er also nicht nur Besitz, sondern auch ihr Leben und ihre Freiheit."}, {"teil": "Teil B · Eigentum", "nach": "Teil B, Abschnitt „Arbeit schafft Eigentum“", "k": "4", "f": "Nach Locke gehören die Äpfel dem, der sie aufsammelt. Auf welche Grundannahme stützt er das?", "a": [["Jeder hat ein Eigentum an seiner Person, also auch an seiner Arbeit.", 1], ["Jedem gehört, was er erlangen kann, solange er es zu behaupten vermag.", 0, "Hobbes", "Das gilt bei Hobbes im Naturzustand und ist gerade kein gesichertes Recht. Locke begründet Eigentum durch Arbeit."], ["Eigentum entsteht erst, wenn alle anderen der Aneignung zustimmen.", 0, null, "Locke betont: Wer seine Arbeit mit etwas aus der Natur „mischt“, macht es zu seinem Eigentum, ohne Zustimmung der anderen."], ["Die Früchte der Natur gehören dem König, der sie an die Untertanen verteilt.", 0, null, null]], "e": "Wer seine Arbeit mit etwas aus der Natur „mischt“, macht es zu seinem Eigentum (§27-28): Wer den Acker pflügt, hat ein Anrecht auf seine Früchte. Eigentum ist also eine Verlängerung der Persönlichkeit. Allerdings bindet Locke die Aneignung an zwei Grenzen: nur so viel, wie man nutzen kann, bevor es verdirbt, und für andere muss „genug und ebenso Gutes“ übrig bleiben."}, {"teil": "Teil B · Eigentum", "nach": "Teil B, Abschnitt „Grenzen der Aneignung und d

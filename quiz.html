smus"}, {"tf": "AN", "t": "Das Leben hat keinen objektiven, vorgegebenen Sinn. Es gibt keine unveränderlichen Werte oder Wahrheiten. …: \"Gott ist tot\" - mit dem Verlust des religiösen Weltbildes verlieren traditionelle Werte ihre Grundlage.", "r": "Nihilismus", "f": "Existenzialismus (Sartre)", "rid": "term_nihilismus", "w": "Sartre sieht die Möglichkeit, sich selbst Sinn zu geben; echter Nihilismus verneint auch das.", "ws": "Nihilismus"}, {"tf": "AN", "t": "\"Die Existenz geht der Essenz voraus\" - … kehrt den Essentialismus um: Der Mensch existiert zuerst, ohne vorgegebenen Zweck oder Wesen, und erschafft sich durch seine Entscheidungen selbst.", "r": "Existenzialismus (Sartre)", "f": "Sozialer Konstruktivismus", "rid": "term_existentialismus_sartre", "w": "Sartre betont individuelle Freiheit; der Konstruktivismus betont soziale Strukturen als prägend.", "ws": "Sozialer Konstruktivismus"}, {"tf": "AN", "t": "Was als \"Menschennatur\" gilt, ist nicht naturgegeben, sondern … und kulturell konstruiert. Identität, Geschlecht, Werte - das sind … Konstruktionen, keine naturgegebenen Tatsachen.", "r": "Sozialer Konstruktivismus", "f": "Existenzialismus (Sartre)", "rid": "term_sozialer_konstruktivismus", "w": "Sartre betont individuelle Freiheit; der Konstruktivismus betont soziale Strukturen als prägend.", "ws": "Sozialer Konstruktivismus"}, {"tf": "ET", "t": "Ein … ist eine planmäßig hergestellte Situation, in der man Bedingungen gezielt herbeiführt und verändert, um eine Hypothese zu prüfen.", "r": "Experiment", "f": "Gedankenexperiment", "rid": "term_experiment", "w": "Es wird nur im Denken durchgespielt, nicht in der Wirklichkeit.", "ws": "Experiment"}, {"tf": "ET", "t": "Ein rein gedanklich durchgeführtes …, das eine hypothetische Situation konstruiert, um philosophische Thesen zu prüfen oder Intuitionen sichtbar zu machen - ohne real durchgeführt zu werden.", "r": "Gedankenexperiment", "f": "Experiment", "rid": "term_gedankenexperiment", "w": "Es wird nur im Denken durchgespielt, nicht in der Wirklichkeit.", "ws": "Experiment"}, {"tf": "ET", "t": "… ist eine Theorie, wenn sich eine Beobachtung denken lässt, die ihr widerspricht. Für … ist das die Lösung des Abgrenzungsproblems: Wissenschaftlich ist, was an der Erfahrung scheitern kann.", "r": "Falsifikation / Falsifizierbarkeit", "f": "Verifikation / Sinnkriterium (Wiener Kreis)", "rid": "term_falsifikation", "w": "Der Wiener Kreis machte Prüfbarkeit zum Kriterium für den Sinn eines Satzes. Popper trennt nur Wissenschaft von Nicht-Wissenschaft; Metaphysik ist für ihn nicht sinnlos, nur nicht empirisch.", "ws": "Falsifikation / Falsifizierbarkeit"}, {"tf": "ET", "t": "Der … um Moritz Schlick und Rudolf Carnap (logischer Empirismus, 1920er-Jahre) wollte eine Wissenschaft ohne Metaphysik.", "r": "Verifikation / Sinnkriterium (Wiener Kreis)", "f": "Falsifikation / Falsifizierbarkeit", "rid": "term_verifikation_sinnkriterium", "w": "Der Wiener Kreis machte Prüfbarkeit zum Kriterium für den Sinn eines Satzes. Popper trennt nur Wissenschaft von Nicht-Wissenschaft; Metaphysik ist für ihn nicht sinnlos, nur nicht empirisch.", "ws": "Falsifikation / Falsifizierbarkeit"}, {"tf": "EH", "t": "… bezeichnet eine Ethik, die auch die räumlich, zeitlich oder sozial entfernten Folgen unseres Handelns moralisch in den Blick nimmt - die Auswirkungen auf kommende Generationen, ferne Länder, die Natur insgesamt.", "r": "Fernethik", "f": "Nahethik", "rid": "term_fernethik", "w": "Die Nahethik regelt Beziehungen unter Anwesenden (Familie, Mitbürger); die Fernethik dehnt moralische Pflicht auf Menschen aus, denen wir nie begegnen werden - auch auf noch nicht existierende Generationen.", "ws": "Fernethik"}, {"tf": "EH", "t": "… bezeichnet die klassische Form moralischen Handelns, die sich an überschaubaren, unmittelbaren Beziehungen orientiert - gegenüber Familie, Nachbarn, Freunden, Mitbürgern.", "r": "Nahethik", "f": "Fernethik", "rid": "term_nahethik", "w": "Die Nahethik regelt Beziehungen unter Anwesenden (Familie, Mitbürger); die Fernethik dehnt moralische Pflicht auf Menschen aus, denen wir nie begegnen werden - auch auf noch nicht existierende Generationen.", "ws": "Fernethik"}, {"tf": "ET", "t": "Ein … ist bei … der gemeinsame Rahmen einer wissenschaftlichen Gemeinschaft: welche Fragen sinnvoll sind, welche Methoden gelten und was als Lösung zählt. Vorher streiten viele Schulen über Grundfragen, und jede beginnt von vorn, wie die Optik vor Newton.", "r": "Paradigma (Kuhn)", "f": "Forschungsprogramm (Lakatos)", "rid": "term_paradigma_kuhn", "w": "Wie Kuhn sieht Lakatos, dass Forschende an ihrem Kern festhalten, aber er gibt ein rationales Kriterium für den Wechsel. Ob ein Programm degeneriert, weiß man allerdings oft erst im Nachhinein.", "ws": "Forschungsprogramm (Lakatos)"}, {"tf": "PP", "t": "Der Mensch ist von Natur aus gut - Gesellschaft und Privateigentum haben ihn korrumpiert. Legitime politische Ordnung ist nur möglich, wenn die Bürger Träger der Macht bleiben.", "r": "Gemeinwille / volonté générale (Rousseau)", "f": "Leviathan (Hobbes)", "rid": "term_gemeinwille_volont_g_n_rale_rousseau", "w": "Keine Unterwerfung, sondern Selbstgesetzgebung.", "ws": "Gemeinwille / volonté générale (Rousseau)"}, {"tf": "PP", "t": "Ohne starken Staat herrscht der \"Krieg aller gegen alle\" (bellum omnium contra omnes) im Naturzustand. Das Leben ist \"einsam, arm, ekelhaft, brutal und kurz.\" Aus Vernunft schließen Menschen einen Gesellschaftsvertrag und unterwerfen sich einem absoluten Souverän.", "r": "Leviathan (Hobbes)", "f": "Gemeinwille / volonté générale (Rousseau)", "rid": "term_leviathan_hobbes", "w": "Keine Unterwerfung, sondern Selbstgesetzgebung.", "ws": "Gemeinwille / volonté générale (Rousseau)"}, {"tf": "PP", "t": "Der Mensch ist von Natur aus gut - Gesellschaft und Privateigentum haben ihn korrumpiert. Legitime politische Ordnung ist nur möglich, wenn die Bürger Träger der Macht bleiben.", "r": "Gemeinwille / volonté générale (Rousseau)", "f": "Liberaler Staat (Locke)", "rid": "term_gemeinwille_volont_g_n_rale_rousseau", "w": "Rousseau misstraut dem Privateigentum; Locke schützt es. Kritik: Der Gemeinwille kann in Zwang gegenüber Minderheiten umschlagen.", "ws": "Gemeinwille / volonté générale (Rousseau)"}, {"tf": "PP", "t": "Der Mensch hat im Naturzustand von Natur aus Rechte auf Leben, Freiheit und Eigentum. Der Staat dient dem Schutz dieser Rechte - missbraucht er sie, hat das Volk das Widerstandsrecht.", "r": "Liberaler Staat (Locke)", "f": "Gemeinwille / volonté générale (Rousseau)", "rid": "term_liberaler_staat_locke", "w": "Rousseau misstraut dem Privateigentum; Locke schützt es. Kritik: Der Gemeinwille kann in Zwang gegenüber Minderheiten umschlagen.", "ws": "Gemeinwille / volonté générale (Rousseau)"}, {"tf": "ET", "t": "… ist eine tiefere, langfristige Überzeugung - stärker als Meinung (doxa), aber noch kein …. Im religiösen Sinne ist er mit höchster subjektiver Gewissheit verbunden: Menschen waren bereit, für ihren Glauben zu sterben - für eine bloße Meinung setzt niemand sein Leben ein.", "r": "Glaube (belief / faith)", "f": "Wissen", "rid": "term_glaube_belief_faith", "w": "Glaube bedarf keiner rationalen Begründung.", "ws": "Glaube (belief / faith)"}, {"tf": "ET", "t": "… ist mehr als ein starkes Gefühl oder eine feste Überzeugung. Philosophisch setzt es drei Dinge voraus: Die Aussage muss wahr sein, man muss sie für wahr halten und man muss sie begründen können.", "r": "Wissen", "f": "Glaube (belief / faith)", "rid": "term_wissen", "w": "Glaube bedarf keiner rationalen Begründung.", "ws": "Glaube (belief / faith)"}, {"tf": "EH", "t": "Die äußere Freiheit: tun können, was man will, ohne durch äußere Hindernisse oder Zwang daran gehindert zu werden. Wer im Gefängnis sitzt, hat keine …, auch wenn er weiterhin wollen kann, was er will.", "r": "Handlungsfreiheit", "f": "Willensfreiheit", "rid": "term_handlungsfreiheit", "w": "Handlungsfreiheit heißt, tun zu können, was man will; Willensfreiheit heißt, auch anders wollen zu können. Der Determinismus bestreitet nur die Willensfreiheit, nicht die Handlungsfreiheit. Negative Freiheit entspricht weitgehend der Handlungsfreiheit.", "ws": "Handlungsfreiheit"}, {"tf": "EH", "t": "Die innere Freiheit: auch anders wollen können, also unter denselben Bedingungen zwischen Alternativen wählen und den eigenen Willen selbst bestimmen. Sie gilt als Voraussetzung für moralische Verantwortung: Nur wer auch anders hätte handeln können, kann gelobt oder getadelt werden.", "r": "Willensfreiheit", "f": "Handlungsfreiheit", "rid": "term_willensfreiheit", "w": "Handlungsfreiheit heißt, tun zu können, was man will; Willensfreiheit heißt, auch anders wollen zu können. Der Determinismus bestreitet nur die Willensfreiheit, nicht die Handlungsfreiheit. Negative Freiheit entspricht weitgehend der Handlungsfreiheit.", "ws": "Handlungsfreiheit"}, {"tf": "EH", "t": "Für … ist Lust das höchste Gut - aber nicht im Sinne maßlosen Genusses. Echtes Glück besteht in Ataraxie (innere Seelenruhe) und Aponie (Freiheit von körperlichem Schmerz).", "r": "Hedonismus (Epikur)", "f": "Stoa / Stoizismus", "rid": "term_hedonismus_epikur", "w": "Epikur flieht in den privaten Rückzug; die Stoa betont aktive Beteiligung am öffentlichen Leben.", "ws": "Stoa / Stoizismus"}, {"tf": "EH", "t": "Das gute Leben besteht in der Tugendethik und der Beherrschung der eigenen Reaktionen. Zentrale Unterscheidung (Eph’ hemin): Was liegt in unserer Macht? - Urteile, Reaktionen, Handlungen.", "r": "Stoa / Stoizismus", "f": "Hedonismus (Epikur)", "rid": "term_stoa_stoizismus", "w": "Epikur flieht in den privaten Rückzug; die Stoa betont aktive Beteiligung am öffentlichen Leben.", "ws": "Stoa / Stoizismus"}, {"tf": "EH", "t": "… Versuch, Lust und Schmerz messbar und vergleichbar zu machen. Das … bewertet jede Lust nach sieben Kriterien: Intensität, Dauer, Gewissheit, Nähe, Fruchtbarkeit (erzeugt sie weitere Lüste?), Reinheit (führt sie zu Schmerz?) und Reichweite (wie viele sind betroffen?).", "r": "Hedonistisches Kalkül (Bentham)", "f": "Qualitativer Utilitarismus (Mill)", "rid": "term_hedonistisches_kalkuel_bentham", "w": "Mill kritisiert das Kalkül als zu simpel - es zählt nur Quantität, nicht Qualität. \"Besser ein unzufriedener Sokrates als ein zufriedenes Schwein.\"", "ws": "Hedonistisches Kalkül (Bentham)"}, {"tf": "EH", "t": "… übernimmt …, differenziert aber: Es gibt höhere (geistige) und niedere (körperliche) Freuden. Qualität, nicht nur Quantität der Lust zählt. Die einzige Möglichkeit, die Qualität von Freuden zu beurteilen: Menschen, die beide kennen, bevorzugen geistige Freuden.", "r": "Qualitativer Utilitarismus (Mill)", "f": "Hedonistisches Kalkül (Bentham)", "rid": "term_qualitativer_utilitarismus_mill", "w": "Mill kritisiert das Kalkül als zu simpel - es zählt nur Quantität, nicht Qualität. \"Besser ein unzufriedener Sokrates als ein zufriedenes Schwein.\"", "ws": "Hedonistisches Kalkül (Bentham)"}, {"tf": "EH", "t": "Lust ist das einzige Gut, Schmerz das einzige Übel. Alle Lüste sind gleich wertvoll - nur Menge und Intensität zählen.", "r": "Hedonistisches Prinzip / Hedone-Kalkül (Bentham)", "f": "Qualitativer Utilitarismus (Mill)", "rid": "term_hedonistisches_prinzip_hedone_kalkuel_bentham", "w": "Mill kritisierte das als zu simpel - nicht alle Freuden sind gleich. \"Besser ein unzufriedener Sokrates als ein zufriedenes Schwein.\"", "ws": "Hedonistisches Prinzip / Hedone-Kalkül (Bentham)"}, {"tf": "EH", "t": "… übernimmt …, differenziert aber: Es gibt höhere (geistige) und niedere (körperliche) Freuden. Qualität, nicht nur Quantität der Lust zählt. Die einzige Möglichkeit, die Qualität von Freuden zu beurteilen: Menschen, die beide kennen, bevorzugen geistige Freuden.", "r": "Qualitativer Utilitarismus (Mill)", "f": "Hedonistisches Prinzip / Hedone-Kalkül (Bentham)", "rid": "term_qualitativer_utilitarismus_mill", "w": "Mill kritisierte das als zu simpel - nicht alle Freuden sind gleich. \"Besser ein unzufriedener Sokrates als ein zufriedenes Schwein.\"", "ws": "Hedonistisches Prinzip / Hedone-Kalkül (Bentham)"}, {"tf": "AN", "t": "Der … ist ein Modell des Menschen aus der Wirtschaftstheorie: Der Mensch handelt als rationaler Nutzenmaximierer, der alle verfügbaren Informationen nutzt, Kosten und Nutzen abwägt und stets die für sich vorteilhafteste Entscheidung trifft.", "r": "Homo oeconomicus", "f": "Homo faber", "rid": "term_homo_economicus", "w": "Dieser definiert den Menschen durch Werkzeuggebrauch und Gestaltungswillen; der Homo oeconomicus durch rationales Kalkül.", "ws": "Homo oeconomicus"}, {"tf": "AN", "t": "Der Mensch als Hersteller (lat. faber, Handwerker). Er stellt Werkzeuge her und gestaltet damit die Natur um; … nannte ihn ein \"tool making animal\".", "r": "Homo faber", "f": "Homo oeconomicus", "rid": "term_homo_faber", "w": "Dieser definiert den Menschen durch Werkzeuggebrauch und Gestaltungswillen; der Homo oeconomicus durch rationales Kalkül.", "ws": "Homo oeconomicus"}, {"tf": "AN", "t": "Der Mensch als Hersteller (lat. faber, Handwerker). Er stellt Werkzeuge her und gestaltet damit die Natur um; … nannte ihn ein \"tool making animal\".", "r": "Homo faber", "f": "Vita activa (Arendt)", "rid": "term_homo_faber", "w": "Homo faber ist nur eine der drei Tätigkeiten, nicht der ganze Mensch.", "ws": "Vita activa (Arendt)"}, {"tf": "AN", "t": "… unterscheidet drei Grundtätigkeiten des Menschen. Arbeiten dient dem Überleben: Was erarbeitet wird, wird verbraucht, am nächsten Tag beginnt alles von vorn (Animal laborans).", "r": "Vita activa (Arendt)", "f": "Homo faber", "rid": "term_vita_activa_arendt", "w": "Homo faber ist nur eine der drei Tätigkeiten, nicht der ganze Mensch.", "ws": "Vita activa (Arendt)"}, {"tf": "ET", "t": "Eine vorläufige, noch nicht bestätigte Annahme über einen Sachverhalt, die durch Beobachtung, Experiment oder Test überprüft werden kann. … sind der Ausgangspunkt wissenschaftlicher Erkenntnis - sie müssen so formuliert sein, dass sie sich grundsätzlich widerlegen lassen.", "r": "Hypothese", "f": "Theorie", "rid": "term_hypothese", "w": "Eine Theorie ist ein System bewährter, zusammenhängender Hypothesen; die einzelne Hypothese ist noch ungeprüft.", "ws": "Hypothese"}, {"tf": "ET", "t": "Ein zusammenhängendes System von Aussagen, das Phänomene erklärt und Vorhersagen ermöglicht.", "r": "Theorie", "f": "Hypothese", "rid": "term_theorie", "w": "Eine Theorie ist ein System bewährter, zusammenhängender Hypothesen; die einzelne Hypothese ist noch ungeprüft.", "ws": "Hypothese"}, {"tf": "EH", "t": "Das oberste Moralprinzip in … Deontologie / Pflichtethik: \"Handle nur nach derjenigen Maxime, durch die du zugleich wollen kannst, dass sie ein allgemeines Gesetz werde.\" Im Unterschied zu hypothetischen … (\"Wenn du X willst, tue Y\") gilt er unbedingt und ohne Ausnahme.", "r": "Kategorischer Imperativ", "f": "Utilitarismus", "rid": "term_kategorischer_imperativ", "w": "Moral hängt nicht von Folgen ab.", "ws": "Kategorischer Imperativ"}, {"tf": "EH", "t": "Der … ist eine Konsequentialismus Ethik: Eine Handlung ist genau dann richtig, wenn ihre Folgen das Wohlergehen aller Betroffenen maximieren. Alle Betroffenen zählen gleich - Eigeninteresse genießt keinen Vorrang.", "r": "Utilitarismus", "f": "Kategorischer Imperativ", "rid": "term_utilitarismus", "w": "Moral hängt nicht von Folgen ab.", "ws": "Kategorischer Imperativ"}, {"tf": "ET", "t": "Die … besagt, dass eine Aussage nicht durch ihren Abgleich mit der Wirklichkeit wahr wird, sondern dadurch, dass sie sich widerspruchsfrei in ein bestehendes System von Überzeugungen einfügt.", "r": "Kohärenztheorie", "f": "Korrespondenztheorie", "rid": "term_kohaerenztheorie", "w": "Die Korrespondenztheorie prüft Aussagen an der Wirklichkeit, die Kohärenztheorie nur am übrigen Überzeugungssystem - ein in sich stimmiges, aber realitätsfernes System könnte danach als «wahr» gelten.", "ws": "Kohärenztheorie"}, {"tf": "ET", "t": "Die … besagt, dass eine Aussage genau dann wahr ist, wenn sie mit der Wirklichkeit übereinstimmt - wenn also das, was sie behauptet, tatsächlich der Fall ist. Sie gilt als die klassische und intuitivste Wahrheitstheorie: „Es regnet“ ist wahr, wenn es tatsächlich regnet.", "r": "Korrespondenztheorie", "f": "Kohärenztheorie", "rid": "term_korrespondenztheorie", "w": "Die Korrespondenztheorie prüft Aussagen an der Wirklichkeit, die Kohärenztheorie nur am übrigen Überzeugungssystem - ein in sich stimmiges, aber realitätsfernes System könnte danach als «wahr» gelten.", "ws": "Kohärenztheorie"}, {"tf": "EH", "t": "Freiheit und Determinismus schließen sich nicht aus: Frei handeln bedeutet, gemäß den eigenen Wünschen und Gründen zu handeln - ohne äußeren Zwang. Selbst wenn alles kausal bestimmt ist, können Handlungen trotzdem frei sein.", "r": "Kompatibilismus", "f": "Libertarismus (Freiheitsdebatte)", "rid": "term_kompatibilismus", "w": "Dieser bejaht echte Alternativen, lehnt aber Determinismus ab. Kritik: Der Freiheitsbegriff des Kompatibilismus ist so schwach, dass er kaum moralische Verantwortung tragen kann.", "ws": "Kompatibilismus"}, {"tf": "EH", "t": "Der Wille ist frei, weil nicht alles festgelegt ist: Unter genau denselben Bedingungen hätte der Mensch auch anders handeln können. Der Determinismus ist demnach falsch. Vertreter: …, Chisholm, Kane, van Inwagen.", "r": "Libertarismus (Freiheitsdebatte)", "f": "Kompatibilismus", "rid": "term_libertarismus_freiheitsdebatte", "w": "Dieser bejaht echte Alternativen, lehnt aber Determinismus ab. Kritik: Der Freiheitsbegriff des Kompatibilismus ist so schwach, dass er kaum moralische Verantwortung tragen kann.", "ws": "Kompatibilismus"}, {"tf": "ET", "t": "Die … oder … definiert Wahrheit als das, worauf sich alle Betroffenen unter idealen Diskursbedingungen - frei von Zwang, mit gleichem Rederecht und nur durch das «bessere Argument» überzeugt - einigen würden.", "r": "Konsens-/Diskurstheorie", "f": "Korrespondenztheorie", "rid": "term_konsens_diskurstheorie", "w": "Die Korrespondenztheorie misst Aussagen an einer objektiven Wirklichkeit, die Konsenstheorie am Ergebnis eines idealen Gesprächs unter Gleichen.", "ws": "Konsens-/Diskurstheorie"}, {"tf": "ET", "t": "Die … besagt, dass eine Aussage genau dann wahr ist, wenn sie mit der Wirklichkeit übereinstimmt - wenn also das, was sie behauptet, tatsächlich der Fall ist. Sie gilt als die klassische und intuitivste Wahrheitstheorie: „Es regnet“ ist wahr, wenn es tatsächlich regnet.", "r": "Korrespondenztheorie", "f": "Konsens-/Diskurstheorie", "rid": "term_korrespondenztheorie", "w": "Die Korrespondenztheorie misst Aussagen an einer objektiven Wirklichkeit, die Konsenstheorie am Ergebnis eines idealen Gesprächs unter Gleichen.", "ws": "Konsens-/Diskurstheorie"}, {"tf": "EH", "t": "Handlungen werden ausschließlich nach ihren Konsequenzen (Folgen) beurteilt. Motive, Absichten oder Regeln spielen keine eigenständige moralische Rolle. Utilitarismus ist die prominenteste Form des ….", "r": "Konsequentialismus", "f": "Tugendethik", "rid": "term_konsequentialismus", "w": "Diese fragt nach dem Charakter des Handelnden.", "ws": "Konsequentialismus"}, {"tf": "EH", "t": "Nicht \"Was soll ich tun?\", sondern \"Was für ein Mensch soll ich sein?\" ist die zentrale Frage. Tugenden sind Charaktereigenschaften wie Mut, Gerechtigkeit, Klugheit - sie entstehen durch Übung und Gewohnheit, nicht durch einmaliges Nachdenken.", "r": "Tugendethik", "f": "Konsequentialismus", "rid": "term_tugendethik", "w": "Diese fragt nach dem Charakter des Handelnden.", "ws": "Konsequentialismus"}, {"tf": "ET", "t": "Die … besagt, dass eine Aussage genau dann wahr ist, wenn sie mit der Wirklichkeit übereinstimmt - wenn also das, was sie behauptet, tatsächlich der Fall ist. Sie gilt als die klassische und intuitivste …: „Es regnet“ ist wahr, wenn es tatsächlich regnet.", "r": "Korrespondenztheorie", "f": "Pragmatische Wahrheitstheorie", "rid": "term_korrespondenztheorie", "w": "Die Korrespondenztheorie fragt, ob eine Aussage der Wirklichkeit entspricht; die pragmatische Theorie fragt, ob sie sich im praktischen Gebrauch bewährt - beides kann auseinanderfallen.", "ws": "Pragmatische Wahrheitstheorie"}, {"tf": "ET", "t": "Die … bemisst Wahrheit nicht an der Übereinstimmung mit der Wirklichkeit, sondern daran, ob sich eine Überzeugung in der Praxis bewährt - ob sie sich als nützlich, handlungsleitend und langfristig erfolgreich erweist.", "r": "Pragmatische Wahrheitstheorie", "f": "Korrespondenztheorie", "rid": "term_pragmatische_wahrheitstheorie", "w": "Die Korrespondenztheorie fragt, ob eine Aussage der Wirklichkeit entspricht; die pragmatische Theorie fragt, ob sie sich im praktischen Gebrauch bewährt - beides kann auseinanderfallen.", "ws": "Pragmatische Wahrheitstheorie"}, {"tf": "ET", "t": "… ist der Versuch, zwischen … und Empirismus zu vermitteln: Alle Erkenntnis fängt mit der Erfahrung an, aber nicht alle entspringt aus ihr. Den Stoff liefern die Sinne, die Form bringen wir mit: die Anschauungsformen (Raum, Zeit) und die Kategorien des Verstandes (z. B. Kausalität).", "r": "Kritizismus (Kant)", "f": "Rationalismus", "rid": "term_kritizismus_kant", "w": "Denken ohne Anschauung erkennt nichts; über Gott, Seele und die Welt als Ganzes gibt es kein theoretisches Wissen.", "ws": "Kritizismus (Kant)"}, {"tf": "ET", "t": "Der … ist die erkenntnistheoretische Position, nach der Vernunft - nicht Sinneserfahrung - die primäre und verlässliche Quelle der Wahrheit ist. Sinneswahrnehmungen gelten als trügerisch (→ Traumargument); wahres Wissen entsteht durch klares und deutliches Denken allein.", "r": "Rationalismus", "f": "Kritizismus (Kant)", "rid": "term_rationalismus", "w": "Denken ohne Anschauung erkennt nichts; über Gott, Seele und die Welt als Ganzes gibt es kein theoretisches Wissen.", "ws": "Kritizismus (Kant)"}, {"tf": "PP", "t": "Die Übereinstimmung mit geltendem Recht. Etwas ist …, wenn es den Gesetzen entspricht - unabhängig davon, ob es moralisch richtig ist. Positives Recht ist nach dem Rechtspositivismus Recht, weil es Recht ist - nicht weil es gut ist.", "r": "Legalität", "f": "Legitimität", "rid": "term_legalitaet", "w": "Legalität ist das formale Kriterium; Legitimität das moralische.", "ws": "Legalität"}, {"tf": "PP", "t": "Die moralische Berechtigung einer Herrschaft oder Ordnung.", "r": "Legitimität", "f": "Legalität", "rid": "term_legitimitaet", "w": "Legalität ist das formale Kriterium; Legitimität das moralische.", "ws": "Legalität"}, {"tf": "PP", "t": "Ohne starken Staat herrscht der \"Krieg aller gegen alle\" (bellum omnium contra omnes) im Naturzustand. Das Leben ist \"einsam, arm, ekelhaft, brutal und kurz.\" Aus Vernunft schließen Menschen einen Gesellschaftsvertrag und unterwerfen sich einem absoluten Souverän.", "r": "Leviathan (Hobbes)", "f": "Liberaler Staat (Locke)", "rid": "term_leviathan_hobbes", "w": "Rechte bestehen vor dem Staat; die Regierung erhält Macht nur als Treuhand, daher Widerstandsrecht.", "ws": "Liberaler Staat (Locke)"}, {"tf": "PP", "t": "Der Mensch hat im Naturzustand von Natur aus Rechte auf Leben, Freiheit und Eigentum. Der Staat dient dem Schutz dieser Rechte - missbraucht er sie, hat das Volk das Widerstandsrecht.", "r": "Liberaler Staat (Locke)", "f": "Leviathan (Hobbes)", "rid": "term_liberaler_staat_locke", "w": "Rechte bestehen vor dem Staat; die Regierung erhält Macht nur als Treuhand, daher Widerstandsrecht.", "ws": "Liberaler Staat (Locke)"}, {"tf": "PP", "t": "… definiert Macht als die Chance, den eigenen Willen auch gegen den Widerstand anderer durchzusetzen. Sie wird stabil und effizient, wenn sie als legitim anerkannt wird (Herrschaft).", "r": "Macht als Durchsetzungsfähigkeit (Max Weber)", "f": "Macht als Herrschaftsinstrument (Machiavelli)", "rid": "term_macht_als_durchsetzungsfaehigkeit_max_weber", "w": "Weber denkt Macht normativ als Legitimitätsfrage; Machiavelli rein strategisch.", "ws": "Macht als Durchsetzungsfähigkeit (Max Weber)"}, {"tf": "PP", "t": "… (1469-1527) analysiert politische Macht pragmatisch: Der Herrscher muss den Staat stabilisieren und erhalten, notfalls mit Gewalt, Täuschung und List. Moral ist der Politik nachgeordnet - der Zweck heiligt die Mittel, wenn der politische Zweck es erfordert.", "r": "Macht als Herrschaftsinstrument (Machiavelli)", "f": "Macht als Durchsetzungsfähigkeit (Max Weber)", "rid": "term_macht_als_herrschaftsinstrument_machiavelli", "w": "Weber denkt Macht normativ als Legitimitätsfrage; Machiavelli rein strategisch.", "ws": "Macht als Durchsetzungsfähigkeit (Max Weber)"}, {"tf": "PP", "t": "… definiert Macht als die Chance, den eigenen Willen auch gegen den Widerstand anderer durchzusetzen. Sie wird stabil und effizient, wenn sie als legitim anerkannt wird (Herrschaft).", "r": "Macht als Durchsetzungsfähigkeit (Max Weber)", "f": "Macht als kollektives Handeln (Hannah Arendt)", "rid": "term_macht_als_durchsetzungsfaehigkeit_max_weber", "w": "Weber sieht Macht als Durchsetzungsvermögen; Arendt als gewaltfreie kollektive Schöpfung.", "ws": "Macht als Durchsetzungsfähigkeit (Max Weber)"}, {"tf": "PP", "t": "… unterscheidet radikal zwischen Macht und Gewalt: Echte Macht entsteht nur durch das gemeinsame … von Menschen. Sie kann nicht von einer Einzelperson \"besessen\" werden. Gewalt ist das Gegenteil von Macht - sie wird eingesetzt, wenn Macht bereits zerfallen ist.", "r": "Macht als kollektives Handeln (Hannah Arendt)", "f": "Macht als Durchsetzungsfähigkeit (Max Weber)", "rid": "term_macht_als_kollektives_handeln_hannah_arendt", "w": "Weber sieht Macht als Durchsetzungsvermögen; Arendt als gewaltfreie kollektive Schöpfung.", "ws": "Macht als Durchsetzungsfähigkeit (Max Weber)"}, {"tf": "PP", "t": "… (1469-1527) analysiert politische Macht pragmatisch: Der Herrscher muss den Staat stabilisieren und erhalten, notfalls mit Gewalt, Täuschung und List. Moral ist der Politik nachgeordnet - der Zweck heiligt die Mittel, wenn der politische Zweck es erfordert.", "r": "Macht als Herrschaftsinstrument (Machiavelli)", "f": "Macht als kollektives Handeln (Hannah Arendt)", "rid": "term_macht_als_herrschaftsinstrument_machiavelli", "w": "Arendt sieht echte Macht als gewaltfrei und konsensbasiert.", "ws": "Macht als Herrschaftsinstrument (Machiavelli)"}, {"tf": "PP", "t": "… unterscheidet radikal zwischen Macht und Gewalt: Echte Macht entsteht nur durch das gemeinsame … von Menschen. Sie kann nicht von einer Einzelperson \"besessen\" werden. Gewalt ist das Gegenteil von Macht - sie wird eingesetzt, wenn Macht bereits zerfallen ist.", "r": "Macht als kollektives Handeln (Hannah Arendt)", "f": "Macht als Herrschaftsinstrument (Machiavelli)", "rid": "term_macht_als_kollektives_handeln_hannah_arendt", "w": "Arendt sieht echte Macht als gewaltfrei und konsensbasiert.", "ws": "Macht als Herrschaftsinstrument (Machiavelli)"}, {"tf": "ET", "t": "Eine … ist eine subjektive Überzeugung ohne gesicherte Begründung. Sie kann richtig sein, erhebt aber keinen Anspruch auf allgemeine Gültigkeit.", "r": "Meinung (doxa)", "f": "Wissen", "rid": "term_meinung_doxa", "w": "Wissen ist wahr und begründet; Meinung ist nur subjektiv akzeptiert.", "ws": "Meinung (doxa)"}, {"tf": "ET", "t": "… ist mehr als ein starkes Gefühl oder eine feste Überzeugung. Philosophisch setzt es drei Dinge voraus: Die Aussage muss wahr sein, man muss sie für wahr halten und man muss sie begründen können.", "r": "Wissen", "f": "Meinung (doxa)", "rid": "term_wissen", "w": "Wissen ist wahr und begründet; Meinung ist nur subjektiv akzeptiert.", "ws": "Meinung (doxa)"}, {"tf": "PP", "t": "Unveräußerliche Rechte, die jedem Menschen allein aufgrund seines Menschseins zustehen - unabhängig von Nationalität, Herkunft oder Geschlecht. Sie sind universell (für alle), unteilbar und unübertragbar.", "r": "Menschenrechte", "f": "Menschenwürde", "rid": "term_menschenrechte", "w": "Menschenwürde ist die philosophische Grundlage der Menschenrechte.", "ws": "Menschenrechte"}, {"tf": "EH", "t": "Jeder Mensch hat einen absoluten, unveräußerlichen Wert allein dadurch, dass er ein vernünftiges, freies Wesen ist.", "r": "Menschenwürde", "f": "Menschenrechte", "rid": "term_menschenwuerde", "w": "Menschenwürde ist die philosophische Grundlage der Menschenrechte.", "ws": "Menschenrechte"}, {"tf": "EH", "t": "Mit „…\" (moralischer Sinn) bezeichnet die schottische Moralphilosophie des 18. Jahrhunderts (Shaftesbury, Hutcheson, …) ein angeborenes Vermögen, gut und böse zu unterscheiden - analog zu den fünf Sinnen, mit denen wir Farben, Klänge oder Gerüche wahrnehmen.", "r": "Moral Sense", "f": "Sympathie", "rid": "term_moral_sense", "w": "Sympathie ist der konkrete Mechanismus des Moral Sense - durch Mitempfinden bilden wir moralische Urteile.", "ws": "Moral Sense"}, {"tf": "EH", "t": "… (von griech. syn-pathos = Mitempfinden) bezeichnet die Fähigkeit, die Gefühle und Lebensumstände anderer Menschen innerlich nachzuvollziehen. Bei … ist sie die psychologische Grundlage moralischer Urteile: Wir billigen Handlungen, weil wir mit den Betroffenen mitfühlen - nicht weil wir vernünftig schließen.", "r": "Sympathie", "f": "Moral Sense", "rid": "term_sympathie", "w": "Sympathie ist der konkrete Mechanismus des Moral Sense - durch Mitempfinden bilden wir moralische Urteile.", "ws": "Moral Sense"}, {"tf": "PP", "t": "Es gibt Rechte und Pflichten, die dem Menschen von Natur aus zukommen - unabhängig von … Recht. Diese Rechte sind unveräußerlich und gelten immer, auch wenn kein Gesetz sie kodifiziert.", "r": "Naturrecht", "f": "Positives Recht", "rid": "term_naturrecht", "w": "Positives Recht gilt, weil es korrekt erlassen wurde - unabhängig von seinem Inhalt. Naturrecht gilt, weil es moralisch richtig ist - unabhängig davon, ob es als Gesetz existiert. Die Radbruchsche Formel verbindet beide.", "ws": "Naturrecht"}, {"tf": "PP", "t": "Das von Menschen gesetzte, tatsächlich geltende Recht in einem Staat. Es gilt, weil es korrekt durch staatliche Verfahren gesetzt wurde - unabhängig davon, ob es moralisch gerecht ist.", "r": "Positives Recht", "f": "Naturrecht", "rid": "term_positives_recht", "w": "Positives Recht gilt, weil es korrekt erlassen wurde - unabhängig von seinem Inhalt. Naturrecht gilt, weil es moralisch richtig ist - unabhängig davon, ob es als Gesetz existiert. Die Radbruchsche Formel verbindet beide.", "ws": "Naturrecht"}, {"tf": "PP", "t": "Es gibt Rechte und Pflichten, die dem Menschen von Natur aus zukommen - unabhängig von positivem Recht. Diese Rechte sind unveräußerlich und gelten immer, auch wenn kein Gesetz sie kodifiziert.", "r": "Naturrecht", "f": "Rechtspositivismus", "rid": "term_naturrecht", "w": "Das Naturrecht macht Geltung von Gerechtigkeit abhängig.", "ws": "Rechtspositivismus"}, {"tf": "PP", "t": "Die Rechtstheorie, nach der Recht allein durch menschliche Setzung gilt: Ein Gesetz ist geltendes Recht, wenn es im vorgesehenen Verfahren erlassen wurde und im Großen und Ganzen befolgt wird, unabhängig davon, ob sein Inhalt gerecht ist.", "r": "Rechtspositivismus", "f": "Naturrecht", "rid": "term_rechtspositivismus", "w": "Das Naturrecht macht Geltung von Gerechtigkeit abhängig.", "ws": "Rechtspositivismus"}, {"tf": "EH", "t": "\"… von...\" - die Abwesenheit von Hindernissen, Zwang und Einschränkungen. Niemand hindert mich daran, X zu tun. Pressefreiheit = keine staatliche Zensur; Meinungsfreiheit = man darf seine Meinung sagen, ohne Strafe zu fürchten.", "r": "Negative Freiheit", "f": "Positive Freiheit", "rid": "term_negative_freiheit", "w": "Negative Freiheit bedeutet nur, dass kein äußeres Hindernis vorliegt - nicht, dass man die Mittel hat, X tatsächlich zu tun.", "ws": "Negative Freiheit"}, {"tf": "EH", "t": "\"… zu...\" - die tatsächliche Fähigkeit, eigene Ziele zu verfolgen und das Leben selbst zu gestalten. … setzt Mittel voraus, nicht nur Abwesenheit von Hindernissen. Ich bin frei, Geige zu lernen (kein Verbot) - aber ohne Instrument, Lehrer und Zeit fehlt mir die … dazu.", "r": "Positive Freiheit", "f": "Negative Freiheit", "rid": "term_positive_freiheit", "w": "Negative Freiheit bedeutet nur, dass kein äußeres Hindernis vorliegt - nicht, dass man die Mittel hat, X tatsächlich zu tun.", "ws": "Negative Freiheit"}, {"tf": "EH", "t": "… sind verbindliche Verhaltensregeln, die festlegen, was in einer Gesellschaft oder Gemeinschaft erlaubt, geboten oder verboten ist. Sie konkretisieren … in handlungsleitende Gebote.", "r": "Normen", "f": "Werte", "rid": "term_normen", "w": "Werte sind allgemeine Orientierungen; Normen sind konkrete Regeln.", "ws": "Normen"}, {"tf": "EH", "t": "… sind grundlegende Überzeugungen darüber, was gut, erstrebenswert oder wichtig ist - Freiheit, Gerechtigkeit, Solidarität. Sie leiten unser Handeln, ohne immer bewusst reflektiert zu werden.", "r": "Werte", "f": "Normen", "rid": "term_werte", "w": "Werte sind allgemeine Orientierungen; Normen sind konkrete Regeln.", "ws": "Normen"}, {"tf": "ET", "t": "Ein … ist bei … der gemeinsame Rahmen einer wissenschaftlichen Gemeinschaft: welche Fragen sinnvoll sind, welche Methoden gelten und was als Lösung zählt. Vorher streiten viele Schulen über Grundfragen, und jede beginnt von vorn, wie die Optik vor Newton.", "r": "Paradigma (Kuhn)", "f": "Theorie", "rid": "term_paradigma_kuhn", "w": "Ein Paradigma ist mehr als eine Theorie; es umfasst auch Werte, Musterbeispiele und die Praxis einer Gemeinschaft.", "ws": "Paradigma (Kuhn)"}, {"tf": "ET", "t": "Ein zusammenhängendes System von Aussagen, das Phänomene erklärt und Vorhersagen ermöglicht.", "r": "Theorie", "f": "Paradigma (Kuhn)", "rid": "term_theorie", "w": "Ein Paradigma ist mehr als eine Theorie; es umfasst auch Werte, Musterbeispiele und die Praxis einer Gemeinschaft.", "ws": "Paradigma (Kuhn)"}, {"tf": "EH", "t": "… verlagert den Fokus von Lust und Leid auf Interessen und Präferenzen: Moralisch richtig ist, was die Präferenzen aller leidensfähigen Wesen möglichst gut erfüllt. Nicht die Artzugehörigkeit, sondern die Leidensfähigkeit ist das moralisch relevante Kriterium.", "r": "Präferenzutilitarismus (Singer)", "f": "Qualitativer Utilitarismus (Mill)", "rid": "term_praeferenzutilitarismus_singer", "w": "Singer verlässt das Lust-Schmerz-Modell ganz und fokussiert auf Interessen.", "ws": "Qualitativer Utilitarismus (Mill)"}, {"tf": "EH", "t": "… übernimmt …, differenziert aber: Es gibt höhere (geistige) und niedere (körperliche) Freuden. Qualität, nicht nur Quantität der Lust zählt. Die einzige Möglichkeit, die Qualität von Freuden zu beurteilen: Menschen, die beide kennen, bevorzugen geistige Freuden.", "r": "Qualitativer Utilitarismus (Mill)", "f": "Präferenzutilitarismus (Singer)", "rid": "term_qualitativer_utilitarismus_mill", "w": "Singer verlässt das Lust-Schmerz-Modell ganz und fokussiert auf Interessen.", "ws": "Qualitativer Utilitarismus (Mill)"}, {"tf": "ET", "t": "Eine Lehre, die als … auftritt, ihre Kriterien aber nicht erfüllt. Für … ist sie so formuliert, dass keine Beobachtung sie widerlegen kann, oder sie rettet sich nach jedem Fehlschlag mit einer Ad-hoc-Hypothese.", "r": "Pseudowissenschaft", "f": "Wissenschaft", "rid": "term_pseudowissenschaft", "w": "Wissenschaft macht riskante, prüfbare Vorhersagen; Pseudowissenschaft immunisiert sich gegen Widerlegung.", "ws": "Pseudowissenschaft"}, {"tf": "ET", "t": "Ein systematisches, methodisch kontrolliertes Verfahren zur Gewinnung, Prüfung und Ordnung von Wissen über die Wirklichkeit.", "r": "Wissenschaft", "f": "Pseudowissenschaft", "rid": "term_wissenschaft", "w": "Wissenschaft macht riskante, prüfbare Vorhersagen; Pseudowissenschaft immunisiert sich gegen Widerlegung.", "ws": "Pseudowissenschaft"}, {"tf": "PP", "t": "… Kernsatz: Wenn Positives Recht so unerträglich ungerecht ist, dass es die Menschenwürde verletzt, verliert es seine rechtliche Verbindlichkeit. Die … verbindet Legalität mit Legitimität und war Grundlage für die Nürnberger Prozesse: NS-Täter konnten sich nicht auf \"Ich habe nur Befehle befolgt\" berufen.", "r": "Radbruchsche Formel", "f": "Rechtspositivismus", "rid": "term_radbruchsche_formel", "w": "Dieser lehnt moralische Kriterien für Rechtsgeltung ab.", "ws": "Radbruchsche Formel"}, {"tf": "PP", "t": "Die Rechtstheorie, nach der Recht allein durch menschliche Setzung gilt: Ein Gesetz ist geltendes Recht, wenn es im vorgesehenen Verfahren erlassen wurde und im Großen und Ganzen befolgt wird, unabhängig davon, ob sein Inhalt gerecht ist.", "r": "Rechtspositivismus", "f": "Radbruchsche Formel", "rid": "term_rechtspositivismus", "w": "Dieser lehnt moralische Kriterien für Rechtsgeltung ab.", "ws": "Radbruchsche Formel"}, {"tf": "PP", "t": "Die Pflicht, geltende Gesetze zu befolgen, auch solche, die man selbst für falsch hält. Strittig ist, ob es dafür über die Strafandrohung hinaus eine moralische Pflicht gibt.", "r": "Rechtsgehorsam", "f": "Widerstandsrecht", "rid": "term_rechtsgehorsam", "w": "Wo Auswanderung verboten ist, trägt das Zustimmungsargument aus Platons Kriton nicht mehr - die Pflicht zum Gehorsam entfällt.", "ws": "Widerstandsrecht"}, {"tf": "PP", "t": "Das Recht der Bürger, sich gegen eine tyrannische Herrschaft zur Wehr zu setzen - nach Liberaler Staat auch mit Gewalt, wenn alle anderen Mittel versagen. Wenn der Staat Naturrecht systematisch verletzt, verliert er seine Legitimität - und das Volk erhält das Recht zum Widerstand.", "r": "Widerstandsrecht", "f": "Rechtsgehorsam", "rid": "term_widerstandsrecht", "w": "Wo Auswanderung verboten ist, trägt das Zustimmungsargument aus Platons Kriton nicht mehr - die Pflicht zum Gehorsam entfällt.", "ws": "Widerstandsrecht"}, {"tf": "PP", "t": "Die Pflicht, geltende Gesetze zu befolgen, auch solche, die man selbst für falsch hält. Strittig ist, ob es dafür über die Strafandrohung hinaus eine moralische Pflicht gibt.", "r": "Rechtsgehorsam", "f": "Ziviler Ungehorsam", "rid": "term_rechtsgehorsam", "w": "Thoreau stellt das Gewissen über das Gesetz; Rawls erlaubt den Gesetzesbruch in engen Grenzen.", "ws": "Rechtsgehorsam"}, {"tf": "PP", "t": "Die bewusste, öffentliche, gewaltfreie Verletzung von Gesetzen, um auf eine als ungerecht empfundene Ordnung aufmerksam zu machen. Der Handelnde übernimmt die Konsequenzen (Strafe), um die Legitimität seines Protests zu unterstreichen.", "r": "Ziviler Ungehorsam", "f": "Rechtsgehorsam", "rid": "term_ziviler_ungehorsam", "w": "Thoreau stellt das Gewissen über das Gesetz; Rawls erlaubt den Gesetzesbruch in engen Grenzen.", "ws": "Rechtsgehorsam"}, {"tf": "ET", "t": "Der … bezweifelt grundsätzlich, ob sicheres Wissen möglich ist. Statt Urteile zu fällen, empfehlen radikale … die Epoché (Urteilsenthaltung) - das vollständige Zurückhalten aller Urteile.", "r": "Skeptizismus", "f": "Zweifel", "rid": "term_skeptizismus", "w": "Der Skeptiker zweifelt dauerhaft und zieht keine Gewissheit daraus. Descartes nutzt den methodischen Zweifel vorübergehend, um zum Cogito ergo sum zu gelangen.", "ws": "Zweifel"}, {"tf": "ET", "t": "… bedeutet, Überzeugungen aktiv in Frage zu stellen. In der Philosophie ist … kein Zeichen von Schwäche, sondern oft der Anfang echter Erkenntnis.", "r": "Zweifel", "f": "Skeptizismus", "rid": "term_zweifel", "w": "Der Skeptiker zweifelt dauerhaft und zieht keine Gewissheit daraus. Descartes nutzt den methodischen Zweifel vorübergehend, um zum Cogito ergo sum zu gelangen.", "ws": "Zweifel"}, {"tf": "ET", "t": "… Schlüsselidee: Es gibt …, die zugleich erfahrungsunabhängig (A priori / A posteriori) und erkenntniserweiternd sind. Beispiel: \"Alles, was geschieht, hat eine Ursache.\" - gilt notwendig, lässt sich aber nicht allein durch Begriffsanalyse, sondern nur durch apriorische Verstandesstrukturen (Kategorien des Verstandes) rechtfertigen.", "r": "Synthetische Urteile a priori", "f": "Synthetisches Urteil", "rid": "term_synthetische_urteile_a_priori", "w": "Diese sind synthetisch und dennoch notwendig - Kants wichtigste Entdeckung.", "ws": "Synthetisches Urteil"}, {"tf": "ET", "t": "Ein …, das über den Subjektbegriff hinausgeht und echte neue Information liefert.", "r": "Synthetisches Urteil", "f": "Synthetische Urteile a priori", "rid": "term_synthetisches_urteil", "w": "Diese sind synthetisch und dennoch notwendig - Kants wichtigste Entdeckung.", "ws": "Synthetisches Urteil"}, {"tf": "AN", "t": "Ursprünglich (griech. téchne) Bezeichnung für ein überliefertes, lehrund lernbares Können oder Wissen, das auf Herstellung oder Beherrschung ausgerichtet ist.", "r": "Technik", "f": "Technologie", "rid": "term_technik", "w": "Technik bezeichnet das einzelne Mittel; Technologie das Gesamtsystem moderner Technik.", "ws": "Technik"}, {"tf": "AN", "t": "Gemeint ist nicht das einzelne Werkzeug, sondern das Gesamtsystem moderner, wissenschaftsbasierter … (Maschinen, Computer, Netze, Biotechnik), das alle Lebensbereiche durchdringt.", "r": "Technologie", "f": "Technik", "rid": "term_technologie", "w": "Technik bezeichnet das einzelne Mittel; Technologie das Gesamtsystem moderner Technik.", "ws": "Technik"}, {"tf": "EH", "t": "Nicht \"Was soll ich tun?\", sondern \"Was für ein Mensch soll ich sein?\" ist die zentrale Frage. Tugenden sind Charaktereigenschaften wie Mut, Gerechtigkeit, Klugheit - sie entstehen durch Übung und Gewohnheit, nicht durch einmaliges Nachdenken.", "r": "Tugendethik", "f": "Utilitarismus", "rid": "term_tugendethik", "w": "Dieser fragt nach den Konsequenzen, nicht nach dem Charakter.", "ws": "Tugendethik"}, {"tf": "EH", "t": "Der … ist eine Konsequentialismus Ethik: Eine Handlung ist genau dann richtig, wenn ihre Folgen das Wohlergehen aller Betroffenen maximieren. Alle Betroffenen zählen gleich - Eigeninteresse genießt keinen Vorrang.", "r": "Utilitarismus", "f": "Tugendethik", "rid": "term_utilitarismus", "w": "Dieser fragt nach den Konsequenzen, nicht nach dem Charakter.", "ws": "Tugendethik"}, {"tf": "PP", "t": "(Frz.) \"Wille aller\" - in … Politische Philosophie die bloße Summe prinzipiell isolierter Einzelwillen. Jeder Bürger folgt dabei seinem Privatinteresse; das Ergebnis ist eine Addition, kein echter Gemeinwille.", "r": "Volonté de tous", "f": "Volonté générale", "rid": "term_volont_de_tous", "w": "Der Gemeinwille richtet sich auf das Gemeinwohl; der Gesamtwille bleibt beim Privatinteresse.", "ws": "Volonté de tous"}, {"tf": "PP", "t": "(Frz.) \"Allgemeinwille\" - … Begriff für den auf das Gemeinwohl ausgerichteten Willen aller Bürger. Er ist nicht die bloße Summe der Einzelwillen, sondern der vernünftige Wille, der das Interesse aller als Ganzes im Blick hat.", "r": "Volonté générale", "f": "Volonté de tous", "rid": "term_volont_g_n_rale", "w": "Der Gemeinwille richtet sich auf das Gemeinwohl; der Gesamtwille bleibt beim Privatinteresse.", "ws": "Volonté de tous"}, {"tf": "PP", "t": "Das Recht der Bürger, sich gegen eine tyrannische Herrschaft zur Wehr zu setzen - nach Liberaler Staat auch mit Gewalt, wenn alle anderen Mittel versagen. Wenn der Staat Naturrecht systematisch verletzt, verliert er seine Legitimität - und das Volk erhält das Recht zum Widerstand.", "r": "Widerstandsrecht", "f": "Ziviler Ungehorsam", "rid": "term_widerstandsrecht", "w": "Ziviler Ungehorsam ist gewaltfrei und innerhalb der Ordnung; Widerstandsrecht kann auch Gewalt rechtfertigen.", "ws": "Widerstandsrecht"}, {"tf": "PP", "t": "Die bewusste, öffentliche, gewaltfreie Verletzung von Gesetzen, um auf eine als ungerecht empfundene Ordnung aufmerksam zu machen. Der Handelnde übernimmt die Konsequenzen (Strafe), um die Legitimität seines Protests zu unterstreichen.", "r": "Ziviler Ungehorsam", "f": "Widerstandsrecht", "rid": "term_ziviler_ungehorsam", "w": "Ziviler Ungehorsam ist gewaltfrei und innerhalb der Ordnung; Widerstandsrecht kann auch Gewalt rechtfertigen.", "ws": "Widerstandsrecht"}], "pos": [{"tf": "ET", "n": "Aristoteles", "topic": "wahrheit", "tn": "Wahrheitstheorien", "lf": "Was macht eine Aussage wahr?", "opts": ["Korrespondenztheorie", "Kohärenztheorie", "Konsenstheorie"], "i": 0, "m": "Eine Aussage ist wahr, wenn sie mit der Wirklichkeit übereinstimmt."}, {"tf": "ET", "n": "Thomas von Aquin", "topic": "wahrheit     var h='<div class="st-lead"><p>Kurze Runden mit je zehn Fragen, gemischt aus den Philosophen, Begriffen und Vergleichen dieser Webseite. Jede Runde ist anders.</p>'+
      '<p class="st-note"><b>Philosophie 2:</b> Nicht alle Personen und Begriffe kommen bei euch vor. Was ihr nicht hattet, überspringt ihr mit „Hatten wir nicht“.</p></div>';
    h+='<p class="qz-h">Was willst du üben?</p><div class="qz-modes">';
    Object.keys(MODES).forEach(function(k){var m=MODES[k];
      h+='<button type="button" class="st-card qz-mode" data-m="'+k+'" aria-pressed="'+(k===M)+'"><span class="ey">'+m.ey+'</span><h3>'+m.t+'</h3><p>'+m.p+'</p></button>';});
    h+='</div><p class="qz-h">Themenfeld</p><div class="qz-tf" role="group" aria-label="Themenfeld">'+
      '<button type="button" data-f="alle" aria-pressed="'+(F==='alle')+'">Alle</button>';
    ['ET','EH','PP','AN'].forEach(function(c){h+='<button type="button" data-f="'+c+'" style="--c:'+tfVar(c)+'" aria-pressed="'+(F===c)+'">'+TFN[c][0]+'</button>';});
    h+='</div><div class="st-btns"><button type="button" class="st-btn" id="qzGo">Runde starten</button></div>';
    app.innerHTML=h;
    app.querySelectorAll('.qz-mode').forEach(function(b){b.addEventListener('click',function(){M=b.dataset.m;ls('philo-qz-mode',M);overview();var nb=app.querySelector('.qz-mode[data-m="'+M+'"]');if(nb)nb.focus();});});
    app.querySelectorAll('.qz-tf button').forEach(function(b){b.addEventListener('click',function(){F=b.dataset.f;ls('philo-qz-tf',F);overview();var nb=app.querySelector('.qz-tf button[data-f="'+F+'"]');if(nb)nb.focus();});});
    document.getElementById('qzGo').addEventListener('click',function(){start();});
  }

  /* ---------- Fragen bauen ---------- */
  function pick(arr,n,not){var r=[];shuffle(arr).forEach(function(x){if(r.length<n&&not.indexOf(x)<0&&r.indexOf(x)<0)r.push(x);});return r;}
  function make(m,x){
    if(m==='wer'){
      var andere=pick(x.nah.filter(function(n){return (D.namen[x.tf]||[]).indexOf(n)>=0;}),2,[x.n]);
      andere=andere.concat(pick(D.namen[x.tf]||[],3-andere.length,[x.n].concat(andere)));
      var opts=shuffle([[x.n,1]].concat(andere.map(function(n){return [n,0];})));
      return {tf:x.tf,kind:x.art,q:'<p class="qz-quote">'+esc(x.t)+'</p>',f:'Von wem stammt dieser Gedanke?',opts:opts,
        fb:'<p><b>'+esc(x.n)+'</b>'+(x.d?' ('+esc(x.d)+')':'')+(x.s?', '+esc(x.s):'')+'</p>',
        link:['philosophen.html#'+encodeURIComponent(x.n),'Zur Karte von '+x.n]};
    }
    if(m==='paar'){
      return {tf:x.tf,kind:'Begriffspaar',q:'<p class="qz-def">'+esc(x.t)+'</p>',f:'Welcher Begriff ist hier erklärt?',
        opts:shuffle([[x.r,1],[x.f,0]]),
        fb:(x.w?'<p><b>Der Unterschied:</b> '+esc(x.w)+'</p><p class="qz-ab">Aus der Abgrenzung bei „'+esc(x.ws)+'“</p>':''),
        link:['begriffe.html#'+x.rid,'„'+x.r+'“ im Glossar']};
    }
    var idx=[x.i].concat(pick(x.opts.map(function(o,i){return i;}),3,[x.i]));
    return {tf:x.tf,kind:'Vergleich: '+x.tn,q:'',f:'Welche Position vertritt '+x.n+' im Vergleich „'+x.tn+'“?',
      opts:shuffle(idx.map(function(i){return [x.opts[i],i===x.i?1:0];})),
      fb:(x.m?'<p><b>Merksatz der Position:</b> '+esc(x.m)+'</p>':'')+(x.lf?'<p class="qz-ab">Leitfrage: '+esc(x.lf)+'</p>':''),
      link:['vergleiche.html?id='+encodeURIComponent(x.topic),'Zum Vergleich']};
  }

  /* ---------- Runde ---------- */
  var S=null;
  function start(list){
    var src=list||pool(M);
    if(!src.length){app.innerHTML='<div class="st-lead"><p>Keine Treffer. Stell das Themenfeld auf Alle oder wähl einen anderen Modus.</p></div><div class="st-btns"><button type="button" class="st-btn" id="qzAll">Quiz-Auswahl</button></div>';document.getElementById('qzAll').addEventListener('click',overview);return;}
    var items=list?src:shuffle(src).slice(0,N);
    if(!list){ /* jedes Begriffspaar, jede Erklärung und jeder Name nur einmal pro Runde */
      var seen={},r=[];shuffle(src).forEach(function(x){
        var ks=M==='paar'?[[x.r,x.f].sort().join('|'),x.r]:M==='wer'?[x.n]:[x.n+'|'+x.topic];
        if(r.length<N&&!ks.some(function(k){return seen[k];})){ks.forEach(function(k){seen[k]=1;});r.push(x);}});
      if(M!=='paar')shuffle(src).forEach(function(x){if(r.length<N&&r.indexOf(x)<0)r.push(x);});
      items=r;}
    S={m:M,items:items,qs:items.map(function(x){return make(M,x);}),pos:0,res:[]};
    document.body.classList.add('st-run');question();window.scrollTo({top:0,behavior:'smooth'});
  }
  function prog(){return '<div class="st-prog">'+S.qs.map(function(q,p){var r=S.res[p];
    return '<i class="'+(r===true?'ok':r===false?'no':r==='skip'?'open':(p===S.pos?'now':''))+'"></i>';}).join('')+'</div>';}
  function head(){
    return '<div class="st-top"><button type="button" class="st-back" id="qzBack">Quiz-Auswahl</button><span class="st-kchip">'+MODES[S.m].t+'</span></div>';
  }
  function question(){
    var q=S.qs[S.pos];S.answered=false;
    var h=head()+prog()+'<div class="st-q" style="--tf:'+tfVar(q.tf)+'"><div class="st-qhead"><span class="ey">'+esc(TFN[q.tf][0])+' · '+esc(q.kind)+'</span></div><div style="height:10px"></div><div class="qz-ask" id="qzAsk" tabindex="-1">'+
      q.q+'<p class="st-f">'+esc(q.f)+'</p></div><div class="st-opts" role="group" aria-label="Antworten">'+
      q.opts.map(function(o,i){return '<button type="button" class="st-opt" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+esc(o[0])+'</span></button>';}).join('')+
      '</div><button type="button" class="qz-skip" id="qzSkip">Hatten wir nicht</button><div id="qzFb" role="status" aria-live="polite"></div><div id="qzAfter"></div></div>';
    app.innerHTML=h;
    var ask=document.getElementById('qzAsk');if(ask)ask.focus({preventScroll:true});
    document.getElementById('qzBack').addEventListener('click',overview);
    document.getElementById('qzSkip').addEventListener('click',function(){if(S.answered)return;S.res[S.pos]='skip';next();});
    var btns=[].slice.call(app.querySelectorAll('.st-opt'));
    btns.forEach(function(b){b.addEventListener('click',function(){answer(+b.dataset.i);});});
    function answer(i){
      if(S.answered)return;S.answered=true;
      var right=q.opts[i][1]===1;S.res[S.pos]=right;
      btns.forEach(function(b,j){b.disabled=true;if(q.opts[j][1]===1)b.classList.add('ok');else if(j===i)b.classList.add('trap');else b.classList.add('dim');
        var z=[];if(j===i)z.push('deine Antwort');if(q.opts[j][1]===1)z.push('richtige Antwort');
        if(z.length)b.insertAdjacentHTML('beforeend','<span class="sr-only">, '+z.join(', ')+'</span>');});
      document.getElementById('qzSkip').hidden=true;
      var fb='<div class="st-fb'+(right?' ok':'')+'"><span class="v">'+(right?'Richtig.':'Nicht ganz.')+'</span>'+q.fb+
        '<a class="qz-link" href="'+q.link[0]+'" target="_blank" rel="noopener">'+esc(q.link[1])+'</a></div>';
      document.getElementById('qzFb').innerHTML=fb;
      document.getElementById('qzAfter').innerHTML='<div class="st-btns"><button type="button" class="st-btn" id="qzNext">'+(S.pos+1<S.qs.length?'Weiter':'Auswertung')+'</button></div>';
      app.querySelector('.st-prog').outerHTML=prog();
      var n=document.getElementById('qzNext');n.addEventListener('click',next);n.focus({preventScroll:true});
      var r=n.getBoundingClientRect();if(r.bottom>window.innerHeight-20)n.scrollIntoView({behavior:'smooth',block:'end'});
    }
    S.answer=answer;S.count=q.opts.length;
  }
  function next(){S.pos++;if(S.pos<S.qs.length){question();window.scrollTo({top:0,behavior:'smooth'});}else end();}
  function end(){
    var miss=[],scored=0,right=0,links=[],seen={};
    S.res.forEach(function(r,p){if(r==='skip')return;scored++;if(r===true)right++;else{miss.push(S.items[p]);var l=S.qs[p].link;if(l&&!seen[l[0]]){seen[l[0]]=1;links.push(l);}}});
    var msg=!scored?['Alles übersprungen.','Wähl ein anderes Themenfeld oder einen anderen Modus.']:
      !miss.length?['Alles sicher.','Starte eine neue Runde, die Fragen sind jedes Mal anders gemischt.']:
      right/scored>=.7?['Fast alles sicher.','Schau dir die verpassten Fragen noch einmal an.']:
      ['Da lohnt sich ein zweiter Blick.','Lies auf den verlinkten Seiten nach und versuch es dann noch einmal.'];
    var h=head()+'<div class="st-end"><h2>'+msg[0]+'</h2><p>'+msg[1]+'</p><div class="st-dots">'+
      S.res.map(function(r){return '<i class="'+(r===true?'':r==='skip'?'open':'no')+'"></i>';}).join('')+'</div>'+
      '<div class="st-legend"><span style="--c:var(--st-ok)">sicher</span><span style="--c:var(--st-trap)">verpasst</span>'+(scored<S.res.length?'<span style="--c:var(--st-amber)">übersprungen</span>':'')+'</div>'+
      (links.length?'<p style="margin-top:16px"><b>Auf der Webseite noch einmal nachlesen:</b></p><ul class="qz-nach">'+links.map(function(l){return '<li><a class="qz-link" href="'+l[0]+'" target="_blank" rel="noopener">'+esc(l[1])+'</a></li>';}).join('')+'</ul>':'')+
      '<div class="st-btns">'+(miss.length?'<button type="button" class="st-btn" id="qzMiss">Verpasste wiederholen</button>':'')+
      '<button type="button" class="st-btn'+(miss.length?' ghost':'')+'" id="qzAgain">Neue Runde</button><button type="button" class="st-btn ghost" id="qzAll">Quiz-Auswahl</button></div></div>';
    app.innerHTML=h;S.answer=null;
    var eh=app.querySelector('.st-end h2');if(eh){eh.setAttribute('tabindex','-1');eh.focus({preventScroll:true});}
    document.getElementById('qzBack').addEventListener('click',overview);
    if(miss.length)document.getElementById('qzMiss').addEventListener('click',function(){start(shuffle(miss));});
    document.getElementById('qzAgain').addEventListener('click',function(){start();});
    document.getElementById('qzAll').addEventListener('click',overview);
  }
  document.addEventListener('keydown',function(e){
    if(!S||!S.answer||S.answered||e.metaKey||e.ctrlKey||e.altKey)return;
    var k=e.key.toUpperCase(),i='ABCD'.indexOf(k);if(i<0)i='1234'.indexOf(k);
    if(i>=0&&i<S.count){e.preventDefault();S.answer(i);}
  });
  overview();
})();
</script>
